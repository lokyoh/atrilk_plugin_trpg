  aliases: [苔原, 冰原, 雪原, 极地荒原, polar]
  max_pace: 快速
  pace_note: 要在极地保持快速步调，适当的装备（如滑雪板）不可或缺
  encounter_dice: 6d6
  encounter_mult: 10
  encounter_display: 6d6 × 10 尺
  forage_dc: 20
  navigation_dc: 10
  search_dc: 10
- cn: 海岸
