# 《城主指南 (2024)》第二章「旅行」明文数值（参考 md L1220-1418）
#
# 一张分段表装下：11 种地形 × 5 列、步调修正、天气、声音传播、能见度、
# 觅食 / 导航 / 追踪常量、旅程阶段四步与挑战清单。
# 数值一律从这里取，别写回 .py（有测试拦）。
#
# ⚠️ **步调本身的英里数不在这里**：唯一真相是 core/dnd/environment.py 的
#    TRAVEL_PACE（慢速 18 / 普通 24 / 快速 30 里每天，8 小时一天）与
#    forced_march_exhaustion（超 8 小时每小时 DC 10+N）。复制一份会造成两处真相。
# ⚠️ 原文用词不统一：地形表写「缓速 / 普通 / 快速」，步调小节写「慢速 / 中速 /
#    快速」。这里按地形表原样存 max_pace，由 journey.normalize_pace 归一到
#    environment 的 slow / normal / fast。
# ⚠️ 「水路」的 max_pace 是「特殊」：原文说乘载具时按载具速度、不选旅行步调，
#    所以这一行没有步调上限，DC 三列照旧有效。
# ⚠️ 天气表 15-17 档的「风势」原文印作「光线」，疑为「轻风」误植；
#    这里保留原文词并在 note 里标明，不擅自改规则。

terrain:
