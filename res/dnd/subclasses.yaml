# 子职表（PHB 2024 第三章，12 职业 × 4 = 48 个）
# 来源：5etools-cn-cn2.0 class-*.json（source == XPHB）。
# 2024 起**所有职业都在 3 级**获得子职，特性落在 3 / 6 / 10 / 14 级（游荡者、武僧等另有 9 / 13 / 17 级档）。
# desc 是子职总述；features 按等级排列，text 为效果原文（超长的做了截断）。
- key: barbarian-berserker
  cn: 狂战士道途
  short: 狂战士
  en: berserker
  profession: barbarian
  desc: 以心头强烈的愤怒进入狂暴 那些踏上狂战士道途的野蛮人以暴力的方式直接诠释狂暴。狂战士之道代表着不受约束的狂怒，他们于混乱的战斗中兴奋忘我，将自身完全交托于狂暴操控。
  features:
  - level: 3
    name: 狂怒
    # 「每回合首次命中的额外伤害」：骰子写 rage = 取「狂暴伤害」个 d6，
    # 伤害类型同武器；四个前置条件一个都不能少（狂暴 + 本回合鲁莽 + 用力量 + 近战）。
    first_hit:
      dice: rage
      kind: 同武器
      needs: [rage, reckless, strength, melee]
    text: 狂暴激活期间，在你使用鲁莽攻击的回合中，你基于力量的攻击首次命中时，对目标造成额外伤害。投掷等于你狂暴伤害加值数量的d6，将它们相加，即是你造成的额外伤害。额外伤害类型与此次攻击所使用的武器或徒手打击造成的伤害类型相同。
  - level: 6
    name: 无我狂暴
    text: 狂暴激活期间，你具有魅惑与恐慌状态的免疫。当你进入狂暴时，若你已陷入魅惑或恐慌，你陷入的这些状态立即结束。
  - level: 10
    name: 报偿
    text: 当一名位于你 5 尺内的生物对你造成伤害时，你能够以反应使用武器或徒手打击对其发动一次近战攻击。
  - level: 14
    name: 威慑之姿
    text: 以一个附赠动作，你可以用你那令人魂消胆丧的面相，在原初之力的辅助下将恐惧打入他者内心。当你如此做时，每个位于以你为源点的 30 尺光环区域内你所选择的生物必须进行一次感知豁免检定（8 + 你的力量调整值 + 你的熟练加值）。豁免失败则陷入恐慌状态，持续 1 分钟。陷入恐慌的生物在其每个回合结束时重复豁免，成功则终止其身上的该效应。 此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗一次狂暴使用次数（无需动作）来重置此特性的使用权。
- key: barbarian-wild-heart
  cn: 兽心道途
  short: 兽心
  en: wild-heart
  profession: barbarian
  desc: 与动物世界一同漫步 跟随兽心道途的野蛮人将自身视作动物们的家人。他们学习与动物交流的魔法手段，他们的狂暴赋予他们超自然的力量来增强与动物们的联系。
  features:
  - level: 3
    name: 动物交谈
    text: 你可以施展法术野兽感官与动物交谈，仅限仪式施展。感知是你这些法术的施法属性。
  - level: 3
    name: 兽性狂暴
    text: 你的狂暴解放来自动物的原初之力。每当你激活狂暴时，你从下列选项中选择一项。 熊： 狂暴激活期间，你具有除力场、心灵、暗蚀、光耀外所有伤害类型的抗性。 鹰： 当你激活狂暴时，作为你进入狂暴的附赠动作的一部分，你可以同时执行撤离与疾走动作。狂暴激活期间，你也能够以一个附赠动作同时执行这两个动作。 狼： 狂暴激活期间，你的盟友对位于你 5 尺内的敌人进行的攻击检定具有优势。
  - level: 6
    name: 兽之形貌
    text: 你从下列选项中自选一项能力获得。当你完成一次长休时，你可以改变你的选择。 枭： 你具有 60 尺黑暗视觉。如果你已经具有黑暗视觉，你的黑暗视觉范围增加 60 尺。 豹： 你具有等于你速度的攀爬速度。 鲑： 你具有等于你速度的游泳速度。
  - level: 10
    name: 自然语者
    text: 你可以施展法术问道自然，仅限仪式施展。感知是你该法术的施法属性。
  - level: 14
    name: 兽力威能
    text: 每当你激活狂暴时，你从下列选项中选择一项。 猎鹰： 狂暴激活期间，只要你没有着装任何护甲，你就具有等于你速度的飞行速度。 雄狮： 狂暴激活期间，任何位于你 5 尺内的敌人不以你（或另一个选择该项能力的野蛮人）为目标的攻击检定具有劣势。 角羊： 狂暴激活期间，当你的近战攻击命中一名体型不超过大型的生物时，你可以令其陷入倒地状态。
- key: barbarian-world-tree
  cn: 世界树道途
  short: 世界树
  en: world-tree
  profession: barbarian
  desc: 追寻多元宇宙的根系和枝杈 追随世界树道途的野蛮人以狂暴的力量与宇宙之树尤格德拉希尔连接。尤格德拉希尔在外层位面中生长，将每个外层位面与物质位面一一相连。世界树道途的野蛮人利用树的魔力来保持活力，并将其作为次元旅行的手段。
  features:
  - level: 3
    name: 圣树活力
    text: 你的狂暴浸润着世界树的生命力。你获得以下增益： 活力之涌： 当你激活狂暴时，你获得等于你野蛮人等级的临时生命值。 赐命之源： 你的狂暴激活期间，在你的每个回合开始时，你可以赋予位于你 10 尺内的另一名生物临时生命值。投掷等于你狂暴伤害加值数量的d6，将它们相加，即是该生物获得的临时生命值。当你的狂暴结束时，剩余的临时生命值将会消失。
  - level: 6
    name: 灵树枝杈
    text: 你的狂暴激活期间，每当你可见的位于你 30 尺内的生物的回合开始时，你能够以反应在其周围召唤世界树的灵体枝条。目标必须成功通过一次力量豁免（8 + 你的力量调整值 + 你的熟练加值），否则将被传送到位于你5尺内的你可见的未占据空间内或距离你最近的你可见的未占据空间内。目标被你传送后，你可以令其速度降为 0，持续至当前回合结束。
  - level: 10
    name: 根击千钧
    text: 世界树的卷须将你的武器延长。你的回合内，你持用的任何具有重型或多用词条的近战武器的触及增加 10 尺。当你在你的回合内以该武器命中时，除了激活这把武器本身具有的其他精通词条外，你还可以激活推离或失衡精通词条。
  - level: 14
    name: 世界树之奇旅
    text: 当你激活狂暴时，你可以传送至多 60 尺的距离，到一处你可见的未占据空间中。在你的狂暴激活期间，你也能够以一个附赠动作来进行传送。 此外，每次狂暴期间仅一次，你可以使传送的距离提升至 150 尺，并可以选择带上至多 6 个位于你 10 尺内的自愿生物同你一起传送。每个其他生物都将被传送至位于你目的地 10 尺内的你选择的未占据空间中。
- key: barbarian-zealot
  cn: 狂热者道途
  short: 狂热者
  en: zealot
  profession: barbarian
  desc: 与神结合的至高愉悦狂暴体验 走上狂热者道途的野蛮人会得到某个神明或某个神系的恩惠。这些野蛮人将他们的狂暴视为神圣结合的至高愉悦，并借此获得力量。狂热者野蛮人常是他们的神明或神系座下牧师或信者的盟友。
  features:
  - level: 3
    name: 神性之怒
    # 骰式 = 1d6 + 等级的一半（向下取整）；光耀 / 暗蚀由玩家每次选，引擎默认光耀。
    first_hit:
      dice: 1d6
      plus: level/2
      kind: 光耀或暗蚀
      needs: [rage]
    text: 你可以引导神性的怒火，将其注入打击之中。你的狂暴激活期间，你的每个回合中你首次以武器或徒手打击命中的生物将受到等于1d6 + 你野蛮人等级的一半（向下取整）的额外伤害。额外伤害的伤害类型为光耀或暗蚀，在每次造成伤害时由你选择伤害类型。
  - level: 3
    name: 神之勇者
    text: 某个神圣实体对你施以援手以确保你总能继续战斗。你获得一个有着 4 枚d12的治疗池，你可以用其中的骰子治愈自身。以一个附赠动作，你可以消耗治疗池中任意枚骰子来恢复你的生命值。投掷所有你消耗的骰子，将它们相加，即是你以此恢复的生命值。 当你完成一次长休时，你的治疗池重获所有已消耗的骰子。 治疗池中骰子的最大数量将会在你到达特定野蛮人等级时增加，分别为 6 级时增加至 5 枚，12 级时增加至 6 枚，17 级时增加至 7 枚。
  - level: 6
    name: 专心炽志
    text: 每次狂暴期间仅一次，若你失败于某次豁免检定，你可以重骰这次检定并在检定中获得等于你的狂暴伤害加值的加值，你必须使用重骰后的结果。
  - level: 10
    name: 狂热威仪
    text: 以一个附赠动作，你以满腔神圣能量发出战吼。选择至多十名位于你 60 尺内的生物，直至你的下个回合开始，他们的攻击检定和豁免检定具有优势。 此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗一次狂暴使用次数（无需动作）来重置此特性的使用权。
  - level: 14
    name: 神之狂暴
    text: 当你激活狂暴时，你可以呈现出圣斗士姿态。圣斗士姿态持续1分钟，且在你生命值降至0时提前结束。此特性一经使用，直至完成长休你都无法再次使用。 处于圣斗士姿态期间，你获得以下增益。 飞翔： 你具有等于你速度的飞行速度，并且可以悬浮。 抗性： 你具有对暗蚀、心灵和光耀伤害的抗性。 回春： 当位于你30尺内的一名生物的生命值将要降至0时，你能够以反应消耗一次狂暴使用次数，令目标的生命值变为等于你野蛮人等级的值。
- key: bard-dance
  cn: 舞蹈学院
  short: 舞蹈
  en: dance
  profession: bard
  desc: 舞步节律谐宇宙 舞蹈学院的吟游诗人们明白，创生圣言不在演讲或歌唱之中，圣言自天体运动中发出，经芥子虫蠕而流淌。舞蹈学院的诗人们练习同旋转的宇宙谐频共振的手段，他们注重灵巧、速度却又不失优雅。
  features:
  - level: 3
    name: 灵巧打击
    text: 当你在一次动作、附赠动作或反应中消耗了诗人激励使用次数时，作为该动作、附赠动作或反应的一部分，你可以发动一次徒手打击。
  - level: 3
    name: 诗人痛击
    text: 你可以用敏捷代替力量进行徒手打击的攻击检定。当你以一次徒手打击造成伤害时，你可以造成等于诗人激励骰 + 敏捷调整值的钝击伤害，而非徒手打击原本的伤害。此效果并不会消耗你的诗人激励使用次数。
  - level: 3
    name: 大舞蹈家
    text: 你进行的任何有关舞蹈的魅力（表演）检定均具有优势。
  - level: 3
    name: 炫目舞步
    text: 未着装护甲且未持用盾牌期间，你获得以下增益：
  - level: 3
    name: 无甲防御
    text: 你的基础护甲等级等于 10 + 你的敏捷调整值 + 你的魅力调整值。
  - level: 6
    name: 鼓舞之移
    text: 当一名你可见的敌人位于你 5 尺内结束它的回合时，你能够以反应消耗一次诗人激励使用次数，移动至多等于你速度一半的距离。此时，位于你 30 尺内的一名盟友（由你选择）也可以使用他的反应来移动至多等于他速度一半的距离。 此特性进行的移动不会引发借机攻击。
  - level: 6
    name: 协同舞步
    text: 当你投掷先攻时，若你未陷入失能状态，你可以消耗一次诗人激励使用次数，投掷诗人激励骰，令你与位于你 30 尺内的每个能听见或看见你的盟友进行的先攻检定获得等于该骰值的加值。
  - level: 14
    name: 引导闪避
    text: 当你受到一个允许你进行敏捷豁免来只承受一半伤害的效应影响时，你在豁免成功时不受伤害，豁免失败时只承受一半伤害。若位于你5尺内的其他生物同样需要进行这次敏捷豁免，你可以令他们也享受到此特性的增益。 若你陷入失能状态，你无法使用此特性。
- key: bard-glamour
  cn: 魅心学院
  short: 迷惑
  en: glamour
  profession: bard
  desc: 织魔作惑妖精术 魅心学院的起源要追溯到妖精荒野中的惑心魔法。研究这些魔法的吟游诗人们将美好与恐怖化作丝线，编织到他们的歌曲和故事之中，此中大师甚至能够披上超凡脱俗的威仪。他们的表演将调动人们对被淡忘的纯真的渴望，唤醒人们潜意识中长存的恐惧，牵扯出最铁石心肠的听众的情绪。
  features:
  - level: 3
    name: 惑心魔法
    text: 你始终准备着法术魅惑类人和镜影术。 此外，在你使用法术位施展一道惑控或幻术学派的法术后，你可以立即使一名位于你 60 尺内的你可见的生物进行一次感知豁免检定，对抗你的施法DC。豁免失败则目标陷入魅惑或恐慌状态（由你选择），持续 1 分钟。目标在其每个回合结束时，可以重新进行该豁免，成功则其身上的效应提前结束。 此增益一经使用，直至完成长休你都无法再次使用。你也可以消耗一次诗人激励使用次数（无需动作）重置此增益的使用权。
  - level: 3
    name: 灵感织衣
    text: 你可以将妖精魔法织入歌曲亦或是舞蹈，为他人献上满满的活力。以一个附赠动作，你可以消耗一次诗人激励使用次数，并掷诗人激励骰，从位于你 60 尺内的其他生物中选择任意生物，数量至多等于你魅力调整值（至少选择一名），每个被选中的生物获得等于两倍该诗人骰骰值的临时生命值，然后每名生物均可以使用自己的反应立即移动至多等于自己速度的距离，这次移动不会引发借机攻击。
  - level: 6
    name: 威仪作锦
    text: 你始终准备着法术命令术。 以一个附赠动作，你无需法术位地施展命令术，然后你将获得超凡脱俗的容貌，持续 1 分钟或在你专注终止时提前结束。在此期间，你能够以一个附赠动作，无需法术位地施展法术命令术。 任何因你而陷入魅惑状态的生物在进行对抗你以此特性施展的命令术时，其豁免检定自动失败。 此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗一个三环及以上的法术位（无需动作）来重置此特性的使用权。
  - level: 14
    name: 不破威仪
    text: 以一个附赠动作，你可以魔法性地呈现出庄严的姿态，持续 1 分钟或在你陷入失能状态时结束。在此期间，任何生物在一个回合中的攻击检定首次命中你时，攻击者必须通过一次对抗你施法DC的魅力豁免检定，否则这次攻击将因畏惧你的威仪而变得畏缩并失手。 一旦你呈现出这庄严的姿态，直至完成短或长休你都无法再如此做。
- key: bard-lore
  cn: 逸闻学院
  short: 逸闻
  en: lore
  profession: bard
  desc: 博观觅识深钻法 逸闻学院的吟游诗人从各种渠道——例如奥术著作、神秘仪式甚至市井故事——收集咒语和奥秘。他们聚集在图书馆或是学府之中，分享彼此之间获取的知识。他们也会出席国家事务或是参加节日活动，揭露腐败、拆穿谎言、对自以为是的权威者发起嘲笑。
  features:
  - level: 3
    name: 附赠熟练
    text: 你获得三项由你选择的技能的熟练。
  - level: 3
    name: 语出惊人
    text: 你学会了如何运用你的妙语连珠来超自然地打断敌人、分散注意亦或是削弱他人的自信心和行动力。当一名你可见的位于你 60 尺内的生物进行伤害掷骰、成功于一次属性检定或攻击检定时，你能够以反应消耗一次诗人激励使用次数，并掷诗人激励骰，然后从该生物的掷骰结果中减去诗人骰的骰值，这将降低其造成的伤害或可能使这次检定的成功变为失败。
  - level: 6
    name: 魔法探秘
    text: 你习得两道自选法术。这些法术可以从牧师、德鲁伊或法师法术列表的法术列表中单独或组合选择（这些职业的法术列表见其职业章节）。你选择的法术必须是戏法或是你拥有对应环阶法术位的法术，你拥有的法术位如吟游诗人特性表中所示。 你始终准备着你选择的这些法术。每当你获得一个吟游诗人等级时，你可以将其中一个法术替换为另一个满足上述要求的法术。
  - level: 14
    name: 超凡技艺
    text: 当你进行一次属性检定或攻击检定，并在检定中失败时，你可以消耗一次诗人激励使用次数，投掷诗人激励骰，并将掷骰结果加到d20中，这可能使这次检定的失败变为成功。若检定仍然失败，诗人激励次数将不会被消耗。
- key: bard-valor
  cn: 勇气学院
  short: 勇气
  en: valor
  profession: bard
  desc: 颂歌独唱旧英杰 勇气学院的吟游诗人是无畏的说书人，他们的故事承载了过往伟大英雄的记忆。这些人儿在穹顶之下、篝火之侧、人群之间歌唱豪杰的功绩。他们四处旅行，用双眼记录史诗的发生，将传奇深埋心底并传承下去。他们激励新一代人勇攀高峰，达到与古老英雄同样的高度。
  features:
  - level: 3
    name: 战斗激励
    text: 你可以运用你的巧言来改变战斗的走向。一名拥有你的诗人激励骰的生物可以从下列选项中选择一种效应来使用诗人骰。 防御： 当这名生物被一次攻击检定命中时，该生物能够以反应掷诗人激励骰并将骰值加到对抗这次攻击检定的AC中，这可能使这次攻击变为失手。 进攻： 这名生物以一次攻击检定命中一名目标后，它可以立即投掷诗人激励骰，并将骰值加到这次攻击对这名目标造成的伤害中。
  - level: 3
    name: 战争训练
    text: 你获得军用武器熟练以及中甲和盾牌的护甲受训。 此外，你施展你的吟游诗人法术列表中的法术时，可以使用简易或军用武器作为法器。
  - level: 6
    name: 额外攻击
    # 子职给的额外攻击：与职业表的那条**取大者**，不叠加（吟游诗人 1 次 → 2 次）。
    # 「把一次攻击换成戏法」那半句仍由 DM 按原文裁定（引擎不代选动作）。
    extra_attack: 2
    text: 当你在自己的回合执行攻击动作时，你可以发动两次攻击而非一次。 此外，你可以将额外攻击中的一次，替换为施展一道施法时间为一动作的戏法。
  - level: 14
    name: 战斗魔法
    text: 在你施展一道施法时间为一动作的法术后，你能够以一个附赠动作，使用一把武器发动一次攻击。
- key: cleric-life-domain
  cn: 生命领域
  short: 生命
  en: life-domain
  profession: cleric
  desc: 抚慰世界，疗愈伤痛 生命领域专精于掌握支撑着多元宇宙众生灵的正能量。选择这个领域的牧师都是治愈大师，他们用这一生命原力治愈了无数的创伤。 生命的存在本身即是依赖着与此领域所关联的正能量，因此几乎任何宗教文化的牧师都可能选择它。这个领域与农业之神、医疗与坚韧之神、以及家庭与社会之神的联系尤为紧密。那些致力于治愈众生的教…
  features:
  - level: 3
    name: 引导神力：维持生命
    text: ''
  - level: 3
    name: 生命门徒
    # 用法术位施展的治疗法术：每个被治疗的目标额外 +2 + 环阶（戏法不算，环阶为 0）
    heal_bonus: true
    text: 你消耗法术位施展法术的回合中，当该法术恢复生物的生命值时，额外恢复 2 + 消耗法术位环阶生命值。
  - level: 3
    name: 生命领域法术
    text: 你与此神圣领域的链接使你总是准备了特定的法术。当你达到生命领域法术表中特定的牧师等级时，你总会将表中对应的法术加入准备。
  - level: 3
    name: 维持生命
    text: 以一个魔法动作，你展示圣徽并消耗一次引导神力来引导治疗能量恢复等于你牧师等级五倍的生命值。你选择身边 30 尺内处于浴血状态的生物作为此特性的目标（可以包括你），再为其分配从中获得的治疗能量。该特性至多将目标的生命值恢复至其上限的一半。
  - level: 6
    name: 神佑医者
    # 治疗了别人之后，施法者自己同样回 2 + 环阶
    heal_self: true
    text: 你施放在他人身上的治疗法术也会治疗你。在你使用法术位施放一个为除你以外的一个或多个生物恢复生命值的法术后，你立即恢复等同于2加该法术位等级的生命值。
  - level: 17
    name: 极效治疗
    # 治疗法术的骰子一律取满（2d6 → 12），不再掷
    heal_max: true
    text: 当你需要用一道法术或引导神力掷一枚或多枚骰子，以决定为一个生物恢复的生命数值时，你无需掷骰，直接为每个骰子取最高值。例如，一道法术为某一生物恢复2d6生命值，则其结果直接取 12。
- key: cleric-light-domain
  cn: 光明领域
  short: 光明
  en: light-domain
  profession: cleric
  desc: 携光而来，逐尽黑暗 光明领域的神圣力量着重于带来炽烈的火炎与启示。引动此等伟力的牧师们有着光辉的灵魂，其神明的力量助其窥破幻象，灼尽谎言，燃尽晦暗。 光明领域与司掌真理、警觉、美丽、洞察或革新的神祇所关联。此等神祇中有些被认为是太阳本身，或是驾着战车，指引着太阳划过天穹。另一些则是洞穿阴谋诡计的哨卫。还一些则是美与才…
  features:
  - level: 3
    name: 引导神力：黎明曙光
    text: ''
  - level: 3
    name: 光明领域法术
    text: 你与此神圣领域的链接使你始终准备着特定的法术。当你到达光明领域法术表中特定的牧师等级时，你就始终准备着表中对应的法术。
  - level: 3
    name: 黎明曙光
    text: 以一个魔法动作，你展现圣徽，消耗一次引导神力次数来释放出一阵闪光，覆盖一处以你为源点的 30 尺光环区域。该区域内的任何魔法黑暗——例如法术黑暗术制造的黑暗——都将被解除。此外，区域内你选择的所有生物都必须进行一次体质豁免。豁免失败者将受2d10 + 你牧师等级的光耀伤害，豁免成功则伤害减半。
  - level: 3
    name: 守御闪光
    text: 当位于你 30 尺内一名你可见的生物进行攻击检定时，你能够以反应在该次攻击命中或失手前在该生物面前发出闪耀之光，迫使其该次攻击检定具有劣势。 你可以使用该特性的次数等于你的感知调整值（最少 1 次）。你在完成一次长休时重获所有已消耗的使用次数。
  - level: 6
    name: 精通守御之光
    text: 你在完成一次短或长休后重新获得所有守御之光的使用次数。 此外，每当你使用守御之光时，你可以给予触发此反应的该次攻击所指定那个目标2d6 + 你感知调整值点临时生命值。
  - level: 17
    name: 光冕
    text: 以一个魔法动作，你可以让你自己散发出日光组成的灵光，持续一分钟或直至你将其解除（无需动作）。你散发出半径 60 尺的明亮光照以及额外 30 尺的微光光照。身处该明亮光照范围中的敌人，在抵抗你的黎明曙光特性以及任何造成火焰或光耀伤害的法术而进行豁免检定时具有劣势。 你可以使用该特性的次数等同于你的感知调整值（最少 1 次）。你在完成一次长休时重获所有已消耗的使用次数。
- key: cleric-trickery-domain
  cn: 诡术领域
  short: 诡术
  en: trickery-domain
  profession: cleric
  desc: 挑起闹剧，直面权威 诡术领域提供了欺诈、幻觉与隐匿的魔法。驾驭此等魔法的牧师是世界的颠覆者，他们打击骄傲者的自尊，嘲弄暴君，窃盗富人，释放俘虏，并且蔑视毫无意义的传统。他们喜欢花言巧语、恶作剧、欺骗和盗窃要远远多于正面对抗。 诡术之神们均是恶作剧者，同时也是挑拨凡人或神明去颠覆现有秩序的煽动者。祂们是变革与动荡的具现…
  features:
  - level: 3
    name: 引导神力：召唤分身
    text: ''
  - level: 3
    name: 诡术祝福
    text: 以一个魔法动作，你可以选择自己或 30 尺内一个自愿生物，所选生物在进行敏捷（隐匿）检定时具有优势。此祝福持续至你完成一次长休或直至你再次使用此特性。
  - level: 3
    name: 召现分身
    text: 以一个附赠动作，你可以消耗一次引导神力次数来创造一个自己的完美视觉幻象并出现在你身边 30 尺内一个你能看见且未占据空间。该幻象是无实体的且不占据它所在的空间。幻象持续 1 分钟，或直至你将其解除（无需动作）或陷入失能状态。这个幻象栩栩如生，能模仿你的表情和姿势。当幻象存在时，你将获得以下好处： 施法： 你可以如同你在幻象所在位置施展法术，但必须使用你自己的感官。 干扰： 当你和你的幻象都在同一个生物身边 5 尺内，且该生物可以看见幻象时，由于幻象对目标造成的干扰，你对其进行的攻击检定具有优势。 移动： 以一个附赠动作，你可以移动幻象至多 30 尺到达一处空间，该空间必须是你 120 尺内一处可见的未占据空间。
  - level: 3
    name: 诡术领域法术
    text: 你与此神圣领域的链接使你始终准备着特定的法术。当你到达诡术领域法术表中特定的牧师等级时，你就始终准备着表中对应的法术。
  - level: 6
    name: 诡诈换位
    text: 每当你使用附赠动作创造或移动你来自召现分身特性的幻象时，你都可以通过传送与幻象交换位置。
  - level: 17
    name: 精通分身
    text: 你召唤分身特性所创造的幻象在以下方面变得更加强力。 共享干扰： 当你和你的盟友对位于幻象 5 尺内的生物进行攻击检定时具有优势。 治愈幻象： 当幻象消失时，你或你选择的 5 尺内的一名生物恢复等同于你牧师等级的生命值。
- key: cleric-war-domain
  cn: 战争领域
  short: 战争
  en: war-domain
  profession: cleric
  desc: 激昂气概，击溃仇敌 战争有多种表现形式。它令普通人成就英雄，也能带来绝望与恐惧；战争伴随着残忍与懦弱，却也交织着卓越与勇气。踏入战争领域之路的牧师们精于战斗，激励着他人在战斗中赢得荣耀......亦或是将暴行作为祭礼献上。 战争领域诸神守望着勇士们，并为他们伟大的事迹作出奖赏。战争之神的行列中有充满荣誉和骑士精神的勇…
  features:
  - level: 3
    name: 引导神力：导引打击
    text: ''
  - level: 3
    name: 导引打击
    text: 当你或者距离你 30 尺内的一个生物在一次攻击检定中失手时，你可以消耗一次引导神力次数来让这次攻击检定获得 +10 加值，这可能导致该次攻击命中。当你使用此特性让另一个生物的攻击检定获得此增益时，你必须使用你的反应。
  - level: 3
    name: 战争领域法术
    text: 你与此神圣领域的链接使你始终准备着特定的法术。当你到达战争领域法术表中特定的牧师等级时，你就始终准备着表中对应的法术。
  - level: 3
    name: 战争祭司
    text: 作为一个附赠动作，你可以发动一次武器攻击或者徒手打击。你可以使用该附赠动作的次数等于你的感知调整值（最少 1 次），你在完成一次长休或短后重新获得所有的使用次数。
  - level: 6
    name: 战神祝福
    text: 你可以使用你的引导神力来施展虔诚护盾或者灵体武器而无需消耗法术位。当你以这种方式施展其中任何一道法术时，该法术都不需要专注，且其持续时间变为 1 分钟，但会在你再次施展该法术、陷入失能状态或是死亡时提前结束。
  - level: 17
    name: 战争化身
    # 常驻抗性（不是状态）：直接并进角色卡的抗性表，17 级起生效
    resist: [钝击, 穿刺, 挥砍]
    text: 你获得对钝击、穿刺、挥砍伤害的抗性。
- key: druid-land
  cn: 大地结社
  short: 大地
  en: land
  profession: druid
  desc: 自然世界，颂之以系 大地结社由守护着远古知识与仪式的秘术师和智者们构成。这些德鲁伊们聚集在树木的圣环下或石阵之中，他们用德鲁伊语低声交流，传递着原初的秘密。结社中最睿智的成员如教团的首席祭司地位般尊贵。
  features:
  - level: 3
    name: 大地结社法术
    text: 当你结束一次长休，选择一种地形：荒漠、极地，温带或热带。参照以下对应类型的表格，你自动将表中对应你德鲁伊等级及更低等级的法术加入准备。
  - level: 3
    name: 大地之援
    text: 以一个魔法动作，你可以消耗一次荒野变形使用次数并且选择距你 60 尺内的一点。给予活力的繁花和吸取生命的荆刺在以那一点为源点的 10 尺半径球状区域同时生出。在该球状区域内每个你所选择的生物必须进行一次对抗你法术豁免DC的体质豁免，豁免失败时生物受到2d6暗蚀伤害，豁免成功时受到半数伤害。此外，区域内你所选择的一名生物恢复2d6生命值。 当你到达特定的德鲁伊等级时，伤害和治疗量会提升1d6：10 级（3d6）和 14 级（4d6）。
  - level: 6
    name: 自然恢复
    text: 你可以施展一个你以结社法术特性准备的一环及以上法术，而无须消耗法术位，并且你必须在完成一次长休后才能再次这么做。 此外，当你结束一次短休时，你可以选择恢复消耗的法术位。法术环阶的总和等于你德鲁伊职业等级的一半（向上取整），且不能是六环或更高环阶的法术位。比如说，作为一位 6 级德鲁伊，你可以恢复环阶总和最多为 3 的法术位。你可以恢复一个三环法术位，或者一个二环和一个一环法术位，或者三个一环法术位。一旦你以此特性恢复过法术位，直到完成一次长休为止，你无法再次这么做。
  - level: 10
    name: 自然之护
    text: 你对中毒状态免疫，并且根据自然之护表格所示，你对在结社法术特性中与你当前大地选择相关的伤害类型具有抗性。
  - level: 14
    name: 自然庇护
    text: 以一个魔法动作，你可以消耗一次荒野形态的使用次数，并让灵体树木和藤蔓出现在你自身120尺范围内地面上的一个15尺立方效应区域内。它们在那里持续存在1分钟，或者直到你陷入失能状态或死亡。你和你的盟友在该区域内拥有半身掩护，并且你的盟友在该区域内获得你自然之护的当前抗性。 以一个附赠动作，你可以将立方区域在你的120尺内移动最多60尺距离。
- key: druid-moon
  cn: 月亮结社
  short: 月亮
  en: moon
  profession: druid
  desc: 荒野卫士，身化兽躯 月亮结社的德鲁伊凭借月亮的魔法让自己改变形态。他们的结社成员们在月下相聚，分享见闻，举行仪式。 该结社的德鲁伊如月亮般善变，他们会化身大猫整夜徘徊，第二天又成为一只盘旋在树顶的老鹰，随后从林下灌丛猛冲而出，以熊的形态赶走领地中的入侵者。荒野存在于这些德鲁伊的血液之中。
  features:
  - level: 3
    name: 结社形态
    text: 你学会了如何在使用荒野变形的同时引导月之魔力，增益自身的力量，你获得以下增益： 挑战等级： 你的荒野变形形态的最大挑战等级现在等于你德鲁伊等级的三分之一（向下取整）。 护甲等级： 只要你仍处于荒野变形形态，如果 13 + 你的感知调整值加起来高于野兽的护甲等级，你的护甲等级等于你 13 + 你的感知调整值。 临时生命值： 当你化为荒野变形形态时，你获得等于德鲁伊等级的三倍数量的临时生命值。
  - level: 3
    name: 月亮结社法术
    text: 当你达到月亮结社表格中特定的德鲁伊等级时，你自动将表中对应的法术加入准备。 此外，你可以在荒野形态下施展这些法术。
  - level: 6
    name: 进阶结社形态
    text: 处于荒野形态时，你获得以下增益。 月耀辉光： 你在荒野变形形态下的每次攻击可以造成普通的伤害或光耀伤害。由你在每次攻击命中时选择。 强化韧性： 你将你的感知调整值加到你的体质豁免结果当中。
  - level: 10
    name: 月光飞步
    text: 能以魔法转移自身，在一道月光中重新出现。以一个附赠动作，你传送最多 30 尺到一处你能看见的未被占据的空间，并且你在这个回合结束前进行的下一次攻击具有优势。 你可以使用该特性的次数等于你的感知调整值（最少 1 次），并且你在结束一次长休后重获全部已消耗的使用次数。你也能消耗一个二环或更高的法术位来恢复一次使用次数（无需任何动作）。
  - level: 14
    name: 月辉形态
    text: 月之力量充盈着你的身体，让你获得以下增益： 月耀炽光： 一回合一次，你可以对一次荒野形态下的攻击命中的目标额外造成2d10光耀伤害。 月辉同行： 当你使用月光飞步时，你还能传送另一个自愿的生物。该生物必须在你的 10 尺内，并且你将它传送到你出现点的 10 尺内的一个你能看见的未被占据空间中。
- key: druid-sea
  cn: 海洋结社
  short: 海洋
  en: sea
  profession: druid
  desc: 海潮风暴，一体同心 海洋结社的德鲁伊们驱使着世界上海洋和风暴中狂野的自然之力。其中一些德鲁伊将自己视作自然怒火的化身，对那些掠夺自然世界的人们施以报复。而另一些德鲁伊则顺应潮汐的涨落，跟随洋流和波浪的激荡，聆听狂风的低语和怒号，从中寻求和自然的灵性统一。
  features:
  - level: 3
    name: 海洋结社法术
    text: 当你到达海洋结社法术表中特定的德鲁伊等级时，你就始终准备着表中对应的法术。
  - level: 3
    name: 瀚海之怒
    text: 以一个附赠动作，你可以消耗一次你的荒野变形次数来在自己周围显现出海浪形态的 5 尺光环。光环会持续存在 10 分钟。当你解除它（无需任何动作）、再度显现光环或陷入失能时，它会提前结束。 当你显现出光环时，以及在之后的回合中以一个附赠动作，你可以选择另一个在你光环范围内你可见的生物。该生物必须成功通过一次对抗你的法术豁免DC的体质豁免，否则受到寒冷伤害，如果该生物是大型或更小体型，它会被从你身边推离至多 15 尺距离。投掷等于你感知调整值数量（最少 1 颗）的d6骰来决定伤害。
  - level: 6
    name: 水生亲和
    text: 你的瀚海之怒创造的光环范围提升至 10 尺。 此外，你获得等于你速度的游泳速度。
  - level: 10
    name: 风暴降生
    text: 你的瀚海之怒特性在激活时获得两项额外增益： 飞行： 你获得等于你的速度的飞行速度。 抗性： 你获得对寒冷、闪电和雷鸣伤害的抗性。
  - level: 14
    name: 大洋慨赠
    text: 当你使用瀚海之怒时，你可以让 60 尺内一个自愿生物而非你自己身上显现出光环。该生物获得光环的所有增益，并在特性中使用你的法术豁免DC和感知调整值。 此外，如果你消耗两次而非一次荒野变形使用次数，你可以同时在你自己和另一个生物身上显现出光环。
- key: druid-stars
  cn: 星辰结社
  short: 星辰
  en: stars
  profession: druid
  desc: 群星隐秘，求索驭力 在无法追忆的过去，星辰结社的德鲁伊们便开始记录天穹中的图案，探索星座之间隐藏的秘密。通过理解这些秘密，这个结社的德鲁伊探索着如何驾驭宇宙的伟力。
  features:
  - level: 3
    name: 星图
    text: 作为你天文学研究的一部分，你创造了一张星图。它是一个微型物体，可以用作你施展德鲁伊法术时的法器。你通过在星图列表上掷骰或选择一个来确定它的形态。 当你持握这件星图时，你视作总是准备着神导术和光导箭这两个法术，并且你可以施展光导箭而无需消耗法术位。其次数等同于你的感知调整值（最少 1 次），当你完成一次长休时，你重获全部已消耗的使用次数。 如果你丢失了星图，你可以举行一场为时一小时的仪式来使用魔法创造一个替代品。这一仪式可以在一场短或长休时举行，并会摧毁先前的星图。
  - level: 3
    name: 星耀形态
    text: 以一个附赠动作，你可以消耗一次荒野变形特性使用次数以呈现一个星耀形态，而非变化为野兽形态。 处于星耀形态期间，你保留你的游戏数据，但你的身体变得明亮；你的关节星光熠熠并有如星图一般由亮线连接。这一形态散发出 10 尺半径的明亮光照以及其外 10 尺的微光光照。这一形态持续 10 分钟。如果你解除它（无需动作）、失能、死亡、或再次使用此特性，它就会提前结束。 每当你化身星耀形态时，你选择以下在星座之一在你身上亮起；你的选择将为你在形态中提供特定的增益：
  - level: 3
    name: 射手座
    text: 一个弓箭射手的星座于你身上浮现。当你激活这个形态时你可以进行一次远程法术攻击，对你 60 尺内的一个生物射出一发光箭，在形态持续期间的后续回合中你也能够以一个附赠动作发射光箭。命中时，此攻击将造成等同于 1d8 + 你的感知调整值点的光耀伤害。
  - level: 3
    name: 圣杯座
    text: 一个予命圣杯的星座于你身上浮现。当你消耗法术位施展一个为生物恢复生命值的法术时，你或你周围 30 尺内的另一生物可以恢复等同于 1d8 + 你的感知调整值点的生命值。
  - level: 3
    name: 巨龙座
    text: 一个智慧巨龙的星座于你身上浮现。当你进行一次智力或感知检定，或是进行一次体质豁免来维持法术专注时，你可以将d20中 9 或以下的骰值视为 10。
  - level: 6
    name: 宇宙预兆
    text: 每当你完成一次长休时，你可以参照你的星图来寻找预兆。此时，掷一枚骰子。直到你完成下一次长休为止，你获得一个基于此掷骰结果奇偶性的特殊反应能力。 当你周围 30 尺内的一个可见生物将要进行一次D20 检定时，你可以使用你的反应来投一个1d6，并将结果加入到检定结果中。 当你周围 30 尺内的一个可见生物将要进行一次D20 检定时，你可以使用你的反应来投一个1d6，并将结果从检定结果中减去。 你可以使用这一反应能力的次数等同于你的感知调整值（最少 1 次），在你完成一次长休后，你会重获所有已消耗的使用次数。
  - level: 10
    name: 闪耀星座
    text: 你的星耀形态星座增强了。射手座和圣杯座中的1d8都变成了2d8，而在巨龙座激活期间，你将获得 20 尺的飞行速度，并且可以悬浮。 此外，每个你的回合开始时，若此时你处于在星耀形态下，你可以更改当前身上闪耀的星座。
  - level: 14
    name: 灿若繁星
    text: 处于星耀形态期间，你的身体部分无实质化，使你获得钝击、穿刺与挥砍伤害的抗性。
- key: fighter-battle-master
  cn: 战斗大师
  short: 战斗大师
  en: battle-master
  profession: fighter
  desc: 战技百般昭武艺 战斗大师是研习战斗技艺的学者，他们勤学代代相传的武术。那些最负盛名的战斗大师将苦心练就的武功与史学、艺术与理论相互结合，由此，他们往往兼备文才武略。
  # 卓越骰成长表：等级 → [个数, 骰面]。原文「4 枚 d8，第 7（共 5 枚）与第 15 级
  # （共 6 枚）各加一枚」，10 级换 d10、18 级换 d12（个数不变）。
  superiority:
    3: [4, 8]
    7: [5, 8]
    10: [5, 10]
    15: [6, 10]
    18: [6, 12]
  features:
  - level: 3
    name: 卓越战技
    text: 你的战斗技巧在战场上接受了磨砺，你习得战技并获得一种名为卓越骰的特殊骰。 战技： 你从战技选项中习得三种自选战技（详见后文）。许多战技能够以某种方式增幅你的攻击，而你在每次攻击时只能应用一次战技。 你在第 7、第 10 和第 15 级时均习得两种自选的新战技。习得新战技时，你还可以额外替换一个已经习得的战技。 卓越骰： 你拥有四个d8卓越骰。卓越骰一经使用即消耗，完成短或长休后恢复。 你的卓越骰在第 7（共 5 枚）和第 15 级（共 6 枚）时各增加一枚。 豁免检定： 若一个战技需要进行一次豁免检定，则该战技的豁免DC等于 8 + 你的力量或敏捷调整值（由你选择）+ 你的熟练加值。
  - level: 3
    name: 战技选项
    text: 此处战技按字母顺序排列。
  - level: 3
    name: 战争学徒
    text: 你选择一种工匠工具并获得其熟练。此外，你选择一项战士 1 级可用的技能，并获得该技能的熟练。
  - level: 7
    name: 料敌机先
    text: 以一个附赠动作，你可以获知一名位于你 30 尺内你可见的生物的长处和短处。你知晓该生物是否具有抗性、免疫或易伤，若有，则你知晓其具体内容是什么。 此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗 1 粒卓越骰（无需动作）重置此特性的使用权。
  - level: 10
    name: 精通卓越战技
    text: 你的卓越骰变为d10。
  - level: 15
    name: 坚韧
    text: 每回合一次，当你使用一项战技时，你可以不消耗卓越骰，而是掷1d8并使用结果作为代替。
  - level: 18
    name: 究极战技
    text: 你的卓越骰变为d12。
- key: fighter-champion
  cn: 勇士
  short: 勇士
  en: champion
  profession: fighter
  desc: 勇冠三军彰英豪 在对胜利的不懈追求中，勇士专注于发展自身的武勇。他们通过严酷的训练锻冶出卓绝的肉体以直面打击，跨越险境，寻觅荣誉。无论是在角斗场之中还是血染的疆场上，勇士都只为夺得胜利之桂冠而奋战。
  features:
  - level: 3
    name: 精通重击
    crit_at: 19
    text: 你使用武器或重击进行的攻击检定在d20中掷出 19 或 20 时即可造成重击。
  - level: 3
    name: 运动健将
    # 先攻检定有优势（力量（运动）检定那条归 DM 裁定，引擎不自动加优势）
    initiative_advantage: true
    text: 得益于你平日的体育锻炼，你能获得一些优势，即你在先攻检定和力量（运动）检定中具有优势。 此外，当你造成一次重击时，你可立即移动至多等于你速度一半的距离，这次移动不会引发借机攻击。
  - level: 7
    name: 额外战斗风格
    text: 你获得另一个自选的战斗风格专长。
  - level: 10
    name: 勇战英豪
    text: 战斗的艰难只会使你朝胜利更进一步。在战斗中，若你回合开始时没有英雄激励，你可以获得之。
  - level: 15
    name: 高效重击
    crit_at: 18
    text: 你使用武器或徒手打击进行的攻击检定在d20中掷出 18-20 时即可造成重击。
  - level: 18
    name: 生还者
    # 蔑视死亡：死亡豁免有优势，且掷到 18~20 都按「天然 20」算（回 1 血清醒）。
    # 英气风发：回合开始时浴血且还有血 → 回 5 + 体质（挂在 _walk 的回合开始处）。
    death_save_advantage: true
    death_save_at: 18
    bloodied_regen: true
    text: 你持续战斗的能力达到巅峰，赋予了你以下好处： 蔑视死亡： 你进行死亡豁免检定时具有优势。此外，若内你在死亡豁免检定上投出了 18~20 时，都会获得相当于投出 20 的好处。 英气风发： 你的回合开始时，若你已浴血且拥有至少 1 点生命值，你恢复等同于5加上你的体质调整值的生命值。
- key: fighter-eldritch-knight
  cn: 奥法骑士
  short: 奥法骑士
  en: eldritch-knight
  profession: fighter
  desc: 奥法遍身附剑戟 奥法骑士将所有战士共通的高超武技与对魔法的精妙研究融合贯通。法术补足并拓展了他们的武技，为甲胄提供额外的保护，并使他们能够使用爆发性的魔法同时与多个敌人鏖战。
  features:
  - level: 3
    name: 施法
    text: 你学会了如何施展法术。施法规则见第七章。下文将详述如何将这些规则应用于奥法骑士。 戏法： 你知晓两道你从法师法术列表中选择的戏法。推荐选择冷冻射线和电爪。每当你获得一个战士等级时，你都能从此特性的戏法中选择其一替换为另一道你从法师法术列表中选择的戏法。 当你的战士等级到达10级时，你能另选一道法师戏法并习得。 法术位： 奥法骑士施法表显示了你可用于施展一环及以上法术的法术位数量。你在完成一次长休时恢复所有已消耗的法术位。 1环及以上的准备法术： 你准备可供你以此特性施展的一环及更高环阶的法师法术列表。为此，选择三道来自法师法术列表的法术。推荐选择燃烧之手、跳跃术和护盾术。 已准备法术数量会随你战士等级的提升而增加，如奥法骑士施法表中的准备法术一列所示。每当这一列的数字增加时，从法师法术列表中选择额外法术准备，直至已准备法术的数量与表格中的数字一致。你所选择法术的环阶必须是你所拥有法术位对应的环阶。 更换你的准备法术： 每当你获…
  - level: 3
    name: 战争联结
    text: 你习得一种让你和你的武器建立魔法联结的仪式。你执行持续一小时的仪式，且可在短休时进行。整个仪式过程中武器必须在你的触及范围内，直至仪式结束前，该武器必须一直在你触手可及的范围内，以完成联结。若该武器已与另一名战士建立联结，或是一把已被他人同调的魔法物品，仪式则会失败。 联结建立后，只要你不处于失能状态，使用联结武器时就不会被缴械。如果联结武器与你处于同一位面，则你可以用一个附赠动作使其立即传送到你手中。 你至多可以拥有两把建立联结的武器，但一个附赠动作只能召唤一把武器。如果你试图和第三把武器建立联结，则必须与已经联结的两把武器其中的一把取消联结。
  - level: 7
    name: 战争魔法
    text: 当你在自己回合执行攻击动作时，你可以将该动作攻击中的一次攻击替换为施展一道施法时间为动作的你的法师戏法。
  - level: 10
    name: 奥法打击
    text: 你习得用武器攻击削弱敌人对你法术抵抗能力的方法。当你使用一把武器命中一个生物后，直到你的下个回合结束为止，该生物在对抗你法术所进行的下一次豁免检定中具有劣势。
  - level: 15
    name: 奥能冲锋
    text: 你可以在使用动作如潮时传送至多 30 尺至一个你能看到的未被占据的空间。你可以在使用动作如潮提供的额外动作之前或之后进行传送。
  - level: 18
    name: 精通战争魔法
    text: 当你在自己回合执行攻击动作时，你可以该动作攻击中的两次攻击替换为施展一道施法时间为动作，环阶为一环或二环的你的法师法术。
- key: fighter-psi-warrior
  cn: 灵能武士
  short: 灵能武士
  en: psi-warrior
  profession: fighter
  desc: 灵能庇体显神威 灵能武士唤醒他们心灵中的力量以增强自身的体魄，他们将这种被称为灵能的力量注入于刀兵之中，用念动力鞭笞他们的敌人，并以精神力铸造无形壁垒抵御攻击。
  features:
  - level: 3
    name: 灵能力量
    text: 你内心拥有一个灵能力量的源泉。这股能量表现为灵能骰，它是你从此子职中获得的可消耗能力。灵能武士灵能骰表展示了你在达到特定战士等级后的灵能骰大小与数量。 此子职中所有需要使用灵能骰的特性只能使用你从该子职获得的灵能骰。你在使用某些能力时需要消耗灵能骰，如异能描述中所述，如果某个异能在你的灵能骰全部消耗完后还需要你使用一个灵能骰，你就不能使用该异能。 你可以在完成短休时重获一枚已消耗的灵能骰，完成长休时重获所有已消耗的灵能骰。
  - level: 3
    name: 庇护力场
    text: 当你或者另一个位于你 30 尺内的你可见的生物受到伤害时，你可以执行一个反应来消耗一枚灵能骰，对其降低等同于灵能骰骰出的数值加你的智力调整值的伤害（最少 1 点），如同你创造了一面瞬间的念力盾牌。
  - level: 3
    name: 灵能打击
    text: 你可以用灵能驱动你的武器。每个你的回合一次，当你用武器命中并对位于你 30 尺范围内的目标造成伤害时，你可以立即消耗一枚灵能骰，对目标造成等同于灵能骰骰出的数值加你的智力调整值的力场伤害。
  - level: 3
    name: 念力控物
    text: 你可以用意念移动一个物体或生物。以一个魔法动作，你选中一个除你以外的自愿生物或一个至多大型的未固定物件。如果你可以看见目标且目标在你 30 尺范围内，你就可以将其移动至多 30 尺至另一个对你可见的未占据空间内。另外，如果目标是一个微型物件，你可以自由给出或收回手中。 此异能一经使用，直至完成短或长休你都无法再次使用。你也可以消耗一枚灵能骰（无需动作）重置此异能的使用权。
  - level: 7
    name: 灵力跃动
    text: 以一个附赠动作，你获得飞行速度，等同于两倍速度，直到本回合结束为止。一旦你执行了此附赠动作，直到你完成一次短或长休为止你都不能再次使用它。你也可以消耗一枚灵能骰（无需动作）来再次使用该异能。
  - level: 7
    name: 念力精通
    text: 你已经掌握了使用念力异能的新方式，如下所示。
  - level: 7
    name: 念力突刺
    text: 当你使用灵能打击对一个目标造成伤害时，你可以迫使目标进行一次力量豁免（8 + 你的智力调整值 + 你的熟练加值）。如果豁免失败，你可以使目标陷入倒地状态或者将其在任意方向水平移动至多 10 尺。
  - level: 10
    name: 意念守护
    text: 你获得心灵伤害的抗性。此外，如果你在你的回合开始时处于魅惑或者恐慌状态，你可以消耗一个灵能骰（无需动作）并结束自己身上全部造成这些状态的效应。
  - level: 15
    name: 力场壁垒
    text: 你可以使用念力庇护你自己和其他人。以一个附赠动作，包括你在内，你可以选择数名位于你 30 尺范围内的生物，其数量等同于你的智力调整值（最少 1 名）。每名被选中的生物将在 1 分钟内视为处于半身掩护中，该保护将会在你陷入失能状态时提前结束。 此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗一枚灵能骰（无需动作）重置此特性的使用权。
  - level: 18
    name: 念力宗师
    text: 你始终准备着心灵遥控法术，你可以在无需任何法术成分和法术位的情况下使用它，你施展这一法术的施法属性为智力。在每一个你对该法术维持专注的回合，包括你施放它的回合，你都能够以一个附赠动作使用一把武器发动一次攻击。 一旦你以此特性施展此法术，直至完成长休你都无法再如此做。你也可以消耗一枚灵能骰（无需动作）重置此法术的施展。
- key: monk-warrior-of-mercy
  cn: 命流武者
  short: 命流
  en: warrior-of-mercy
  profession: monk
  desc: 掌执命流 命流武者操弄着他人的命流之力。这些武僧既是云游的医者，但也能给敌人带去迅疾的死亡。他们总戴着面具，以无脸的生死使者之形象示人。
  features:
  - level: 3
    name: 夺命之手
    text: 每回合一次，当你用徒手打击命中一个生物并造成伤害时，你可以消耗 1 点功力来额外造成等于一枚你的武艺骰 + 你的感知调整值的暗蚀伤害。
  - level: 3
    name: 予命之手
    text: 以一个魔法动作，你能消耗 1 点功力来接触一个生物，恢复目标等于一枚你的武艺骰 + 你的感知调整值的生命值。当你使用疾风连击时，你能将其中一次徒手打击改为使用此特性治疗一个生物，且不需要为治疗额外消耗功力。
  - level: 3
    name: 操命本事
    text: 你获得洞悉和医药的熟练，并且获得草药工具的熟练。
  - level: 6
    name: 生死之触
    text: 你的夺命之手和予命之手得到提升，具体如下。 夺命之手： 当你对一个生物使用夺命之手时，你可以使该生物陷入中毒状态，直至你的下个回合结束。 予命之手： 当你使用予命之手时，你还可以结束你治疗的生物身上的以下状态之一：目盲、耳聋、麻痹、中毒或震慑。
  - level: 11
    name: 生杀予夺
    text: 当你使用疾风连击时，你可以将每一次徒手打击都替换为使用予命之手，且均无需为予命之手消耗功力。 此外，当你以疾风连击发动徒手打击并造成伤害时，你可以为那次打击使用夺命之手且无需为夺命之手消耗功力。但你每回合仍然只能使用一次夺命之手。 你能使用此增益的次数等于你的感知调整值（最少一次）。你在完成一次长休后重获所有已消耗的次数。
  - level: 17
    name: 命极之手
    text: 你对生命能量的掌握打开了通往命流奥义的大门。以一个魔法动作，你可以消耗 5 点功力并触碰一名死亡不超过 24 小时的生物的尸体。该生物会起死回生，以等于4d10 + 你的感知调整值的生命值复活。如果该生物死前具有任意以下状态，该生物复活时这些状态被移除：目盲、耳聋、麻痹、中毒和震慑。 此特性一经使用，直至完成长休你都无法再次使用。
- key: monk-warrior-of-shadow
  cn: 暗影武者
  short: 幽影
  en: warrior-of-shadow
  profession: monk
  desc: 暗影藏形 暗影武者习练隐匿与遁术，引导，驾驭来自堕影冥界的力量。他们居于黑暗，藏于薄暮，遁于幽影，出手亦犹如幽影一般凶险。
  features:
  - level: 3
    name: 暗影技艺
    text: 你掌握了如何唤出堕影冥界的力量，获得以下增益：
  - level: 3
    name: 黑暗术
    text: 你可以消耗 1 点功力以施展黑暗术法术且无需任何法术成分。你可以看穿以这个特性施展的黑暗区域。法术持续期间，你可以在你的每个回合开始时将此法术区域移动到你 60 尺范围内的任意一处空间。
  - level: 3
    name: 黑暗视觉
    text: 你获得 60 尺黑暗视觉。如果你已经有黑暗视觉，则其范围提升 60 尺。
  - level: 3
    name: 幻影术
    text: 你知晓戏法次级幻象。其施法属性为感知。
  - level: 6
    name: 暗影步
    text: 当你完全身处微光光照或黑暗下时，你能以一个附赠动作传送到 60 尺内另一处你可见的未占据的空间，目标地点需要同样位于微光光照或黑暗下。接下来，你在当前回合结束前所做的下一次近战攻击具有优势。
  - level: 11
    name: 无影步
    text: 你可以利用与堕影冥界的连结来增强自己的传送能力。当你使用暗影步特性时，你可以消耗 1 点功力，移除开始和结束时对微光光照或黑暗的要求。此外，作为这个附赠动作的一部分，你可以立即在传送之后进行一次徒手打击。
  - level: 17
    name: 幽影斗篷
    text: 当你完全身处微光光照或黑暗环境下时，你能够以一个魔法动作消耗3点功力来让你周围环绕幽影，持续 1 分钟，直至你陷入失能状态或在明亮光照中结束回合。当周身环绕幽影时，你获得以下好处： 隐形： 你获得隐形状态。 局部虚化： 你可以如同通过困难地形一般通过已占据空间。如果你回合结束时仍然处于已占据空间之中，则会被排出到之前最近一个未占据空间。 幽影连击： 你使用疾风连击时不再需要消耗功力。
- key: monk-warrior-of-the-elements
  cn: 四象武者
  short: 元素
  en: warrior-of-the-elements
  profession: monk
  desc: 身起四象 四象武者挥洒着来自元素位面的力量。这些武僧们以超凡功力引动着元素混沌的能量，即可内强自身，又能外发制敌。
  features:
  - level: 3
    name: 元素同调
    text: 在你回合开始时，你可以消耗 1 点功力让元素能量浸润己身。这股能量将会持续存在 10 分钟，或直至你陷入失能状态。持续时间内，你获得以下增益： 触及： 你可以将元素能量打出体外，当你进行徒手打击的时候，你的触及提升 10 尺。 元素注拳： 当你使用徒手打击攻击命中时，你可以选择使其造成强酸、寒冷、火焰、闪电或雷鸣伤害，而非通常的伤害类型。当你以徒手打击造成以上种类的伤害时，你可以迫使目标进行一次力量豁免。若失败，你可以利用周身的元素之力将目标拉近或推离 10 尺。
  - level: 3
    name: 掌控元素
    text: 你习得戏法四象法门，其施法属性为感知。
  - level: 6
    name: 元能爆发
    text: 以一个魔法动作，你可以消耗 2 点功力，凝聚元素能量，在你周围 120 尺内的一点产生一场半径 20 尺球状区域的能量爆发。你选择一种伤害类型：强酸、寒冷、火焰、闪电或雷鸣。 球状区域内的每个生物必须成功通过进行一次敏捷豁免。若失败，该生物受到相当于你 3 个武艺骰的伤害，其伤害类型为你之前所选择的类型。若成功，则受到一半伤害。
  - level: 11
    name: 四象遁术
    text: 当你处于元素同调特性激活期间，你获得相当于你速度的飞行速度与游泳速度。
  - level: 17
    name: 四象神通
    text: 当你处于元素同调特性激活期间，你在持续时间内获得以下增益： 伤害抗性： 你选择一种伤害类型：强酸、寒冷、火焰、闪电或雷鸣，你获得该伤害类型的抗性。你在每个你的回合开始时可以改变所选择的伤害类型。 破灭奔行： 当你使用疾步如风时，你的速度提升 20 尺，直至这个回合结束。在持续时间内，当你进入到某个生物 5 尺范围内的时候，你可以对其造成相当于你武艺骰的伤害，数量不限。此伤害的类型由你选择：强酸、寒冷、火焰、闪电或雷鸣。一个生物每回合只会受到一次此伤害。 真力注拳： 每个你的回合一次，当你用徒手打击命中一个目标时，你可以对其造成相当于你武艺骰的额外伤害。此伤害的类型与此次徒手打击所造成的伤害类型相同。
- key: monk-warrior-of-the-open-hand
  cn: 散打武者
  short: 散打
  en: warrior-of-the-open-hand
  profession: monk
  desc: 散打随心 散打武者是徒手战斗的大师，他们学习了推离和绊摔的技艺妨敌，并用内力保护自己免受伤害。
  features:
  - level: 3
    name: 散打技巧
    text: 每当你疾风连击中的一次攻击命中一个生物时，你可以迫使其承受下列效应之一： 慌神： 目标直至他的下个回合开始不能使用借机攻击。 推离： 目标必须成功通过一次力量豁免，否则被你推离 15 尺。 失衡： 目标必须成功通过一次敏捷豁免，否则陷入倒地状态。
  - level: 6
    name: 混元体
    text: 你获得治愈己身的能力。你能够以一个附赠动作掷你的武艺骰。你恢复相当于掷骰结果+你的感知调整值数量的生命值（至少恢复1点生命值）。 你可以使用该特性的次数等同于你的感知调整值（最少 1 次）。你在完成一次长休时重获所有已消耗的使用次数。
  - level: 11
    name: 流星步
    text: 当你使用一个附赠动作而非疾步如风时，你可以在该附赠动作后立即使用疾步如风。
  - level: 17
    name: 渗透劲
    text: 你获得了将内劲击入他人体内的能力。当你以徒手打击命中一个生物时，可以消耗 4 点功力打入暗劲，其持续相当于你武僧等级的天数。在你使用你的动作将之结束前，暗劲是无害的。此外，当你在自己的回合执行攻击动作时，你可以将其中一次攻击替换为这个动作使暗劲结束。若你如此做，你和目标必须处于同一个存在位面。当你结束暗劲时，目标必须进行一次体质豁免，失败则受到10d12力场伤害，成功则只受到一半伤害。 在同一时间你只能用这个特性使一个生物处于此效应中。你可以结束某人身上的暗劲而不造成伤害（不需要动作）。
- key: paladin-devotion
  cn: 奉献之誓
  short: 奉献
  en: devotion
  profession: paladin
  desc: 当仁不让知行正 奉献之誓让圣武士和正义与秩序的崇高理念连为一体。他们是身披闪亮的盔甲的正派骑士形象代表。他们严于律己，某些成员甚至会过于严苛的对待他人。 追随该誓言的许多圣武士都献身于守序和善良的神祇，并将其的信条视作奉献的标准。他们将天使视作其典范，并在头盔或罩袍上饰以天使羽翼的形象。 立下此誓言的圣武士都遵循以下…
  features:
  - level: 3
    name: 奉献圣誓法术
    text: 你誓言具有的魔法使你始终准备着特定的法术。当你到达奉献之誓法术表中特定的圣武士等级时，你就始终准备着表中对应的法术。
  - level: 3
    name: 神圣武器
    text: 当你执行攻击动作时，你可以消耗一次你的引导神力次数，为你持握的一把近战武器注入正能量。随后 10 分钟或你再次使用此特性为止，你使用该武器进行的攻击检定可以加上你的魅力调整值（至少为 +1），且每次命中时可以选择是造成正常伤害或者是光耀伤害。 该武器同时提供半径 20 尺的明亮光照以及额外 20 尺微光光照。 你可以提前终止此效应（无需动作）。当你不再携带这把武器，此效应同样终止。
  - level: 7
    name: 奉献灵光
    text: 你与位于你守护灵光内的盟友具有魅惑免疫。陷入魅惑的盟友进入灵光时，该状态在灵光内会暂时无效。
  - level: 15
    name: 卫护斩
    text: 你现在能让魔法斩击散发出保护性的能量。每当你施展至圣斩时，直到你的下个回合开始为止，你的灵光获得以下增益：身处你的守护灵光期间，你和你的盟友具有半身掩护。
  - level: 20
    name: 至圣光轮
    text: 以一个附赠动作，你可以用圣力盈满你的守护灵光，灵光获得下列的增益，持续 10 分钟或直到你将之提前结束（无需动作）。此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗一个五环法术位（无需动作）重置此特性的使用权。 至圣守护： 你被邪魔或亡灵迫使进行的豁免检定具有优势。 光耀伤害： 每当敌人在灵光范围内开始回合时，该生物受到等同于你的魅力调整值 + 你的熟练加值的光耀伤害。 阳光： 你的灵光内变为明亮光照，视为阳光。
- key: paladin-glory
  cn: 荣耀之誓
  short: 荣耀
  en: glory
  profession: paladin
  desc: 砥身励行蜚声英 对荣耀宣誓的圣武士坚信他们将与同伴命中注定将一起达成英勇的伟业。他们将刻苦训练，砥砺前行，从而确保当命运决定的时刻到来之际，他们都已有所准备。 立下此誓言的圣武士都遵循以下信条。 力争上游 勇往直前。 振奋人心
  features:
  - level: 3
    name: 鼓舞斩
    text: 当你施展至圣斩后，你可以立即消耗一次你的引导神力次数，使3 0 尺内由你选择的生物或你自身获得临时生命值。这些生物共获得的临时生命值等同于2d8 + 你的圣武士等级，你可以为其随意分配这些临时生命值。
  - level: 3
    name: 荣耀之誓法术
    text: 你誓言具有的魔法使你始终准备着特定的法术。当你到达荣耀之誓法术表中特定的圣武士等级时，你就始终准备着表中对应的法术。
  - level: 3
    name: 绝伦健将
    text: 以一个附赠动作，你可以消耗一次引导神力次数以增强运动能力。1 小时内，你在力量（运动）检定和敏捷（特技）检定上获得优势，且你跳远和跳高的距离增加 10 尺（你依然为此正常消耗移动力）。
  - level: 7
    name: 迅捷灵光
    text: 你的速度增加 10 尺。 此外，每个在自己回合第一次进入你守护灵光内的盟友，或在其内开始回合的盟友，速度提升 10 尺，直到其下个回合结束为止。
  - level: 15
    name: 辉煌防御
    text: 你能在防御中转守为攻，对敌人发起突然袭击。当你或位于你 10 尺内一个你可见的生物成为一次攻击的目标并被击中时，你可以用反应使其获得一定的AC加值，此举可能使该次攻击改为失手。此加值等同于你的魅力调整值（至少为 +1）。若该次攻击失手，且攻击者在你的武器触及范围内，你可以用武器对其进行一次攻击，这次攻击视为反应的一部分。 你能使用此特性的次数等同于你的魅力调整值（最少 1 次），你在完成一次长休后重获所有消耗的次数。
  - level: 20
    name: 现世传说
    text: 你能够使自己有能力实现传奇的壮举——无论是确有此事，抑或夸大其词。以一个附赠动作，你获得下列的增益。持续 10 分钟或直到你将之提前结束（无需动作）。此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗一个五环法术位（无需动作）重置此特性的使用权。 神眷天恩： 一个异界存在赐福于你，你在与魅力相关的检定上获得优势。 重掷豁免： 当你进行一次豁免检定并失败时，你可以用反应重投之。你必须使用重投的结果。 无误打击： 每自己回合一次，当你进行一次武器攻击但失手，你可以使其改为命中。
- key: paladin-the-ancients
  cn: 古贤之誓
  short: 古贤
  en: the-ancients
  profession: paladin
  desc: 护生驱暗济世界 古贤之誓存在的时间与最初的精灵一族的历史相仿。他们发誓捍卫光明的存在。他们热爱世界上的美与带来生命的事物，更甚于荣耀、勇气和正义。他们在盔甲和服饰上饰以树叶、鹿角、花朵等等生机勃勃的纹样，以象征自己立下承诺保护世上的生命与光明。 立下此誓言的圣武士都遵循以下信条。 点亮希望。 庇护生命。 乐人之乐。
  features:
  - level: 3
    name: 自然之怒
    text: 以一个魔法动作，你可以消耗一次引导神力次数，唤出灵体藤蔓缠绕周围的生物。你选择你能看到的位于你 15 尺内的任意数量生物，令其必须通过一次力量豁免，失败陷入束缚状态 1 分钟。被束缚的生物可以在其回合结束时重复豁免，成功则不再受到此效应影响。
  - level: 3
    name: 古贤圣誓法术
    text: 你誓言具有的魔法使你始终准备着特定的法术。当你到达古贤之誓法术表中特定的圣武士等级时，你就始终准备着表中对应的法术。
  - level: 7
    name: 守御灵光
    text: 强大的远古魔法眷顾着你，以至于在你身边形成了一道神秘的结界，阻挡着来自物质位面外的能量；你和位于你守护灵光内的盟友获得对暗蚀，心灵以及光耀伤害的抗性。
  - level: 15
    name: 不灭哨卫
    text: 当你生命值降至 0，但尚未被直接杀死时，可以选择让你的生命值降到 1 而不是 0，然后你再恢复相当于你圣武士等级三倍的生命值。该能力一经使用，直至完成长休你都无法再次使用。 此外，你不会因为魔法效应而衰老，你的外表也会停止老去。
  - level: 20
    name: 上古斗士
    text: 以一个附赠动作，你可以用原力盈满你的守护灵光，灵光获得下列的增益。持续 1 分钟 Alexander或直到你将之提前结束（无需动作）。此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗一个五环法术位（无需动作）重置此特性的使用权。 瓦解反抗： 位于你灵光范围内的敌人在对抗你法术或引导神力的豁免上具有劣势。 复生： 你在每个自己的回合开始时，恢复 10 点生命值。 迅捷法术： 每当你施展一道施法时间为动作的法术时，你可以将其改为一个附赠动作施展。
- key: paladin-vengeance
  cn: 复仇之誓
  short: 复仇
  en: vengeance
  profession: paladin
  desc: 铁面无情伏妖魔 复仇之誓，是立誓惩戒那些严重罪行的庄严承诺。当邪恶势力屠杀无助居民，当暴君背离诸神意志，当某个盗贼行会过于强横霸道，当恐怖巨龙横行乡野——每当这种时刻，复仇之誓的圣武士就会出现来拨乱反正。 立下此誓言的圣武士都遵循以下信条。 除恶务尽 直面不义 亡羊补牢
  features:
  - level: 3
    name: 复仇圣誓法术
    text: 你誓言具有的魔法使你始终准备着特定的法术。当你到达复仇之誓法术表中特定的圣武士等级时，你就始终准备着表中对应的法术。
  - level: 3
    name: 仇敌誓言
    text: 当你执行攻击动作时，你可以消耗一次你的引导神力次数，对一个你能看见的位于你 30 尺内的生物立下仇敌誓言。你在接下来 1 分钟内，对该生物的攻击检定具有优势。 如果在誓言结束前，该生物的生命值就降至 0，你可以将誓言的目标换为另一个你可见的位于你 30 尺的生物（无需动作）。
  - level: 7
    name: 坚韧复仇
    text: 你超自然的专注力使你可以拦截敌人撤退。你以借机攻击中命中一个生物时，可以将其速度降为 0，直到当前回合结束为止。且你在该攻击后立刻移动至多相当于你速度一半的距离，本次移动是原反应的一部分，且不引发借机攻击。
  - level: 15
    name: 复仇之魂
    text: 受你仇敌誓言影响的生物在发动一次攻击以后，无论是否命中，只要其位于你的触及内，你就能够立即以反应对其进行一次近战攻击。
  - level: 20
    name: 复仇天使
    text: 以一个附赠动作，你可获得下列的增益。持续 10 分钟，你也可以令其提前终止（无需动作）。此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗一个五环法术位（无需动作）重置此特性的使用权。 飞行： 你的背后生出灵体双翼，获得 60 尺的飞行速度，并且可以悬浮。 恐惧灵光： 每个在灵光范围内开始其回合的敌人，必须成功通过一个感知豁免，否则将陷入恐慌状态 1 分钟，或直到其受到伤害。此外，对被恐慌生物发动的攻击检定具有优势。
- key: ranger-beast-master
  cn: 驯兽师
  short: 驯兽师
  en: beast-master
  profession: ranger
  desc: 与原始野兽结缘 驯兽师，他们同这片大地有着深刻的共鸣，挥舞着原初魔法与超自然野兽形成了神秘的联系。
  features:
  - level: 3
    name: 原初伴侣
    text: 你魔法性的召唤出一只原初野兽，其力量来自于与你与自然的联系。你从大地野兽、海洋野兽和天空野兽中选择其一项作为它的数据卡。你决定原初野兽是何种动物，选择适合其数据卡的外形。无论你选择什么样的动物，这只野兽都带有原初之力的印痕，暗示着其超凡起源。 这只野兽对你和你的伙伴态度友善，并会听从你的命令。野兽会在你死亡时消失。 战斗中的野兽： 战斗中，原初野兽会在你的回合中行动。它能自主地移动或使用反应，但除非你在你的回合中以一个附赠动作命令它执行其他动作，它只会执行回避动作。命令的动作可以是其数据卡中列出的动作或是之外的其他动作。作为另一种命令方式，你也能在使用自己的攻击动作时，牺牲一次自己的攻击来命令野兽执行野兽打击动作。如果你陷入失能，野兽将会自主行动，而非仅使用回避动作。 复活或替换野兽： 如果野兽死亡不超过一小时，你能够以一个魔法动作，并消耗一个法术位使它复活。它会在一分钟后死而复生并恢复所有生命值。 每当你完成长休时，你都能召…
  - level: 7
    name: 特殊训练
    text: 当你以附赠动作命令你的原初行侣野兽执行动作时，你还可以令它以它自己的附赠动作执行疾走、撤离、回避或协助动作。 此外，每当你的野兽的攻击检定命中并造成伤害时，其伤害类型可以是力场伤害或其原本的伤害类型（由你选择）
  - level: 11
    name: 兽性狂怒
    text: 当你命令原初行侣执行野兽打击动作时，它能使用该动作两次。 此外，每个回合中，当它首次击中一个受到你的法术猎人印记影响的生物时，它可以额外造成一定的力场伤害，其数值等同于那个法术的额外伤害。
  - level: 15
    name: 法术共享
    text: 当你施展的法术指定了你自己作为目标，并且你的原初行侣正位于你 30 尺范围内时，你可以让该法术效应同时作用于你的原初行侣。
- key: ranger-fey-wanderer
  cn: 妖精漫游者
  short: 妖精漫游者
  en: fey-wanderer
  profession: ranger
  desc: 驾驭妖精的哀与乐 或来自一位至高妖精的恩惠，或是在妖精荒野中的一次奇遇，你的身侧因那次奇遇而有妖精的魔力缠绕。无论你是怎么得到你来自妖精的魔法的，你现在是一名妖精漫游者。你轻快的笑声为受压迫者们带来欣喜的希望，你英勇的技艺直击你敌人的恐惧，你所就的伟绩乃是妖精的喜悦，你散布的恐惧乃是妖精的愤怒。
  features:
  - level: 3
    name: 哀惧灵袭
    # 11 级起骰子从 1d4 变 1d6（原文写在同一条里，用 at 按等级覆盖）。
    # ⚠️ 原文是「每个生物每回合一次」，引擎按「攻击者每回合一次」记账 ——
    # 一回合打到多个目标时由 DM 裁定，不重复给。
    first_hit:
      dice: 1d4
      at:
        11: 1d6
      kind: 心灵
      needs: [weapon]
    text: 你能够使用来自妖精荒野中黑暗空洞的摄心魔法以强化你的武器攻击。当你用一把武器击中一个生物时，你可以对目标造成额外的1d4点心灵伤害。每个生物在每个回合只能够受到这一额外伤害一次。你的游侠等级达到11级时，这一额外伤害变为1d6。
  - level: 3
    name: 妖精漫游者法术
    text: 当你到达妖精漫游者法术表中特定的游侠等级时，你就始终准备着表中对应的法术。 你还获得了一种妖精祝福。你可以在下方精野之赐表中选择你的祝福或者随机决定它。
  - level: 3
    name: 妖冶娴都
    text: 每当你进行一次魅力检定时，你都可以在那次检定中获得等于你的感知调整值的加值（至少 +1）。 另外，你选择获得下列技能之一的熟练：欺瞒、表演或游说。
  - level: 7
    name: 妖思魅缕
    text: 妖精荒原的魔法护卫着你的心灵。你在对抗或终止魅惑或恐慌状态的豁免检定上具有优势。 此外，当你或位于你 120 尺内的一个你可见的生物，通过了一次对抗或终止魅惑或恐慌状态的豁免检定时，你可以用你的反应迫使位于你 120 尺内的另一个你可见的不同生物，进行一次对抗你法术豁免DC的感知豁免。豁免失败，目标则陷入魅惑或恐慌状态（由你选择）1 分钟。目标在其每回合结束时重复此豁免，豁免成功则结束此效应。
  - level: 11
    name: 精宸所与
    text: 你可以无需材料成分地施展妖精召唤术。同时，你可以免费施展这个法术一次而不需要消耗法术位，在你完成一次长休后，你重获免费施展该法术的能力。 每当你开始施展此法术时，都可以修改此法术使其无需专注。以此法施展时，此法术的持续时间将变为 1 分钟。
  - level: 15
    name: 雾行漫游
    text: 你可以免费施展迷踪步而不需要消耗法术位，次数等同于你的感知调整值次（最少 1 次），在完成一次长休后，你重获所有的已消耗的次数。 另外，每当你施展迷踪步时，你可以携带一个位于你 5 尺内你可见的自愿生物与你一同传送。那个生物会被传送到由你选择的，位于你的目标位置 5 尺内的一处未占据空间内。
- key: ranger-gloom-stalker
  cn: 幽域追踪者
  short: 幽域追踪者
  en: gloom-stalker
  profession: ranger
  desc: 利用阴影魔法制敌 幽域追猎者们以至暗之地为家，驾驭着来自堕影冥界的魔法与潜伏在黑暗中的敌人作战。
  features:
  - level: 3
    name: 恐惧伏击
    text: 你精通于伏击的恐怖技艺，并获得了以下增益。 伏击者之跃： 在每一场战斗的你的第一个回合的开始，你的速度增加 10 尺，直到那个回合结束。 恐惧打击： 当你用武器对生物攻击并命中时，你可以额外对目标造成2d6点心灵伤害。你在每回合中只能使用一次这个增益，你可以使用这一增益的次数等同于你的感知调整值（最低一次），并在完成一次长休后重获全部已消耗的使用次数。 先攻加值： 当你投掷先攻时，你可以在那次掷骰中加入你的感知调整值。
  - level: 3
    name: 幽域追踪者法术
    text: 当你到达幽域追猎者法术表中特定的游侠等级时，你就始终准备着表中对应的法术。
  - level: 3
    name: 阴影视野
    text: 你获得 60 尺黑暗视觉。如果你获得本特性时已拥有了黑暗视觉，那个黑暗视觉的范围增加 60 尺。 你还擅长避开依赖黑暗视觉的角色。完全身处黑暗期间，对于任何依靠黑暗视觉观察黑暗中的你的生物而言，你具有隐形状态。
  - level: 7
    name: 钢铁意志
    text: 你已经磨炼出了抵御精神影响的能力。你获得感知豁免熟练。如果你已经有这项熟练，你可以获得智力或者魅力豁免熟练（由你选择）来代替。
  - level: 11
    name: 追猎如风
    text: 你的恐惧打击造成的心灵伤害变为2d8。另外，当你使用恐惧伏击的恐惧打击特性时，你可以创造出以下的额外效应之一。 瞬息打击： 你可以用同一把武器，对位于原目标5尺范围内的另一生物再发动一次攻击，新目标必须处于你武器的触及或射程内。 群慌： 目标与位于目标10尺范围内的每个生物都必须通过一次对抗你法术豁免DC的感知豁免。若豁免失败，生物将会陷入恐慌状态，持续至你的下一回合开始。
  - level: 15
    name: 如影随形
    text: 当一个生物对你发动了一次攻击检定时，你能用反应对这次检定施加劣势。不管那次攻击命中或失手，你都能在那之后传送至你 30 尺范围内的一处未被占据的、你可见的空间。
- key: ranger-hunter
  cn: 猎人
  short: 猎人
  en: hunter
  profession: ranger
  desc: 保护自然与人民免于毁灭 你追逐猎物直到天涯海角，运用你的猎人的本领去保护自然与人民，使其不受灾祸的毁灭。
  features:
  - level: 3
    name: 猎人学识
    text: 你可以呼唤自然的力量以揭晓猎物的强弱。在一个生物被你的猎人印记标记的期间，你知道那个生物是否拥有任何免疫、抗性或易伤，并且能够得知其具体的项目是什么。
  - level: 3
    name: 猎杀技艺
    text: 你选择并获得以下特性选项之一。当你完成一次短或长休时，你可以将所选的选项替换为另一个。 巨像屠夫： 你强而有力的攻击可以击倒最强壮的对手。当你用武器命中生物时，如果该敌人生命值不满，则该武器额外对目标造成1d8点伤害。你每回合只能造成一次这种额外伤害。 灭族者： 每个你的回合一次，当你用武器进行攻击时，你可以用该武器对位于目标5尺内的另一生物发动另一次攻击。额外攻击的目标必须处于你武器射程或范围内，且是你这回合没有攻击过的目标。
  - level: 7
    name: 防守战术
    text: 你选择并获得以下特性选项之一。当你完成一次短或长休时，你可以将所选的选项替换为另一个。 冲出重围： 对你发动的借机攻击具有劣势。 多重防御： 当一个生物的攻击检定命中你时，该生物在本回合内对你进行的其他攻击检定具有劣势。
  - level: 11
    name: 高阶猎杀技艺
    text: 每回合一次，当你对被你的猎人印记所标记的生物造成伤害时，你可以对位于这个生物 30 尺范围内的一个你能看见的另一名生物，同样施加由猎人印记造成的额外伤害。
  - level: 15
    name: 高效防守战术
    text: 当你受到伤害时，你可以用你的反应使你获得对该伤害以及相同伤害类型的抗性, 直至当前回合结束。
- key: rogue-arcane-trickster
  cn: 诡术师
  short: 诡术师
  en: arcane-trickster
  profession: rogue
  desc: 利用奥术魔法强化潜行 有些游荡者会通过法术来进一步提高自己早已炉火纯青的潜行技艺，并学习各类魔法花招来辅助自己的行当。一些诡术师会利用自己的天赋去帮助自己偷盗或入室行窃，而还有一些诡术师则乐于将掌握的魔法化为恶作剧。
  features:
  - level: 3
    name: 法师之手诈术
    text: 当你施展法师之手时，你可以通过附赠动作施展，并且你能够使幽灵手变得隐形。你可以通过附赠动作控制幽灵手，并且你可以通过它进行敏捷（巧手）检定。
  - level: 3
    name: 施法
    text: 你学会了如何施展法术。施法规则见第七章。下文将详述如何将这些规则应用于诡术师。 戏法： 你习得三道法师戏法。法师之手以及法师法术列表中你选择的两道戏法（法师法术列表见法师职业部分）。推荐选择心灵之楔和次级幻象。 每当你获得一个游荡者等级时，你都能从你的非法师之手的戏法中选择其一替换为另一道你所选择的法师戏法。 当你的游荡者等级达到 10 时，你将学会一个自选的法师戏法。 法术位： 诡术师施法表显示了你可用于施展一环及以上法术的法术位数量。当你完成长休时，你重获所有已消耗的法术位。 一环及以上的准备法术： 你准备可供你以此特性施展的一环及更高环阶的法术列表。最初，选择三道一环法师法术。推荐选择魅惑类人、易容术和云雾术。 已准备法术数量会随你游荡者等级的提升而增加，如诡术师施法表中的准备法术一列所示。每当这一列的数字增加时，从法师法术列表中选择额外法术准备，直至已准备法术的数量与表格中的数字一致。你所选择法术的环阶必须是你所拥有法…
  - level: 9
    name: 诡术伏击
    text: 处于隐形状态期间，若你对一名生物施展法术，它在那个回合中为对抗该法术而进行的任何豁免检定都具有劣势。
  - level: 13
    name: 万能诡术
    text: 你获得了使用法师之手干扰敌人的能力。当你对一个生物使用诡诈打击中的摔绊选项时，你还可以对法师之手 5 尺内的另一个生物施加这个效果。
  - level: 17
    name: 法术窃贼
    text: 你获得了如何以魔法从其他施法者那里偷取有关如何施展某一法术的知识的能力。 当一个生物施展了一个目标是你或是其效应范围会影响你的法术后，你可以立刻使用你的反应来迫使该生物进行一次智力豁免。其豁免DC等同于你的施法DC。若豁免失败，你消除这个法术对你的影响，并且你将偷走使用这个法术的知识，但这个法术最低必须是一环并且你可以施展的更高等级的法术（不需要是法师法术）。接下来的八小时内，你准备了这个法术。同时该生物在此期间无法施展这个法术，直到八小时结束以后。 此特性一经使用，直至完成长休你都无法再次使用。
- key: rogue-assassin
  cn: 刺客
  short: 刺客
  en: assassin
  profession: rogue
  desc: 践行死亡的不法技艺 刺客专注于利用潜行、毒药和伪装来干净利落地歼灭敌人。一些踏上这条道路的游荡者成为了雇佣杀手、间谍或赏金猎人，但即使作为冒险者去面对千奇百怪的怪物，这个子职也仍然能够发挥同等惊人的潜能。
  features:
  - level: 3
    name: 刺客工具
    text: 你获得一套易容工具和一套毒药工具，并获得这些工具的熟练项。
  - level: 3
    name: 暗杀
    # 「先攻：你能够进行有优势的先攻掷骰」；惊扰突袭那条由 DM 按轮次裁定
    initiative_advantage: true
    text: 你精通于对目标发起奇袭，你获得以下增益： 先攻： 你能够进行有优势的先攻掷骰。 惊扰突袭： 每次战斗的第一轮中，你对任何还没有经历过自己回合的生物发动的攻击检定都具有优势。如果你在那一轮里命中并偷袭了任意目标，该目标将承受等同于你的游荡者等级的额外伤害，该伤害的类型与你的武器伤害类型一致。
  - level: 9
    name: 专业渗透
    text: 你是潜入渗透的专家，你熟练掌握了以下技巧来帮助自己的潜入： 模仿大师： 在你至少花费了一小时的时间来进行钻研后，你能够精准无误的模仿其他人的言语、笔迹或同时模仿以上两项内容。 机动瞄准： 你使用稳定瞄准特性时速度不会归零。
  - level: 13
    name: 淬毒武器
    text: 当你使用诡诈打击时，每当目标在对抗你的淬毒选项时豁免检定失败，它会受到额外2d6的毒素伤害。该伤害无视毒素抗性。
  - level: 17
    name: 致命一击
    text: 当你在战斗的第一轮命中并偷袭了某一目标时，该目标必须成功通过一次体质豁免（8 + 你的熟练加值 + 你的敏捷调整值），否则本次攻击将对该目标造成双倍的伤害。
- key: rogue-soulknife
  cn: 魂刃
  short: 魂刃
  en: soulknife
  profession: rogue
  desc: 以念为刃屠戮敌手 魂刃杀手们将意念化作刺杀敌人们的武器，割裂那些阻碍他们的物理和心灵障碍。这些游荡者们从内心之中发掘出灵能之力，并且引导灵能来协助他们的老本行。身为一名魂刃者，你的灵能可能从你还是个孩子的时候就一直伴随着你，直到你在面临冒险的压力时才显露潜能。或者你可能找到了一个隐居的灵能修士团，花了很多年的时间学习…
  features:
  - level: 3
    name: 灵能力量
    text: 你内心蕴含着一股灵能力量，这股能量表现为你拥有数枚灵能骰。你可以使用这些灵能骰来驱动你从这个子职中获得的特定心灵异能。下方的魂刃灵能骰列表展示了你在达到特定游荡者等级时会拥有多少颗灵能骰，该列表同样列出了骰子大小。 此子职中所有需要使用灵能骰的特性只能使用你从该子职获得的灵能骰。你在使用某些能力时需要消耗灵能骰，如异能描述中所述，如果某个异能在你的灵能骰全部消耗完后还需要你使用一个灵能骰，你就不能使用该异能。 你可以在完成短休时重获一枚已消耗的灵能骰，完成长休时重获所有已消耗的灵能骰。 在每次长休后你可以免费使用一次这个异能。除此之外，每次使用它你都得消耗一枚灵能骰。
  - level: 3
    name: 心灵之刃
    text: 你能将自己的心灵异能塑造为由灵能构成的闪亮刀刃。当你执行攻击动作或者进行一次借机攻击时，你能在空闲的手中塑造出心灵之刃，并使用它来进行攻击。这种魔法刀刃具有以下特性： 心灵之刃会在你进行一次近战或远程攻击后立刻消失，并且即使它造成伤害也不会留下任何痕迹。 当你使用心灵之刃攻击后的同一回合中，只要你的另一只手空闲，就能以一个附赠动作在那只手中塑造第二把心灵之刃，并再进行一次近战武器攻击或是远程武器攻击。此附赠攻击的伤害骰为1d4，而非1d6。
  - level: 3
    name: 灵振诀窍
    text: 如果你使用具有熟练的技能或工具进行一次属性检定但失败，你可以投掷灵能骰，并将掷骰结果加到检定结果中，这可能会让失败的检定变为成功。你只在掷骰结果让检定变为成功时才会消耗那颗灵能骰。
  - level: 3
    name: 心灵低语
    text: 你能够利用灵能在自己和他人之间建立起基于心灵感应的交流。以一个魔法动作，从可见的生物中选择一到至多等同于你熟练加值数量的生物，掷一枚灵能骰。你在投掷结果数的小时内，你选择的生物能够通过心灵感应与你进行交流，你也能通过心灵感应与他们进行交流。你们在发送或接收信息时（无需动作），你和选择生物之间的距离不可超过一里。生物可以随时终止心灵感应的链接（无需动作）。
  - level: 9
    name: 寻的攻击
    text: 如果你在使用心灵之刃进行攻击检定时没有命中目标，你可以掷一枚灵能骰，并将掷骰结果加到这次攻击检定中。如果这使攻击变为了命中，那枚灵能骰将被消耗。
  - level: 9
    name: 心灵传送
    text: 以一个附赠动作，你塑造一把心灵之刃，消耗并投掷一枚灵能骰，将心灵之刃投掷到至多距离灵能骰结果数字十倍尺数的一处可见的未占据空间内。你传送到目标位置，同时那把心灵之刃将消失。
  - level: 9
    name: 灵魂之刃
    text: 你现在可以将以下能力用于你的心灵之刃。
  - level: 13
    name: 灵能面纱
    text: 你可以编织一层灵能面纱来掩盖你。以一个魔法动作，你获得隐形状态持续至多 1 小时或直到你主动解除隐形（无需动作）。造成伤害或迫使一个生物进行豁免检定会导致隐形状态立刻结束。 此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗一枚灵能骰（无需动作）重置此特性的使用权。
  - level: 17
    name: 撕裂心智
    text: 你能让你的念刃直接切削一个生物的心智。当你使用念刃对一个生物造成偷袭攻击伤害时，你能迫使其进行一次感知豁免（8 + 你的熟练加值 + 你的敏捷调整值）。若豁免失败，目标将在陷入长达 1 分钟的震慑。被震慑的目标可以在他的回合结束时重复豁免，如果成功这一效应将结束。 此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗三枚灵能骰（无需动作）重置此特性的使用权。
- key: rogue-thief
  cn: 盗贼
  short: 盗贼
  en: thief
  profession: rogue
  desc: 追秘猎宝的经典冒险家 飞贼、宝藏猎人、探险家，你是一切经典冒险者形象的缩影。这个子职不仅提高了你的灵活与隐匿技术，还为你提供了探索古老遗迹的游荡技巧，使你永远能够最大化利用藏匿其中的魔法物品。
  features:
  - level: 3
    name: 快手
    text: 你可以通过附赠动作来进行下列行为中的一个： 巧手： 进行一次敏捷（巧手）检定来利用盗贼工具解开一个锁或解除陷阱，或是使用这个检定进行扒窃。 使用物件： 执行操作动作，或是执行魔法动作来使用一个要求该动作的魔法物品。
  - level: 3
    name: 梁上君子
    text: 你的训练使你擅长抵达那些难以到达的地方。你获得以下增益： 攀爬者： 你获得攀爬速度（等同于你的速度）。 跳跃者： 你的跳跃距离能由你的敏捷决定而不是你的力量决定。
  - level: 9
    name: 极效潜行
    text: 你获得以下诡诈打击选项。 无声袭击（花费：1d6）： 如果你通过执行躲藏动作获得了隐形状态，并且你在结束回合时仍然处于四分之三掩护或是全身掩护之后，那么本次攻击不会导致这个状态结束。
  - level: 13
    name: 使用魔法装置
    text: 你学会了如何最大化利用魔法物品。你获得以下增益： 同调： 你最多可以同时同调于四个魔法物品。 充能： 每当你使用一个魔法物品的消耗充能的特性时，投一个1d6，如果结果为6，本次使用不消耗充能。 卷轴： 你可以使用任何法术卷轴，并以智力作为你施展那个法术的施法关键属性。你可以稳定使用戏法或是一环的法术卷轴。如果这个法术卷轴记载了更高等级的法术，你必须通过一次成功的智力（奥秘）检定（10 + 该法术的等级）。检定成功时，你能够使用卷轴施展该法术。如果失败，卷轴化为尘埃。
  - level: 17
    name: 窃盗本能
    text: 你变的更加擅长伏击和快速脱离险境。每次战斗的第一轮里，你可以行动两个回合。你先以自己正常的先攻执行你的第一个回合的行动，再以先攻数值减 10 的先攻执行你的第二个回合的行动。
- key: sorcerer-aberrant-sorcery
  cn: 畸变术法
  short: 畸变
  en: aberrant-sorcery
  profession: sorcerer
  desc: 操弄非自然的灵能力量 某种异界的影响曾经用它的卷须将你的意识缠绕裹拢，给予了你灵能之力。如今，你能够使用这股力量触碰他人的内心，还能用它操控多元宇宙的魔法能量颠覆你周遭的世界。这种力量会从你身上如希望的灯塔一般照耀着旁人吗？抑或是使你成为恐惧之源，使他人得见你怪异的力量，受你的心灵所伤害呢？ 也许一股从星光位面吹来的…
  features:
  - level: 3
    name: 灵能法术
    text: 当你到达灵能法术表中特定的术士等级时，你就始终准备着表中对应的法术。
  - level: 3
    name: 传心谈话
    text: 你能够在自己与他人的意识中构建一道心灵感应的链接。以一个附赠动作，你可以选择 30 尺内一个你可见的生物创造这一链接。链接能使你与其能够通过心灵感应方式进行交流，但交流时，你们之间距离的里数不超过你的魅力调整值里（至少 1 里）。你们必须使用互相知晓的语言进行心灵交流，才能使其理解你通过心灵感应传达的话语。 心灵感应的链接持续等同于你术士等级的分钟数。这一链接在你与另一生物构建链接时提前结束。
  - level: 6
    name: 灵能术法
    text: 灵能法术特性中的一环或更高环阶的法术时，你可以改为使用等同于该法术环数数量的术法点而非消耗法术位施展该法术。你消耗术法点施放法术时，你无视该法术施法需要的言语成分或姿势成分。你同时无视该法术需要的不会消耗且未给出具体价值的材料成分。
  - level: 6
    name: 心灵防御
    text: 你获得心灵伤害的抗性。此外，你在避免和结束魅惑状态与恐慌状态的豁免检定上具有优势。
  - level: 14
    name: 血肉启示
    text: 你能够释放出潜藏在你内部扭曲的真实形态。以一个附赠动作，你使用 1 点或更多的术法点以魔法性地转变形态，持续 10 分钟。你每消耗 1 术法点，你便可以从下述内容中选择一项，在转变形态期间你同时获得你选择的每项效应的增益： 水栖适应： 你获得游泳速度（等同于你两倍的速度），且你能在水下呼吸。不止如此，你的脖子两侧会长出鳃、或鳃在耳后呈扇状翻出、或你的手指变成蹼趾、或是有卷曲的纤毛从你的衣服底下延展出来。 闪耀飞翔： 你获得飞行速度（等同于你的速度），并能悬浮。当你飞行时，你的皮肤表面流出发光的粘液、或是散发出异界的光芒。 识破隐形： 你能看见周围 60 尺内处于隐形状态的生物，前提是其对你来说不处于全身掩护。你的眼睛也会变成黑色、或是变成扭动的感官触须。 蠕行移动： 你的身体和你携带的装备都变得柔韧粘滑。你能够轻松穿过最窄1寸宽的狭窄空间而不用挤进去，且你可以消耗 5 尺移动力以脱离非魔法的束缚或受擒状态。
  - level: 18
    name: 扭曲爆裂
    text: 你能够释放出扭曲空间的异常现象。以一个魔法动作，你传送到 120 尺内你可见的一个未被占据的位置，然后你消失位置 30 尺内的每个生物必须进行一次对抗你施法DC的力量豁免，豁免失败将受3d10力场伤害并被立即拉向你原本的位置，并停在最靠近的一处未被占据的空间内，豁免成功只受半伤。 一旦你使用此特性，在完成一次长休前无法再次使用，除非你消耗5点术法点（无需动作）来恢复其使用次数。
- key: sorcerer-clockwork-sorcery
  cn: 时械术法
  short: 时械
  en: clockwork-sorcery
  profession: sorcerer
  desc: 引导寰宇的秩序之力 一股源自宇宙本身的秩序力量，从机械境或其他与之类似的钟表般高效的存在位面之中产生，并扩散到你的灵魂之中，使你充满了魔力。你或你宗族中的某个人也许已经卷入到魔冢这种居住在机械境的秩序生命的谋划之中。又或许，你的先祖甚至参与过魔冢长征。无论是何种起源，秩序的力量也许对旁人来说有些奇怪，但于你而言，它是…
  features:
  - level: 3
    name: 时械法术
    text: 当你到达时械法术表中特定的术士等级时，你就始终准备着表中对应的法术。 此外，你可以从秩序显迹表格中选择或掷骰决定一种你在施法时显现出与秩序之联系的方式。
  - level: 3
    name: 归复平衡
    text: 你与绝对秩序之位面的联系使你能重整混沌的时刻。当你 60 尺内一个你可见的生物即将带着优势或是劣势进行一次d20检定时，你可以用反应使这次检定免受优势或劣势的影响。 你能使用此特性的次数等同于你的魅力调整值（最少 1 次），你在完成一次长休后重获所有消耗的次数。
  - level: 6
    name: 律令之壁
    text: 你可以利用世界的均衡之力为一个生物激发闪烁的秩序之盾。以一个魔法动作，你可以消耗 1-5 点术法点来创造出一个环绕你或 30 尺内的一个可见生物的魔法屏障。屏障具有等同于你所消耗术法点数量的d8骰。当被守护的生物受到伤害时，其可以消耗任意数量的这些d8骰，投掷它们，并使该伤害减少掷出结果合计的数值。 此屏障将一直保持存在，直到你完成一次长休或直至你再次使用该特性。
  - level: 14
    name: 序列意识
    text: 你获得了将你的意识和机械境无尽的计算达成同步的能力。以一个附赠动作，你可以在 1 分钟内进入此种状态。在此期间，对你进行的攻击免受优势的影响，且每当你进行一次D20 检定时，你可以将d20掷出的 9 或以下的骰值视为 10。 此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗 5 点术法点（无需动作）重置此特性的使用权。
  - level: 18
    name: 时械矩阵
    text: 你召唤出秩序的精魂以抹除周遭的混乱。以一个魔法动作，你在以你为源点的 30 尺立方空间范围内召唤出一些精魂。这些精魂看起来像是魔冢或你选择的其他构装，其没有实体也无法被摧毁，并在消失前使立方范围内产生以下效应。此特性一经使用，直到完成一次长休前都不能再次使用。你也可以消耗 7 点术法点（无需动作）以恢复此特性的使用次数。 治愈： 精魂合计提供至多恢复 100 生命值，由你随意分配给范围内任意数量的生物。 修复： 范围内损坏的物件将被立即修复。 破法： 你选择范围内任意数量的生物或物件，其承受的任何六环或以下的法术结束。
- key: sorcerer-draconic-sorcery
  cn: 龙族术法
  short: 龙族血脉
  en: draconic-sorcery
  profession: sorcerer
  desc: 吐纳巨龙魔法 你的天生魔法来自于巨龙的赠礼。也许一条濒死的远古龙将它的一部分魔力赐予了你或你的祖先。你也可能从满溢着巨龙魔法的某处地点吸收了魔力。又或者，你拿着一件从巨龙宝库中取得的宝藏，它吸收了部分龙族魔力。又或者，你只是有一位龙族先祖。
  features:
  - level: 3
    name: 龙族血脉
    text: ''
  - level: 3
    name: 龙族法术
    text: 当你到达龙族法术表中特定的术士等级时，你就始终准备着表中对应的法术。
  - level: 3
    name: 龙族体魄
    text: 魔法在你的体内流动，外化为龙族赠礼体现出的生理特质。你的生命值上限提升 3，此后每提升一个术士等级，都将再次提升1。 你部分皮肤覆盖着龙鳞样式的柔鳞。未着装护甲时，你的基础护甲等级等于 10 + 你的敏捷调整值 + 你的魅力调整值。
  - level: 6
    name: 元素亲和
    text: 你的龙族魔法与龙族相关的伤害类型有较强的亲和力。选择以下伤害类型之一：强酸、寒冷、火焰、闪电或毒素。 你获得对所选伤害类型的抗性，且当你施展造成那种伤害的法术时，你可以将你的魅力调整值加到那个法术的其中一次伤害掷骰中。
  - level: 14
    name: 龙翼
    text: 以一个附赠动作，你可以在背后张开一对龙翼。龙翼持续 1 小时，若你选择将其解散（无需动作）则会提前终止，在龙翼持续期间你获得 60 尺飞行速度。 此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗 3 点术法点（无需动作）重置此特性的使用权。
  - level: 18
    name: 龙伴
    text: 你可以无需材料成分施展龙类召唤术。你可以无需法术位施展它一次，随后你在完成一次长休后重获以此法施展它的能力。 每当你开始施展此法术时，都可以修改此法术使其无需专注。以此法施展时，此法术的持续时间将变为 1 分钟。
- key: sorcerer-wild-magic-sorcery
  cn: 狂野术法
  short: 狂野魔法
  en: wild-magic-sorcery
  profession: sorcerer
  desc: 释放混沌魔力 你的天生魔法来源于创生秩序之下的混沌。你或者你的祖先可能通过一道通往其他位面，如混沌海或元素位面的传送门暴露于原生魔法之下。也许你被妖精祝福，或是被恶魔标记。又或者，你的魔法毫无征兆地偶然出现了。无论来源为何，这种魔法在你体内翻涌，等待着释放。
  features:
  - level: 3
    name: 狂野魔法
    text: ''
  - level: 3
    name: 混沌之潮
    text: 你可以驾驭机运的力量，以获得一次自身具有优势的D20 检定。你必须在掷出d20之前决定是否使用此特性。此特性一经使用，你必须使用法术位施展一道术士法术、或完成长休后才能再次使用。 如果你在完成长休前使用法术位施展了术士法术来恢复特性，则你自动于狂野魔法浪涌表上掷骰。
  - level: 3
    name: 狂野魔法浪涌
    text: 你施法时会释放出未经塑造的魔法浪涌。一回合一次，你每次消耗法术位施展一道术士法术后，可以立刻骰一次1d20。如果你骰出 20，则在狂野魔法浪涌表上掷骰以确定随机魔法效应。 若该效果是一道法术，则其因过于狂野而无法受你的超魔法影响。
  - level: 6
    name: 扭曲幸运
    text: 你获得用你的狂野魔法扭曲命运的能力。当一个你能看见的生物投掷d20进行D20 检定时，你可以在掷骰完成之后立即用一个反应并消耗 1 术法点来骰一次1d4，并将结果用作加值或减值（由你决定）加到该d20的骰值结果中。
  - level: 14
    name: 掌控混沌
    text: 你获得了对狂野魔法浪涌的一定控制。每当你掷骰狂野魔法浪涌表格时，你可以掷骰两次并使用任一数值。
  - level: 18
    name: 驯服浪涌
    text: 你使用法术位施展一道术士法术之后，可以立即创造一种从狂野魔法浪涌表中选择的效应而非在其上掷骰。你可以选择表中任何除了最后一行的效应，且如果你选择的效应包含掷骰，则你必须掷骰。 该特性一经使用，则直至你完成一次长休之前，都无法再次使用。
- key: warlock-archfey-patron
  cn: 至高妖精宗主
  short: 至高妖精
  en: archfey-patron
  profession: warlock
  desc: 与喜怒无常的妖精交易 你的契约从妖精荒野，神秘的妖精国度处取得力量。当你选择此子职时，你可能与某个强大的至高妖精签订了契约，比如霜冻亲王；薄暮王庭之主，空与黑暗女王；仲夏王庭的泰坦尼亚，或是一位远古鬼婆。你可能是与众多妖精们共处，结成一道好感与人情交织的复杂网络。不管你的宗主是谁，祂们的行为往往都难以理解，有时甚至不…
  features:
  - level: 3
    name: 至高妖精
    text: ''
  - level: 3
    name: 至高妖精法术
    text: 宗主赐予的魔法使你始终准备着特定的法术。当你到达至高妖精法术表中特定的魔契师等级时，你就始终准备着表中对应的法术。
  - level: 3
    name: 妖精步伐
    text: 你的宗主授予你在位面的边界之间穿行的能力。你可以无需消耗法术位地施展迷踪步，次数等于你的魅力调整值（最少 1 次），并在完成一次长休时重获所有已消耗的次数。 此外，每当你施展该法术时，你都可以选择造成下列额外效应之一： 复苏步伐： 在你传送之后，你或一个你可见的位于你 10 尺内的生物立刻获得1d10临时生命值。 嘲弄步伐： 位于你传送前的空间 5 尺内的生物必须成功通过一次对抗你法术豁免DC的感知豁免，否则其在对除你之外的生物发动攻击检定时具有劣势，直至你的下一回合开始。
  - level: 6
    name: 雾隐遁行
    text: 当你受到伤害时，你可以用反应施展迷踪步。 此外，你的妖精步伐获得以下选项。 无踪步伐： 你获得隐形状态，持续到你的下一回合开始或你进行攻击检定、造成伤害、或是施展一道法术之后。 惊惧步伐： 位于你传送前或传送后的空间（由你选择）5 尺内的生物必须进行一次对抗你法术豁免DC的感知豁免，豁免失败则受到2d10心灵伤害。
  - level: 10
    name: 斗转星移
    text: 你的宗主教会了你如何保护自己的心和身。你获得对魅惑状态的免疫。 此外，当一个你能看见的敌人的攻击检定命中你后，你可以立刻使用反应令该次攻击的伤害减半（向下取整），且你可以迫使攻击者进行一次对抗你法术豁免DC的感知豁免，豁免失败则会受到一定的心灵伤害，具体数值等同于你本次承受的实际伤害。此反应一经使用，直至完成长休你都无法再次使用。你也可以消耗一个契约魔法法术位（无需动作）来重置此反应的使用权。
  - level: 14
    name: 醉心魔法
    text: 你的宗主赋予你将魔法与传送之力编织在一起的能力。当你以一个动作消耗法术位施展一道幻术或惑控法术时，你可以无需法术位地立刻施展迷踪步作为该动作的一部分。
- key: warlock-celestial-patron
  cn: 天界宗主
  short: 天界
  en: celestial-patron
  profession: warlock
  desc: 呼唤天堂诸界之伟力 你的契约从众上层位面，极乐永驻之地处取得力量。当你选择此子职时，你可能与一位至高天、一条羽蛇、一只斯芬克斯、一匹独角兽、或其他天界存在达成了协议。亦或是你结识了众多与你目的一致的天界存在。你的契约令你沐浴在照亮多元宇宙的圣洁辉光之下。
  features:
  - level: 3
    name: 天界法术
    text: 宗主赐予的魔法使你始终准备着特定的法术。当你到达天界法术表中特定的魔契师等级时，你就始终准备着表中对应的法术。
  - level: 3
    name: 治愈之光
    text: 你获得了引导天界能量以治愈伤口的能力。它是一个有着 1 + 你的魔契师等级枚d6骰的骰池，用以施展你的治愈能力。 以一个附赠动作，你可以消耗骰池中的任意数量的骰子，来治疗你自己或一个你可见的位于你 60 尺内的生物。每次你能消耗的最大骰子数量等于你的魅力调整值（最少 1 枚）。投掷全部被消耗骰子，这些骰值相加的总值即为所能恢复的生命值。当你完成一次长休时，你的骰池将重获所有已消耗的骰子。
  - level: 6
    name: 光耀之魂
    text: 你与你天界宗主的链接允许你成为光耀能量的渠道。你获得对光耀伤害的抗性。每回合一次，当一个你施展的法术造成光耀伤害或火焰伤害时，你可以将你的魅力调整值加到该法术对其中一个目标所造成的伤害上。
  - level: 10
    name: 天界韧性
    text: 每当你使用秘法回流，或是完成一次短或长休后，你都会获得一定的临时生命值。其数值等于你的魔契师等级 + 你的魅力调整值。此外，在你获得该临时生命值时，你还可以选择至多五个你可见的生物。这些生物也会获得等同于你魔契师等级的一半 + 你的魅力调整值的临时生命值。
  - level: 14
    name: 灼光复仇
    text: 当你或位于你 60 尺内的一名盟友将要进行一次死亡豁免检定时，你可以释放出一道光能来拯救那名生物。那名生物恢复等于其生命值上限一半的生命值，且可以选择结束自身的倒地状态。之后，每个由你选择的位于那名生物 30 尺内的生物都将受到2d8 + 你的魅力调整值的光耀伤害，并陷入目盲状态直至当前回合结束。 此特性一经使用，直至完成长休你都无法再次使用。
- key: warlock-fiend-patron
  cn: 邪魔宗主
  short: 邪魔
  en: fiend-patron
  profession: warlock
  desc: 与下层位面之物签订契约 你的契约从众下层位面——诸类邪魔之乡那里取得力量。当你选择此子职时，你可能完成了一次交易——对方可能是一位恶魔领主，诸如狄魔高根，奥喀斯；或是一位大魔鬼，诸如阿斯蒙蒂斯；亦可能是一位极为强大的深狱炼魔，巴洛炎魔，尤格罗斯魔，甚至是夜鬼婆。无论如何，你的宗主的目标都是邪恶的——邪魔们追求着世间万…
  features:
  - level: 3
    name: 黑暗赐福
    text: 当你将一个敌人的生命值降至 0 时，你获得等于你的魅力调整值 + 你的魔契师等级的临时生命值（最低为 1临时生命值）。而若其他人将一个位于你 10 尺内的你的敌人的生命值降至 0 时，你也会获得此增益。
  - level: 3
    name: 邪魔法术
    text: 宗主赐予的魔法使你始终准备着特定的法术。当你到达邪魔法术表中特定的魔契师等级时，你就始终准备着表中对应的法术。
  - level: 6
    name: 黑暗强运
    text: 你可以呼唤你的宗主将命运改写为对你有利的方向。当你进行属性检定或豁免检定时，你可以使用该特性为此次掷骰增添一个1d10骰。你可在看到掷骰结果后，其结果生效前使用该特性。 你可以使用此特性的次数等于你的魅力调整值（最少 1 次），但你在一次检定中只能使用此特性一次。你在完成一次长休后恢复所有已消耗的次数。
  - level: 10
    name: 邪魔体魄
    text: 每当你完成一次短或长休时，选择一种除力场之外的伤害类型。直到你以此特性选择另外一种伤害类型前，你都具有对所选伤害类型的抗性。
  - level: 14
    name: 直坠噩梦
    text: 每回合一次，当你以攻击检定命中一个生物时，你可以将目标瞬间传送并拉入下层位面。目标必须进行一次对抗你法术豁免DC的魅力豁免，豁免失败则该生物立刻消失并坠入如同噩梦一般的景色中。若目标并非邪魔，则它会受到8d10点心灵伤害。目标还会陷入失能状态直至你的下一回合结束，此时目标返回先前所占据的空间、或是最近的未被占据空间。 此特性一经使用，直至完成长休你都无法再次使用。你也可以消耗一个契约魔法法术位（无需动作）来重置此特性的使用权。
- key: warlock-great-old-one-patron
  cn: 旧日支配者宗主
  short: 旧日支配者
  en: great-old-one-patron
  profession: warlock
  desc: 洞见不可名状的存在与知识 当你选择此子职时，你可能缚身遥远国度中的不可名状之存在，或是只在传说中出现过的失落古神——诸如潜伏者关纳德；受缚之神萨瑞兹顿；归来者扎贡；暗夜巨蛇丹德尔；或是伟大的克苏鲁。或者，你靠着骇异的学识祈唤众多此等存在之名，并择取一位，与之结合。此等存在行为无法让凡人理解，这些旧日支配者甚至可能对你…
  features:
  - level: 3
    name: 唤醒心灵
    text: 你能够在自己与他人的意识中构建一道心灵感应的链接。以一个附赠动作，你可以选择 30 尺内一个你可见的生物创造这一链接。链接能使你与其能够通过心灵感应方式进行交流，但交流时，你们之间距离的里数不超过你的魅力调整值里（至少 1 里）。你们必须使用互相知晓的语言进行心灵交流，才能使其理解你通过心灵感应传达的话语。 这道心灵连结持续等于你魔契师等级的分钟。它也会在你使用此特性形成另一道心灵连结时提前结束。
  - level: 3
    name: 旧日支配者法术
    text: 宗主赐予的魔法使你始终准备着特定的法术。当你到达旧日支配者法术表中特定的魔契师等级时，你就始终准备着表中对应的法术。
  - level: 3
    name: 心灵法术
    text: 当你施放一个造成伤害的魔契师法术时，你可以将其伤害类型改为心灵。此外，当你施放一个属于惑控或幻术的魔契师法术时，你可以无需言语或姿势成分进行施放。
  - level: 6
    name: 锐眼斗士
    text: 当你用唤醒心灵与一个生物形成心灵连结时，你可以迫使对方进行一次对抗你法术豁免DC的感知豁免。若豁免失败，则该生物在连结期间对你进行的攻击检定具有劣势，而你对它进行的攻击检定具有优势。 一旦你使用了此特性，除非你消耗一个契约魔法法术位（无需动作）来复原其使用次数，否则你无法再次使用它，直到你完成一次短或长休。
  - level: 10
    name: 骇异恶咒
    text: 你的异界宗主给予你强大的诅咒之力。你始终准备着脆弱诅咒法术。当你施展脆弱诅咒并选择了一项属性时，目标在法术持续时间内还会在以这项属性进行的豁免上具有劣势。
  - level: 10
    name: 思维之盾
    text: 除非获得你的允许，否则你的思维无法被心灵感应或者其他手段阅读。此外你还具有对心灵伤害的抗性，且每当一个生物对你造成心灵伤害时，该生物将受到与你承受的同等的伤害。
  - level: 14
    name: 创造奴仆
    text: 当你施展异怪召唤术时，你可以修改此法术使其无需专注。以此法施展时，此法术的持续时间将变为 1 分钟，且召唤来的异怪拥有等于你魔契师等级 + 你的魅力调整值的临时生命值。 此外，该异怪在每个回合中第一次命中一个被你的脆弱诅咒影响的生物时，该异怪会对目标额外造成等于此法术附加伤害的心灵伤害。
- key: wizard-abjurer
  cn: 防护师
  short: 防护师
  en: abjurer
  profession: wizard
  desc: 庇护同伴，放逐敌人 你对魔法的研究集中在阻挡、驱逐和保护的法术上——结束有害影响、消除邪恶影响和保护弱者。防护师能够驱逐恶灵、于重要地点防范魔法窥视、关闭通往其他存在位面的门扉。防护师对冒险队伍非常有价值，因为他们能够从各种敌对魔法和其他攻击中保护同伴。
  features:
  - level: 3
    name: 防护学者
    text: 从防护学派的法师法术列表中选择两道不高于二环的法术，并将其免费加入你的法术书中。 此外，每当你在本职业中获得一个新环阶的法术位时，你都能免费将一道法师法术列表中的防护学派法术加入你的法术书中。你所选的法术都必须是你当前拥有法术位的环阶。
  - level: 3
    name: 奥术守御
    # 结界上限 = 法师等级 ×2 + 智力调整值；受伤时**抗性结算之后**由它先吸收。
    # 建过之后只回血（每次回环阶 ×2）、不重建，长休才消失（见 card.create_ward）。
    ward: true
    text: 你可以在自己周围编织魔法来保护自己。当你消耗法术位施展一道防护学派法术时，你能同时使用该法术的一缕魔力为自己创建一个魔法结界，该结界会持续至你完成一次长休。该结界的生命值上限等同于你法师等级的两倍加上你的智力调整值。每当你受到伤害时，结界会代替你受到此伤害，如果你具有任何抗性或易伤，则先为伤害应用抗性和易伤后再计算结界生命值减损。如果该伤害会使结界的生命值降至 0，你将会受到溢出部分的伤害。当结界的生命值为 0 时，它无法吸收伤害，但其魔力仍然存在。 每当你消耗法术位施展一道防护学派法术时，结界就会恢复等同于该法术位环阶两倍的生命值。此外，你也能够以一个附赠动作，消耗一个法术位使结界恢复等同于所消耗法术位环阶两倍的生命值。 结界一经创建，直至你完成一次长休都无法再次被创建。
  - level: 6
    name: 投射守御
    text: 当 30 尺内一个你可见的生物受到伤害时，你可以用你的反应让你的奥术守御吸收此次伤害。如果该伤害使结界的生命值降为 0，则被保护的生物将承受所有剩余伤害。如果被保护的生物有任何抗性或易伤，则应在计算结界生命值承伤之前先结算抗性和易伤。
  - level: 10
    name: 破法者
    text: 你始终准备着法术法术反制和解除魔法。此外，你能够以一个附赠动作施展解除魔法，且你能在其属性检定中加入你的熟练加值。 你消耗法术位施展其中任意一道法术时，若该法术未能成功阻止法术施展或未能成功解除法术效应，则你用于施展法术反制或解除魔法的法术位不会被消耗。
  - level: 14
    name: 法术抗性
    # 两条：对抗法术的豁免有优势（走 _target_save 的 magical 分支）、
    # 法术造成的伤害减半（走 apply_damage 的 spell 分支，抗性之后结界之前）
    spell_save_advantage: true
    spell_resistance: true
    text: 你抵抗法术时进行的豁免检定具有优势，且你对法术造成的伤害具有抗性。
- key: wizard-diviner
  cn: 预言师
  short: 预言师
  en: diviner
  profession: wizard
  desc: 探究多元宇宙之秘 那些寻求对过去、现在和未来有更清晰了解的人会寻求预言师的建议。作为一位预言师，你致力于揭开空间、时间与意识的面纱。你努力掌握的法术囊括识别能力、千里眼、超自然学识和预警等内容。
  features:
  - level: 3
    name: 预言学者
    text: 从预言学派的法师法术列表中选择两道不高于二环的法术，并将其免费加入你的法术书中。 此外，每当你在本职业中获得一个新环阶的法术位时，你都能免费将一道预言学派的法师法术加入你的法术书中。你所选的法术都必须是你当前拥有法术位的环阶。
  - level: 3
    name: 预兆
    text: 预知未来的片段开始在你意识中闪过。每当你完成一次长休时，掷2次D20 检定并记录其结果。你能用其中一个预言骰替换任何你或一个你能看见的生物进行的D20检定。你必须在检定进行前选择这样做，且你每回合只能以这种方式替换一次检定。 每个预言骰只能被使用一次。当你完成一次长休时，你失去所有未消耗的预言骰。
  - level: 6
    name: 预言专家
    text: 施展预言学派法术对你来说是如此容易，以至于其只会占用你施法努力中的一小部分。你消耗法术位施展一个环阶为二环或更高的预言学派法术时，可以恢复一个已消耗的法术位。所恢复的法术位环阶必须低于你正施展的预言学派法术，且不高于五环。
  - level: 10
    name: 天眼通
    text: 你可以增强你的察觉能力。以一个附赠动作，从以下增益中选择其一，其会持续至你开始一次短或长休。此特性一经使用，直至完成短或长休你都无法再次使用。 黑暗视觉： 你具有 120 尺黑暗视觉。 高等通晓： 你可以读懂任何语言。 识破隐形： 你能不消耗法术位地施展法术识破隐形 。
  - level: 14
    name: 高等预兆
    text: 你梦中的景象更为清晰地在你意识中描绘出了将要发生的一切。为你的预兆 特性掷3次d20，而不是2次。
- key: wizard-evoker
  cn: 塑能师
  short: 塑能师
  en: evoker
  profession: wizard
  desc: 创造炸裂的元素特效 你专注于研习以魔力创造威力惊人的元素力量，诸如苦寒、灼焰、惊雷、汲电和烈酸。一些塑能师会接受军队的雇佣，充当从远处轰炸敌人的炮兵。其他人以其惊人力量保护弱小，另一些人则作为冒险者寻求自身的利益。
  features:
  - level: 3
    name: 塑能学者
    text: 从塑能学派的法师法术列表中选择两道不高于二环的法术，并将其免费加入你的法术书中。 此外，每当你在本职业中获得一个新环阶的法术位时，你都能免费将一道法师法术列表中的塑能学派法术加入你的法术书中。你所选的法术都必须是你当前拥有法术位的环阶。
  - level: 3
    name: 强力戏法
    text: 你造成伤害的戏法甚至能影响到本可免受戏法效应影响的生物。当你施展一道戏法，其攻击检定失手，或目标对抗你戏法的豁免成功时，它仍会受到一半伤害（若有），但不会受到该戏法的其他效应影响。
  - level: 6
    name: 法术塑形
    text: 你的塑能学派法术作用范围里可以保留一小部分相对安全的区域。当你施展一个会影响你可见的其他生物的塑能学派法术时，你能从中指定数量等同于 1 + 该法术环阶的生物。被指定的生物进行对抗该法术的豁免时将直接成功，且如果法术在豁免成功后仍然造成一半的伤害，这些生物不会承受任何伤害。
  - level: 10
    name: 强效塑能
    text: 当你施展一道法师法术列表里的塑能学派法术时，你能将你的智力 调整值加入该法术的其中一次伤害掷骰中。
  - level: 14
    name: 超限导能
    text: 你能增强你法术的力量。当你用一个一至五环的法术位施展一个会造成伤害的法师法术时，你能在施展它的回合中令其造成的伤害取最大值。 你首次这么做时不会承受任何负面效应。但如果你在完成一次长休前再次使用该特性，则你会在施展法术后立即受到每环阶2d12暗蚀伤害。该伤害无视任何抗性或免疫。 你在完成一次长休前每多使用此特性一次，每环阶造成的伤害就提升1d12。
- key: wizard-illusionist
  cn: 幻术师
  short: 幻术师
  en: illusionist
  profession: wizard
  desc: 编织精妙的欺瞒法术 你专精于能扰乱感官、迷惑心灵的魔法，而你创造的幻象足够以假乱真。
  features:
  - level: 3
    name: 幻术学者
    text: 从幻术学派的法师法术列表中选择两道不高于二环的法术，并将其免费加入你的法术书中。 此外，每当你在本职业中获得一个新环阶的法术位时，你都能免费将一道法师法术列表中的幻术学派法术加入你的法术书中。你所选的法术都必须是你当前拥有法术位的环阶。
  - level: 3
    name: 强化幻术
    text: 你施展幻术学派法术时无需言语成分，且若你施展的幻术学派法术的施法距离不小于10尺，则其施法距离增加60尺。 你同时知晓次级幻象戏法。如果你已经知晓了此戏法，则你习得另一道你选择的法师戏法。此戏法不计入你的已知戏法数。当你施展次级幻象时，可以在一次施法中同时创造出声音和影像，并且你能以一个附赠动作施展它。
  - level: 6
    name: 魅影生物
    text: 你始终准备了野兽召唤术和妖精召唤术。你施展其中任意一道法术时，可以选择将其学派变为幻术学派，这会使召唤出的生物变得虚幻。你可以不消耗法术位地施展这两道法术的幻术版本各一次，但无需法术位地施展这两道法术会使其召唤出的生物只有一半生命值。一旦你无需法术位地施展了其中任意一道法术，直至完成长休你都无法再以此法施展那道法术。
  - level: 10
    name: 幻影化形
    text: 当一名生物对你进行的一次攻击检定命中时，你可以使用你的反应在攻击者与你之间插入幻象分身。这次攻击对你自动失手，随后幻象分身消失。 此特性一经使用，直至完成短或长休你都无法再次使用。你也可以消耗一个二环或更高环阶的法术位（无需动作）重置此特性的使用权。
  - level: 14
    name: 亦真亦幻
    text: 你习得借由将暗影魔法编入你的幻术，从而使其获得半真实效果的秘密。当你用法术位施展一道幻术学派法术时，你能选择一个属于幻象一部分的非活化非魔法物件，并让该物件化作真实。你可以在法术持续过程中在自己的回合以一个附赠动作这样做。该物件将在接下来 1 分钟内保持真实，它在此期间无法造成伤害或赋予任何状态。例如，你可以创造一座横跨峡谷的桥梁幻象，而后将之化作真实，使你的队友能从桥上跨越峡谷。
