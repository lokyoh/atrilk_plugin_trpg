# 施法者每级的法术数量（PHB 2024 第七章「准备法术」+ 各职业表）。
#
# 由 scripts/extract_spell_progression.py 从 5etools XPHB 数据生成，别手改。
# 数组都是 **20 项**，第 N 项 = 第 N 级。
#
# - cantrips：已知戏法数
# - prepared：可准备的法术数（**2024 八个施法职业全部是准备制**，
#   区别只在「何时可改 / 一次换几个」）
# - spellbook：法术书条目数（只有法师；累计值，建卡时全都要挑）
# - change：rest_long = 长休时改，level = 升级时改
# - swap：any = 一次换任意多个，one = 一次换一个

