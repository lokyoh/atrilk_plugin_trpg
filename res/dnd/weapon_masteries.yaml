# 武器精通词条（PHB 2024 第六章）
#
# 8 种词条的权威定义；每件武器的「精通」取自武器表的「精通」列
# （见 res/dnd/equipment.yaml 里每件武器的 mastery 字段）。
# 拥有武器精通特性的职业（野蛮人 / 战士 / 圣武士 / 游侠 / 游荡者）才能用这些词条；
# 引擎目前只记录、不自动结算，效果由 DM 按这里的描述裁定。

- key: sweep
  cn: 横扫
  desc: 近战命中一个生物时，可用该武器对 5 尺内、同样处于你触及范围内的另一生物再进行一次近战攻击（伤害不含属性调整值，除非为负）。每回合限一次。

- key: graze
  cn: 擦掠
  desc: 以该武器的攻击检定失手时，仍对目标造成等同于本次攻击所用属性调整值的伤害（伤害类型同武器，只随属性调整值增长）。

- key: nick
  cn: 迅击
  desc: 由轻型词条提供的额外攻击可当作攻击动作的一部分（而非附赠动作）发动。每回合仍只能进行一次轻型额外攻击。

- key: push
  cn: 推离
  desc: 命中体型不超过大型的生物时，可将其从你身边直线推离至多 10 尺。

- key: sap
  cn: 削弱
  desc: 命中一个生物时，直到你的下一回合开始前，该生物的下一次攻击检定具有劣势。

- key: slow
  cn: 缓速
  desc: 命中并造成伤害时，可将目标速度减少 10 尺，直到你的下一回合开始。多次命中不会使减速超过 10 尺。

- key: topple
  cn: 失衡
  desc: 命中一个生物时，可迫使其进行体质豁免（DC 8 + 本次攻击调整值 + 熟练加值）。失败则陷入倒地。

- key: vex
  cn: 侵扰
  desc: 命中并造成伤害时，直到你的下一回合结束前，你对该生物的下一次攻击检定具有优势。
