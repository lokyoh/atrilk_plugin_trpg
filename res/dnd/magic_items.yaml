- {cn: "龙鳞甲", en: "Dragon Scale Mail", rarity: 未标注, kind: 护甲, attunement: "需同调", page: , text: "共有十种龙鳞甲（黑 / 蓝 / 绿 / 白 / 红 / 黄铜 / 青铜 / 赤铜 / 银 / 金），掷表掷出「龙鳞甲」时由你选龙种：AC 与龙特性随龙种变化，对同龙种的 breath 有抗性。查具体条目用 query_data(table=item, name=黑龙鳞甲)。", aliases: ["Dragon Scale Mail", "龙鳞甲"], loot_tables: []}
- {cn: "易伤护甲", en: "Vulnerable Armor", rarity: 未标注, kind: 护甲, attunement: "", page: , text: "共有三种变体（钝击 / 穿刺 / 挥砍），由你选伤害类型：着装期间对该类型具抗性，但对其它两种类型具易伤。", aliases: ["Vulnerable Armor", "易伤护甲"], loot_tables: []}
