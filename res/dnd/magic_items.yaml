- {cn: "蓝色尖晶石", en: "Blue Spinel", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗深蓝色的宝石。", aliases: ["Blue Spinel", "蓝色尖晶石"], loot_tables: []}
- {cn: "炸弹", en: "Bomb", rarity: 未标注, kind: 爆炸物, attunement: "", page: 73, text: "以一个动作，你可以点燃炸弹并将其扔到至多60尺远的一点。炸弹将于该点爆炸，每个位于该点附近5尺半径球状内生物都必须进行一次DC 12的敏捷豁免，豁免失败者受到3d6火焰伤害，豁免成功则伤害减半。", aliases: ["Bomb", "炸弹"], loot_tables: []}
- {cn: "圣洁之书", en: "Book of Exalted Deeds", rarity: 神器, kind: 奇物, attunement: "需同调", page: 237, text: "多元宇宙中所有善行的权威论述，《崇高行为之书》在许多宗教中占据着重要地位。这本书并非专门针对某个特定信仰的经文，其作者们在书中填满了他们对真正美德的个人愿景，为战胜邪恶提供指导。\n《崇高行为之书》很少在一个地方停留。一旦这本书被阅读，它就会消失到多元宇宙的某个角落，在那里它的道德指导可以给一个濒临危险的世界带来希望。尽管有人试图复制这部作品，但这样做的努力未能捕捉到它的魔法本质，也无法将它提供给那些心地纯洁、意志坚定的人的好处翻译出来。\n一个沉重的扣子，被打造成天使翅膀的形状，保护着书的内容安全。只有与书共鸣的生物才能释放扣住书的扣子。一旦书被打开，共鸣的生物必须花费80小时阅读和研究这本书，以消化其内容并获得其好处。\n其他生物翻阅这本书的开放页面可以阅读文本，但无法领悟更深层的含义，也无法获得任何好处。一个恶魔、亡灵或下层位面的神的仆从试图阅读这本书时，会受到24d6点光耀伤害。这种伤害无视抗性和免疫，并且无法通过任何方式减少或避免。一个生物如果因此伤害降至0点生命值，会瞬间消失并被摧毁，留下它的财物。然后这本书也会消失，该生物对它的同调结束。\n圣洁之书赋予的增益仅在你努力行善时持续。如果你在10天内未能至少执行一次仁慈或慷慨的行为，或者你自愿执行邪恶行为，你将失去这本书赋予的所有增益。\n【天堂之谧】当与这本书共鸣时，你对魅惑和恐慌状态具有免疫，对心灵伤害具有抗性。这些好处在你花费必要的时间阅读和研究这本书后变得永久。\n【神圣感知】在你花费了必要的时间阅读和研究这本书之后，你的力量值增加了2点，最高不超过24点。你不能从这本书中获得超过一次的好处。\n【魔法启迪】在你花费了必要的时间阅读和研究这本书之后，你消耗的任何法术位来施放法术都被视为高一级的法术位。\n【神光】在你花费了阅读和研究这本书所需的时间后，你获得了一个保护性的光环。这个光环在10英尺范围内散发明亮光照，在额外的10英尺范围内散发微光光照。你可以作为一个附赠动作来解除或显现光环。当光环存在时，你在魅力（游说）检定上获得优势。此外，在光环的明亮光照范围内的恶魔和亡灵对你进行攻击检定时会遭受劣势。\n【随机词条】圣洁之书具有以下随机词条： 2项神器词条; 次要增益词条词条 2项神器词条; 主要增益词条词条\n【摧毁此书】《崇高行为之书》无法被摧毁。然而，将这本书沉入冥河斯提克斯中会抹去其页面上的所有文字和图像，使这本书在1d100年内失去效力。", aliases: ["Book of Exalted Deeds", "圣洁之书"], loot_tables: []}
- {cn: "秽暗之书", en: "Book of Vile Darkness", rarity: 神器, kind: 奇物, attunement: "需同调", page: 238, text: "这本邪恶手稿的内容是邪恶之人的食粮和饮料。它包含的知识如此可怕，以至于仅仅瞥见潦草的页面就会招致厄运。\n大多数人相信巫妖之神维克那撰写了《邪恶黑暗之书》。他将遇到的或创造的每一个可怕的想法、每一个腐败的思想以及每一个邪恶魔法的例子都记录在它的页面上。\n其他邪恶的实践者也将自己的见解添加到了这本书的邪恶知识目录中。他们的补充是清晰的，因为后来的作者将他们所写的内容缝入了这本书，或者在某些情况下，对现有文本进行了注释和补充。有些地方的页面缺失、撕破或被墨水、血液和划痕完全覆盖，以至于无法推断出原始文本。\n自然 不能忍受这本书的存在。普通的植物在它附近枯萎，普通的动物不愿意接近它，这本书逐渐破坏它所触碰的一切。如果这本书长时间放在石头上，即使是石头也会裂开并变成粉末。\n每当一个既不是恶魔也不是不死生物的生物调谐至《邪恶黑暗之书》时，该生物需进行一次DC 17的魅力豁免检定。若豁免失败，该生物将被魔法转变为DM控制的幼虫魔。只有祈愿术法术才能逆转这种邪恶的转变。\n一个与这本书协调的生物必须花费80小时阅读和研究它，以消化其内容并使用其调整后的属性分数、无尽形态、法术、邪恶知识以及邪恶语言特性。\n《邪恶之书》只有在你努力在世界上行恶时才会与你同在。如果你在10天内未能至少执行一次邪恶行为，或者你自愿执行了一次善行，这本书就会消失，你对它的同调立即结束，你将失去它所赋予的所有好处。如果你在与这本书调谐时死去，一个巨大的邪恶实体会索取你的灵魂。只要你的灵魂被囚禁，你就不能通过任何手段复活。\n【属性值修正】你可以选择一个能力值增加2点，最高不超过24。你可以选择另一个能力值减少2点，最低不低于3。这本书不能再调整你的能力值了。\n【无休形态】当这本书在你身上时，你对免疫了力竭状态。\n【随机词条】秽暗之书具有以下随机词条： 3项神器词条; 次要增益词条词条 1项神器词条; 主要增益词条词条 3项神器词条; 次要减益词条词条 2项神器词条; 主要减益词条词条\n【法术】当你持有并握着这本书时，你可以从中施放以下法术（豁免 DC 18）： 活化死尸 死亡法阵 支配怪物 死亡一指 一旦你使用这本书施放了一个法术，直到下一个黎明之前，你不能再从它那里施放那个法术。\n【秽恶学识】你可以在进行智力检定以回忆关于邪恶的某些方面的信息时，参考《邪恶之书》。例如，关于恶魔的传说。当你这样做时，你在该检定上有优势。 在地下城主的自由裁量下，这本书可能会揭示凡人不应知晓的秘密，比如强大的恶魔的真实名字、允许人变成死亡骑士或巫妖的邪恶仪式，或是那些名字永远不应被大声说出的邪恶生物所创造的失传法术。\n【秽恶灵言】当这本书在你身上时，你可以采取一个魔法动作来诵读其页面上的污秽、死亡的语言。每次你这样做时，你会遭受1d12心灵伤害，并且你周围15英尺内的每个生物都会遭受3d6心灵伤害，除非该生物是恶魔或亡灵。\n【摧毁此书】秽暗之书允许从其撕下书页，但那些书页上记载的任何邪恶学识最终都会回到书中，通常是在新作者向卷册添加书页时。 如果一个炽天神侍将这本书撕成两半，这本书将被摧毁1d100年，之后它会在多元宇宙的某个遥远角落重新形成。 一个与这本书共鸣了100年的生物可以发掘出隐藏在原始文本中的一个短语，当这个短语被翻译成天界语并大声说出时，说话者和书会在一道光辉中被摧毁。然而，只要多元宇宙中存在邪恶，这本书就会在1d10 × 100年后重新形成。", aliases: ["Book of Vile Darkness", "秽暗之书"], loot_tables: []}
- {cn: "精灵之靴", en: "Boots of Elvenkind", rarity: 非普通, kind: 奇物, attunement: "", page: 239, text: "着装这双靴子期间，无论在何种表面上移动，你都不会发出脚步声。你进行敏捷（隐匿）检定时具有优势。", aliases: ["Boots of Elvenkind", "精灵之靴"], loot_tables: ["器具_非普通"]}
- {cn: "伪迹之靴", en: "Boots of False Tracks", rarity: 普通, kind: 奇物, attunement: "需同调", page: 239, text: "着装这双靴子期间，你可以令其留下与你体型相同的一种类人相似的足迹。", aliases: ["Boots of False Tracks", "伪迹之靴"], loot_tables: ["器具_普通"]}
- {cn: "浮空之靴", en: "Boots of Levitation", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 239, text: "着装这双靴子期间，你可以对自身施放法术浮空术。", aliases: ["Boots of Levitation", "浮空之靴"], loot_tables: ["器具_珍稀"]}
- {cn: "速度之靴", en: "Boots of Speed", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 240, text: "着装这双靴子期间，你可以使用一个附赠动作来互击脚后跟。若如此做，你的速度将加倍，且任何生物对你发动借机攻击时都具有劣势。若再次互击脚后跟则该效应终止。\n在你使用该靴子的词条共计10分钟后，其魔法效应将不再对你生效，直至你完成一次长休。", aliases: ["Boots of Speed", "速度之靴"], loot_tables: ["器具_珍稀"]}
- {cn: "跑跳之靴", en: "Boots of Striding and Springing", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 240, text: "着装这双靴子期间，你的速度变为30尺，除非你原本的速度更快。且你的速度不会因为携带物品超重或者着装重甲而降低。\n你的每个回合限一次，你可以只消耗10尺移动力来跳跃至多30尺。", aliases: ["Boots of Striding and Springing", "跑跳之靴"], loot_tables: ["器具_非普通"]}
- {cn: "雪地之靴", en: "Boots of the Winterlands", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 240, text: "这双加绒靴子温暖且舒适。着装这双靴子期间，你获得以下增益：\n【冷冻抗性】你获得寒冷伤害的抗性，并且可以在没有额外保护的情况下忍受0华氏度及以下的温度。\n【冬日行者】你可以无视冰雪造成的困难地形。", aliases: ["Boots of the Winterlands", "雪地之靴"], loot_tables: ["器具_非普通"]}
- {cn: "命令水元素水钵", en: "Bowl of Commanding Water Elementals", rarity: 珍稀, kind: 奇物, attunement: "", page: 240, text: "当你位于这件水钵5尺内且其中盛满水期间，你能够以一个魔法动作来召唤一只水元素。水元素会出现在距离水钵最近的未被占据的空间、理解你所说的语言、服从你的命令、使用你的先攻值并在你之后立即执行其回合。水元素会在1小时后，或它死亡时，或你以一个附赠动作解消时消失。直到次日黎明前，水钵都无法再以该方式进行使用。\n水钵直径约1尺，深约半尺。它的重量为3磅，能装承大约3加仑水。", aliases: ["Bowl of Commanding Water Elementals", "命令水元素水钵"], loot_tables: ["奥秘_珍稀", "圣物_珍稀"]}
- {cn: "射手护腕", en: "Bracers of Archery", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 240, text: "着装这对护腕期间，你获得长弓和短弓的熟练项，且你使用这两种武器造成的伤害掷骰获得 +2 加值。", aliases: ["Bracers of Archery", "射手护腕"], loot_tables: ["武备_非普通"]}
- {cn: "防御护腕", en: "Bracers of Defense", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 241, text: "着装这对护腕期间，如果你没有穿着护甲也没有使用盾牌，则你的护甲等级获得 +2 加值。", aliases: ["Bracers of Defense", "防御护腕"], loot_tables: ["奥秘_珍稀"]}
- {cn: "黄铜龙鳞甲", en: "Brass Dragon Scale Mail", rarity: 极珍稀, kind: 护甲, attunement: "需同调", page: 254, text: "（规则见「龙鳞甲」条目）", aliases: ["Brass Dragon Scale Mail", "黄铜龙鳞甲"], loot_tables: []}
- {cn: "命令火元素火盆", en: "Brazier of Commanding Fire Elementals", rarity: 珍稀, kind: 奇物, attunement: "", page: 241, text: "当你位于这座火盆5尺内期间，你能够以一个魔法动作来召唤一只火元素。火元素会出现在距离火盆最近的未被占据的空间、理解你所说的语言、服从你的命令、使用你的先攻值并在你之后立即执行其回合。火元素会在1小时后，或它死亡时，或你以一个附赠动作解消时消失。直到次日黎明前，火盆都无法再以该方式进行使用。", aliases: ["Brazier of Commanding Fire Elementals", "命令火元素火盆"], loot_tables: ["奥秘_珍稀", "圣物_珍稀"]}
- {cn: "青铜龙鳞甲", en: "Bronze Dragon Scale Mail", rarity: 极珍稀, kind: 护甲, attunement: "需同调", page: 254, text: "（规则见「龙鳞甲」条目）", aliases: ["Bronze Dragon Scale Mail", "青铜龙鳞甲"], loot_tables: []}
- {cn: "护盾胸针", en: "Brooch of Shielding", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 241, text: "佩戴此胸针期间，你获得对力场伤害的抗性，并免疫法术魔法飞弹的伤害。", aliases: ["Brooch of Shielding", "护盾胸针"], loot_tables: ["奥秘_非普通"]}
- {cn: "飞天扫帚", en: "Broom of Flying", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 241, text: "这把扫帚在平时如同一把普通的扫帚，你可以骑在它上面并使用一个魔法动作让它悬浮在你身下，此时它可以载着你在空中飞行。它的飞行速度为50尺，最多可载重400磅，但200磅以上的载重会将它的飞行速度降低到30尺。扫帚在你着陆或不再骑乘时便会停止悬浮。\n以一个魔法动作，你可以指名1英里内一个你熟悉的地点，并令扫帚自行飞往该处。而如果扫帚在你周围1英里以内，你也能够以一个魔法动作让它自行回到你的身边。", aliases: ["Broom of Flying", "飞天扫帚"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "焦引熏烟", en: "Burnt Othur Fumes", rarity: 未标注, kind: 奇物, attunement: "", page: 90, text: "受害于该毒药的生物必须成功通过一次DC 13的体质豁免，否则将受到10（3d6）毒素伤害，并在其每个回合开始时重复此豁免。此时每次豁免失败后该生物都将受3（1d6）毒素伤害。累计三次豁免成功后，毒药的效应终止。", aliases: ["Burnt Othur Fumes", "焦引熏烟"], loot_tables: []}
- {cn: "祈神蜡烛", en: "Candle of Invocation", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 241, text: "你可以用一个魔法动作点燃蜡烛，此时它的魔力便会被激活。蜡烛共可以燃烧4小时，你也可以提前吹灭蜡烛以备将来之用。以分钟为单位计算蜡烛已燃烧时间，并从总时间内扣除。\n蜡烛燃烧期间，它会散发出半径30尺范围的微光光照光照。位于此光照范围内期间，你所进行的D20 检定具有优势。此外，此光照范围内的牧师和德鲁伊在施展它们准备了的1环法术时无需消耗法术位。\n另外，当你首次点亮祈神蜡烛时，你可以用它施展一次法术异界之门。这样做会立刻摧毁这根蜡烛，而此法术所创造的传送门会连接至某一特定的外层位面，由DM选择或掷以下表格决定：", aliases: ["Candle of Invocation", "祈神蜡烛"], loot_tables: ["圣物_极珍稀"]}
- {cn: "渊海蜡烛", en: "Candle of the Deep", rarity: 普通, kind: 奇物, attunement: "", page: 242, text: "这个蜡烛的火焰即使被浸没在水中也不会熄灭，且它会如正常蜡烛一样发光发热。", aliases: ["Candle of the Deep", "渊海蜡烛"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "水下呼吸帽", en: "Cap of Water Breathing", rarity: 非普通, kind: 奇物, attunement: "", page: 242, text: "着装此帽期间，你可以在水下用一个魔法动作让它在你头部周围创造出一个空气泡，它可以供你在水下正常呼吸。空气泡将持续存在，并在你摘掉帽子或离开水下时结束。", aliases: ["Cap of Water Breathing", "水下呼吸帽"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "江湖骗子披风", en: "Cape of the Mountebank", rarity: 珍稀, kind: 奇物, attunement: "", page: 242, text: "这件披风闻起来有一股淡淡的硫磺味。着装该披肩期间，你可以用一个魔法动作施展法术任意门。该属性一经使用，直至次日黎明前都无法再次使用。\n以此施展该法术时，你将在消失的原地留下一团烟雾，之后你伴随着一团类似的烟雾出现在目的地。出现在你离开和到达的位置上的烟雾会造成轻度遮蔽，它在下一个你的回合结束时消散。", aliases: ["Cape of the Mountebank", "江湖骗子披风"], loot_tables: ["奥秘_珍稀"]}
- {cn: "红玉髓", en: "Carnelian", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗从橘黄至红棕色的宝石。", aliases: ["Carnelian", "红玉髓"], loot_tables: []}
- {cn: "飞毯（3尺×5尺）", en: "Carpet of Flying, 3 ft. × 5 ft.", rarity: 极珍稀, kind: 奇物, attunement: "", page: 242, text: "你可以用一个魔法动作，说出飞毯的命令词来让它起飞或悬停。只要你在飞毯周围30尺内，它就会按照你的指示移动。\n一块3英尺×5英尺的地毯可以承载最多200磅的重量，并以80英尺的速度飞行。飞毯的载重上限为正常载重的两倍，但超过正常载重时飞毯的飞行速度减半。", aliases: ["Carpet of Flying, 3 ft. × 5 ft.", "飞毯", "飞毯（3尺×5尺）"], loot_tables: []}
- {cn: "飞天魔毯，4尺x6尺", en: "Carpet of Flying, 4 ft. × 6 ft.", rarity: 极珍稀, kind: 奇物, attunement: "", page: 242, text: "你可以用一个魔法动作，说出飞毯的命令词来让它起飞或悬停。只要你在飞毯周围30尺内，它就会按照你的指示移动。\n一块4英尺×6英尺的地毯可以承载最多400磅的重量，飞行速度为60英尺。飞毯的载重上限为正常载重的两倍，但超过正常载重时飞毯的飞行速度减半。", aliases: ["Carpet of Flying, 4 ft. × 6 ft.", "飞天魔毯，4尺x6尺"], loot_tables: []}
- {cn: "飞天魔毯，5尺x7尺", en: "Carpet of Flying, 5 ft. × 7 ft.", rarity: 极珍稀, kind: 奇物, attunement: "", page: 242, text: "你可以用一个魔法动作，说出飞毯的命令词来让它起飞或悬停。只要你在飞毯周围30尺内，它就会按照你的指示移动。\n一块5英尺×7英尺的地毯最多可以承载600磅，飞行速度为40英尺。飞毯的载重上限为正常载重的两倍，但超过正常载重时飞毯的飞行速度减半。", aliases: ["Carpet of Flying, 5 ft. × 7 ft.", "飞天魔毯，5尺x7尺"], loot_tables: []}
- {cn: "飞天魔毯，6尺x9尺", en: "Carpet of Flying, 6 ft. × 9 ft.", rarity: 极珍稀, kind: 奇物, attunement: "", page: 242, text: "你可以用一个魔法动作，说出飞毯的命令词来让它起飞或悬停。只要你在飞毯周围30尺内，它就会按照你的指示移动。\n一张6英尺×9英尺的地毯可以携带最多800磅的重量，飞行速度为30英尺。飞毯的载重上限为正常载重的两倍，但超过正常载重时飞毯的飞行速度减半。", aliases: ["Carpet of Flying, 6 ft. × 9 ft.", "飞天魔毯，6尺x9尺"], loot_tables: []}
- {cn: "食腐虫粘液", en: "Carrion Crawler Mucus", rarity: 未标注, kind: 奇物, attunement: "", page: 90, text: "接触到这种毒药的生物必须成功通过一次DC 13的体质豁免，否则将陷入中毒状态1分钟。以此中毒期间该生物还会陷入麻痹状态。该生物在其每个回合结束重复此豁免，豁免成功则终止其身上的此效应。", aliases: ["Carrion Crawler Mucus", "食腐虫粘液"], loot_tables: []}
- {cn: "重生坩埚", en: "Cauldron of Rebirth", rarity: 极珍稀, kind: 奇物, attunement: "需德鲁伊或魔契师同调", page: 243, text: "这只微型小锅的铸铁侧边上刻有英雄群像的浮雕。\n你可以将这件坩埚作为法器使用，且其可以作为法术探知术的代替材料。\n【酿造药水】当你完成一次长休时，你可以使用坩埚制造一瓶高等治疗药水 ，这需要花费你1分钟的时间。药水持续24个小时，若其没有被使用，则它失去魔力。\n【死者复活】以一个魔法动作，你可以让坩埚增大至足以容纳一个中型生物。你也可以用一个魔法动作让坩埚恢复其普通大小，并且无害地将任何它无法容纳的东西转出到最近未被占据的位置。 如果你将一个类人生物的尸体放入坩埚之中并将200磅的盐（耗费10金币）掩埋尸体持续八小时，那么盐会被消耗，而那个生物会在下一个黎明时复活，如同法术死者复活。使用后七日之内，坩埚的此项词条都无法再次使用。", aliases: ["Cauldron of Rebirth", "重生坩埚"], loot_tables: ["奥秘_极珍稀", "圣物_极珍稀"]}
- {cn: "命令气元素香炉", en: "Censer of Controlling Air Elementals", rarity: 珍稀, kind: 奇物, attunement: "", page: 243, text: "当你轻轻挥动这件香炉期间，你可以用一个魔法动作来召唤一只气元素。气元素会出现在距离香炉最近的未被占据的空间、理解你所说的语言、服从你的命令、使用你的先攻并在你之后立即执行其回合。气元素会在1小时后、或它死亡时、或你用一个附赠动作解消时消失。直到次日黎明前，香炉都无法再以该方式进行使用。", aliases: ["Censer of Controlling Air Elementals", "命令气元素香炉"], loot_tables: ["奥秘_珍稀", "圣物_珍稀"]}
- {cn: "玉髓", en: "Chalcedony", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一块白色的宝石。", aliases: ["Chalcedony", "玉髓"], loot_tables: []}
- {cn: "骗子骰", en: "Charlatan's Die", rarity: 普通, kind: 奇物, attunement: "需同调", page: 243, text: "当你投掷这枚六面骰子时，你可以操控它骰出的点数。", aliases: ["Charlatan's Die", "骗子骰"], loot_tables: ["器具_普通"]}
- {cn: "开门钟琴", en: "Chime of Opening", rarity: 珍稀, kind: 奇物, attunement: "", page: 244, text: "这种空心金属管长约1尺，重1磅。你可以用一个魔法动作敲击它以施展法术敲击术。此时，该法术中响亮的敲击声将被钟琴清晰的声音所取代，其声响最远 300 尺内都能听见。开门钟琴可使用 10 次。使用 10 次后，它将碎裂并失去它的能力。", aliases: ["Chime of Opening", "开门钟琴"], loot_tables: ["奥秘_珍稀", "器具_珍稀"]}
- {cn: "金绿玉", en: "Chrysoberyl", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一种从黄绿至淡绿色的宝石。", aliases: ["Chrysoberyl", "金绿玉"], loot_tables: []}
- {cn: "绿铜矿石", en: "Chrysoprase", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一块绿色的宝石。", aliases: ["Chrysoprase", "绿铜矿石"], loot_tables: []}
- {cn: "爆裂头饰", en: "Circlet of Blasting", rarity: 非普通, kind: 奇物, attunement: "", page: 244, text: "穿戴该头饰期间，你可以用其施展法术灼热射线（命中+5）。直到次日黎明前，头饰都无法施展该法术。", aliases: ["Circlet of Blasting", "爆裂头饰"], loot_tables: ["奥秘_非普通"]}
- {cn: "黄水晶", en: "Citrine", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一块浅黄棕色的宝石。", aliases: ["Citrine", "黄水晶"], loot_tables: []}
- {cn: "节肢斗篷", en: "Cloak of Arachnida", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 244, text: "这件精美的服饰由黑色丝绸制成，其中交织着隐约可见的银色丝线。着装此斗篷期间，你获得以下增益：\n【毒素抗性】你获得对毒素伤害的抗性。\n【蛛行术】你获得与速度相等的攀爬速度，能够在垂直表面上下或横向移动，甚至可以在天花板上倒挂着移动而不需要用到双手。\n【蛛网行走】你不会被任何种类的蛛网困住，在移动穿过蛛网时你将其视为等同于困难地形。\n【蛛网术】你可以施展蛛网术（DC 13）。该法术创造的蛛网将覆盖普通蛛网术正常区域的两倍。该词条一经使用，直至次日黎明前都无法再次使用。", aliases: ["Cloak of Arachnida", "节肢斗篷"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "飘扬斗篷", en: "Cloak of Billowing", rarity: 普通, kind: 奇物, attunement: "", page: 244, text: "着装这件斗篷期间，你可以用一个附赠动作动作令它大幅度的飘扬起来，持续1分钟。", aliases: ["Cloak of Billowing", "飘扬斗篷"], loot_tables: ["奥秘_普通"]}
- {cn: "移位斗篷", en: "Cloak of Displacement", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 244, text: "着装此斗篷期间，它将魔法性地投射出你的幻影，使你看起来像是站在一个和你实际位置稍有偏差的地方。任何生物对你的攻击检定都将具有劣势。你受到伤害时斗篷会暂时失效，直至你的下一回合开始恢复效应。当你的速度为0时，该词条将被压制。", aliases: ["Cloak of Displacement", "移位斗篷"], loot_tables: ["奥秘_珍稀"]}
- {cn: "精灵斗篷", en: "Cloak of Elvenkind", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 244, text: "着装此斗篷期间，任何为感知到你所做的感知（察觉）检定都将具有劣势，且你为躲藏所进行的敏捷（隐匿）检定具有优势。", aliases: ["Cloak of Elvenkind", "精灵斗篷"], loot_tables: ["器具_非普通"]}
- {cn: "隐形斗篷", en: "Cloak of Invisibility", rarity: 传说, kind: 奇物, attunement: "需同调", page: 244, text: "这件斗篷有3点充能，并在每日拂晓时恢复1d3点已消耗的充能。当你穿着这件斗篷时，你可以用一个魔法动作拉起兜帽并消耗1点充能，使你获得隐形状态，持续1小时。如果你拉下兜帽（无需动作）或不再穿着这件斗篷，该效应提前结束。", aliases: ["Cloak of Invisibility", "隐形斗篷"], loot_tables: ["奥秘_传说"]}
- {cn: "万众时尚斗篷", en: "Cloak of Many Fashions", rarity: 普通, kind: 奇物, attunement: "", page: 245, text: "着装此斗篷期间，你可以用一个附赠动作改变它的样式、颜色、及外表品质。这件斗篷的重量不会因此改变，且不论它的外观如何，这件斗篷永远只能是一件斗篷而不是别的东西。当然，这件斗篷可以用于复制其他魔法斗篷的外观，但它不会因此具有任何其他魔法斗篷的魔法能力。", aliases: ["Cloak of Many Fashions", "万众时尚斗篷"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "防护斗篷", en: "Cloak of Protection", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 245, text: "着装此斗篷期间，你的护甲等级和豁免获得+1加值。", aliases: ["Cloak of Protection", "防护斗篷"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "蝙蝠斗篷", en: "Cloak of the Bat", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 245, text: "着装此斗篷期间，你的敏捷（隐匿）检定具有优势。在微光光照或黑暗的环境中，你可以抓住斗篷的边沿，利用它以获得40尺的飞行速度。如果你在以此法飞行时不再抓住斗篷边沿或不再处于微光光照或黑暗环境中，则你失去此飞行速度。\n着装此斗篷且身处微光光照或黑暗环境期间，你可以用一个动作对自己施展法术变形术，并以此变成一只蝙蝠。你在变成蝙蝠时保留自身的智力、感知和魅力属性。该词条一经使用，直至次日黎明前都无法再次使用。", aliases: ["Cloak of the Bat", "蝙蝠斗篷"], loot_tables: ["奥秘_珍稀"]}
- {cn: "蝠鲼斗篷", en: "Cloak of the Manta Ray", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 245, text: "着装此斗篷期间，你能在水下呼吸，并具有60尺游泳速度。", aliases: ["Cloak of the Manta Ray", "蝠鲼斗篷"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "发条护符", en: "Clockwork Amulet", rarity: 普通, kind: 奇物, attunement: "", page: 245, text: "这枚铜制的护符内有数个互相咬合的微小齿轮，其以机械境——一个秩序至极，万物皆可被机械预测的位面——的魔法所驱动。模糊的滴答声与呼呼的噪音从中传出。佩戴该护符期间，当你进行一次攻击检定时，你可以放弃掷骰并在d20的骰值上取10。该词条一经使用，直至次日黎明前都无法再次使用。\n佩戴着这个护身符期间，当你进行一次攻击检定时，你可以放弃掷骰并在d20的骰值上取10。使用后，直到下一个黎明前此物品的此能力无法被再次使用。", aliases: ["Clockwork Amulet", "发条护符"], loot_tables: ["器具_普通"]}
- {cn: "修补之衣", en: "Clothes of Mending", rarity: 普通, kind: 奇物, attunement: "", page: 245, text: "这套优雅的服饰会魔法性的修复自己的日常磨损。不过它被损毁的部分无法以此自我修复。", aliases: ["Clothes of Mending", "修补之衣"], loot_tables: ["奥秘_普通"]}
- {cn: "赤铜龙鳞甲", en: "Copper Dragon Scale Mail", rarity: 极珍稀, kind: 护甲, attunement: "需同调", page: 254, text: "（规则见「龙鳞甲」条目）", aliases: ["Copper Dragon Scale Mail", "赤铜龙鳞甲"], loot_tables: []}
- {cn: "珊瑚", en: "Coral", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗深红色的宝石。", aliases: ["Coral", "珊瑚"], loot_tables: []}
- {cn: "水晶球", en: "Crystal Ball", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 246, text: "当你触摸这个水晶法球时，你可以通过它施展探知术（豁免DC 17）。", aliases: ["Crystal Ball", "水晶球"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "读心水晶球", en: "Crystal Ball of Mind Reading", rarity: 传说, kind: 奇物, attunement: "需同调", page: 246, text: "在你接触该水晶球期间，你可以用它施展法术探知术（豁免DC 17）。此外，你可以对该法术传感器周围30尺之内你可见的生物施展侦测思想（豁免DC 17）。该侦测思想法术持续期间你无需为其保持专注，但如果探知术法术终止，则它也将随之终止。", aliases: ["Crystal Ball of Mind Reading", "读心水晶球"], loot_tables: ["奥秘_传说"]}
- {cn: "心灵感应水晶球", en: "Crystal Ball of Telepathy", rarity: 传说, kind: 奇物, attunement: "需同调", page: 246, text: "在你接触该水晶球期间，你可以用它施展法术探知术（豁免DC 17）。此外，你可以与该法术传感器周围30尺之内你可见的生物以心灵感应的方式进行交流。你还可以通过传感器对这些生物中的一个施展暗示术（豁免DC 17）。该暗示术持续期间内你无需为它保持专注，但如果探知术终止它也将随之终止。以此法施展暗示术后，这颗水晶球直到次日黎明前都无法再次用于该用途。", aliases: ["Crystal Ball of Telepathy", "心灵感应水晶球"], loot_tables: ["奥秘_传说"]}
- {cn: "真知水晶球", en: "Crystal Ball of True Seeing", rarity: 传说, kind: 奇物, attunement: "需同调", page: 246, text: "在你接触该水晶球期间，你可以用它施展法术探知术（豁免DC 17）。此外，你获得以该法术传感器为中心，半径120尺的真实视觉。", aliases: ["Crystal Ball of True Seeing", "真知水晶球"], loot_tables: ["奥秘_传说"]}
- {cn: "力场魔方", en: "Cube of Force", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 246, text: "这个立方体棱长约1寸，每个面上都有不同的标记。你可以按下立方体某一面，并消耗如下表所示的充能以施展对应的法术（豁免DC 17）。\n该立方体共有10发充能，每天黎明时会恢复1d6发已消耗的充能次数。", aliases: ["Cube of Force", "力场魔方"], loot_tables: ["奥秘_珍稀"]}
- {cn: "召唤魔方", en: "Cube of Summoning", rarity: 珍稀, kind: 奇物, attunement: "", page: 247, text: "这个小立方体如同一个玩偶盒。当你用一个魔法动作转动立方体的曲柄时，它的盖子将在欢快的曲调中弹开，一个生物出现在距离盒子最近的未被占据的空间，而后盖子再次关闭。该盖子无法被其他手段打开。\n在召唤魔方表中掷骰以确定召唤魔方施展了哪种法术以召唤生物。该法术以五环法术位施展（豁免DC 17，攻击加值+9）且无需维持专注，但你在其他方面视为该法术的施法者。\n一旦该立方体召唤了一个生物，直至次日黎明前它都无法再次召唤生物。", aliases: ["Cube of Summoning", "召唤魔方"], loot_tables: ["奥秘_珍稀"]}
- {cn: "异界之门魔方", en: "Cubic Gate", rarity: 传说, kind: 奇物, attunement: "", page: 247, text: "这个边长3寸的立方体散发着明显的魔法能量。立方体的六个面分别连接到六个不同的存在位面，其中一面连接的是物质位面，而其他面所连接的位面则由DM决定。\n立方体具有3充能，并在每日黎明时重获1d3已消耗的充能。以一个魔法动作，你可以消耗此立方体的1充能，从立方体中施展下列法术之一。\n【大门】按压立方体的其中一面，你施展法术异界之门，打开连接到对应存在位面的传送门。\n【位面转移】按压两次立方体的其中一面，你施展法术位面转移，将目标传送至对应存在位面。", aliases: ["Cubic Gate", "异界之门魔方"], loot_tables: ["奥秘_传说"]}
- {cn: "迪恩的折叠要塞", en: "Daern's Instant Fortress", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 247, text: "你可以用一个魔法动作，把这个1寸高的精金小雕像放在地上并说出其命令语，使其迅速长成一座方形的精金高塔。若塔内空间未被占据，再说一遍命令语会使其变回雕像形态。高塔出现时，其占据的区域空间内每个生物都会被推到塔外未被占据的空间里。该区域内未被着装或携带的物件也会被推出塔外。\n高塔长宽各20尺，高30尺，各面墙上都有箭孔，顶端则为城垛。它的内部分为两层，其间由梯子、楼梯或斜坡（由你选择）连通。该梯子、楼梯或斜坡止于一扇通向此塔顶层的活板门。此塔生成时，其底层面向你的那一面会出现一扇门。只有你用一个附赠动作向其传令时，此门才会开启。这扇门免疫敲击术以及类似的魔法。\n魔法保护着高塔，使其无法被推倒。高塔的顶部、门和每面墙都分别具有20AC和100点生命值，免疫不由攻城器械造成的挥砍、钝击、穿刺伤害，且对其他所有类型的伤害都具有抗性。将高塔变回雕像形态不会修复其受到的伤害。只有法术祈愿术能够修复高塔（这种用法视为复制一个不大于八环的法术）。每次施展祈愿术都能让高塔恢复所有生命值。", aliases: ["Daern's Instant Fortress", "迪恩的折叠要塞"], loot_tables: ["奥秘_珍稀", "武备_珍稀"]}
- {cn: "淬毒匕首", en: "Dagger of Venom", rarity: 珍稀, kind: 武器, attunement: "", page: 248, text: "你以此魔法武器进行的攻击检定和伤害掷骰获得+1加值。\n你可以用附赠动作为匕首覆上毒液，持续1分钟。用这把武器发动的一次攻击成功命中生物后毒液也会消失。此时，被命中的生物必须成功通过一次DC 15的体质豁免否则受到2d10毒素伤害并陷入中毒状态1分钟。直至次日黎明前，该附赠动作都无法被再次使用。", aliases: ["Dagger of Venom", "淬毒匕首"], loot_tables: ["武备_珍稀"]}
- {cn: "黑暗碎片护符", en: "Dark Shard Amulet", rarity: 普通, kind: 奇物, attunement: "由魔契师", page: 248, text: "这个护符由来自异界的弹性材料碎片制成。佩戴此护符期间，你获得以下增益。\n【法器】你可以把护符当作你施展魔契师法术时的法器使用。\n【未知法术】作为一个魔法动作 ，你可以尝试施展一道你未知的戏法。该戏法必须在魔契师法术列表之内且施法时间为1动作。随后你进行一次DC 10的智力（奥秘）检定，检定通过则你施展该法术，检定失败则法术失效，且你施法所用的动作将被浪费。无论发生哪种情况，那之后直至你完成长休前都无法再次使用该词条。", aliases: ["Dark Shard Amulet", "黑暗碎片护符"], loot_tables: ["奥秘_普通"]}
- {cn: "无尽水瓶", en: "Decanter of Endless Water", rarity: 非普通, kind: 奇物, attunement: "", page: 249, text: "这个带瓶塞的瓶子在摇晃时会发出液体晃动的声音，仿佛其中有水一般。此瓶重2磅。\n你可以用一个魔法动作拔出瓶塞并说出其三个命令语之一，使瓶中涌出淡水或咸水（由你选择）。水将在你的下一回合开始时停止涌出。从下列命令语中进行选择：\n【溅射】此瓶产生1加仑的水。\n【喷泉】此瓶产生5加仑的水。\n【井喷】此瓶产生30加仑的水，以一道长30尺，宽1尺的线状水柱的形式喷涌而出。如果你正握持着此瓶，那么你可以将瓶口对准一处地方（无需动作）。你选择该线状内你的一名生物，该生物必须成功通过一次DC 13的力量豁免，否则受到1d4点钝击伤害并陷入倒地状态。除瞄准生物以外，你也可以用瓶口瞄准线状内一个不超过200磅，且未被着装或携带的物件。该物件将被水柱打翻。", aliases: ["Decanter of Endless Water", "无尽水瓶"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "幻象牌组", en: "Deck of Illusions", rarity: 非普通, kind: 奇物, attunement: "", page: 249, text: "这个匣子里装着一套卡牌。一套完整的牌组有34张卡牌：32张描绘着特定的生物，2张则是镜面牌。作为宝藏找到的牌组通常会缺失1d20 - 1张卡牌。\n牌组的魔法只有在随机抽出时才会生效。你可以用一个魔法动作从牌组中随机抽出一张卡牌，并将其扔到距离你30尺范围以内的一处地面上。某一生物（根据\"幻象牌组表格\"掷骰来确定）的幻象会从被扔出的卡牌中显现，并将持续存在直至被解除。由卡牌创造出的幻象生物看起来活灵活现，和真实生物行为相仿，但无法造成伤害。如果你在幻象生物周围120尺范围内且你能看到它，你就可以用一个魔法动作令其移动到卡牌周围30尺内的任何地方。\n由于物件可以穿透幻象，因此与幻象生物进行的任何物理互动都将揭示其幻象本质。任一生物都可以用一个研究动作来对幻象生物进行视觉性的观察，此时其成功通过一次DC 15的智力（调查）检定即可发现幻象的本质。幻象将持续存在，直至被解除（使用解除魔法或类似的效应）或其卡牌被移动。当幻象终止时，其卡牌上的图像也随之消失，该卡牌也无法再次使用。", aliases: ["Deck of Illusions", "幻象牌组"], loot_tables: ["奥秘_非普通"]}
- {cn: "万象无常牌", en: "Deck of Many Things", rarity: 传说, kind: 奇物, attunement: "", page: 250, text: "这副牌组包含数张由象牙或牛皮纸制成的卡牌，通常存放在盒子或袋子里。一副牌大多数时候（75%）只有13张牌，但有时也会有22张。当从牌组中抽出的牌需要随机决定时，则可根据万象无常牌表中合适的纵列决定之。\\n你必须在抽卡之前声明要抽多少张牌，然后随机抽取。抽出的任何超出声明数量部分的卡牌将不会产生任何效应。否则，每当你正常抽出一张卡牌，其魔法效应在抽出时立即生效。你抽取两张卡牌之间的时间间隔不能超过1小时。如果你未能抽够声明数量的卡牌，声明了但是未被抽取的那部分卡牌将从牌组中自行飞出并同时产生效应。\\n卡牌一旦被抽出将随之消散。然后该卡牌将重新出现在牌组中，使你有可能抽到相同的卡牌两次，除非你抽到的是愚者或小丑（一旦愚者或小丑离开牌组，当你再次骰到他们时，重新掷骰）。\\n每张卡片的效果如下所述。\\n【平衡】你令你的一项属性值提升2，至多提升至22。但你需要令你的另一项属性值降低2，你不能选择降低不高于5的属性值。你也可以选择不修改属性值，在这种情况下，此牌不产生效应。\\n【彗星】在你下一次与一名或更多敌对生物进入战斗时，你可以在投掷先攻时选择其中一名作为你的宿敌。若你在战斗中将该宿敌的生命值降至0，则你的死亡豁免检定具有优势，持续1年。若其他人将该宿敌的生命值降至0或你没有选择宿敌，此牌不产生效应。\\n【城堡】你凭空消失，以假死状态被埋葬在某个球形异次元空间里。你着装和携带的所有物品都将随你一同消失，而你所着装和携带的神器则将落在你消失前占据的空间里。你将一直被禁锢，直至被发现并从异次元空间中被解放出来。你无法被任何预言系魔法定位，但法术祈愿术可获悉你被禁锢的位置。抽到此牌后你不再抽取其他卡牌。\\n【尤瑞艾莉】卡片上与美杜莎相似的画像诅咒了你。诅咒持续期间，你的豁免检定具有-2减值。只有神明或命运卡牌的魔法可以终止该诅咒。\\n【命运】现实本身的存在被拆散而又重新编就，并以此让你得以避免或抹除某件已经发生的事件，如同它从未发生一般。你可以在抽到此卡时或直至自己死前的任何时间使用此牌的效果。\\n【火焰】一名强大的魔鬼将成为你的敌人。它会试图摧毁你，折磨你，让你品尝痛苦的滋味，然后杀掉你。这份敌意将持续至它和你中的一方死去。\\n【关于树敌】万象无常牌中有两张卡牌可能会使某个存在对角色产生敌意。火焰卡牌导致的敌意是显而易见的。角色将在许多场合中遭遇魔鬼的恶毒算计。但找到这名魔鬼却并不容易。冒险者应该与魔鬼的盟友或手下发生几次冲突，然后才能面对魔鬼。 浪客卡牌带来的敌意被隐于幕后，且应当来自被认为是朋友或盟友的某人。作为DM，你应该等待一个戏剧性时刻再展示这种敌意，让冒险者不断猜测谁会成为背叛者。\\n【愚者】你的D20 检定具有劣势，持续72小时。另外抽一张卡牌，这次抽卡不计入你声明的数量。\\n【宝石】二十五枚各价值2,000gp的宝石或五十枚各价值1,000gp的宝石出现在你的脚边。\\n【小丑】你的D20 检定具有优势，持续72小时，或者你可以在声明的抽卡数量外再抽取两张卡牌\\n【钥匙】一把由DM选择的，稀有度为珍稀及以上的且你具有熟练的魔法武器出现在你的手中。\\n【骑士】你获得一名骑士侍从，其将魔法性地出现在位于你30尺内由你选择的未占据空间。这名骑士和你阵营相同，相信你们之间被命运相系并向你效忠至死。与你的DM一同为该NPC取名并撰写背景。DM可以根据需要使用其他的数据卡代表骑士。\\n【月亮】你获得1d3次施展祈愿术的能力。\\n【谜题】你的智力或感知永久降低1d4 + 1（至多降低至1）。你可以在声明的抽卡数量外再抽取一张卡牌。\\n【浪客】一名由DM选择的NPC与你的态度变为敌对。你不知道这名NPC的身份，直至他自己或其他人揭露真相。只有法术祈愿术或神圣干预才能终止该NPC对你的敌对。\\n【废墟】你失去除魔法物品外你持有或拥有的一切形式的财产。可动产将直接消失；在最低限度修改现实的前提下，你还将失去你拥有的所有生意、建筑和土地。若你拥有据点（见城主指南），它将被你无法控制的灾难摧毁。任何证明你应该拥有因此卡而丢失的财产的文件也将消失。\n【智者】抽到此卡后一年内的任何时间，你可以在冥想中提出一个问题并在心中获得诚实的回答。\n【骷髅】一名死亡化身出现在距你最近的未占据空间中。死亡化身是一名包裹破烂黑袍、手持幽灵镰刀的幽魂骷髅，它的攻击仅以你为目标。当其生命值降至0或你死亡时，化身消失。若你的盟友对死亡化身造成伤害，那名盟友将召唤出另一名死亡化身。新的化身出现在距那名盟友最近的未占据空间中，且它的攻击仅以那名盟友为目标。你和你的盟友每人只能因一次抽卡召唤出一名化身。被死亡化身杀死的生物无法复活。\n【星辰】你令你的一项属性值提升2，至多提升至24。\n【太阳】一件由DM选择的魔法物品出现在你手中。此外，你将在每日黎明时获得10点临时生命值直至你死亡。\n【禽爪】你着装或携带的所有魔法物品被解离。你拥有的神器不会被解离，但会因此消失。\n【王座】你在历史、洞悉、威吓或游说中选择一项获得其熟练和专精。此外，你获得世界上某个地方的一座小城堡的合法所有权。然而这座城堡被一只或更多怪物所占据，你必须清理其中的怪物来获得城堡的宣称。\n【虚空】你的灵魂从躯体抽离，并被囚禁在某个DM指定地点里的一个物件中。一名或更多强大存在守护着这个地点。灵魂被囚禁期间，你的躯体处于静止状态，不再衰老也不需要食物、空气或水。祈愿术无法将你的灵魂唤回躯体，但可以揭示囚禁你灵魂的物件所在的方位。抽到此牌后你不再抽取其他卡牌。", aliases: ["Deck of Many Things", "万象无常牌"], loot_tables: ["奥秘_传说"]}
- {cn: "伊格薇尔伏恶魔志", en: "Demonomicon of Iggwilv", rarity: 神器, kind: 奇物, attunement: "需同调", page: 252, text: "这篇记录着深渊之无限层级及其居民的论文，由伊格薇尔伏撰写，被公认为是多元宇宙中最详细且最亵渎的恶魔学著作。这本书记载了关于深渊与恶魔的所有亵渎事项，无论其有多古远或者多时新。恶魔们曾试图删减过其中的文本，虽部分内容已从书脊上撕下，但大部分篇章仍存，并不断揭示着恶魔的秘密。这本书隐藏着一块神秘的深渊位面碎片，使得此书无论被撕掉多少页，也会时刻保持更新，这本书也不仅仅只是满足于成为一本参考材料。\n【深渊学识】每当你进行智力检定以辨别有关恶魔的信息或进行与深渊相关的感知（求生）检定时，你都可以参考恶魔志。若如此做，你在检定上具有优势。\n【封印】《恶魔之书》的前十页是空白的。当你持有这本书时，你可以作为一个魔法动作，以你能看到且被困在防护法阵法术区域内的一个恶魔为目标。该恶魔必须通过一个DC 20魅力豁免检定，并且由于劣势，若失败则会被困在《恶魔之书》的一页空白页中，该页面上会详细记载该生物广为人知的名字和恶行。一旦使用，该动作直到下一个黎明前无法再次使用。 当你完成一次长休时，如果你与恶魔宝典处于同一存在位面，书中一只被囚禁的生物可以尝试附身于你。你需要进行一次DC 20魅力豁免。若豁免失败，你将被该生物附身，它会像操纵傀儡一样控制你。作为一个魔法动作，附身生物可以释放你并出现在离你最近的未被占据的空间。若豁免成功，该魔鬼在7天内无法再次尝试附身你（但书中其他被囚禁的魔鬼当然可以尝试）。 当这本典籍被发现时，它的页面上通常有1d4个恶魔占据着——通常是各种恶魔的混合。\n【迷惑】当你携带此书时，每当你施放仅以魔鬼为目标的防护法阵或施放以魔鬼为目标的异界誓缚时，该法术将以9环施放，无论你使用了何种法术位（如果有的话）。此外，魔鬼在对抗该法术的豁免检定上具有劣势。\n【鞭笞邪魔】携带这本书时，当你对一个恶魔施放法术并进行伤害骰时，你使用最大可能的结果而不是进行掷骰。\n【随机词条】这件神器具有以下随机属性： 2项神器词条; 次要增益词条词条 1项神器词条; 次要减益词条词条 1项神器词条; 主要减益词条词条\n【法术】这本书有8次充能，每天黎明时分恢复1d8次已消耗的充能。手持此书时，你可以进行一次魔法动作来施放下表中的其中一个法术（通过DC 20检定）。表格显示了施放该法术所需消耗的充能次数。\n【摧毁恶魔志】要摧毁这本书，必须由六位不同的恶魔领主各自撕下书页的六分之一。若成功执行，这些书页将在24小时后重新出现。在上述时限内打开残留书封者，将被传送至潜藏于书中的无底深渊新生层面。在这致命且半活化的领域中央，藏着失落已久的圣物——弗拉兹厄鲁之杖。若将此杖拖出微型位面，这本典籍就会退化为一本平凡过时的《西克斯典籍》（即《伊格维尔伏恶魔志》的原始底本）。《西克斯典籍》可如同普通书籍般被摧毁。一旦魔杖现世，恶魔领主弗拉兹厄鲁会立即感知。", aliases: ["Demonomicon of Iggwilv", "伊格薇尔伏恶魔志"], loot_tables: []}
- {cn: "钻石", en: "Diamond", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗蓝白、淡黄、粉色、棕色或蓝色的宝石。", aliases: ["Diamond", "钻石"], loot_tables: []}
- {cn: "次元镣铐", en: "Dimensional Shackles", rarity: 珍稀, kind: 奇物, attunement: "", page: 254, text: "你可以用操作动作将此镣铐戴在一个失能的生物身上。镣铐可以自行调整适应从小型到大型体型的生物。次元镣铐能够阻止被其约束的生物进行异次元移动，包括传送和异位面旅行。不过镣铐并不能阻止生物穿过一道连接异位面的传送门。\n你和你使用镣铐时指定的生物可以用操作动作直接解除此镣铐。每隔30日，被约束的生物可以进行一次DC 30的力量（运动）检定，成功则破坏镣铐重获自由。", aliases: ["Dimensional Shackles", "次元镣铐"], loot_tables: ["器具_珍稀"]}
- {cn: "恐怖头盔", en: "Dread Helm", rarity: 普通, kind: 奇物, attunement: "", page: 254, text: "佩戴这顶头盔期间，这个惊悚的钢铁头盔会使你的眼睛亮起着红色的光芒，你脸部的其他部分则隐藏在阴影中。", aliases: ["Dread Helm", "恐怖头盔"], loot_tables: ["武备_普通"]}
- {cn: "漂浮之球", en: "Driftglobe", rarity: 非普通, kind: 奇物, attunement: "", page: 254, text: "这个厚玻璃制成的小球重1磅。在它周围60尺内，你可以说出命令语以使它发出相当于法术光亮术或 昼明术的光芒。使用一次后直至次日黎明前，昼明术效应将无法再次使用。\n你可以用魔法动作来说出另一个命令语，以让发光球体飞到空中，漂浮在离地面不超过5尺的地方。球体将持续漂浮在空中，直到你或另一生物将它抓住。如果你离开球体周围60尺范围，则它将沿最短路径跟随你移动直到距离你60尺为止。如果它的移动遭到妨碍，它将闪烁着落回地面并回到启动前的状态，其发出的光芒也会熄灭。", aliases: ["Driftglobe", "漂浮之球"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "无踪粉", en: "Dust of Disappearance", rarity: 非普通, kind: 奇物, attunement: "", page: 255, text: "这些粉末形同细沙，其分量足够使用一次。你可以用操作动作将粉末洒向空中，让你和以你为源点的10尺光环内的每个生物和物件变为隐形状态2d4分钟。每个目标的隐形时长相同，一旦粉末的魔法生效，其即被消耗。如果一名受影响的生物发动攻击或者施展法术，则该生物的隐形效应也随之终止。", aliases: ["Dust of Disappearance", "无踪粉"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "干燥粉", en: "Dust of Dryness", rarity: 非普通, kind: 奇物, attunement: "", page: 255, text: "这个小包里共装着1d6 + 4把粉末。你可以用一个操作动作将一把粉末洒到水面上。粉末将把15尺立方的水变成一个弹珠大小的小球，漂浮或停止在粉末被洒下的位置附近。小球的重量可以忽略不计。 生物可以用操作动作将小球摔在某个结实表面，以令小球破碎并释放其中的水分。这样做会摧毁小球并使其失去其魔力。\n你可以用操作动作将一把粉末洒在5尺内一个身体大部分由水组成的元素生物（例如水元素或水诡 ）身上。此时该生物须进行一次DC 13的体质豁免，豁免失败者受到10d6点暗蚀伤害，豁免成功则伤害减半。", aliases: ["Dust of Dryness", "干燥粉"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "喷嚏粉", en: "Dust of Sneezing and Choking", rarity: 非普通, kind: 奇物, attunement: "", page: 255, text: "这种粉末通常被装在小盒子里，其分量足够使用一次。这种粉末看起来像是无踪粉，对其施展鉴定术也会给出这样的结果。\n你可以用操作动作把这种粉末洒向空中，迫使你和你周围30尺光环内的生物进行一次DC 15的体质豁免，构装、元素、泥怪、植物和亡灵在豁免中自动成功。\n豁免失败者将不停打喷嚏，陷入失能并窒息。受影响的生物能在每次自己的回合结束时再次进行该豁免。一旦豁免成功，其自己身上的效应也将随之终止。法术次等复原术也可以终止一名生物身上的该效应。", aliases: ["Dust of Sneezing and Choking", "喷嚏粉"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "矮人飞锤", en: "Dwarven Thrower", rarity: 极珍稀, kind: 武器, attunement: "需矮人或与{@item 矮人腰带|XDMG}同调的生物", page: 256, text: "你用该魔法武器发动的攻击检定和伤害掷骰获得+3加值。它具有投掷属性，常规射程为20尺，最大射程为60尺。当你用此武器发动远程攻击命中时，它将造成1d8的额外力场伤害。如果命中的目标是一个生物类型为巨人的生物，则额外伤害提升为2d8。攻击后，此武器将立即飞回你的手中。", aliases: ["Dwarven Thrower", "矮人飞锤"], loot_tables: ["武备_极珍稀"]}
- {cn: "雷管", en: "Dynamite Stick", rarity: 未标注, kind: 爆炸物, attunement: "", page: 73, text: "以一个动作，你可以点燃一根雷管并将它扔到至多60尺远的一点。雷管将于该点爆炸，每个位于该点附近5尺半径球状内生物都必须进行一次DC 12的敏捷豁免，豁免失败者受到3d6力场伤害，豁免成功则伤害减半。\n将多根雷管绑在一起能使其同时爆炸，这需要花费1分钟的时间来操作。此时每增加一根雷管，其爆炸时的伤害都将增加1d6（至多增加至10d6），爆炸半径则增加5尺 （至多增加至20尺）。\n雷管可以通过安装更长的引线来延迟爆炸时间，这需要1分钟的时间来操作。这样做可以令雷管在更长的时间后才会爆炸，如1分钟或10分钟。", aliases: ["Dynamite Stick", "雷管"], loot_tables: []}
- {cn: "聆听耳号", en: "Ear Horn of Hearing", rarity: 普通, kind: 奇物, attunement: "", page: 256, text: "将这个小喇叭举在你耳边的期间，它会压制耳聋状态对你的影响。", aliases: ["Ear Horn of Hearing", "聆听耳号"], loot_tables: ["器具_普通", "圣物_普通"]}
- {cn: "火巨灵囚瓶", en: "Efreeti Bottle", rarity: 极珍稀, kind: 奇物, attunement: "", page: 256, text: "当你以一个魔法动作打开这个彩绘的黄铜瓶子的瓶塞时，一团浓烟将从瓶内溢出。在你的回合结束时，烟雾会伴随着一阵无害的火焰而消失，同时一名火巨灵将出现在你周边30尺内一处未被占据的空间。\n瓶子第一次被打开时，DM按下面的表格掷骰，以此来决定会发生什么。", aliases: ["Efreeti Bottle", "火巨灵囚瓶"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "元素宝石，蓝宝石", en: "Elemental Gem, Blue Sapphire", rarity: 非普通, kind: 奇物, attunement: "", page: 257, text: "这枚宝石蕴含了一道元素能量的微尘。你可以使用一个操作动作来打破宝石，随后宝石便会失去魔法，并召唤出一只气元素。元素会出现在距离被打破的宝石最近的未被占据的空间、理解你所说的语言、服从你的命令、使用你的先攻并在你之后立即执行其回合。元素会在1小时后、它死亡时、你用一个附赠动作解消时消失。", aliases: ["Elemental Gem, Blue Sapphire", "元素宝石，蓝宝石"], loot_tables: []}
- {cn: "元素宝石，翡翠", en: "Elemental Gem, Emerald", rarity: 非普通, kind: 奇物, attunement: "", page: 257, text: "这枚宝石蕴含了一道元素能量的微尘。你可以使用一个操作动作来打破宝石，随后宝石便会失去魔法，并召唤出一只水元素。元素会出现在距离被打破的宝石最近的未被占据的空间、理解你所说的语言、服从你的命令、使用你的先攻并在你之后立即执行其回合。元素会在1小时后、它死亡时、你用一个附赠动作解消时消失。", aliases: ["Elemental Gem, Emerald", "元素宝石，翡翠"], loot_tables: []}
- {cn: "元素宝石，红刚玉", en: "Elemental Gem, Red Corundum", rarity: 非普通, kind: 奇物, attunement: "", page: 257, text: "这枚宝石蕴含了一道元素能量的微尘。你可以使用一个操作动作来打破宝石，随后宝石便会失去魔法，并召唤出一只火元素。元素会出现在距离被打破的宝石最近的未被占据的空间、理解你所说的语言、服从你的命令、使用你的先攻并在你之后立即执行其回合。元素会在1小时后、它死亡时、你用一个附赠动作解消时消失。", aliases: ["Elemental Gem, Red Corundum", "元素宝石，红刚玉"], loot_tables: []}
- {cn: "元素宝石，黄钻石", en: "Elemental Gem, Yellow Diamond", rarity: 非普通, kind: 奇物, attunement: "", page: 257, text: "这枚宝石蕴含了一道元素能量的微尘。你可以使用一个操作动作来打破宝石，随后宝石便会失去魔法，并召唤出一只土元素。元素会出现在距离被打破的宝石最近的未被占据的空间、理解你所说的语言、服从你的命令、使用你的先攻并在你之后立即执行其回合。元素会在1小时后、它死亡时、你用一个附赠动作解消时消失。", aliases: ["Elemental Gem, Yellow Diamond", "元素宝石，黄钻石"], loot_tables: []}
- {cn: "健康灵药", en: "Elixir of Health", rarity: 珍稀, kind: 药水, attunement: "", page: 257, text: "当你饮下这瓶药水时，你身上的所有魔法性疫病都会被治愈。此外，你身上的目盲、耳聋、麻痹与中毒状态都会结束。\n这瓶清澈的红色液体中有着发光的微小气泡。", aliases: ["Elixir of Health", "健康灵药"], loot_tables: ["圣物_珍稀"]}
- {cn: "翡翠", en: "Emerald", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗深绿色的宝石。", aliases: ["Emerald", "翡翠"], loot_tables: []}
- {cn: "耐久法术书", en: "Enduring Spellbook", rarity: 普通, kind: 奇物, attunement: "", page: 257, text: "这本法术书及其书页上所写的任何内容都不会因火烧或浸水而受损。此外，这本法术书不会随时间老化。", aliases: ["Enduring Spellbook", "耐久法术书"], loot_tables: ["奥秘_普通"]}
- {cn: "魔咒法杖（戏法）", en: "Enspelled Staff (Cantrip)", rarity: 非普通, kind: 武器, attunement: "由施法者", page: 258, text: "这柄法杖中铭刻了一道戏法。这道法术可以是任意学派的一道法术，在制造此法杖的时候决定。此法杖具有6充能，且在每日黎明时重获1d6已消耗的充能。持握此法杖期间，你可以消耗1充能以施展该法术。若你消耗了法杖最后一充能，则掷一次1d20，若结果为1，则法杖失去其词条并变为一把非魔法长棍。\n该法术的DC为13，其攻击加值为+5。", aliases: ["Enspelled Staff (Cantrip)", "魔咒法杖", "魔咒法杖（戏法）"], loot_tables: []}
