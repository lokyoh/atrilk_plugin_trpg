- {cn: "召唤泰坦卷轴（兽主）", en: "Scroll of Titan Summoning (Animal Lord)", rarity: 传说, kind: 卷轴, attunement: "", page: 303, text: "当你以魔法动作阅读此卷轴时，一个兽主会显现在你1里内的地面或水里的未占据空间中。\n兽主对其他所有生物态度敌对，并将在生命值降至0时消失。若兽主被召唤到不足以容纳它的空间中，则召唤失败且卷轴被浪费。", aliases: ["Scroll of Titan Summoning (Animal Lord)", "召唤泰坦卷轴", "召唤泰坦卷轴（兽主）"], loot_tables: []}
- {cn: "召唤泰坦卷轴（吞世黏浆）", en: "Scroll of Titan Summoning (Blob of Annihilation)", rarity: 传说, kind: 卷轴, attunement: "", page: 303, text: "当你以魔法动作阅读此卷轴时，一个吞世黏浆会显现在你1里内的地面或水里的未占据空间中。\n吞世黏浆对其他所有生物态度敌对，并将在生命值降至0时消失。若吞世黏浆被召唤到不足以容纳它的空间中，则召唤失败且卷轴被浪费。", aliases: ["Scroll of Titan Summoning (Blob of Annihilation)", "召唤泰坦卷轴", "召唤泰坦卷轴（吞世黏浆）"], loot_tables: []}
- {cn: "召唤泰坦卷轴（巨像）", en: "Scroll of Titan Summoning (Colossus)", rarity: 传说, kind: 卷轴, attunement: "", page: 303, text: "当你以魔法动作阅读此卷轴时，一个巨神兵会显现在你1里内的地面或水里的未占据空间中。\n巨神兵对其他所有生物态度敌对，并将在生命值降至0时消失。若巨神兵被召唤到不足以容纳它的空间中，则召唤失败且卷轴被浪费。", aliases: ["Scroll of Titan Summoning (Colossus)", "召唤泰坦卷轴", "召唤泰坦卷轴（巨像）"], loot_tables: []}
- {cn: "召唤泰坦卷轴（元初天劫）", en: "Scroll of Titan Summoning (Elemental Cataclysm)", rarity: 传说, kind: 卷轴, attunement: "", page: 303, text: "当你以魔法动作阅读此卷轴时，一个元初天劫会显现在你1里内的地面或水里的未占据空间中。\n元初天劫对其他所有生物态度敌对，并将在生命值降至0时消失。若元初天劫被召唤到不足以容纳它的空间中，则召唤失败且卷轴被浪费。", aliases: ["Scroll of Titan Summoning (Elemental Cataclysm)", "召唤泰坦卷轴", "召唤泰坦卷轴（元初天劫）"], loot_tables: []}
- {cn: "召唤泰坦卷轴（至高天）", en: "Scroll of Titan Summoning (Empyrean)", rarity: 传说, kind: 卷轴, attunement: "", page: 303, text: "当你以魔法动作阅读此卷轴时，一个至高天会显现在你1里内的地面或水里的未占据空间中。\n至高天对其他所有生物态度敌对，并将在生命值降至0时消失。若至高天被召唤到不足以容纳它的空间中，则召唤失败且卷轴被浪费。", aliases: ["Scroll of Titan Summoning (Empyrean)", "召唤泰坦卷轴", "召唤泰坦卷轴（至高天）"], loot_tables: []}
- {cn: "召唤泰坦卷轴（克拉肯）", en: "Scroll of Titan Summoning (Kraken)", rarity: 传说, kind: 卷轴, attunement: "", page: 303, text: "当你以魔法动作阅读此卷轴时，克拉肯会显现在你1里内的地面或水里的未占据空间中。召唤一只克拉肯需要足以容纳它躯体的水体，否则召唤失败且卷轴被浪费。\n克拉肯对其他所有生物态度敌对，并将在生命值降至0时消失。若克拉肯被召唤到不足以容纳它的空间中，则召唤失败且卷轴被浪费。", aliases: ["Scroll of Titan Summoning (Kraken)", "召唤泰坦卷轴", "召唤泰坦卷轴（克拉肯）"], loot_tables: []}
- {cn: "泰坦召唤卷轴（泰拉斯奎）", en: "Scroll of Titan Summoning (Tarrasque)", rarity: 传说, kind: 卷轴, attunement: "", page: 303, text: "当你以魔法动作阅读此卷轴时，泰拉斯奎会显现在你1里内的地面或水里的未占据空间中。\n泰拉斯奎对其他所有生物态度敌对，并将在生命值降至0时消失。若泰拉斯奎被召唤到不足以容纳它的空间中，则召唤失败且卷轴被浪费。", aliases: ["Scroll of Titan Summoning (Tarrasque)", "泰坦召唤卷轴", "泰坦召唤卷轴（泰拉斯奎）"], loot_tables: []}
- {cn: "短讯石", en: "Sending Stones", rarity: 非普通, kind: 奇物, attunement: "", page: 303, text: "短讯石两颗一对，这两块石头经过雕刻而相互匹配，因此它们的配对非常容易辨认。触摸其中一块短讯石期间，你可以用它施展短讯术，目标为另一块短讯石的携带者。如果另一块短讯石没有被任何生物携带，则你在使用短讯石时会得知这一情况，而短讯术将不会被施展。\n一旦使用其中一块短讯石施展了短讯术，则两块短讯石直至次日黎明前都无法再次被使用。如果一块短讯石被摧毁，则与它配对的另一块石头也会失去其魔法。", aliases: ["Sending Stones", "短讯石"], loot_tables: ["奥秘_非普通", "圣物_非普通"]}
- {cn: "警戒之盾", en: "Sentinel Shield", rarity: 非普通, kind: 盾牌, attunement: "", page: 303, text: "持握这面盾牌期间，你进行的先攻检定和感知（察觉）检定具有优势。这面盾牌上的纹章是一只眼睛的图案。", aliases: ["Sentinel Shield", "警戒之盾"], loot_tables: ["武备_非普通"]}
- {cn: "蛇毒", en: "Serpent Venom", rarity: 未标注, kind: 奇物, attunement: "", page: 91, text: "受该毒药影响的生物必须成功通过一次DC 11的体质豁免，否则将受到10（3d6）毒素伤害，豁免成功则伤害减半。", aliases: ["Serpent Venom", "蛇毒"], loot_tables: []}
- {cn: "表情盾", en: "Shield of Expression", rarity: 普通, kind: 盾牌, attunement: "", page: 303, text: "这面盾牌的正面呈现出一张脸的形状。携带这面盾牌期间，你可以使用一个附赠动作来改变这张脸的表情。", aliases: ["Shield of Expression", "表情盾"], loot_tables: ["武备_普通", "圣物_普通"]}
- {cn: "引弹盾", en: "Shield of Missile Attraction", rarity: 珍稀, kind: 盾牌, attunement: "需同调", page: 304, text: "持握这面盾牌期间，你对使用远程武器进行的攻击所造成的伤害具有抗性。\n【诅咒】这面盾牌被诅咒了。与之同调会使你也被诅咒，直至你成为法术移除诅咒或类似魔法的目标。每当使用远程武器进行的攻击以你10尺内一个生物为目标时，诅咒会使你代替该生物成为目标。", aliases: ["Shield of Missile Attraction", "引弹盾"], loot_tables: ["武备_珍稀"]}
- {cn: "骑士之盾", en: "Shield of the Cavalier", rarity: 极珍稀, kind: 盾牌, attunement: "需同调", page: 304, text: "持握这面盾牌期间，你的护甲等级获得+2加值。这是盾牌原本提供的AC加值外的额外加值。\n持握这面盾牌期间，你可以使用以下额外词条。\n【强力猛击】当你执行攻击动作时，你可以使用这面盾牌进行其中一次攻击，这次攻击的目标必须在你5尺之内。将你的熟练加值和力量调整值加入攻击检定。若命中，盾牌会对目标造成2d6 + 2+你力量调整值的力场伤害，如果目标是生物，你可以将其推离至多10尺；如果该生物的体型与你相同或更小，你还可以同时将它击倒，使其陷入倒地状态。\n【庇护力场】当你或5尺内你可见的一位盟友成为一次攻击的目标，或为一次区域效应进行豁免检定时，你可以用反应使这面盾牌制造一个以你为源点的无法移动的5尺光环。当光环出现时，任何未完全位于其中的生物或物件都会被推至光环外最近的未占据空间中。触发此反应的攻击或区域效应将无法影响到光环内的生物和物件。光环需要你为之维持专注 ，并持续最多一分钟。没有任何东西可以进出光环，光环内的生物和物件不会受到来自外部的攻击或效应的伤害，光环内的生物也无法伤害其外部的任何东西。此词条一经使用，直至次日黎明前你都无法再次使用。", aliases: ["Shield of the Cavalier", "骑士之盾"], loot_tables: ["武备_极珍稀"]}
- {cn: "银龙鳞甲", en: "Silver Dragon Scale Mail", rarity: 极珍稀, kind: 护甲, attunement: "需同调", page: 254, text: "（规则见「龙鳞甲」条目）", aliases: ["Silver Dragon Scale Mail", "银龙鳞甲"], loot_tables: []}
- {cn: "蛛行便鞋", en: "Slippers of Spider Climbing", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 304, text: "着装这双便鞋期间，你无需借助双手即可上下移动，以及穿过垂直表面和沿着天花板移动。你获得等同于你速度的攀爬速度。不过，你无法以此法在滑溜的表面上移动，例如被冰或油覆盖的表面。", aliases: ["Slippers of Spider Climbing", "蛛行便鞋"], loot_tables: ["奥秘_非普通"]}
- {cn: "烟雾榴弹", en: "Smoke Grenade", rarity: 未标注, kind: 爆炸物, attunement: "", page: 73, text: "（规则见「手榴弹」条目）\n球状被烟雾笼罩，变为重度遮蔽，持续1分钟。烟雾可以被一阵强风（如造风术）吹散。", aliases: ["Smoke Grenade", "烟雾榴弹"], loot_tables: []}
- {cn: "至尊胶", en: "Sovereign Glue", rarity: 传说, kind: 奇物, attunement: "", page: 305, text: "这种乳白色的粘稠物质可以把任何两个物件永久性地粘在一起。至尊胶必须被储存在一个内壁涂满了滑溜之油的瓶子或罐子中。被发现时，容器中装有1d6 + 1盎司的至尊胶。\n每盎司至尊胶可以覆盖1平方尺的表面。涂抹一盎司至尊胶需要一个操作动作，涂抹的胶水将在1分钟后凝固。一旦至尊胶凝固，被粘在一起的东西就只能用万溶剂、以太化之油或法术祈愿术才能分开。", aliases: ["Sovereign Glue", "至尊胶"], loot_tables: ["奥秘_传说", "器具_传说"]}
- {cn: "法术卷轴 (戏法)", en: "Spell Scroll (Cantrip)", rarity: 普通, kind: 卷轴, attunement: "", page: 305, text: "每张法术卷轴都以神秘暗语记录了一道法术。如果这道法术在你的法术列表中，则你可以阅读该卷轴并施展其法术且无需任何材料成分；否则，你将无法理解该卷轴。通过阅读卷轴施展的法术同样需要遵循相应法术的正常施法时间。法术一经施展，卷轴本身就会化作尘土。如果施法被打断，则卷轴不会消失。\n如果这道法术在你的法术列表中，但其环阶高于你当前能施展的水平，则你必须使用你的施法属性进行一次属性检定，以决定是否可以施展这道法术，DC 10+这道法术的环阶。如果检定失败，则卷轴上记载的法术会消失，并且不会产生任何效果。\n如果法术需要进行豁免检定或攻击检定，法术豁免DC为13，攻击加值为+5。", aliases: ["Spell Scroll (Cantrip)", "法术卷轴", "法术卷轴 (戏法)"], loot_tables: ["奥秘_普通", "圣物_普通"]}
- {cn: "法术卷轴（一环）", en: "Spell Scroll (Level 1)", rarity: 普通, kind: 卷轴, attunement: "", page: 305, text: "每张法术卷轴都以神秘暗语记录了一道法术。如果这道法术在你的法术列表中，则你可以阅读该卷轴并施展其法术且无需任何材料成分；否则，你将无法理解该卷轴。通过阅读卷轴施展的法术同样需要遵循相应法术的正常施法时间。法术一经施展，卷轴本身就会化作尘土。如果施法被打断，则卷轴不会消失。\n如果这道法术在你的法术列表中，但其环阶高于你当前能施展的水平，则你必须使用你的施法属性进行一次DC 11的属性检定，以决定是否可以施展这道法术。如果检定失败，则卷轴上记载的法术会消失，并且不会产生任何效果。\n如果法术需要进行豁免检定或攻击检定，法术豁免DC为13，攻击加值为+5。\n【将卷轴抄录入法术书】法师法术卷轴上的法术可以被抄写到法术书中。当以这种方式抄写一个1环法术时，抄写者必须通过一个DC 11智力（奥秘）的检定。如果检定成功，法术被抄写下来。无论检定成功与否，这个法术卷轴都会被销毁。", aliases: ["Spell Scroll (Level 1)", "法术卷轴", "法术卷轴（一环）"], loot_tables: ["奥秘_普通", "圣物_普通"]}
- {cn: "法术卷轴（二环）", en: "Spell Scroll (Level 2)", rarity: 非普通, kind: 卷轴, attunement: "", page: 305, text: "每张法术卷轴都以神秘暗语记录了一道法术。如果这道法术在你的法术列表中，则你可以阅读该卷轴并施展其法术且无需任何材料成分；否则，你将无法理解该卷轴。通过阅读卷轴施展的法术同样需要遵循相应法术的正常施法时间。法术一经施展，卷轴本身就会化作尘土。如果施法被打断，则卷轴不会消失。\n如果这道法术在你的法术列表中，但其环阶高于你当前能施展的水平，则你必须使用你的施法属性进行一次DC 12的属性检定，以决定是否可以施展这道法术。如果检定失败，则卷轴上记载的法术会消失，并且不会产生任何效果。\n如果法术需要进行豁免检定或攻击检定，法术豁免DC为13，攻击加值为+5。\n【将卷轴抄录入法术书】法师法术卷轴上的法术可以被抄录到法术书中。当一个2环法术以这种方式被抄录时，抄录者必须通过一次 DC 12 智力（奥秘）检定。如果检定成功，法术被成功抄录。无论检定成功与否，法术卷轴都会被摧毁。", aliases: ["Spell Scroll (Level 2)", "法术卷轴", "法术卷轴（二环）"], loot_tables: ["奥秘_非普通", "圣物_非普通"]}
- {cn: "法术卷轴（三环）", en: "Spell Scroll (Level 3)", rarity: 非普通, kind: 卷轴, attunement: "", page: 305, text: "每张法术卷轴都以神秘暗语记录了一道法术。如果这道法术在你的法术列表中，则你可以阅读该卷轴并施展其法术且无需任何材料成分；否则，你将无法理解该卷轴。通过阅读卷轴施展的法术同样需要遵循相应法术的正常施法时间。法术一经施展，卷轴本身就会化作尘土。如果施法被打断，则卷轴不会消失。\n如果这道法术在你的法术列表中，但其环阶高于你当前能施展的水平，则你必须使用你的施法属性进行一次DC 13的属性检定，以决定是否可以施展这道法术。如果检定失败，则卷轴上记载的法术会消失，并且不会产生任何效果。\n如果法术需要进行豁免投掷或攻击检定，法术豁免DC为15，攻击加值为+7。\n【将卷轴抄录入法术书】法师法术卷轴上的法术可以抄录到法术书中。当以此方式抄录一个3环法术时，抄录者必须成功通过一次 DC 13 智力（奥秘）检定。检定成功后，法术被抄录。无论检定成功与否，法术卷轴都会被销毁。", aliases: ["Spell Scroll (Level 3)", "法术卷轴", "法术卷轴（三环）"], loot_tables: ["奥秘_非普通", "圣物_非普通"]}
- {cn: "法术卷轴（四环）", en: "Spell Scroll (Level 4)", rarity: 珍稀, kind: 卷轴, attunement: "", page: 305, text: "每张法术卷轴都以神秘暗语记录了一道法术。如果这道法术在你的法术列表中，则你可以阅读该卷轴并施展其法术且无需任何材料成分；否则，你将无法理解该卷轴。通过阅读卷轴施展的法术同样需要遵循相应法术的正常施法时间。法术一经施展，卷轴本身就会化作尘土。如果施法被打断，则卷轴不会消失。\n如果这道法术在你的法术列表中，但其环阶高于你当前能施展的水平，则你必须使用你的施法属性进行一次DC 14的属性检定，以决定是否可以施展这道法术。如果检定失败，则卷轴上记载的法术会消失，并且不会产生任何效果。\n如果法术需要进行豁免投掷或攻击检定，法术豁免DC为15，攻击加值为+7。\n【将卷轴抄录入法术书】法术卷轴上的法师法术可以被复制到法术书中。当以这种方式复制一个4环法术时，复制者必须在一次DC 14智力（奥秘）检定中成功。在成功的检定后，该法术被复制。无论检定成功还是失败，法术卷轴都会被销毁。", aliases: ["Spell Scroll (Level 4)", "法术卷轴", "法术卷轴（四环）"], loot_tables: ["奥秘_珍稀", "圣物_珍稀"]}
