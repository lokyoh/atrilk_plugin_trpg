- {cn: "+3 契约掌控者权杖", en: "+3 Rod of the Pact Keeper", rarity: 极珍稀, kind: 权杖, attunement: "由魔契师", page: 301, text: "当持握这根权杖时，你的魔契师法术的法术攻击检定和豁免DC获得+3加值。\n此外，持握这根权杖期间，你能够以一个魔法动作恢复一个法术位。该词条一经使用，你在完成一次长休后都无法再次使用。", aliases: ["+3 Rod of the Pact Keeper", "+3 契约掌控者权杖", "契约掌控者权杖", "契约掌控者权杖，+3"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "+3 战法师魔杖", en: "+3 Wand of the War Mage", rarity: 极珍稀, kind: 魔杖, attunement: "由施法者", page: 322, text: "持握这根魔杖时，你的法术攻击检定获得+3加值。此外，你在进行法术攻击检定时无视半身掩护。", aliases: ["+3 Wand of the War Mage", "+3 战法师魔杖", "战法师魔杖", "战法师魔杖，+3"], loot_tables: ["奥秘_极珍稀", "圣物_极珍稀"]}
- {cn: "+3 神功绑带", en: "+3 Wraps of Unarmed Power", rarity: 极珍稀, kind: 奇物, attunement: "", page: 325, text: "裹着这套布制绑带期间，你的徒手打击的攻击检定与伤害掷骰获得+3加值。且你可以令你的徒手打击造成力场伤害，而非原本的伤害类型。", aliases: ["神威绑带，+3", "+3 Wraps of Unarmed Power", "+3 神功绑带", "神功绑带", "神功绑带，+3"], loot_tables: ["武备_极珍稀"]}
- {cn: "炼金壶", en: "Alchemy Jug", rarity: 非普通, kind: 奇物, attunement: "", page: 227, text: "这种陶制壶看起来可以承装1加仑的液体，但无论壶中是空还是满，其重量都是12磅。不论壶内有没有液体，摇动它时也依然会发出液体晃动的声音。\n你可以用一个魔法动作从炼金壶液体表中选择并说出一种液体的名称，这个壶将立刻开始产出你指定的液体。然后，你可以用一个操作动作打开炼金壶，并以每分钟2加仑的速度倒出液体。壶中最多可以产出的液体质量取决于你指定的液体类型。\n一旦此壶开始生成液体，直到次日黎明前，它生成的液体无法超过其最大产量的液体或是产生另一种液体。", aliases: ["Alchemy Jug", "炼金壶"], loot_tables: ["器具_非普通"]}
- {cn: "亚历山大绿石", en: "Alexandrite", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗深绿色的宝石。", aliases: ["Alexandrite", "亚历山大绿石"], loot_tables: []}
- {cn: "琥珀", en: "Amber", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一种从淡金至赤金色的宝石。", aliases: ["Amber", "琥珀"], loot_tables: []}
- {cn: "紫水晶", en: "Amethyst", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗深紫色的宝石。", aliases: ["Amethyst", "紫水晶"], loot_tables: []}
- {cn: "健康护符", en: "Amulet of Health", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 228, text: "佩戴此护符期间，你的体质变为19。如果你的体质在未佩戴护符时已经大于或等于19，则护符不会起效。", aliases: ["Amulet of Health", "健康护符"], loot_tables: ["圣物_珍稀"]}
- {cn: "反侦护符", en: "Amulet of Proof against Detection and Location", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 228, text: "佩戴此护符期间，除非你允许，否则你不能成为预言法术的目标，也无法被魔法传感器察觉。", aliases: ["Amulet of Proof against Detection and Location", "反侦护符"], loot_tables: ["奥秘_非普通"]}
- {cn: "位面护符", en: "Amulet of the Planes", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 229, text: "佩戴此护符期间，你能够以一个魔法动作指名一个位于其他存在位面的你所熟悉的地点。那之后你进行一次DC 15的智力（奥秘）检定。如检定通过，你施展位面转移。如检定失败，你和位于你15尺内的每个生物与物件将被传送至一个由投掷1d100并根据下表决定的随机目的地。", aliases: ["Amulet of the Planes", "位面护符"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "活化盾", en: "Animated Shield", rarity: 极珍稀, kind: 盾牌, attunement: "需同调", page: 229, text: "持握此盾牌期间，你可以用附赠动作使其活化。盾牌将飞到空中并悬浮在你所占据的空间中保护你，如同你正持用着它一般，且同时解放你的双手。盾牌保持活化1分钟，如果你陷入失能 、死亡 、或用附赠动作终止其效应时，活化会提前结束。如果活化结束时你有空闲的手空着，盾牌将落回你手里；否则它会掉落在地上。", aliases: ["Animated Shield", "活化盾"], loot_tables: ["武备_极珍稀"]}
- {cn: "夸力许装置", en: "Apparatus of Kwalish", rarity: 传说, kind: 奇物, attunement: "", page: 229, text: "这件物品最初看起来是一个密封的铁制木桶，重达500磅。木桶有一个隐藏的开关，可以通过成功的DC 20智力（调查）检定发现。释放开关会解锁木桶一端的舱口，允许两个中型或更小的生物爬入内部。远端排列着十个操纵杆，每个都处于中立位置，可以上下移动。当使用特定操纵杆时，该装置会变形为类似一个巨大龙虾的外观。\n夸力许装置是一个大型物件，并具有以下数据：AC 20；HP 200；速度 30尺，游泳速度 30尺（若装置腿部未展开则均为0尺）；免疫毒素和心灵伤害。\n要将夸力许装置用作载具，需要一个飞行员。当装置的舱门关闭时，舱室是气密且防水的。舱室内的空气足够供10小时的呼吸，由内部呼吸的生物数量均分。\n夸力许装置可以浮在水面上。它也可以下潜至900尺深的水下。超过这个深度，载具每分钟会受到来自压力的2d6点钝击伤害。\n隔间内的生物可以采取一个操作动作来移动夸力许装置的两个拉杆向上或向下。每次使用后，拉杆会回到绝对中立位置。从左到右的每个拉杆功能如夸力许装置拉杆表格所示。", aliases: ["Apparatus of Kwalish", "夸力许装置"], loot_tables: ["奥秘_传说"]}
- {cn: "海蓝宝石", en: "Aquamarine", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一块淡蓝绿色的宝石。", aliases: ["Aquamarine", "海蓝宝石"], loot_tables: []}
- {cn: "坚不可摧护甲", en: "Armor of Invulnerability", rarity: 传说, kind: 护甲, attunement: "需同调", page: 230, text: "着装此护甲期间，你具有对钝击、穿刺和挥砍伤害的抗性。\n【金属外壳】你能够以一个魔法动作 令你具有对钝击、穿刺和挥砍伤害的免疫，持续10分钟或在你不再着装该此护甲时提前结束。该词条一经使用，直至次日黎明你都无法再次使用。", aliases: ["Armor of Invulnerability", "坚不可摧护甲"], loot_tables: ["武备_传说", "圣物_传说"]}
- {cn: "吸矢盾", en: "Arrow-Catching Shield", rarity: 珍稀, kind: 盾牌, attunement: "需同调", page: 231, text: "持握此盾牌期间，你对抗远程攻击的护甲等级具有+2加值。该加值将加在盾牌通常提供的加值上。\n此外，当一个攻击者对你周围5尺内的目标发动远程攻击时，你可以执行反应以替代该目标成为此次攻击的目标。", aliases: ["Arrow-Catching Shield", "吸矢盾"], loot_tables: ["武备_珍稀"]}
- {cn: "刺客之血", en: "Assassin's Blood", rarity: 未标注, kind: 奇物, attunement: "", page: 90, text: "服用这种毒药的生物需要进行一次DC 10的体质豁免。豁免失败则受6（1d12）毒素伤害并陷入中毒状态24小时。豁免成功则只受半伤。", aliases: ["Assassin's Blood", "刺客之血"], loot_tables: []}
- {cn: "矮人王圣斧", en: "Axe of the Dwarvish Lords", rarity: 神器, kind: 武器, attunement: "需同调", page: 231, text: "曾经有一位年轻的矮人王子，决定铸造一把武器作为人民团结的象征。王子冒险入山，比任何矮人挖的更深，进入了一座巨型火山炽燃的中心地带。在矮人的造物神莫拉丁的帮助下，他先是制作了四件强大的工具——星铁之镐Starmetal Pick、地心锻炉Earthheart Forge、歌之铁砧Anvil of Songs和塑形之锤Shaping Hammer 。然后，王子用这些工具铸造出了强大的矮人王圣斧。\n王子手持神器，为氏族争得和平，结束了猜忌与歧视。各氏族联成同盟，击退仇敌，开始了矮人的繁荣时代。此后，这名年轻的矮人王子被称作\"始王First King\"，这把传奇的武器也作为王权的象征，在他年老后传给了他的继任者。传承持续了数个世代。\n后来，在一个充斥着反叛与阴谋的黑暗年代，一群觊觎圣斧力量和它地位象征的人发动了一场血腥内战，圣斧也因此遗失。随后的几个世纪里，矮人们不断寻找圣斧的下落，而众多的冒险者也不停的寻求坊间传说，并四处挖掘古老的宝库以期寻得其踪迹。\n【魔化武器】矮人王圣斧是一把魔法武器，你用此魔法武器进行的攻击检定和伤害掷骰获得+3加值。 当你在以此武器攻击一名生物所进行的攻击检定的d20中掷出20时，额外造成20挥砍伤害。 圣斧具有投掷（20/60尺）词条，当你以此武器进行远程攻击并命中时，额外造成1d8力场伤害。若目标生物是巨人则改为额外造成2d8力场伤害。攻击命中或失手后，此武器立即回到你的手中。\n【摩拉丁的祝福】与圣斧维持同调期间，你获得以下增益： 【黑暗视觉】你获得 60 尺黑暗视觉。如果你已经有黑暗视觉，则其范围提升 60 尺。 【石之刚毅】你的体质提升2，至多提升至20。 【造物之赐】你获得铁匠工具、酿酒工具和石匠工具的熟练项。 【锻冶之伴】你获得对毒素伤害的免疫和对火焰伤害的抗性。 【断裁分离】当你以此武器命中物件时，物件受到其可能受到的最大伤害。\n【咒唤土元素】持握圣斧期间，你能够以魔法动作召唤一个土元素 ，其出现在一处你选择的位于你30尺内的未占据空间中，懂得你的语言，并将服从你的命令，且在你的先攻序位后立即执行其回合。土元素存在24小时，或者在其死亡或你以一个附赠动作解散其时提前消失。该词条一经使用，直至次日黎明你都无法再次使用。\n【随机词条】圣斧具有下列随机词条： 2项神器词条; 次要增益词条词条 1项神器词条; 主要增益词条词条 2项神器词条; 次要减益词条词条\n【地幔潜游】你能够以魔法动作触碰圣斧上一个特定的矮人石刻，并以此从圣斧中施展传送术。如果你的目标地点在地下，则你的传送不会出现意外事故或地点错误。该词条一经使用，三日之内你都无法再次使用。\n【摧毁战斧】摧毁圣斧的唯一办法是在创造它的地心锻炉Earthheart Forge里把它熔毁。它必须在熔炉的火焰里持续燃烧五十年，直至其最终屈服于火焰并被燃烧殆尽。", aliases: ["Axe of the Dwarvish Lords", "矮人王圣斧"], loot_tables: []}
- {cn: "蓝铜矿石", en: "Azurite", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一块斑驳的深蓝色宝石。", aliases: ["Azurite", "蓝铜矿石"], loot_tables: []}
- {cn: "芭芭·雅嘎的舞空帚", en: "Baba Yaga's Dancing Broom", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 232, text: "至高妖精芭芭雅嘎精心制作了许多此类魔法扫帚，每个看起来都并不类同。当你持握该扫帚时，你能够以一个魔法动作使其变形为一个受你控制的活化扫帚 。然后，该扫帚将移动至距离你最近的一处未被占据空间。该扫帚在你的先攻后行动，并保持活化，直到你以一个附赠动作说出命令词使其变回非活化状态。\n在你的回合中，只要你未陷入失能状态，且扫帚在你30尺范围内，你便可以精神性的指挥它（不需要动作）。你决定扫帚在它的回合中的移动和动作，也可以给出宽泛的指令，如攻击你的敌人或守卫某个地点。\n如果扫帚的生命值被降至0，则它将破碎并被摧毁。若扫帚在生命值未被降至0时恢复非活化状态，则它将恢复失去的所有生命值。", aliases: ["Baba Yaga's Dancing Broom", "芭芭·雅嘎的舞空帚"], loot_tables: ["奥秘_非普通"]}
- {cn: "魔豆之袋", en: "Bag of Beans", rarity: 珍稀, kind: 奇物, attunement: "", page: 233, text: "这个沉重的布袋被找到时装着3d4颗干燥的豆子。不论布袋中装了多少颗豆子，它都重半磅，并在其内部不再包含豆子时变为非魔法物品。\n如果你把一颗或更多豆子倒出，则它们将以自己为中心引发半径10尺球状的爆炸，其周围半径10尺球状包括你在内的每个生物进行一次DC 15的敏捷豁免。豁免失败者将受到5d4点力场伤害，豁免成功则伤害减半。所有被倒出的豆子都将在爆炸中被摧毁。\n如果你从布袋中取出1颗豆子，种入泥土或沙子中并浇上水，1分钟后，豆子将会消失并在其被种下的区域中产生一种效应。由DM在表格中选择或骰骰子在表格中随机决定。", aliases: ["Bag of Beans", "魔豆之袋"], loot_tables: ["奥秘_珍稀", "器具_珍稀"]}
- {cn: "吞噬袋", en: "Bag of Devouring", rarity: 极珍稀, kind: 奇物, attunement: "", page: 234, text: "这个类似于次元袋的袋子实际上是某个巨大异次元生物的进食口。将袋子内外翻转就可以关闭进食口的通道。\n与这个袋子关联的异次元生物可以感知到任何放入袋中的东西。完整放入袋中的动物或植物将被吞噬而永久消失。活物的一部分被放入袋中时（例如有人把手伸入袋子里时），该生物有50概率被拖入袋中。进入袋中的生物能够以一个动作进行一次DC 15的力量（运动）检定以从中逃脱。另一个生物能够以一个动作 进行一次DC 20的力量（运动）检定来将被吞噬的生物拉出来，前提是该生物自己没被拖入袋中。任何在袋中开始其自己回合的生物都将被吞噬，其躯体被摧毁。\n无生命物件可以存放在袋子里，袋子至多可容纳1立方尺的东西。此外，该袋子每日会有一次将其内的所有物件吐到另一存在位面。具体哪个位面由DM决定。\n袋子被戳破或撕裂时即被摧毁。其内的所有东西都将被传送到星界位面的随机地点。", aliases: ["Bag of Devouring", "吞噬袋"], loot_tables: ["奥秘_极珍稀", "器具_极珍稀"]}
- {cn: "次元袋", en: "Bag of Holding", rarity: 非普通, kind: 奇物, attunement: "", page: 234, text: "这个袋子有着比外表尺寸看起来更大的内部实际空间，从内部看，袋口约两平方尺，深约4尺，可以容纳至多500磅，体积不超过64立方尺的东西。无论装了什么，这个袋子总是重5磅。从袋子里取出东西需要花费一个操作动作。\n如果次元袋超载，或是袋子被戳破、撕裂，它将因此被摧毁，它所装载的东西将散落到星界位面各处。如果袋子被内外翻转，则它所装载的东西将完好无损地掉落出来，但再次使用袋子之前必须将它恢复原状。次元袋内所容纳的空气量可供其内生物呼吸的分钟数为10除以袋内正在呼吸的生物数量，此后袋内的生物便开始窒息。\n把次元袋放入霍华德便利袋、球状或其他类似物品内时，将会立即同时摧毁两件物品并打开一扇通往星界位面的传送门扉。门扉产生于放入另一物品的第一件物品的所在地。任何在门扉周边10尺球状区域内的生物将被吸入门内，并送往星界位面中的随机地点。然后门扉即时关闭，门的通道是单向的且无法被再次打开。", aliases: ["Bag of Holding", "次元袋"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "魔术袋，灰色", en: "Bag of Tricks, Gray", rarity: 非普通, kind: 奇物, attunement: "", page: 234, text: "这种布袋由灰色布料制成。布袋看起来空无一物，但把手伸进去会摸到一个小小的毛绒物件。\n你能够以一个魔法动作取出布袋里的毛绒物件，并把它扔出至多20尺远。当物件落地时，投骰子参考对应颜色布袋的表格决定物件变成的生物。相关生物的资料见怪物图鉴。该生物在次日黎明时分或者其生命值降至0时消失。\n扔出的生物对你和你的盟友态度友好，且会在你的先攻序位后行动。你能够以一个附赠动作命令该生物在其下一回合执行特定的移动方式，做特定的动作，例如攻击你的敌人。没接到命令时，该生物按自己天性行动。\n一旦袋子抽出三件毛绒物件后，直至次日黎明才可再次使用。", aliases: ["Bag of Tricks, Gray", "魔术袋，灰色"], loot_tables: []}
- {cn: "魔术袋，铁锈色", en: "Bag of Tricks, Rust", rarity: 非普通, kind: 奇物, attunement: "", page: 234, text: "这种布袋由铁锈色的布料制成。布袋看起来空无一物，但把手伸进去会摸到一个小小的毛绒物件。\n你能够以一个魔法动作取出布袋里的毛绒物件，并把它扔出至多20尺远。当物件落地时，投骰子参考对应颜色布袋的表格决定物件变成的生物。相关生物的资料见怪物图鉴。该生物在次日黎明时分或者其生命值降至0时消失。\n扔出的生物对你和你的盟友态度友好，且会在你的先攻序位后行动。你能够以一个附赠动作命令该生物在其下一回合执行特定的移动方式，做特定的动作，例如攻击你的敌人。没接到命令时，该生物按自己天性行动。\n一旦袋子抽出三件毛绒物件后，直至次日黎明才可再次使用。", aliases: ["Bag of Tricks, Rust", "魔术袋，铁锈色"], loot_tables: []}
- {cn: "魔术袋，棕褐色", en: "Bag of Tricks, Tan", rarity: 非普通, kind: 奇物, attunement: "", page: 234, text: "这种布袋由棕褐色的布料制成。布袋看起来空无一物，但把手伸进去会摸到一个小小的毛绒物件。\n你能够以一个魔法动作取出布袋里的毛绒物件，并把它扔出至多20尺远。当物件落地时，投骰子参考对应颜色布袋的表格决定物件变成的生物。相关生物的资料见怪物图鉴。该生物在次日黎明时分或者其生命值降至0时消失。\n扔出的生物对你和你的盟友态度友好，且会在你的先攻序位后行动。你能够以一个附赠动作命令该生物在其下一回合执行特定的移动方式，做特定的动作，例如攻击你的敌人。没接到命令时，该生物按自己天性行动。\n一旦袋子抽出三件毛绒物件后，直至次日黎明才可再次使用。", aliases: ["Bag of Tricks, Tan", "魔术袋，棕褐色"], loot_tables: []}
