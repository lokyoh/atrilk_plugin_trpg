- {cn: "黑刃", en: "Blackrazor", rarity: 神器, kind: 武器, attunement: "需同调", page: 236, text: "黑刃 藏在白羽山White Plume Mountain的地下城中，它像闪烁着繁星的夜空一样耀眼，黑色的剑鞘上镶满了切割好的黑曜石。\n你用此魔法武器进行的攻击检定和伤害掷骰获得+3加值。当你以此武器命中一名亡灵时，你受到1d10暗蚀伤害，目标则恢复1d10生命值。若该暗蚀伤害令你的生命值降至0，则黑刃将吞噬你的灵魂（见下文\"吞噬灵魂\"）。\n持握此武器期间，你具有对魅惑和恐慌的免疫，并具有30尺盲视。\n【吞噬灵魂】每当你以此武器将一名生物的生命值降至0时，这把剑会杀死这个生物并且吞噬它的灵魂。亡灵和构装不受影响。被黑刃吞噬灵魂的生物只能通过祈愿术复活。 当黑刃吞噬一个不是你的灵魂时，你获得等于被杀死生物生命值上限的临时生命值。\n【加速术】黑刃可以对你施展加速术。一旦它如此做，直至次日黎明其都无法再如此做。黑刃将决定何时施展该法术，然后该法术将在你的回合开始时对你生效。法术持续一分钟（无需专注）或在黑刃决定终止时提前结束。黑刃可以在你的任意回合结束时终止加速术。\n【智能】黑刃是一柄混乱中立的智能武器，智力为17，感知10，魅力19。它具有120尺听觉及120尺黑暗视觉。 黑刃说通用语并可以与持用者通过心灵感应交流，它的声音低沉且带有回声。与黑刃维持同调期间，黑刃也懂得任何你懂得的语言。\n【个性】黑刃的语气带着傲慢，好像习惯别人服从于它。 这把剑的目标是吞噬灵魂，它并不在乎吞噬谁的灵魂，哪怕是其持用者。这把剑相信所有的物质与能量都来源于负能量的虚无之中，且终将有一日一切都将回归其中。黑刃则希望能够加快这个过程。 除它信仰的虚无主义以外，黑刃对波涛Wave和征服Whelm这两把也被封印在白羽山中的武器有着莫名的亲近感。它希望三把武器能够重聚并一起战斗，尽管它十分不同意征服的看法也觉得波涛很无聊。 黑刃对灵魂的饥渴必须经常得到满足。如果这把剑三天或更长时间没吞吃灵魂，那它就会在次日黄昏时反噬其持用者。\n【摧毁黑刃】黑刃可以被机械境的巨大齿轮摧毁。此外，奇点 （魔冢的创造者）知晓一系列黑刃无法忍受的音乐曲调，可以使其剑刃崩碎。", aliases: ["Blackrazor", "黑刃"], loot_tables: []}
