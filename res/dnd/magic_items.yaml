- {cn: "义眼", en: "Ersatz Eye", rarity: 普通, kind: 奇物, attunement: "", page: 259, text: "这只魔法眼球可以替代一只失去或被移除的真眼。在义眼被植入你的眼窝期间，你可以透过这颗微型小球视物，就像它是你的天生眼睛一样。你可以使用一个魔法动作植入或移除该义眼，并且在你活着的时候，义眼无法违背你的意愿被移除。", aliases: ["Ersatz Eye", "义眼"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "乙醚精", en: "Essence of Ether", rarity: 未标注, kind: 奇物, attunement: "", page: 90, text: "吸入这种毒药的生物必须成功通过一次DC 15的体质豁免，否则将陷入中毒状态8小时。以此中毒期间该生物还会陷入昏迷状态。该生物会在受到伤害、或是其他生物用一个动作来将其摇醒时苏醒。", aliases: ["Essence of Ether", "乙醚精"], loot_tables: []}
- {cn: "无尽烟壶", en: "Eversmoking Bottle", rarity: 非普通, kind: 奇物, attunement: "", page: 259, text: "以一个魔法动作，你可以开关这个瓶子。\n打开此瓶会使浓重的烟雾从中涌出，形成一团浓厚的烟云。烟云会充满以此瓶为源点的60尺光环。被烟云笼罩的区域处于重度遮蔽。\n只要瓶子保持开启，每1分钟此光环就会扩大10尺，最大达到120尺。\n关闭此瓶会使烟云固定在原地，直至10分钟后消散。一阵强风（例如造风术所创造的）可以在1分钟后将其吹散。", aliases: ["Eversmoking Bottle", "无尽烟壶"], loot_tables: ["奥秘_非普通"]}
- {cn: "眼纹玛瑙", en: "Eye Agate", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗带有灰色、白色、棕色、蓝色或绿色圆环的宝石。", aliases: ["Eye Agate", "眼纹玛瑙"], loot_tables: []}
- {cn: "维克那法眼", en: "Eye of Vecna", rarity: 神器, kind: 奇物, attunement: "需同调", page: 259, text: "维克那是一名强大的法师。他行使魔法之力征讨，建立了一个恐怖的大帝国。然而，拥有强大力量的维克依然畏惧死亡，他采取手段，通过成为巫妖阻拦死亡的脚步。\n一名名为凯斯的将军发动了叛乱，并在一场骇人的战争中结束了维克那的统治，维克那剩下的只有一只手掌和一只眼睛，这些可怖的神器仍试图在世上贯彻维克纳的意志。\n维克那法眼Eye of Vecna和维克那魔掌是独立的神器，可能一起出现也可能被分开发现。法眼布满血丝，有如刚刚直接从眼眶中抽出。魔掌则是风干萎缩的左肢。\n【法眼与魔掌的随机词条】维克纳法眼具有下列随机词条： 1项神器词条; 次要增益词条词条 1项神器词条; 主要增益词条词条 1项神器词条; 次要减益词条词条\n【同调法眼】要与法眼进行同调，你必须将其压入挖空的眼眶内，法眼会自行嫁接入你的头部并留在其位置直至你死亡。此后法眼一旦被取下，你将立即死亡。\n【法眼词条】与法眼维持同调期间，你的阵营为中立邪恶，且你获得以下增益： 【真实视觉】你具有240尺的真实视觉。 【施法】法眼具有8充能，并在每日黎明时重获1d4 + 4已消耗的充能。你能以法眼施展维克纳法眼法术表中的法术（豁免DC 18）。表中表明了你施展对应的法术需要消耗多少充能。每当你以法眼施展法术时，维克纳有5的概率撕裂你的灵魂并将之吞噬，然后如控制傀儡一般控制你的躯体。这种情况下，你成为DM控制的NPC。 【X光视野】你能够以魔法动作获得距离30尺的X光视野，持续1分钟。对你而言，此视觉范围内的实体均为透明状态，并且不会阻碍光线通过。此视觉可以穿透1尺厚的石头、1寸厚的普通金属、或是至多3尺厚的木头或泥土。更厚的物件，或是一层铅片，将阻碍这种视觉。\n【摧毁法眼和魔掌】如果维克那法眼和维克那魔掌与同一生物维持同调，并且该生物被凯斯之剑斩杀，则法眼和魔掌即时迸出火焰烧成灰烬，并且被摧毁。任何其他摧毁法眼和魔掌的尝试似乎也是可行的，但这些神器会在维克那的其中一个隐藏宝库中重现，等着再临人间。", aliases: ["Eye of Vecna", "维克那法眼"], loot_tables: []}
- {cn: "魅惑镜片", en: "Eyes of Charming", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 261, text: "这副水晶镜片适合戴在眼前。它具有3充能。佩戴着这副镜片期间，你可以消耗至少1充能来施展魅惑类人（豁免DC 13）。若消耗1发充能，你可以施展一环版本的该法术。每多消耗一发充能，该法术的环阶就提升一环。镜片消耗掉的充能将在每天黎明时恢复。", aliases: ["Eyes of Charming", "魅惑镜片"], loot_tables: ["奥秘_非普通"]}
- {cn: "微视镜片", en: "Eyes of Minute Seeing", rarity: 非普通, kind: 奇物, attunement: "", page: 261, text: "这副水晶镜片适合戴在眼前。佩戴着这副镜片期间，你观察周边1尺距离内的事物时的视力显著提高，这将给予你此范围内的黑暗视觉，并使你为检视某物而进行的智力（调查）检定具有优势。", aliases: ["Eyes of Minute Seeing", "微视镜片"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "鹰眼镜片", en: "Eyes of the Eagle", rarity: 非普通, kind: 奇物, attunement: "", page: 261, text: "这副水晶镜片适合戴在眼前。佩戴着这副镜片期间，你依赖视力进行的感知（察觉）检定具有优势。另外，在视野清晰的情况下，你可以在距离极远之处看清小至2尺的生物与物件的细节。", aliases: ["Eyes of the Eagle", "鹰眼镜片"], loot_tables: ["器具_非普通"]}
- {cn: "异能塑像，青铜狮鹫", en: "Figurine of Wondrous Power, Bronze Griffon", rarity: 珍稀, kind: 奇物, attunement: "", page: 261, text: "异能塑像是小到可以装在口袋里的小雕塑。当你用一个魔法动作来将雕像扔到你周围60尺以内的某处时，它将变成一只活体生物（见下文对每种雕像的描述）。如果雕像被扔到的地方被其他生物或物件占据，或者周围的空间不足以容纳该雕像变成的生物，则它将不会变成生物。\n雕像变成的生物对你和你的盟友态度为友好。它能听懂你的语言并会按你的口头命令行事，使用你的先攻并在你回合结束后立即执行其回合。如果你不下达任何命令，则该生物会保护自己而不作其他动作。\n生物存在的时间依雕像而不同。持续时间结束时，生物将变回异能塑像形态。当它的生命值降至0，或是你在触碰它期间用一个魔法动作令其变回雕像时，它亦将提前变回雕像状态。变回雕像后，异能塑像的词条必须经过一段时间后才能再次启动（见下文描述）。\n【青铜狮鹫（珍稀）】一尊神形桀骜的青铜狮鹫雕像，可以变为一只狮鹫 ，其存在至多维持6小时。使用后，此雕像需要经过5日才能再次启动。", aliases: ["Figurine of Wondrous Power, Bronze Griffon", "异能塑像，青铜狮鹫"], loot_tables: ["奥秘_珍稀"]}
- {cn: "异能塑像，黑檀苍蝇", en: "Figurine of Wondrous Power, Ebony Fly", rarity: 珍稀, kind: 奇物, attunement: "", page: 261, text: "异能塑像是小到可以装在口袋里的小雕塑。当你用一个魔法动作来将雕像扔到你周围60尺以内的某处时，它将变成一只活体生物（见下文对每种雕像的描述）。如果雕像被扔到的地方被其他生物或物件占据，或者周围的空间不足以容纳该雕像变成的生物，则它将不会变成生物。\n雕像变成的生物对你和你的盟友态度为友好。它能听懂你的语言并会按你的口头命令行事，使用你的先攻并在你回合结束后立即执行其回合。如果你不下达任何命令，则该生物会保护自己而不作其他动作。\n生物存在的时间依雕像而不同。持续时间结束时，生物将变回异能塑像形态。当它的生命值降至0，或是你在触碰它期间用一个魔法动作令其变回雕像时，它亦将提前变回雕像状态。变回雕像后，异能塑像的词条必须经过一段时间后才能再次启动（见下文描述）。\n【黑檀苍蝇（珍稀）】一尊外形类似虻的黑檀雕像，可以变为可供骑乘的巨苍蝇，其存在至多维持12小时。使用后，此雕像需要经过2日才能再次启动。", aliases: ["Figurine of Wondrous Power, Ebony Fly", "异能塑像，黑檀苍蝇"], loot_tables: ["奥秘_珍稀"]}
- {cn: "异能塑像，黄金狮子", en: "Figurine of Wondrous Power, Golden Lions", rarity: 珍稀, kind: 奇物, attunement: "", page: 261, text: "异能塑像是小到可以装在口袋里的小雕塑。当你用一个魔法动作来将雕像扔到你周围60尺以内的某处时，它将变成一只活体生物（见下文对每种雕像的描述）。如果雕像被扔到的地方被其他生物或物件占据，或者周围的空间不足以容纳该雕像变成的生物，则它将不会变成生物。\n雕像变成的生物对你和你的盟友态度为友好。它能听懂你的语言并会按你的口头命令行事，使用你的先攻并在你回合结束后立即执行其回合。如果你不下达任何命令，则该生物会保护自己而不作其他动作。\n生物存在的时间依雕像而不同。持续时间结束时，生物将变回异能塑像形态。当它的生命值降至0，或是你在触碰它期间用一个魔法动作令其变回雕像时，它亦将提前变回雕像状态。变回雕像后，异能塑像的词条必须经过一段时间后才能再次启动（见下文描述）。\n【黄金狮子（珍稀）】这尊黄金制成的狮子雕像总是成对制造。你可以只使用其中一只，也可以同时使用这两只。每只狮子雕像都可以变为一只狮子 ，其存在至多维持1小时。每只狮子雕像都需要经过7日才能再次启动。", aliases: ["Figurine of Wondrous Power, Golden Lions", "异能塑像，黄金狮子"], loot_tables: ["奥秘_珍稀"]}
- {cn: "异能塑像，象牙山羊", en: "Figurine of Wondrous Power, Ivory Goats", rarity: 珍稀, kind: 奇物, attunement: "", page: 261, text: "异能塑像是小到可以装在口袋里的小雕塑。当你用一个魔法动作来将雕像扔到你周围60尺以内的某处时，它将变成一只活体生物（见下文对每种雕像的描述）。如果雕像被扔到的地方被其他生物或物件占据，或者周围的空间不足以容纳该雕像变成的生物，则它将不会变成生物。\n雕像变成的生物对你和你的盟友态度为友好。它能听懂你的语言并会按你的口头命令行事，使用你的先攻并在你回合结束后立即执行其回合。如果你不下达任何命令，则该生物会保护自己而不作其他动作。\n生物存在的时间依雕像而不同。持续时间结束时，生物将变回异能塑像形态。当它的生命值降至0，或是你在触碰它期间用一个魔法动作令其变回雕像时，它亦将提前变回雕像状态。变回雕像后，异能塑像的词条必须经过一段时间后才能再次启动（见下文描述）。\n【象牙山羊（珍稀）】这种象牙制成的山羊雕像总是三个为一组制造。每个山羊雕像都有独特的外形和功能，如下所述： 【可怖山羊】该塑像可以变为一只巨山羊并至多维持3小时。它无法发动攻击，但你可以（不造成伤害地）卸下它的角作为武器。其中一只角变为+1 骑枪，而另一只角则变为+2 长剑 。卸下一只角需要一个魔法动作。当山羊变回雕像时，角变成的武器也将随之消失，而山羊的角会恢复原状。另外，当你骑乘这头巨山羊时，它将散发出30尺半径的光环，任何在光环范围内开始其回合的敌对生物都必须进行一次DC 15的感知豁免，豁免失败则陷入恐慌状态1分钟，当你不再骑乘山羊、或是山羊变回雕像后该恐慌也会提前结束。该受恐慌生物可以在它的每个回合结束时再次进行该豁免，成功则终止其身上的该效应。生物豁免成功时，它将在随后的24小时里免疫该效应。使用后，此雕像需要经过15日才能再次启动。 【客运山羊】该塑像可以变为一只数据和乘用马相同的大型山羊。它有24发充能，处于野兽形态下时每小时（不足1小时按1小时计）将消耗1发充能。只要雕像还有充能，你就能随意使用它。当充能耗尽时，它将变回雕像且需要等到7日后充能完全恢复时才能再次启动。 【苦力山羊】该塑像可以变为一只巨山羊 ，其存在至多维持3小时。使用后，此雕像需要经过30日才能再次启动。", aliases: ["Figurine of Wondrous Power, Ivory Goats", "异能塑像，象牙山羊"], loot_tables: ["奥秘_珍稀"]}
- {cn: "异能塑像，大理石象", en: "Figurine of Wondrous Power, Marble Elephant", rarity: 珍稀, kind: 奇物, attunement: "", page: 261, text: "异能塑像是小到可以装在口袋里的小雕塑。当你用一个魔法动作来将雕像扔到你周围60尺以内的某处时，它将变成一只活体生物（见下文对每种雕像的描述）。如果雕像被扔到的地方被其他生物或物件占据，或者周围的空间不足以容纳该雕像变成的生物，则它将不会变成生物。\n雕像变成的生物对你和你的盟友态度为友好。它能听懂你的语言并会按你的口头命令行事，使用你的先攻并在你回合结束后立即执行其回合。如果你不下达任何命令，则该生物会保护自己而不作其他动作。\n生物存在的时间依雕像而不同。持续时间结束时，生物将变回异能塑像形态。当它的生命值降至0，或是你在触碰它期间用一个魔法动作令其变回雕像时，它亦将提前变回雕像状态。变回雕像后，异能塑像的词条必须经过一段时间后才能再次启动（见下文描述）。\n【大理石象（珍稀）】这尊大理石雕像的造型是一只吼叫的大象。它可以变为一头大象 ，存在至多维持24小时。使用后，雕像需要经过7日才能再次启动。", aliases: ["Figurine of Wondrous Power, Marble Elephant", "异能塑像，大理石象"], loot_tables: ["奥秘_珍稀"]}
- {cn: "异能塑像，黑曜石驹", en: "Figurine of Wondrous Power, Obsidian Steed", rarity: 极珍稀, kind: 奇物, attunement: "", page: 261, text: "异能塑像是小到可以装在口袋里的小雕塑。当你用一个魔法动作来将雕像扔到你周围60尺以内的某处时，它将变成一只活体生物（见下文对每种雕像的描述）。如果雕像被扔到的地方被其他生物或物件占据，或者周围的空间不足以容纳该雕像变成的生物，则它将不会变成生物。\n雕像变成的生物对你和你的盟友态度为友好。它能听懂你的语言并会按你的口头命令行事，使用你的先攻并在你回合结束后立即执行其回合。如果你不下达任何命令，则该生物会保护自己而不作其他动作。\n生物存在的时间依雕像而不同。持续时间结束时，生物将变回异能塑像形态。当它的生命值降至0，或是你在触碰它期间用一个魔法动作令其变回雕像时，它亦将提前变回雕像状态。变回雕像后，异能塑像的词条必须经过一段时间后才能再次启动（见下文描述）。\n【黑曜石驹（极珍稀）】这个打磨过的黑曜石驹雕像可以变为一只梦魇 ，其存在至多维持24小时。梦魇只会为了保护自己而战斗。使用后，此雕像需要经过5日才能再次启动。 每次使用此雕像时，它有10的概率会无视你的命令，包括让它变回雕像的命令。如果你在梦魇无视你命令时骑上它，则你和梦魇会一起立刻被传送到 哈迪斯Hades 位面的随机地点。之后梦魇将变回雕像。", aliases: ["异能塑像（黑曜石驹）", "Figurine of Wondrous Power, Obsidian Steed", "异能塑像，黑曜石驹"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "异能塑像，玛瑙狗狗", en: "Figurine of Wondrous Power, Onyx Dog", rarity: 珍稀, kind: 奇物, attunement: "", page: 261, text: "异能塑像是小到可以装在口袋里的小雕塑。当你用一个魔法动作来将雕像扔到你周围60尺以内的某处时，它将变成一只活体生物（见下文对每种雕像的描述）。如果雕像被扔到的地方被其他生物或物件占据，或者周围的空间不足以容纳该雕像变成的生物，则它将不会变成生物。\n雕像变成的生物对你和你的盟友态度为友好。它能听懂你的语言并会按你的口头命令行事，使用你的先攻并在你回合结束后立即执行其回合。如果你不下达任何命令，则该生物会保护自己而不作其他动作。\n生物存在的时间依雕像而不同。持续时间结束时，生物将变回异能塑像形态。当它的生命值降至0，或是你在触碰它期间用一个魔法动作令其变回雕像时，它亦将提前变回雕像状态。变回雕像后，异能塑像的词条必须经过一段时间后才能再次启动（见下文描述）。\n【玛瑙狗狗（珍稀）】这个玛瑙狗狗雕像可以变为一只獒犬，其存在至多维持6小时。这只獒犬智力为8并且会说通用语。它还具有60尺盲视。使用后，此雕像需要经过7日才能再次启动。", aliases: ["Figurine of Wondrous Power, Onyx Dog", "异能塑像，玛瑙狗狗"], loot_tables: ["奥秘_珍稀"]}
- {cn: "异能塑像，蛇纹石鸮", en: "Figurine of Wondrous Power, Serpentine Owl", rarity: 珍稀, kind: 奇物, attunement: "", page: 261, text: "异能塑像是小到可以装在口袋里的小雕塑。当你用一个魔法动作来将雕像扔到你周围60尺以内的某处时，它将变成一只活体生物（见下文对每种雕像的描述）。如果雕像被扔到的地方被其他生物或物件占据，或者周围的空间不足以容纳该雕像变成的生物，则它将不会变成生物。\n雕像变成的生物对你和你的盟友态度为友好。它能听懂你的语言并会按你的口头命令行事，使用你的先攻并在你回合结束后立即执行其回合。如果你不下达任何命令，则该生物会保护自己而不作其他动作。\n生物存在的时间依雕像而不同。持续时间结束时，生物将变回异能塑像形态。当它的生命值降至0，或是你在触碰它期间用一个魔法动作令其变回雕像时，它亦将提前变回雕像状态。变回雕像后，异能塑像的词条必须经过一段时间后才能再次启动（见下文描述）。\n【蛇纹石鸮（珍稀）】这个蛇纹石鸮雕像可以变为一只巨猫头鹰，而其存在至多维持8小时。只要你和该猫头鹰在同一位面，它就可以和你通过心灵感应进行沟通。使用后，此雕像需要经过2日才能再次启动。", aliases: ["Figurine of Wondrous Power, Serpentine Owl", "异能塑像，蛇纹石鸮"], loot_tables: ["奥秘_珍稀"]}
- {cn: "异能塑像, 白银渡鸦", en: "Figurine of Wondrous Power, Silver Raven", rarity: 非普通, kind: 奇物, attunement: "", page: 261, text: "异能塑像是小到可以装在口袋里的小雕塑。当你用一个魔法动作来将雕像扔到你周围60尺以内的某处时，它将变成一只活体生物（见下文对每种雕像的描述）。如果雕像被扔到的地方被其他生物或物件占据，或者周围的空间不足以容纳该雕像变成的生物，则它将不会变成生物。\n雕像变成的生物对你和你的盟友态度为友好。它能听懂你的语言并会按你的口头命令行事，使用你的先攻并在你回合结束后立即执行其回合。如果你不下达任何命令，则该生物会保护自己而不作其他动作。\n生物存在的时间依雕像而不同。持续时间结束时，生物将变回异能塑像形态。当它的生命值降至0，或是你在触碰它期间用一个魔法动作令其变回雕像时，它亦将提前变回雕像状态。变回雕像后，异能塑像的词条必须经过一段时间后才能再次启动（见下文描述）。\n【白银渡鸦（罕见）】这个银制渡鸦雕像可以变为一只渡鸦 ，其存在至多维持12小时。使用后，此雕像需要经过2日才能再次启动。当雕像处于渡鸦形态期间，雕像的魔法令你可以对其随意施展动物信使。", aliases: ["异能塑像（白银渡鸦）", "Figurine of Wondrous Power, Silver Raven", "异能塑像, 白银渡鸦"], loot_tables: ["奥秘_非普通"]}
- {cn: "火蛋白石", en: "Fire Opal", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一块炽热的红色宝石。", aliases: ["Fire Opal", "火蛋白石"], loot_tables: []}
- {cn: "折叠船", en: "Folding Boat", rarity: 珍稀, kind: 奇物, attunement: "", page: 263, text: "该物件外观看起来是个长12寸，宽6寸，深6寸的木盒。它重4磅且能在水面上漂浮，也可以像普通木盒一样装东西。该物品有三个命令语，使用每道命令语都需要一个魔法动作：\n【第一命令语】盒子展开为一艘划艇Rowboat。\n【第二命令语】盒子展开为一艘龙骨船Keelboat。\n【第三命令语】若船上没有生物，展开的折叠船则折叠回木盒形态。此时船内无法装入木盒中的物件会在折叠时留在外面，可以装入木盒的物件则会留在盒内。\n木盒展开成船只时，它的重量也变为对应船只应有的重量。原本存放在木盒中的东西将留在船内。\n划艇与龙骨船的数据见玩家手册。如果该物品在船形态下生命值被降至0，则该物品被摧毁。", aliases: ["Folding Boat", "折叠船"], loot_tables: ["奥秘_珍稀", "器具_珍稀"]}
- {cn: "破片榴弹", en: "Fragmentation Grenade", rarity: 未标注, kind: 爆炸物, attunement: "", page: 73, text: "（规则见「手榴弹」条目）\n球状内的每个生物都必须进行一次DC 15的敏捷豁免，豁免失败者受到17（5d6）穿刺伤害，豁免成功则伤害减半。", aliases: ["Fragmentation Grenade", "破片榴弹"], loot_tables: []}
- {cn: "石榴石", en: "Garnet", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗红色、棕色、绿色或紫色的宝石。", aliases: ["Garnet", "石榴石"], loot_tables: []}
- {cn: "食人魔力量护手", en: "Gauntlets of Ogre Power", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 264, text: "戴着这双护手期间，你的力量值变为19。如果未着装该护手时你的力量值已经大于或等于19，则该护手无效。", aliases: ["Gauntlets of Ogre Power", "食人魔力量护手"], loot_tables: ["武备_非普通"]}
- {cn: "光彩夺目宝石", en: "Gem of Brightness", rarity: 非普通, kind: 奇物, attunement: "", page: 264, text: "这块棱形宝石有50发充能。持握该宝石时，你可以用一个魔法动作来使用宝石的三个命令语之一，造成如下效应：\n【第一命令语】宝石发出亮光，提供30尺的明亮光照和其外30尺的微光光照。该效应不会消耗充能。此效应将持续到你用一个附赠动作再次说出该命令语，或你使用宝石的另一能力为止。\n【第二命令语】你消耗1发充能，令宝石向60尺内你能看见的一个生物发出一道耀眼的光束。该生物必须成功通过一次DC 15的体质豁免否则陷入目盲状态1分钟。该生物在其每个回合结束时可以重复此豁免，豁免成功则结束其身上的此效应。\n【第三命令语】你消耗5发充能，令宝石以自身为原点对30尺锥状区域放出刺眼的光芒。锥状区域内的每个生物必须进行豁免，如同它们被以第二命令语创造的射线击中一般。\n耗尽充能后，此宝石变为价值50gp的非魔法宝石。", aliases: ["Gem of Brightness", "光彩夺目宝石"], loot_tables: ["奥秘_非普通"]}
- {cn: "真视宝石", en: "Gem of Seeing", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 264, text: "这块宝石有3发充能。以一个魔法动作，你可以消耗1发充能。接下来的10分钟内，你在透过宝石观察周围时具有120尺的真实视觉。\n该宝石在每天黎明时恢复1d3发已消耗的充能。", aliases: ["Gem of Seeing", "真视宝石"], loot_tables: ["奥秘_珍稀"]}
- {cn: "幻惑镶钉皮甲", en: "Glamoured Studded Leather", rarity: 珍稀, kind: 护甲, attunement: "", page: 264, text: "穿着这件护甲期间，你的护甲等级获得+1加值。你还可以用一个附赠动作使这件护甲的外观幻化为任何非金属的衣物或其他种类的护甲。幻化后的外观由你决定——包括颜色、样式和配饰——但其体积和重量不变。幻化外观的效应持续到你脱掉此护甲或再次改变护甲外观。", aliases: ["Glamoured Studded Leather", "幻惑镶钉皮甲"], loot_tables: ["器具_珍稀"]}
- {cn: "辟矢夺箭手套", en: "Gloves of Missile Snaring", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 265, text: "在你穿戴该手套期间被远程或投掷武器造成的攻击检定命中时，若你至少空着一只手，则你可以用反应来减少1d10+你的敏捷调整值的伤害。如果你把伤害减少到0，则你可以选择抓住击中你的抛掷物（前提是它的尺寸足够让你用手抓住）。", aliases: ["Gloves of Missile Snaring", "辟矢夺箭手套"], loot_tables: ["器具_非普通"]}
- {cn: "攀泳手套", en: "Gloves of Swimming and Climbing", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 265, text: "穿戴该手套期间，你获得等同于你速度的游泳速度和攀爬速度。你进行攀爬与游泳相关的力量（运动）检定时获得+5的加值。", aliases: ["Gloves of Swimming and Climbing", "攀泳手套"], loot_tables: ["器具_非普通"]}
- {cn: "窃贼手套", en: "Gloves of Thievery", rarity: 非普通, kind: 奇物, attunement: "", page: 265, text: "这双手套穿戴在手上时看起来毫不起眼。穿戴该手套期间，你进行的敏捷（巧手）检定获得+5的加值。", aliases: ["Gloves of Thievery", "窃贼手套"], loot_tables: ["器具_非普通"]}
- {cn: "夜视镜", en: "Goggles of Night", rarity: 非普通, kind: 奇物, attunement: "", page: 265, text: "佩戴着这副暗色镜片期间，你具有60尺范围的黑暗视觉。如果你本就拥有黑暗视觉，则其在佩戴着这副夜视镜期间范围再扩大60尺。", aliases: ["Goggles of Night", "夜视镜"], loot_tables: ["器具_非普通"]}
- {cn: "金龙鳞甲", en: "Gold Dragon Scale Mail", rarity: 极珍稀, kind: 护甲, attunement: "需同调", page: 254, text: "（规则见「龙鳞甲」条目）", aliases: ["Gold Dragon Scale Mail", "金龙鳞甲"], loot_tables: []}
- {cn: "绿龙鳞甲", en: "Green Dragon Scale Mail", rarity: 极珍稀, kind: 护甲, attunement: "需同调", page: 254, text: "（规则见「龙鳞甲」条目）", aliases: ["Green Dragon Scale Mail", "绿龙鳞甲"], loot_tables: []}
- {cn: "榴弹发射器", en: "Grenade Launcher", rarity: 未标注, kind: 奇物, attunement: "", page: 73, text: "（规则见「手榴弹」条目）", aliases: ["Grenade Launcher", "榴弹发射器"], loot_tables: []}
- {cn: "火药（小桶）", en: "Gunpowder (keg)", rarity: 未标注, kind: 爆炸物, attunement: "", page: 73, text: "给填满火药的容器点火引燃就会使其爆炸。火药桶爆炸时，以小桶为原点、半径10尺的球状区域内的所有生物都必须进行一次DC 12敏捷豁免，豁免失败者将受到 24（7d6）火焰伤害，豁免成功则伤害减半。", aliases: ["Gunpowder (keg)", "火药", "火药（小桶）"], loot_tables: []}
- {cn: "火药（角瓶）", en: "Gunpowder (powder horn)", rarity: 未标注, kind: 爆炸物, attunement: "", page: 73, text: "给填满火药的容器点火引燃就会使其爆炸。角瓶爆炸时，以角瓶为原点、半径10尺的球状区域内的所有生物都必须进行一次DC 12敏捷豁免，豁免失败者将受到 24（3d6）火焰伤害，豁免成功则伤害减半。", aliases: ["Gunpowder (powder horn)", "火药", "火药（角瓶）"], loot_tables: []}
- {cn: "鬼婆之眼", en: "Hag Eye", rarity: 非普通, kind: 奇物, attunement: "", page: 265, text: "一颗鬼婆之眼具有3充能。你佩戴或持握这件物品期间可以消耗1充能以施展法术黑暗视觉（只能以自身为目标）或识破隐形。鬼婆之眼在每日黎明时恢复全部已消耗的充能。\n【集会传感器】鬼婆之眼通常会被托付给鬼婆的仆从以对其进行保护与转移。隶属于创造该鬼婆之眼集会的鬼婆若与鬼婆之眼处于同一存在位面上，则其可以用一个魔法动作透过鬼婆之眼视物。只要该鬼婆维持专注，则该效应将会一直持续。同一集会中的多个鬼婆可以同时透过该鬼婆之眼视物。\n【创造鬼婆之眼】只有鬼婆集会才能够制造此物品，其成品由裹在清漆中的真实眼球制成，并通常镶在吊坠或其他可佩戴的物品之上。一个鬼婆集会在同一时间只能拥有一颗鬼婆之眼，制作一个新的则需全部三位集会成员进行一场特殊仪式。这场仪式耗时1小时，且若一名或多名鬼婆陷入失能状态，则仪式无法进行。若鬼婆们在仪式期间执行任何其他动作，则仪式失败并终止。", aliases: ["Hag Eye", "鬼婆之眼"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "维克那魔掌", en: "Hand of Vecna", rarity: 神器, kind: 奇物, attunement: "需同调", page: 259, text: "维克那是一名强大的法师。他行使魔法之力征讨，建立了一个恐怖的大帝国。然而，拥有强大力量的维克依然畏惧死亡，他采取手段，通过成为巫妖阻拦死亡的脚步。\n一名名为凯斯的将军发动了叛乱，并在一场骇人的战争中结束了维克那的统治，维克那剩下的只有一只手掌和一只眼睛，这些可怖的神器仍试图在世上贯彻维克纳的意志。\n维克那法眼和维克那魔掌Hand of Vecna 是独立的神器，可能一起出现也可能被分开发现。法眼布满血丝，有如刚刚直接从眼眶中抽出。魔掌则是风干萎缩的左肢。\n【法眼与魔掌的随机词条】维克纳魔掌具有下列随机词条： 1项神器词条; 次要增益词条词条 1项神器词条; 主要增益词条词条 1项神器词条; 次要减益词条词条\n【同调魔掌】要与魔掌进行同调，你必须将魔掌压在左手断肢的截面。魔掌会自行嫁接入你的手臂并成为一副正常运作的前肢。此后魔掌一旦被取下，你将立即死亡。\n【魔掌词条】与魔掌维持同调期间，你的阵营为中立邪恶，且你获得以下增益： 【超级力量】你的力量变为20，除非其已是20或更高。 【极寒之抚】任意你以魔掌进行的近战法术攻击或你以魔掌持握的武器进行的近战攻击命中时，额外造成2d8寒冷伤害。 【施法】魔掌具有8充能，并在每日黎明时重获1d4 + 4已消耗的充能。你能以魔掌施展维克那魔掌法术表中的法术（豁免DC 18）。表中表明了你施展对应的法术需要消耗多少充能。每当你以魔掌施展法术时，魔掌会对你施展暗示术（豁免DC 18，无需专注）要求你犯下恶行。魔掌可能对恶行有特定的要求，或是由你决定具体的行为。\n【摧毁法眼和魔掌】如果维克那法眼和维克那魔掌与同一生物维持同调，并且该生物被凯斯之剑斩杀，则法眼和魔掌即时迸出火焰烧成灰烬，并且被摧毁。任何其他摧毁法眼和魔掌的尝试似乎也是可行的，但这些神器会在维克那的其中一个隐藏宝库中重现，等着再临人间。", aliases: ["Hand of Vecna", "维克那魔掌"], loot_tables: []}
- {cn: "易容帽", en: "Hat of Disguise", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 266, text: "着装此帽时，你可以施展易容术。若帽子被摘下，则法术结束。", aliases: ["Hat of Disguise", "易容帽"], loot_tables: ["奥秘_非普通"]}
- {cn: "万法无常帽", en: "Hat of Many Spells", rarity: 极珍稀, kind: 奇物, attunement: "由法师", page: 266, text: "这顶尖顶帽具有以下词条：\n【法器】持握这顶帽子期间，你可以将其作为你施展法师法术的法器使用。任何你通过这顶帽子施展的法术均具有特殊的姿势成分，即你必须将手伸入帽子之中以将法术从中\"拽\"出来。\n【未知法术】持握这顶帽子期间，你可以尝试施展一道你并未已知的一环或以上法术。所选法术必须位于法师法表中，同时其环阶必须是你能够施展的法术环阶，其也不能具有多于1000GP的材料成分。一旦你决定了施展哪道法术，你必须消耗法术环阶所对应的一个法术位。随后，为了决定你是否施展该法术，进行一次智力（奥秘）检定（DC 10+法术环阶）。检定成功，则你以该法术的正常施法时间施展该法术，且你直到完成一次短或长休之前不能再次使用此词条。检定失败，则你施法失败，转而在下表掷骰以决定触发的随机效应。 你通过帽子施展的所有法术均使用你的法术豁免DC和法术攻击加值。", aliases: ["Hat of Many Spells", "万法无常帽"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "害兽帽", en: "Hat of Vermin", rarity: 普通, kind: 奇物, attunement: "", page: 267, text: "这顶帽子有3充能。持握此帽期间，你可以用一个魔法动作消耗1充能，召唤你选择的下述三种生物之一：一只蝙蝠，一只青蛙或一只老鼠。召唤出的生物魔法性地出现在帽子中，并且会试图尽快远离你。此生物对你和其他生物的态度是冷漠，且不在你的控制之下。它会如其种类的普通生物一般行动，且会在1小时或者生命值降至0点时消失。此帽在每日黎明时恢复所有已消耗的充能。", aliases: ["Hat of Vermin", "害兽帽"], loot_tables: ["奥秘_普通"]}
- {cn: "巫术帽", en: "Hat of Wizardry", rarity: 普通, kind: 奇物, attunement: "由法师", page: 267, text: "这顶锥形帽上点缀着星月。你着装此帽期间，你获得下述增益。\n【法器】你可以将其作为你施展法师法术的法器。\n【未知法术】你可以用一个魔法动作尝试施展一道你并未已知的戏法。所选戏法必须位于法师法表中，并且其施法时间必须为动作。你进行一次DC 10的智力（奥秘）检定。检定成功，则你施展那道法术。检定失败，则你施法失败，用于施法的动作被浪费。无论检定成功与否，此词条一经使用，直到你完成一次长休之前不能再次使用。", aliases: ["Hat of Wizardry", "巫术帽"], loot_tables: ["奥秘_普通"]}
- {cn: "智力头带", en: "Headband of Intellect", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 268, text: "你着装此帽期间智力值变为19。若你未着装此物品时智力已为19或更高，则此魔法物品对你不产生效应。", aliases: ["Headband of Intellect", "智力头带"], loot_tables: ["奥秘_非普通"]}
- {cn: "光辉头盔", en: "Helm of Brilliance", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 268, text: "此头盔上镶嵌着1d10颗钻石，2d10颗红宝石，3d10颗火欧泊和4d10颗欧泊。任何从头盔上撬下的宝石都会崩碎成灰。头盔上所有的宝石都被移除或摧毁时，其便会失去魔法。\n你着装头盔时获得以下增益。\n【钻石辉光】只要头盔上至少有一颗钻石，其便会散发出30尺光环。至少有一名亡灵位于此区域中时，光环便会充满微光光照。任何在此区域中开始其回合的亡灵受到1d6光耀伤害。\n【火欧泊烈焰】只要头盔上至少有一颗火欧泊，你便可以用一个魔法动作令烈焰包裹在你持握的一把武器上。烈焰散发出10尺明亮光照与其外10尺微光光照。烈焰对你和武器是无害的。当你使用此武器进行的攻击检定命中时，目标额外受到1d6火焰伤害。烈焰持续至你用一个附赠动作熄灭烈焰，你丢下武器或收起武器。\n【红宝石抗性】只要头盔上至少有一颗红宝石，你便具有对火焰伤害的抗性。\n【法术】你可以施展以下法术之一（豁免DC 18），使用头盔上其中一颗特定种类的宝石作为法术成分：昼明术（欧泊）、火球术（火欧泊）、虹光喷射（钻石）、火墙术（红宝石）。施展法术时，宝石将被摧毁并从头盔上消失。\n【受到火焰伤害】若你着装着头盔且因失败于某一法术的豁免而受到了火焰伤害，骰1d20。若骰值为1，则头盔上剩余的宝石将迸射出光束，随后头盔被摧毁。每名位于以你为原点的60尺光环内的生物必须成功于一次DC 17的敏捷豁免检定，否则被光束击中并受到等同于头盔上剩余宝石数量的光耀伤害。", aliases: ["Helm of Brilliance", "光辉头盔"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "通晓语言头盔", en: "Helm of Comprehending Languages", rarity: 非普通, kind: 奇物, attunement: "", page: 268, text: "着装此头盔期间，你可以用其施展通晓语言。", aliases: ["Helm of Comprehending Languages", "通晓语言头盔"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "心灵感应头盔", en: "Helm of Telepathy", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 268, text: "着装此头盔期间，你具有30尺心灵感应，且你可以用头盔施展侦测思想和暗示术（豁免DC 13）。其中任意一道法术一经施展，那道法术直至次日黎明前都无法再次用头盔施展。", aliases: ["Helm of Telepathy", "心灵感应头盔"], loot_tables: ["奥秘_非普通"]}
- {cn: "传送头盔", en: "Helm of Teleportation", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 268, text: "此头盔具有3充能。着装此头盔期间，你可以消耗1充能用其施展传送术。此头盔在每日黎明时恢复1d3已消耗的充能。", aliases: ["Helm of Teleportation", "传送头盔"], loot_tables: ["奥秘_珍稀"]}
- {cn: "赤铁矿石", en: "Hematite", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一块灰黑色的宝石。", aliases: ["Hematite", "赤铁矿石"], loot_tables: []}
- {cn: "霍华德便利袋", en: "Heward's Handy Haversack", rarity: 珍稀, kind: 奇物, attunement: "", page: 269, text: "此背包有一个中袋和两个侧袋，每个袋子都是一个异次元空间。每个侧袋可容纳重量不超过200磅，体积不超过25立方尺的物体。中袋可容纳重量不超过500磅，体积不超过64立方尺的物体。无论装了多少东西，背包总是重5磅。\n从背包中取出一件物品需要一个操作动作或一个附赠动作动作（由你选择）。当你伸进背包中寻找一件特定物品时，该物品总会魔法性的出现在最上面。\n如果背包中的任何一个袋子超过其负载，被戳破，或撕裂，背包就会破裂并被摧毁。如果背包被摧毁，其装载的东西将永远消失，不过一件神器总会在某个地方重新出现。如果背包被内外翻转，则其所装载的东西也将安全的掉落出来，但再次使用背包之前必须将其恢复原状。\n背包的每个袋子都容纳有足够其中需呼吸生物呼吸10除以该袋内呼吸生物的数量分钟数的空气。\n将背包放入次元袋、次元洞或其他类似物品产生的异次元空间时，将立即摧毁这两件物品并打开一扇通往星光位面的门扉。门扉会产生在被放入另一件物品的前一件物品所在的空间位置。任何位于门扉10尺内且不处于全身掩护后的生物将被吸入门内并送到星光位面的随机位置，随后该门关闭。这扇门扉只能单向通过且无法被再次打开。", aliases: ["Heward's Handy Haversack", "霍华德便利袋"], loot_tables: ["奥秘_珍稀", "器具_珍稀"]}
- {cn: "霍华德便利香料包", en: "Heward's Handy Spice Pouch", rarity: 普通, kind: 奇物, attunement: "", page: 269, text: "这个腰包看起来是空的，并具有10充能。持握此小包期间，你可以用一个魔法动作消耗1充能，说出任何一种非魔法的食物调味料的名字（例如盐、胡椒、藏红花、或香菜），并从腰包中取出一撮所需的调味料。一撮调料就足以调味一顿单人份食物。小包会在每日黎明时恢复1d6 + 4已消耗的充能。", aliases: ["Heward's Handy Spice Pouch", "霍华德便利香料包"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "音爆号角", en: "Horn of Blasting", rarity: 珍稀, kind: 乐器, attunement: "", page: 270, text: "你可以用一个魔法动作说出号角的命令语然后吹响号角。号角将产生30尺锥状的音爆，其声音可传播远达600尺。锥状内的每个生物必须进行一次DC 15的体质豁免。豁免失败的生物将受5d8点雷鸣伤害并耳聋1分钟，成功则伤害减半且不会耳聋。在锥状内由玻璃或晶体构成的生物或物件进行该豁免时具有劣势，且会受到10d8而非5d6的伤害。\n每次使用号角的效应都有20的概率导致它爆炸，号角也将因此被摧毁且对吹响它的人造成10d6点火焰伤害。", aliases: ["Horn of Blasting", "音爆号角"], loot_tables: ["武备_珍稀", "圣物_珍稀"]}
- {cn: "静报号角", en: "Horn of Silent Alarm", rarity: 普通, kind: 乐器, attunement: "", page: 270, text: "这个号角具有4充能，且在每日黎明时恢复1d4已消耗的充能。你可以用一个魔法动作消耗1充能吹响它。一名600尺范围内由你选择的生物将能听到其声音。除此之外的任何其他生物都无法听见这个号角的声音。", aliases: ["Horn of Silent Alarm", "静报号角"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "瓦尔哈拉号角，黄铜", en: "Horn of Valhalla, Brass", rarity: 珍稀, kind: 乐器, attunement: "", page: 270, text: "你可以用一个魔法动作吹响号角。作为回应，伊斯加德的武者英灵们将在你周围60尺内未占据的空间出现。这些英灵使用狂战士的数据，它们将会在1小时之后或生命值降低到0时返回伊斯加德。英灵们看起来就像是活着的，能够呼吸的战士，且它们免疫魅惑与恐慌状态。号角一经使用，需要经过7天才能再次使用。\n黄铜号角可以召唤3个狂战士。要满足黄铜号角的要求，你必须具有所有简易武器的熟练。\n如果你在不满足先决条件的情况下吹响了号角，则召唤出的狂战士将对你发动攻击。如果你满足先决条件，他们将对你和你的同伴态度友好，并听从你的命令。", aliases: ["Horn of Valhalla, Brass", "瓦尔哈拉号角，黄铜"], loot_tables: ["武备_珍稀", "圣物_珍稀"]}
- {cn: "瓦尔哈拉号角，青铜", en: "Horn of Valhalla, Bronze", rarity: 极珍稀, kind: 乐器, attunement: "", page: 270, text: "你可以用一个魔法动作吹响号角。作为回应，伊斯加德的武者英灵们将在你周围60尺内未占据的空间出现。这些英灵使用狂战士的数据，它们将会在1小时之后或生命值降低到0时返回伊斯加德。英灵们看起来就像是活着的，能够呼吸的战士，且它们免疫魅惑与恐慌状态。号角一经使用，需要经过7天才能再次使用。\n青铜号角可以召唤4个狂战士。要满足青铜号角的要求，你必须受训于所有中甲。\n如果你在不满足先决条件的情况下吹响了号角，则召唤出的狂战士将对你发动攻击。如果你满足先决条件，他们将对你和你的同伴态度友好，并听从你的命令。", aliases: ["Horn of Valhalla, Bronze", "瓦尔哈拉号角，青铜"], loot_tables: ["武备_极珍稀", "圣物_极珍稀"]}
- {cn: "瓦尔哈拉号角，黑铁", en: "Horn of Valhalla, Iron", rarity: 传说, kind: 乐器, attunement: "", page: 270, text: "你可以用一个魔法动作吹响号角。作为回应，伊斯加德的武者英灵们将在你周围60尺内未占据的空间出现。这些英灵使用狂战士的数据，它们将会在1小时之后或生命值降低到0时返回伊斯加德。英灵们看起来就像是活着的，能够呼吸的战士，且它们免疫魅惑与恐慌状态。号角一经使用，需要经过7天才能再次使用。\n一个黑铁号角召唤5个狂战士。要满足黑铁号角的要求，你必须具有所有军用武器的熟练。\n如果你在不满足先决条件的情况下吹响了号角，则召唤出的狂战士将对你发动攻击。如果你满足先决条件，他们将对你和你的同伴态度友好，并听从你的命令。", aliases: ["Horn of Valhalla, Iron", "瓦尔哈拉号角，黑铁"], loot_tables: ["武备_传说", "圣物_传说"]}
- {cn: "瓦尔哈拉号角，白银", en: "Horn of Valhalla, Silver", rarity: 珍稀, kind: 乐器, attunement: "", page: 270, text: "你可以用一个魔法动作吹响号角。作为回应，伊斯加德的武者英灵们将在你周围60尺内未占据的空间出现。这些英灵使用狂战士的数据，它们将会在1小时之后或生命值降低到0时返回伊斯加德。英灵们看起来就像是活着的，能够呼吸的战士，且它们免疫魅惑与恐慌状态。号角一经使用，需要经过7天才能再次使用。\n一只白银号角召唤2个狂战士。他们会对你和你的盟友持友好态度，并听从你的命令。", aliases: ["Horn of Valhalla, Silver", "瓦尔哈拉号角，白银"], loot_tables: ["武备_珍稀", "圣物_珍稀"]}
- {cn: "西风马蹄铁", en: "Horseshoes of a Zephyr", rarity: 极珍稀, kind: 奇物, attunement: "", page: 270, text: "这些马蹄铁四个为一套。你可以用一个魔法动作将其中一个马蹄铁与一匹马或类似生物的蹄子接触，随后马蹄铁就会附着在蹄子上。移除一个马蹄铁也需要一个魔法动作。\n四个马蹄铁同时附着在一匹马或类似的生物身上期间，它将悬浮在离地面4寸的高度，并可以如常移动。这使得该生物可以穿过或站在非固态或非稳定的平面上，例如水面或岩浆。它无视困难地形并且不会留下足迹。此外，该生物每天最多可以旅行12个小时，并且不会因为长时间旅行而获得力竭等级。", aliases: ["Horseshoes of a Zephyr", "西风马蹄铁"], loot_tables: ["奥秘_极珍稀", "器具_极珍稀"]}
- {cn: "加速马蹄铁", en: "Horseshoes of Speed", rarity: 珍稀, kind: 奇物, attunement: "", page: 270, text: "这些马蹄铁四个为一套。你可以用一个魔法动作将其中一个马蹄铁与一匹马或类似生物的蹄子接触，随后马蹄铁就会附着在蹄子上。移除一个马蹄铁也需要一个魔法动作。\n当四个马蹄铁都附着在同一生物身上期间，其速度增加30尺。", aliases: ["Horseshoes of Speed", "加速马蹄铁"], loot_tables: ["奥秘_珍稀", "器具_珍稀"]}
- {cn: "不动权杖", en: "Immovable Rod", rarity: 非普通, kind: 权杖, attunement: "", page: 270, text: "这根铁质权杖的一端具有一枚按钮。你可以执行操作动作按下按钮，让这根权杖魔法性地固定在原处。直到你或另一生物执行操作动作再次按下按钮前，即使违反了重力定律，权杖也不会移动。权杖最多能负载8000磅的重量。更重的负载则会让权杖的效应失效并掉落在地。一个生物可以执行操作动作来进行一次DC 30的力量（运动）检定，成功则可以将固定住的权杖移动最多10尺。", aliases: ["Immovable Rod", "不动权杖"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "幻象乐器", en: "Instrument of Illusions", rarity: 普通, kind: 奇物, attunement: "", page: 271, text: "在你使用这把乐器进行演奏期间，你可以使用一个魔法动作在以乐器为源点的5尺光环内创造出无害的、幻象般的视觉效应。如果你是一名吟游诗人，则光环的范围将提升至15尺。简单的视觉效应包括了幻光的音符、虚幻的舞者、舞动的蝴蝶、以及飘散的雪花。这种魔法效应既无触感亦无声音，且它们显然是幻象。你终止演奏的同时，此效应结束。", aliases: ["Instrument of Illusions", "幻象乐器"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "撰写乐器", en: "Instrument of Scribing", rarity: 普通, kind: 奇物, attunement: "", page: 271, text: "这把乐器具有3充能，并在每日黎明时重获所有已消耗的充能。在你使用这把乐器进行演奏期间，你可以使用一个魔法动作消耗1充能，在你周边30尺范围内一个可见的非魔法物件或表面上写下一段魔法信息。这段信息以一种你熟知的语言书写，且其最长六个单词。如果你是一名吟游诗人，则你可写的单词上限增加七个，并且你可以使信息发出微弱光芒，使其在非魔法黑暗中清晰可见。信息会在24小时后消失，也可用法术解除魔法将其抹去。", aliases: ["Instrument of Scribing", "撰写乐器"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "吟游诗人乐器，安斯翠瑟竖琴", en: "Instrument of the Bards, Anstruth Harp", rarity: 极珍稀, kind: 奇物, attunement: "由吟游诗人", page: 272, text: "吟游诗人乐器在各方面都优于普通乐器。吟游诗人乐器共有七种，每种都以一所吟游诗人学院的名字命名。在未与乐器完成同调的情况下，尝试演奏乐器的生物必须进行一次DC 15的感知豁免，豁免失败则会受到2d4心灵伤害。\n你可以通过演奏安斯翠瑟竖琴来施展以下法术之一：飞行术、隐形术、浮空术、防护善恶、疗伤术、冰风暴和棘墙术。一旦该乐器被用来施展了某一个法术，则其直至次日黎明前都无法再被用来施展该法术。这些法术使用你的施法属性和法术豁免DC。", aliases: ["Instrument of the Bards, Anstruth Harp", "吟游诗人乐器，安斯翠瑟竖琴"], loot_tables: ["器具_极珍稀"]}
- {cn: "吟游诗人乐器，凯纳斯曼陀林", en: "Instrument of the Bards, Canaith Mandolin", rarity: 珍稀, kind: 奇物, attunement: "由吟游诗人", page: 272, text: "吟游诗人乐器在各方面都优于普通乐器。吟游诗人乐器共有七种，每种都以一所吟游诗人学院的名字命名。在未与乐器完成同调的情况下，尝试演奏乐器的生物必须进行一次DC 15的感知豁免，豁免失败则会受到2d4心灵伤害。\n你可以通过演奏卡奈斯曼陀林 来施展以下法术之一：飞行术、隐形术、浮空术、防护善恶、疗伤术、解除魔法和防护能量（ 仅闪电伤害）。一旦该乐器被用来施展了某一个法术，则其直至次日黎明前都无法再被用来施展该法术。这些法术使用你的施法属性和法术豁免DC。", aliases: ["Instrument of the Bards, Canaith Mandolin", "吟游诗人乐器，凯纳斯曼陀林"], loot_tables: ["器具_珍稀"]}
- {cn: "吟游诗人乐器，科里里拉琴", en: "Instrument of the Bards, Cli Lyre", rarity: 珍稀, kind: 乐器, attunement: "由吟游诗人", page: 272, text: "吟游诗人乐器在各方面都优于普通乐器。吟游诗人乐器共有七种，每种都以一所吟游诗人学院的名字命名。在未与乐器完成同调的情况下，尝试演奏乐器的生物必须进行一次DC 15的感知豁免，豁免失败则会受到2d4心灵伤害。\n你可以通过演奏科里里拉里拉琴来施展以下法术之一：飞行术、隐形术、浮空术、防护善恶、塑石术、火墙术和风墙术。一旦该里拉琴被用来施展了某一个法术，则其直至次日黎明前都无法再被用来施展该法术。这些法术使用你的施法属性和法术豁免DC。", aliases: ["Instrument of the Bards, Cli Lyre", "吟游诗人乐器，科里里拉琴"], loot_tables: ["器具_珍稀"]}
- {cn: "吟游诗人乐器，安眠鲁特琴", en: "Instrument of the Bards, Doss Lute", rarity: 非普通, kind: 乐器, attunement: "由吟游诗人", page: 272, text: "吟游诗人乐器在各方面都优于普通乐器。吟游诗人乐器共有七种，每种都以一所吟游诗人学院的名字命名。在未与乐器完成同调的情况下，尝试演奏乐器的生物必须进行一次DC 15的感知豁免，豁免失败则会受到2d4心灵伤害。\n你可以通过演奏道斯鲁特琴来施展以下法术之一：飞行术、隐形术、浮空术、防护善恶、化兽为友、防护能量（仅火焰伤害）和防护毒素。一旦该道斯鲁特琴被用来施展了某一个法术，则其直至次日黎明前都无法再被用来施展该法术。这些法术使用你的施法属性和法术豁免DC。", aliases: ["Instrument of the Bards, Doss Lute", "吟游诗人乐器，安眠鲁特琴"], loot_tables: ["器具_非普通"]}
- {cn: "吟游诗人乐器，佛克路坎三弦琴", en: "Instrument of the Bards, Fochlucan Bandore", rarity: 非普通, kind: 乐器, attunement: "由吟游诗人", page: 272, text: "吟游诗人乐器在各方面都优于普通乐器。吟游诗人乐器共有七种，每种都以一所吟游诗人学院的名字命名。在未与乐器完成同调的情况下，尝试演奏乐器的生物必须进行一次DC 15的感知豁免，豁免失败则会受到2d4心灵伤害。\n你可以通过演奏佛克路坎班多里琴来施展以下法术之一：飞行术、隐形术、浮空术、防护善恶、纠缠术、妖火、橡棍术和动物交谈。一旦该乐器被用来施展了某一个法术，则其直至次日黎明前都无法再被用来施展该法术。这些法术使用你的施法属性和法术豁免DC。", aliases: ["Instrument of the Bards, Fochlucan Bandore", "吟游诗人乐器，佛克路坎三弦琴"], loot_tables: ["器具_非普通"]}
- {cn: "吟游诗人乐器，麦克-弗瑞米西特琴", en: "Instrument of the Bards, Mac-Fuirmidh Cittern", rarity: 非普通, kind: 乐器, attunement: "由吟游诗人", page: 272, text: "吟游诗人乐器在各方面都优于普通乐器。吟游诗人乐器共有七种，每种都以一所吟游诗人学院的名字命名。在未与乐器完成同调的情况下，尝试演奏乐器的生物必须进行一次DC 15的感知豁免，豁免失败则会受到2d4心灵伤害。\n你可以通过演奏麦克-弗瑞米西特琴来施展以下法术之一：飞行术、隐形术、浮空术、防护善恶、树肤术、疗伤术、和云雾术。一旦该乐器被用来施展了某一个法术，则其直至次日黎明前都无法再被用来施展该法术。这些法术使用你的施法属性和法术豁免DC。", aliases: ["Instrument of the Bards, Mac-Fuirmidh Cittern", "吟游诗人乐器，麦克-弗瑞米西特琴"], loot_tables: ["器具_非普通"]}
- {cn: "吟游诗人乐器，奥莱姆竖琴", en: "Instrument of the Bards, Ollamh Harp", rarity: 传说, kind: 奇物, attunement: "由吟游诗人", page: 272, text: "吟游诗人乐器在各方面都优于普通乐器。吟游诗人乐器共有七种，每种都以一所吟游诗人学院的名字命名。在未与乐器完成同调的情况下，尝试演奏乐器的生物必须进行一次DC 15的感知豁免，豁免失败则会受到2d4心灵伤害。\n你可以通过演奏奥莱姆竖琴来施展以下法术之一：飞行术、隐形术、浮空术、防护善恶、困惑术、操控天气和火焰风暴。一旦该奥莱姆竖琴被用来施展了某一个法术，则其直至次日黎明前都无法再被用来施展该法术。这些法术使用你的施法属性和法术豁免DC。", aliases: ["Instrument of the Bards, Ollamh Harp", "吟游诗人乐器，奥莱姆竖琴"], loot_tables: ["器具_传说"]}
- {cn: "艾恩石, 吸收", en: "Ioun Stone, Absorption", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n在这颗淡紫色的椭球形艾恩石环绕在你头顶期间，你可以用一个反应，使一名你能看到的生物即将施展的一道四环或更低环阶的法术无效化。被无效化的法术不会产生任何效应，且用于施展此法术的资源也会被浪费掉。此石无效化了总计20环的法术过后，它就会变成黯淡的灰色并失去魔力。", aliases: ["Ioun Stone, Absorption", "艾恩石, 吸收"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "艾恩石, 机敏", en: "Ioun Stone, Agility", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n在这颗深红色的球形艾恩石环绕在你头顶期间，你的敏捷属性增加2，最多增加至20。", aliases: ["Ioun Stone, Agility", "艾恩石, 机敏"], loot_tables: ["器具_极珍稀"]}
- {cn: "艾恩石, 警觉", en: "Ioun Stone, Awareness", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n在这颗暗蓝色的长菱形艾恩石环绕在你头顶期间，你的先攻掷骰和感知（察觉）检定都具有优势。", aliases: ["Ioun Stone, Awareness", "艾恩石, 警觉"], loot_tables: ["器具_珍稀"]}
- {cn: "艾恩石, 坚韧", en: "Ioun Stone, Fortitude", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n在这颗粉色的长菱形艾恩石环绕在你头顶期间，你的体质属性增加2，最多增加至20。", aliases: ["Ioun Stone, Fortitude", "艾恩石, 坚韧"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "艾恩石, 高等吸收", en: "Ioun Stone, Greater Absorption", rarity: 传说, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n在这颗具有紫绿双色大理石花纹的椭球形艾恩石环绕着在你头顶期间，你可以用一个反应，使一名你能看到的生物即将施展的一道八环或更低环阶的法术无效化。被无效化的法术不会产生任何效应，且用于施展此法术的资源也会被浪费掉。此石无效化了总计20环的法术过后，它就会变成黯淡的灰色并失去魔力。", aliases: ["Ioun Stone, Greater Absorption", "艾恩石, 高等吸收"], loot_tables: ["奥秘_传说"]}
- {cn: "艾恩石, 洞悉", en: "Ioun Stone, Insight", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n在这颗炽蓝色的球形艾恩石环绕在你头顶期间，你的感知属性增加2，最多增加至20。", aliases: ["Ioun Stone, Insight", "艾恩石, 洞悉"], loot_tables: ["圣物_极珍稀"]}
- {cn: "艾恩石, 才智", en: "Ioun Stone, Intellect", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n在这颗具有红蓝双色大理石花纹的球形艾恩石环绕在你头顶期间，你的智力属性增加2，至多为20。", aliases: ["Ioun Stone, Intellect", "艾恩石, 才智"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "艾恩石, 统御", en: "Ioun Stone, Leadership", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n在这颗具有粉绿双色大理石花纹的球形艾恩石环绕在你头顶期间，你的魅力属性增加2，至多为20。", aliases: ["Ioun Stone, Leadership", "艾恩石, 统御"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "艾恩石, 精通", en: "Ioun Stone, Mastery", rarity: 传说, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n在这颗淡绿色的棱柱形艾恩石环绕在你头顶期间，你的熟练加值增加1。", aliases: ["Ioun Stone, Mastery", "艾恩石, 精通"], loot_tables: ["奥秘_传说"]}
- {cn: "艾恩石, 防护", en: "Ioun Stone, Protection", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n在这颗烟灰玫瑰色的棱柱形艾恩石环绕在你头顶期间，你的护甲等级获得+1加值。", aliases: ["Ioun Stone, Protection", "艾恩石, 防护"], loot_tables: ["武备_珍稀"]}
- {cn: "艾恩石, 再生", en: "Ioun Stone, Regeneration", rarity: 传说, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n在这颗珍珠白色的纺锤形艾恩石环绕在你头顶期间，每个小时结束时，若你至少拥有1点生命值，你便恢复15点生命值。", aliases: ["Ioun Stone, Regeneration", "艾恩石, 再生"], loot_tables: ["奥秘_传说"]}
- {cn: "艾恩石, 储法", en: "Ioun Stone, Reserve", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n这颗艳紫色的棱柱形艾恩石能够储存对其施展的法术，直到你使用之。该艾恩石同时只能储存总计不超过4环的法术。这个艾恩石在被发现时存储有1d4环由DM决定的法术。\n任何生物都可以在施展一个一到四环的法术时触碰该艾恩石，以将该法术储于石中。此时法术将被储存，而非直接产生效应。如果石头无法储存该法术，则该法术不生效且被消耗。被储存的法术以其所耗用的法术位环阶来决定其在石头中占用的空间。\n在这颗艾恩石环绕在你头顶期间，你可以施展任何储存在其中的法术。该法术使用原施法者的法术位、法术豁免DC、法术攻击加值和施法关键属性，但其他方面则视为由你施放。法术施放后，它将从艾恩石内消失，并解放其占用的空间。", aliases: ["Ioun Stone, Reserve", "艾恩石, 储法"], loot_tables: ["奥秘_珍稀", "圣物_珍稀"]}
- {cn: "艾恩石, 力量", en: "Ioun Stone, Strength", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n在这颗淡蓝色长菱形艾恩石环绕在你头顶期间，你的力量属性增加2，最多增加至20。", aliases: ["Ioun Stone, Strength", "艾恩石, 力量"], loot_tables: ["武备_极珍稀"]}
- {cn: "艾恩石, 维生", en: "Ioun Stone, Sustenance", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n在这颗无色透明的纺锤形艾恩石环绕在你头顶期间，你无需饮食也能生存。", aliases: ["Ioun Stone, Sustenance", "艾恩石, 维生"], loot_tables: ["圣物_珍稀"]}
- {cn: "比拉罗的铁索", en: "Iron Bands of Bilarro", rarity: 珍稀, kind: 奇物, attunement: "", page: 274, text: "这颗锈迹斑斑的铁球直径3寸，重1磅。你可以使用一个魔法动作将铁球扔向60尺内一个你可见的巨型或更小体型的生物。铁球会在空中飞行时展开成为一团铁索。\n进行一次远程攻击检定，将你的熟练加值和敏捷调整值加到这次攻击检定中。如果攻击命中，目标会陷入束缚状态，直至你使用一个附赠动作下令释放它。如果攻击未命中，或是你下达了释放命令，铁索会重新收缩为铁球。\n一个能触及到铁索的生物（包括被铁索束缚的生物）可以使用一个动作进行一次DC 20的力量（运动）检定来尝试打破铁索。如果检定成功，此物品将被摧毁，被束缚的生物将被释放。如果检定失败，进行此次检定的生物在随后的24小时内进行的任何进一步尝试都会自动失败。\n此铁索一经使用，直至次日黎明前它都无法再次被使用。", aliases: ["Iron Bands of Bilarro", "比拉罗的铁索"], loot_tables: ["奥秘_珍稀"]}
- {cn: "收妖瓶", en: "Iron Flask", rarity: 传说, kind: 奇物, attunement: "", page: 274, text: "持握这个带着黄铜瓶塞的铁瓶期间，你能够以一个魔法动作，指定一名位于你60尺内，你可见的生物为目标。若瓶子是空的，且目标来自你正所处的存在位面以外的位面，则目标必须成功通过一次DC 17的感知豁免，否则将被困入瓶中。如果目标先前曾经被困入瓶中过，则它进行该豁免时具有优势。一旦被瓶子困住，该生物将留在瓶中，直至被释放。收妖瓶同时只能容纳最多一名生物。困在瓶中的生物不再衰老，也不需要呼吸、进食或饮水。\n你能够以一个魔法动作拔掉瓶塞释放瓶中的生物。然后该生物将服从你的命令，持续1小时，即使该生物不懂得你下达命令时使用的语言，它也能听懂你的命令。如果你没有下达命令或你的命令可能导致该生物死亡或被囚禁，则它除自卫外不会执行任何动作。持续时间结束后，该生物将按其正常的性格和阵营行动。\n法术鉴定术可以辨别瓶中是否有囚禁生物，但只有打开瓶塞才能确定其中的生物具体是什么。一个新发现的收妖瓶可能已经囚禁了一名由DM决定或根据下表随机决定的生物（以下生物的数据见怪物图鉴）。", aliases: ["Iron Flask", "收妖瓶"], loot_tables: ["奥秘_传说"]}
- {cn: "红锆石", en: "Jacinth", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一块炽橙色宝石。", aliases: ["Jacinth", "红锆石"], loot_tables: []}
- {cn: "玉石", en: "Jade", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗浅绿、深绿或白色的宝石。", aliases: ["Jade", "玉石"], loot_tables: []}
- {cn: "碧玉", en: "Jasper", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗蓝色、黑色或棕色的宝石。", aliases: ["Jasper", "碧玉"], loot_tables: []}
- {cn: "闪电标枪", en: "Javelin of Lightning", rarity: 非普通, kind: 武器, attunement: "", page: 275, text: "当你用该武器发动的攻击检定命中时，你可以选择令其造成闪电伤害而非穿刺伤害。\n【闪电束】当你向至多120尺内的一个目标投掷该武器时，你可以选择不进行远程攻击检定，而是改为将该武器变为一道闪电束。该闪电束会在你和目标之间形成一个5尺线状，目标及该线状内的每个生物（除你之外）都必须进行一次DC 13的敏捷豁免，豁免失败者受到4d6闪电伤害，豁免成功则伤害减半。该武器会在造成该伤害后立即回到你的手中。直到次日黎明前，该词条都无法再使用。", aliases: ["Javelin of Lightning", "闪电标枪"], loot_tables: ["武备_非普通"]}
- {cn: "黑玉", en: "Jet", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗深黑色的宝石。", aliases: ["Jet", "黑玉"], loot_tables: []}
- {cn: "卡夫统灵药", en: "Keoghtom's Ointment", rarity: 非普通, kind: 奇物, attunement: "", page: 275, text: "这个直径3寸的玻璃瓶中装着1d4 + 1剂闻起来隐约有芦荟气味的混合剂。瓶子和混合剂共重1/2磅。\n以一个操作动作，你可以自己吞下一剂软膏，或将一剂软膏涂在你5尺内的一个生物身上。软膏将为受用者恢复2d8 + 2点生命值，并解除其中毒状态。", aliases: ["Keoghtom's Ointment", "卡夫统灵药"], loot_tables: ["圣物_非普通"]}
- {cn: "显像提灯", en: "Lantern of Revealing", rarity: 非普通, kind: 奇物, attunement: "", page: 275, text: "这盏附盖提灯在点亮期间会发出30尺半径的明亮光照以及额外30尺微光光照，并且仅需1品脱燃油即可燃烧6小时。位于提灯明亮光照范围内的隐形生物或物件将被其显形。你可以使用一个操作动作放下附盖，让提灯仅在5尺范围内提供微光光照。", aliases: ["Lantern of Revealing", "显像提灯"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "青金石", en: "Lapis Lazuli", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗浅蓝或深蓝带黄色斑点的宝石。", aliases: ["Lapis Lazuli", "青金石"], loot_tables: []}
- {cn: "骗术锁", en: "Lock of Trickery", rarity: 普通, kind: 奇物, attunement: "", page: 275, text: "这把锁看上去就像是一把普通的锁（见玩家手册第六章），并配备有一把唯一的钥匙。这把锁里的锁齿会魔法性的拒斥那些撬锁的窃贼。任何为撬开这把锁而进行的敏捷检定都会具有劣势。", aliases: ["Lock of Trickery", "骗术锁"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "罗丝之吻", en: "Lolth's Sting", rarity: 未标注, kind: 奇物, attunement: "", page: 91, text: "遭受这种毒药影响的生物必须成功通过一次DC 13的体质豁免，否则陷入中毒状态1小时。若该生物豁免失败且骰值比DC低5或更多，则该生物还会在以此法中毒期间陷入昏迷。该生物会在受到伤害、或是其他生物用一个动作来将其摇醒时苏醒。", aliases: ["Lolth's Sting", "罗丝之吻"], loot_tables: []}
- {cn: "轰天震雷鲁特琴", en: "Lute of Thunderous Thumping", rarity: 极珍稀, kind: 武器, attunement: "", page: 275, text: "这把加固过的鲁特琴可以作为一把魔法短棒持用，且在命中时额外造成2d8雷鸣伤害。\n【音律联击】若你是一位吟游诗人，你可以在用该鲁特琴发动近战攻击检定时，使用魅力调整值来代替力量调整值，但此时你必须哼歌或唱曲。", aliases: ["Lute of Thunderous Thumping", "轰天震雷鲁特琴"], loot_tables: ["武备_极珍稀", "器具_极珍稀"]}
- {cn: "瓦解之锤", en: "Mace of Disruption", rarity: 珍稀, kind: 武器, attunement: "需同调", page: 276, text: "当你使用这把魔法武器命中一位邪魔或亡灵时，该生物会额外受到2d6光耀伤害。如果目标因受到该伤害而生命值被降至25及以下，则目标必须进行一次DC 15的感知豁免，豁免失败则被摧毁，豁免成功则该生物陷入恐慌状态，持续至你的下一回合结束。\n【光线】在你持握这把武器期间，它会散发出20尺半径的明亮光照以及额外20尺微光光照。", aliases: ["Mace of Disruption", "瓦解之锤"], loot_tables: ["武备_珍稀", "圣物_珍稀"]}
- {cn: "打击之锤", en: "Mace of Smiting", rarity: 珍稀, kind: 武器, attunement: "", page: 276, text: "你使用这把魔法武器进行的攻击检定和伤害掷骰具有+1加值。如果你使用这把武器攻击一个构装生物，则加值提升为+3。\n当你使用这把武器进行一次攻击检定并掷出20时，目标会额外受到7钝击伤害。如果目标为构装生物，则其受到的额外钝击伤害为14。如果一个构装生物因受到该伤害而生命值被降至25及以下，则该生物被摧毁。", aliases: ["Mace of Smiting", "打击之锤"], loot_tables: ["武备_珍稀", "圣物_珍稀"]}
- {cn: "恐惧之锤", en: "Mace of Terror", rarity: 珍稀, kind: 武器, attunement: "需同调", page: 276, text: "这把魔法武器具有3充能，并在每日黎明时重获1d3已消耗的充能。持握这把武器期间，你可以使用一个魔法动作并消耗1充能，来从该武器中释放出一股恐惧波动。30尺内每个你所选择的生物都必须成功通过一次DC 15的感知豁免，否则将陷入恐慌状态，持续1分钟。以这种方式陷入恐慌的生物在其回合内必须尽可能的向远离你的方向移动，并且它不能发动借机攻击。它只能选择进行疾走动作，或尝试摆脱一个阻止其移动的效应。如果无处可逃，则它可以执行回避动作。该生物在每个自己的回合结束时可以再次进行此豁免，豁免成功则其身上的该效应提前结束。", aliases: ["Mace of Terror", "恐惧之锤"], loot_tables: ["武备_珍稀", "圣物_珍稀"]}
- {cn: "孔雀石", en: "Malachite", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一块有浅绿和深绿条纹的宝石。", aliases: ["Malachite", "孔雀石"], loot_tables: []}
- {cn: "怨恨", en: "Malice", rarity: 未标注, kind: 奇物, attunement: "", page: 91, text: "吸入这种毒药的生物必须成功通过一次DC 15的体质豁免，否则将陷入中毒状态1小时，以此中毒期间该生物还会陷入目盲状态。", aliases: ["Malice", "怨恨"], loot_tables: []}
- {cn: "法术抗性斗篷", en: "Mantle of Spell Resistance", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 276, text: "穿着这件斗篷期间，你为抵抗法术进行的豁免具有优势。", aliases: ["Mantle of Spell Resistance", "法术抗性斗篷"], loot_tables: ["奥秘_珍稀"]}
- {cn: "强身手册", en: "Manual of Bodily Health", rarity: 极珍稀, kind: 奇物, attunement: "", page: 277, text: "这本书记载了健康和营养的建议，其文字蕴含魔力。如果你在不长于6日的时间段内花费了48小时研读这本书并实践其中的方针，则你的体质提升2，至多提升至30。之后这本手册将失去魔力，直到一个世纪后才能恢复。", aliases: ["Manual of Bodily Health", "强身手册"], loot_tables: ["圣物_极珍稀"]}
- {cn: "粘土魔像之书", en: "Manual of Clay Golems", rarity: 极珍稀, kind: 奇物, attunement: "", page: 277, text: "这本手册记载了制造粘土魔像所必需的知识和秘文，魔像的类型由DM选择或在表格中随机掷骰决定。只有拥有至少2个五环法术位的施法者才能解读并使用这本书。若无法解读这本书的生物尝试阅读魔像手册，该生物将受到6d6点心灵伤害。\n要制造一个粘土魔像，你必须花费30天，将魔像手册放在手头并不间断地工作，每天的休息时间不超过8小时。此外，你还要付出65,000 gp用以购买材料。\n魔像完工后，魔像手册将被魔焰吞噬。当你把手册的灰烬洒在魔像上时，魔像将被活化。它服从你的控制，理解并听从你的命令。", aliases: ["Manual of Clay Golems", "粘土魔像之书"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "血肉魔像之书", en: "Manual of Flesh Golems", rarity: 极珍稀, kind: 奇物, attunement: "", page: 277, text: "这本手册记载了制造血肉魔像所必需的知识和秘文。只有拥有至少2个五环法术位的施法者才能解读并使用这本书。若无法解读这本书的生物尝试阅读魔像手册，该生物将受到6d6点心灵伤害。\n要制造一个血肉魔像，你必须花费60天，将魔像手册放在手头并不间断地工作，每天的休息时间不超过8小时。此外，你还要付出50,000 gp用以购买材料。\n魔像完工后，魔像手册将被魔焰吞噬。当你把手册的灰烬洒在魔像上时，魔像将被活化。它服从你的控制，理解并听从你的命令。", aliases: ["Manual of Flesh Golems", "血肉魔像之书"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "健体手册", en: "Manual of Gainful Exercise", rarity: 极珍稀, kind: 奇物, attunement: "", page: 277, text: "这本书记载了健身和运动的方法，其文字蕴含魔力。如果你在不长于6日的时间段内花费了48小时研读这本书并实践其中的方针，则你的力量提升2，至多提升至30。之后这本手册将失去魔力，直到一个世纪后才能恢复。", aliases: ["Manual of Gainful Exercise", "健体手册"], loot_tables: ["武备_极珍稀"]}
- {cn: "铁魔像之书", en: "Manual of Iron Golems", rarity: 极珍稀, kind: 奇物, attunement: "", page: 277, text: "这本手册记载了制造铁魔像所必需的知识和秘文。只有拥有至少2个五环法术位的施法者才能解读并使用这本书。若无法解读这本书的生物尝试阅读魔像手册，该生物将受到6d6点心灵伤害。\n要制造一个钢铁魔像，你必须花费120天，将魔像手册放在手头并不间断地工作，每天的休息时间不超过8小时。此外，你还要付出100,000 gp用以购买材料。\n魔像完工后，魔像手册将被魔焰吞噬。当你把手册的灰烬洒在魔像上时，魔像将被活化。它服从你的控制，理解并听从你的命令。", aliases: ["Manual of Iron Golems", "铁魔像之书"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "灵巧手册", en: "Manual of Quickness of Action", rarity: 极珍稀, kind: 奇物, attunement: "", page: 278, text: "这本书记载了训练协调和平衡的方法，其文字蕴含魔力。如果你在不长于6日的时间段内花费了48小时研读这本书并实践其中的方针，则你的敏捷提升2，至多提升至30。之后这本手册将失去魔力，直到一个世纪后才能恢复。", aliases: ["Manual of Quickness of Action", "灵巧手册"], loot_tables: ["器具_极珍稀"]}
- {cn: "石魔像之书", en: "Manual of Stone Golems", rarity: 极珍稀, kind: 奇物, attunement: "", page: 277, text: "这本手册记载了制造石魔像所必需的知识和秘文。只有拥有至少2个五环法术位的施法者才能解读并使用这本书。若无法解读这本书的生物尝试阅读魔像手册，该生物将受到6d6点心灵伤害。\n要制造一个石魔像，你必须花费90天，将魔像手册放在手头并不间断地工作，每天的休息时间不超过8小时。此外，你还要付出80,000 gp用以购买材料。\n魔像完工后，魔像手册将被魔焰吞噬。当你把手册的灰烬洒在魔像上时，魔像将被活化。它服从你的控制，理解并听从你的命令。", aliases: ["Manual of Stone Golems", "石魔像之书"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "读心勋章", en: "Medallion of Thoughts", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 278, text: "这块勋章具有5充能。佩戴它期间，你可以消耗1充能从中施展侦测思想（豁免DC 13）。这块勋章在每日黎明时重获1d4已消耗的充能。", aliases: ["Medallion of Thoughts", "读心勋章"], loot_tables: ["奥秘_非普通"]}
- {cn: "午夜之泪", en: "Midnight Tears", rarity: 未标注, kind: 奇物, attunement: "", page: 91, text: "服用这种毒药的生物不会立即出现异样，其症状会一直潜伏到午夜钟声敲响时。任何能够解除中毒状态的效应都可以在此之前中和午夜之泪，然而如果毒素在午夜之前尚未中和，该生物就要进行一次DC 17的体质豁免，豁免失败则受到31（9d6）点毒素伤害，豁免成功则伤害减半。", aliases: ["Midnight Tears", "午夜之泪"], loot_tables: []}
- {cn: "摄心镜", en: "Mirror of Life Trapping", rarity: 极珍稀, kind: 奇物, attunement: "", page: 278, text: "当以间接的方式看向这面4尺高，2尺宽的镜子时，其表面会显示出生物的模糊影像。这面镜子重50磅，AC11，HP10，免疫毒素和心灵伤害，对钝击伤害具有易伤。当生命值降至0时，镜子会粉碎且被摧毁。\n如果镜子悬挂于一处垂直表面，且你在镜子周边5尺范围内时，你可以执行一个魔法动作并使用一个命令语激活它。它会一直保持激活状态，直至你执行一个魔法动作并重复命令语来取消激活。\n如果除你之外的任何生物在镜子周边30尺范围内看到自己在已激活镜面中的倒影，该生物必须成功通过一次DC 15的魅力豁免，否则将会连同自己着装或携带的所有物品一起被困入镜中的十二个异次元牢房之一。了解摄心镜本质的生物在进行该豁免时具有优势，构装生物在进行该豁免时直接成功。\n每个异次元牢房都是一处无限广阔的空间，里面充满了浓雾，能见度只有10尺。被困入镜中牢房的生物不会衰老，也无需饮食和睡眠。被困于牢房的生物可以使用位面旅行魔法进行逃脱，无法做到这件事的生物将被永远囚禁在牢房中，直至被释放为止。\n如果镜子困住一个生物，而十二个异次元牢房又已被占满，则它将随机释放一名被困生物以容纳新囚犯。一个被释放的生物会背对镜子出现在镜子视野范围内一处未被占据的空间中。如果镜子被打碎，它囚禁的所有生物都会被释放，并出现在它附近未被占据的空间里。\n位于镜子周边5尺范围内时，你可以使用一个魔法动作说出一位被囚禁生物的名字或呼喊一个特定牢房的编号。被说出名字或被囚禁于该编号牢房的生物会以一幅影像的形式出现在镜子表面，随后你可与该生物进行交流。\n以类似的方式，你可以执行一个魔法动作并使用另一个命令语释放一位被困于镜中的生物。被释放的生物会连同其所有物出现离镜子最近的未被占据的空间里，背对着镜子。\n将摄心镜放入次元袋、全身掩护或其他类似物品产生的异次元空间时，将立即摧毁这两件物品并打开一扇通往星光位面的门扉。门扉会产生在被放入另一件物品的前一件物品所在的空间位置。任何在门扉周边10尺范围内且不在全身掩护之后的生物将被吸入门内并送到星光位面的随机位置，随后该门关闭。这扇门扉只能单向通过且无法被再次打开。", aliases: ["Mirror of Life Trapping", "摄心镜"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "月光石", en: "Moonstone", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗白色带淡蓝光晕的宝石。", aliases: ["Moonstone", "月光石"], loot_tables: []}
- {cn: "苔藓玛瑙", en: "Moss Agate", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一种粉色或黄白，带有苔灰色或绿色斑纹的宝石。", aliases: ["Moss Agate", "苔藓玛瑙"], loot_tables: []}
- {cn: "谜之钥", en: "Mystery Key", rarity: 普通, kind: 奇物, attunement: "", page: 280, text: "这把钥匙的末端添有一个问号样式的装饰。这把钥匙有5的几率解开任何一个其插入的锁。一旦这把钥匙成功解锁了什么东西，它就会消失。", aliases: ["Mystery Key", "谜之钥"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "自然斗篷", en: "Nature's Mantle", rarity: 非普通, kind: 奇物, attunement: "由德鲁伊或游侠", page: 280, text: "这件斗篷的颜色和材质会随着你周围的环境而改变。穿着这件斗篷期间，你可以将其作为你施展德鲁伊和游侠法术的法器。\n身处轻度遮蔽的区域时，你可以用一个附赠动作来执行躲藏动作，即便你能被直接观察到。", aliases: ["Nature's Mantle", "自然斗篷"], loot_tables: ["器具_非普通", "圣物_非普通"]}
- {cn: "适应项链", en: "Necklace of Adaptation", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 280, text: "佩戴此项链期间，你能在任何环境中正常呼吸，并且你在为避免或结束中毒状态的豁免中具有优势。", aliases: ["Necklace of Adaptation", "适应项链"], loot_tables: ["奥秘_非普通"]}
- {cn: "火球项链", en: "Necklace of Fireballs", rarity: 珍稀, kind: 奇物, attunement: "", page: 280, text: "这条项链挂着1d6 + 3颗珠子。你可以执行魔法动作取下一颗珠子并将其投掷最多60尺距离。珠子会在投掷轨迹的末端引爆，效果等同于3环火球术（豁免DC 15）。\n你可以同时把多枚珠子，甚至把整条项链一起投掷出去。这么做时，每有一颗额外投掷出的珠子，火球术的伤害就增加1d6点（最大12d6）。", aliases: ["Necklace of Fireballs", "火球项链"], loot_tables: ["奥秘_珍稀"]}
- {cn: "念珠项链", en: "Necklace of Prayer Beads", rarity: 珍稀, kind: 奇物, attunement: "需牧师，德鲁伊或圣武士", page: 281, text: "这条项链挂着1d4 + 2颗由海蓝宝石、黑珍珠或黄玉制成的魔法念珠。项链上同样串有许多由琥珀、血石、黄水晶、珊瑚石、玉石、珍珠或石英石制成的非魔法性的念珠。魔法念珠从项链中取下时将失去其魔法。\n项链的每颗魔法念珠都可能是六种念珠之一，由DM决定或在下表中随机掷骰以确定每颗念珠的种类。一条项链可以拥有多颗同种类的念珠。要使用念珠，你必须佩戴着这条项链。每颗念珠容纳着一道法术，你能够以一个附赠动作从中施展它所容纳的法术（需要豁免的法术使用你的法术豁免DC）。一颗魔法念珠中的法术一经施展，那颗念珠直至次日黎明前都无法再次被使用。", aliases: ["Necklace of Prayer Beads", "念珠项链"], loot_tables: ["圣物_珍稀"]}
- {cn: "诺泽尔的惊奇颜料", en: "Nolzur's Marvelous Pigments", rarity: 极珍稀, kind: 奇物, attunement: "", page: 281, text: "这个精美的木盒里装有1d4罐颜料以及一根画笔（共重1磅）。通过使用画笔并消耗1罐颜料，你可以在20尺立方的范围内画出任意数量的三维物体和地形特征（例如墙、门、树、鲜花、武器、蛛网和坑洞）。达成此效应需要10分钟（无论你创造了多少东西），而且在此期间，你必须留在这一立方中并保持专注。完成绘画前，若你的专注被打断或你离开此立方，你画出的所有东西都将消失，消耗的那罐颜料也会被浪费。\n完成绘画时，你绘制的物件和地形将变为真实的事物。因此，画在墙上的门可以正常打开并通过，画在地上的坑也会变成真正的坑，其整个深度都必须在20尺立方的范围以内。\n颜料不能创造出价值高于25金币的单个物件，你以一罐颜料创造出的所有物件的总价值也不能超过500金币。如果你试图画出价格更高昂的东西（例如一大堆金子），那么产生的物件仅仅看上去像是真的，但仔细检查就会发现它们是由浆糊、饼干或其他不值钱的材料制成的。\n如果你画出某种形式的能量，例如火焰或闪电，则该能量在你完成绘制的那一瞬间消散，且不会造成任何伤害。", aliases: ["Nolzur's Marvelous Pigments", "诺泽尔的惊奇颜料"], loot_tables: ["奥秘_极珍稀", "器具_极珍稀"]}
- {cn: "黑曜石", en: "Obsidian", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一块黑色的宝石。", aliases: ["Obsidian", "黑曜石"], loot_tables: []}
- {cn: "以太化之油", en: "Oil of Etherealness", rarity: 珍稀, kind: 药水, attunement: "", page: 282, text: "一扁瓶的以太化之油可以覆盖住连带着其着装与携带的装备的一个中型或小型生物（生物体型每比中型大一级，就需要多用一扁瓶）。抹上油需要花费10分钟。被影响的生物将会获得以太化法术的效应，持续1小时。\n与瓶中油膏类似的浑浊的灰色油珠会在其容器的外壁形成，并迅速蒸发。", aliases: ["Oil of Etherealness", "以太化之油"], loot_tables: ["奥秘_珍稀"]}
- {cn: "锐锋之油", en: "Oil of Sharpness", rarity: 极珍稀, kind: 药水, attunement: "", page: 282, text: "一扁瓶的锐锋之油可以涂抹在一把近战武器或二十发弹药上，但只有在非魔法性且造成挥砍或穿刺伤害的近战武器或弹药上才能发挥效用。抹上油需要花费1分钟，那之后油将魔法性地渗入被涂抹的武器或弹药，将其变为+3武器或+3弹药。\n这种透明的凝胶状油膏中掺杂着极其纤细而微小的银色碎片。", aliases: ["Oil of Sharpness", "锐锋之油"], loot_tables: ["奥秘_极珍稀", "武备_极珍稀"]}
- {cn: "滑溜之油", en: "Oil of Slipperiness", rarity: 非普通, kind: 药水, attunement: "", page: 283, text: "一扁瓶的滑溜之油可以覆盖住连带着其着装与携带的装备的一个中型或小型生物（生物体型每比中型大一级，就需要多用一扁瓶）。抹上油需要花费10分钟。被影响的生物将会获得行动自如法术的效应，持续8小时。\n此外，以一个魔法动作，油可以被泼到地面上并覆盖10尺方形区域，并在此区域内复现出油腻术法术的效应，持续8小时。\n这种粘稠的黑色油膏浑浊且厚重，但在被倒出来时却又流动迅速。", aliases: ["Oil of Slipperiness", "滑溜之油"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "腐精之油", en: "Oil of Taggit", rarity: 未标注, kind: 奇物, attunement: "", page: 91, text: "接触到这种毒药的生物必须成功通过一次DC 13的体质豁免，否则将陷入中毒状态24小时。以此中毒期间该生物还会陷入昏迷状态。该生物会在受到伤害时苏醒。", aliases: ["Oil of Taggit", "腐精之油"], loot_tables: []}
- {cn: "缟玛瑙", en: "Onyx", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗带有纯黑、纯白或黑白条纹的宝石。", aliases: ["Onyx", "缟玛瑙"], loot_tables: []}
- {cn: "蛋白石", en: "Opal", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗淡蓝色带有绿色和金色斑纹的宝石。", aliases: ["Opal", "蛋白石"], loot_tables: []}
- {cn: "方向法球", en: "Orb of Direction", rarity: 普通, kind: 奇物, attunement: "", page: 283, text: "这颗法球可用作一个奥术法器。\n持握这颗法球期间，你可以使用一个魔法动作来确认地磁北方的方位。如果在一个没有地磁北方的地方使用这颗法球，则不会发生任何事情。", aliases: ["Orb of Direction", "方向法球"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "龙珠", en: "Orb of Dragonkind", rarity: 神器, kind: 奇物, attunement: "需同调", page: 283, text: "很久以前，在龙枪的设定中，精灵与人类对色彩巨龙发动了一场惨烈的战争。在最后世界接近崩溃之际，大法师诸塔的法师们齐聚一堂，铸造了五颗龙珠来帮助击败巨龙。五颗龙珠分给了五座法师塔，他们凭借龙珠的力量克敌制胜。法师们用龙珠引诱龙族，然后以强大的法术轰杀之。\n随着大法师诸塔在后来的年代中倒塌，其持有的五颗龙珠也相继被摧毁或遗失在传说之中。相传仍然有三颗保存完好的龙珠流传在世。虽然它们的魔法在几个世纪中被扭曲变换，但其呼唤巨龙的原始功能却依然健全，还能在一定程度上控制龙族。\n每颗龙珠内都包含着一条邪恶巨龙的精神，对任何尝试从中引出魔法的企图怀有愤恨。那些试图使用龙珠但意志不坚定的人有时会发现自身实为被龙珠所蛊惑。\n龙珠是一枚直径约10寸的蚀刻水晶球。使用时，其直径增长至20寸，并且在内部萦绕着迷雾。\n与龙珠维持同调期间，你能够以魔法动作窥视龙珠深处。然后你必须进行一次DC 15的魅力豁免。若豁免成功，你将可以控制龙珠直至同调中断。若豁免失败，你将被龙珠魅惑直至同调中断。\n被龙珠魅惑期间，你不能自行中断同调，而龙珠可以对你随意施展暗示术（豁免DC 18），并蛊惑你助推其邪恶目标。龙珠里的巨龙精神有着各种需求：歼灭某个特定社团或组织；从龙珠中解放；四处折磨世人；传播提亚马特信仰，或是由DM决定的其他事情。\n【随机词条】龙珠具有下列随机词条： 2项神器词条; 次要增益词条词条 1项神器词条; 次要减益词条词条 1项神器词条; 主要减益词条词条\n【法术】龙珠具有7充能，并在每日黎明时重获1d4 + 3已消耗的充能。你能以龙珠施展下表中的法术（豁免DC18）。表中表明了你施展对应的法术需要消耗多少充能。\n【呼唤巨龙】控制龙珠期间，你能够以魔法动作令龙珠发出心灵感应呼唤，此呼唤向所有方向延伸40英里。范围内的色彩龙族将被迫以最直接的路线尽可能快的来到龙珠处。龙族神祇（如提亚马特）不受此呼唤影响。被龙珠唤来的色彩龙族可能因其非自愿的到来与你敌对。该词条一经使用，一小时内你都无法再次使用。\n【摧毁此珠】龙珠的AC为20，当其受到+3魔法武器或法术解离术的伤害时，龙珠被摧毁。其余任何事物都无法摧毁龙珠。", aliases: ["Orb of Dragonkind", "龙珠"], loot_tables: []}
- {cn: "时间法球", en: "Orb of Time", rarity: 普通, kind: 奇物, attunement: "", page: 284, text: "这颗法球可用作一个奥术法器。\n持握这颗法球期间，你可以使用一个魔法动作来确认现在是上午、下午、傍晚还是夜晚。这项属性仅在物质位面中有效。", aliases: ["Orb of Time", "时间法球"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "苍白酊剂", en: "Pale Tincture", rarity: 未标注, kind: 奇物, attunement: "", page: 91, text: "服用这种毒药的生物必须成功通过一次DC 16的体质豁免，否则将受到3（1d6）毒素伤害并陷入中毒状态。以此中毒的生物每过24小时都需要重复此豁免，豁免失败则再受3（1d6）毒素伤害。此毒药造成的伤害在此中毒效应终止前无法以任何方式恢复。该生物累计豁免成功七次后即不再中毒。", aliases: ["Pale Tincture", "苍白酊剂"], loot_tables: []}
- {cn: "珍珠", en: "Pearl", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗有光泽的白色、黄色或粉红色宝石。", aliases: ["Pearl", "珍珠"], loot_tables: []}
- {cn: "法力再生珍珠", en: "Pearl of Power", rarity: 非普通, kind: 奇物, attunement: "由施法者", page: 284, text: "在你随身携带这颗珍珠期间，你可以使用一个魔法动作来恢复一枚已消耗的三环或更低环阶的法术位。这颗珍珠一经使用，则其直至次日黎明前都无法再次使用。", aliases: ["Pearl of Power", "法力再生珍珠"], loot_tables: ["奥秘_非普通", "圣物_非普通"]}
- {cn: "迷醉香水", en: "Perfume of Bewitching", rarity: 普通, kind: 奇物, attunement: "", page: 284, text: "这个小瓶内装有足够单次使用的魔法香水。你可以使用一个魔法动作将香水喷洒或涂抹在自己身上，其效应会持续1小时。在持续时间内，你对试图影响一个位于你周边5尺范围内的生物而进行的所有魅力（欺瞒和游说）检定都具有优势。", aliases: ["Perfume of Bewitching", "迷醉香水"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "保健护符", en: "Periapt of Health", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 284, text: "佩戴此吊坠期间，你可以执行魔法动作来恢复2d4 + 2生命值。一经使用，则其直至次日黎明前都无法再次使用。\n此外，佩戴着此吊坠期间，你在为避免或结束中毒状态的豁免中具有优势。", aliases: ["Periapt of Health", "保健护符"], loot_tables: ["奥秘_非普通", "圣物_非普通"]}
- {cn: "辟毒护符", en: "Periapt of Proof against Poison", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 284, text: "这条精致的银链上挂着一颗璀璨切割的黑宝石吊坠。当你佩戴它时，你对中毒状态和毒素伤害具有免疫。", aliases: ["Periapt of Proof against Poison", "辟毒护符"], loot_tables: ["圣物_珍稀"]}
- {cn: "愈合护符", en: "Periapt of Wound Closure", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 284, text: "佩戴此吊坠期间，你获得以下增益：\n【维持生命】每当你进行死亡豁免检定时，你都可以将掷骰中9及以下的骰值改为10，以此让失败的豁免改为成功。\n【加速自愈】每当你投掷一颗生命值骰来恢复你的生命值时，你生命值恢复量翻倍。", aliases: ["Periapt of Wound Closure", "愈合护符"], loot_tables: ["圣物_非普通"]}
- {cn: "橄榄石", en: "Peridot", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗橄榄绿色宝石。", aliases: ["Peridot", "橄榄石"], loot_tables: []}
- {cn: "迷情媚药", en: "Philter of Love", rarity: 非普通, kind: 药水, attunement: "", page: 285, text: "饮用此药水后，接下来10分钟内，你将被你看见的第一名生物魅惑。魅惑效应持续1小时。\n这种玫瑰色的气泡状药液中包含着一个容易被忽略的心形气泡。", aliases: ["Philter of Love", "迷情媚药"], loot_tables: ["奥秘_非普通"]}
- {cn: "怪物烟斗", en: "Pipe of Smoke Monsters", rarity: 普通, kind: 奇物, attunement: "", page: 285, text: "用这个烟斗抽烟期间，你可以使用一个魔法动作呼出一股烟雾并使其变成一个生物的形状，例如一条龙、一只呋噜、或者一只史拉蟾。该形状必须小到足以容纳进1尺立方，并且其会在数秒后失去其形状，变回一股普通的烟雾。", aliases: ["Pipe of Smoke Monsters", "怪物烟斗"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "颤栗乐笙", en: "Pipes of Haunting", rarity: 非普通, kind: 奇物, attunement: "", page: 285, text: "颤栗乐笙具有3充能，并在每日黎明时重获1d3已消耗的充能。你可以使用一个魔法动作演奏该乐笙，并消耗其1充能来创作一首怪诞且令人着迷的曲调。你周边30尺范围内每个你选择的生物都必须成功通过一次DC 15的感知豁免，豁免失败者会陷入恐慌状态，持续1分钟。豁免失败的生物可以在其每个回合结束时重复该豁免，豁免成功则结束对自身的影响。豁免成功的生物将在24小时内免疫该乐笙的效应。", aliases: ["Pipes of Haunting", "颤栗乐笙"], loot_tables: ["器具_非普通"]}
- {cn: "唤鼠乐笙", en: "Pipes of the Sewers", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 285, text: "在你随身携带这只乐笙期间，老鼠和巨鼠对你的态度为冷漠。除非你威胁或伤害它们，否则它们不会主动攻击你。\n唤鼠乐笙具有3充能，并在每日黎明时重获1d3已消耗的充能。你可以使用一个魔法动作演奏该乐笙，并使用一个附赠动作消耗1~3充能。如果你周围半里内有足够可供召唤的老鼠（由DM决定），那么每消耗1充能就能召唤1组鼠群。如果范围内鼠的数量不足以形成集群，则该次充能被浪费。被召唤的集群会沿着最短的可用路线向音乐移动，但除此之外不受你的控制。\n在你使用魔法动作演奏乐笙期间，每当一个未被其他生物控制的鼠群进入到你周边30尺范围内时，该鼠群就必须进行一次DC 15的感知豁免。如果豁免成功，该鼠群就会像平常一样行动，并在接下来的24小时内不再受到乐笙音乐的影响。如果豁免失败，鼠群就会受到乐笙音乐的影响，并且只要你每轮继续使用一个魔法动作演奏乐笙，鼠群就会对你和你的盟友保持友好。一个友好的鼠群会遵从你的命令。当你没对一个友好的鼠群下达命令时，它们会尽力保护自己，但不会执行其他动作。如果一个友好的鼠群在距离你30尺以外的地方开始其回合，则你对该鼠群的控制就会终止，鼠群会像平常一样行动，并在接下来的24小时内不再受到乐笙音乐的影响。", aliases: ["Pipes of the Sewers", "唤鼠乐笙"], loot_tables: ["器具_非普通"]}
- {cn: "垂钓之杆", en: "Pole of Angling", rarity: 普通, kind: 奇物, attunement: "", page: 286, text: "这个物品可用作一根长杆Pole。持握该物品期间，你可以使用一个魔法动作将其转变为一根附带鱼钩、鱼线、与卷线盘的钓鱼竿，或者将钓鱼竿恢复成一根长杆。", aliases: ["Pole of Angling", "垂钓之杆"], loot_tables: ["器具_普通"]}
- {cn: "压缩之杆", en: "Pole of Collapsing", rarity: 普通, kind: 奇物, attunement: "", page: 286, text: "这个物品可用作一根长杆Pole。持握该物品期间，你可以使用一个魔法动作将其压缩成一根便于储藏1尺长权杖（长杆的重量不会改变），或者将该1尺长的权杖恢复成一根长杆。权杖的伸长程度仅限于其周围空间允许的距离。", aliases: ["Pole of Collapsing", "压缩之杆"], loot_tables: ["器具_普通"]}
- {cn: "次元洞", en: "Portable Hole", rarity: 珍稀, kind: 奇物, attunement: "", page: 286, text: "这块如丝绸般顺滑的精致黑色布料，折叠起来只有手帕大小。布料展开后为直径6尺的圆形盖布。\n你可以使用一个魔法动作展开次元洞，并将其放置在或靠着一处坚固表面。次元洞会随即打开一个10尺深的异次元孔洞。次元洞内的圆柱形空间存在于异位面，因此无法用于创造开放通道。任何位于一个打开的次元洞内的生物都可以通过攀爬从洞口离开。\n你可以使用一个魔法动作通过抓住布料的边缘将其折叠起来以关闭次元洞。折叠布料会关闭洞口，里面的任何生物或物件都会留在异次元空间中。无论内部装了什么，次元洞的重量都可以忽略不计。\n如果次元洞被折叠起来，一个位于洞内异次元空间的生物可以使用一个动作进行一次DC 10的力量（运动）检定。如果检定成功，该生物就会强行离开，并出现在次元洞周边5尺范围内。一个关闭的次元洞可容纳足够呼吸1小时的空气，除以洞内呼吸生物的数量。\n将次元洞放入次元袋、霍华德便利袋或其他类似物品产生的异次元空间时，将立即摧毁这两件物品并打开一扇通往星光位面Astral Plane的门扉。门扉会产生在被放入另一件物品的前一件物品所在的空间位置。任何在门扉周边10尺范围内且不在全身掩护之后的生物将被吸入门内并送到星光位面的随机位置，随后该门关闭。这扇门扉只能单向通过且无法被再次打开。", aliases: ["Portable Hole", "次元洞"], loot_tables: ["奥秘_珍稀", "器具_珍稀"]}
- {cn: "启蒙花盆", en: "Pot of Awakening", rarity: 普通, kind: 奇物, attunement: "", page: 289, text: "你可以在这个10磅重的黏土花盆里种植一株普通灌木，待其生长30天后，这株灌木会魔法性的转化为一株启蒙灌木 。当灌木被启蒙时，它的根系会打碎花盆，并导致花盆被摧毁。\n这株启蒙灌木会对你友好并服从你的命令。如果没有你的命令，它会什么也不做。", aliases: ["Pot of Awakening", "启蒙花盆"], loot_tables: ["奥秘_普通", "圣物_普通"]}
- {cn: "强酸抗性药水", en: "Potion of Acid Resistance", rarity: 非普通, kind: 药水, attunement: "", page: 289, text: "（规则见「抗性药水」条目）", aliases: ["Potion of Acid Resistance", "强酸抗性药水"], loot_tables: []}
- {cn: "化兽为友药水", en: "Potion of Animal Friendship", rarity: 非普通, kind: 药水, attunement: "", page: 287, text: "当你饮下这瓶药水时，你可以施展三环版本的化兽为友法术（豁免DC 13）。\n搅动这瓶药水中的浑浊药液时可以看到细碎的残渣：一片鱼的鳞片、一根蜂鸟的羽毛、一只猫的爪子或是一根松鼠的毛发。", aliases: ["Potion of Animal Friendship", "化兽为友药水"], loot_tables: ["奥秘_非普通", "圣物_非普通"]}
- {cn: "鹰眼术药水", en: "Potion of Clairvoyance", rarity: 珍稀, kind: 药水, attunement: "", page: 287, text: "当你饮下这瓶药水时，你获得法术鹰眼术的效应（无需专注）。\n一颗眼球在这瓶药水的泛黄药液中沉浮，但会在容器被打开期间消失。", aliases: ["Potion of Clairvoyance", "鹰眼术药水"], loot_tables: ["奥秘_珍稀"]}
- {cn: "攀爬药水", en: "Potion of Climbing", rarity: 普通, kind: 药水, attunement: "", page: 287, text: "当你饮下这瓶药水时，你获得等同于你速度的攀爬速度，持续1小时。这段时间内，你在为攀爬进行的力量（运动）检定中具有优势。\n这瓶药水会分离成类似岩层的褐、银、灰三层颜色。摇晃药水也无法将颜色混合。", aliases: ["Potion of Climbing", "攀爬药水"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "云巨人之力药水", en: "Potion of Cloud Giant Strength", rarity: 极珍稀, kind: 药水, attunement: "", page: 288, text: "饮用此药水后，1小时内，你的力量属性值将变为27。如果你的力量属性值已经大于或等于该数值，则药水无效。\n这瓶药水的透明药液中漂着一缕像是云巨人指甲一般的光线。", aliases: ["巨人之力药水", "巨人之力药水（云）", "Potion of Cloud Giant Strength", "云巨人之力药水"], loot_tables: ["奥秘_极珍稀", "武备_极珍稀"]}
- {cn: "寒冷抗性药水", en: "Potion of Cold Resistance", rarity: 非普通, kind: 药水, attunement: "", page: 289, text: "（规则见「抗性药水」条目）", aliases: ["Potion of Cold Resistance", "寒冷抗性药水"], loot_tables: []}
- {cn: "通晓药水", en: "Potion of Comprehension", rarity: 普通, kind: 药水, attunement: "", page: 287, text: "当你饮下这瓶药水时，你获得法术通晓语言的效应，持续1小时。\n这瓶药水的药液是透明的调配物，一些盐粒和烟尘在里面旋转。", aliases: ["Potion of Comprehension", "通晓药水"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "缩小药水", en: "Potion of Diminution", rarity: 珍稀, kind: 药水, attunement: "", page: 287, text: "当你饮下这瓶药水时，你获得法术变巨/缩小术中的\"缩小\"效应，持续1d4小时（无需专注）。\n药液中的红色部分不断收缩成一个小球，随后又膨胀起来，把周围的清澈药液染红。即使摇晃药水瓶也不会打断这个过程。", aliases: ["Potion of Diminution", "缩小药水"], loot_tables: ["奥秘_珍稀", "器具_珍稀"]}
- {cn: "火焰吐息药水", en: "Potion of Fire Breath", rarity: 非普通, kind: 药水, attunement: "", page: 287, text: "在你饮下这瓶药水后，你可以执行附赠动作，向位于你30尺内的一名目标喷吐出火焰。目标必须通过DC 13的敏捷豁免，豁免失败则受到4d6火焰伤害，豁免成功则伤害减半。效应将在你喷吐三次火焰或经过一小时后结束。\n这瓶药水里的橙色药液不停闪烁，而容器的顶部被烟雾填满，并在开启时飘散出来。", aliases: ["Potion of Fire Breath", "火焰吐息药水"], loot_tables: ["奥秘_非普通"]}
- {cn: "火巨人之力药水", en: "Potion of Fire Giant Strength", rarity: 珍稀, kind: 药水, attunement: "", page: 288, text: "饮用此药水后，1小时内，你的力量属性值将变为25。如果你的力量属性值已经大于或等于25，则药水无效。\n这瓶药水的透明药液中漂着一缕像是火巨人指甲一般的光线。", aliases: ["巨人之力药水（火）", "Potion of Fire Giant Strength", "火巨人之力药水"], loot_tables: ["奥秘_珍稀", "武备_珍稀"]}
- {cn: "火焰抗性药水", en: "Potion of Fire Resistance", rarity: 非普通, kind: 药水, attunement: "", page: 289, text: "（规则见「抗性药水」条目）", aliases: ["Potion of Fire Resistance", "火焰抗性药水"], loot_tables: []}
- {cn: "飞行药水", en: "Potion of Flying", rarity: 极珍稀, kind: 药水, attunement: "", page: 287, text: "当你饮下这瓶药水时，你获得等同于你速度的飞行速度并可以悬浮，持续1小时。药水效果消失时，如果你仍在半空中，除非你有其他方式保持在空中，否则随即坠落。\n这瓶药水中的透明药液漂浮在容器顶部，些许云雾状的白色杂质在其中飘荡。", aliases: ["Potion of Flying", "飞行药水"], loot_tables: ["奥秘_极珍稀", "器具_极珍稀"]}
- {cn: "力场抗性药水", en: "Potion of Force Resistance", rarity: 非普通, kind: 药水, attunement: "", page: 289, text: "（规则见「抗性药水」条目）", aliases: ["Potion of Force Resistance", "力场抗性药水"], loot_tables: []}
- {cn: "霜巨人之力药水", en: "Potion of Frost Giant Strength", rarity: 珍稀, kind: 药水, attunement: "", page: 288, text: "饮用此药水后，1小时内，你的力量属性值将变为23。如果你的力量属性值已经大于或等于23，则药水无效。\n这瓶药水的透明药液中漂着一缕像是霜巨人指甲一般的光线。", aliases: ["巨人之力药水（寒霜）", "Potion of Frost Giant Strength", "霜巨人之力药水"], loot_tables: ["奥秘_珍稀", "武备_珍稀"]}
- {cn: "气化形体药水", en: "Potion of Gaseous Form", rarity: 珍稀, kind: 药水, attunement: "", page: 287, text: "当你饮下这瓶药水时，你获得法术气化形体的效应，持续1小时（无需专注）或你以附赠动作结束这个效应为止。\n这瓶药水的容器看上去装着流动与倾泻如水般的雾气。", aliases: ["Potion of Gaseous Form", "气化形体药水"], loot_tables: ["奥秘_珍稀", "器具_珍稀"]}
- {cn: "高等治疗药水", en: "Potion of Greater Healing", rarity: 非普通, kind: 药水, attunement: "", page: 288, text: "当你饮下这瓶药水时将恢复4d4 + 4生命值。这瓶药水的红色药液在摇晃时总会闪烁。", aliases: ["Potion of Greater Healing", "高等治疗药水"], loot_tables: ["器具_非普通", "圣物_非普通"]}
- {cn: "高等隐形药水", en: "Potion of Greater Invisibility", rarity: 极珍稀, kind: 药水, attunement: "", page: 288, text: "这瓶药水的容器看上去像是空的，但感觉上像是装着药液。当你饮下这瓶药水时，你获得隐形状态，持续1小时。", aliases: ["Potion of Greater Invisibility", "高等隐形药水"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "成长药水", en: "Potion of Growth", rarity: 非普通, kind: 药水, attunement: "", page: 288, text: "当你饮下这瓶药水时，你获得法术变巨/缩小术中的\"变巨Enlarge\"效应，持续10分钟（无需专注）。\n药液中的红色部分从一个小球开始膨胀，随后又收缩起来，把周围的清澈药液染红。即使摇晃药水也不会打断这个过程。", aliases: ["Potion of Growth", "成长药水"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "治疗药水", en: "Potion of Healing", rarity: 普通, kind: 药水, attunement: "", page: 288, text: "当你以附赠动作饮下这瓶药水时将恢复2d4 + 2生命值。这瓶药水的红色药液在摇晃时总会闪烁。", aliases: ["Potion of Healing", "治疗药水"], loot_tables: ["器具_普通", "圣物_普通"]}
- {cn: "英勇药水", en: "Potion of Heroism", rarity: 珍稀, kind: 药水, attunement: "", page: 288, text: "当你饮下这瓶药水时，你获得10临时生命值，持续1小时。在相同持续时间内，你将受到法术祝福术的效应影响（无需专注）。\n这瓶药水的蓝色药液如同沸腾一般冒着气泡与蒸汽。", aliases: ["Potion of Heroism", "英勇药水"], loot_tables: ["奥秘_珍稀", "武备_珍稀"]}
- {cn: "山丘巨人之力药水", en: "Potion of Hill Giant Strength", rarity: 非普通, kind: 药水, attunement: "", page: 288, text: "饮用此药水后，1小时内，你的力量属性值将变为21。如果你的力量属性值已经大于或等于21，则药水无效。\n这瓶药水的透明药液中漂着一缕像是山丘巨人指甲一般的光线。", aliases: ["巨人之力药水（山丘）", "Potion of Hill Giant Strength", "山丘巨人之力药水"], loot_tables: ["奥秘_非普通", "武备_非普通"]}
- {cn: "隐形药水", en: "Potion of Invisibility", rarity: 珍稀, kind: 药水, attunement: "", page: 288, text: "这瓶药水的容器看上去像是空的，但感觉上像是装着药液。当你饮下这瓶药水时，你获得隐形状态，持续1小时。效应将在你进行攻击检定、造成伤害或施展法术时提前结束。", aliases: ["Potion of Invisibility", "隐形药水"], loot_tables: ["奥秘_珍稀"]}
- {cn: "坚不可摧药水", en: "Potion of Invulnerability", rarity: 珍稀, kind: 药水, attunement: "", page: 288, text: "饮下这瓶药水后的1分钟内，你具有所有伤害的抗性。\n这瓶药水的粘稠药液看上去像熔化的铁。", aliases: ["Potion of Invulnerability", "坚不可摧药水"], loot_tables: ["奥秘_珍稀", "武备_珍稀"]}
- {cn: "闪电抗性药水", en: "Potion of Lightning Resistance", rarity: 非普通, kind: 药水, attunement: "", page: 289, text: "（规则见「抗性药水」条目）", aliases: ["Potion of Lightning Resistance", "闪电抗性药水"], loot_tables: []}
- {cn: "延寿药水", en: "Potion of Longevity", rarity: 极珍稀, kind: 药水, attunement: "", page: 288, text: "当你饮下这瓶药水时，你的生理年龄减少1d6 + 6年，最低降至13岁。此后每当你再次饮下延寿药水时，都会累计10%的概率让你的年龄增加1d6 + 6年，而非减少。\n一颗违反常理般跳动着的微型心脏悬浮在琥珀色的药液中。这些成分将在药水被打开时消失。", aliases: ["Potion of Longevity", "延寿药水"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "读心药水", en: "Potion of Mind Reading", rarity: 珍稀, kind: 药水, attunement: "", page: 288, text: "当你饮下这瓶药水时，你获得法术侦测思想 的效应（豁免DC 13），持续10分钟（无需专注）。\n这瓶药剂的深紫色液体中漂浮着一个卵形的粉红色云雾。", aliases: ["Potion of Mind Reading", "读心药水"], loot_tables: ["奥秘_珍稀"]}
- {cn: "暗蚀抗性药水", en: "Potion of Necrotic Resistance", rarity: 非普通, kind: 药水, attunement: "", page: 289, text: "（规则见「抗性药水」条目）", aliases: ["Potion of Necrotic Resistance", "暗蚀抗性药水"], loot_tables: []}
- {cn: "剧毒药水", en: "Potion of Poison", rarity: 非普通, kind: 药水, attunement: "", page: 288, text: "这瓶混合物看起来，闻起来和尝起来都和治疗药水或其他增益药水相似。然而，这实际上是一瓶用幻术魔法伪装的毒药。鉴定术可以揭露其本质。\n如果你饮下这瓶药水，你受到4d6毒素伤害并必须通过DC 13的体质豁免否则陷入中毒状态，持续1小时。", aliases: ["Potion of Poison", "剧毒药水"], loot_tables: ["奥秘_非普通"]}
- {cn: "毒素抗性药水", en: "Potion of Poison Resistance", rarity: 非普通, kind: 药水, attunement: "", page: 289, text: "（规则见「抗性药水」条目）", aliases: ["Potion of Poison Resistance", "毒素抗性药水"], loot_tables: []}
- {cn: "心灵抗性药水", en: "Potion of Psychic Resistance", rarity: 非普通, kind: 药水, attunement: "", page: 289, text: "（规则见「抗性药水」条目）", aliases: ["Potion of Psychic Resistance", "心灵抗性药水"], loot_tables: []}
- {cn: "重拳药水", en: "Potion of Pugilism", rarity: 非普通, kind: 药水, attunement: "", page: 289, text: "饮下这瓶药水后，你的每次徒手打击命中时都会额外造成1d6力场伤害。这个效应持续10分钟。\n这瓶药水里装着尝起来像菠菜的浓稠绿色流体。", aliases: ["Potion of Pugilism", "重拳药水"], loot_tables: ["武备_非普通"]}
- {cn: "光耀抗性药水", en: "Potion of Radiant Resistance", rarity: 非普通, kind: 药水, attunement: "", page: 289, text: "（规则见「抗性药水」条目）", aliases: ["Potion of Radiant Resistance", "光耀抗性药水"], loot_tables: []}
- {cn: "加速药水", en: "Potion of Speed", rarity: 极珍稀, kind: 药水, attunement: "", page: 289, text: "当你饮下这瓶药水时，你获得法术加速术的效应，持续1分钟（无需专注），并且不会遭受通常在效应结束时泛起倦意的影响。\n这瓶药水里黄黑相间的流体正自行旋转成漩涡状。", aliases: ["Potion of Speed", "加速药水"], loot_tables: ["奥秘_极珍稀", "器具_极珍稀"]}
- {cn: "石巨人之力药水", en: "Potion of Stone Giant Strength", rarity: 珍稀, kind: 药水, attunement: "", page: 288, text: "饮用此药水后，1小时内，你的力量属性值将变为23。如果你的力量属性值已经大于或等于23，则药水无效。\n这瓶药水的透明药液中漂着一缕像是石巨人指甲一般的光线。", aliases: ["巨人之力药水（岩石）", "Potion of Stone Giant Strength", "石巨人之力药水"], loot_tables: ["奥秘_珍稀", "武备_珍稀"]}
- {cn: "风暴巨人之力药水", en: "Potion of Storm Giant Strength", rarity: 传说, kind: 药水, attunement: "", page: 288, text: "饮用此药水后，1小时内，你的力量属性值将变为29。如果你的力量属性值已经大于或等于29，则药水无效。\n这瓶药水的透明药液中漂着一缕像是风暴巨人指甲一般的光线。", aliases: ["巨人之力药水（风暴）", "Potion of Storm Giant Strength", "风暴巨人之力药水"], loot_tables: ["奥秘_传说", "武备_传说"]}
- {cn: "强效治疗药水", en: "Potion of Superior Healing", rarity: 珍稀, kind: 药水, attunement: "", page: 288, text: "当你喝下这瓶药水时，你恢复8d4 + 8 生命值。药水的红色液体在晃动时闪烁着光芒。", aliases: ["Potion of Superior Healing", "强效治疗药水"], loot_tables: ["器具_珍稀", "圣物_珍稀"]}
- {cn: "极效治疗药水", en: "Potion of Supreme Healing", rarity: 极珍稀, kind: 药水, attunement: "", page: 288, text: "当你饮下这瓶药水时将恢复10d4 + 20生命值。这瓶药水的红色药液在摇晃时总会闪烁。", aliases: ["Potion of Supreme Healing", "极效治疗药水"], loot_tables: ["器具_极珍稀", "圣物_极珍稀"]}
- {cn: "雷鸣抗性药水", en: "Potion of Thunder Resistance", rarity: 非普通, kind: 药水, attunement: "", page: 289, text: "（规则见「抗性药水」条目）", aliases: ["Potion of Thunder Resistance", "雷鸣抗性药水"], loot_tables: []}
- {cn: "活力药水", en: "Potion of Vitality", rarity: 极珍稀, kind: 药水, attunement: "", page: 289, text: "当你饮下这瓶药水时，它将移除你具有的任何力竭等级，并结束你的中毒状态。在接下来的24小时内，你消耗生命值骰来恢复生命值时将直接取用最大值。\n这瓶药水的深红药液发出有节奏的微光，让人联想起心跳。", aliases: ["Potion of Vitality", "活力药水"], loot_tables: ["奥秘_极珍稀", "圣物_极珍稀"]}
- {cn: "水下呼吸药水", en: "Potion of Water Breathing", rarity: 非普通, kind: 药水, attunement: "", page: 289, text: "饮下这瓶药水后的24小时内，你可以在水下呼吸。\n这瓶药水里的浑浊绿色流体闻起来像海水，其中漂浮着一个水母形状的气泡。", aliases: ["Potion of Water Breathing", "水下呼吸药水"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "假肢", en: "Prosthetic Limb", rarity: 普通, kind: 奇物, attunement: "", page: 290, text: "这件魔法物品能替代一处缺失的肢体——一只手，一条手臂，一条腿，或是类似的身体部位。在假肢已完成安装期间，它能像被代替的肢体一样正常工作。你可以用一个魔法动作将其装好或者卸除，且只要你活着，它就不能在你非自愿的情况下被移除。", aliases: ["Prosthetic Limb", "假肢"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "紫虫毒液", en: "Purple Worm Poison", rarity: 未标注, kind: 奇物, attunement: "", page: 91, text: "受该毒药影响的生物需要进行一次DC 21的体质豁免，豁免失败则受到35（10d6）毒素伤害，豁免成功则伤害减半。", aliases: ["Purple Worm Poison", "紫虫毒液"], loot_tables: []}
- {cn: "夸尔羽符，锚", en: "Quaal's Feather Token, Anchor", rarity: 非普通, kind: 奇物, attunement: "", page: 290, text: "这枚物件看上去像一根羽毛。\n你可以执行魔法动作来用羽符触碰一艘小艇或船只。接下来的24小时内，该船不会被任何方式移动。效应结束时，羽符也随之消失。", aliases: ["Quaal's Feather Token, Anchor", "夸尔羽符，锚"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "夸尔羽符，鸟", en: "Quaal's Feather Token, Bird", rarity: 珍稀, kind: 奇物, attunement: "", page: 290, text: "这枚物件看上去像一根羽毛。\n你可以执行魔法动作将羽符抛至5尺高的空中。羽符将消失，并且一只五彩斑斓的巨鸟取而代之。这只鸟使用鹏鸟的数据，但它无法进行攻击。它会遵从你的简单命令且能在负载至多500磅的同时全速前进（16里/小时，每飞行3小时休息1小时，最高144里/日），或在负载至多1000磅的同时以半速前进。鸟将在达到其一日能飞行的最远距离或生命值降为0时消失。你也可以用魔法动作将其遣散。", aliases: ["Quaal's Feather Token, Bird", "夸尔羽符，鸟"], loot_tables: ["奥秘_珍稀", "器具_珍稀"]}
- {cn: "夸尔羽符，扇", en: "Quaal's Feather Token, Fan", rarity: 非普通, kind: 奇物, attunement: "", page: 290, text: "这枚物件看上去像一根羽毛。\n如果你在小艇或船只上，你可以执行魔法动作将羽符抛至10尺高的空中。羽符将消失，一把巨大的扇子取而代之。这把扇子会漂浮并制造一股强风。强风会吹满帆船的风帆，使其速度增加5里/小时，持续8小时。你可以执行魔法动作将扇子遣散。", aliases: ["Quaal's Feather Token, Fan", "夸尔羽符，扇"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "夸尔羽符，天鹅船", en: "Quaal's Feather Token, Swan Boat", rarity: 珍稀, kind: 奇物, attunement: "", page: 290, text: "这枚物件看上去像一根羽毛。\n你可以执行魔法动作来用羽符触碰直径至少60尺的水体。羽符将消失，并且一艘50尺长，20尺宽，形状类似天鹅的船取而代之。这艘船可以自行推进并以6英里/小时的速度穿越水体。在船上时，你可以执行魔法动作以命令它移动或转向最多90度。这艘船持续24小时，随后消失。你可以执行魔法动作遣散这艘船。", aliases: ["Quaal's Feather Token, Swan Boat", "夸尔羽符，天鹅船"], loot_tables: ["奥秘_珍稀", "器具_珍稀"]}
- {cn: "夸尔羽符，树", en: "Quaal's Feather Token, Tree", rarity: 非普通, kind: 奇物, attunement: "", page: 290, text: "这枚物件看上去像一根羽毛。\n要使用这枚羽符，你必须身处室外。你可以执行魔法动作来用羽符触碰地面上的未占据空间。羽符将消失，取而代之的是该地长出一棵非魔法性的橡树。这棵树高60尺，树干直径5尺，顶端的树冠以20尺半径向外延伸。", aliases: ["Quaal's Feather Token, Tree", "夸尔羽符，树"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "夸尔羽符，鞭", en: "Quaal's Feather Token, Whip", rarity: 珍稀, kind: 奇物, attunement: "", page: 290, text: "这枚物件看上去像一根羽毛。\n你可以执行魔法动作将羽符扔向位于你10尺内的一点。羽符消失，取而代之的是一根漂浮的鞭子，然后你可以用附赠动作对鞭子10尺内的一个生物发动一次近战法术攻击（攻击加值+9）。命中时，目标受到1d6 + 5力场伤害。\n以一个附赠动作，你可以命令鞭子飞行至多20尺并再次攻击其10尺内的一个生物。鞭子将在经过一小时、你执行魔法动作将其遣散、你死亡或陷入失能状态后消失。", aliases: ["Quaal's Feather Token, Whip", "夸尔羽符，鞭"], loot_tables: ["奥秘_珍稀", "器具_珍稀"]}
- {cn: "杂技长棍", en: "Quarterstaff of the Acrobat", rarity: 极珍稀, kind: 武器, attunement: "需同调", page: 291, text: "你以此魔法武器进行的攻击检定和伤害掷骰具有+2加值。\n持握此武器期间，你可以在骰先攻后令该长棍散发出10尺微光光照。你也可以用一个附赠动作使其散发出同样的光照，或使用附赠动作使该光照熄灭。\n持握此武器期间，你可以用一个附赠动作转化其形态，将其变为一根6寸短杆（为便于储存）或一根10尺长杆，又或者将其恢复至一根长棍。此武器至多只能伸长至其周围空间所允许的长度。\n在相应形态下，此武器具有以下额外词条：\n【援助特技（仅限长棍和10尺长杆形态）】持握此武器期间，你在敏捷（特技）检定上具有优势。\n【偏斜攻击（仅限长棍形态）】若你在持握此武器期间被一次攻击命中，你可以用一个反应让武器盘绕于己身，使你针对触发此反应的攻击中护甲等级+5，这可能导致该攻击变为未命中。该词条在你完成一次短或长休前无法再次使用。\n【远程武器（仅限长棍形态）】此武器具有投掷（30/120）词条。你以此武器进行一次远程攻击之后，它会立即飞回你的手中。", aliases: ["Quarterstaff of the Acrobat", "杂技长棍"], loot_tables: ["武备_极珍稀"]}
- {cn: "石英", en: "Quartz", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗白色、烟灰色或黄色的宝石。", aliases: ["Quartz", "石英"], loot_tables: []}
- {cn: "艾罗娜的箭袋", en: "Quiver of Ehlonna", rarity: 非普通, kind: 奇物, attunement: "", page: 189, text: "这个箭袋有三个大小不一的隔层，每个隔层都连接着一个异次元空间。无论其中存放着多少东西，箭袋的总重量都永远都不会超过2磅。最小的隔层可以容纳至多60支箭、弩矢或类似的物件；中等大小的隔层可以容纳至多18支标枪或类似的物件；最大的隔层可以容纳至多6件长条型的物件，例如弓、长棍、矛等。\n你可以如同从普通的箭袋或剑鞘中抽出物品一般抽出艾罗娜箭袋中的物品。", aliases: ["Quiver of Ehlonna", "艾罗娜的箭袋"], loot_tables: ["武备_非普通"]}
- {cn: "红龙鳞甲", en: "Red Dragon Scale Mail", rarity: 极珍稀, kind: 护甲, attunement: "需同调", page: 254, text: "（规则见「龙鳞甲」条目）", aliases: ["Red Dragon Scale Mail", "红龙鳞甲"], loot_tables: []}
- {cn: "红锰矿石", en: "Rhodochrosite", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一块浅粉色的宝石。", aliases: ["Rhodochrosite", "红锰矿石"], loot_tables: []}
- {cn: "强酸抗性戒指", en: "Ring of Acid Resistance", rarity: 珍稀, kind: 戒指, attunement: "", page: 294, text: "（规则见「抗性戒指」条目）", aliases: ["Ring of Acid Resistance", "强酸抗性戒指"], loot_tables: []}
- {cn: "影响动物戒指", en: "Ring of Animal Influence", rarity: 珍稀, kind: 戒指, attunement: "", page: 292, text: "这枚戒指具有3充能，并在每日黎明时重获1d3已消耗的充能。着装此戒指期间，你可以消耗1充能，从中施展以下法术之一（豁免DC 13）：\n化兽为友\n恐惧术（只影响野兽）\n动物交谈", aliases: ["Ring of Animal Influence", "影响动物戒指"], loot_tables: ["圣物_珍稀"]}
- {cn: "寒冷抗性戒指", en: "Ring of Cold Resistance", rarity: 珍稀, kind: 戒指, attunement: "", page: 294, text: "（规则见「抗性戒指」条目）", aliases: ["Ring of Cold Resistance", "寒冷抗性戒指"], loot_tables: []}
- {cn: "召唤气巨灵戒指", en: "Ring of Djinni Summoning", rarity: 传说, kind: 戒指, attunement: "需同调", page: 292, text: "着装此戒指期间，你能够以一个魔法动作从气元素位面召唤一名特定的气巨灵。该气巨灵将出现在位于你120尺内你选择的未占据空间中。只要你为之维持专注，气巨灵将持续存在，至多1小时，或在其生命值降至0时提前消失。\n被召唤期间，气巨灵对你和你的盟友态度友好，并将服从你的命令。如果你没有下达命令，则它除在遭受攻击时自卫外不会执行任何动作。\n气巨灵消失后，24小时内你都无法再次召唤它，若该气巨灵死亡，此戒指变为非魔法的。\n召唤气巨灵戒指通常由戒指所召唤的气巨灵制造，用来作为友谊或尊重的象征赠予凡人。", aliases: ["Ring of Djinni Summoning", "召唤气巨灵戒指"], loot_tables: ["奥秘_传说"]}
- {cn: "命令元素戒指（气）", en: "Ring of Elemental Command (Air)", rarity: 传说, kind: 戒指, attunement: "需同调", page: 292, text: "命令元素戒指（气）连接着气元素位面。每枚命令元素戒指都具有以下两种词条：\n【元素灾厄】着装戒指期间，你对元素的攻击检定具有优势，且元素对你的攻击具有劣势。\n【元素强令】着装戒指期间，你可以执行魔法动作来尝试强迫一个可见的，位于你60尺内的元素服从于你。该元素进行一次DC 18的感知豁免。豁免失败时，该元素直到你的下个回合开始前陷入魅惑状态，且你决定其下一回合他将使用移动和动作做什么。\n【元素集中】着装戒指期间，你受益于与该戒指连接的元素位面对应的额外词条： 【气】你懂气族语，你对闪电伤害具有抗性，你获得等于你的速度的飞行速度并且可以悬浮。\n【施法】这枚戒指具有5充能，并在每日黎明时重获1d4 + 1已消耗的充能。着装戒指期间，你可以从中施展法术。施展相应法术所需的充能数如该表所示，法术的豁免DC为18。羽落术（0充能）、风墙术（1充能）、造风术（2充能）、连锁闪电（3充能）", aliases: ["Ring of Elemental Command (Air)", "命令元素戒指", "命令元素戒指（气）"], loot_tables: ["奥秘_传说"]}
- {cn: "命令元素戒指（土）", en: "Ring of Elemental Command (Earth)", rarity: 传说, kind: 戒指, attunement: "需同调", page: 292, text: "命令元素戒指（土）连接着土元素位面。每枚命令元素戒指都具有以下两种词条：\n【元素灾厄】着装戒指期间，你对元素的攻击检定具有优势，且元素对你的攻击具有劣势。\n【元素强令】着装戒指期间，你可以执行魔法动作来尝试强迫一个可见的，位于你60尺内的元素服从于你。该元素进行一次DC 18的感知豁免。豁免失败时，该元素直到你的下个回合开始前陷入魅惑状态，且你决定其下一回合他将使用移动和动作做什么。\n【元素集中】着装戒指期间，你受益于与该戒指连接的元素位面对应的额外词条： 【土】你懂土族语，你对强酸伤害具有抗性。你无视因碎石、岩石或泥土造成的困难地形。此外，你可以在固态土地或岩石内部穿行，如同它们是困难地形一般，且不会影响你所穿过的物质。如果你在固态土地或岩石中结束你的回合，你会被推回你先前所处的最近的未占据空间。\n【施法】这枚戒指具有5充能，并在每日黎明时重获1d4 + 1已消耗的充能。着装戒指期间，你可以从中施展法术施展相应法术所需的充能数如该表所示，法术的豁免DC为18。塑石术（2充能）、石肤术（3充能）、石墙术（3充能）、地震术（5充能）", aliases: ["Ring of Elemental Command (Earth)", "命令元素戒指", "命令元素戒指（土）"], loot_tables: ["奥秘_传说"]}
- {cn: "命令元素戒指（火）", en: "Ring of Elemental Command (Fire)", rarity: 传说, kind: 戒指, attunement: "需同调", page: 292, text: "命令元素戒指（火）连接着气元素位面。每枚命令元素戒指都具有以下两种词条：\n【元素灾厄】着装戒指期间，你对元素的攻击检定具有优势，且元素对你的攻击具有劣势。\n【元素强令】着装戒指期间，你可以执行魔法动作来尝试强迫一个可见的，位于你60尺内的元素服从于你。该元素进行一次DC 18的感知豁免。豁免失败时，该元素直到你的下个回合开始前陷入魅惑状态，且你决定其下一回合他将使用移动和动作做什么。\n【元素集中】着装戒指期间，你受益于与该戒指连接的元素位面对应的额外词条： 【火】你懂火族语，你对火焰伤害具有免疫。\n【施法】这枚戒指具有5充能，并在每日黎明时重获1d4 + 1已消耗的充能。着装戒指期间，你可以从中施展法术。施展相应法术所需的充能数如该表所示，法术的豁免DC为18。燃烧之手（1充能）、火球术（2充能）、火墙术（3充能）、火焰风暴 （4充能）", aliases: ["Ring of Elemental Command (Fire)", "命令元素戒指", "命令元素戒指（火）"], loot_tables: ["奥秘_传说"]}
- {cn: "命令元素戒指（水）", en: "Ring of Elemental Command (Water)", rarity: 传说, kind: 戒指, attunement: "需同调", page: 292, text: "命令元素戒指（水）连接着水元素位面。每枚命令元素戒指都具有以下两种词条：\n【元素灾厄】着装戒指期间，你对元素的攻击检定具有优势，且元素对你的攻击具有劣势。\n【元素强令】着装戒指期间，你可以执行魔法动作来尝试强迫一个可见的，位于你60尺内的元素服从于你。该元素进行一次DC 18的感知豁免。豁免失败时，该元素直到你的下个回合开始前陷入魅惑状态，且你决定其下一回合他将使用移动和动作做什么。\n【元素集中】着装戒指期间，你受益于与该戒指连接的元素位面对应的额外词条： 【水】你懂水族语，你获得60尺游泳速度并且可以在水下呼吸。\n【施法】枚戒指具有5充能，并在每日黎明时重获1d4 + 1已消耗的充能。着装戒指期间，你可以从中施展法术。施展相应法术所需的充能数如该表所示，法术的豁免DC为18。造水术/枯水术（1充能）、冰风暴（2充能）、水上行走（2充能）、冰墙术（3充能）、海啸术（5充能）", aliases: ["Ring of Elemental Command (Water)", "命令元素戒指", "命令元素戒指（水）"], loot_tables: ["奥秘_传说"]}
- {cn: "反射闪避戒指", en: "Ring of Evasion", rarity: 珍稀, kind: 戒指, attunement: "需同调", page: 293, text: "这枚戒指具有3充能，且在每日黎明时恢复1d3已消耗的充能。着装戒指期间，当你敏捷豁免失败时，你可以执行反应以消耗1充能，来让该豁免改为成功。", aliases: ["Ring of Evasion", "反射闪避戒指"], loot_tables: ["器具_珍稀"]}
- {cn: "羽落戒指", en: "Ring of Feather Falling", rarity: 珍稀, kind: 戒指, attunement: "需同调", page: 293, text: "着装此戒指期间，你在坠落时每轮只会下落60尺且不会受到坠落伤害。", aliases: ["Ring of Feather Falling", "羽落戒指"], loot_tables: ["奥秘_珍稀"]}
- {cn: "火焰抗性戒指", en: "Ring of Fire Resistance", rarity: 珍稀, kind: 戒指, attunement: "", page: 294, text: "（规则见「抗性戒指」条目）", aliases: ["Ring of Fire Resistance", "火焰抗性戒指"], loot_tables: []}
- {cn: "力场抗性戒指", en: "Ring of Force Resistance", rarity: 珍稀, kind: 戒指, attunement: "", page: 294, text: "（规则见「抗性戒指」条目）", aliases: ["Ring of Force Resistance", "力场抗性戒指"], loot_tables: []}
- {cn: "自由行动戒指", en: "Ring of Free Action", rarity: 珍稀, kind: 戒指, attunement: "需同调", page: 293, text: "着装此戒指期间，你不会因困难地形而损耗额外的移动力。此外，魔法不能减少你的任何速度，也不能使你陷入麻痹或束缚状态。", aliases: ["Ring of Free Action", "自由行动戒指"], loot_tables: ["器具_珍稀"]}
- {cn: "隐身戒指", en: "Ring of Invisibility", rarity: 传说, kind: 戒指, attunement: "需同调", page: 293, text: "着装此戒指期间，你能够以一个魔法动作令自己获得隐形状态。隐形持续至戒指被摘下或你以一个附赠动作显形。", aliases: ["Ring of Invisibility", "隐身戒指"], loot_tables: ["奥秘_传说"]}
- {cn: "跳跃戒指", en: "Ring of Jumping", rarity: 非普通, kind: 戒指, attunement: "需同调", page: 293, text: "着装此戒指期间，你可以从中施展跳跃术，但只能以自身为目标。", aliases: ["Ring of Jumping", "跳跃戒指"], loot_tables: ["器具_非普通"]}
- {cn: "闪电抗性戒指", en: "Ring of Lightning Resistance", rarity: 珍稀, kind: 戒指, attunement: "", page: 294, text: "（规则见「抗性戒指」条目）", aliases: ["Ring of Lightning Resistance", "闪电抗性戒指"], loot_tables: []}
- {cn: "心灵护盾戒指", en: "Ring of Mind Shielding", rarity: 非普通, kind: 戒指, attunement: "需同调", page: 293, text: "着装此戒指期间，你免疫能让其他生物阅读你的思想、辨别你在说谎、知晓你阵营或生物类型的魔法。只有在你允许时，生物才能与你进行心灵感应交流。\n你可以执行魔法动作来让戒指变的无法被察觉，持续至你脱下戒指、死亡或执行另一个魔法动作使其可被察觉为止。\n如果你在着装戒指期间死亡，你的灵魂将进入戒指中，除非其内已寄宿着其他灵魂。你可以留在戒指内或奔向来世。只要你的灵魂处在戒指中，你就可以与着装它的任何生物进行心灵感应交流。着装者无法阻止这种心灵感应交流。", aliases: ["Ring of Mind Shielding", "心灵护盾戒指"], loot_tables: ["奥秘_非普通"]}
- {cn: "暗蚀抗性戒指", en: "Ring of Necrotic Resistance", rarity: 珍稀, kind: 戒指, attunement: "", page: 294, text: "（规则见「抗性戒指」条目）", aliases: ["Ring of Necrotic Resistance", "暗蚀抗性戒指"], loot_tables: []}
- {cn: "毒素抗性戒指", en: "Ring of Poison Resistance", rarity: 珍稀, kind: 戒指, attunement: "", page: 294, text: "（规则见「抗性戒指」条目）", aliases: ["Ring of Poison Resistance", "毒素抗性戒指"], loot_tables: []}
- {cn: "防护戒指", en: "Ring of Protection", rarity: 珍稀, kind: 戒指, attunement: "需同调", page: 294, text: "着装此戒指期间，你在护甲等级和豁免中获得+1加值。", aliases: ["Ring of Protection", "防护戒指"], loot_tables: ["武备_珍稀"]}
- {cn: "心灵抗性戒指", en: "Ring of Psychic Resistance", rarity: 珍稀, kind: 戒指, attunement: "", page: 294, text: "（规则见「抗性戒指」条目）", aliases: ["Ring of Psychic Resistance", "心灵抗性戒指"], loot_tables: []}
- {cn: "光耀抗性戒指", en: "Ring of Radiant Resistance", rarity: 珍稀, kind: 戒指, attunement: "", page: 294, text: "（规则见「抗性戒指」条目）", aliases: ["Ring of Radiant Resistance", "光耀抗性戒指"], loot_tables: []}
- {cn: "再生戒指", en: "Ring of Regeneration", rarity: 极珍稀, kind: 戒指, attunement: "需同调", page: 294, text: "着装此戒指期间，如果你至少拥有1生命值，则你每10分钟恢复1d6生命值。如果你失去了一部分肢体，这枚戒指会使你失去的部位自行再生。只要你在1d6 + 1天的时间里全程保有至少1生命值，该部位就会在这段时间后恢复原有的功能。", aliases: ["Ring of Regeneration", "再生戒指"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "流星戒指", en: "Ring of Shooting Stars", rarity: 极珍稀, kind: 戒指, attunement: "需同调", page: 294, text: "你可以从戒指中施展舞光术或光亮术。\n这枚戒指具有6充能，并在每日黎明时重获1d6已消耗的充能。你可以消耗充能以使用以下词条。\n【妖火】你可以消耗1充能以从戒指中施展妖火 。\n【球状闪电】你可以消耗2充能，以一个魔法动作创造至多四个3尺直径的闪电球体。 每个球体都出现于120尺内你可见的未占据空间中。只要你为它们维持专注，球体就能持续存在至多1分钟。每个球体都会散发出半径30尺的微光光照。 以一个附赠动作，你可以移动每个球体至多30尺，但球体和你的距离不得超过120尺。球体初次进入一个除你以外的，未处于全身掩护后的生物5尺内时，球体对那个生物放出闪电并消失。该生物进行一次DC 15的敏捷豁免。豁免失败时，生物受到基于你创造出的球体数量的闪电伤害，如下表所示。豁免成功时，生物受到的伤害减半。\n【流星】以一个魔法动作 ，你可以消耗1至3充能。每一发你消耗的充能都会变为一粒发光尘埃，从戒指处向着你60尺内的一点发射。以该点为源点，15尺立方内的所有生物将沐浴在火花之中，并进行一次DC 15的敏捷豁免，失败则受到5d4点光耀伤害，成功则伤害减半。", aliases: ["Ring of Shooting Stars", "流星戒指"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "储法戒指", en: "Ring of Spell Storing", rarity: 珍稀, kind: 戒指, attunement: "需同调", page: 295, text: "这枚戒指会储存对其施展的法术，将它们储存起来，直至同调的着装者使用。这枚戒指同时可以储存环阶总和最多为5的法术。被发现时，戒指中已储存了由DM选择的共1d6 - 1环阶的法术。\n任何生物都可以向戒指内存入一至五环的法术，这需要施法者在施法的同时触碰该戒指。此时法术会被储存进戒指，不产生任何其他效果。如果戒指无法承载这道法术，则法术会被消耗并不产生任何效果。施展法术时使用的法术位决定其占用戒指中的多少空间。\n着装此戒指期间，你可以施展任何其中储存的法术。这道法术使用原施法者的环阶，法术豁免DC，法术攻击加值与施法属性，但其他方面将如同你施展了法术一般处理。戒指中的法术一经施展即消失，释放它原本占用的空间。", aliases: ["Ring of Spell Storing", "储法戒指"], loot_tables: ["奥秘_珍稀", "圣物_珍稀"]}
- {cn: "法术反转戒指", en: "Ring of Spell Turning", rarity: 传说, kind: 戒指, attunement: "需同调", page: 295, text: "着装此戒指期间，你为对抗法术所进行的豁免具有优势。若你对抗不超过七环的法术进行的豁免检定成功，该法术将不会对你产生任何效应；若该法术仅以你为目标且不会创造区域效应，你能够以反应将该法术朝其施法者反弹回去。原施法者必须进行一次豁免检定对抗该法术，该豁免使用原施法者自己的法术豁免DC。", aliases: ["Ring of Spell Turning", "法术反转戒指"], loot_tables: ["奥秘_传说"]}
- {cn: "善泳戒指", en: "Ring of Swimming", rarity: 非普通, kind: 戒指, attunement: "", page: 295, text: "着装此戒指期间，你获得40尺游泳速度。", aliases: ["Ring of Swimming", "善泳戒指"], loot_tables: ["器具_非普通"]}
- {cn: "心灵遥控戒指", en: "Ring of Telekinesis", rarity: 极珍稀, kind: 戒指, attunement: "需同调", page: 295, text: "着装此戒指期间，你可以从中施展心灵遥控。", aliases: ["Ring of Telekinesis", "心灵遥控戒指"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "公羊戒指", en: "Ring of the Ram", rarity: 珍稀, kind: 戒指, attunement: "需同调", page: 296, text: "这枚戒指具有3充能，且在每日黎明时重获1d3已消耗的充能。着装此戒指期间，你可以执行魔法动作并消耗1至3充能，对60尺内的一个可见生物进行一次远程法术攻击。戒指创造出一个灵体公羊脑袋并进行具有+7加值的攻击检定。命中时，你每消耗1充能，目标就会受到2d10点力场伤害并且从你的方向被推离5尺。\n作为另一种用法，你可以执行魔法动作并消耗1至3充能，以尝试破坏一件60尺内你可见且未被着装或携带的非魔法性的物体。戒指将进行力量检定，你每消耗1充能，此检定便具有+5加值。", aliases: ["Ring of the Ram", "公羊戒指"], loot_tables: ["武备_珍稀"]}
- {cn: "三愿戒指", en: "Ring of Three Wishes", rarity: 传说, kind: 戒指, attunement: "", page: 296, text: "这枚戒指具有3充能；着装此戒指期间，你可以消耗1充能，从中施展祈愿术。充能耗尽时，此戒指变为非魔法的。", aliases: ["Ring of Three Wishes", "三愿戒指"], loot_tables: ["奥秘_传说"]}
- {cn: "雷鸣抗性戒指", en: "Ring of Thunder Resistance", rarity: 珍稀, kind: 戒指, attunement: "", page: 294, text: "（规则见「抗性戒指」条目）", aliases: ["Ring of Thunder Resistance", "雷鸣抗性戒指"], loot_tables: []}
- {cn: "温暖戒指", en: "Ring of Warmth", rarity: 非普通, kind: 戒指, attunement: "需同调", page: 296, text: "着装此戒指期间，当你受到寒冷伤害时，戒指将你所受的伤害减少2d8。\n此外，着装此戒指期间，你以及你着装和携带的任何东西都不会被0华氏度及以下的温度所伤害。", aliases: ["Ring of Warmth", "温暖戒指"], loot_tables: ["器具_非普通"]}
- {cn: "水上行走戒指", en: "Ring of Water Walking", rarity: 非普通, kind: 戒指, attunement: "", page: 296, text: "着装此戒指期间，你可以从中施展水上行走，但目标只能为自身。", aliases: ["Ring of Water Walking", "水上行走戒指"], loot_tables: ["圣物_非普通"]}
- {cn: "X射线戒指", en: "Ring of X-ray Vision", rarity: 珍稀, kind: 戒指, attunement: "需同调", page: 296, text: "着装此戒指期间，你可以执行魔法动作以获得范围30尺的X射线视觉，持续1分钟。对你来说，半径内的固态物件变为透明，并且不会阻碍光线通过。这种视觉可以穿透1尺厚的石头，1寸厚的常见金属或最多3尺厚的木头或泥土。更厚的物质或一张薄铅片会阻挡这种视觉。\n每当你在完成一次长休前再次使用这枚戒指时，你必须成功通过一次DC 15的体质豁免，否则获得1级力竭。", aliases: ["Ring of X-ray Vision", "X射线戒指"], loot_tables: ["奥秘_珍稀"]}
- {cn: "劲敌硬币", en: "Rival Coin", rarity: 普通, kind: 奇物, attunement: "", page: 296, text: "这枚金币的两面均饰有一个生物的浮雕。这两个被描绘的生物必须为彼此知名的对手或敌人。例如，一枚劲敌硬币的一面可能是伊格薇尔伏，而另一面是魔邓肯；或者一面是温戈尔，另一面是提亚马特。其中一个人物在硬币的正面，另一个在反面。\n这枚硬币具有1充能，并在每日黎明时重获已消耗的充能。你可以使用一个魔法动作抛掷这枚硬币，并消耗其充能。掷一枚任意骰子来确定硬币是正面朝上（若结果为偶数）还是反面朝上（若结果为奇数）。此结果决定了硬币产生的效应：\n【正面】以位于你60尺内一个你可见的生物为目标。目标进行一次DC 13的感知豁免：如果豁免失败，目标会受到2d4心灵伤害，并在其下一回合结束前进行的下一次攻击检定中具有劣势；豁免成功则目标仅受半伤。\n【背面】你受到1d4心灵伤害。", aliases: ["Rival Coin", "劲敌硬币"], loot_tables: ["奥秘_普通"]}
- {cn: "百眼法袍", en: "Robe of Eyes", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 297, text: "这件长袍上绘满了眼睛的图案。着装这件长袍期间，你获得以下增益：\n【全域视野】你在依赖视觉的感知（察觉）检定中具有优势。\n【特殊感官】你具有120尺的黑暗视觉和真实视觉。\n【缺点】对法袍施展光亮术或在其周围5尺内施展昼明术将使你陷入目盲，持续1分钟。在你的每个回合结束时，你可以进行一次体质豁免（对光亮术时DC 11，对昼明术时DC 15），成功则终止你身上的该效应。", aliases: ["Robe of Eyes", "百眼法袍"], loot_tables: ["奥秘_珍稀"]}
- {cn: "虹光法袍", en: "Robe of Scintillating Colors", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 297, text: "这件长袍具有3充能，并每日黎明时重获1d3已消耗的充能。着装这件长袍期间，你可以使用一个魔法动作并消耗1充能，让长袍不断变幻出各种耀眼的色彩图案，持续至你的下个回合结束。在此期间，长袍提供30尺明亮光照和额外30尺微光光照，能看到你的生物对你发动的攻击检定具有劣势。此外，长袍效应启用期间，任何处于长袍产生的明亮光照区域内且可以看到你的生物必须进行一次DC 15的感知豁免，豁免失败则陷入震慑状态，直到长袍的效应终止。", aliases: ["Robe of Scintillating Colors", "虹光法袍"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "星辰法袍", en: "Robe of Stars", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 297, text: "这件黑色或深蓝色的长袍上点缀着白色或银色的星星。着装这件长袍期间，你的豁免具有+1加值。\n法袍的前襟附近有六枚较大的星星。着装这件长袍期间，你可以使用一个魔法动作消耗其中一颗星星，以此施展五环版本的魔法飞弹。每日黄昏时分，1d6颗被消耗的星星将重新出现在法袍上。\n着装这件长袍期间，你可以用一个魔法动作使你和你着装或携带的物件一起进入星界，直至你再次使用一个魔法动作回到你原本所在的位面。此时你出现在自己之前占据的空间中，如果该空间已被占据，则你出现在最近的未占据空间。", aliases: ["Robe of Stars", "星辰法袍"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "大法师法袍", en: "Robe of the Archmagi", rarity: 传说, kind: 奇物, attunement: "由术士、魔契师或法师", page: 298, text: "这件典雅的长袍由精美的布料制成，并以符文装饰。\n着装此长袍时，你获得下列增益：\n【护甲】若你未着装护甲，你的基础护甲等级为15+你的敏捷调整值。\n【魔法抗性】你对抗法术和其他魔法效应时进行的豁免检定具有优势。\n【战法师】你的法术豁免DC和法术攻击加值均提升2。", aliases: ["Robe of the Archmagi", "大法师法袍"], loot_tables: ["奥秘_传说"]}
- {cn: "杂货法袍", en: "Robe of Useful Items", rarity: 非普通, kind: 奇物, attunement: "", page: 298, text: "这件长袍上打着各种颜色和形状的补丁。着装这件长袍期间，你可以使用一个魔法动作拆下其中一块补丁，使其变成它所代表的物件或生物。当长袍上的所有补丁都被拆下后，它将变为一件平凡的衣物。\n杂货法袍有着如下补丁各两个：\n牛眼提灯（装满燃料且点燃）\n匕首\n镜子\n长杆\n绳索（卷起）\n麻袋\n此外，杂货法袍还有4d4个其他补丁。由DM选择补丁种类或通过在下表中掷骰以随机决定补丁种类。", aliases: ["Robe of Useful Items", "杂货法袍"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "吸收权杖", en: "Rod of Absorption", rarity: 极珍稀, kind: 权杖, attunement: "需同调", page: 299, text: "持握这根权杖期间，你可以执行反应应来吸收一道仅以你为目标且不会创造范围效应的法术。被吸收的法术将被解除，且法术的能量（而非法术本身）将被储存进权杖中。这些能量与该法术施展时的环阶相同。被解除的法术消散且无效，而施展法术时使用的任何资源都将浪费掉。这根权杖在其被制造出来后最多能吸收并储存共计50环的能量。当权杖已经吸收了50环的能量后，它将无法再吸收法术。如果你被一道权杖无法储存的法术所选为目标，那么权杖将不会对其产生影响。\n当你与权杖同调时，你会知晓权杖已经吸收过多少环的能量，以及它当前储存了多少环的法术能量。\n持握此权杖期间，如果你是一名施法者，则你可以将权杖中储存的能量转化为法术位并用其施展你已准备的法术或已知的法术。此法可转化出的法术位其环阶不超过你拥有的最高法术位环阶，且最高为五环。你需要如常施展该法术，只是你消耗的是权杖储存的法术能量而非自己的法术位。例如，你可以将权杖储存的3环能量作为一个3环法术位使用。\n新发现的吸收权杖通常已经储存了1d10环的法术能量。一根无法再吸收法术且其中没有剩余能量的吸收权杖将变为非魔法的权杖。", aliases: ["Rod of Absorption", "吸收权杖"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "警示权杖", en: "Rod of Alertness", rarity: 极珍稀, kind: 权杖, attunement: "需同调", page: 299, text: "这根权杖具有以下词条：\n【警觉】当你持握此权杖时，你在感知（察觉）检定和先攻掷骰上具有优势。\n【法术】当你持握此权杖时，你可以通过它施放以下法术： 侦测善恶 侦测魔法 侦测毒性和疾病 识破隐形\n【防护灵光】以一个魔法动作，你可以将权杖的柄端插入地面，此时权杖的顶部将发出60尺半径的明亮光照和额外60尺微光光照。身处权杖发出的明亮光照中时，你与你的盟友在护甲等级和豁免中获得+1加值，并且可以感知到同样处于此明亮光照中的任何隐形生物的位置。 最多10分钟后或直至一个生物执行魔法动作将权杖从地面拔出后，权杖顶部会停止发光并结束这个效应。该词条一经使用，直至次日黎明前你都无法再次使用。", aliases: ["Rod of Alertness", "警示权杖"], loot_tables: ["圣物_极珍稀"]}
- {cn: "王者权杖", en: "Rod of Lordly Might", rarity: 传说, kind: 权杖, attunement: "需同调", page: 300, text: "这把权杖顶端有尖刺状凸起，其可以被用作一把魔法硬头锤。你用此魔法武器进行的攻击检定和伤害掷骰获得+3加值。王者权杖的杖柄上排列着六个不同的按钮，用来启动权杖的相应属性，它还有三个额外词条。词条的描述见下文：\n【按钮】你能够以一个附赠动作按压下列按钮之一。按钮的效应将持续生效，直至你按压另一个按钮或再次按压同一个按钮。再次按压同一个按钮将使权杖变回通常形态。 【按钮1】烈焰覆盖的刀刃从权杖凸缘的另一端伸出。火焰发出半径40尺的明亮光照以及额外40尺的微光光照，剑刃可以被用作一柄魔法长剑或短剑（由你选择），命中时额外造成2d6火焰伤害。 【按钮2】权杖凸缘头向下折叠，弹出两片月牙状斧刃，这使得权杖变为一柄魔法战斧。你用此魔法武器进行的攻击检定和伤害掷骰获得+3加值。 【按钮3】权杖凸缘头向下折叠，杖柄顶端弹出矛尖，杖柄伸长至6尺，将权杖变为一把魔法矛。你用此魔法武器进行的攻击检定和伤害掷骰获得+3加值。 【按钮4】权杖将变为一根至多50尺长的爬杆（长度由你指定），但权杖的按钮仍在你触及内。在花岗岩一般坚硬的表面上，爬杆尾部的岩钉和顶部的三个爪钩可以固定住爬杆。爬杆上每隔1尺向侧面伸展出一根3寸长的水平杆，构成一架梯子。爬杆最多可以承受4000磅的重量。如果超重或是失去固定点，则爬杆将会变回权杖。 【按钮5】权杖将变为一把手持式攻城锤。用它破坏门、路障或其他障碍时，持用者进行的力量（运动）检定获得+10加值。 【按钮 6】权杖将变回或维持通常形态，并指出地磁北极。（如果权杖所在的地点并没有地磁北极的概念，则此功能无效。）权杖还会让你了解到自己在地下的大致深度或在地上的高度。\n【汲取生命】当你以权杖发动的近战攻击命中一名生物时，你可以迫使目标进行一次DC 17的体质豁免。豁免失败则目标额外受到4d6暗蚀伤害，而你恢复等于此暗蚀伤害值一半的生命值。该词条一经使用，直至次日黎明你都无法再次使用。\n【麻痹】当你以权杖发动的近战攻击命中一名生物时，你可以迫使目标进行一次DC 17的体质豁免。豁免失败则目标陷入麻痹状态，持续1分钟。目标在其每回合结束时都可以重新豁免，豁免成功则结束该效应。该词条一经使用，直至次日黎明你都无法再次使用。\n【惊骇】持握此权杖期间，你能够以一个魔法动作迫使位于你30尺内你可见的每名生物进行一次DC 17的感知豁免。豁免失败则目标将陷入恐慌状态，持续1分钟。陷入恐慌状态的目标在其每回合结束时都可以重新豁免，豁免成功则结束其身上的该效应。该词条一经使用，直至次日黎明你都无法再次使用。", aliases: ["Rod of Lordly Might", "王者权杖"], loot_tables: ["武备_传说"]}
- {cn: "复生权杖", en: "Rod of Resurrection", rarity: 传说, kind: 权杖, attunement: "需同调", page: 301, text: "此权杖具有5充能。持握权杖期间，你可以从中施展以下法术之一：医疗术（消耗1充能）或复生术（消耗5充能）。\n权杖在每日黎明时重获1已消耗的充能。当权杖充能耗尽时，投掷1d20。若结果为1，则权杖在一阵无害的光芒中消失。", aliases: ["Rod of Resurrection", "复生权杖"], loot_tables: ["圣物_传说"]}
- {cn: "统御权杖", en: "Rod of Rulership", rarity: 珍稀, kind: 权杖, attunement: "需同调", page: 301, text: "你可以执行魔法动作来展示这根权杖，并向你可见的，周身120尺内你所指定的每个生物下令服从于你。每个目标必须通过一次DC 15的感知豁免，否则陷入魅惑状态8小时。在以这种方式被魅惑期间，生物将视你为值得托付信赖的领袖。如果你或你的盟友伤害了目标，或命令目标去做违反其天性的行为时，以此法造成的魅惑将终止。该词条一经使用，直至次日黎明前你都无法再次使用。", aliases: ["Rod of Rulership", "统御权杖"], loot_tables: ["奥秘_珍稀"]}
- {cn: "庇护权杖", en: "Rod of Security", rarity: 极珍稀, kind: 权杖, attunement: "", page: 301, text: "当持握这根权杖时，你可以执行魔法动作来激活它。权杖会立刻将你和你可见的至多199名自愿生物传送入一个半位面。你选择半位面所呈现的形式。它可以是宁静的花园、热闹的酒馆、宏伟的宫殿、热带岛屿、梦幻般的嘉年华，或者任何你能想象的场景。无论性质如何，这个半位面有足够的食物和水供访客享用，并且半位面的任何环境都无法伤害到其中的居住者们。此处一切可交互的事物都只能存在于该半位面中。例如，把半位面中花园里摘的花带出半位面时，该花将消失。\n在半位面里每度过一个小时，访客们都能如同花费了1个生命值骰一般地恢复生命值。并且尽管半位面中时间将正常流动，但其中的生物不会变老。访客们可以在此停留最多200除以生物数量的天数（向下取整）。\n当停留时间耗尽或你执行魔法动作以结束该效应时，所有访客都会重新出现在权杖激活前的位置或该位置最近的未占据的空间里。该词条被使用后，直至过去10天时间才能再次使用。", aliases: ["Rod of Security", "庇护权杖"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "攀爬绳", en: "Rope of Climbing", rarity: 非普通, kind: 奇物, attunement: "", page: 301, text: "这根60尺长的绳索可承受3000磅的重量。当你持握这根绳索的一端时，你可以使用一个魔法动作命令绳索的另一端活化并向你指定的目的地移动，目的地与你的距离不能超过绳索的长度。在你第一次命令时，绳索末端会在你的回合内移动10尺，并在随后每个你的回合开始时移动 10 尺，直至到达目的地或直至你命令它停止。你也可以命令绳索将自身牢固系绑住一个物件或松绑，将自身打结或解结，或将自身盘卷以便携带。\n如果你命令攀爬绳打结，绳索将每隔1尺打一个大结。打结将使绳索的长度缩短至50尺，但此时为用此绳索攀爬所进行的属性检定具有优势。\n这根绳索具有AC20、HP20以及毒素和心灵伤害免疫。只要绳索还剩至少1生命值，它就能每5分钟恢复1生命值。如果绳索的生命值降至0，则它被摧毁。", aliases: ["Rope of Climbing", "攀爬绳"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "纠缠绳", en: "Rope of Entanglement", rarity: 珍稀, kind: 奇物, attunement: "", page: 301, text: "这根绳索长30尺。当你持握这根绳索的一端时，你可以使用一个魔法动作命令其另一端向前疾冲并缠住位于你20尺内一个你可见的生物。目标必须成功通过一次DC 15的敏捷豁免，豁免失败则其陷入束缚状态。你可以通过松开绳索的一端（使绳索盘绕着掉落在目标的空间）或使用一个附赠动作重复命令（使绳索回到你手中并盘绕起来）来释放目标。\n一个被绳索束缚的目标可以使用一个动作进行一次DC 15的力量（运动）或敏捷（特技）检定。若检定成功，目标不再被绳索束缚。如果目标逃脱时你仍然持握着绳索，则你可以使用一个反应命令绳索回到你手中并盘绕起来；否则，绳索会盘绕着掉落在目标的空间中。\n这根绳索具有AC20、HP20以及毒素和心灵伤害免疫。只要绳索还剩至少1生命值，它就能每5分钟恢复1生命值。如果绳索的生命值降至0，则它被摧毁。", aliases: ["Rope of Entanglement", "纠缠绳"], loot_tables: ["器具_珍稀"]}
- {cn: "修补绳", en: "Rope of Mending", rarity: 普通, kind: 奇物, attunement: "", page: 302, text: "这根50尺长的绳索可以在被切成任意数量的小段后自行修复。以一个魔法动作，你可以让所有相互接触且当前并未以其他方式被使用的绳段重新结合在一起。如果其中一段修补绳丢失或被摧毁，则其长度将永远缩短。", aliases: ["Rope of Mending", "修补绳"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "红宝石", en: "Ruby", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗清澈的亮红至深红色的宝石。", aliases: ["Ruby", "红宝石"], loot_tables: []}
- {cn: "战法红石", en: "Ruby of the War Mage", rarity: 普通, kind: 奇物, attunement: "由施法者", page: 302, text: "这枚直径1寸的红宝石上蚀刻着魔能符文。此红宝石允许你使用一把简易或军用武器作为你施展法术的法器。要使该词条生效，你必须将红宝石按压在该武器上至少10分钟，以此将其附着在武器上。随后，除非你使用一个魔法动作将其取下、武器被摧毁或你与红宝石的同调结束，否则红宝石将无法被移除。", aliases: ["Ruby of the War Mage", "战法红石"], loot_tables: ["奥秘_普通", "圣物_普通"]}
- {cn: "铁骑马鞍", en: "Saddle of the Cavalier", rarity: 非普通, kind: 奇物, attunement: "", page: 302, text: "在你骑乘配有这副鞍座的坐骑，并跨坐于此鞍座上期间，此鞍座会提供以下增益：对坐骑进行的攻击检定具有劣势；你不会在非自愿的情况下解除骑乘。此词条在你处于失能状态期间失效。", aliases: ["Saddle of the Cavalier", "铁骑马鞍"], loot_tables: ["奥秘_非普通", "武备_非普通"]}
- {cn: "缠丝玛瑙", en: "Sardonyx", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗带有红白色条纹的宝石。", aliases: ["Sardonyx", "缠丝玛瑙"], loot_tables: []}
- {cn: "防护圣甲虫", en: "Scarab of Protection", rarity: 传说, kind: 奇物, attunement: "需同调", page: 302, text: "在你携带这枚甲虫形徽章于身上期间，它为你提供三项增益：\n【防御】你的护甲等级获得+1加值。\n【存护】圣甲虫具有12充能，如果你在对抗一道死灵系法术或亡灵造成的有害效应时豁免失败，你能够以反应消耗1充能，令此次豁免改为成功。充能耗尽时，圣甲虫将被摧毁并化为灰烬。\n【法术抗性】你对法术进行的豁免具有优势。", aliases: ["Scarab of Protection", "防护圣甲虫"], loot_tables: ["圣物_传说"]}
- {cn: "急速弯刀", en: "Scimitar of Speed", rarity: 极珍稀, kind: 武器, attunement: "需同调", page: 302, text: "你用此魔法武器发动的攻击检定和伤害掷骰获得+2加值。此外，你在自己的每个回合中可以用一个附赠动作以该弯刀发动一次攻击。", aliases: ["Scimitar of Speed", "急速弯刀"], loot_tables: ["武备_极珍稀"]}
