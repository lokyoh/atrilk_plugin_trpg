- {cn: "力场珠", en: "Bead of Force", rarity: 珍稀, kind: 奇物, attunement: "", page: 234, text: "这个小型黑色球体直径3/4寸，重1/2盎司。被发现时通常都会有1d4 + 4颗珠子放在一起。\n你能够以一个魔法动作把珠子扔出至多60尺远。珠子在落点处引发爆炸并因此被摧毁，其周围半径10尺球状内每个生物必须进行一次DC 15的敏捷豁免，豁免失败者受到5d4点力场伤害。此外，球型的隐形力场将封闭该球状1分钟。任何豁免失败且完全处于范围中的生物会被困在里面。豁免成功或部分处于范围中的生物会沿着远离球型中心的方向被推出范围。攻击或其他效应无法进入球型力场，但供呼吸的空气可以顺利流通。\n被困在内部的生物能够以一个操作动作推动力场障壁，移动至多相当于该生物速度一半的距离。这个球型障壁也可以被拿起。无论内部的生物有多重，力场珠整体的重量都只有1磅。", aliases: ["Bead of Force", "力场珠"], loot_tables: ["奥秘_珍稀"]}
- {cn: "营养珠", en: "Bead of Nourishment", rarity: 普通, kind: 奇物, attunement: "", page: 235, text: "这个没有味道的凝胶珠子在你的舌头上溶解时，它会为你提供等同于一天份口粮的营养。", aliases: ["Bead of Nourishment", "营养珠"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "净水珠", en: "Bead of Refreshment", rarity: 普通, kind: 奇物, attunement: "", page: 235, text: "这个没有味道的凝胶珠子在液体中溶解时，它会把液体转化成一品脱新鲜且冰冷的饮用水。这颗珠子对魔法液体或者毒药之类的有害物质无效。", aliases: ["Bead of Refreshment", "净水珠"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "云巨人之力腰带", en: "Belt of Cloud Giant Strength", rarity: 传说, kind: 奇物, attunement: "需同调", page: 236, text: "穿戴此腰带期间，你的力量值变为27。如果你未着装该腰带的情况下，力量值已经大于或等于腰带赋予的数值，则此物品无效。", aliases: ["巨人之力腰带", "巨人之力腰带（云）", "Belt of Cloud Giant Strength", "云巨人之力腰带"], loot_tables: ["武备_传说"]}
- {cn: "矮人腰带", en: "Belt of Dwarvenkind", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 235, text: "穿戴此腰带期间，你获得以下增益：\n【矮人语】你懂得矮人语。\n【矮人之友】你进行与矮人和灰矮人互动的魅力（游说）检定时具有优势。\n【刚毅】你的体质提升2，至多提升至20。\n此外，与此腰带同调期间，如果你能够长出胡须，则在每天的黎明时分你有50的概率长出一大把胡子；如果你已经长有胡须，则你的胡须会明显变得更厚。\n如果你不是一名矮人或灰矮人，你在着装此腰带期间获得以下额外的增益：\n【黑暗视觉】你拥有 60 尺黑暗视觉。\n【韧性】你具有毒素伤害的抗性。此外，你为避免/结束中毒状态所做的豁免检定具有优势。", aliases: ["Belt of Dwarvenkind", "矮人腰带"], loot_tables: ["器具_珍稀"]}
- {cn: "火巨人力量腰带", en: "Belt of Fire Giant Strength", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 236, text: "穿戴此腰带期间，你的力量值变为25。如果你未着装该腰带的情况下，力量值已经大于或等于腰带赋予的数值，则此物品无效。", aliases: ["巨人之力腰带（火）", "Belt of Fire Giant Strength", "火巨人力量腰带"], loot_tables: ["武备_极珍稀"]}
- {cn: "霜巨人力量腰带", en: "Belt of Frost Giant Strength", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 236, text: "穿戴此腰带期间，你的力量值变为23。如果你未着装该腰带的情况下，力量值已经大于或等于腰带赋予的数值，则此物品无效。", aliases: ["巨人之力腰带（寒霜）", "Belt of Frost Giant Strength", "霜巨人力量腰带"], loot_tables: ["武备_极珍稀"]}
- {cn: "山丘巨人力量腰带", en: "Belt of Hill Giant Strength", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 236, text: "穿戴此腰带期间，你的力量值变为21。如果你未着装该腰带的情况下，力量值已经大于或等于腰带赋予的数值，则此物品无效。", aliases: ["巨人之力腰带（山丘）", "Belt of Hill Giant Strength", "山丘巨人力量腰带"], loot_tables: ["武备_珍稀"]}
- {cn: "石巨人力量腰带", en: "Belt of Stone Giant Strength", rarity: 极珍稀, kind: 奇物, attunement: "需同调", page: 236, text: "穿戴此腰带期间，你的力量值变为23。如果你未着装该腰带的情况下，力量值已经大于或等于腰带赋予的数值，则此物品无效。", aliases: ["巨人之力腰带（岩石）", "Belt of Stone Giant Strength", "石巨人力量腰带"], loot_tables: ["武备_极珍稀"]}
- {cn: "风暴巨人力量腰带", en: "Belt of Storm Giant Strength", rarity: 传说, kind: 奇物, attunement: "需同调", page: 236, text: "穿戴此腰带期间，你的力量值变为29。如果你未着装该腰带的情况下，力量值已经大于或等于腰带赋予的数值，则此物品无效。", aliases: ["巨人之力腰带（风暴）", "Belt of Storm Giant Strength", "风暴巨人力量腰带"], loot_tables: ["武备_传说"]}
