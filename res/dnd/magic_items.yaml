# 《城主指南 (2024)》魔法物品详情（A-Z）
#
# 由 参考/5etools-cn-cn2.0/data/items.json 的 XDMG 条目机械转录（item + itemGroup）。
# 参考 md 的 A-Z 正文全是 5etools 嵌入占位 HTML，没有可读效果文本，故不用 md 作源。
#
# 字段：cn / en / rarity / kind / attunement / page / text / aliases / loot_tables
#   rarity 按 DMG 2024 六档；"未标注" = 5etools 里 rarity:none（多为变体或基础条目）。
#   kind 由 5etools 的 type 代码粗分，未知归「奇物 / 其他」，只用于展示。
#   text 已剥 5etools 标签（{@spell} / {@dc} / {@filter} …），交叉引用
#   {#itemEntry X|XDMG} 换成人话「（规则见「X」条目）」；单条上限 1600 字符，
#   唯一例外是万象无常牌（原文两千多字，截断会丢后半张牌，保留全文）。
#   aliases 含去括号名与「，+N」↔「+N 前缀」互换名，供随机表掷出的名字回查。
#
# ⚠️ 2026-11-10 复核更正：中文包里**有**这些名字，只是分散在别的文件 ——
#    search/index-item.json 收录 1583 个 XDMG 名字（多为基底变体，只有名字/页码）、
#    foundry-items.json 收录 334 个 XDMG 名字（其中 18 个不在 items.json，带结构化
#    机械数据）。本表末尾追加了那 18 条，text 明确标注「由 Foundry 数据推导，非原文」。
# ⚠️ 2026-11-21 掷表名补齐批：给 17 个条目补了掷表用别名（巨人腰带 / 药水括注、
#    神威绑带↔神功绑带、异能塑像括注），并新增 29 条汇总 / 系列条目——
#    「+N 武器·护甲·弹药·盾牌」写通用加值明文，材料条目（秘银 / 精金 / 镀银）
#    按 PHB 材料规则，屠龙者等前缀系列只列形态不记数值，其余列变体并指路。
#    20 张掷表 393 个名字里现只剩 19 个真缺正文（中文包无条目，见
#    docs/trpg-known-gaps.md B1），掷到时 query_data 如实回「详情未收录」。
# ⚠️ 现有 res/dnd/items.yaml 的 28 件战役自建物品保持不动，查询时优先查它。
- {cn: "抗性护甲", en: "Armor of Resistance", rarity: 珍稀, kind: 其他, attunement: "需同调", page: 231, text: "着装此护甲期间，你具有一种特定伤害类型的抗性。具体伤害类型由DM选择，或骰骰子在表格中随机决定。", aliases: ["Armor of Resistance", "抗性护甲"], loot_tables: ["武备_珍稀"]}
- {cn: "飞毯", en: "Carpet of Flying", rarity: 极珍稀, kind: 奇物, attunement: "", page: 242, text: "你可以用一个魔法动作，说出飞毯的命令词来让它起飞或悬停。只要你在飞毯周围30尺内，它就会按照你的指示移动。\n存在四种尺寸的飞行魔毯。DM选择给定魔毯的尺寸，或者通过掷骰子在下表中随机确定。魔毯可以承载表中显示重量的两倍，但如果它承载的重量超过其正常容量，其飞行速度将减半。", aliases: ["Carpet of Flying", "飞毯"], loot_tables: ["奥秘_极珍稀", "器具_极珍稀"]}
- {cn: "维克那法眼和魔掌", en: "Eye and Hand of Vecna", rarity: 神器, kind: 奇物, attunement: "需同调", page: 259, text: "维克那是一名强大的法师。他行使魔法之力征讨，建立了一个恐怖的大帝国。然而，拥有强大力量的维克依然畏惧死亡，他采取手段，通过成为巫妖阻拦死亡的脚步。\n一名名为凯斯的将军发动了叛乱，并在一场骇人的战争中结束了维克那的统治，维克那剩下的只有一只手掌和一只眼睛，这些可怖的神器仍试图在世上贯彻维克纳的意志。\n维克那法眼和维克那魔掌是两个独立的神器，它们可能一起被发现，也可能分别被发现。这只眼睛看起来像是一个从眼眶中撕裂出来的充血的器官。这只手是一个干瘪的左手。\n【法眼与魔掌的随机词条】维克那法眼和维克那魔掌各自拥有以下随机属性 1项神器词条; 次要增益词条词条 1项神器词条; 主要增益词条词条 1项神器词条; 次要减益词条词条\n【同调法眼】要与法眼进行同调，你必须将其压入挖空的眼眶内，法眼会自行嫁接入你的头部并留在其位置直至你死亡。此后法眼一旦被取下，你将立即死亡。\n【法眼词条】与法眼维持同调期间，你的阵营为中立邪恶，且你获得以下增益： 【真实视觉】你具有240尺的真实视觉。 【施法】这只眼睛有8个充能次数，每天黎明时恢复1d4 + 4个已消耗的充能。你可以从眼睛中施放维克那法眼法术表上的法术（豁免难度为DC 18）。该表显示你必须消耗多少充能才能施放该法术。每次你从眼睛中施放法术时，有5的几率维克那会将你的灵魂从身体中撕裂出来，吞噬它，然后像操纵木偶一样控制这个身体。如果发生这种情况，你就会变成由DM控制的NPC。 【X光视野】你能够以魔法动作获得距离30尺的X光视野，持续1分钟。对你而言，此视觉范围内的实体均为透明状态，并且不会阻碍光线通过。此视觉可以穿透1尺厚的石头、1寸厚的普通金属、或是至多3尺厚的木头或泥土。更厚的物件，或是一层铅片，将阻碍这种视觉。\n【同调魔掌】要与魔掌进行同调，你必须将魔掌压在左手断肢的截面。魔掌会自行嫁接入你的手臂并成为一副正常运作的前肢。此后魔掌一旦被取下，你将立即死亡。\n【魔掌词条】与魔掌维持同调期间，你的阵营为中立邪恶，且你获得以下增益： 【超级力量】你的力量变为20，除非其已是20或更高。 【极寒之抚】任意你以魔掌进行的近战法术攻击或你以魔掌持握的武器进行的近战攻击命中时，额外造成2d8寒冷伤害。 【施法】魔掌具有8充能，并在每日黎明时重获1d4 + 4已消耗的充能。你能以魔掌施展维克那魔掌法术表中的法术（豁免DC 18）。表中表明了你施展对应的法术需要消耗多少充能。每当你以魔掌施展法术时，魔掌会对你施展暗示术（豁免DC 18，无需专注）要求你犯下恶行。魔掌可能对恶行有特定的要求，或是由你决定具体的行为。\n【法眼和魔掌词条】当同时与手和眼调谐时，你获得以下额外好处： 【危机感应】你能够进行有优势的先攻掷骰。 【暗蚀抵抗】作为一个魔法动作，你可以瞄准你能看到且在5英尺内的一名生物。目标进行一次DC 18体质豁免掷骰，失败则受到7d6坏死伤害，成功则伤害减半。被此伤害降至0 生命值的生物会转变成绿软泥（见第三章），覆盖其空间内的地面，每5英尺的黏液代表一个单独的斑块。由金属或有机材料制成的非魔法物品，如目标穿戴或携带的，会被黏液摧毁。 【中毒免疫】你具有对免疫 和 中毒 状态的免疫。 【再生】如果你在回合开始时至少有1点生命值，你将恢复1d10点生命值。 【祈愿术】你可以施放祈愿术。一旦使用，这个特性在30天过去之前不能再使用。\n【摧毁法眼和魔掌】如果维克那法眼和维克那魔掌都附着在同一生物上，并且该生物被凯斯之剑杀死，那么眼睛和手都会爆发成火焰，化为灰烬，并被摧毁。任何其他摧毁眼睛或手的尝试似乎都有效，但神器会在维克那众多隐藏的宝库中的一个重新出现，等待被重新发现。", aliases: ["Eye and Hand of Vecna", "维克那法眼和魔掌"], loot_tables: []}
- {cn: "瓦尔哈拉号角", en: "Horn of Valhalla", rarity: 未标注, kind: 奇物, attunement: "", page: 270, text: "你可以用一个魔法动作吹响号角。作为回应，伊斯加德的武者英灵们将在你周围60尺内未占据的空间出现。这些英灵使用狂战士的数据，它们将会在1小时之后或生命值降低到0时返回伊斯加德。英灵们看起来就像是活着的，能够呼吸的战士，且它们免疫魅惑与恐慌状态。号角一经使用，需要经过7天才能再次使用。\n已知存在四种瓦尔哈拉之角，每种由不同的金属制成。角的类型决定了它召唤的灵体数量，以及使用它的要求。DM选择角的类型，或者通过掷骰子在下面的表格上随机确定。如果你吹响号角而没有满足它的要求，召唤出的灵体会攻击你。\n如果你满足要求，他们对你和你的盟友是友好的，并遵循你的命令。", aliases: ["Horn of Valhalla", "瓦尔哈拉号角"], loot_tables: []}
- {cn: "吟游诗人乐器", en: "Instrument of the Bards", rarity: 未标注, kind: 奇物, attunement: "由吟游诗人", page: 272, text: "吟游诗人乐器在各方面都优于普通乐器。吟游诗人乐器共有七种，每种都以一所吟游诗人学院的名字命名。在未与乐器完成同调的情况下，尝试演奏乐器的生物必须进行一次DC 15的感知豁免，豁免失败则会受到2d4心灵伤害。\n你可以演奏这个乐器来施放它的其中一个法术。一旦这个乐器被用来施放法术，直到下一个黎明之前，它不能再被用来施放那个法术。这些法术使用你的法术施放能力和法术豁免DC。\n所有吟游诗人的乐器可以用来施放以下法术：飞行术, 隐形术, 浮空术, 防护善恶", aliases: ["Instrument of the Bards", "吟游诗人乐器"], loot_tables: []}
- {cn: "艾恩石", en: "Ioun Stone", rarity: 未标注, kind: 奇物, attunement: "需同调", page: 273, text: "（规则见「艾恩石」条目）\n石头的类型决定了它的稀有度和效果。", aliases: ["Ioun Stone", "艾恩石"], loot_tables: []}
- {cn: "魔像手册", en: "Manual of Golems", rarity: 极珍稀, kind: 奇物, attunement: "", page: 277, text: "这本魔法书包含了制造特定类型魔像所需的信息和咒语。要解读和使用这本手册，你必须是一个至少拥有两个5环法术位的施法者。一个不能使用魔像手册的生物如果试图阅读它，将会受到6d6点心灵伤害。\n要创造一个魔像，你必须花费表中显示的时间，不间断地工作，手头有手册，并每天休息不超过8小时。你还需要支付指定的费用来购买物资。\n魔像完工后，魔像手册将被魔焰吞噬。当你把手册的灰烬洒在魔像上时，魔像将被活化。它服从你的控制，理解并听从你的命令。", aliases: ["Manual of Golems", "魔像手册"], loot_tables: []}
- {cn: "抗性药水", en: "Potion of Resistance", rarity: 非普通, kind: 药水, attunement: "", page: 289, text: "当你喝下这种药剂时，你在1小时内对一种伤害类型具有抗性。DM选择类型或通过掷以下表格随机确定。", aliases: ["Potion of Resistance", "抗性药水"], loot_tables: ["奥秘_非普通", "圣物_非普通"]}
- {cn: "夸尔羽符", en: "Quaal's Feather Token", rarity: 未标注, kind: 奇物, attunement: "", page: 290, text: "这个物体看起来像一根羽毛。存在不同类型的羽毛代币，每种都有不同的一次性效果。DM选择代币的类型，或者通过掷骰子在Quaal的羽毛代币表上随机确定。代币的类型决定了它的稀有度。", aliases: ["Quaal's Feather Token", "夸尔羽符"], loot_tables: []}
- {cn: "抗性戒指", en: "Ring of Resistance", rarity: 珍稀, kind: 戒指, attunement: "", page: 294, text: "当你佩戴这枚戒指时，你对该伤害类型具有抗性。戒指中的宝石指示了该类型，由DM选择或通过掷骰子在下面的表格中随机确定。", aliases: ["Ring of Resistance", "抗性戒指"], loot_tables: ["圣物_珍稀"]}
- {cn: "守护卷轴", en: "Scroll of Protection", rarity: 珍稀, kind: 卷轴, attunement: "", page: 302, text: "每个防护卷轴针对特定类型的生物起作用，由DM选择或通过掷骰子在下表中决定。\n使用一个魔法动作阅读卷轴，会创造出一个以你为中心的5英尺范围辐射区域。在5分钟内，指定类型的生物无法进入该区域或影响区域内的任何事物。然而，如果你移动的方式导致指定类型的生物进入该区域，效果将立即结束。\n作为一个魔法动作，位于散发5英尺范围内的生物可以尝试克服它，这迫使该生物进行一个DC 15魅力豁免检定。如果检定成功，该生物将不再受到散发的影响。", aliases: ["Scroll of Protection", "守护卷轴"], loot_tables: ["奥秘_珍稀", "圣物_珍稀"]}
- {cn: "召唤泰坦卷轴", en: "Scroll of Titan Summoning", rarity: 传说, kind: 卷轴, attunement: "", page: 303, text: "当你采取一个魔法动作来阅读这个卷轴时，卷轴中提到的一个特定的泰坦会出现在你能看到的1英里范围内的未被占据的空间或水域中。DM选择一个合适的泰坦，或者通过在下面的表格上掷骰子来随机确定。\n泰坦对所有其他生物都表现出敌对态度，并在降至0生命值时消失。如果泰坦被召唤到一个空间不足以容纳它的地方，召唤失败，卷轴被浪费。", aliases: ["Scroll of Titan Summoning", "召唤泰坦卷轴"], loot_tables: ["奥秘_传说", "圣物_传说"]}
- {cn: "+1 契约掌控者权杖", en: "+1 Rod of the Pact Keeper", rarity: 非普通, kind: 权杖, attunement: "由魔契师", page: 301, text: "当持握这根权杖时，你的魔契师法术的法术攻击检定和豁免DC获得 +1 加值。\n此外，持握这根权杖期间，你能够以一个魔法动作恢复一个法术位。该词条一经使用，你在完成一次长休后都无法再次使用。", aliases: ["+1 Rod of the Pact Keeper", "+1 契约掌控者权杖", "契约掌控者权杖", "契约掌控者权杖，+1"], loot_tables: []}
- {cn: "+1 战法师魔杖", en: "+1 Wand of the War Mage", rarity: 非普通, kind: 魔杖, attunement: "由施法者", page: 322, text: "持握这根魔杖时，你的法术攻击检定获得 +1 加值。此外，你在进行法术攻击检定时无视半身掩护。", aliases: ["+1 Wand of the War Mage", "+1 战法师魔杖", "战法师魔杖", "战法师魔杖，+1"], loot_tables: ["奥秘_非普通", "圣物_非普通"]}
