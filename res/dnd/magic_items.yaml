- {cn: "造风之扇", en: "Wind Fan", rarity: 非普通, kind: 奇物, attunement: "", page: 325, text: "持握这把扇子时，你可以用它施展造风术（豁免DC 13）。在次日黎明之前，随后每再次使用这把扇子都会累积20的几率失效；如果扇子失效，则其会被撕裂成无用的非魔法碎纸。", aliases: ["Wind Fan", "造风之扇"], loot_tables: ["奥秘_非普通"]}
- {cn: "飞翼之靴", en: "Winged Boots", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 325, text: "这双靴子具有4充能，并在每日黎明时恢复1d4已消耗的充能。着装这双靴子期间，你能够以一个魔法动作消耗1充能，获得30尺飞行速度，持续1小时。如果持续时间结束时你正飞行，则你将以每轮30尺的速度下降直至着陆。", aliases: ["Winged Boots", "飞翼之靴"], loot_tables: ["奥秘_非普通"]}
- {cn: "飞翼斗篷", en: "Wings of Flying", rarity: 珍稀, kind: 奇物, attunement: "需同调", page: 324, text: "着装这件斗篷期间，你能够以一个魔法动作将斗篷转变为你背上的一对翅膀。这对翅膀会持续1小时，或直至你使用一个魔法动作提前结束效应。这对翅膀会赋予你60尺飞行速度。如果翅膀消失时你仍在空中则你会坠落。翅膀消失后，你在1d12小时内无法再次使用它们。", aliases: ["Wings of Flying", "飞翼斗篷"], loot_tables: ["奥秘_珍稀"]}
- {cn: "飞龙毒液", en: "Wyvern Poison", rarity: 未标注, kind: 奇物, attunement: "", page: 91, text: "受这种毒药影响的生物需要进行一次DC 14的体质豁免，豁免失败则受到24（7d6）毒素伤害，豁免成功则伤害减半。", aliases: ["Wyvern Poison", "飞龙毒液"], loot_tables: []}
