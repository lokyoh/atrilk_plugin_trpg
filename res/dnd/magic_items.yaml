- {cn: "法术卷轴（六环）", en: "Spell Scroll (Level 6)", rarity: 极珍稀, kind: 卷轴, attunement: "", page: 305, text: "每张法术卷轴都以神秘暗语记录了一道法术。如果这道法术在你的法术列表中，则你可以阅读该卷轴并施展其法术且无需任何材料成分；否则，你将无法理解该卷轴。通过阅读卷轴施展的法术同样需要遵循相应法术的正常施法时间。法术一经施展，卷轴本身就会化作尘土。如果施法被打断，则卷轴不会消失。\n如果这道法术在你的法术列表中，但其环阶高于你当前能施展的水平，则你必须使用你的施法属性进行一次DC 16的属性检定，以决定是否可以施展这道法术。如果检定失败，则卷轴上记载的法术会消失，并且不会产生任何效果。\n如果法术需要进行豁免投掷或攻击检定，法术豁免DC为17，攻击加值为+9。\n【将卷轴抄录入法术书】法师法术卷轴上的法术可以抄录到法术书中。当一个6环法术被以这种方式抄录时，抄录者必须成功通过一次DC 16智力（奥秘）检定。如果检定成功，法术被抄录。无论检定成功还是失败，法术卷轴都会被销毁。", aliases: ["Spell Scroll (Level 6)", "法术卷轴", "法术卷轴（六环）"], loot_tables: ["奥秘_极珍稀", "圣物_极珍稀"]}
- {cn: "法术卷轴（七环）", en: "Spell Scroll (Level 7)", rarity: 极珍稀, kind: 卷轴, attunement: "", page: 305, text: "每张法术卷轴都以神秘暗语记录了一道法术。如果这道法术在你的法术列表中，则你可以阅读该卷轴并施展其法术且无需任何材料成分；否则，你将无法理解该卷轴。通过阅读卷轴施展的法术同样需要遵循相应法术的正常施法时间。法术一经施展，卷轴本身就会化作尘土。如果施法被打断，则卷轴不会消失。\n如果这道法术在你的法术列表中，但其环阶高于你当前能施展的水平，则你必须使用你的施法属性进行一次DC 17的属性检定，以决定是否可以施展这道法术。如果检定失败，则卷轴上记载的法术会消失，并且不会产生任何效果。\n如果法术需要进行豁免投掷或攻击检定，法术豁免DC为18，攻击加值为+10。\n【将卷轴抄录入法术书】法术卷轴上的巫师法术可以被抄写到法术书中。当一个7环法术以这种方式被抄写时，抄写者必须通过一次 DC 17 智力（奥秘）检定。若检定成功，法术将被抄写。无论检定是否成功，法术卷轴都会被销毁。", aliases: ["Spell Scroll (Level 7)", "法术卷轴", "法术卷轴（七环）"], loot_tables: ["奥秘_极珍稀", "圣物_极珍稀"]}
- {cn: "法术卷轴（八环）", en: "Spell Scroll (Level 8)", rarity: 极珍稀, kind: 卷轴, attunement: "", page: 305, text: "每张法术卷轴都以神秘暗语记录了一道法术。如果这道法术在你的法术列表中，则你可以阅读该卷轴并施展其法术且无需任何材料成分；否则，你将无法理解该卷轴。通过阅读卷轴施展的法术同样需要遵循相应法术的正常施法时间。法术一经施展，卷轴本身就会化作尘土。如果施法被打断，则卷轴不会消失。\n如果这道法术在你的法术列表中，但其环阶高于你当前能施展的水平，则你必须使用你的施法属性进行一次DC 18的属性检定，以决定是否可以施展这道法术。如果检定失败，则卷轴上记载的法术会消失，并且不会产生任何效果。\n如果法术需要进行豁免投掷或攻击检定，法术豁免DC为18，攻击加值为+10。\n【将卷轴抄录入法术书】法术卷轴上的法师法术可以抄录到法术书中。当一个8环法术以这种方式被抄录时，抄录者必须通过一次DC 18智力（奥秘）检定。检定成功时，法术被抄录。无论检定是否成功，该法术卷轴都会被销毁。", aliases: ["Spell Scroll (Level 8)", "法术卷轴", "法术卷轴（八环）"], loot_tables: ["奥秘_极珍稀", "圣物_极珍稀"]}
- {cn: "法术卷轴（九环）", en: "Spell Scroll (Level 9)", rarity: 传说, kind: 卷轴, attunement: "", page: 305, text: "每张法术卷轴都以神秘暗语记录了一道法术。如果这道法术在你的法术列表中，则你可以阅读该卷轴并施展其法术且无需任何材料成分；否则，你将无法理解该卷轴。通过阅读卷轴施展的法术同样需要遵循相应法术的正常施法时间。法术一经施展，卷轴本身就会化作尘土。如果施法被打断，则卷轴不会消失。\n如果这道法术在你的法术列表中，但其环阶高于你当前能施展的水平，则你必须使用你的施法属性进行一次DC 19的属性检定，以决定是否可以施展这道法术。如果检定失败，则卷轴上记载的法术会消失，并且不会产生任何效果。\n如果法术需要进行豁免检定或攻击检定，法术豁免DC为19，攻击加值为+11。\n【将卷轴抄录入法术书】法术卷轴上的法师法术可以被抄录到法术书中。当一个9环法术以这种方式被抄录时，抄录者必须成功通过一个DC 19智力（奥秘）检定。如果检定成功，法术被抄录。无论检定成功与否，法术卷轴都会被销毁。", aliases: ["Spell Scroll (Level 9)", "法术卷轴", "法术卷轴（九环）"], loot_tables: ["奥秘_传说", "圣物_传说"]}
- {cn: "抗法盾", en: "Spellguard Shield", rarity: 极珍稀, kind: 盾牌, attunement: "需同调", page: 305, text: "在你持握着这面盾牌期间，你为抵抗法术和其他魔法效应所进行的豁免具有优势，且对你发动的法术攻击检定具有劣势。", aliases: ["Spellguard Shield", "抗法盾"], loot_tables: ["武备_极珍稀"]}
- {cn: "湮灭法球", en: "Sphere of Annihilation", rarity: 传说, kind: 奇物, attunement: "", page: 306, text: "这个直径2尺的黑色球体是多元宇宙中的一个空洞，它悬浮在空间中，由一个围绕在它周围的魔法场维持稳定。\n湮灭法球会毁灭任何穿过它或被它穿过的事物，只有神器例外：除非某件神器的弱点正是湮灭法球，否则神器均可以不受影响地穿过法球。任何触碰到法球但未被完全吞没或毁灭的东西将受到8d10力场伤害。\n【控制法球】湮灭法球总是保持静止，除非受到人控制。如果你位于法球60尺内，你能够以一个魔法动作进行一次DC 25的智力（奥秘）检定。成功则你控制法球直至你的下个回合开始，若法球已处于一名其他生物的控制之下，则该生物失去控制权。失败则法球向你直线移动10尺。 控制法球期间，你能够以一个附赠动作令法球向一个你选择的方向移动一定尺数，具体尺数等于5×你的智力调整值（至少5尺）。法球进入一名生物的占据空间时，该生物必须成功通过一次DC 19的敏捷豁免，否则将触碰到法球，受到8d10力场伤害。因受此伤害而生命值降至0的生物将被毁灭，它携带的财物将留在原地，尸体则灰飞烟灭。\n【法球碰撞】如果湮灭法球与位面传送门（如异界之门制造的传送门）或是异位面空间（如次元洞内部）接触，则由DM根据下表随机决定发生的事件：", aliases: ["Sphere of Annihilation", "湮灭法球"], loot_tables: ["奥秘_传说", "器具_传说"]}
- {cn: "尖晶石", en: "Spinel", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗红色、红棕或深绿色的宝石。", aliases: ["Spinel", "尖晶石"], loot_tables: []}
- {cn: "通灵板", en: "Spirit Board", rarity: 极珍稀, kind: 奇物, attunement: "", page: 306, text: "这块华丽木板的一面印有通用语字母表的字符，旁边还有\"是\"和\"否\"的字样，以及代表\"吉\"和\"凶\"的符号。通灵板配有一块心型的木制占卜板。这块占卜板必须放置在通灵板有字母的一面，才能让通灵板的魔法发挥作用。\n通灵板具有3充能，并在每日黎明时重获1已消耗的充能。施展法术时，你可以召唤死者灵魂引导占卜板在木板表面滑动，并通过指向木板上的字母或单词来回答你的问题。触摸占卜板期间，你可以花费1分钟施展一个法术，能施展的法术与所需充能如下表所示。", aliases: ["Spirit Board", "通灵板"], loot_tables: ["圣物_极珍稀"]}
- {cn: "饰品法杖", en: "Staff of Adornment", rarity: 普通, kind: 武器, attunement: "", page: 306, text: "持握这根法杖期间，如果你将一个重量不超过1磅的微型物件（例如一块水晶碎片、一颗鸡蛋、一块石子）放于法杖的尖端，这个物件将会在尖端旁1寸的位置漂浮着，直到该物件被移除或法杖不在你手里。这根法杖同一时间至多可以让三个这样的物件在尖端漂浮。持握此法杖期间，你可以让这些物件中的一个或多个缓慢地绕着法杖旋转或原地自转。", aliases: ["Staff of Adornment", "饰品法杖"], loot_tables: ["奥秘_普通", "圣物_普通"]}
- {cn: "鸟鸣法杖", en: "Staff of Birdcalls", rarity: 普通, kind: 武器, attunement: "", page: 307, text: "这根木制法杖上装饰着鸟形雕像。它具有10充能。持握此法杖期间，你可以执行魔法动作来消耗1充能，使其创造出周围120尺范围内都能听到的以下声音之一：麻雀啾啾、乌鸦哇哇、鸭子嘎嘎、小鸡咯咯、大鹅呱呱、潜鸟呜呜、火鸡咕咕、海鸥嗷嗷、夜枭嘤嘤或老鹰呖呖。\n【重获充能】这根法杖在每日黎明时重获1d6 + 4已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，法杖将在一阵无害的鸟羽之云中爆炸并且永久消失。", aliases: ["Staff of Birdcalls", "鸟鸣法杖"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "魅惑法杖", en: "Staff of Charming", rarity: 珍稀, kind: 武器, attunement: "由吟游诗人、牧师、德鲁伊、术士、魔契师或法师", page: 307, text: "这根法杖具有10充能。持握这根法杖期间，你可以使用以下词条：\n【施法】你可以消耗1充能，从法杖中施展魅惑类人、命令术、或通晓语言 ，该法术使用你自己的法术豁免DC。\n【惑控反射】如果一道惑控学派法术仅以你为目标，而你豁免成功时，你可以执行反应并消耗1充能，将法术反射给原施法者，如同你施展了这道法术一般。\n【惑控抵抗】如果一道惑控学派法术仅以你为目标，而你豁免失败时，你可以将失败的豁免改为成功。法杖的这项词条一经使用，其直至次日黎明前都无法再次使用。\n【重获充能】这根法杖在每日黎明时重获1d8 + 2已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，法杖将崩解为尘土，并被摧毁。", aliases: ["Staff of Charming", "魅惑法杖"], loot_tables: ["奥秘_珍稀", "圣物_珍稀"]}
- {cn: "火焰法杖", en: "Staff of Fire", rarity: 极珍稀, kind: 武器, attunement: "由德鲁伊、术士、魔契师或法师", page: 307, text: "持握这根法杖期间，你获得火焰伤害的抗性。\n【法术】这根法杖具有10充能。持握此法杖期间，你可以从法杖中施展以下表格中的一道法术，使用你自己的法术豁免DC。施展相应法术所需消耗的充能数如下表所示。\n【重获充能】这根法杖在每日黎明时重获1d6 + 4已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，法杖将崩解为煤渣并被摧毁。", aliases: ["Staff of Fire", "火焰法杖"], loot_tables: ["奥秘_极珍稀", "圣物_极珍稀"]}
- {cn: "鲜花法杖", en: "Staff of Flowers", rarity: 普通, kind: 武器, attunement: "", page: 308, text: "这根木制法杖具有10充能。持握此法杖期间，你可以执行魔法动作并消耗1充能，使你周身5尺内的一小块地面、土壤或从法杖里绽放出一朵鲜花。如果你未指定花朵的品种，法杖则会创造出带有清香的雏菊。花朵是无害且非魔法性的，并且会如常生长或枯萎。\n【重获充能】这根法杖在每日黎明时重获1d6 + 4已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，法杖将化为花瓣并且永久消失。", aliases: ["Staff of Flowers", "鲜花法杖"], loot_tables: ["奥秘_普通", "圣物_普通"]}
- {cn: "冰霜法杖", en: "Staff of Frost", rarity: 极珍稀, kind: 武器, attunement: "由德鲁伊、术士、魔契师或法师", page: 308, text: "持握这根法杖期间，你获得寒冷伤害的抗性。\n【法术】这根法杖具有10充能。持握此法杖期间，你可以从法杖中施展以下表格中的一道法术，使用你自己的法术豁免DC。施展相应法术所需消耗的充能数如下表所示。\n【重获充能】这根法杖在每日黎明时重获1d6 + 4已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，法杖将融化为水并被摧毁。", aliases: ["Staff of Frost", "冰霜法杖"], loot_tables: ["奥秘_极珍稀", "圣物_极珍稀"]}
- {cn: "治愈法杖", en: "Staff of Healing", rarity: 珍稀, kind: 武器, attunement: "由吟游诗人、牧师或德鲁伊", page: 308, text: "这根法杖具有10充能。持握这根法杖期间，你可以从法杖中施展以下表格中的一道法术，使用你自己的施法属性调整值。施展相应法术所需消耗的充能数如下表所示。\n【重获充能】这根法杖在每日黎明时恢复1d6 + 4发已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，法杖将在一阵亮光或闪烁中永久消失。", aliases: ["Staff of Healing", "治愈法杖"], loot_tables: ["器具_珍稀", "圣物_珍稀"]}
- {cn: "威力法杖", en: "Staff of Power", rarity: 极珍稀, kind: 武器, attunement: "由术士、魔契师或法师", page: 308, text: "这根法杖具有20充能并可被用作一根魔法长棍（用这根长棍发动的攻击检定和伤害掷骰获得+2加值）。持握此法杖期间，你在护甲等级、豁免和法术攻击检定上获得+2加值。\n【法术】持握此法杖期间，你可以从法杖中施展以下表格中的一道法术，使用你自己的法术豁免DC。施展相应法术所需消耗的充能数如下表所示。\n【重获充能】这根法杖在每日黎明时重获2d8 + 4已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，法杖将失去除了攻击检定与伤害掷骰获得+2加值以外的其他所有词条。如果骰值为20，法杖恢复1d8 + 2充能。\n【复仇打击】你可以执行魔法动作，在自己的膝盖或坚硬的表面上将法杖折断。法杖将被摧毁，释放出所有魔力，并在以其为源点的30尺光环范围内发出爆炸。你有50的概率被传送到某个随机的存在位面以避开爆炸。如果你没能避开爆炸效应，你将受到16×法杖剩余充能数点力场伤害。区域中的所有其他生物必须进行一次DC 17的敏捷豁免。豁免失败则其受到4×法杖剩余充能数点力场伤害，豁免成功则伤害减半。", aliases: ["Staff of Power", "威力法杖"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "强袭法杖", en: "Staff of Striking", rarity: 极珍稀, kind: 武器, attunement: "需同调", page: 309, text: "这根法杖可被用作一根魔法长棍（用这根长棍发动的攻击检定和伤害掷骰获得+3加值）。\n这根法杖具有10充能。当你用其发动近战攻击并命中时，你可以消耗至多3充能。每消耗1充能都将额外造成1d6力场伤害。\n【重获充能】这根法杖在每日黎明时重获1d6 + 4已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，法杖将变为一根非魔法性的长棍。", aliases: ["Staff of Striking", "强袭法杖"], loot_tables: ["圣物_极珍稀"]}
- {cn: "虫群法杖", en: "Staff of Swarming Insects", rarity: 珍稀, kind: 武器, attunement: "由吟游诗人、牧师、德鲁伊、术士、魔契师或法师", page: 309, text: "这根法杖具有10充能。\n【虫云】当你持握此法杖时，你可以执行一个魔法动作并消耗1发充能，以召唤一团无害飞虫群，充满一个以你为源点的30尺光环。虫群持续10分钟，使该区域对你以外的生物处于重度遮蔽状态。一阵强风（例如由造风术创造的）可以驱散虫群并结束该效应。\n【法术】持握这根法杖期间，你可以从法杖中施展以下表格中的一道法术，使用你自己的法术豁免DC。施展相应法术所需消耗的充能数如下表所示。\n【重获充能】这根法杖在每日黎明时恢复1d6 + 4发已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，虫群将蚕食法杖，并在将其摧毁后消散。", aliases: ["Staff of Swarming Insects", "虫群法杖"], loot_tables: ["奥秘_珍稀", "圣物_珍稀"]}
- {cn: "蝰蛇法杖", en: "Staff of the Adder", rarity: 非普通, kind: 武器, attunement: "需同调", page: 309, text: "以一个附赠动作，你可以将法杖的头部变为一条会动的毒蛇，持续一分钟，或直至你执行附赠动作将法杖还原为非活化形态。\n当你执行攻击动作时，你可以使用触及5尺的活化蛇头来发动其中一次攻击检定。这次攻击检定使用你的熟练加值与感知调整值。命中时，目标将受到1d6穿刺伤害与3d6毒素伤害。\n蛇头在活化期间可以被攻击。它具有AC15，HP20，免疫毒素与心灵伤害。蛇头的生命值降为0时法杖将被摧毁。只要法杖未被摧毁，它就会在还原为非活化形态时恢复所有失去的生命值。", aliases: ["Staff of the Adder", "蝰蛇法杖"], loot_tables: ["奥秘_非普通", "圣物_非普通"]}
- {cn: "贤者法杖", en: "Staff of the Magi", rarity: 传说, kind: 武器, attunement: "由术士、魔契师或法师", page: 310, text: "这根法杖具有50充能，可以被用作一把魔法长棍（用这根长棍发动的攻击检定和伤害掷骰获得+2加值）。持握此法杖期间，你进行的法术攻击检定获得+2加值。\n【法术吸收】当你持握此法杖时，你在对抗法术的豁免检定上具有优势。此外，当另一个生物施放一个仅以你为目标的法术时，你可以使用一个反应。如果你这样做，法杖会吸收该法术的魔法，取消其效应，并获得等同于被吸收法术环数的充能。然而，如果这样做导致法杖的总充能数超过50，法杖会爆炸，如同你激活了它的复仇打击（见下文）。\n【法术】持握此法杖期间，你可以从法杖中施展以下表格中的一道法术，使用你自己的法术豁免DC。施展相应法术所需消耗的充能数如下表所示。\n【重获充能】这根法杖在每日黎明时重获4d6 + 2已消耗的充能。当法杖充能耗尽时，投掷1d20，若结果为20，则此法杖重获1d12 + 1已消耗的充能。\n【复仇打击】你能够以一个魔法动作在自己的膝盖或坚固的表面上折断这把法杖。法杖被摧毁并释放魔力产生一场爆炸，充斥以此法杖为源点的30尺光环区域。你有50的概率立刻被传送到某个随机的存在位面以避开爆炸。如果你未能避开效应，你将受到等于16×法杖充能的力场伤害。区域内的每个其他生物必须进行一次DC 17的敏捷豁免。失败则受到等于6×法杖充能的力场伤害。成功则伤害减半。", aliases: ["Staff of the Magi", "贤者法杖"], loot_tables: ["奥秘_传说"]}
- {cn: "巨蟒法杖", en: "Staff of the Python", rarity: 非普通, kind: 武器, attunement: "需同调", page: 311, text: "以一个魔法动作，你可以将法杖扔到你周边10尺内一处未占据空间的地面上，并让其变为一条巨蟒蛇 。这条蛇将受你所控，其先攻值与你相同，并在你的回合结束后立即进行其回合。\n在你的回合内，只要蛇在你身边60尺范围内且你未陷入失能状态，你便可以用精神给他下达命令（无需动作）。你将决定巨蟒在这一轮中执行什么动作以及如何移动，或者你可以下达一个宽泛的指令，例如攻击你的敌人或保护某个地点。如果你没有下达命令，蛇将保护自己。\n以一个附赠动作，你可以命令蛇在当前的空间还原回法杖形态，之后你无法在1小时内再次使用法杖的词条。如果蛇的生命值被降为0，它将死亡并还原回法杖形态，随后法杖破碎并被摧毁。如果蛇在失去全部生命值之前还原回法杖形态，它会恢复所有失去的生命值。", aliases: ["Staff of the Python", "巨蟒法杖"], loot_tables: ["奥秘_非普通", "圣物_非普通"]}
- {cn: "丛林法杖", en: "Staff of the Woodlands", rarity: 珍稀, kind: 武器, attunement: "由德鲁伊", page: 311, text: "这根法杖具有6充能并可被用作一根魔法长棍（用这根长棍发动的攻击检定和伤害掷骰获得+2加值）。持握此法杖期间，你在法术攻击检定上获得+2加值。\n【法术】持握此法杖期间，你可以从法杖中施展以下表格中的一道法术，使用你自己的法术豁免DC。施展相应法术所需消耗的充能数如下表所示。\n【树木型态】你可以执行魔法动作来将法杖的一端插入一处未占据空间的土地上，并消耗1充能将其转变为一颗健壮的树。这棵树高60尺，树干直径5尺，顶端的树冠以20尺半径向外延伸。这棵树外观与普通的树无异，但侦测魔法能辨别出树上散发出的微弱变化系魔法灵光。你可以在触碰这棵树时执行魔法动作 将其变回原本的法杖形态。当树还原回法杖时，任何在树上的生物都会掉下来。\n【重获充能】这根法杖在每日黎明时重获1d6已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，法杖失去其所有词条并将变为一根非魔法性的长棍。", aliases: ["Staff of the Woodlands", "丛林法杖"], loot_tables: ["圣物_珍稀"]}
- {cn: "雷霆法杖", en: "Staff of Thunder and Lightning", rarity: 极珍稀, kind: 武器, attunement: "需同调", page: 311, text: "这根法杖可被用作一根魔法长棍（用这根长棍发动的攻击检定和伤害掷骰获得+2加值）。它具有以下额外词条。其中的某项词条一经使用，直至次日黎明前你都无法再次使用。\n【电闪】当你用法杖发动近战攻击并命中时，你可以对目标造成额外2d6点闪电伤害（无需动作）。\n【雷鸣】当你用法杖发动近战攻击并命中时，你可以让法杖爆发出距你300尺内都能听见的雷霆巨响（无需动作）。被你击中的目标必须通过一次DC 17的体质豁免，否则陷入震慑状态，持续至你的下个回合结束。\n【雷霆】当你用法杖发动近战攻击并命中时，你可以立刻执行附赠动作来同时使用电闪和雷鸣词条（见上文）。这样做只会消耗雷霆词条的使用次数，而不会消耗电闪或雷鸣的使用次数。\n【闪电打击】你可以执行魔法动作，让法杖从尖端射出一道覆盖宽5尺，长120尺线状区域的线状闪电束。所有在该线状区域内的生物都需要进行DC 17的敏捷豁免，豁免失败则其受到9d6闪电伤害，豁免成功则伤害减半。\n【惊雷】你可以执行魔法动作，让法杖制造一记在你600尺内都能听见的惊雷声响。以你为源点60尺光环区域内的所有生物都需要进行DC 17的体质豁免。豁免失败则其受到2d6雷鸣伤害并陷入耳聋状态，持续1分钟；豁免成功则仅受半伤。", aliases: ["Staff of Thunder and Lightning", "雷霆法杖"], loot_tables: ["奥秘_极珍稀", "圣物_极珍稀"]}
- {cn: "凋零法杖", en: "Staff of Withering", rarity: 珍稀, kind: 武器, attunement: "由牧师、德鲁伊或魔契师", page: 312, text: "该法杖有3发充能，且每天黎明时恢复1d3发已消耗的充能。\n这把法杖可作为一把魔法长棍使用。命中时，它造成与普通长棍相同的伤害，并且你可以消耗1发充能以对目标额外造成2d10点暗蚀伤害，并迫使其进行一次DC 15的体质豁免检定。豁免失败时，目标在1小时内，任何使用力量或体质的属性检定或豁免检定具有劣势。", aliases: ["Staff of Withering", "凋零法杖"], loot_tables: ["奥秘_珍稀", "圣物_珍稀"]}
- {cn: "星光玫瑰石英", en: "Star rose quartz", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗中心为白色星形的玫瑰色宝石。", aliases: ["Star rose quartz", "星光玫瑰石英"], loot_tables: []}
- {cn: "星彩红宝石", en: "Star Ruby", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗中心为白色星形的红宝石。", aliases: ["Star Ruby", "星彩红宝石"], loot_tables: []}
- {cn: "星光蓝色蓝宝石", en: "Star Sapphire", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗中心为白色星形的蓝色蓝宝石。", aliases: ["Star Sapphire", "星光蓝色蓝宝石"], loot_tables: []}
- {cn: "命令土元素石核", en: "Stone of Controlling Earth Elementals", rarity: 珍稀, kind: 奇物, attunement: "", page: 312, text: "在你用这块5磅重的石核接触地面期间，你能够以一个魔法动作召唤一只土元素。土元素会出现在你30尺内一处由你选择的未占据空间、理解你所说的语言、服从你的命令、使用你的先攻值并在你之后立即执行其回合。土元素会在1小时后、它死亡时、或你用一个附赠动作将其解消时消失。直到次日黎明前，石核都无法再以该方式进行使用。", aliases: ["Stone of Controlling Earth Elementals", "命令土元素石核"], loot_tables: ["奥秘_珍稀", "圣物_珍稀"]}
- {cn: "吉运之石", en: "Stone of Good Luck", rarity: 非普通, kind: 奇物, attunement: "需同调", page: 312, text: "吉运之石是一块光亮的玛瑙，携带它于身上期间，你在属性检定和豁免检定上获得+1加值。", aliases: ["Stone of Good Luck", "吉运之石"], loot_tables: ["器具_非普通"]}
- {cn: "阳炎剑", en: "Sun Blade", rarity: 珍稀, kind: 武器, attunement: "需同调", page: 312, text: "这件物品看起来像是一把剑柄。\n【耀光剑刃】持握剑柄时，你可以用一个附赠动作将这把剑纯粹由光芒构成的剑刃展开或是解除。展开剑刃的阳炎剑视为一把具有灵巧词条的魔法长剑。如果你拥有长剑或短剑的熟练，则你也拥有对阳炎剑的熟练。 你用该武器发动的攻击检定和伤害掷骰获得+2加值，但它造成光耀伤害而非挥砍伤害。被这把剑命中的亡灵将额外受到1d8点光耀伤害。\n【耀阳】阳炎剑闪耀的剑刃会散发出15尺的明亮光照和额外15尺微光光照。这一光照视为日光。剑刃展开期间，你能够以一个魔法动作使明亮光照与微光光照半径各扩大或缩小5尺。光照范围上限为明亮和微光区域各30尺，下限为各10尺。", aliases: ["Sun Blade", "阳炎剑"], loot_tables: ["武备_珍稀"]}
- {cn: "应答之剑", en: "Sword of Answering", rarity: 传说, kind: 武器, attunement: "需同调", page: 313, text: "你用此剑进行的攻击检定和伤害掷骰获得+3加值。此外，持握此剑时，你能够以反应用此武器对你触及内任何对你造成了伤害的生物发动一次近战攻击。你进行此次攻击检定具有优势，且这次特殊攻击造成的伤害忽略目标对本次伤害的任何免疫或抗性。", aliases: ["Sword of Answering", "应答之剑"], loot_tables: ["武备_传说"]}
- {cn: "凯斯之剑", en: "Sword of Kas", rarity: 神器, kind: 武器, attunement: "需同调", page: 313, text: "凯斯是一位侍奉维克那的强大战士，他的忠诚赢得了这把宝剑作为奖赏。随着凯斯力量日渐增长，他的野心也随之膨胀。凯斯的佩剑力劝他推翻维克那，并篡夺维克那的王位。传说维克那殒落自凯斯之手，但反叛的副官也遭到厄运，最后只有凯斯的佩剑流传于世。\n【嗜血】这柄剑渴求鲜血。若此剑在出鞘后的1分钟内其锋刃没有尝到鲜血，其持用者进行一次DC 15的魅力豁免，豁免成功则持用者受到3d6心灵伤害。失败则持用者将被剑控制，如同被法术支配怪物操控。剑渴求鲜血，当剑的需求满足时，法术效应结束。\n【魔化武器】你用此剑进行的攻击检定和伤害掷骰获得+3加值，你用此剑进行的攻击检定在d20中掷出19或20时造成重击，此剑对亡灵额外造成2d10挥砍伤害。\n【随机词条】凯斯之剑具有下列随机词条： 1项神器词条; 次要增益词条词条 1项神器词条; 主要增益词条词条 1项神器词条; 次要减益词条词条 1项神器词条; 主要减益词条词条\n【法术】只要此剑在你身上，你就可以从中施展以下法术（豁免DC 18）： 召雷术 圣言术 死亡一指 一旦你使用此剑施展法术，直至次日黎明你都无法再次以此剑施展那个法术。\n【凯斯之灵】只要此剑在你身上，你就获得以下增益： 【战斗饥渴】你将1d10加入你的先攻检定。 【防御之刃】当你执行动作以此剑发动攻击时，你可以选择将此剑的攻击加值全部或部分转移到你的护甲等级中。加值修改持续至你的下个回合开始。 【暗蚀抗性】你获得对暗蚀伤害的抗性。\n【智能】凯斯之剑是一柄混乱邪恶的智能武器，智力为15，感知13，魅力16。它具有120尺听觉及120尺黑暗视觉。 凯斯之剑说通用语并可以通过心灵感应与持用者交流。\n【个性】这柄剑的目标是毁灭维克纳。杀死维克纳的信徒、摧毁巫妖的作品、挫败他的阴谋都有助于实现该目标。 凯斯之剑还试图摧毁任何被维克那法眼和魔掌腐化之人。\n【摧毁此剑】一名同时与维克那法眼和维克那魔掌维持同调的生物，可以使用其祈愿词条摧毁凯斯之剑，此时凯斯之剑需位于施法者30尺内。施展此次祈愿术时，该生物需要进行一次DC 18的魅力豁免，失败则无事发生，祈愿术被浪费；成功则凯斯之剑被摧毁。", aliases: ["Sword of Kas", "凯斯之剑"], loot_tables: []}
- {cn: "纯善护符", en: "Talisman of Pure Good", rarity: 传说, kind: 奇物, attunement: "由牧师或圣武士", page: 314, text: "这枚护符是良善的象征。触碰护符的亡灵或邪魔生物将受到8d6光耀伤害，每当该生物持握或携带此护符结束其回合时，将再次受到此伤害。\n【圣徽】你可以将护符当作圣徽使用。着装或持握护符期间，你进行的法术攻击检定获得+2加值。\n【至纯审判】护符具有7充能。着装或持握护符期间，你能够以一个魔法动作，消耗1充能并以一名位于你120尺内的地面上的你可见的生物为目标，使目标脚下张开一道火焰裂隙。目标必须进行一次DC 20的敏捷豁免，若目标是邪魔或亡灵，其进行此豁免具有劣势。豁免失败则目标坠入裂隙，灰飞烟灭；成功则目标不会坠入裂隙，但因审判受到4d6心灵伤害。无论情况如何，裂隙随后将不留痕迹地闭合。充能耗尽时，护符将被摧毁，化为闪耀金光的尘埃。", aliases: ["Talisman of Pure Good", "纯善护符"], loot_tables: ["圣物_传说"]}
- {cn: "法球护符", en: "Talisman of the Sphere", rarity: 传说, kind: 奇物, attunement: "需同调", page: 315, text: "持握或着装此护符期间，你为操控湮灭法球而进行的智力（奥秘）检定具有优势。此外，你的回合开始时，若你正在操控湮灭法球，你能够以一个魔法动作将法球移动一定尺数，具体尺数等于10+10×你的智力调整值。以此法移动法球时，其不必以直线进行运动。", aliases: ["Talisman of the Sphere", "法球护符"], loot_tables: ["奥秘_传说", "器具_传说"]}
- {cn: "至恶护符", en: "Talisman of Ultimate Evil", rarity: 传说, kind: 奇物, attunement: "需同调", page: 315, text: "这枚护符是至恶的象征。触碰护符的非亡灵非邪魔生物将受到8d6暗蚀伤害，每当该生物持握或携带此护符结束其回合时，将再次受到此伤害。\n【圣徽】你可以将护符当作圣徽使用。着装或持握护符期间，你进行的法术攻击检定获得+2加值。\n【万物终焉】护符具有6充能。着装或持握护符期间，你能够以一个魔法动作，消耗1充能并以一名位于你120尺内的地面上的你可见的生物为目标，使目标脚下张开一道火焰裂隙。目标必须进行一次DC 20的敏捷豁免，若目标是天族，其进行此豁免具有劣势。豁免失败则目标坠入裂隙，灰飞烟灭；成功则目标不会坠入裂隙，但因审判受到4d6心灵伤害。无论情况如何，裂隙随后将不留痕迹地闭合。充能耗尽时，护符将被摧毁，化为散发着恶臭的粘液。", aliases: ["Talisman of Ultimate Evil", "至恶护符"], loot_tables: ["圣物_传说"]}
- {cn: "说话玩偶", en: "Talking Doll", rarity: 普通, kind: 奇物, attunement: "需同调", page: 315, text: "这个玩偶在你周边5尺范围内期间，你可以花费一次短休教会它说至多六段短语，并设定玩偶说出每段短语的条件，每段短语的长度都不能超过六个单词。你也可以使用新短语替换旧短语。设定的条件必须在玩偶周边5尺范围内发生，这样玩偶才会说话。例如，当有人捡起这个玩偶时，它可能会说一句\"我想要一块糖\"。当你与玩偶的同调结束时，玩偶的短语会消失。", aliases: ["Talking Doll", "说话玩偶"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "清醒杯", en: "Tankard of Sobriety", rarity: 普通, kind: 奇物, attunement: "", page: 315, text: "这个大酒杯上的一侧雕刻着一张坚毅的脸。只要用这个酒杯，不论你喝麦芽酒、葡萄酒、还是其他任何非魔法的酒精饮料你都不会醉。这个酒杯对魔法液体或毒药之类的有害物质不会产生影响。", aliases: ["Tankard of Sobriety", "清醒杯"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "触须权杖", en: "Tentacle Rod", rarity: 珍稀, kind: 权杖, attunement: "需同调", page: 316, text: "这根权杖的末端长着三条有弹性的触须。持握这根权杖时，你可以执行魔法动作来指挥触手向外伸展，每一条都会对你可见的15尺之内的一个生物发动攻击。为每条触须进行+9加值的近战攻击检定。单条触须命中时会造成1d6心灵伤害。如果你用三条触须击中同一目标，则该目标必须成功通过DC 15的敏捷豁免，否则将陷入束缚状态。束缚将持续直至你陷入失能状态，花费附赠动作放开目标或目标不再处于你的15尺之内时。当目标被以此法束缚时，在其每个回合开始时都会受到3d6心灵伤害。目标在其每回合结束时可以重新进行这次豁免，豁免成功则终止其身上的效应。", aliases: ["Tentacle Rod", "触须权杖"], loot_tables: ["武备_珍稀", "圣物_珍稀"]}
- {cn: "雷霆巨棒", en: "Thunderous Greatclub", rarity: 极珍稀, kind: 武器, attunement: "需同调", page: 316, text: "当你与这把魔法武器同调后，你的力量变为20，除非你的力量已经大于或等于此值。这把武器会对其命中的任何生物造成额外1d8雷鸣伤害，也会对其命中的未被穿着或携带的物件造成额外3d8雷鸣伤害。\n这把武器具有以下附加词条：\n【雷霆霹雳】以一个魔法动作，你可以使用这把武器击打一处坚硬表面，制造出在300尺内都能听见的雷鸣般巨响。并且，你制造出一个30尺锥状的雷霆能量区域。锥状区域内的每个生物都必须成功通过一次DC 15的力量豁免，豁免失败则其陷入倒地状态。锥状区域内未被穿着或携带的非魔法物件会受到3d8雷鸣伤害。\n【地震术】以一个魔法动作，你可以使用这把武器敲击地面，在以敲击点为中心，半径50尺的范围内引起一阵强烈的地震扰动。该区域内与地面接触的建筑物会受到50点钝击伤害，并且该区域地面上的每个生物都必须成功通过一次DC 20的敏捷豁免，豁免失败则其陷入倒地状态。若该生物同时正在维持专注，则其必须成功通过一次DC 20的体质豁免，豁免失败则其专注被打断。此外，你可以在该区域内任意一处的地面上打开一道30尺深，10 尺宽的裂缝。任何位于裂缝开口位置的生物都必须进行一次DC 20的敏捷豁免，豁免失败则其落入裂缝中，豁免成功则其会随着裂缝边缘移动。任何位于裂缝开口位置的建筑物都会坍塌落入裂缝中。这项词条一经使用，则其直至次日黎明前都无法再次使用。", aliases: ["Thunderous Greatclub", "雷霆巨棒"], loot_tables: ["武备_极珍稀"]}
- {cn: "虎眼石", en: "Tiger Eye", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗棕色，中心金色的宝石。", aliases: ["Tiger Eye", "虎眼石"], loot_tables: []}
- {cn: "静思卷册", en: "Tome of Clear Thought", rarity: 极珍稀, kind: 奇物, attunement: "", page: 317, text: "这本书记载了训练记忆和逻辑的方法，其文字蕴含魔力。如果你在不长于6日的时间段内花费了48小时研读这本书并实践其中的方针，则你的智力提升2，至多提升至30。之后这本手册将失去魔力，直到一个世纪后才能恢复。", aliases: ["Tome of Clear Thought", "静思卷册"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "统御卷册", en: "Tome of Leadership and Influence", rarity: 极珍稀, kind: 奇物, attunement: "", page: 317, text: "这本书记载了影响和吸引他人的指导，其文字蕴含魔力。如果你在不长于6日的时间段内花费了48小时研读这本书并实践其中的方针，则你的魅力提升2，至多提升至30。之后这本手册将失去魔力，直到一个世纪后才能恢复。", aliases: ["Tome of Leadership and Influence", "统御卷册"], loot_tables: ["器具_极珍稀"]}
- {cn: "静语卷册", en: "Tome of the Stilled Tongue", rarity: 传说, kind: 奇物, attunement: "由法师", page: 317, text: "这本厚重皮革包覆的卷册封面上钉着一条风干的舌头。卷册现存世5本，但无人知晓哪本才是原本。第一本静语卷册上的舌头来自一名背叛了巫妖维克那的仆人。其他四本复制品封面上的舌头则来自冒犯了维克那的其他施法者。每本卷册的前几页都写满了难以辨认的潦草字迹，其余页面则空白如新。\n与此卷册同调期间，你可以将它作为法术书和法器。此外，持握卷册期间，你能够以一个附赠动作施展一道记录在卷册中的法术而无需言语或姿势成分，也无需消耗法术位。该词条一经使用，直至次日黎明你都无法再次使用。\n只有你可以移除卷册封面的舌头。若如此做，书中记录的所有法术将被永久抹除。\n维克那留意着任何使用卷册的人，还可以向卷册内写入密文。这些密文通常在被人阅读后即消失不见。", aliases: ["Tome of the Stilled Tongue", "静语卷册"], loot_tables: ["奥秘_传说"]}
- {cn: "通晓卷册", en: "Tome of Understanding", rarity: 极珍稀, kind: 奇物, attunement: "", page: 317, text: "这本书记载了训练直觉和洞察力的方法，其文字蕴含魔力。如果你在不长于6日的时间段内花费了48小时研读这本书并实践其中的方针，则你的感知提升2，至多提升至30。之后这本手册将失去魔力，直到一个世纪后才能恢复。", aliases: ["Tome of Understanding", "通晓卷册"], loot_tables: ["圣物_极珍稀"]}
- {cn: "黄玉", en: "Topaz", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一块金黄色的宝石。", aliases: ["Topaz", "黄玉"], loot_tables: []}
- {cn: "蒙汗药", en: "Torpor", rarity: 未标注, kind: 奇物, attunement: "", page: 91, text: "服用这种毒药的生物必须成功通过一次DC 15的体质豁免，否则将陷入中毒状态4d6小时。以此法中毒期间该生物的速度减半。", aliases: ["Torpor", "蒙汗药"], loot_tables: []}
- {cn: "电气石", en: "Tourmaline", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗淡绿、蓝色、棕色或红色的宝石。", aliases: ["Tourmaline", "电气石"], loot_tables: []}
- {cn: "唤鱼三叉戟", en: "Trident of Fish Command", rarity: 非普通, kind: 武器, attunement: "需同调", page: 317, text: "这把魔法武器具有3充能，并在每日黎明时重获1d3已消耗的充能。当你携带这把武器时，你可以消耗1充能对一只具有游泳速度的野兽施展支配野兽（豁免DC 15）。", aliases: ["Trident of Fish Command", "唤鱼三叉戟"], loot_tables: ["武备_非普通"]}
- {cn: "吐真剂", en: "Truth Serum", rarity: 未标注, kind: 奇物, attunement: "", page: 91, text: "服用该毒药的生物必须成功通过一次DC 11的体质豁免，否则将陷入中毒状态1小时。以此中毒的生物不能故意说谎。", aliases: ["Truth Serum", "吐真剂"], loot_tables: []}
- {cn: "绿松石", en: "Turquoise", rarity: 未标注, kind: 奇物, attunement: "", page: 214, text: "一颗浅蓝绿色的宝石。", aliases: ["Turquoise", "绿松石"], loot_tables: []}
- {cn: "万溶剂", en: "Universal Solvent", rarity: 传说, kind: 奇物, attunement: "", page: 318, text: "这管乳白色的液体散发着浓烈的酒精气味。被发现时，管中装有1d6 + 1盎司的万溶剂。\n你能够以一个操作动作将管中1盎司或更多的液体倒在触及内的某表面上。每盎司万溶剂将立刻溶解它接触到的至多1尺立方的粘合剂（包括至尊胶sovereign glue）。", aliases: ["Universal Solvent", "万溶剂"], loot_tables: ["奥秘_传说", "器具_传说"]}
- {cn: "老兵手杖", en: "Veteran's Cane", rarity: 普通, kind: 奇物, attunement: "", page: 318, text: "你能够以一个附赠动作将这根手杖变为一把普普通通的长剑，或者将长剑变回手杖。你必须持握该物品才能完成以上两种变形。", aliases: ["Veteran's Cane", "老兵手杖"], loot_tables: ["武备_普通", "器具_普通"]}
- {cn: "定身魔杖", en: "Wand of Binding", rarity: 珍稀, kind: 魔杖, attunement: "需同调", page: 318, text: "这根魔杖具有7充能。\n【法术】持握这根魔杖时，你可以从中施展下列表格中的一道法术（豁免DC 17）。施展对应法术所需消耗的充能数如表格所示。\n【重获充能】这根魔杖在每日黎明时重获1d6 + 1已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，魔杖将化作飞灰并被摧毁。", aliases: ["Wand of Binding", "定身魔杖"], loot_tables: ["奥秘_珍稀"]}
- {cn: "指挥魔杖", en: "Wand of Conducting", rarity: 普通, kind: 魔杖, attunement: "", page: 319, text: "这根魔杖具有3充能。持握它时，你可以执行魔法动作并消耗1充能，通过挥舞它来创造一段管弦乐。这段音乐在120尺之内都能被听到，并且在你停止挥舞魔杖时结束。\n【重获充能】这根魔杖在每日黎明时重获所有已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，魔杖将在悲伤的低音号声中化作飞灰并被摧毁。", aliases: ["Wand of Conducting", "指挥魔杖"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "搜敌魔杖", en: "Wand of Enemy Detection", rarity: 珍稀, kind: 魔杖, attunement: "需同调", page: 319, text: "这根魔杖具有7充能。持握它时，你可以执行魔法动作并消耗1充能。在一分钟内，你可以知道位于你60尺内离你最近的敌对生物所在的方向，但不知道距离。魔杖可以感知肉眼可见的敌对生物，也可以感知到隐形、以太化、伪装、躲藏的敌对生物。效应在你不再持握这根魔杖时终止。\n【重获充能】这根魔杖在每日黎明时重获1d6 + 1已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，魔杖将化作飞灰并被摧毁。", aliases: ["Wand of Enemy Detection", "搜敌魔杖"], loot_tables: ["器具_普通", "器具_珍稀"]}
- {cn: "恐惧魔杖", en: "Wand of Fear", rarity: 珍稀, kind: 魔杖, attunement: "需同调", page: 319, text: "这根魔杖具有7充能。\n【法术】持握这根魔杖时，你可以从中施展下列表格中的一道法术（豁免DC 15）。施展对应法术所需消耗的充能数如表格所示。\n【重获充能】这根魔杖在每日黎明时重获1d6 + 1已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，魔杖将化作飞灰并被摧毁。", aliases: ["Wand of Fear", "恐惧魔杖"], loot_tables: ["奥秘_珍稀"]}
- {cn: "火球魔杖", en: "Wand of Fireballs", rarity: 珍稀, kind: 魔杖, attunement: "由施法者", page: 319, text: "这根魔杖具有7充能。持握它时，你可以消耗最多3充能从中施展火球术（豁免DC 15）。你可以用1充能施展3环版本的法术；每多消耗1充能，法术的环位就将提升1环。\n【重获充能】这根魔杖在每日黎明时重获1d6 + 1已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，魔杖将化作飞灰并被摧毁。", aliases: ["Wand of Fireballs", "火球魔杖"], loot_tables: ["奥秘_珍稀"]}
- {cn: "闪电束魔杖", en: "Wand of Lightning Bolts", rarity: 珍稀, kind: 魔杖, attunement: "由施法者", page: 320, text: "这根魔杖具有7充能。持握它时，你可以消耗最多3充能从中施展闪电束 （豁免DC 15）。你可以用1充能施展3环版本的法术；每多消耗1充能，法术的环位就将提升1环。\n【重获充能】这根魔杖在每日黎明时重获1d6 + 1已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，魔杖将化作飞灰并被摧毁。", aliases: ["Wand of Lightning Bolts", "闪电束魔杖"], loot_tables: ["奥秘_珍稀"]}
- {cn: "搜魔魔杖", en: "Wand of Magic Detection", rarity: 非普通, kind: 魔杖, attunement: "", page: 320, text: "这根魔杖具有3充能。持握它时，你可以消耗1充能从中施展侦测魔法。这根魔杖在每日黎明时重获1d3已消耗的充能。", aliases: ["Wand of Magic Detection", "搜魔魔杖"], loot_tables: ["奥秘_非普通", "圣物_非普通"]}
- {cn: "魔法飞弹魔杖", en: "Wand of Magic Missiles", rarity: 非普通, kind: 魔杖, attunement: "", page: 320, text: "这根魔杖具有7充能。当持握它时，你可以消耗最多3充能从中施展魔法飞弹 。你可以用1充能施展1环版本的法术。每多消耗1充能，法术的环位就将提升1环。\n【重获充能】这根魔杖在每日黎明时重获1d6 + 1已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，魔杖将化作飞灰并被摧毁。", aliases: ["Wand of Magic Missiles", "魔法飞弹魔杖"], loot_tables: ["奥秘_非普通"]}
- {cn: "奥喀斯之杖", en: "Wand of Orcus", rarity: 神器, kind: 魔杖, attunement: "需同调", page: 320, text: "这根阴森恐怖的魔杖由奥喀斯制作并使用。它不时从其恶魔领主创造者的手中溜走，神奇地出现在恶魔领主感到有机会实现其邪恶目的的地方。\n这根魔杖的顶端镶嵌着一颗曾属于一位被奥喀斯所杀的人类英雄的颅骨。魔杖可以魔法般地改变体型以更好地适应使用者的握持。魔杖10尺范围内的所有圣水都会被摧毁。\n除奥喀斯外，任何生物与魔杖进行同调时，必须进行一次DC 17的体质豁免。豁免成功，则该生物受到10d6暗蚀伤害。豁免失败，则该生物死亡，若其是类人，则变为一只丧尸 。\n【魔化武器】你可以将魔杖用作一把魔法硬头锤，用魔杖进行的攻击检定和伤害掷骰获得+3加值，魔杖命中时，额外造成2d12暗蚀伤害。\n【随机词条】奥喀斯之杖具有下列随机词条： 2项神器词条; 次要增益词条词条 1项神器词条; 主要增益词条词条 2项神器词条; 次要减益词条词条 1项神器词条; 主要减益词条词条 与奥喀斯维持同调期间，魔杖的减益词条将被抑制。\n【守护】持握魔杖时，你的护甲等级获得+3加值。\n【法术】魔杖具有7充能并在每日黎明时重获1d4 + 3已消耗的充能。你可以从中施展下表中的法术（豁免DC 18）。表中表明了你施展对应的法术需要消耗多少充能。\n奥喀斯与受其祝福的追随者与魔杖维持同调期间，他们施展以上每个法术的充能消耗降低2（最低为0）。\n【唤起不死生物】持握魔杖期间，你能够以魔法动作咒唤15只丧尸和15具骷髅 ，这些亡灵将魔法的自地面中升起或在你300尺内的未占据空间中生成，它们将服从你的命令，它们被摧毁或次日黎明时，它们会倒塌为一堆无生命的骨头和腐尸。该词条一经使用，直至次日黎明你都无法再次使用。 奥喀斯在持握魔杖期间可以召唤任意种类的亡灵，而非仅仅是丧尸和骷髅。这些亡灵不会在次日黎明消亡，而是存在直至奥喀斯将他们驱散。\n【智能】奥喀斯之杖是一根混乱邪恶的智能魔杖，智力为16，感知12，魅力16。它具有120尺听觉及120尺黑暗视觉。 奥喀斯之杖说通用语和炼狱语并可以通过心灵感应与持用者交流。\n【个性】魔杖的目标是满足奥喀斯杀戮多元宇宙一切的欲望。魔杖残暴，虚无，且毫无幽默感。 为了进一步完成奥喀斯的目标，魔杖会假装忠诚于其现任使用者，甚至给对方许下根本不打算应允的承诺，比如发誓帮助对方推翻奥喀斯本尊。\n【摧毁法杖】要摧毁奥喀斯之杖 ，需要魔杖上骷髅头的英雄本尊将其带到正能量位面。要做到这点，必须先让这位故去已久的英雄重新复活——这并非易事，奥喀斯囚禁了他的灵魂，藏在一个守备森严的秘密地点。 将魔杖浸没在正能量（例如弥漫在正位面的正能量）中将导致其崩坏炸裂，但如果无法满足上述的前提条件，破坏的魔杖将立即在奥喀斯所控制的深渊层域中重新形成。", aliases: ["Wand of Orcus", "奥喀斯之杖"], loot_tables: []}
- {cn: "麻痹魔杖", en: "Wand of Paralysis", rarity: 珍稀, kind: 魔杖, attunement: "由施法者", page: 321, text: "这根魔杖具有7充能。持握它时，你可以执行魔法动作并消耗1充能，从魔杖尖端向位于你60尺内的一个你可见的生物射出一发纤细的蓝色光线。目标必须成功通过一次DC 15的体质豁免，否则将陷入麻痹状态一分钟。目标在其每回合结束时可以重新进行该豁免，豁免成功则终止其身上的该效应。\n【重获充能】这根魔杖在每日黎明时重获1d6 + 1已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，魔杖将化作飞灰并被摧毁。", aliases: ["Wand of Paralysis", "麻痹魔杖"], loot_tables: ["圣物_珍稀"]}
- {cn: "变形魔杖", en: "Wand of Polymorph", rarity: 极珍稀, kind: 魔杖, attunement: "由施法者", page: 321, text: "这根魔杖具有7充能。持握它时，你可以消耗1充能从中施展变形术（豁免DC 15）。\n【重获充能】这根魔杖在每日黎明时重获1d6 + 1已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，魔杖将化作飞灰并被摧毁。", aliases: ["Wand of Polymorph", "变形魔杖"], loot_tables: ["奥秘_极珍稀"]}
- {cn: "烟火魔杖", en: "Wand of Pyrotechnics", rarity: 普通, kind: 魔杖, attunement: "", page: 321, text: "这根魔杖具有7充能。持握它时，你可以执行魔法动作并消耗1充能，在离你至多120尺处你可见的一点创造出一束无害的多彩亮光。亮光迸发时会伴随着300尺之内都能听见的响亮爆鸣声。该光芒的亮度如火把一般，但只持续1秒。\n【重获充能】这根魔杖在每日黎明时重获1d6 + 1已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，魔杖将化作飞灰并被摧毁。", aliases: ["Wand of Pyrotechnics", "烟火魔杖"], loot_tables: ["奥秘_普通", "器具_普通"]}
- {cn: "探秘魔杖", en: "Wand of Secrets", rarity: 非普通, kind: 魔杖, attunement: "", page: 322, text: "这根魔杖具有3充能，并在每日黎明时重获1d3已消耗的充能。持握期间，你可以执行魔法动作并消耗1充能，此时如果在你60尺内存在密门或陷阱，魔杖将跳动着指向离你最近的一个。", aliases: ["Wand of Secrets", "探秘魔杖"], loot_tables: ["奥秘_非普通", "器具_非普通"]}
- {cn: "蛛网魔杖", en: "Wand of Web", rarity: 非普通, kind: 魔杖, attunement: "由施法者", page: 322, text: "这根魔杖具有7充能。持握它时，你可以消耗1充能从中施展蛛网术（豁免DC 13）。\n【重获充能】这根魔杖在每日黎明时重获1d6 + 1已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，魔杖将化作飞灰并被摧毁。", aliases: ["Wand of Web", "蛛网魔杖"], loot_tables: ["奥秘_非普通"]}
- {cn: "惊异魔杖", en: "Wand of Wonder", rarity: 珍稀, kind: 魔杖, attunement: "需同调", page: 322, text: "这根魔杖具有7充能。持握它时，你可以执行魔法动作并消耗1充能，并选择位于你120尺内的一点。那个位置变为由惊异魔杖效应表中骰出的法术或其他魔法效应的源点。从魔杖中施展的法术的豁免DC为15。如果一个法术的最大射程在正常情况下不足120尺，则当被魔杖释放时其射程变为120尺。若一种效应有多个可选目标，则DM随机决定其中哪个目标将被效应影响。\n【重获充能】这根魔杖在每日黎明时重获1d6 + 1已消耗的充能。当充能数耗尽时，骰一次1d20。如果骰值为1，魔杖将化作飞灰并被摧毁。", aliases: ["Wand of Wonder", "惊异魔杖"], loot_tables: ["奥秘_珍稀"]}
- {cn: "波涛", en: "Wave", rarity: 神器, kind: 武器, attunement: "需同调", page: 323, text: "波涛藏在白羽山的地下城中，这把精致的三叉戟上面雕有波浪、贝壳和海洋生物的图案。\n你用此魔法武器进行的攻击检定和伤害掷骰获得+3加值。当你在以此武器进行的攻击检定的d20中掷出20时，目标额外受到21暗蚀伤害。\n持用波涛期间，你获得以下增益：\n【战斗预备】你能够进行有优势的先攻掷骰。\n【水下适应】你身处水下期间，一个空气泡泡环绕着你的脑袋，令你可以在该环境下如常呼吸。\n【命令水栖】波涛具有3充能并在每日黎明时重获1d3充能，当你携带波涛时，你可以消耗1充能，对一只具有游泳速度的野兽施展支配野兽 （豁免DC 20）。\n【法术无效结界】持握波涛时，你可以从中施展九环版本的法术法术无效结界。该词条一经使用，直至次日黎明你都无法再次使用。\n【智能】涛是一把具有绝对中立阵营的智能武器，智力为14，感知10，魅力18。它具有120尺听觉及120尺黑暗视觉。 波涛与其持用者通过心灵感应交流，波涛也会说水族语。\n【个性】波涛热衷于劝诫凡人信仰海神，并有哼唱船歌的习惯。如果其持用者没有将波涛的目标传遍世界，波涛将进行反噬。\n【摧毁波涛】波涛只会在雷铸岛——其被锻造出来的地方——被摧毁。波涛只能由风暴巨人或拥有着风暴巨人力量之人亲手熔化。摧毁波涛将激怒一位海神，其将派遣强大的使徒们攻打小岛并惩罚将波涛摧毁之人。", aliases: ["Wave", "波涛"], loot_tables: []}
- {cn: "诸界之井", en: "Well of Many Worlds", rarity: 传说, kind: 奇物, attunement: "", page: 324, text: "这块如丝绸般顺滑的精致黑色布料，折叠起来只有手帕大小。布料展开后为直径6尺的圆形盖布。\n你能够以一个魔法动作展开诸界之井，将它布置在坚实表面上，产生一扇直径6尺、通向另一个世界或存在位面的圆形双向传送门。每次此物品打开传送门时，由DM决定它所连接的地方。传送门保持开启，直至位于其5尺内的一名生物以一个魔法动作抓住布料的边缘把它折叠起来，来将传送门关闭。\n诸界之井一经使用，在1d8小时内都无法再次打开传送门。", aliases: ["Well of Many Worlds", "诸界之井"], loot_tables: ["奥秘_传说"]}
- {cn: "征服", en: "Whelm", rarity: 神器, kind: 武器, attunement: "需矮人或是与矮人腰带维持同调的生物", page: 324, text: "征服失落在白羽山的地下城中，它是一把威力巨大的，由矮人锻造的武器。\n你用此魔法武器进行的攻击检定和伤害掷骰获得+3加值。\n【猛投】征服具有投掷（射程60/180尺）词条，当你以此武器进行远程攻击命中时，目标额外受到1d8力场伤害。若目标生物是构装、元素或巨人则改为额外受到4d8力场伤害。无论攻击是否命中，此武器立即飞回你的手中。\n【震荡波】你能够以魔法动作，用征服重击地面，从该点发出震荡波。位于你60尺内的每个你选择的生物必须成功通过一次DC 20的体质豁免，否则陷入震慑状态，持续1分钟。豁免失败的生物在其每个回合结束时重复豁免，成功则终止其身上的该效应。该词条一经使用，直至次日黎明你都无法再次使用。\n【超然警觉】持握此武器期间，它为你揭示位于你30尺内的密门或隐藏门的位置。此外，你还可以从中施展法术侦测善恶或物件定位术 。一旦你施展任一项法术，直至次日黎明你都无法再次从中施展法术。\n【智能】征服是一把智能武器，阵营守序中立，智力为15，感知12，魅力15。它具有120尺听觉及120尺黑暗视觉。 征服与其持用者通过心灵感应交流，征服也会说矮人语、巨人语和地精语。\n【个性】征服与创造它的矮人氏族紧密的联系在一起，该氏族有各种称呼，如丹吉尔Dankil或称强锤Mightyhammer氏族。征服渴望回到氏族中。征服的目标是保护矮人。若持有者不认同这个目标则征服将反噬。\n【摧毁征服】征服可以用刚被杀死的远古黑龙的酸性胆汁熔化。另外，强锤矮人氏族的合法领袖也可以在锻造厂熔化它。", aliases: ["Whelm", "征服"], loot_tables: []}
