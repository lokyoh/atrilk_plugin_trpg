# 《城主指南 (2024)》DM 工具箱明文数据表
#
# 一张分段表（load_mapping）装下十几张小表：这些表都只有几行、彼此关联，
# 拆成十几个文件反而没人找得到。段名 = 小节名，改数值不用改 .py。
#
# 出处（行号均为「参考/城主指南 (2024).md」）：
#   improvised_damage  L1036-1048 / damage_severity L1050-1062
#   doors L2330-2336 / lock_complexity L2342-2347 / lock_quality L2350-2357
#   secret_doors L2359-2372 / portcullis L2378-2389 / trap_build L5594-5607
#   trade_bars L9009-9020 / gems L9045-9123 / art L9127-9195
#   individual_treasure L6182-6194 / hoard_treasure L6196-6210 / 任务奖励 L6212-6214
#
# ⚠️ 伤害/DC/价格等数值是 2024 明文，别拿 2014 的表覆盖。
# ⚠️ 范例危害物 / 范例陷阱 / 范例毒药的详情卡在 md 里是 5etools 占位 HTML，
#    本文件只收有明文数值的表；详情待从 参考/5etools-cn-cn2.0/data/ 转录。

improvised_damage:
- dice: 1d10
  examples: 被炭烫伤，被倒下的书柜砸伤，被毒针刺伤
- dice: 2d10
  examples: 被闪电劈中，跌进火坑中
- dice: 4d10
  examples: 在坍塌的隧道里被落下的碎石砸中，滚入装满强酸的桶里
- dice: 10d10
  examples: 被紧实的墙壁碾压，被飞旋的钢铁利刃击中，淌过熔岩
- dice: 18d10
  examples: 淹没进熔岩里，被坠毁的飞行堡垒砸中
- dice: 24d10
  examples: 被卷入火元素位面的火焰涡流，被类神生物或和月亮一般大的怪物一口咬碎

