# --------------------------------------------------------------------------- #
# 训练场的专业教练（原文表「专业教练」）：增益持续 7 天
# --------------------------------------------------------------------------- #
coach:
- cn: 战斗专家
  effect: 受到武器或徒手打击伤害时，可用反应把伤害减少 1d4
- cn: 技能专家
  effect: 选特技 / 运动 / 表演 / 巧手 / 隐匿之一并获其熟练
- cn: 工具专家
  effect: 选一项工具并获得其熟练
- cn: 徒手格斗专家
  effect: 徒手打击命中时额外造成 1d4 钝击伤害
- cn: 武器专家
  effect: 选一种简易或军用武器；未熟练则获熟练，已熟练则可用其精通词条

# --------------------------------------------------------------------------- #
# 公会大厅的范例公会（原文表「范例公会」）：每次招募派会员做一件事
# --------------------------------------------------------------------------- #
guild:
- cn: 冒险者公会
  task: 追捕据点 50 里内一只 CR ≤ 2 的野兽，1d6 + 1 天内杀死或捕获；捕获且据点有动物园可收入栏内，杀死且据点有陈列室可加猎获
- cn: 烘培师公会
  task: 7 天内为一场重要活动烘焙，报酬 500 GP 或活动主办方欠你一个人情（DM 定）
- cn: 酿酒师公会
  task: 7 天内送来 50 桶麦酒（每桶 40 加仑，可卖 10 GP）
- cn: 石匠公会
  task: 免费为本据点建一道防御墙，或为 1 里内另一名玩家的据点建；每 5 尺方格 1 天
- cn: 造船师公会
  task: 造一艘玩家手册里的大型载具，付全价，每 1000 GP 成本 1 天
- cn: 盗贼公会
  task: 渗透据点 50 里内一处地点，偷回一件 5 尺以内的非魔法物件，1d6 + 1 天送到；可能有法律后果

# --------------------------------------------------------------------------- #
# 酒馆特饮（原文「酒馆特饮」）：每回合开始时可选，倒出 24 小时内不喝会失效
# --------------------------------------------------------------------------- #
drink:
- cn: 毕格比之重
  effect: 获得变巨/缩小术的「变大」效应，24 小时，无法豁免
- cn: 蛛后之吻
  effect: 获得蛛行术效应，24 小时
- cn: 月光小夜曲
  effect: 60 尺黑暗视觉 24 小时；已有则范围再加 60 尺
- cn: 正能量支援
  effect: 获得暗蚀伤害抗性，24 小时
- cn: 坚强特饮
  effect: 为避免或结束恐慌的豁免自动成功，24 小时

# --------------------------------------------------------------------------- #
# 档案馆的参考书（原文「参考书」）：站在据点内时有对应检定优势
# --------------------------------------------------------------------------- #
book:
- cn: 毕格比的实用奥术典籍
  skill: 奥秘
  text: 回想法术、魔法物品、秘术符号、魔法传统、存在位面的知识时，智力（奥秘）检定有优势
- cn: 库若尼普斯编年史
  skill: 历史
  text: 回想历史事件、传奇人物、古代帝国、旧日战争、失落文明的知识时，智力（历史）检定有优势
- cn: 调查员的调查报告
  skill: 调查
  text: 依据线索推理，或回想陷阱、密码、谜题、小装置的知识时，智力（调查）检定有优势
- cn: 对于世界本质的物质性思考
  skill: 自然
  text: 回想地形、植物、动物、天气的知识时，智力（自然）检定有优势
- cn: 旧日信仰和其他宗教
  skill: 宗教
  text: 回想神祇、仪式、祈祷、宗教制度、圣徽、秘密邪教的知识时，智力（宗教）检定有优势

