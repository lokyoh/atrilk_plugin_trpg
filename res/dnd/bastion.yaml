# 《城主指南 (2024)》第八章「据点」明文数值
#
# 来源：book-xdmg.json 第八章（正文与各表）+ bastions.json 的 XDMG facility
# （29 条特色设施 + 6 条基础设施的等级 / 空间 / 雇员 / 指令元数据）。
#
# 分段：constant / size / slot / basic / facility / event / fine_detail / guest /
#       treasure / garden / menagerie / cr_price / coach / guild / drink / book /
#       harvest
#
# ⚠️ 数值一律从这里取，别写回 .py（有测试拦）。
# ⚠️ **设施的具体增益效果不在这里**：tactic 只记「下过增强指令、7 天后到期」，
#    效果本身（秘学护咒、临时生命、豁免优势…）由 DM 按 summary 与原文落地。
#    程序算的是能掷骰、能记账的部分：等级、空间、雇员数、指令合法性、卫兵数、
#    事件里的骰池与金钱、收益表。
# ⚠️ 设施的 prerequisite 只存**原文文字**：卡片上没有「法器熟练」这类字段，
#    判定是 DM 的事。程序只把它原样显示出来，不假装校验过。

# --------------------------------------------------------------------------- #
# 常量：原文散在正文里、没有成表的那几条
# --------------------------------------------------------------------------- #
constant:
- key: unlock_level
  cn: 解锁等级
  value: 5
  note: 角色达到 5 级时获得据点
- key: turn_days
  cn: 据点回合周期
  value: 7
  note: 游戏内每经过 7 天一次；频率由 DM 决定，可放慢
- key: special_expand_gp
  cn: 特色设施扩建为庞大
  value: 2000
  note: 只对自述写了可扩建的设施有效；原文没给工期，视为立即完成
- key: free_basic
  cn: 初始基础设施
  value: 2
  note: 一个狭窄、一个宽敞，免费
- key: free_special
  cn: 初始特色设施
  value: 2
  note: 从满足先决的设施里选，免费
- key: barrack_roomy
  cn: 宽敞兵营容量
  value: 12
  note: 每次招募至多 4 名据点卫兵
- key: barrack_vast
  cn: 庞大兵营容量
  value: 24
- key: barrack_recruit
  cn: 单次招募上限
  value: 4
- key: neglect_note
  cn: 疏于照顾
  value: 0
  note: 连续「角色等级」次据点回合不下任何指令 → 雇员弃守、据点被洗劫

# --------------------------------------------------------------------------- #
# 设施空间（原文表「设施空间」）：方格数与**基础设施**的建造 / 扩建价格、工期
# ⚠️ 这里的 build_* / expand_* 只适用于**基础设施**（原文「增添基础设施」与
#    「扩大基础建设」两张表）。**特色设施不能买、不能直接扩建**：它靠升级获取，
#    扩建只发生在设施自述写了「可以花费 2000 GP 扩大为庞大」的那几个身上
#    （见 constant.special_expand_gp），且原文没给工期。
# --------------------------------------------------------------------------- #
size:
- key: cramped
  cn: 狭窄
  squares: 4
  build_gp: 500
  build_days: 20
  expand_gp: 500
  expand_days: 25
  expand_to: roomy
- key: roomy
  cn: 宽敞
  squares: 16
  build_gp: 1000
  build_days: 45
  expand_gp: 2000
  expand_days: 80
  expand_to: vast
- key: vast
  cn: 庞大
  squares: 36
  build_gp: 3000
  build_days: 125
  expand_gp: 0
  expand_days: 0
  expand_to: ""

# --------------------------------------------------------------------------- #
# 特色设施数量（原文表「特色设施获取」）+ 解锁等级
# --------------------------------------------------------------------------- #
slot:
- level: 5
  count: 2
- level: 9
  count: 4
- level: 13
  count: 5
- level: 17
  count: 6

# --------------------------------------------------------------------------- #
# 基础设施（原文「基础设施」表）：两个免费，一个狭窄 + 一个宽敞
# --------------------------------------------------------------------------- #
basic:
- cn: 卧室
  en: Bedroom
- cn: 餐厅
  en: Dining Room
- cn: 客厅
  en: Parlor
- cn: 庭院
  en: Courtyard
- cn: 厨房
  en: Kitchen
- cn: 储藏室
  en: Storage

# --------------------------------------------------------------------------- #
# 特色设施 29 条（原文「特色设施」表 + 各设施描述）
#
# spaces : 可用的空间尺寸（cramped / roomy / vast）
# orders : 该设施支持的据点指令（制造 / 增强 / 收获 / 研究 / 招募 / 贸易）
# staff  : 各空间尺寸下的雇员数
# pre    : 先决条件原文（"无" = 无先决）；判定交 DM
# summary: 一句话机制摘要，给 DM 用；完整正文见 query_data(bastion, 设施名)
# --------------------------------------------------------------------------- #
facility:
- cn: 奥术研究室
  en: Arcane Study
  level: 5
  spaces: [roomy]
  orders: [制造]
  staff: {roomy: 1}
  pre: 可以使用奥术法器，或可以将工具作为法器
  summary: 长休后得秘学护咒（免位施一次鉴定术）；制造奥术法器 / 空白书（10 GP）/ 9 级起奥秘表魔法物品
- cn: 档案馆
  en: Archive
  level: 13
  spaces: [roomy, vast]
  orders: [研究]
  staff: {roomy: 1, vast: 1}
  pre: 无
  summary: 研究 7 天，如同施展通晓传奇般得知识；可选 1 本参考书（对应奥秘 / 历史 / 调查 / 自然 / 宗教检定优势），庞大再得两本
- cn: 军械库
  en: Armory
  level: 5
  spaces: [roomy]
  orders: [贸易]
  staff: {roomy: 1}
  pre: 无
  summary: 贸易补货 100 GP + 每名据点卫兵 100 GP（据点有铁匠铺则减半）；补货后卫兵损失判定改投 1d8，事件后失效
- cn: 兵营
  en: Barrack
  level: 5
  spaces: [roomy, vast]
  orders: [招募]
  staff: {roomy: 1, vast: 1}
  pre: 无
  summary: 每次招募至多 4 名据点卫兵（免费）；宽敞容纳 12 名、庞大 24 名；每个据点可有多座
- cn: 半位面
  en: Demiplane
  level: 17
  spaces: [vast]
  orders: [增强]
  staff: {vast: 1}
  pre: 可以使用奥术法器，或可以将工具作为法器
  summary: 据点内一道门通往半位面；增强后 7 天内在半位面长休得 5 × 等级的临时生命；可用魔法动作造 5 GP 以下非魔法物件（每长休一次）
- cn: 游戏厅
  en: Gaming Hall
  level: 9
  spaces: [vast]
  orders: [贸易]
  staff: {vast: 4}
  pre: 无
  summary: 贸易开赌场 7 天，结束投 1d100 定庄家收入（见 harvest 表 gamehall）；设施雇员 4 名
- cn: 种植园
  en: Garden
  level: 5
  spaces: [roomy, vast]
  orders: [收获]
  staff: {roomy: 1, vast: 2}
  pre: 无
  summary: 加入时选四类之一（花园 / 菜园 / 草药园 / 毒素），改类型需 21 天；收获 7 天免费；庞大 = 两座同获
- cn: 温室
  en: Greenhouse
  level: 9
  spaces: [roomy]
  orders: [收获]
  staff: {roomy: 1}
  pre: 无
  summary: 每日黎明长出 3 颗复原之果（摘下 24 小时内吃）；收获 = 1 瓶高等治疗药水或 1 剂毒药（四种可选），7 天免费
- cn: 公会大厅
  en: Guildhall
  level: 17
  spaces: [vast]
  orders: [招募]
  staff: {vast: 1}
  pre: 专精于一项技能
  summary: 选一个公会（6 种范例，或与 DM 新建）；每次招募派会员执行一项任务，产出见 guild 表
- cn: 实验室
  en: Laboratory
  level: 9
  spaces: [roomy]
  orders: [制造]
  staff: {roomy: 1}
  pre: 无
  summary: 制造炼金工具制品，或 1 瓶毒药（焦引熏烟 / 乙醚精 / 蒙汗药），后者付半价、7 天
- cn: 图书馆
  en: Library
  level: 5
  spaces: [roomy]
  orders: [研究]
  staff: {roomy: 1}
  pre: 无
  summary: 研究 7 天，得三条此前不知道的准确情报（内容由 DM 定）
- cn: 冥想室
  en: Meditation Chamber
  level: 13
  spaces: [cramped]
  orders: [增强]
  staff: {cramped: 1}
  pre: 无
  summary: 增强后下次据点事件掷两次取一；连续 7 天在室内冥想，得两项属性豁免优势（1d6 掷两次）
- cn: 动物园
  en: Menagerie
  level: 13
  spaces: [vast]
  orders: [招募]
  staff: {vast: 2}
  pre: 无
  summary: 容 4 只大型（中小型四只折一只大型）；招募加入一只生物并按 menagerie / cr_price 表付费；栏内生物算据点卫兵
- cn: 天文台
  en: Observatory
  level: 13
  spaces: [roomy]
  orders: [增强]
  staff: {roomy: 1}
  pre: 可以使用法器
  summary: 长休后得天文护咒（免位施一次异界探知）；增强 = 7 夜观测，骰出奇数得一个护咒（黑暗视觉 / 英勇 / 活力）
- cn: 酒馆
  en: Pub
  level: 13
  spaces: [roomy, vast]
  orders: [研究]
  staff: {roomy: 1, vast: 4}
  pre: 无
  summary: 研究 = 间谍情报（7 天内 10 里内的大事、50 里内已知生物的位置）；供应一种魔法特饮（庞大两种），每回合可换
- cn: 圣物库
  en: Reliquary
  level: 13
  spaces: [cramped]
  orders: [收获]
  staff: {cramped: 1}
  pre: 可以将圣徽或德鲁伊法器作为法器
  summary: 长休后得圣物护咒（免位施一次高等复原术）；收获 = 祝圣护符，可替代 1000 GP 以下的法术材料成分，用后需重新祝圣
- cn: 圣器室
  en: Sacristy
  level: 9
  spaces: [roomy]
  orders: [制造]
  staff: {roomy: 1}
  pre: 可以将圣徽或德鲁伊法器作为法器
  summary: 制造圣水（可加钱，每 100 GP 多 1d8 伤害，至多 500 GP）或 9 级起圣物表魔法物品；在据点内短休可恢复一个 5 环以下法术位（每长休一次）
- cn: 圣坛
  en: Sanctuary
  level: 5
  spaces: [roomy]
  orders: [制造]
  staff: {roomy: 1}
  pre: 可以将圣徽或德鲁伊法器作为法器
  summary: 长休后得圣坛护咒（免位施一次治愈真言）；制造德鲁伊法器或圣徽，7 天免费
- cn: 圣所
  en: Sanctum
  level: 17
  spaces: [roomy]
  orders: [增强]
  staff: {roomy: 4}
  pre: 可以将圣徽或德鲁伊法器作为法器
  summary: 长休后得圣所护咒（免位施一次医疗术）；增强 = 7 天内受益者每次长休得等于等级的临时生命；回返真言可把圣所当目的地
- cn: 抄写室
  en: Scriptorium
  level: 9
  spaces: [roomy]
  orders: [制造]
  staff: {roomy: 1}
  pre: 无
  summary: 制造书籍抄本（需一本空白书）/ 3 环以下法术卷轴（付玩家手册价钱）/ 至多 50 份文书（每份 1 GP，可代发 50 里内）
- cn: 铁匠铺
  en: Smithy
  level: 5
  spaces: [roomy]
  orders: [制造]
  staff: {roomy: 2}
  pre: 无
  summary: 制造铁匠工具制品或（9 级起）武具表魔法物品；雇员 2 名
- cn: 马厩
  en: Stable
  level: 9
  spaces: [roomy, vast]
  orders: [贸易]
  staff: {roomy: 1, vast: 1}
  pre: 无
  summary: 自带 1 匹马或骆驼 + 2 匹矮种马或骡；贸易买卖坐骑，卖出额外加价 20%（13 级 50%、17 级 100%）；庞大容 6 只大型
- cn: 仓库
  en: Storehouse
  level: 5
  spaces: [roomy]
  orders: [贸易]
  staff: {roomy: 1}
  pre: 无
  summary: 贸易买进 500 GP 以内非魔法货物（9 级 2000、13 级 5000）或卖出，卖出额外加价 10%（9 级 20%、13 级 50%、17 级 100%）
- cn: 传送法阵
  en: Teleportation Circle
  level: 9
  spaces: [roomy]
  orders: [招募]
  staff: {roomy: 1}
  pre: 无
  summary: 招募掷骰（偶拒奇来）请来友好施法者，可请他施 4 环以下法师法术（17 级 8 环），14 天后或施法一次后离开；不参与防御
- cn: 剧院
  en: Theater
  level: 9
  spaces: [vast]
  orders: [增强]
  staff: {vast: 4}
  pre: 无
  summary: 增强 = 排练 14 天 + 演出 7 天以上；参与者做 DC 15 魅力（表演），过半成功者各得一枚剧院骰（d6；13 级 d8、17 级 d10）
- cn: 训练场
  en: Training Area
  level: 9
  spaces: [vast]
  orders: [增强]
  staff: {vast: 4}
  pre: 无
  summary: 选一名专业教练（5 种，见 coach 表）；增强 = 7 天课程，每天练满 8 小时者得该教练增益 7 天；可有多座
- cn: 陈列室
  en: Trophy Room
  level: 9
  spaces: [roomy]
  orders: [研究]
  staff: {roomy: 1}
  pre: 无
  summary: 研究 = 三条情报，或掷骰找饰品（骰出偶数得一件器具-普通表魔法物品），7 天
- cn: 作战指挥室
  en: War Room
  level: 17
  spaces: [vast]
  orders: [招募]
  staff: {vast: 2}
  pre: 战斗风格特性或无甲防御特性
  summary: 初始 2 名副官（至多 10）；每位副官使攻击事件的骰数 −1；招募 = 加一名副官，或集结军队（每人至多 100 名守卫，骑兵 20）
- cn: 工坊
  en: Workshop
  level: 5
  spaces: [roomy, vast]
  orders: [制造]
  staff: {roomy: 3, vast: 5}
  pre: 无
  summary: 选 6 种工匠工具；制造工具制品或（9 级起）器具表魔法物品；在工坊短休得英雄激励（每长休一次）；庞大 +2 雇员 +3 种工具

# --------------------------------------------------------------------------- #
# 据点事件（原文表「据点事件」1d100）
#
# dice  : 事件里要掷的骰；note 说明怎么结算
# --------------------------------------------------------------------------- #
event:
- min: 1
  max: 50
  key: fine
  cn: 一切顺利
  dice: 1d8
  note: 掷 fine_detail 表定细节；无机械后果
- min: 51
  max: 55
  key: attack
  cn: 攻击
  dice: 6d6
  note: 每掷出 1 死一名据点卫兵；无卫兵则随机一座特色设施受损，下个回合无法使用（不花钱）。据点有军械库且已补货 → 改投 1d8；作战指挥室每名副官使骰数 −1
- min: 56
  max: 58
  key: criminal
  cn: 罪犯雇员
  dice: 1d6
  note: 可花 1d6 × 100 GP 保下雇员；不保则被捕，若有设施因此无人值守，该设施下个回合无法使用
- min: 59
  max: 63
  key: opportunity
  cn: 机不可失
  dice: ""
  note: 花 500 GP 承办，可重掷一次据点事件（再出此结果则重投）；不花钱则无事
- min: 64
  max: 72
  key: visitor
  cn: 友好的来访者
  dice: 1d6
  note: 借用一座特色设施，付 1d6 × 100 GP；不影响该设施执行指令
- min: 73
  max: 76
  key: guest
  cn: 客人
  dice: 1d4
  note: 掷 guest 表；客人给推荐信 / 1d6 × 100 GP / 一名额外卫兵 / 一只护据点的怪物
- min: 77
  max: 79
  key: lost_hireling
  cn: 失去雇员
  dice: ""
  note: 随机一座特色设施失去全部雇员，下个回合无法使用；之后新雇员自动接手，不花钱
- min: 80
  max: 83
  key: magic_find
  cn: 魔法发现
  dice: ""
  note: 雇员找到或造出一件非普通魔法物品，必须是药剂或卷轴，由玩家选，不花钱
- min: 84
  max: 91
  key: refugees
  cn: 难民
  dice: 2d4
  note: 2d4 名难民求避；他们付 1d6 × 100 GP；会一直待着直至安置或据点遭袭
- min: 92
  max: 98
  key: aid
  cn: 请求援助
  dice: 1d6
  note: 每派一名据点卫兵投 1d6，和 ≥10 则解决并得 1d6 × 100 GP；和 <10 也解决但报酬减半，并死一名被派出的卫兵
- min: 99
  max: 100
  key: treasure
  cn: 宝藏
  dice: 1d100
  note: 掷 treasure 表定类别；艺术品按 gp 档掷表，魔法物品按主题 + 稀有度掷第七章表

# --------------------------------------------------------------------------- #
# 「一切顺利」的 1d8 细节（原文表）
# --------------------------------------------------------------------------- #
fine_detail:
- roll: 1
  text: 事故报告正在减少。
- roll: 2
  text: 天花板上的漏水处被修复了。
- roll: 3
  text: 没有发现鼠患的痕迹。
- roll: 4
  text: 「那家伙」又把眼镜弄丢了。
- roll: 5
  text: 你的一位雇员收养了一只流浪狗。
- roll: 6
  text: 你收到了朋友写来的一封令人欣喜的信件。
- roll: 7
  text: 某些爱开玩笑的人一直在往人们的鞋子里放臭鸡蛋。
- roll: 8
  text: 有人声称自己看见了鬼魂。

# --------------------------------------------------------------------------- #
# 「客人」的 1d4（原文表）
# --------------------------------------------------------------------------- #
guest:
- roll: 1
  text: 一位非常有名的人，暂住 7 天，离开时给一封推荐信（DMG 第三章「名望的标志」）
- roll: 2
  text: 寻求庇护的客人，7 天后离开，赠 1d6 × 100 GP
- roll: 3
  text: 一位雇佣兵：额外一名据点卫兵，不占设施空间，直至被杀或被你送走
- roll: 4
  text: 一只友好态度的怪物（如黄铜龙、树人）：据点遭袭时替你挡一次，你损失 0 名卫兵，之后离开

# --------------------------------------------------------------------------- #
# 「宝藏」的 1d100（原文表）
# kind: art = 掷艺术品表；magic = 掷第七章魔法物品表
# --------------------------------------------------------------------------- #
treasure:
- min: 1
  max: 40
  kind: art
  value: 25
  cn: 25 GP 艺术品
- min: 41
  max: 63
  kind: art
  value: 250
  cn: 250 GP 艺术品
- min: 64
  max: 73
  kind: art
  value: 750
  cn: 750 GP 艺术品
- min: 74
  max: 75
  kind: art
  value: 2500
  cn: 2500 GP 艺术品
- min: 76
  max: 90
  kind: magic
  value: 0
  rarity: 普通
  cn: 普通魔法物品（自选主题：奥秘 / 武备 / 器具 / 圣物）
- min: 91
  max: 98
  kind: magic
  value: 0
  rarity: 非普通
  cn: 非普通魔法物品（自选主题）
- min: 99
  max: 100
  kind: magic
