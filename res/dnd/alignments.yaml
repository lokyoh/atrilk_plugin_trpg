# 阵营表（建卡第四步：选择阵营）
#
# 手册 2320-2347：阵营由「道德倾向（善良 / 邪恶 / 中立）」×「对秩序的态度
# （守序 / 混乱 / 中立）」界定，共九种；不具备理性思维的生物**无阵营**。
# D&D 预设玩家角色不属于邪恶阵营（要演邪恶先跟 DM 说一声）。
#
# ⚠️ 阵营是**纯角色扮演标记，没有任何机械效果**——引擎只在角色卡上记下它，
# 不参与任何检定、豁免或结算。所以它也是最可以留空的一项（见 ``creation.py``
# 「选择阵营」一步允许回复「跳过」）。

- key: lg
  cn: 守序善良
  en: Lawful Good
  desc: 尽力做社会认为正确的事；毫不犹豫地与不公作斗争、保护无辜者。

- key: ng
  cn: 中立善良
  en: Neutral Good
  desc: 尽其所能行善，在规则限度内行事，但不觉得被规则束缚。

- key: cg
  cn: 混乱善良
  en: Chaotic Good
  desc: 依照良心行动，几乎不在意别人怎么想。

- key: ln
  cn: 守序中立
  en: Lawful Neutral
  desc: 依法律、传统或个人信条办事，不为他人请求或诱惑动摇。

- key: n
  cn: 绝对中立
  en: Neutral
  desc: 宁可回避道德问题、不愿选边，按当时看来最好的做法行事。

- key: cn
  cn: 混乱中立
  en: Chaotic Neutral
  desc: 按一时奇想行事，认为个人自由比其他一切都重要。

- key: le
  cn: 守序邪恶
  en: Lawful Evil
  desc: 在传统、忠诚或秩序的规定之内有条理地获取想要的东西。

- key: ne
  cn: 中立邪恶
  en: Neutral Evil
  desc: 不在意追逐自身欲望时造成破坏。

- key: ce
  cn: 混乱邪恶
  en: Chaotic Evil
  desc: 随意施暴，受憎恨或嗜血欲望驱策。

- key: unaligned
  cn: 无阵营
  en: Unaligned
  desc: 缺乏理性思维能力的生物没有阵营归属（玩家角色一般用不上）。
