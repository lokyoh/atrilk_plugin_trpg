# 背景表（建卡第 2 步：确定起源）
# 一条一个背景：属性提升（三项）、起源专长、两项技能熟练、一项工具、起始行装。
#
# ``bonus`` 是 PHB 2024 的「属性值提升」三项属性（手册第二章 2085「属性值与背景」表）：
# 玩家在其中选一项 +2、另一项 +1，或三项各 +1（上限 20）。种族**不再**提供属性加值。
#
# ``feat`` 是 2024 起背景固定给的**一项起源专长**（第五章 4099）——不是 2014 那种
# flavor 的「背景特性」文案。带括号的是需要同时定下子选项的专长
# （如「魔法学徒（牧师）」= 魔法学徒选牧师法表）。
#
# 2024 背景**不给语言**（第四章 3143-3155 背景组件只有 属性值/起源专长/技能/工具/行装）；
# 语言来自第二章独立的「选择语言」步（2129-2163：通用语 + 从标准语言表选 / 掷 2 门）。
# 工具每人**只给一项**（可以是「一种工匠工具」这类让玩家自选的说法）。

