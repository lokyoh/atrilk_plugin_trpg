#
# ``bonus`` 是 PHB 2024 的「属性值提升」三项属性（手册第二章 2085「属性值与背景」表）：
# 玩家在其中选一项 +2、另一项 +1，或三项各 +1（上限 20）。种族**不再**提供属性加值。

