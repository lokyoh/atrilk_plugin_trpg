  languages: 能理解它生前所说的所有语言，但不能说话
  desc: 黑暗中的某处传来断断续续的咕噜呻吟声。一个拖着残腿，举着肿胀胳臂和破损手掌的身影，蹒跚地出现在视野。僵尸不停的前进，摧毁任何未能逃脱的生物。 这些丧尸是由三十年前霍特诺山喷发时的魔法灾难所创造。它们使用丧尸资料卡，并具有以下额外特性。
    丧尸第一次受到伤害时，其5尺范围内的任何活体生物必须成功通过DC 10的体质豁免检定，否则在攻击检定、豁免检定和属性检定上获得劣势，持续1分钟。生物可以在其每回合结束时重复进行豁免检定，若成功则提前终止效应。
