  senses: 黑暗视觉 60 尺、被动察觉 15
  languages: 雪怪语
  desc: 雪怪要么独自狩猎，要么以小家族为单位行动。它们避开其他生物的定居点，但潜伏在商人和牧人经常出没的路径附近，以捕食毫无戒备的猎物。雪怪在冰冻山峰附近的冰洞中安家，那里是几乎无人敢去的极寒之地。 冰封荒野的冰冷潜行者 跨越高山极地和冰冻边疆，雪怪猎杀那些闯入它们领地的入侵者。它们隐居且无情，形似巨型猿猴，拥有苍白的皮毛和类似公羊的角。雪怪能够轻易融入雪地和冰崖之中，在发动攻击前，以令人毛骨悚然的嚎叫显露身形。除了强大的体力，雪怪还能用目光冻结生物，将敌人冰冻在原地，并且能够召唤冰块并向敌人投掷。
    由于雪怪的难以捉摸，关于雪怪的民间传说比目击事件更为常见。远处的尖叫是愤怒的雪怪嚎叫，还是仅仅是风声，鲜有人能够确定。尽管如此，许多山地定居点会燃起篝火来驱赶雪怪，利用这些野兽对火的厌恶。 在雪怪中，我找不到任何亲情、理解或怜悯。他们的力量并非来自山脉，也非源自冰川奇迹的魔法。他们的世界和谐被谋害并冻结。
