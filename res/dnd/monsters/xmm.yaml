  desc: 吸血鬼的仆从是活人，他们或自愿或因不死主人的胁迫而服务。他们通过武器引导死亡能量，使毫无防备的目标失去行动能力，让受害者成为他们吸血鬼主人的无助猎物。 许多吸血鬼仆从渴望最终成为吸血鬼，而有些则是被魔法魅惑或作为某种可怕契约的一部分而服务。在所有情况下，这些吸血鬼仆从都表现出他们被吸血鬼腐化的迹象，例如尸体般的肤色、不可思议的反应能力以及他们主人频繁进食的证据。如果吸血鬼主人被摧毁，吸血鬼仆从将失去其超自然能力并恢复到原本的人形状态。
    黑夜吸血的领主 吸血鬼隐藏了他们被诅咒的永生本性，假扮成凡人以吸食活人的鲜血。虽然最年轻的吸血鬼可能只是他们创造者的嗜血奴仆，但最年长的吸血鬼则拥有难以置信的狡诈和对夜间超自然力量的控制。 不死的吸血鬼在白天处于休眠状态，退避到远离敌人和太阳灼热光线的安息之所。从吸血鬼安息之所表中掷骰或选择一个结果，来激发吸血鬼的阴森庇护所。
    吸血鬼休息处 吸血鬼和吸血鬼暗影领主会为自身打造远离生者的庇护所，无论是隐匿于繁华都市中，还是在生前栖息的废墟深处。 亲爱的，你真是令人陶醉...
