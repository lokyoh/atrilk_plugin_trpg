  desc: 黑暗中的潜伏者 披风怪是幽暗地域中神秘的掠食者，因其攀附在墙壁上时状似悬挂的斗篷而被冒险者们如此命名。它们自称什么尚不得而知，甚至它们是否会自称也是个谜。尽管它们无疑具有智慧，但它们的行为往往令人难以捉摸。 夺心魔有时会聚集在幽暗地域的飞地中，但它们很少建立定居点或形成社会结构。大多数夺心魔作为孤独的掠食者行动，潜伏在阴暗的地下深处或被遗弃的地牢中——有时一次会潜伏数月——等待猎物经过。它们利用斑驳的皮肤与周围环境融为一体。当毫无戒心的猎物靠近时，夺心魔会展开身体，试图抓住并用它们强大的翅膀将受害者窒息。
    潜影怪喜欢恐吓敌人。除了伏击手段外，潜影怪可以创造自身的幻象复制体，并发出超现实的呻吟声，这些声音以无法解释的原始方式令非潜影怪生物感到恐惧。潜影怪可能会连续数日戏弄迷失在地底世界的探险者，在攻击之前恐吓并驱散他们。它们很少与其他生物交谈，除了对那些即将被它们吞噬的生物低声说出诡异的谜语。
