    目标在24小时内免疫此鸟妖的诱惑之歌。
  senses: 被动察觉 10
  languages: 通用语
  desc: 带翼的末日之声 充满仇恨的生物，鹰身女妖致力于制造痛苦，终结爱与生命。这些怪物结合了类人的特征与食腐鸟类的利爪和翅膀。她们臭名昭著的歌曲迫使听众追随她们，无视危险。被鹰身女妖的歌曲所迷惑的生物经常在她们凶恶的爪子下或在自然险境中丧命。
    鹰身女妖居住在偏远、阴暗的地方，这些地方被悲剧和绝望所污染。有些传说声称鹰身女妖冒犯了众神，因此被转化为一种惩罚；她们也可能是这些被诅咒灵魂的后代。 每个鹰身女妖都会唱一首独特的歌曲。虽然有些歌曲据说因其美丽而令人心碎，但其他歌曲则只是刺耳的尖叫，只能吸引那些被魔法迷住的生物。
