  desc: 永恒的异界阴谋家 在水底深渊之中，底栖魔鱼追忆着已陨落的帝国，编织着跨越时代的阴谋大计。这些行踪不定的两栖不朽者会同时从肉体和精神上击垮他们的受害者，然后使用它们滑腻的畸变侵蚀改造这些生物，将其他生物转变为在波涛之下为他们服务的仆从。
    底栖魔鱼拥有令人恐惧的智慧和异质的思维。它们承载着对原初世界和多元宇宙伊始时的神秘领域的完美记忆。它们隐藏的秘密数不胜数，不可测度。底栖魔鱼蛰伏于充满原初秘藏的地点：沉没帝国的遗迹、隐秘的魔法节点、或是位面间的薄弱之处。在这些巢穴中，底栖魔鱼追思过去的纪元，统御成群的心灵奴仆，吞噬着失去知觉的受害者的神智，为重夺大权做着准备。
    底栖魔鱼的异界目标与手段常令其他生物难以理解。掷一次底栖魔鱼阴谋表或从中选择一个结果来作启发其阴谋。 所谓理性只是一种脆弱的谎言，在时间长河的河岸之上，它显得赤裸又易碎。但在古老恐惧的梦境秘库中，翻涌着骇人的真理之海。现世不过孤岛，而原初潮去，正昭示着冥河潮来。
    底栖魔鱼阴谋 阿波罗斯通常居住在水下的废墟底栖魔鱼通常栖息于水下废墟与洞窟中。它们会保留干燥的区域以供来自陆地的仆从生活，并用以存放一些不防水的宝藏。 和洞穴中。它们会为它们的陆地仆从保留充满空气的空间，并储存那些会被水损坏的宝藏。
