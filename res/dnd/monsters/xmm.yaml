  desc: 混乱与无序的恶魔 小恶魔不知疲倦地进行破坏，通过恶毒的恶作剧、离间和伏击来散播混乱。这些微型恶魔利用混乱和暴力来恐吓他人。通过变形为无害但不祥的生物或进入隐形状态，小恶魔潜入各处为邪恶的主人充当间谍或设置恶毒的陷阱。小恶魔喜欢躲在黑暗的地方，在最意想不到的时刻突然出现，用它们中毒的爪击挥砍敌人。
    小恶魔通常被其他恶魔忽视和低估。这驱使它们通过残忍行为或寻找通往物质位面的道路来证明自己。在凡人中，小恶魔散布无意义的混乱，并可能在暴力的邪教徒和施法者中找到志同道合的邪恶灵魂。 一件事情并不需要很大就能令人胆战心惊。试想一下那些对蜘蛛感到恶心的人。现在想象一只像猫一样大的蜘蛛，而且它还想偷走你的舌头。
