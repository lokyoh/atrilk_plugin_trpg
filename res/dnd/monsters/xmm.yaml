  desc: 大地与岩石的原始之灵 来自元素位面土元素界的原始灵魂与岩石和矿物融合，形成土元素。这些生物拥有强壮的肢体和粗糙的外表，有时镶嵌着矿石、宝石、水晶、彩色条纹或活体植物。在主物质位面，土元素通常为那些召唤它们的人服务，或者出现在受其家园位面影响的区域，如水晶节点、活跃的断层线或魔法矿石的矿脉。土元素可以轻易地穿过石头，并用它们强大的拳头摧毁整个建筑物。
    土元素通常不仅仅由泥土构成。虽然元素生物的构成不会改变其属性或具有金钱价值，但它使每个元素生物都独一无二。从土元素构成表中掷骰或选择一个结果，以激发土元素的特征。 土元素构成物 我们家园的基石，我们武器的力量，我们最大秘密的宝库——大地无异于现实本身的控制。它是最强大的元素。这一点无可否认。
