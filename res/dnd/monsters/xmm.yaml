  - 动作·粘性捕网（1/日）：敏捷豁免 DC 10，单一 15 尺内寇涛可见的不超过大型的生物。失败： 目标陷入束缚状态直至捕网被摧毁（AC10；HP5；免疫钝击，毒素和心灵伤害）。一名生物能够以动作进行一次DC 10的力量（运动）检定来尝试解救自身或位于自身
    5 尺内困在捕网中的其他生物，成功则摧毁捕网。
  senses: 黑暗视觉 120 尺、真实视觉 30 尺、被动察觉 14
  languages: 地底通用语
  desc: 寇涛鱼人会在幽暗地域中洗劫附近的废墟和社区。他们的盾牌上覆盖着粘液，用来解除敌人的武装，并使用粘滑的网捕捉受害者。他们通常努力活捉敌人，并将俘虏拖到他们的隐秘巢穴中。 大多数寇涛鱼人出于信仰和恐惧的结合，会遵循更强大的领袖的命令。在极少数情况下，寇涛鱼人可能会放弃自己的社群，过着隐居或流浪的生活。这样的寇涛鱼人可能对幽暗地域知之甚多，但他们生活在对曾经抛弃的奇怪神祇的恐惧中。
    深海鱼人狂热者 寇涛鱼人拥有粘滑的类人身体和圆眼睛深海鱼的头。他们声称曾经统治过整个世界，在鱼神的庇护下，他们的帝国遍布陆地和海洋。寇涛鱼人无法说出是什么灾难终结了他们辉煌的文明，但精灵、人类、夺心魔和寇涛鱼人的神明首当其冲地受到他们的指责。从地表陆地和海洋撤退后，寇涛鱼人隐居在深邃的海沟和幽暗地域的海洋中。在这些隐秘的领域里，寇涛鱼人沉湎于他们所失去和遗忘的一切，策划着报复那些可能从未发生过的侮辱的阴谋。
    寇涛鱼人憎恨地表和幽暗地域的文明，他们认为自己是古老轻视和持续阴谋的受害者。寇涛鱼人会策划复杂的阴谋以推动他们自身的统治地位，常常绑架人们以获取他们的秘密，或者向怪异的神灵做出可疑的献祭。为了便于实施这些阴谋，寇涛鱼人试图用网或奇怪的武器活捉生物。居住在幽暗地域的卓尔、矮人和侏儒，以及靠近淹没地下通道的地表社区，常常成为寇涛鱼人袭击和其他阴谋的目标。
    寇涛鱼人经常为堕落的幕后主谋服务，如底栖魔鱼和海怪。这些寇涛鱼人相信这些强大的生物是寇涛神祇的化身或他们自身的神灵。寇涛鱼人可能会暂时与其他邪恶生物结盟，但随着寇涛鱼人领袖解读他们反复无常的神祇的征兆，这些联盟也会发生变化。 寇涛鱼人一直在寻求安抚他们神秘莫测的神明。然而，很少有寇涛鱼人能够对他们神明的身份达成一致，而且不同寇涛鱼人社区之间几乎没有一致性。只有海之母布莱卜杜普尔普，一个拥有人类身体但头部和钳子类似小龙虾的存在，得到了广泛的崇拜。
    由于缺乏关于他们其他神祇外貌的信息，寇涛鱼人祭司会为这些神祇发明新的形态，利用手边的任何物品创造出神圣的偶像。但无论这些寇涛鱼人祭司是从信仰、妄想、异变的天赋，还是某种更陌生的超自然来源中汲取力量，总有某种力量回应他们的祈求。你可以投掷两次或从寇涛鱼人神祇特征表中选择结果，以启发寇涛鱼人如何表现一位神祇。
    鱼人神祇特征 寇涛鱼人通常围绕他们认为对其神祇重要的地点组织社区。这些地点可能是建筑或一系列洞穴，大多数都包含有空气的和淹没的腔室。这些地点内的重要场所暗示了寇涛鱼人信仰的仪式、寇涛鱼人神祇的要求或寻求预兆的大祭司的奇想。与寇涛鱼人的神祇一样，这些地点的特征因社区而异。从"寇涛鱼人仪式地点表"中掷骰或选择一个结果，以激发灵感并为寇涛鱼人社区内的冒险提供建议。
    寇涛仪式地点 当尸月升起，浮物潮涌来，戈格勒们便从海底的坑穴中升起。他们咕噜作响，臭气熏天，如同我们在黎明时分捕鱼一般，在夜晚的海岸上垂钓。
  environment: 海岸、幽暗地域
