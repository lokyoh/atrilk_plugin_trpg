  desc: 融合了魔鬼力量的凡人 坎比翁曾是凡人，但他们遭到了邪魔力量的腐化或被一个诡谲存在所附身。与具有少量邪魔血统的自由意志个体——提夫林相比，坎比翁则从本源上与下层位面的邪恶魔法相绑定，或受其重塑。 许多坎比翁为作为其力量来源的邪恶势力效力。另一些坎比翁则试图篡夺其创造者的力量，或获得属于它们自己的异界力量。在此类坎比翁之中最臭名昭著的就是埃乌兹，这位成为了邪恶半神的反派掌控着的邪恶国度正威胁着奥斯世界的自由都市灰鹰。
