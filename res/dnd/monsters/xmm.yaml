  senses: 黑暗视觉 120 尺、被动察觉 16
  languages: 深潜语、地底通用语; 心灵感应 120 尺
  desc: 魔法束缚眼魔眷族 通过涉及四个眼魔眼柄的神秘仪式，施法者可以将异常梦境塑造成一个类似眼魔的守护者。这种被称为观者的生物通过此类仪式召唤而来，外观类似眼魔，拥有五只魔法眼睛——一只中央眼和四只位于其球形身体顶部的眼柄上。 观察者为它的召唤者服务101年，期间会守护施法者选择的某个东西——通常是一件宝物或一个地点。观察者是一位可靠的守卫，只允许其召唤者接触它所保护的东西。观察者可能会与其他生物交谈，公开讨论它的命令和召唤它的魔法使用者，但观察者没有自己的野心，也不会放弃它的岗位。如果有入侵者无视它的警告，观察者会尝试用它的魔法眼射线驱赶入侵者。
    在完成服务后，一个观察者可能会消散回虚无或漫游离去，寻求了解更多多元宇宙的知识。
