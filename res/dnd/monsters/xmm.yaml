  - 动作·幽影吐息：敏捷豁免 DC 17，60尺锥状区域内的每名生物。失败： 35（）暗蚀伤害。成功： 半伤。成败： 因此伤害生命值降至0的类人生物死亡，且从其尸体中浮现一只幽影。该幽影受幽影龙控制，使用与幽影龙一样的先攻在其回合结束后立即执行回合。
  - 传奇·猛扑：红龙移动至多等于其速度一半的距离，并发动一次撕裂攻击。
  - 传奇·幽影纱幕：幽影龙使用幽影隐匿，且10尺内的一名其可见的生物受到10（）暗蚀伤害。幽影龙直至其下个回合开始都无法再执行此动作。
  senses: 盲视 30 尺、黑暗视觉 120 尺、被动察觉 21
  languages: 通用语、龙语
  desc: 被黑暗腐化的巨龙 暗影龙出没于被遗忘的、黑暗无光之地。虽然它们曾经可能是其他类型的龙，但位面力量、负能量或邪恶魔法的影响剥夺了它们原有的颜色或光泽。取而代之的是，暗影龙呼出黑暗的气息，汲取它所触及的一切生命。那些被暗影龙的吐息夺去生命的人会作为阴影重生，并服从于暗影龙的意志。
    暗影龙通常栖息在地底幽暗地域，特别是与影界或其他幽暗领域相连的区域。在某些情况下，它们可能潜伏在它们转变为暗影龙之前所偏好的黑暗腐化之地。杂草丛生的沼泽、坟墓般的沙漠废墟以及被灰烬覆盖的火山是暗影龙的自然巢穴。 与其他许多龙类一样，影龙也会收集财宝。它们的品味往往比较病态——收集来自毁灭帝国的硬币以及受害者的头骨。
    影龙栖息在黑暗与绝望之地，如受诅咒的废墟、幽暗地域的深处或影界。 若尔等真为传说中的冒险者，当寻那藏于雷霆峰下之巨大暗影巨龙，凯旋而归时高举其传说中的暗影之眼。
