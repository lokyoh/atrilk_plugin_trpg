  - 施法·魅惑 （充能 5-6）：吸血鬼施展魅惑类人，无需法术成分并使用魅力作为施法属性（法术豁免DC 17），且其持续时间变为 24 小时。以此被魅惑的生物即吸血鬼啃咬的自愿目标，此时造成的伤害不会结束该法术。法术结束后，目标不会意识到自己被吸血鬼魅惑过。
