    骸骨纳迦通常听命于将它们复活的始作俑者，作为不知疲倦的守卫为其服务，并向它们分享生前所积累的秘闻。亡灵之躯扰乱了骸骨纳迦生前享有的完美记忆力，使它们残缺不全，或让其中细节如破碎的拼图般错乱交织。 在极少数情况下，骸骨纳迦会延续它们生前的未竟之志，而非侍奉其他生物。大多数具有自由意志的骸骨纳迦都是自阴魂纳迦的遗骸中唤起的邪恶存在，但在特殊情况下，自守秘纳迦中创造而来的骸骨纳迦尽管其思维错乱，却能依旧秉持善良之心。
