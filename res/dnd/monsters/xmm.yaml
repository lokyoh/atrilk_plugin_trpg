  - 动作·石化吐息：体质豁免 DC 15，30尺锥状区域内的每名生物。 目标陷入束缚状态，在其下个回合结束时若仍处于束缚则重复豁免，成功则终止其身上的该效应。 目标陷入石化状态替代其束缚状态。
  senses: 黑暗视觉 60 尺、被动察觉 17
  languages: ''
  desc: 大多数石化铁牛都是被石化气体云环绕的铁牛。它们的金属板光泽和颜色各异，从光滑的银色到坑洼的黑色不等。最古老的石化铁牛可能覆盖着锈红，但这很少影响它们的属性。这些石化铁牛的践踏之地散落着石化敌人的破碎残骸。许多石化铁牛比它们的创造者多活几个世纪，误导一些人认为这些造物有自然起源和领地。大多数这样的石化铁牛继续遵循古老的命令，守卫着早已沦为废墟的地点。
    如公牛般的守护者，拥有石化吐息 形似身披铁甲的巨大公牛，牛头人是栩栩如生的自动装置，它们会摧毁所有进入其领地的生物。除了用致命的角戳刺敌人以及用铁蹄践踏他们之外，牛头人还会喷出阵阵毒气。 石化铁牛是由施法者创造出来作为守卫的。创造石化铁牛的过程既费时又危险，其中一种方法需要将一头公牛骨架、一个美杜莎的鲜血和一个蛇怪的脑部融合到一个被施了魔法的铁制框架中。如果过程失败，石化的气体会从材料中冒出，形成一个可以充满建筑物并持续存在多年的魔法威胁。
    当魔法使创造出蛇发女妖时，他们常常会对其进行附魔，使其忽略那些使用特定指令密钥对抗该生物的人，通常是一个口令或特定的信号。一旦蛇发女妖被设定为守卫某个区域，它会攻击任何进入者，直到他们逃走或被消灭。如果有人提供了指令密钥，这怪物会忽略该入侵者，只要入侵者保持在它的视线范围内。但如果入侵者离开视线范围后再返回而没有再次出示指令密钥，蛇发女妖就会发动攻击。那些在蛇发女妖领地内的人必须保持警惕，并时刻注意该怪物的确切位置，否则他们可能会被他们认为不再构成威胁的蛇发女妖攻击。
    那些创造石化铁牛们的人努力赋予它们故意眩目的指挥钥匙。关于指挥钥匙的提示可能可以在石化铁牛的创造者的档案中找到，或者在石化铁牛保护的区域内——也许是作为一个石化入侵者的最后行为潦草写下的。掷骰或从石化铁牛指挥钥匙表格中选择一个结果来激励暂时使石化铁牛中立的词语或信号。
    蛇发女妖指挥钥匙 在我那位古怪祖先零散的设计中，最引人注目的是一张栖息于沼泽的牛形怪物的示意图，以及一句不祥的笔记："做得更好。"
