  senses: 真实视觉 120 尺、被动察觉 14
  languages: 魔冢语
  desc: 五面体负责监督和保护下级魔冢的部队。在做出决策时，它们会迅速召集其他魔冢开会，会议通常很冗长。 多元宇宙法则的机械化守护者 既是魔法也是机械的造物，魔像体现了绝对的秩序。这些来自机械境麦卡努斯的居民维护着他们秩序井然家园中的惊人机制，并在整个多元宇宙中对抗混乱力量。
    模组怪是一个庞大等级体系的一部分，从古怪的单体模组怪到它们种族的领袖——神一般的普里穆斯。每个模组怪都会执行由更高阶模组怪分配的任务，并且毫无质疑地完成。通常，模组怪只与自己同阶或相邻阶层的其他模组怪交流。那些相差超过一级的模组怪往往要么过于先进，要么过于简单，以至于它们无法理解。
    魔判精擅长需要耐心与精确性的任务，但对艺术或幽默等非字面概念理解甚少。它们没有自我意识，眼中只有工作，并坚信多元宇宙法则的运行仰赖它们的效率。 在极少数情况下，一个魔像会失控并发展出自己的意志。在这种情况下，其他魔像会被派去回收或摧毁它们故障的同族。
    无论是为了侍奉守序神祇，还是作为伟大魔登游行的部分，魔登们会从机械境出发，将他们的律法愿景传播到其他存在位面。投掷或从魔登行动表中选择一个结果，以启发是什么努力引导了一群魔登前往其他位面。 魔冢行动 向导发誓「哔哔啵啵」意思是「你好，朋友。」我不知道他们为什么追着我们！
