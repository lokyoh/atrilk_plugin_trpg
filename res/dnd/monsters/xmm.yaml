  senses: 被动察觉 18
  languages: 通用语、吉斯语
  desc: 这些强大的灵能者负责监管吉斯泽雷庇护所，研究神秘的位面事件，并领导rrakkma——对夺心魔殖民地进行敌对突袭，以杀戮夺心魔并揭露古代吉斯人如何被转化的秘密。 现实边缘的探索者 吉斯泽莱人是瘦削的类人生物，外表与吉斯扬基人完全相同。他们与吉斯扬基人共享一段历史，都是由灵吸怪在身体和精神上进行改造的生物（参见"吉斯扬基"部分）。吉斯泽莱人深知，他们的种族在身体和心灵上都曾被过去的灵吸怪压迫者所操纵。然而，他们没有屈服于这种操纵，而是遵循他们第一位领袖泽西蒙的教导，重塑自己的心灵和身体，以寻求内心的平静。
    吉斯泽莱人在多元宇宙的混乱领域中用心灵力量创造宁静、隐匿的庇护所。这些据点大多漂浮在混沌位面利穆博，但吉斯泽莱的集会也可以在无底深渊、元素混沌和妖精荒野中找到。吉斯泽莱人创建这些隐修所是为了磨练他们的心灵异能，从多元宇宙中获取洞见，并躲避吉斯洋基人和夺心魔。
    角色可能会以各种方式被卷入涉及吉斯泽莱人和吉斯洋基人的冲突中。掷骰或从吉斯冲突表中选择一个结果，来激发以这些古老的对手为特色的冒险。 吉斯冲突 我们吉斯泽莱人渴望挑战，这样当泽西蒙回归时，他会发现我们已做好准备。因此我们前往呼啸的混沌境，建立我们的新家园。
