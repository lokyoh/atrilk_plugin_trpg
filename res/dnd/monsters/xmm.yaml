  desc: 幼虫魔对他们过去的生活有着零碎而痛苦的记忆。大多数幼虫魔会极力避开其他生物。 堕落灵魂的适当命运 被诅咒到下层位面的灵魂常常会变成幼虫魔——一种令人厌恶、类似蛆虫的生物，其扭曲的特征让人联想到它们生前所拥有的模样。这些可怜的生物几乎无助，并努力逃离下层位面更强大居民的注意。许多恶魔将幼虫魔视为美味佳肴，而邪恶的魔法使则发现幼虫魔在堕落的仪式中非常有用。夜巫经常收集和放牧幼虫魔，并将它们交易给多元宇宙中的邪恶势力。
