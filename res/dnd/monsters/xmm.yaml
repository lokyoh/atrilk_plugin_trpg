  senses: 真实视觉 120 尺、被动察觉 19
  languages: 所有
  desc: 不灭魔法大师 一些邪恶的魔法师进行禁忌的死灵仪式，将自己的灵魂与肉体分离，转化为巫妖，成为魔法与不死的掌控者。巫妖将灵魂保存在隐秘的遗物中，操纵自己的尸骸，追求摆脱凡人束缚的野心。 巫妖拥有非凡的狡诈和魔法造诣，他们利用非自然的永生来追寻少数人能在单一生命中掌握的奥秘。他们那令人不安的目标促使他们深入探索生命、多元宇宙、神性以及更为深奥的主题。巫妖对人类生命或欲望漠不关心，他们不惜一切代价实现自己的目标。
    巫妖的年龄和起源会影响其形态。较老的巫妖看起来更像是穿着被遗忘帝国腐朽华服的脆弱骨架，而较年轻的巫妖则更接近活物，并穿着现代服装。许多巫妖会用他们理想化的凡人形态的幻象来遮蔽自己。 尽管巫妖不惧怕死亡，但它们无法免于时间的摧残。历经岁月，一些巫妖会失去与时间和物质世界的联系，逐渐退化为半巫妖。
    成为巫妖的过程复杂、危险且对每个潜在的巫妖来说都是独特的。如果仪式成功，巫妖的灵魂将被绑定到一个灵魂罐中，这是一个特别准备的魔法容器。这件遗物将巫妖的灵魂锚定在世界中，并在巫妖的身体被摧毁时保护它。只有当灵魂罐被毁坏时，巫妖才能被彻底杀死。因此，巫妖会竭尽全力隐藏和保护它的灵魂罐。
    灵魂容器通常是小型且制作精良的物品，对于巫妖生前有着重要意义。掷骰或从巫妖灵魂容器表中选择一个结果，以启发巫妖隐藏其灵魂的位置。 巫妖命匣 巫妖们会在异位面堡垒、拥有诅咒之名的城堡或其他致命的避难所中建造隐蔽的魔法知识图书馆和奥术实验室。
    野心可能成为心灵和精神的瘾疾。它从驱动之火逐渐演变成险恶的地狱烈焰，将法师烧得空有其表，直到只剩下对更多魔法力量的渴望
