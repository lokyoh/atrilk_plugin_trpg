  desc: 神明的护佑具现 作为预言的具象和神圣秘密的守护者，羽蛇确保命运能按其既定方式发展。它们形似长有彩虹羽翼的大蛇，每一位都是神圣旨意——一种由正义神明裁定的永恒真理或命运——的具现。羽蛇常出没于远古力量的所在之地，在那里它们守护隐秘的魔法，或确保预言内容的成真与否。偶尔，也有羽蛇会守护某个社群，或伪装起来游历四方，解读征兆或操控因素以确保命运转向正确的轨迹。
    受永恒使命的驱使，羽蛇有时会表现出莫测高深或充满敌意的行为。它们坚定不移且毫不妥协，因为它们的存在从根本上就与神圣使命紧密相连。但它们仅会在绝对必要时，才会伤害其他生物，以实现神圣目标。 每条羽蛇都会在一个时代结束时经历一次周期性重生。在羽蛇的生命周期里，一个时代可能对应天体历法或某种神圣年表。在时代接近尾声时，羽蛇会诞下一枚奇妙的、彩虹色的蛋。当时代终结时，羽蛇便会死亡。在一段时间内——可能到某一天，也可能直到某个年度太阳事件——羽蛇的工作会暂时无人接替。一旦这段时间过去，产下蛋的同一条羽蛇便会从蛋中孵化，完全成熟并焕然一新，继续为下一个时代服务。
