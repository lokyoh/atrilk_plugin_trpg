  desc: 大多数年轻的黑龙会占据一个隐藏的巢穴，通常是一个可以通过致命废墟或险恶沼泽进入的阴暗之地。它们喜欢利用恐惧的仆从，并且可能会恐吓小型社区或强制一群狗头人或穴居人成为其侍从。有些会与强大的不死生物如死亡骑士和吸血鬼，或是异怪如底栖魔鱼和寇涛鱼人结盟。
    腐朽与绝望之龙 黑龙乐于观赏痛苦与毁灭。其他色彩龙族常竞逐权力与财富，然而黑龙却会试图摧毁所见的一切事物——并统治那些幸存下来的。 黑龙相貌可怖，生着一对弯曲双角以及枯槁面容，其形象恍若邪魔的颅骨。它们通常居住在死水腐沼、坍圮废墟、以及被魔法或环境所腐化之地。黑龙的强酸吐息在其领地上留下无数疤痕，蚀毁古老的雕像，令自然世界溃烂流脓。
    黑龙囤积着早已褪色的希望之证和倾颓帝国的遗物。越是世人渴求之物，黑龙便越珍视——尤其是自己亲爪夺走的那些。 黑龙栖息于荒芜的废墟，染污的沼泽，以及其他被腐朽所侵蚀之地。
