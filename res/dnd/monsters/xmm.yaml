  senses: 盲视 60 尺、被动察觉 14
  languages: 深潜语
  desc: 穿梭于世界之间的奇异猎人 有着从脑状身体中伸出的带刺触须，格雷尔在无光的深处狩猎。这些无声的捕食者无视重力，使它们能够从意想不到的地方发起攻击，并通过声音和电场感知周围环境。它们的触须分泌麻痹毒液，这使得大多数被格雷尔伏击的生物在被拖入黑暗并吞噬之前无法发出尖叫。
    格里尔是知性生物，但它们的智力和动机对大多数生物来说都是陌生的。它们通常只有在对付更强大的猎物时才会相互合作。大多数格里尔对创造事物或与其他生物（包括同类）交流都毫无兴趣。 许多格雷尔追求在不同世界和存在位面之间旅行的方法。它们有时会溜上星际航行的船只或进入传送门，不顾虑它们的目的地。掷骰或从格雷尔探索表中选择一个结果，以启发格雷尔为何寻求在领域间通行的原因。
    格雷尔探索 为了餐饭，我的饥饿在我牙间碾磨。为了力量，我的饥饿在我紧握的手心。但对于被禁止知晓之物，我的饥饿则会撕裂猛禽之喙，使我的心智变成只会咀嚼的肌肉。
