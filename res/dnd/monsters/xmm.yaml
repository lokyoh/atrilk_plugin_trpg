  senses: 真实视觉 120 尺、被动察觉 14
  languages: 地底通用语
  desc: 奇异见证 被对禁忌知识的渴望所吞噬，诺西斯是被永不应当被知晓的秘密所诅咒的知识追寻者。这些昔日学者的身体被扭曲成了超自然的形态，每个头上都有一只巨大而不眨动的眼睛。诺西斯对他们过去的生活一无所知，只在乎他们对隐藏奥秘和奇异真理的无尽追求。他们在遗忘废墟的瓦砾中寻找启示，并利用他们的超自然视力看穿魔法欺骗，腐蚀敌人的肉体，并窃取那些打断他们调查的人的秘密。
    一些诺斯怪试图终结将他们扭曲成奇异形态的诅咒，但许多诺斯怪并未意识到——或对——他们的转变不感兴趣。 更深。更深，更深。更深且更诡秘。他们诡秘地来临。从那个不是地方的地方上来。他们来进食。以我所知为食。所以我躲藏。我躲藏起来。藏在隐秘的黑暗中。隐秘而黑暗，就像所有我知道自己不该知道的事情！
