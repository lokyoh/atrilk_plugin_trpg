  desc: 有些狗头人生来就有翅膀。同类中的其他人称它们为"乌尔兹"，这些狗头人被认为受到了龙或龙之女王提亚玛特的祝福。尽管它们拥有受青睐的地位，有翅的狗头人仍然和它们的同胞一样胆小，它们大多利用飞行来远离敌人的攻击范围。 诡计多端者与色彩龙之仆从
    作为色彩龙的怯懦表亲，狗头人作为战士和仆人为龙类主人服务。这些顽强的威胁模仿其龙类主人的行为。尽管他们矮小的身材和鲁莽使狗头人对龙的模仿显得拙劣，但他们用热情和机智弥补了在凶猛上的不足。他们尤其擅长制造陷阱和设置伏击。 狗头人的鳞片类似于生活在它们巢穴附近的色彩龙。极少数情况下，狗头人会拥有类似金属龙或其他龙类生物的特征。
