  senses: 盲视 30 尺、黑暗视觉 60 尺、被动察觉 12
  languages: 通用语、史拉蟾语; 心灵感应 60 尺
  desc: 绿色史拉蟾是在红色或蓝色史拉蟾的繁衍方式影响某些能够施展3级或更高法术的生物时产生的。绿色史拉蟾比它们的蓝色和红色同类更聪明，并且经常引导它们的族裔前往灰色史拉蟾标记出的适合入侵的类人生物社区的门户。 混沌之潮，无序世界的军团
    不可预知的史拉蟾在永变混沌的灵界中吞噬与繁衍。这些似蛙的异界生物体现了它们故乡位面的无尽可能性。虽然史拉蟾并非天生邪恶，但它们的冲动狂野且往往具有破坏性。许多史拉蟾通过超自然过程来繁殖。不幸的是，这些过程通常对其他生物是致命的。 史拉蟾族没有正式的社群结构。相反，强壮的史拉蟾统治较弱的个体。在绿色史拉蟾的指示下，蓝色和红色史拉蟾在混沌界肆虐并涌入其他世界。更强大的史拉蟾与诞生之石有联系，这是一块混沌魔法的源头，第一批史拉蟾便起源于此。诞生之石隐藏在混沌界的深处，传说将其起源与魔像领主普里穆或毁灭性的史拉蟾领主，如金色变形恐怖森达姆和有翼骷髅伊戈尔联系在一起。这些史拉蟾领主以及其他个体密谋将史拉蟾散布到多元宇宙各处。
    由繁衍之石诞生的史拉蟾头部嵌有一块魔法控制宝石。如果有生物获得了这块宝石，史拉蟾将获得魅惑状态并服从宝石持有者。如果史拉蟾被宝石持有者或其盟友伤害，或者宝石被归还给史拉蟾，它将不再处于魅惑状态。对史拉蟾施放高等复原术将摧毁宝石，史拉蟾也将不再处于魅惑状态。
    可以通过使用祈愿术或禁锢术来获取一只史拉蟾的控制宝石。如果史拉蟾未能通过对抗禁锢术的豁免检定，施法者将获得该宝石，而史拉蟾不会被禁锢。可以通过花费1分钟并通过一项DC 20感知（医药）检定来移除一只失能的史拉蟾的控制宝石。检定失败会对史拉蟾造成22点（）穿刺伤害。
    与史拉格战斗并失败，故事就结束了。与史拉格战斗并胜利，还有成千上万的史拉格排着队，就为了证明他们更强。
