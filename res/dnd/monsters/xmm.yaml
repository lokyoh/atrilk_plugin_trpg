  desc: 年轻的绿龙经常控制着一群蜘蛛人、狗头人、盗贼或其他懦弱的仆从。这些绿龙会避开其他邪恶的龙，以免遭到他们的破坏。渐渐地，压迫弱小的生物和积累无意义的财富让年轻的绿龙感到厌倦，他们开始追求更雄心勃勃的方式来满足自己的自负。 欺诈与嘲弄之龙
    从禁林的深处，绿龙将邪恶的低语散布到世界，操纵那些倾听者的生活。这些色彩龙狡猾、诡计多端且自负，耐心地利用短命生物的恐惧，腐蚀并孤立他们。绿龙可能潜伏在迷宫般的荒野中数个世纪而不显露自己；即使是最忠实的追随者，也可能只将它们视为森林的声音或梦境中的低语。
    尽管它们拥有强大的力量，但大多数绿龙鄙视物理暴力，将战斗视为仆人的工作，更喜欢将敌人诱骗到危险或剥削性的情境中。这些龙收集"小玩意"，这些物品体现了它们的操纵网络，并作为勒索的工具，例如妥协的文件、家族传家宝和情感上的珍贵物品。 绿龙居住在古老的森林中，通常将巨大的树木塑造成由交织的树枝、空心的树干和强大树根中的洞穴组成的复合体。它们也可能居住在森林废墟中，特别是那些被它们征服的人曾经的居所。
