  desc: 黑暗的诅咒巨人 曾经以其魔法才能而声名狼藉的佛莫瑞巨人是被妖精诅咒折磨的巨人。在他们的骄傲中，他们被诱骗入侵妖精荒野，企图夺取其魔法为己所用。当那个领域的统治者——大妖精们联合起来时，佛莫瑞巨人被击退，并被诅咒以超自然的怪异，使他们的身体与其邪恶的灵魂相匹配。自此以后，佛莫瑞巨人便居住在地底世界，徘徊在他们魔法城市的废墟之中。大妖精的诅咒仍然折磨着他们，他们被游走的溃疡、摇摆的器官和更加奇怪的痛苦所困扰。佛莫瑞巨人并没有为他们的罪行赎罪，而是利用他们的诅咒魔法，并将其用于对抗他人。滚动或从佛莫瑞扭曲表中选择一个结果，以启发一个生物在受到佛莫瑞巨人的扭曲诅咒时所经历的外貌变化。
