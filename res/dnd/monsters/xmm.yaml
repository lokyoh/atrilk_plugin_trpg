  languages: 所有
  desc: 继承了神性伟力的至高天乃是有着人形外形的完美存在。至高天与祂们的创造者之间的关系，也许是父母与其子嗣、统治者与其侍从、发明者与其造物、或是其他类似形式的关系。至高天的存在从根本上受其守护神以及其与诸上层位面的圣神及诸下层位面的魔神的联系所影响，不过即使如此，至高天们仍然有着自由意志。
    作为天族的那些至高天通常是意图证明自己配得上其神圣血统的贵胄。祂们大多为其亲代服务，或是支援这些神祇的理念，或是协助他们的神选勇者。作为邪魔的那些至高天则通常是自私且怖人的恶徒，意图夺取其亲代的伟力。祂们中的一些会集结起一支亵渎大军，或是统治着一座隐藏的国度，来嘲讽那些真神；不过也有一些邪魔至高天会寻找摆脱其受诅咒般的"家庭"。
    神裔 天裔是神明的子嗣。虽然他们本身并非神祇，但他们拥有与其神圣父母相关的神性影响和力量。一些天裔近乎半神，拥有非凡的威力和重塑凡人生命的力量。另一些则只是神圣思想或不朽关注的瞬间显现。无论天裔是理想化的存在还是神性的残余，他们的外观都受到其创造者的影响。从天裔影响表中掷骰或选择一个结果，以激发天裔的哪些血统特征在其物理形态中显现。
    天命者影响 有一天我可能会成为风暴之神——管理无数信徒，回应祈祷，改变整个世界——但在此之前，我做我喜欢的事情。
