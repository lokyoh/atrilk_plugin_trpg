  senses: 盲视 60 尺、黑暗视觉 120 尺、被动察觉 22
  languages: 通用语、龙语
  desc: 成年蓝龙统治着小规模的帝国，例如其麾下众多附庸的领土、阴影之中的犯罪网络、甚至是邪教团所控制的飞地。蓝龙针对其对手的怀疑与警惕永不停息，它们会精心编织阴谋来毁灭敌人，考验下属们的忠诚，并确保其统治可以绵延数个世纪。 风雷与暴政之龙
    骄矜孤傲的蓝龙乃色彩龙族的一支。它们会像其他龙族渴望搜刮宝藏那般渴求收服并掌控追随者。蓝龙会试图将其领土淬炼为令世间诸国慑服惊诧的恐怖帝国。 蓝龙的外形十分"锋利"，如直挺而出的长角、以及流转着蓝宝石到暴风云霭的各色鳞片。蓝龙栖息于沙漠与恶地，尤其是那些能够傲视周边数里之外的平地尖峰之顶。其巢穴往往临近象征着权力的场所，例如被遗弃的巨人要塞、失落帝国所遗留下的巨神兵、甚至是其追随者为其修建的纪念丰碑。
    蓝龙的宝山中堆砌着帝王冠冕与艺术珍品。蓝龙对寻常和有瑕的宝藏不感兴趣，它们更钟爱独一无二的宝石、已覆灭的皇族遗留下的冠冕、还有能传播其影响力的魔法物品。 蓝龙栖息于干旱之地。其巢穴也许是用来葬送入侵者的致命陷阱，亦可能是彰显霸业的浮华坚城。
