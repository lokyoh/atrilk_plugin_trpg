  desc: 随着时间变化的影响，抵达远古的赤铜龙往往温暖而又可靠。它们向朋友敞开的舒适巢穴，乃是可供年轻人们以及有需要者们学习与欢笑的温暖港湾。在维护这种小小的温暖之家同时，远古赤铜龙亦会警惕着未来的威胁，并在必要之时出手交战。 好奇与共融之龙
    坚定友善且充满好奇，大多数铜龙将世界视为一个充满无尽奇迹与可能性的地方。这些合群的龙拥有耐心、好客和幽默的品质，它们试图改善与之互动者的生活——或至少是情绪。如果被迫为了保护自己或朋友而战斗，这些龙更倾向于使用它们的减速吐息和物理攻击来制服对手。只有在极度危险或情绪激动的情况下，它们才会使用致命的酸息。
    铜龙通常居住在风景如画的山丘和岩石构造中的洞穴里——特别是那些著名地标的地方。这些龙会收集礼物，尽管他们对没有意义的宝藏兴趣不大，无论它们多么珍贵。对他们来说，精心挑选的礼物以及它们所象征的情感或记忆比杰作或魔法遗物更为重要。 赤铜龙通常栖息在多室洞穴和翻新的废墟中。
