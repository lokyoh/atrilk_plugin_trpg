  desc: 恐惧与服从之魔鬼 骨魔外貌枯瘦，苍白的皮肤紧缚在它们有如人类与昆虫特征结合的可怖骨架上，好似从噩梦中走出的魔鬼。骨魔也被称为奥塞魔；更低等的魔鬼，以及和九狱军团结盟的生物，都会受到骨魔指挥。骨魔以武力确保地狱大公们的命令得到执行，并迫使九狱外的生物履行和地狱的契约。它们会前去杀死那些违反地狱契约的生物，让这些生物的灵魂落入九狱，遭受永世折磨。
    在没有给自己的主人服务时，骨魔会诱骗自大自恋的凡人，许诺让这些凡人得到他人的奉承和服从。它们支持渴望权力的凡人，使这些凡人变得冷酷无情，道德败坏。 为了履行来自地狱的命令，骨魔会在多元宇宙中奔走；如果别无选择，骨魔甚至会征召凡人来帮助它们实现邪恶目的。掷一次骨魔目标表或从中选择一个结果，以此启发骨魔的目的。
    不要和魔鬼做交易的教训千千万万，骨魔也只是其中之一，但绝对是最有代表性的一个——倘若违反契约，这些梦魇怪物中的一个就可能亲自前来把你拖下九狱。 骨魔目标
