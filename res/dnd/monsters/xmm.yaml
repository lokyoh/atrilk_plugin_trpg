  cn: 史拉蟾蝌蚪
  en: Slaad Tadpole
  cr: 0.125
  size: 微型
  kind: 异怪
  ac: 12
  hp: 7
  hit_dice: 3d4
  speed: 30
  abilities:
    str: 7
    dex: 15
