  desc: 菌人新芽会照料它们的真菌家园并警惕入侵者。 孢子的守护者 蕈人居住在被霉菌和蘑菇覆盖的偏远幽暗地域中。这些可移动的真菌生物照料着它们的庇护所，并避免卷入其他生物的冲突。它们使用特殊的孢子进行交流、警告彼此危险以及自卫。当蕈人遇到其他生物时，它们会使用心灵链接孢子，让附近的生物能够通过心灵感应分享思想。然而，蕈人的目标对大多数非真菌生物来说仍然是个谜。
