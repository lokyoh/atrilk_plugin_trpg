  - 动作·恶臭喷溅 (1/日)：敏捷豁免 DC 10，15尺内呋噜可见的生物。失败： 目标被一种恶臭难闻的液体包裹，在小时内持续散发恶臭，并在恶臭持续期间陷入中毒状态。其他生物在身处源自被恶臭包裹生物的5尺光环区域内期间，也陷入中毒状态。目标可以在短或长休期间通过洗澡来去除身上的恶臭。
  senses: 黑暗视觉 60 尺、被动察觉 12
  languages: 理解地底通用语，但不会说；心灵感应60尺
  desc: 来自奇异之地的奇异盟友 幽暗地域中栖息着一些有着异常计划的怪异生物。其中浮空魟是少数对陌生人友好的生物之一。 这些长有触须、具备心灵感应能力的生物在空中短距离喷气移动，排出的气体发出声音，这也是它们名字的由来。弗拉菲并不通过言语交流，而是通过心灵感应以及改变颜色来反映他们的情绪。
    弗穆夫栖息在充满灵能能量的区域或靠近具有心灵魔法的生物附近。它们无害地吸收灵能能量，但在这样做的过程中，它们经常会遇到危险的生物，如底栖魔鱼和夺心魔。虽然弗穆夫通常会避免战斗，但它们常常会帮助处于危险中的冒险者。这种帮助可能用处不大，但弗穆夫的初衷是好的。掷骰或从弗穆夫援助表中选择一个结果，以确定弗姆夫提供的支持。
    浮空水母援助 浮空水母的触手会随着心情改变颜色。浮空水母颜色与情绪表总结了常见的浮空水母颜色及其最接近对应的人类情绪。 弗伦夫的色彩与情感
