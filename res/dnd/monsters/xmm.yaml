    半龙与孕育他们的龙共享个性特征和目标。那些类似于色彩龙的半龙通常憎恨他们的创造者，即使他们追求相同的目的。具有金属龙特征的半龙尤为罕见，但他们可能通过魔法事故、鲁莽的魔法使或一条垂死龙的最后行动而产生。 什么样的祝福比提亚马特之血要求更多，却能激发更伟大的成就？
