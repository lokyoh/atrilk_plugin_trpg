    格里姆洛克斯没有眼睛，只有浅凹槽。他们的第六感允许他们感知周围环境。他们体内的转变所留下的灵能力量持续存在，他们将这种诡异的力量引导到他们的攻击中。 掷骰或从格洛克任务表中选择一个结果，激发格洛克如何为夺心魔服务的灵感。 格里洛克任务
