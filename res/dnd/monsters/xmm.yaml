  - 传奇·猛扑：红龙移动至多等于其速度一半的距离，并发动一次撕裂攻击。
  senses: 盲视 60 尺、黑暗视觉 120 尺、被动察觉 23
  languages: 通用语、龙语
  desc: 远古白龙如极地风暴般君临霜疆。它们离开封冻的巢穴，依靠对食物与宝物的欲望肆意行事，用足以取人性命的刺骨冰寒威胁其他生物。白龙会忽视野兽以及小群的极地漫游者——这些巨龙意在挑战其他龙族、以及其他有着强大魔法力量的生物，意图将敌人的头颅和魔法物品纳入其宝窟。
    寒冷与残酷之龙 在最具原始色彩的五色龙中，白龙将生存置于一切之上。这些龙所栖息的北极荒原、冰川高峰和冰冻海域中的生活严酷而充满不确定性。白龙凶猛地保护着自己的领地，在严寒的地区搜寻食物和入侵者的踪迹。大多数白龙忽视较小生物和其他龙的阴谋，只关注自己的生存。
    白龙建造巢穴以防御其他致命的北极生物和危险的自然条件。在这些庇护所内，白龙囤积着证明其优越性的物品，如巨大头颅、被击败对手的装备以及吸引他们兴趣的奇珍异宝。为了保护这些财宝，白龙诱使冰层覆盖其宝藏或将财富沉入冰冷的池水中。对于白龙来说，每一件财宝都象征着一次胜利——其细节会随着这些龙的年龄增长而夸大。
    白龙在由石头和冰凿出的寒冷巢穴中孵育。
