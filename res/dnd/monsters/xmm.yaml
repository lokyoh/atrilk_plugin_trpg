  desc: 远古蓝龙的眼界早已超越了统治那些朝生暮死的仆从——它们认为，自己应当君临整个世界，号令诸龙、乃至这世上最为强大的那些住民。而要是远古蓝龙觉得统治世界过于老套，它们甚至可能会将魔爪伸向异界的国度、建立横跨多元宇宙的庞大帝国、甚至是现实中的某种概念力量——生命，风暴，甚至是时间本身。
    风雷与暴政之龙 骄矜孤傲的蓝龙乃色彩龙族的一支。它们会像其他龙族渴望搜刮宝藏那般渴求收服并掌控追随者。蓝龙会试图将其领土淬炼为令世间诸国慑服惊诧的恐怖帝国。 蓝龙的外形十分"锋利"，如直挺而出的长角、以及流转着蓝宝石到暴风云霭的各色鳞片。蓝龙栖息于沙漠与恶地，尤其是那些能够傲视周边数里之外的平地尖峰之顶。其巢穴往往临近象征着权力的场所，例如被遗弃的巨人要塞、失落帝国所遗留下的巨神兵、甚至是其追随者为其修建的纪念丰碑。
    蓝龙的宝山中堆砌着帝王冠冕与艺术珍品。蓝龙对寻常和有瑕的宝藏不感兴趣，它们更钟爱独一无二的宝石、已覆灭的皇族遗留下的冠冕、还有能传播其影响力的魔法物品。 蓝龙栖息于干旱之地。其巢穴也许是用来葬送入侵者的致命陷阱，亦可能是彰显霸业的浮华坚城。
