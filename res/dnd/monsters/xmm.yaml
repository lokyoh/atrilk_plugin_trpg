  senses: 盲视 30 尺、黑暗视觉 120 尺、被动察觉 16
  languages: 通用语、龙语
  desc: 年轻的白色巨龙会保卫它们的狩猎领地，防止竞争对手入侵。在某些情况下，狗头人和类人生物群体可能会向年轻的白色巨龙提供食物和宝藏，试图让这些巨龙保持饱足，减少它们捕食自己群体的可能性。 寒冷与残酷之龙 在最具原始色彩的五色龙中，白龙将生存置于一切之上。这些龙所栖息的北极荒原、冰川高峰和冰冻海域中的生活严酷而充满不确定性。白龙凶猛地保护着自己的领地，在严寒的地区搜寻食物和入侵者的踪迹。大多数白龙忽视较小生物和其他龙的阴谋，只关注自己的生存。
    白龙建造巢穴以防御其他致命的北极生物和危险的自然条件。在这些庇护所内，白龙囤积着证明其优越性的物品，如巨大头颅、被击败对手的装备以及吸引他们兴趣的奇珍异宝。为了保护这些财宝，白龙诱使冰层覆盖其宝藏或将财富沉入冰冷的池水中。对于白龙来说，每一件财宝都象征着一次胜利——其细节会随着这些龙的年龄增长而夸大。
    白龙在由石头和冰凿出的寒冷巢穴中孵育。
