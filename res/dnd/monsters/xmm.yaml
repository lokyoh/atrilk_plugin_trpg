  - 动作·多重攻击：雪怪使用寒颤凝视并使用爪击或投掷冰块发动共计两次攻击。
  - 动作·寒颤凝视：体质豁免 DC 18，30尺内雪怪可见的单一生物。失败： 21（）寒冷伤害，且目标陷入麻痹状态（除非目标对寒冷伤害免疫），直至雪怪的下个回合开始。成功： 目标在1小时内免疫此雪怪的寒颤凝视。
