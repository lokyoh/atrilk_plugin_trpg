  - 动作·闪电吐息：敏捷豁免 DC 19，90尺长、5尺宽的线状区域内的每名生物。失败： 60（）闪电伤害。成功： 半伤。
  - 施法·施法：蓝龙施展以下一道法术，无需材料成分并使用魅力作为施法属性（法术豁免DC 18）： 随意：侦测魔法、隐形术、法师之手、粉碎音波 每日1次：探知术、短讯术
  - 传奇·翔空无影：蓝龙使用施法施展隐形术，并飞行至多等于其飞行速度一半的距离。蓝龙直至其下个回合开始都无法再执行此动作。
  - 传奇·音爆：蓝龙使用施法施展粉碎音波。蓝龙直至其下个回合开始都无法再执行此动作。
