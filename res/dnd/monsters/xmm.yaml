  senses: 黑暗视觉 120 尺、被动察觉 15
  languages: 鲨华语
  desc: 鲨华鱼人战士是凶猛的战斗者，他们用带蹼的爪子野蛮地攻击敌人。一旦鲨华鱼人见血，他们通常会攻击到他们或他们的敌人被杀死为止。 来自波涛之下的掠夺者 鲨鱼人是凶恶的恐怖生物，它们猎食水面上和水下的生物。被沿海居民称为"海魔"的鲨鱼人是无情的掠夺者。他们洗劫船只、渔村和海底社区，以满足他们的嗜血欲望，夺取财宝，并向他们残暴的神灵——鲨鱼神塞科拉赫献祭。
    鲨华鱼人不断与生活在他们领地附近的任何族群开战。人鱼和其他水生生物首当其冲，但鲨华鱼人也会猎杀那些航行过或游过他们宣称的水域的陆上生物。鲨华鱼人经常与鲨鱼一起发动攻击，他们可以通过心灵感应指挥鲨鱼。 当一个鲨华鱼人向你袭来时，它看起来似乎毫无生气，直到它咬住你。然后那东西的黑色眼睛变得如同地狱之火般血红，海浪也变成猩红色的泡沫。接着便是尖叫声。
