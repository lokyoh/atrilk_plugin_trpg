    and research. 秘密的收集者与守护者 狮身人面像守护着多元宇宙的秘密。它们由智者和探索者的灵魂形成，深知真理的力量以及保护它的重要性。狮身人面像只会与那些证明自己智慧或通过如谜语或与危险野兽战斗等试炼的人分享他们的智慧。随着他们对宇宙奥秘的理解更加细致，狮身人面像可能会改变形态。
