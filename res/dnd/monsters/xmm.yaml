  - 动作·睡眠吐息：体质豁免 DC 18，60尺锥状区域内的每名生物。失败： 目标陷入失能状态直至其下个回合结束，此时目标重复豁免。 目标陷入昏迷状态，持续10分钟。目标身上的此效应在其受到伤害或被目标5尺内的另一生物用一个动作摇醒时提前结束。
