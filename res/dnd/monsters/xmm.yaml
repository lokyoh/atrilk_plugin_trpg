  - 动作·啃咬：体质豁免 DC 14，单一 5 尺内的自愿或陷入受擒、失能或束缚状态的生物。失败： 5（1d4 + 3）穿刺伤害外加 10（）暗蚀伤害。目标的生命值上限减少等于其受到暗蚀伤害的数值，且吸血鬼恢复等量生命值。
  senses: 黑暗视觉 60 尺、被动察觉 13
  languages: 通用语，外加另外一门语言
  desc: 初生吸血鬼是新近被转化的吸血鬼。他们尚未完全掌握自己的能力，许多人被对鲜血的渴望所吞噬。初生吸血鬼可能会为更强大的吸血鬼服务，或是追求自身堕落的目标。 黑夜吸血的领主 吸血鬼隐藏了他们被诅咒的永生本性，假扮成凡人以吸食活人的鲜血。虽然最年轻的吸血鬼可能只是他们创造者的嗜血奴仆，但最年长的吸血鬼则拥有难以置信的狡诈和对夜间超自然力量的控制。
    不死的吸血鬼在白天处于休眠状态，退避到远离敌人和太阳灼热光线的安息之所。从吸血鬼安息之所表中掷骰或选择一个结果，来激发吸血鬼的阴森庇护所。 吸血鬼休息处 吸血鬼和吸血鬼暗影领主会为自身打造远离生者的庇护所，无论是隐匿于繁华都市中，还是在生前栖息的废墟深处。
    亲爱的，你真是令人陶醉...
