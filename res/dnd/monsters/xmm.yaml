  desc: 年轻的银龙通常与年长的金属龙或英雄榜样有着密切联系，帮助那些有远大目标的人实现他们的抱负。它们可能会作为这些善行者的信使或代表。 勇气与公正之龙 银龙致力于维护和平并鼓励伟大。他们努力成为正直的榜样，同时保持警惕对抗邪恶。 银龙通常居住在白雪皑皑的群山之中，尽管抱负和亲和力驱使其中一些生活在多元化的社会中。它们伪装成类人生物，与艺术家、历史学家、骑士以及谦逊的领导者结盟，这些人从过去汲取教训，以创造更美好的未来。
    银龙从传说中的英雄身上汲取灵感，并怀有宏大的抱负。许多银龙会收集反映这些兴趣的宝藏，例如历史典籍、古代艺术品和著名勇士的装备。 银龙通常栖居于如画般的山间隐居地或雕刻的云"岛"之上。
