  desc: 幼年火蜥蜴从直径两英尺的炽热卵中孵化。这些被称为火蛇的蛇形生物在火元素位面及其他极端炎热之地游弋。在摄取足够燃料并经受极端高温后，火蛇将成长为成熟的火蜥蜴。 炼狱的蛇形艺术家 火蜥蜴是火元素位面的蛇形居民。它们相信火焰能展现万物最纯粹的形式，并热衷于焚烧和熔化物品，在各种燃料燃烧的烈焰中——无论是古老的森林、艺术杰作还是活生生的生物——看到转瞬即逝的美感和引人注目的细微差别。对于火蜥蜴来说，那些无法承受它们火焰的事物不过是化装的灰烬。它们对少数生物怀有恶意，但认为创造非凡的火焰比火焰带来的痛苦和损失更为重要。
    火蜥蜴通常满足于居住在火元素位面，在火焰中创造奇异而短暂的艺术。一些火蜥蜴会前往其他位面和世界，体验其他领域的火焰，或制造前所未有的规模的大火。 火元素位面的火蜥蜴非常喜欢遇到来自其他领域的访客。对他们来说，每一个陌生人都是他们炽热艺术品的潜在增色。不要被他们的奉承所迷惑，无论他们多么美妙地描述你将被烧成灰烬。
