  desc: 狡诈的猫科潜行者 移位兽看起来像是一只瘦削的六腿黑豹，肩部各长有一根带刺的触手。这种掠食者利用天生的魔法来偏移光线，使其看起来与实际位置相差几英尺。 位移兽不仅为了觅食而狩猎，还因为它们享受杀戮。一旦位移兽开始追踪猎物，它们就无法被阻止，直到它们或猎物被杀死。虽然位移兽通常栖息在茂密的森林中，但它们可能会长途追捕旅行者，甚至进入城市或地下城。这些捕食者比普通动物更加狡猾，可能会设置伏击或潜伏数天以击倒它们的猎物。
