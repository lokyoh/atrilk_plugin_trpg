  - 施法·施法：吉斯洋基人施展以下法术之一而不需要任何相应的法术成分，并使用智力作为施法属性（法术豁免 DC 13）： 随意：法师之手（手是隐形的） 每日2次：回避侦测（仅自身）、巧言术 每日1次：位面转移、心灵遥控
  - 施法·迷踪步（2/日）：吉斯洋基人施展迷踪步，无需法术成分并使用与施法动作相同的施法属性。 每日2次：迷踪步
  senses: 被动察觉 12
  languages: 通用语、吉斯语
  desc: 吉斯扬基骑士挥舞银刃斩杀那些使用星界投影法术侵入星界中吉斯扬基领土的魔法使。这些银刃对吉斯扬基来说是神圣的。非吉斯扬基的人若占有这些武器，往往会发现自己在愤怒的吉斯扬基骑士的追杀下。 来自星界的入侵者 吉斯洋基人曾经是一个普通的民族，但一个邪恶的夺心魔帝国的行为将冲突刻入了他们的存在中。吉斯洋基人是瘦削的类人生物，有着锯齿状的耳朵和斑驳的皮肤，颜色从黄色、绿色到棕色不等。虽然有些吉斯洋基人选择了自己的道路，但许多人都受到那段永远改变了他们命运的过去的影响。
    很久以前，一个人形种族被一个夺心魔帝国征服。这些夺心魔通过无法言喻的恐怖、强制进化和心灵重塑来操纵这个被遗忘的种族。最终，一位名叫吉斯的俘虏站了出来，带领反抗者对抗他们的压迫者。吉斯的追随者，后来被称为吉斯族，击败了夺心魔并粉碎了他们庞大的帝国。
    吉斯人的胜利转瞬即逝。当吉斯正在建立她新兴的帝国时，一位名为泽西门的领袖对她发起了挑战。泽西门宣称，吉斯对复仇和新征服的渴望正是夺心魔对整个种族实施心理编程的证据，这种生物性操控使得她的族人注定继续被奴役。这一主张将吉斯人分成了吉斯的追随者——吉斯扬基（意为"吉斯追随者"），以及泽西门的追随者——吉斯泽莱（意为"唾弃吉斯者"），并引发了一场持续至今的冲突。
    当吉斯去世后，她的顾问弗拉基特接管了吉斯扬基的统治。弗拉基特的血脉延续至今，现任统治者是巫妖女王弗拉基特。这位不死暴君强迫她的人民与夺心魔、吉斯泽莱以及其他任何威胁吉斯扬基霸权的敌人进行无休止的战争。
