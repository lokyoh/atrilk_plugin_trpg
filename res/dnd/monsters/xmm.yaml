  desc: 灾厄之形 在现存最具毁灭性的生物中，塔拉斯克是一台灾难的引擎，也是一个国家的毁灭者。这个巨大无比、力量压倒一切的恐怖存在，从物质位面的最早时期幸存下来，当时它是不朽力量的武器。从那以后，塔拉斯克一直在秘密地沉睡，每隔几个时代就会醒来，带来毁灭的时代。
    塔那托斯是一种双足站立的史前巨兽，身高超过七十英尺。它的身上布满了角和刺，其多刺的甲壳能够偏转伤害并反射魔法攻击。 泰拉斯奎兽是一种不知疲倦的愤怒生物。它会猛烈攻击任何引起它注意的生物，用爪子和强壮的尾巴抽打，同时将较小的生物整个吞下。它似乎对低级生物的造物本能地感到愤怒，将怒气发泄在建筑物、桥梁、船只和纪念碑上。目标的结构或敌人越大，泰拉斯奎兽的愤怒就越强烈。
    究竟是什么——假如有的话——能够安抚塔那厘巨兽，这是一个谜，但它最终会回到沉睡状态，留下一个无可挽回地改变了的世界。尽管塔那厘巨兽可能会被难以置信的抵抗所阻挡，但它的威胁永远无法从多元宇宙中抹去。每当塔那厘巨兽被击败，另一个塔那厘巨兽就会在物质位面的某个地方苏醒。
    几乎没有事物能在塔那厘怪的肆虐中幸存，关于这怪物造成的破坏的报道往往相互矛盾、不完整或难以置信。在它没有留下任何生还者的情况下，起初可能会将灾难归咎于邪恶的巨龙或魔法灾难，但塔那厘怪经常会留下一些明显迹象表明它的经过。从塔那厘怪证据表中掷骰或选择一个结果，以启发这怪物肆虐的迹象。
