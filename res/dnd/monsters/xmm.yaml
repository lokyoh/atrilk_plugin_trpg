  desc: 魔咒燃焰起，骨颅念似狂 燃焰之颅是会飞行的头骨，通体燃烧着魔法的火焰，并且依稀记得死去施法者生前的奥术魔法。它们自死去的施法者遗骸中复活，有些是邪恶法师的杰作，还有些则是源于自身对魔法的强烈渴望。燃焰之颅会被其创造者用作守卫，或者自行去实现未竟的野心。它们只需要很少的法术成分就可以施法，用破坏性的法术和爆发的烈焰攻击敌人。
    燃焰之颅的种类多种多样，从人类头骨到各种可怕的怪物头颅无所不有。它们火焰的颜色也会有所不同，并且会在愤怒时变得更加旺盛。掷一次燃焰之颅细节表或从中选择一个结果，以此启发其细节上有什么样的不同。 燃焰之颅细节 我才不关心什么温暖，也从来不需要什么身体。我只需要这意志就足够了，一切牺牲都有所价值，我将成的伟业即是我的一切！
