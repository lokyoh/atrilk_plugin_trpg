  desc: 装置控制的魔法保镖 一种令人生畏的魔法自动装置，盾卫听从其主人的命令并保护主人免受危险。当这种护卫被创造时，赋予其生命的魔法与一枚绑定命令护符交织在一起。任何拥有盾卫命令护符的生物都可以控制该构装体，并且如果是施法者，可以为其注入一个法术以在预定条件下释放。然而，盾卫的首要目标是保护它的主人。它护送任何持有其命令护符的人，并介入持有者与任何威胁之间。尽管它并非无脑，盾卫没有自我保存的意识，会牺牲自己来保护主人。
    盾卫守护者通常由钢铁、石头和木材制成，形状类似警觉的士兵。也存在更多奇异的设计，反映了其创造者的品位。由于它们的坚韧性，盾卫守护者最终为除了其创造者之外的生物服务是很常见的。盾卫守护者的命令护符可能会在魔法使用者社会或家族中代代相传。
