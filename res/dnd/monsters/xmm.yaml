  - 传奇·虫群云聚：敏捷豁免 DC 17，单一120尺内黑龙可见的生物。失败： 22（）毒素伤害，且目标为维持专注进行的体质豁免具有劣势，持续至其下个回合结束。成败： 黑龙直至其下个回合开始都无法再执行此动作。
  - 传奇·骇人威仪：黑龙使用施法施展恐惧术。黑龙直至其下个回合开始都无法再执行此动作。
