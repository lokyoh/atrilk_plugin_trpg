  desc: 青铜龙通常栖息于其所守护之地，或是这些巨龙引导它人实现对方的目标之地附近。他们可能会成为城市的赞助者，为当地的领导人提供建议，帮助人们世世代代安居乐业。 潜能与守护之龙 青铜龙栖息之地，奇迹繁盛。这些金属龙富有想象力却又深思熟虑，致力于成就伟业，并帮助他人发挥全部潜力。它们竭力保存创新，从古代文明的杰作到崭新发现，并广泛分享这些作品。在与寿命较短的生物交往时，青铜龙更倾向于通过对话和培养来赢得他们的认同，但当恶徒阻碍他人实现潜能时，它们也不会回避战斗。
    青铜龙钟爱海洋的力量与无尽的可能性，它们通常将自己的巢穴建立在自然美景之中或是它们希望保护的社区附近。在它们的居所内，青铜龙会囤积它们认为有一天会派上用场的物品。它们打捞沉入海底的宝藏，回收财富或沉船。 青铜龙通常在海边或海底建立它们的家园。
