  languages: 通用语、地精语
  desc: 地精随从喜欢参与聪明领袖的破坏性计划，但在面对应有的惩罚时会迅速逃跑。 野性恶作剧者与麻烦制造者 哥布林是鲁莽与毁灭的妖精荒野化身。他们以破坏为乐——越喧闹、越充满活力、越复杂，越好。哥布林的袭击往往既是纵火和折磨牲畜的娱乐机会，也是更大破坏计划的一部分。
    地精会服从那些能完成最疯狂计划的人。这些领导者可能是地精突袭策划者、夸夸其谈的施法者，或者是那些能制造最大噪音的人。大地精和强势的类人生物也可能指挥难以驾驭的地精群，将它们的破坏性引导向盗匪行为、破坏活动或战争。 神祇玛葛鲁比特自称是地精、大地精和熊地精的神，在无垠战场的修罗场中，这位神祇指挥着无数的地精军团。在远古时代，玛葛鲁比特目睹了地精种族的破坏倾向，并将他们的一部分从妖精荒野迁移到了他在外层位面的领地。从那时起，这些更具尚武精神的地精群体蓬勃发展，其中一些找到了通往物质位面世界的方式。这些凶残的侵略者试图为他们的神祇征服世界而播下毁灭的种子。
    布里-亚克！
