  desc: 邪恶遗迹 暗影恶魔是由极其邪恶的恶魔被摧毁后，无法在无底深渊中重铸其物理形态时形成的。这种情况可能由于神圣干预、恶魔在无底深渊中被摧毁，或在更不寻常的情况下发生。暗影恶魔是这些被摧毁恶魔邪恶的无形残余。它们通常隐约呈现出它们曾经的形态，但有些则故意采取欺骗性的形态。许多暗影恶魔潜伏在黑暗的地方或只在夜晚外出，以隐藏它们的真实形态，愚弄那些被它们操纵的对象。
    影魔寻求方法重获昔日的力量，并向摧毁它们的人复仇。它们常常讨好更强大的恶魔或凡人施法者，通过交易和胁迫他人来恢复自己的力量。许多影魔试图夺取或腐化灵魂以恢复其恶魔形态，而另一些则寻找邪恶的遗物或亵渎魔法的节点。影魔通常需要数个世纪来恢复其恶魔力量，如果它们最终能够恢复的话。
    特别强大的恶魔在被击败后可能会以多个暗影恶魔的形式回归。这些邪恶实体都认为自己是过去自我的真正化身，并相互猎杀以恢复他们的力量。 在罕见情况下，恶魔以外的邪魔可能会采用类似影魔的形态。 结局有三条规则。首先，善良总是胜利。其次，邪恶总会卷土重来。第三，第一条规则并不总是成立。
