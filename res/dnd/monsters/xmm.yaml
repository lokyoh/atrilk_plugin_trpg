  languages: 通用语，外加三门其他语言
  desc: 那些急于逃离死亡的人有时会与邪恶的神祇达成可怕的交易。他们将心灵献给邪恶力量，这些恶徒获得了对死亡的力量以及一种被诅咒的永生，将他们的思想和灵魂束缚在一具干瘪的尸体中。摆脱了凡人的担忧，这些木乃伊领主在岁月中追逐着他们的执念。
    大多数木乃伊领主徘徊在他们曾统治过的古老宫殿或神庙的遗迹中。他们古老的信仰与死亡力量的联系赋予他们可怕的魔法，他们用这些魔法散布毁灭并唤醒亡灵仆从。 木乃伊领主的心脏体现了赋予它不朽的契约。与其将心脏保留在尸体中，木乃伊领主会移除并隐藏这个被诅咒的器官。只要它的心脏未被火焰摧毁，无论遭遇怎样的厄运，木乃伊领主都能重返不死之身。
    木乃伊领主通常被永恒的阴谋所吞噬。掷骰或从木乃伊领主阴谋表中选择一个结果，以确定木乃伊领主古老的议程。 木乃伊领主之谋 木乃伊领主通常潜伏在它们生前居住的废墟中。这些地点有着不详的名声，或者可能已被遗忘。 这卷轴上记载了一个邪恶的仪式，用于复活安克泰普特的孩子。我试图烧掉它，但火焰却无法触及羊皮纸。请原谅我，我无法毁掉它......我无法控制自己。
    不朽古灵与永恒野心 神秘的仪式和强大的信仰可以将灵魂与他们的尸体绑定，使其永远依附于遗骸之中。如果他们的安息之地被侵犯，这些被称为木乃伊的存在会重新激活他们腐朽的躯体，以恢复他们坟墓的神圣并惩罚那些打扰他们安息的人。 木乃伊会追捕那些冒犯它们的人，通常是亵渎它们安息之地、窃取它们陪葬品或玷污与它们信仰相关的场所的凡人。怀着不死的愤怒，这些古老的尸体会不遗余力地复仇，并恢复它们需要的东西以找到安宁。
    木乃伊看上去可能很脆弱，但其身体拥有超自然的力量，它的目光可以让最勇敢的心也感到恐惧。那些逃脱木乃伊抓握的人可能会发现自己遭受了可怕的诅咒。木乃伊诅咒的受害者会逐渐枯萎，他们的身体腐烂直到化为尘土。这种诅咒只能通过移除诅咒法术或类似的魔法来治愈。
