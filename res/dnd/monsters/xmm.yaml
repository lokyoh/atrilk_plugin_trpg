  senses: 黑暗视觉 60 尺、被动察觉 10
  languages: 鬣狗语
  desc: 鬣狗人战士渴望无尽的杀戮，但很快会对他们杀死的猎物和掠夺的宝物感到厌倦。然而，一想到其他人可能拥有属于他们的东西，他们就会暴怒，迫使他们毁掉那些他们无法带走的东西。 拥有野性肉身的邪魔 第一批鬣狗人诞生于摄食了被深渊侵染的肉体的鬣狗。它们的腐化与暴力取悦了恶魔领主耶诺古，其增加了它们的数量，并在多元宇宙散播它们。从那之后，鬣狗人们成为了耶诺古咯咯叫的仆从，存在即为造成毁灭，享用残羹剩宴。
    耶诺古声称鬣狗人并非他的子嗣，而是故意释放去感染可憎尸体的蛆虫。它们是残暴之兽在凡间散播的恶疾。无论它们曾是什么，它们已然被改造，现在为他所有。
