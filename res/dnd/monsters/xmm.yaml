  languages: 能理解深潜语但无法说话
  desc: 原始力量的几丁质仆从 丘尔斯源自被遗忘的时代，那时底栖魔鱼和更奇异的存在统治着海底的异域帝国。底栖魔鱼将许多深海掠食者改造成了可以冒险离开海洋的仆从，以获取更多的魔法和生物来利用。丘尔斯是这些怪异仆从中最为持久的。 许多巨螯怪侍奉着底栖魔鱼领主，在无光的海洋和原始的沼泽中执行他们的奇思妙想。其他巨螯怪则服从新的异怪主人，如眼魔、格雷尔或夺心魔。一些巨螯怪遵循自己的本能，无尽地收集古代魔法宝藏或将古老的命令解释为荒谬的目的。无论它们的计划如何，巨螯怪都会用它们巨大的螯钳捕捉生物，然后用其麻痹触须使敌人无力反抗。
