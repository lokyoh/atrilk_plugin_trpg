  desc: 红龙雏龙是天生的破坏者。从小时候起，它们就喜欢点燃物体和生物。有时它们会克制自己不灼烧生物，而是通过欺凌他人来迫使他们服从命令并带来礼物。 贪婪与毁灭之龙 红龙贪婪地夺取它们想要的一切，并将阻挡它们的东西烧成灰烬。这些彩色巨龙永远渴望更多——更多的魔法、领地、财富，或者任何能激起它们残酷野心的事物。
    红龙在危险的悬崖和火山中筑巢。在巢穴中，它们囤积并激烈守护着财宝，许多红龙对财宝的内容和它们所收集物品的位置有着完美的记忆。如果有任何东西丢失，红龙会暴怒。直到财宝归还，且窃贼被烧成灰烬，它们才会罢休。 红龙坚信自己是最伟大的龙族，进而也是所有生物中最强大的存在。对它们而言，掠夺与征服是其正当权利——财富最荣耀的归宿就是它们的宝库，而其他生物则有幸为它们服务。
    红龙在闷燃的、难以接近的地方筑巢，例如火山山脉、燃烧的荒地以及它们从其他生物那里夺来的废墟。
