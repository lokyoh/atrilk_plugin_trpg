  desc: 威吓与绝望之魔 纳尔菲什尼恶魔试图支配所有遇到它们的生物。这些恶魔体型庞大且畸形，扭曲的野兽特征与食人魔般的骨架结合在一起。无论是通过蛮力还是狡诈，纳尔菲什尼恶魔都能迫使异教徒和较弱的恶魔在无底深渊的无尽冲突中或物质位面的阴谋中为它们服务。
