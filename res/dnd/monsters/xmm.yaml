  desc: 奥戈隆是被邪恶魔法或愤怒神祇的意志诅咒的人形生物。他们外表类似于他们曾经的形态，但会生长到超过8英尺高，并获得类似食人魔的特征。奥戈隆不断被超自然的愤怒所驱使，他们可能会努力控制这种愤怒，或者故意将其发泄在其他生物身上。 狂暴巨兽与掠夺者
    食人魔是由充满憎恨的超自然力量所诞生的自私掠夺者和巨大的贪食者。他们从阴暗的废墟和荒凉的边远地区袭击脆弱的社区并伏击旅行者。食人魔觊觎食物和财宝，并且恶意地毁坏艺术品、书籍、机械装置以及其他精致或用心制作的东西。偶尔他们也会绑架受害者以便日后食用，或者更少见地，绑架一些引起他们兴趣的表演者。
    食人魔的起源可以追溯到愤怒的神祇，如厄瑞斯努尔、塔克西斯和瓦普拉克。他们从被邪恶神祇、险恶魔法或古老诅咒腐化的土地中通过魔法诞生。一些食人魔身上还留有出生地的痕迹，如岩石般的硬茧、苔藓般的生长物或冰冻的疤痕。
