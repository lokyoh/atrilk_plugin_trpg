  desc: 异怪邪教徒寻求来自世界之外的不可名状之力。它们会与诸如底栖魔鱼Aboleths或夺心魔Mind Flayers 等怪物结盟，或是引导克苏鲁、哈达、精灵噬者伊提亚克-奥瑟尔、奈亚拉托提普、恶孽尸星、以及其他来自遥远国度之实体的不可名状之力。
    宣扬末日，不移狂信 邪教徒使用魔法以及其他极端手段来传播其激进的信仰。一些邪教团是追求玄奥隐秘的密教团体，而另一些则是活跃于暗面的阴谋集团，意图实现某种怖人的大业。邪教徒们通常遵循着晦涩的密教习俗行事，或是醉心于解读古老的预言。它们还可能将其信仰献上给超自然的宗主——神灵、异界的生物、擅于操弄凡人的异质心灵、甚至是其他更加诡异的力量。掷一次邪教大业表或从中选择一个结果，以此启发一伙邪教徒们会意欲达成什么样的目标。
    邪教大业 邪教徒通常依靠圣印来分辨教团的成员。这些圣印通常印在邪教的标志性物品上，亦可能印在衣物上、甚至可能直接刻在邪教徒的身体上。圣印的意义可能很容易理解，亦可能只有教团成员才能分辨。掷一次邪教圣印表或从中选择一个结果，以此启发邪教团会使用什么作为自己的标志。
    邪教圣印 邪教通常围绕一位有魅力或专制的领导者形成层级结构。尽管邪教成员可能会独立行动，但他们仍从拥有更强大超自然力量的上司那里接受命令。 教派可以围绕任何神秘传统组织起来，但许多教派服务于超自然存在。教派成员通常拥有与他们所崇拜力量相关的能力。
    恐怖的撒瑞兹顿，远古元素之眼的力量与所有毁灭力量的主宰，我是邪恶元素的冠军，已准备好执行您的意愿。
