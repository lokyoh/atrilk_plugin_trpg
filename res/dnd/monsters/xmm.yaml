  desc: 弱魔会攻击那些看起来比自己弱小的生物——或者对它们表现出恐惧的生物——并尽量避免与更强大的恶魔对抗。当弱魔逃离无底深渊时，它们会肆意破坏并尽可能造成伤害。 疯狂与恐慌并存的恶魔 当最令人唾弃的灵魂被判入无底深渊时，原魔便诞生了，它是恶魔的最低等形态。这些畸形恶魔有着扭曲的体态与肢干，上面爬满了深渊中的寄生虫。恶魔的冲动与持续的恐惧驱动着原魔，使它们只知道如何造成惊吓与爆发疯狂。
