  desc: 成年金龙的行动往往十分微妙——它们经常化形为看似无害的动物出面，或是制作出一套可供其扮演的身份，用以像普通人一样融入社会。 希望与威严之龙 金龙致力于让世界变得更美好。作为金属龙中最强大的一种，这些令人敬畏的巨龙努力保护正义，并推动命运走向更光明的未来。然而，他们善良的本性并不妨碍在必要时参与战斗，他们会呼出璀璨的火焰和削弱魔法的力量来击溃敌人。
    金龙偏爱草原和原始森林，经常居住在令人惊叹的自然奇观附近或守护着古代文明的遗迹。在它们的巢穴中，金龙会囤积硬币和宝石，但它们经常将财富用于追求更大的目标。它们常常用财富购买稀有知识书籍，支付线人报酬，或资助理想主义的冒险者。 金龙选择在自然和魔法奇迹之地安家。
