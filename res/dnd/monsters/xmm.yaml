  desc: 年轻的黄金龙已经窥见了世界真正的邪恶，并投身于反对它们的战斗。它们常常寻求大胆而直接的解决方案来应对问题。 希望与威严之龙 金龙致力于让世界变得更美好。作为金属龙中最强大的一种，这些令人敬畏的巨龙努力保护正义，并推动命运走向更光明的未来。然而，他们善良的本性并不妨碍在必要时参与战斗，他们会呼出璀璨的火焰和削弱魔法的力量来击溃敌人。
