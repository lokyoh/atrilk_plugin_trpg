  - 魔法抗性：鬼婆对抗法术和其他魔法效应时进行的豁免检定具有优势。
  - 改日算账：当鬼婆的生命值降至0生命值时，只有在其位于自己的克星（一件鬼婆最厌恶的事物，由DM选择）30尺内时才会死亡。否则，鬼婆的生命值会改为降至 1 生命值并传送到一个无害的半位面，并且在 日内无法回到自己离开的位面。当鬼婆传送离开时，位于它离开空间60尺内的每名生物都会被诅咒。被诅咒的生物进行的属性检定和豁免检定具有劣势，并且鬼婆总会知晓其在多元宇宙中的位置，直至此诅咒结束。
