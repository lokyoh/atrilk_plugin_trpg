  desc: 幻觉与陷阱之恶魔 格拉布祖族体现了妄想和捕食性的狡诈。这些狡猾的恶魔知道，最有效的陷阱是那些个人为自己设计的陷阱。尽管拥有巨大的爪子和压倒性的体型，格拉布祖族擅长使用奉承和误导来胁迫受害者孤立自己并伤害他人。 在无底深渊中，六臂蛇魔作为独行猎手或更强大恶魔的狡猾顾问。六臂蛇魔寻找通往物质位面的途径，并乐于被魔法使召唤。它们急切地为凡人服务，同时引诱他们背叛盟友并沉溺于傲慢的幻想。一旦魔法使犯下了不可救赎的恶行，且凡人的灵魂注定要坠入无底深渊，六臂蛇魔便会竭尽全力杀死其召唤者。
