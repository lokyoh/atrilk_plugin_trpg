  desc: 神圣力量的泰坦巨舰 巨像是信徒们创造的巨型构装体，用以体现神祇的本质，无论是仁慈还是邪恶。巨像涌动着不可思议的魔力，并在大地上执行着神圣的意志。 一群虔诚的工匠为纪念他们的神祇，雕刻出巨像的形态，然后祈求那位神祇赋予雕像生命。这一艰难的过程可能耗时数十年，并需要数百名工匠参与。如果神祇青睐这一造物，巨像核心中的强大水晶便会随着神圣的力量脉动，巨像随之崛起，保护信徒或执行神祇的旨意。
