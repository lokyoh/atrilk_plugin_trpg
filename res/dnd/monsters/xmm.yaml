  desc: 吞宝饕餮 在土元素位面上，石鼎兽四处游荡，寻找它们认为是美味佳肴的食物：宝石、晶体和贵金属矿脉。对石鼎兽而言，土元素位面就是一个无尽的盛宴。那些找到通往物质位面道路的石鼎兽会发现，大多数世界都是一片美食荒漠。这些石鼎兽在地下深处搜寻，吞噬它们找到的任何稀有的宝石和矿石。这可能会使它们与矿工或其他将宝物藏在地下的人发生冲突。
    石鼎兽有三只眼睛、三只手臂和三条腿，围绕它们的三面对称体排列。它们身体的顶端是一张大嘴，既能粉碎矿物，也能对付危险的生物。石鼎兽能够通过魔法在地中穿行，不留任何隧道或经过的痕迹。 贪婪的饕餮，索尔恩专注于他们的下一顿美餐。他们对生物漠不关心，并尽可能避免伤害它们。他们知道其他生物也觊觎大地的宝藏，并且他们不介意为了食物进行交易。索尔恩可能会分享他们对幽暗地域的知识，以换取宝石、硬币或魔法金属作为零食。如果饥饿或愤怒，索尔恩可能会试图强行夺取他们的食物。
