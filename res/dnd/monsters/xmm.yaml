  senses: 盲视 60 尺、黑暗视觉 120 尺、被动察觉 21
  languages: 通用语、龙语
  desc: 成年白龙领土广袤——而且它往往是就是其中最强的捕食者。有些白龙会在选择在巢穴内潜伏数月时间，而另一些则会主动飞掠巡视其领地。它们一见冰原异动便可能俯冲猎食，或胁迫智慧生物献上食物和贡品。 寒冷与残酷之龙 在最具原始色彩的五色龙中，白龙将生存置于一切之上。这些龙所栖息的北极荒原、冰川高峰和冰冻海域中的生活严酷而充满不确定性。白龙凶猛地保护着自己的领地，在严寒的地区搜寻食物和入侵者的踪迹。大多数白龙忽视较小生物和其他龙的阴谋，只关注自己的生存。
    白龙建造巢穴以防御其他致命的北极生物和危险的自然条件。在这些庇护所内，白龙囤积着证明其优越性的物品，如巨大头颅、被击败对手的装备以及吸引他们兴趣的奇珍异宝。为了保护这些财宝，白龙诱使冰层覆盖其宝藏或将财富沉入冰冷的池水中。对于白龙来说，每一件财宝都象征着一次胜利——其细节会随着这些龙的年龄增长而夸大。
    白龙在由石头和冰凿出的寒冷巢穴中孵育。
