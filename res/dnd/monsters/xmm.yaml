  senses: 黑暗视觉 60 尺、被动察觉 19
  languages: 雪怪语
  desc: 巨恶雪怪是它们这可怖一族中的巨人，比它们的亲族更强壮也更嗜血。它们会把整个地区都看作是自己的狩猎场，持续几日在闯入者身后穷追不休。在看到猎物之后，巨恶雪怪会丢出大块的冰雪，然后逼近去杀死猎物。除了冰冷的利爪和凝视之外，它们还能呼出一团极寒的冻气。
    巨恶雪怪居住在寒冷的废墟中，或是那些声名狼藉的群峰上其他怪物废弃的巢穴里。 冰封荒野的冰冷潜行者 跨越高山极地和冰冻边疆，雪怪猎杀那些闯入它们领地的入侵者。它们隐居且无情，形似巨型猿猴，拥有苍白的皮毛和类似公羊的角。雪怪能够轻易融入雪地和冰崖之中，在发动攻击前，以令人毛骨悚然的嚎叫显露身形。除了强大的体力，雪怪还能用目光冻结生物，将敌人冰冻在原地，并且能够召唤冰块并向敌人投掷。
    由于雪怪的难以捉摸，关于雪怪的民间传说比目击事件更为常见。远处的尖叫是愤怒的雪怪嚎叫，还是仅仅是风声，鲜有人能够确定。尽管如此，许多山地定居点会燃起篝火来驱赶雪怪，利用这些野兽对火的厌恶。 在雪怪中，我找不到任何亲情、理解或怜悯。他们的力量并非来自山脉，也非源自冰川奇迹的魔法。他们的世界和谐被谋害并冻结。
