  desc: 冰雪巨人 从冰川的高山和广阔的冻原中耸立着霜巨人的家园。这些巨人的皮肤和头发呈现出冰冷色调。他们对寒冷的天然免疫力使他们能在对大多数其他生物而言不宜生存的地方繁衍生息。他们在狩猎和战斗时利用这种韧性，以冰冷的战吼声援盟友。 霜巨人经常远行以寻找食物和物资。这导致许多人成为掠夺者并赢得了暴力的名声。其他人则通过猎杀巨型猎物或从寒冷中创造庇护所（通常以温泉或雪地比赛为特色）来更和平地生活。霜巨人有时会与冰冷的精类或居住在地下的火巨人建立合作关系，作为他们领域的守护者，以换取财宝、武器和工艺品。
