  - 施法·扭曲言语：鬼婆施展法术反制（触发条件见该法术），使用与施法动作相同的施法属性。若目标豁免失败，直至其下个回合结束，其会被诅咒。目标无法施展具有言语成分的法术，并且当其说话时，会说出和想要表达的意思相反的话，直至此诅咒结束。 随意：法术反制
  - 传奇·鬼婆猛打：鬼婆发动一次幽魂利爪攻击。
