  desc: 死亡骑士是致命的战士和专横的指挥官，有着黑暗的历史。尽管他们自私的灵魂永恒地将他们束缚在命运之中，但有些人仍努力终结将他们诅咒为不死之躯的诅咒。其他人，如臭名昭著的死亡骑士索斯领主，在凄凉的废墟中沉思了几个世纪，只有当某种东西重新点燃他们那永无止境的邪恶时，他们才会行动起来。
