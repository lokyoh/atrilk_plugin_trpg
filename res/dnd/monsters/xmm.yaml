  desc: 匪徒是缺乏经验的新手菜鸟，通常听命于匪帮中更高级的成员。 罪犯与恶棍 匪徒们蛮取豪夺。帮派成员、亡命之徒、非法佣兵等各类罪犯都可算作匪徒。然而，并不是所有匪徒都是出于贪婪而犯罪。有些匪徒是因为不公的法律、深陷绝望、甚至是受人胁迫才不得已踏入罪恶之道。
