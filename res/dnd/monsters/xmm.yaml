  desc: 峭壁与山谷的巨人 丘陵巨人生活在崎岖的悬崖和高地之间。这些巨人的体型是大多数人类的三倍，他们的皮肤和头发呈现出各种色调，包括与他们的居住地附近的泥土和苔藓相似的颜色。 在隐秘的山谷、原始的瀑布和充满猎物的山坡中，山丘巨人通常从自然的丰饶中获得所需。如果荒野无法提供，山丘巨人会自己制作，用石头、木头和兽皮制作衣服、工具和武器。当遇到陌生人时，山丘巨人可能会对其领地产生怀疑并加以保护，但如果旅人能让他们感到愉快，有些山丘巨人可能会愿意与旅人分享他们的丰饶。
    灾难、入侵或匮乏可能驱使山丘巨人离开他们的家园，进入他人的领地。一些流离失所的山丘巨人可能会偷窃他们所需的东西，或通过摧毁较小的生物来为他们的损失复仇。其他人可能会选择以掠夺为生，或为其他巨人服务以换取保护。
