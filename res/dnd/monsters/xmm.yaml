  senses: 黑暗视觉 60 尺、被动察觉 14
  languages: 巨人语
  desc: 大地巨人 在深邃的洞穴中以及山脉的峡谷间，石巨人沉思着大地的力量与恒久。石巨人的面容粗犷，皮肤带有与他们家乡附近常见的岩石相似的纹路和色泽。尽管体型庞大，这使得他们能够在石质环境中巧妙融入其中。 石巨人很少干涉其他生物的事务，无论是它们较小的邻居还是其他巨人。大多数石巨人行动缓慢，宁愿忍受艰难困苦或等待危险时期过去。当被激怒采取行动时——尤其是当古代奇迹的遗址或它们的家园受到威胁时——石巨人可以释放出山岳般的力量，以雪崩般的威力碾压敌人。
    石巨人常常思考自然奇观的奥秘，例如山峰、水晶构造或神秘的岩画。一些石巨人深知隐藏在地下的魔法和秘密信息。那些将自己限制在地底世界的石巨人，往往将地表世界及其居民视为沉睡的原始存在、陌生的神灵或其他实体所想象出来的梦境。
