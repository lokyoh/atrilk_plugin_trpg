  desc: 喷雷饕餮 十二足的爬行者青足龙蛇无休止的猎食它的下一顿美餐。它们的短腿让它们能快速穿越地面和墙壁,而任何它们追不上的猎物都会被强力的闪电吐息炸毁。 传说，第一批青足龙蛇由风暴巨人在龙与巨人的古代多元宇宙战争中以魔法创造。巨人用它们对气候的理解篡改了蓝龙的本质。而成果就是第一批青足龙蛇，它们作为猎手被创造，尤其喜爱龙蛋。
    青足龙蛇生活在宽阔的洞穴系或是错综复杂的废墟中，在那里它们可以充分发挥自己的超级机动性。它们格外关注龙的居所，因为大多数龙都认为青足龙蛇是危险的怪物，一见到就会发起攻击。尽管如此，青足龙蛇偶尔也会寻找龙的巢穴以期望找到未孵化的龙蛋来吞吃。
