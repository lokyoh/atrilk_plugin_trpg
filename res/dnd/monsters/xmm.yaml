  - 动作·绞缠：力量豁免 DC 15，单一 5 尺内不超过大型的生物。失败： 28（7d6 + 4）钝击伤害。目标陷入受擒状态（逃脱DC 14），且目标陷入束缚状态直至擒抱结束。成功： 仅半伤。
  - 动作·毒气喷涌：体质豁免 DC 14，30 尺锥状区域内的每名生物。失败： 21（）毒素伤害，且目标陷入中毒状态直至蛇人的下个回合结束。中毒期间，目标陷入目盲状态。成功： 仅半伤。
  - 施法·施法 (仅蛇人型态)：该蛇人施展以下一道法术，无需材料成分并使用感知作为施法属性（法术豁免DC 15）： 随意：化兽为友（仅对蛇类有效） 每日3次：暗示术
  senses: 黑暗视觉 60 尺、被动察觉 17
  languages: 深渊语、通用语、龙语
  desc: 蛇人憎恶已经舍弃了几乎所有人类的特征，变得犹如直立行走的巨型蛇类，拥有鳞片覆盖的手臂和双手。在战斗中，他们乐于用强力的蛇身绞杀敌人或用毒牙攻击。这些憎恶还能变形为蛇类，变身后与普通蛇类毫无区别。 蛇人憎恶的真正威胁并非来自其肉体力量，而在于其狡诈本性。这些幕后主使常领导着由其他蛇人组成的邪教式秘密团体，指挥他们实施错综复杂的阴谋。憎恶们通常会躲在由蛇人与蛇形守卫保护的隐秘堡垒中运筹帷幄，避免自身涉险。这些冷酷的首领对于赋予蛇人力量的超自然存在有着独特理解，往往还掌握着恶毒的法术陷阱与应急预案。
    渴望权力的蛇形阴谋家 通过与邪恶的超自然力量缔结契约，蛇人用他们的人性换取蛇类的致命性和捕食的狡诈。他们从隐藏的堡垒中操纵统治者和富人，试图控制世界。许多蛇人拥有剧毒魔法，这通常表现为毒牙或攻击性的蛇。 蛇人拥有人形的外表，但却带有各种令人毛骨悚然的蛇类特征。有些蛇人身上散布着爬行动物的鳞片，而另一些则是体型巨大、更像蛇而非人的生物。通常，蛇人越像蛇，他们在同类中的地位就越高。
    蛇人可能通过危险的超自然仪式获得他们的爬虫特征。掷骰或从蛇人转化表中选择一个结果，来启发蛇人如何获得他们的蛇类特征。 蛇人转化 强大的魔法，扭曲而腐化......无法估量的恶意......肉身被重塑，变成蛇形恐怖生物......
