# 《怪物图鉴（2025）》的数据卡（中文）：名字 / 体型 / 数值 / 动作
#
# 由 ``scripts/build_monsters_from_5etools.py`` 从 5etools 中文站转来（原文不进仓库）。
# 这一批**代替了原先 AI 手写的怪物表**：数值以书上为准。
# 攻击加值不写死：由「熟练加值（按 CR）+ 属性调整值」现算，攻击属性按
# 「命中加值 − 熟练加值」反推，所以与书上的 +N 对得上。
# 特性 / 动作正文是中文原文，5etools 的标签（{@hit} 之类）在转换时已剥掉。
# 生物类型只留 14 个基础类。描述（desc）来自 fluff-bestiary-xmm.json：
# 图鉴里那段「这东西长什么样、怎么活」的正文；栖息地 / 宝藏 / 阵营另立字段，
# 施法与传奇·巢穴·神话动作并进 traits，状态免疫也挂 traits——图鉴给的文字一条不丢。

