  desc: 许多年轻的青铜龙成为某类问题的专家，比如驱赶海盗或保护社区免受风暴侵袭。年轻的青铜龙结交各种专业的朋友，培养一个他们可以依赖的专家社区。 潜能与守护之龙 青铜龙栖息之地，奇迹繁盛。这些金属龙富有想象力却又深思熟虑，致力于成就伟业，并帮助他人发挥全部潜力。它们竭力保存创新，从古代文明的杰作到崭新发现，并广泛分享这些作品。在与寿命较短的生物交往时，青铜龙更倾向于通过对话和培养来赢得他们的认同，但当恶徒阻碍他人实现潜能时，它们也不会回避战斗。
