  desc: 远古银龙追求世界级的改变。银龙捍卫自己的社群与盟友，鼓励它们实现传奇伟业。一些银龙将目光投向其他的世界与位面，建立跨越位面的联盟，打击横跨诸界的威胁。银龙也许在许多社会中都有伪装身份，并和英勇之人或组织缔结世代相传的友谊。 勇气与公正之龙
    银龙致力于维护和平并鼓励伟大。他们努力成为正直的榜样，同时保持警惕对抗邪恶。 银龙通常居住在白雪皑皑的群山之中，尽管抱负和亲和力驱使其中一些生活在多元化的社会中。它们伪装成类人生物，与艺术家、历史学家、骑士以及谦逊的领导者结盟，这些人从过去汲取教训，以创造更美好的未来。
    银龙从传说中的英雄身上汲取灵感，并怀有宏大的抱负。许多银龙会收集反映这些兴趣的宝藏，例如历史典籍、古代艺术品和著名勇士的装备。 银龙通常栖居于如画般的山间隐居地或雕刻的云"岛"之上。
