  desc: 死亡之外的眼魔 死亡暴君是一种超越死亡追求异常目标的眼魔。十个魔法奇点——它魔法眼睛仅存的遗迹——环绕着它漂浮的独眼巨颅旋转，而它中央眼窝中的憎恨视线能够抑制生命并唤起死者。 眼魔通常会在数年间转变为死亡暴君，当它们的梦境固着于死亡、病态的升华或前往不适宜生命的位面之旅。一些死亡暴君从被杀眼魔的尸体中崛起，或是暴露于奇异魔法或幽暗地域辐射的结果。有时眼魔会故意追求这种不死状态，就像堕落的法师追求巫妖之身一样，尽管这种情况很罕见，因为大多数眼魔已经认为自己就是完美的存在。
    无论死亡暴君如何诞生，奇异的冲动驱使着它们不朽的存在。它们的动机往往极端或超出生物的理解范围。 死亡暴君常常潜伏在幽暗地域的深处，生活在他们生前占据的隧道迷宫中，或是被他们征服的敌对眼魔的巢穴里。这些巢穴中毫无生机，因为死亡暴君会将他们的仆从转变为不死的恐怖存在。
