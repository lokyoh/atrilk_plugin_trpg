  senses: 黑暗视觉 120 尺、被动察觉 17
  languages: 通用语以及两门其他语言
  desc: 吸血鬼是令人恐惧的猎手和操纵者。他们利用自己的力量变形并扭曲其他生物的意志，在数代人中恐吓并以人类为食。 黑夜吸血的领主 吸血鬼隐藏了他们被诅咒的永生本性，假扮成凡人以吸食活人的鲜血。虽然最年轻的吸血鬼可能只是他们创造者的嗜血奴仆，但最年长的吸血鬼则拥有难以置信的狡诈和对夜间超自然力量的控制。
    不死的吸血鬼在白天处于休眠状态，退避到远离敌人和太阳灼热光线的安息之所。从吸血鬼安息之所表中掷骰或选择一个结果，来激发吸血鬼的阴森庇护所。 吸血鬼休息处 吸血鬼和吸血鬼暗影领主会为自身打造远离生者的庇护所，无论是隐匿于繁华都市中，还是在生前栖息的废墟深处。
    亲爱的，你真是令人陶醉...
