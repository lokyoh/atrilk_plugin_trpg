  senses: 真实视觉 60 尺、被动察觉 21
  languages: 所有
  desc: 禁忌秘闻与魔法邪念的女巫 大鬼婆永生不朽且难以预料，它们囤积秘密，进行魔法交易，扭曲命运以满足自己的突发奇想。这些永恒的阴谋家探寻着多元宇宙的秘密，并在追寻这神秘莫测的目标的道路上编织着奇诡的魔法。 大鬼婆反复无常、自私自利、贪得无厌且装模作样，却还有着古怪的魅力。尽管如此，它们常常通过交易来推进自己的阴谋。这些鬼婆是秘密知识的源泉，尤为熟知那些关于禁忌魔法和多元宇宙秘密的学识。鬼婆可能会分享这些知识，但聆听它们的秘密总有代价。若想要换取这些秘密，大鬼婆可能会要求一项特别的差事、一件贵重的魔法物品或者非物质的货币，如某人的记忆、一年的生命或哭泣的能力，作为交换。
    大部分大鬼婆都会避免战斗，但如果不得不打，大鬼婆就会释放危险的魔法，比如幽魂利爪、弧状闪电、以及各种扭曲心智的法术。大鬼婆可以诅咒其他魔法使，让施法者无法念出准确的咒语，迫使施法者说出和自己原意相反的话。即使落了下风，鬼婆事先的准备也会让其以魔法溜之大吉，并开始策划复仇。
    每一位大鬼婆都有一个独特的弱点，这和鬼婆过去一次影响命运的遭遇，或是某件和其魔法相对的事物有关。鬼婆会不遗余力地保守这个弱点的秘密。尽管鬼婆不会因为弱点而受到物理意义上的伤害，但只有弱点在其附近时，鬼婆才能被彻底杀死。掷一次大鬼婆克星表或从中选择一个结果，以此启发一位大鬼婆有什么样的弱点。
    嗬！知道太多的人会变得更老。问出你的问题吧，但你得知道，每个秘密都有价格。 大鬼婆克星 每一位大鬼婆都会创造自己的魔法家园，比如一个隐藏的半位面，一座建造在风暴云上的大宅或——就像大鬼婆芭芭雅嘎一样——一座长着巨大鸡腿的小屋。这些巢穴内部会经常变化，或是呈现出令人困惑的特征。
