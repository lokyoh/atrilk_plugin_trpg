  - 传奇·切齿：眼魔发动两次啃咬攻击。
  - 传奇·怒视：眼魔使用眼波射线。
  senses: 黑暗视觉 120 尺、被动察觉 22
  languages: 深潜语、地底通用语
  desc: 恶名昭彰的多眼暴君 眼魔（亦称作巨眼暴君）是幽暗地域内最为声名狼藉的住民之一。在多元宇宙中鲜有生物能如这些狂暴恐怖的怪物般受人厌恶和畏惧。 一张巨口和一只位于中央的巨眼主宰着眼魔独特的球状躯体。十条末端长有小眼的触须环绕在其躯体顶部。这十一只眼睛中的任意一只都可以被眼魔用以施放不同的魔法能力。中央的主眼可以压制魔法，而其他的小眼则可以射出能够造成不同致命影响的射线——例如石化生物，解离生物，对生物造成即死效果，或是其他效应。
    眼魔拥有完全异质的思维方式。大多数眼魔都拥有偏执、自恋和自大的倾向，而且其行为逻辑往往超越人类的理性范畴。它们中的一部分会选择离群索居，另一部分则会奴役弱小的生物为它们服务。更有甚者怀揣着巨大的野心，它们会利用自己的仆役建立网络来操纵各个集团，聚居地，以及幽暗地域中的一整个国家，有时甚至会触及地表世界。
    最痛恨眼魔的生物往往也是眼魔。每个眼魔都自诩为同族中肉体和思想层面的顶尖者。对它们来说，其他所有眼魔都是必须征服或摧毁的异类对手。眼魔之间的争斗可以持续数十年之久，而这也会导致大面积的地下疆域化为废土。 眼魔对冒险者构成特殊威胁，因为两者都倾向于前往神秘的功亏一篑和伟大魔法的地点。许多眼魔会收集魔法物品和它们击败的英雄的石化身体，将它们作为战利品展示。
    眼魔潜伏于幽暗地域深处，利用自己眼睛的射线所挖掘出的洞穴系统之中，或是一些由它们的仆从为它们建造的巢穴中。
