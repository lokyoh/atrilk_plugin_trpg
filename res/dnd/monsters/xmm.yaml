  desc: 灾祸恶魔 恐怖于其规模和压倒性的力量，戈里斯托是能够毁灭城市的巨型恶魔。这些恶魔体现了无意义的无政府主义和虚无主义的破坏，它们特别讨厌与它们体型相当的生物或建筑。城堡、塔楼、巨人和战争巨兽都是这些怪物愤怒下的常见受害者。 戈瑞斯特罗如同佝偻的远古牛头人，身上带有深渊战争的伤痕或强大战争机器造成的创伤。它们的样貌反映了它们的创造者巴弗灭，这位被许多邪恶牛头人所崇拜的恶魔领主。戈瑞斯特罗在巴弗灭的深渊领域——被称为无尽迷宫的庞大魔法迷宫中游荡，并将任何遇到的非恶魔生物碾成肉泥。
    策划与谋略，诱饵与阴谋，但傲慢无法抵御毁灭的化身，比你们更强大的存在也在无底深渊的猛攻下陨落。
