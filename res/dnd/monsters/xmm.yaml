  desc: 勇敢的狮身人面像守护着改变世界或危险的秘密——奇异真相的证据、致命的圣物以及不应存在的事物。它们居住于隐秘的魔法之地，并将职责置于凡人之生命之上。若受到威胁，勇敢的狮身人面像会以其超自然强化的咆哮和猛烈的攻击来捍卫其职责。 秘密的收集者与守护者
