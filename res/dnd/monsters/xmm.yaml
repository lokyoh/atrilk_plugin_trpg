  senses: 黑暗视觉 60 尺、被动察觉 10
  languages: 通用语、地精语
  desc: 地精战士可能会独自狩猎和袭击，或者与训练有素的獒犬、座狼、地精帮派或其他盟友一起行动。他们使用简单的战术，并充分利用盟友提供的每一项优势。为了追求胜利，他们愿意牺牲同伴。 征服每一个地平线 大地精体现了生长与扩张的原始冲动，他们通过按照自己的意愿改造世界来表达这种冲动。独自行动的大地精会占领林地领土并掠夺荒野。在群体中，他们形成等级分明的军事社会，致力于征服土地并剥离资源，以满足他们的扩张狂热。
