  desc: 炽热深渊巨人 火巨人居住在山脉深处的空洞拱顶和熔岩河流中。在那里，他们利用地下的热量和财富来铸造奇迹，从巨大的战争武器到精致的艺术品。 火巨人拥有宽阔的骨架，多种岩石般的肤色，以及火焰般的头发。 大多数火巨人居住在火山活跃的山区或深邃的洞穴中，那里建有他们的要塞熔炉。邪恶的火巨人往往以军事为念，他们锻造强大的武器以征服邻邦并夺取宝贵的资源。较为温和的火巨人则用他们的作品换取所需，并可能与其他工匠分享巨人工匠的古老技艺。无论是哪种情况，火巨人都倾向于进行雄心勃勃的设计，并且在他们庞大的工坊中，他们很少喜欢被打扰。
