  desc: 复仇与正义之怒的魔鬼 厄里倪厄斯，也被称为复仇女神，是身披邪恶盔甲的有翼魔鬼。这些堕落天使执行着一种无情的神圣正义，追捕违背誓言者，并用他们神奇的绳索将应受诅咒的人拖入九层地狱。很少有人能窥见这些魔鬼盔甲之下隐藏着什么，而厄里倪厄斯确保那些见过的人永远无法说出他们所看到的一切。
    厄里倪厄斯常为大魔鬼服务，守卫九层地狱的秩序，抵御入侵者和逃亡者。尽管她们容易暴怒，但与其他魔鬼合作良好。她们有时会与其他厄里倪厄斯组成三人小队进行猎杀，为自己赢得了恶名昭著的声誉。 当不为魔鬼主人服务时，复仇女神们会追捕邪恶的灵魂。它们会无情地追捕猎物，穿越多元宇宙，甚至不惜耗费数百年时间。虽然它们可能被召唤来为邪恶的魔法使服务，但复仇女神们也会聆听以其名义立下的誓言和诅咒。在极少数情况下，被不公正对待的凡人若以正义的愤怒呼唤，可能会被复仇女神听到，后者会现身为其复仇。一旦复仇女神被如此召唤，它们不会在没有夺取猎物或召唤者的灵魂之前离开。
