  desc: 多头掠夺者 凶猛且不可预测的奇美拉融合了狮子、公羊和红龙最致命的特征。凭借它们可怕的利爪、粉碎性的角以及炽热的吐息，奇美拉是狂暴的风暴，被它们三个头的冲突本能所驱使。它们的头只在一点上达成一致：那就是它们渴望进食并驱逐那些在它们巢穴所在的崎岖领地内的竞争者。当奇美拉发现猎物时，通常会先用吐息扫射敌人，然后落地用它们的尖牙、角和利爪进行攻击。
    由于它们的龙类本能，奇美拉是贪婪的生物，会在洞穴巢穴中囤积财宝。它们对所收集的物品毫不挑剔，除了战利品和最近猎杀所得的骨头外，还会收集闪亮的物体。勇敢的人可以通过提供财宝和食物来分散或暂时安抚奇美拉。
