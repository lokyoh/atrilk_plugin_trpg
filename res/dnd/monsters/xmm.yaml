  desc: 释放的吞噬万物之宇宙熵 湮灭粘液是宇宙熵的凝结体，与死去神祇的遗骸结合。这个恶意实体在敌对生命的星界与多元宇宙的广阔区域中漂流——在这些广阔的区域中，遇到它的几率很低。 这团物质在灾难或虚无主义魔法使将其召唤到有人居住的领域时构成最大威胁。一旦释放，毁灭之团便以巨大的宇宙旋涡形式横扫大地，其碎片分裂开来并吞噬目标。这团物质吞噬它所遇到的一切，将森林、村庄和堡垒卷入其中。在团内是一个没有空气或重力的广阔空间，熵力摧毁所有被吞噬的东西。没有什么能在其中长期存活。
    只有魔法物品以及神和泰坦的尸体能够在这团物质中保存下来。因此，寻宝者和神学家有时会冒险尝试从中取出某些东西。这种任务通常以毁灭告终，但偶尔也会带来一生难得一见的发现。 当这个团块出现时，从湮灭团块内容表中掷骰或选择一个结果，以激发其粘液中残留的非凡之物。
    亲爱的，我见过的恐怖场面足以让你吓得尿裤子，然后赶紧找最近的酒喝。还有一种湮灭之团。如果你看到它，赶紧跑。如果你逃不掉，那就只能希望自己快点溶解掉。 湮灭之球内容
