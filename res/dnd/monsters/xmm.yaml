  desc: 怨毒蛇形怨恨守护者 幽灵娜迦憎恨这个世界以及所有的生物。拥有完美记忆的这些毒蛇般的生物，在它们不朽的存在中，会记起每一件针对它们的轻蔑行为。在它们阴冷、毫无欢乐的巢穴中，它们策划着恶毒的阴谋，为即使是微不足道的冒犯复仇。 灵蛇妖寻求夺取她们认为自己应得之物。她们的阴谋往往涉及毒药、邪恶法术、被诅咒的物品或魔法强制，最终使她们成为邪恶知识与灵感的源泉。其他反派常会寻求灵蛇妖作为顾问与盟友。请从灵蛇妖怨念表中掷骰或选择一个结果，以启发驱动灵蛇妖阴谋的动机。
