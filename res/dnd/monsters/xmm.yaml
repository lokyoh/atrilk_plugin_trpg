  languages: ''
  desc: 格里克可以活上数百年，最年长的能长到巨大的体型。年长的格里克更倾向于主动狩猎而非埋伏，并且它们毫不介意吞食较小的格里克。 狩猎黑暗与腐朽之虫 格里克是蠕虫般的掠食者，它们从藏身处突然冲出——挥舞着触须并猛咬——以吞噬任何接近的猎物。它们隐藏在洞穴裂缝或倒木之中，过去餐食的散落骨骼和物品是它们威胁的唯一证据。
    格里克的起源尚不明确，但有人认为这些生物是由自然界的蠕虫或类似的无脊椎动物经过魔法现象突变而来。许多人将格里克在某一地区的出现视为通往其他存在位面的门户、传奇魔法物品或强大超自然生物存在的证据。
