  - 动作·恐怖怒视：感知豁免 DC 11，单一 60 尺内木乃伊可见的生物。失败： 目标陷入恐慌状态，直至木乃伊的下个回合结束。成功： 目标在 24 小时内免疫此木乃伊的恐怖怒视。
  senses: 黑暗视觉 60 尺、被动察觉 11
  languages: 通用语以及两门其他语言
  desc: 普通木乃伊是经过魔法葬礼仪式的祭司、贵族或信仰英雄的遗体。一些通过亚麻布包裹或粘土保存，而另一些则通过泥炭沼泽、冰块、魔法或其他手段保存。 掷骰或从木乃伊复活表中选择一个结果，以确定木乃伊为何从死亡中归来。 木乃伊复苏 规则 7：在打开石棺之前，先点燃火把。
    不朽古灵与永恒野心 神秘的仪式和强大的信仰可以将灵魂与他们的尸体绑定，使其永远依附于遗骸之中。如果他们的安息之地被侵犯，这些被称为木乃伊的存在会重新激活他们腐朽的躯体，以恢复他们坟墓的神圣并惩罚那些打扰他们安息的人。 木乃伊会追捕那些冒犯它们的人，通常是亵渎它们安息之地、窃取它们陪葬品或玷污与它们信仰相关的场所的凡人。怀着不死的愤怒，这些古老的尸体会不遗余力地复仇，并恢复它们需要的东西以找到安宁。
    木乃伊看上去可能很脆弱，但其身体拥有超自然的力量，它的目光可以让最勇敢的心也感到恐惧。那些逃脱木乃伊抓握的人可能会发现自己遭受了可怕的诅咒。木乃伊诅咒的受害者会逐渐枯萎，他们的身体腐烂直到化为尘土。这种诅咒只能通过移除诅咒法术或类似的魔法来治愈。
