    大多数兽主都定居在万兽乡，但它们偶尔也会去妖精荒野或是其他田园诗般优美的国度旅行。它们很少旅行至物质位面，唯有世界面临自然灾害或万兽群聚或是其他危险时才会现身。 尽管最出名的兽主是庇护着猫、鹰、蜥蜴、狼的那些，但其实每一种野兽都有其对应的兽主。一些兽主甚至对应在物质位面中少见甚至绝迹的生物，例如巨型动物或者恐龙。兽主可以用其神圣伟力召唤灵体兽群，引导万兽之魂的能量，并展现来自三大族群之一的威能：觅兽，猎兽、睿兽。这些能力与兽主所对应的动物族群密切相关，其个性与特质亦是如此。掷一次兽主造型表或从中选择一个结果，以此启发一名兽主对应着哪种动物。
