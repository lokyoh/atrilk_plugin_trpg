  desc: 精灵位面的难寻之守护者 小仙灵们居住在由妖精荒野魔法所触动的神秘森林中，与大多数其他妖精和自然的朋友和平共处。这些一英尺高的自然精灵看起来像精灵，但有着夸张、奇幻的特征和薄纱般的翅膀。 小仙灵能感知其他生物内在的善良或不义。那些怀着善意进入它们领域的生物可能会受到微型盛宴和庆祝活动的款待。恶意者则会面对由隐形小仙灵护卫发起的唬人把戏和大胆伏击。这些林地护卫用迷人魔法附魔它们微型弓箭的箭矢，可以刺穿最凶猛敌人的心。
    小仙灵们反对任何试图伤害自然魔法与美丽之地的生物。这使他们与潜在的定居者、如蜘蛛怪的怪物以及如哥布林类和女巫的破坏者发生冲突。他们经常帮助森林中的其他善良生物，包括树人树和独角兽，共同保卫家园。 那棵树的枝干上曾有一个小村庄，我发誓。接下来我只知道我脸朝下趴在地上。我的脑子里满是星星，当我站起来环顾四周时，那棵树和那个小村庄都消失了。
