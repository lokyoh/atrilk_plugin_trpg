  desc: 邪教大师是监督下属生活的领导者，他们颁布邪教的法令并解读其守护者的意志。他们拥有从邪教守护者、超自然源头或自身狂热中获得的神秘力量。这些领导者知晓邪教最深的秘密，通常控制着奇异的遗物、神秘的地点和怪物的仆从。 宣扬末日，不移狂信
    邪教徒使用魔法以及其他极端手段来传播其激进的信仰。一些邪教团是追求玄奥隐秘的密教团体，而另一些则是活跃于暗面的阴谋集团，意图实现某种怖人的大业。邪教徒们通常遵循着晦涩的密教习俗行事，或是醉心于解读古老的预言。它们还可能将其信仰献上给超自然的宗主——神灵、异界的生物、擅于操弄凡人的异质心灵、甚至是其他更加诡异的力量。掷一次邪教大业表或从中选择一个结果，以此启发一伙邪教徒们会意欲达成什么样的目标。
    邪教大业 邪教徒通常依靠圣印来分辨教团的成员。这些圣印通常印在邪教的标志性物品上，亦可能印在衣物上、甚至可能直接刻在邪教徒的身体上。圣印的意义可能很容易理解，亦可能只有教团成员才能分辨。掷一次邪教圣印表或从中选择一个结果，以此启发邪教团会使用什么作为自己的标志。
    邪教圣印 邪教通常围绕一位有魅力或专制的领导者形成层级结构。尽管邪教成员可能会独立行动，但他们仍从拥有更强大超自然力量的上司那里接受命令。 教派可以围绕任何神秘传统组织起来，但许多教派服务于超自然存在。教派成员通常拥有与他们所崇拜力量相关的能力。
