  desc: 银龙幼龙通常与一位或多位父母或导师生活在一起，在独立生活之前学习了许多关于世界及其历史的知识。 勇气与公正之龙 银龙致力于维护和平并鼓励伟大。他们努力成为正直的榜样，同时保持警惕对抗邪恶。 银龙通常居住在白雪皑皑的群山之中，尽管抱负和亲和力驱使其中一些生活在多元化的社会中。它们伪装成类人生物，与艺术家、历史学家、骑士以及谦逊的领导者结盟，这些人从过去汲取教训，以创造更美好的未来。
