    许多道族将土元素位面称为家园。在那里，他们建造了闪烁着宝藏的城市。在这些领域中，有一个迷宫般的广阔区域被称为大阴森洞穴或七重迷宫，它保护着珠宝之城、铁匠坩埚和磁石海峡。 在地元素位面中，宝石星系在宝藏穹顶上闪烁。如果那儿有大地精，那就有值得追寻的财富。
