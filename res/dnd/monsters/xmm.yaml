  languages: 理解通用语，但不会说
  desc: 单独活动的蠕行之爪可能会继续他们生前的杀戮。有的是无差别攻击活人，也有的是针对特定目标。在极少数情况下，在身体其他部分仍然存活的情况下，蠕行之爪也能复生作乱，其本体生物可能完全意识不到自己断手所犯下的杀孽。 带恶意意志的断裂残肢
    爬行爪是自行移动并按照其凶残意志行动的被切断的手。这些不朽的附肢可以从杀手和恶棍的断肢中复活，邪恶的魔法使可能会将爬行爪作为卑劣仆人加以活化。爬行爪以多种形式出现，从腐烂的人类手掌到动物或怪物的新鲜肢体 是否有任何生物、任何生命体，生来就是邪恶的？这样的论断本身可能会助长邪恶行为的实施。通过将一个人定义为邪恶，我们给了他们任意行事的自由，免除了他们言语之恶和手中之恶的责任。
