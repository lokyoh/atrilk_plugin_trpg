  desc: 枯藤缠绕怪的外形酷似被藤蔓缠绕的人类，缠绕它们的藤蔓与其生长区域的常见藤蔓一致——可能是带绒毛的常春藤，也可能是会开花的葛藤。它们能催动植物从自身周围的地面破土而出，将附近的敌人缠绕束缚。 与其他枯萎者不同，藤蔓枯萎者能够说话。它们很少开口，通常只是为了传达主人的信息，或者用沙哑的声音重复受害者的话语。
    邪恶萌芽的植物 枯萎怪是从根深蒂固的邪恶中涌现的恶意植物。它们扭曲的形态有着令人恐惧的特征，仿佛人类的四肢和凶残的巨口。枯萎怪潜伏在常见的植被中伺机而动，然后痛击非同类的生物。虽然枯萎怪可以独立行动，但它们通常受催生它们的邪恶力量或者被那些有掌控自然能力的邪恶生物所驱使。创造枯萎怪的魔法往往也会波及其他植物，导致荆棘、藤蔓和扭曲的树木淹没道路和田野，堵塞水井和溪流，迫使动物离开它们原本的栖息地。这或许意味着枯萎怪是即将到来的腐化狂潮的第一个征兆。
    虽然它看起来死了，但其实它活着。很久很久以前，正是在这个地点，有人将一个吸血鬼钉死在大地上。吸血鬼那邪恶的原初威能在这里回荡，于是，甘提亚斯树诞生了。
