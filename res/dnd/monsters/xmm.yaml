    食腐虫在下水道、战场、公墓和臭气熏天的荒野之间扫荡尸体，还会倒吊在天花板上伏击体型更小的猎物同时避开其他互相竞争的猎手。它们会被光线和血腥味吸引，认为这是食物的信号。 这些食腐动物会避免摄入无机物。墓穴中只会剩下空空如也的陪葬铠甲，里面的尸体则被吮吸干净。过分干净的地下墓穴往往是食腐虫肆虐的标志。
