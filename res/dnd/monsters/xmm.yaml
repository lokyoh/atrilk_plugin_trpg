  desc: 战略与纷争的尤格罗斯魔 恶魔般的战争贩子，尼卡洛斯喜欢战斗与征服。这些巨大的有翼尤格罗斯魔在战场上四处传送并飞入空中以迷惑敌人，并用不断变换的、焦炎火狱锻造的战斧进行攻击——这些如汞般变幻的武器与许多尤格罗斯魔所偏爱的类似。 尼卡洛斯可能指挥着梅佐洛斯的小队，并与阿卡纳洛斯、乌尔特洛斯、恶魔军阀或邪恶的凡人签订契约，为其服务。只要能够满足他们的嗜血欲望，大多数尼卡洛斯都愿意服从更强大或更狡猾的生物。有些尼卡洛斯甚至会超越契约的期限，继续为能干的领袖服务，以实现长期追求的目标。但将尼卡洛斯引向失败的主人，应当畏惧这些骄傲的尤格罗斯的报复。
