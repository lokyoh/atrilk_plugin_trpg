  senses: 盲视 10 尺、黑暗视觉 60 尺、被动察觉 14
  languages: 龙语
  desc: 金龙幼龙从长辈那里学到了很多，然后出发去拯救世界。这些幼龙理想主义且好奇心强，他们寻求纠正明显的错误，并在他们帮助的人中结交朋友。 希望与威严之龙 金龙致力于让世界变得更美好。作为金属龙中最强大的一种，这些令人敬畏的巨龙努力保护正义，并推动命运走向更光明的未来。然而，他们善良的本性并不妨碍在必要时参与战斗，他们会呼出璀璨的火焰和削弱魔法的力量来击溃敌人。
    金龙偏爱草原和原始森林，经常居住在令人惊叹的自然奇观附近或守护着古代文明的遗迹。在它们的巢穴中，金龙会囤积硬币和宝石，但它们经常将财富用于追求更大的目标。它们常常用财富购买稀有知识书籍，支付线人报酬，或资助理想主义的冒险者。 金龙选择在自然和魔法奇迹之地安家。
