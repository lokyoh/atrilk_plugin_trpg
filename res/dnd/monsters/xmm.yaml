  senses: 被动察觉 11
  languages: 通用语，外加另外一门语言
  desc: 除了作为能力出众的战士外，海盗还是经验丰富的航海家，他们知道如何驾驶和维护船只。虽然有些人忠诚地遵循船长的命令，但另一些人则将贪婪、迷信或自保置于职责之上。 自由探险者与财富猎人 "海盗"一词涵盖了广泛的海上冒险者，包括凶残的海盗、顽强的私掠者、被诅咒的宝藏猎人以及其他在海上寻求财富与名望的人。
    海盗可能是盟友、敌人、变数，或者是这些的某种组合。虽然他们是商人和沿海社区的灾星，但他们知道海洋的秘密以及如何避开水中的威胁。更不寻常的海盗将目光投向波浪之外，使用飞艇、法术航行船只、位面穿梭船或更奇怪的交通工具来探索和突袭不可思议的领域。
    为了恐吓对手并传播他们的名声，海盗船队会悬挂独特的旗帜。你可以在海盗旗帜表中掷骰两次或选择结果，来为海盗船队设计他们悬挂的旗帜。 海盗旗
