  desc: 渗透者可以伪装成人类，他们蛇类特征仅限于鳞片皮肤、分叉的舌头和其他轻微或内部的变化。这些间谍潜入他们的敌人之中，操纵他人并使敌人更容易受到更强大的蛇人阴谋的影响。 渴望权力的蛇形阴谋家 通过与邪恶的超自然力量缔结契约，蛇人用他们的人性换取蛇类的致命性和捕食的狡诈。他们从隐藏的堡垒中操纵统治者和富人，试图控制世界。许多蛇人拥有剧毒魔法，这通常表现为毒牙或攻击性的蛇。
    蛇人拥有人形的外表，但却带有各种令人毛骨悚然的蛇类特征。有些蛇人身上散布着爬行动物的鳞片，而另一些则是体型巨大、更像蛇而非人的生物。通常，蛇人越像蛇，他们在同类中的地位就越高。 蛇人可能通过危险的超自然仪式获得他们的爬虫特征。掷骰或从蛇人转化表中选择一个结果，来启发蛇人如何获得他们的蛇类特征。
