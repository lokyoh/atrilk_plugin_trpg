  desc: 力量与威吓的魔鬼 须魔又被称为巴霸魔Barbazu，它们是九狱军团的中流砥柱。这些残忍的士兵在魔鬼将军麾下服役，护卫九狱领土、入侵物质位面、在跨越维度的血战中与恶魔一决生死。 如果让须魔自行决定如何哄骗凡人，那么须魔会鼓励凡人变得冷血无情并滥用力量，使凡人自我膨胀；这样的凡人虽然其手握的权力可能不大，但也同样擅长打压他人。
