  senses: 盲视 10 尺、黑暗视觉 60 尺、被动察觉 14
  languages: 龙语
  desc: 黄铜龙雏龙有着永无餍足的好奇心。这些小龙会热切地缠上友善生灵，并热爱探索有故事的地方。一旦让这些小龙听到冒险故事，它们就会热衷于开启自己的"天命征途"。 传说与亲缘之龙 黄铜龙性格开朗外向，喜欢分享知识和故事。尽管这些金属龙偏爱干旱的土地，但它们会愉快地长途跋涉去拜访友好的生物，传递它们所学到的东西，并收集新闻。虽然本性善良，但黄铜龙在必要时也不会回避战斗，会用魔法睡眠来挫败敌人，并用火焰灼烧它们。
    黄铜龙偏爱温暖的气候，尤其是草原和岩石或沙质沙漠，它们通常居住在重要的十字路口或经常吸引游客的绿洲附近。它们喜欢化为人形，伪装成旅行商人、学者、讲故事的人或任何对其他人的故事感兴趣的人。 黄铜龙喜欢收集各式各样的物品。虽然这些物品可能看起来像是小玩意儿，但每一件都是一段故事的一部分——或许是一个令人怀念的纪念品，或是一个传为神话的故事的证据。一位老朋友的帽子和一个被遗忘王朝最后一位统治者的王冠，可能会在黄铜龙的宝藏中占据同一个架子。
    黄铜龙通常居住在人迹罕至的路线附近的秘密洞穴和峡谷中。
