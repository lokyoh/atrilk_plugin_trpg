  desc: 巅峰巨人 云巨人利用天空的力量观察并微妙地影响世界。这些巨人形似人类，头发从银色到蓝色不等，肤色如云般从纯白到暮色色调。弯曲的犬齿长在上颚，延伸至下唇之外。在战斗中，他们使用被风暴云环绕的武器攻击，并投掷轰鸣的雷云。 大多数云巨人居住在高耸入云的山巅要塞或漂浮于云端的魔法宫殿中。许多这些巨人相信他们也拥有同样崇高的地位或使命。一些人自视为神一般的存在，可以肆意操纵和掠夺地上生物。另一些人则声称他们的长寿和在云端的位置赋予了他们独特的视角，因此他们记录着他们见证的下界，而不加干预。无论是哪种情况，云巨人通常拥有惊人的魔法宝物，这些宝物要么是从世界各地掠夺而来，要么是他们自己创造的（并且根据他们的体型进行了巨大化处理）。
