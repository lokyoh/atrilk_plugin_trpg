  desc: 翼心猎手 佩利顿是猎食人类的凶猛掠食者，尤其是人类和精灵，胜过所有其他猎物。它们拥有强壮的食腐鸟类的身体和长着尖牙、类似雄鹿的头颅，利用伏击战术俯冲攻击旅行者。奇怪的是，它们的影子看起来像人形。这种超自然的怪事让人们相信佩利顿是被诅咒的人类或精灵，或是由以恶棍尸体为食的腐肉鸟类转化而来的传说。
