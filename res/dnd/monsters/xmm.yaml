  - 施法·施法：夺心魔施展以下一道法术，无需法术成分并使用智力作为施法属性（法术豁免DC 15）： 随意：侦测思想 每日1次：支配怪物、位面转移（仅自身）
  senses: 黑暗视觉 120 尺、被动察觉 16
  languages: 深潜语、地底通用语; 心灵感应 120 尺
  desc: 夺心魔对大脑的渴求仅被其对统治的渴望所超越，它会拥抱任何能让它同时满足这两者的阴谋。 脑食幽暗地域暴君 作为一个毁灭性跨宇宙帝国的散落生还者，夺心魔潜藏在物质位面世界深处隐秘的集会所中。在这些异域庇护所中，这些邪恶的主谋者——也被称为灵吸怪——改造幽暗地域及其居民，以满足他们深不可测的奇想。夺心魔因其灵能力量而令人恐惧，这些力量使他们能够使其他生物昏迷并加以控制，同时也因其可怕的进食方式而令人毛骨悚然：用他们四条粘滑的触须提取受害者的脑浆。
    灵吸怪是臭名昭著的阴谋家和操纵者，策划着超越其地下领域的计划。除了使用灵能控制他人外，灵吸怪还经常进行自身奇怪生命周期的实验，将类地底生物幼体植入其他生物体内，创造出不自然的仆从。像格利洛克和噬智怪这样的生物便是灵吸怪生物实验的产物，而其他居住在地底的怪物——包括寇涛鱼人、夸格魔和穴居人——则常常为灵吸怪主人服务。吉斯扬基人和吉斯泽莱人与灵吸怪有着悠久的敌对历史，并背负着灵吸怪操纵的伤痕。
    夺心魔可以单独行动，作为神秘阴谋集团的一员，或者作为跨世界的夺心魔阴谋的一部分。在群体中，夺心魔会按照由主脑——一种拥有难以置信心灵异能的大型脑状生物——组织的奇异议程行事。若没有这样的领导者，夺心魔群体会陷入自我毁灭的争吵中。掷骰或从夺心魔阴谋表中选择一个结果，以激发夺心魔集会的阴谋。
