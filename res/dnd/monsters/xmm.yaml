  desc: 掘地昆虫掠食者 超大型昆虫，掘地虫会在地表附近挖洞，形成广阔的地下迷宫。它们从这些隧道中突然冲出，用它们喷射消化酶来溶解并用滴着酸液的下颚吞噬较小的生物。 掘地虫是农民们的克星，农民们放羊的家畜很容易成为这些怪物的猎物。许多掘地虫都独自狩猎，但是在食物丰足的地区有时会有数十窝掘地虫聚集，给城镇带来威胁。只有彻底扫清掘地虫的隧道，并且清理干净它们的卵，这种怪物的巢穴才能真正被扫清。
