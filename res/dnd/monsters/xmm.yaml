  desc: 远古红龙是多元宇宙中最为可怖也是最具破坏性的存在之一。几乎没有任何人能承受住一条远古红龙降下的毁灭之怒。这些巨龙的贪婪程度与其毁灭之力的规模呈正比——其庞大宝库之中物华天宝，魔法物品，无所不包。其巢穴通常深深嵌入火山内部，甚至贯穿位面，从火元素位面中召来为其服务的仆从。
