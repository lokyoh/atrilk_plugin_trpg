  senses: 被动察觉 10
  languages: ''
  desc: 这 种 紫 色 的 蘑 菇 使 用 其 基 部 生 长 出 的 根 状 触 须 在 洞 穴 地 面 上 爬 行 。 从 紫 腐 菌 的 中 央 团 块 伸 出 的 四 根 茎 用 于 鞭 打 猎 物 ， 即 使 是 最 轻 微
    的 触 碰 也 能 使 腐 肉 迅 速 腐 烂 。 任 何 被 紫 腐 菌 杀 死 的 生 物 都 会 迅 速 分 解 。 从 腐 烂 的 尸 体 上 会 萌 发 出 新 的 紫 腐 菌 ， 在 { @ d i c e 2 d 6 }
    天 内 长 到 完 全 大 小 。 在地底世界幽暗地域，有着参差不齐的岩石天空和永恒的黑夜，这里是各种真菌的家园。在地下王国中，真菌取代了植物的位置，对许多地下生物的生存至关重要，它们在无情的黑暗中提供营养和庇护。 真菌在有机物质中产生，然后分解这些物质以供自身消耗，它们以污垢和尸体为食。随着真菌的成熟，它们会喷射孢子，这些孢子会随着最轻微的微风飘散，以产生新的真菌。
    不需要阳光或温暖来生长，真菌在幽暗地域的每一个角落和缝隙中茁壮成长。在那个地下王国弥漫的魔法的转变下，幽暗地域的真菌经常发展出强大的防御机制或模仿和攻击的能力。最大的样本可以扩散开来，创造出巨大的地下森林，无数的生物在其中生活和觅食。
  source: DoSI
  resistances: []
  aliases:
  - 紫腐蘑菇
