  traits:
  - 厌日症：若塞娜萨身处阳光下，其D20 检定具有劣势。塞娜萨待在阳光下超过 1 小时就会死亡。
  - 动作·多重攻击：塞娜萨发动一次猛击攻击并使用安抚孢子。
  - 动作·活化孢子 (3/日)：塞娜萨向 5 尺内一具非构装非亡灵的中型或小型尸体释放孢子。尸体会在 24 小时后活化为塞娜萨孢子奴仆。尸体会保持活化状态1d4 + 1周或直至被摧毁。曾以此法活化过的尸体无法再次以此法活化。
  - 动作·安抚孢子：体质豁免 DC 12，单一 10 尺内塞娜萨可见的生物。失败： 目标陷入震慑状态，并在其回合结束时重复豁免，成功则终止其身上的该效应。1 分钟后，其豁免自动成功。
  - 动作·通念孢子：孢子被释放在源自塞娜萨的 30 尺光环区域内。区域内任何智力值不低于 2 且非构装非元素非亡灵的生物获得 30 尺心灵感应，持续 1 小时。
