# 2014 版《怪物图鉴》补录的十只（MM）
#
# 2025 版图鉴删掉了一批生物，本项目用得上：兽人三兄弟（失落矿坑的兽人营地
# 写着兽人，英文源里 orc 在 2025 版零命中）与 2014 独有的动物（几个虫群和穴居熊）。
# 都取自 2014 版中文图鉴，出处标 MM——有出处，不是本项目自造的数值。
#
# ⚠️ 本表**只放这几只**：全量转会把 450 条 2014 的数据压到 2025 那批上
# （mm 排在 xmm 前面，同名先到先得）。

- key: mm_orc
  cn: 兽人
  en: Orc
  cr: 0.5
  size: 中型
  kind: 类人
  ac: 13
  hp: 15
  hit_dice: 2d8+6
  speed: 30
  abilities:
    str: 16
    dex: 12
    con: 16
    int: 7
    wis: 11
    cha: 10
  attacks:
  - name: 巨斧
    ability: str
    damage: 1d12+3
    damage_type: 挥砍
    reach: 5
  - name: 标枪
    ability: str
    damage: 1d6+3
    damage_type: 穿刺
    ranged_normal: 30
    ranged_max: 120
  saves: []
  skills:
  - intimidation
  traits:
  - 好斗：作为一个附赠动作项，兽人可以向一个它能看见的敌对生物移动至多相当于其速度的距离。
  senses: 黑暗视觉 60 尺、被动察觉 10
  languages: 通用语、兽人语
  desc: 兽人是野蛮的袭击者和掠夺者，他们有着弯腰驼背的姿势、低矮的额头和猪一样的面孔，以及突出的下犬齿，看起来像獠牙。 兽人崇拜格乌什，兽人神祇中最强大的存在，也是他们的创造者。兽人相信在古代，众神聚集在一起，将世界分给他们的追随者。当格乌什声称拥有山脉时，他得知它们已经被矮人占领。他声称拥有森林，但那些已经被精灵定居。格乌什想要的每一个地方都已经被占领了。其他神嘲笑格乌什，但他以愤怒的咆哮回应。紧握他强大的长矛，他摧毁了山脉，点燃了森林，并在田野上划出了巨大的沟渠。他宣布，这就是兽人的角色，夺取并摧毁所有其他种族拒绝给予他们的一切。直到今天，兽人仍在对人类、精灵、矮人和其他种族进行无休止的战争。
    兽人对精灵有着特别的仇恨。精灵神科瑞隆·拉瑞斯安用一箭射中了兽人神格乌什的眼睛，使他半盲。从那时起，兽人在屠杀精灵时特别感到快乐。格乌什将他的伤势转化为一种邪恶的礼物，他赋予任何为了纪念他而自愿挖出一只眼睛的冠军神圣的力量。 兽人以部落的形式聚集，通过掠夺村庄、吞噬或驱赶游荡的兽群，以及杀害任何反抗他们的类人生物来展示他们的统治力和满足他们的杀戮欲。在摧毁一个定居点后，兽人会将其洗劫一空，拿走财富和可以在他们自己土地上使用的物品。他们将村庄和营地的残余部分放火烧毁，然后撤退回他们来的地方，他们的杀戮欲得到了满足。
    兽人对屠杀的渴望要求他们始终处于对新目标发动攻击的距离之内。因此，他们很少永久定居，而是将废墟、洞穴群和被击败敌人的村庄改造成设防的营地和要塞。兽人只为了防御而建造，除了在尖刺的栅栏墙上或从护城河和壕沟突出的长矛上展示他们受害者的残肢之外，他们不会对他们的巢穴进行任何创新或改进。
    当现有的领土食物耗尽时，兽人部落会分成漫游的团伙，寻找最佳的狩猎场。每个团伙返回时，都会带回战利品和攻击目标的消息，其中最富饶的被选中。然后部落会集体出动，沿着血腥的道路前往它的新领土。 在极少数情况下，一个部落的领袖选择长期占据一个特别易守难攻的巢穴。这样的部落的兽人必须穿越广阔的乡村地区来满足他们的食欲。
    兽人部落大多是父权制的，拥有诸如Many-Arrows（多箭）、Screaming Eye（尖叫之眼）、Elf Ripper（精灵撕裂者）等生动或怪诞的称号。偶尔，一位强大的战争首领会将分散的兽人部落统一成一个单一的肆虐大军，从压倒性的力量地位出发，践踏其他兽人部落和类人生物定居点。
    力量和实力是兽人最崇尚的美德，他们欢迎所有强大的生物加入他们的部落。兽人摒弃了种族纯洁的观念，自豪地欢迎食人魔、巨魔、半兽人和奥罗格加入他们的行列。同时，兽人尊重并畏惧邪恶巨人的体型和力量，经常作为守卫和士兵为他们服务。 露希克，兽人的生育女神和格乌什的妻子，要求兽人频繁且不加选择地繁殖，以便兽人大军一代又一代地壮大。兽人繁殖的驱动力比其他任何类人种族都要强，他们愿意与其他种族杂交。当兽人与体型和体型相似的非兽人类（如人类或矮人）繁殖时，所生的孩子要么是兽人，要么是半兽人。当兽人与食人魔繁殖时，孩子是一个具有令人生畏的力量和野蛮特征的半食人魔，被称为奥格里隆。
  environment: 幽暗地域、山地、草地、森林、沼泽、丘陵、极地
  alignment: 混乱邪恶
  source: MM
  resistances: []
