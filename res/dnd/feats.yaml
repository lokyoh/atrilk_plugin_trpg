# 专长表（第五章）
#
# 2024 的专长分四类：**起源 / 通用 / 战斗风格 / 传奇恩惠**（4005）。这里只收
# **起源专长**——它们是建卡时由**背景**自动给的（3999 / 4099），其余三类要么
# 依赖等级（通用 / 传奇恩惠），要么由职业给（战斗风格），等 B5 高等级开卡、
# T9 子职一并补。
#
# ``benefits`` 只写**可判定**的效果（有没有骰子、加值、次数），不抄 flavor 原文；
# 完整措辞见手册第五章 4099-4112。带 ``hp_per_level`` 的是引擎会结算的数值
# （健壮 +2/级）。``spell_list`` 记魔法学徒要选的法术来源与数量。
#
# ⚠️ 背景 yaml 里的 ``feat`` 可能带括号（如「魔法学徒（牧师）」），
# 解析时按括号前的名字匹配本表（见 :func:`core.dnd.feats.get_feat`）。
#
# 数据源：参考/5etools-cn-cn2.0/data/feats.json（source=XPHB, category=O）。

- key: alert
  cn: 警觉
  en: Alert
  category: 起源
  benefits:
  - 先攻检定可以加上熟练加值
  - 掷完先攻后可立即与一名自愿盟友交换先攻（任一方失能则不能交换）

- key: crafter
  cn: 工匠
  en: Crafter
  category: 起源
  benefits:
  - 自选三种不同的工匠工具并获得其熟练
  - 购买非魔法物品享 20% 折扣
  - 每次长休结束时可用对应工具制作一件「快速制作」栏的装备，成品持续到下次长休结束

- key: healer
  cn: 医疗师
  en: Healer
  category: 起源
  benefits:
  - 战地医师：持医疗包时以一个动作消耗一次生命骰使用次数，救治 5 尺内一个生物；该生物消耗一枚生命骰，由你掷骰，恢复点数 + 你的熟练加值
  - 治疗重掷：用法术或本专长恢复生命时，掷出的 1 可以重掷一次，但必须用新结果

- key: lucky
  cn: 幸运
  en: Lucky
  category: 起源
  benefits:
  - 幸运点数量等于熟练加值，长休后回满
  - 优势：花 1 点让自己一次 d20 检定具有优势
  - 劣势：花 1 点让一个生物对你发动的攻击检定具有劣势

- key: magic_initiate
  cn: 魔法学徒
  en: Magic Initiate
  category: 起源
  spell_list:
    cantrips: 2
    level: 1
    count: 1
  benefits:
  - 两道戏法：从牧师 / 德鲁伊 / 法师法术表之一中选 2 道戏法习得（2024 起可从这三张表任选，不再限定法师）
  - 一环法术：再从同一张表选 1 道一环法术并始终准备着；每长休一次可不耗法术位施展它，也可以用已有法术位施展
  - 施法属性从 智力 / 感知 / 魅力 中自选（建卡未指定时按所选法术表的施法属性：牧师 / 德鲁伊用感知，法师用智力）
  - 改变法术：每升一级，可把本专长习得的一道法术换成同表同环的另一道
  - 复选：可多次选择本专长，但每次必须选不同的法术表

- key: musician
  cn: 音乐家
  en: Musician
  category: 起源
  benefits:
  - 自选三种乐器并获得其熟练
  - 鼓舞之歌：作为短休或长休的一部分演奏乐器，令听到的盟友获得英雄激励，人数至多等于你的熟练加值

- key: savage_attacker
  cn: 凶蛮打手
  en: Savage Attacker
  category: 起源
  benefits:
  - 每回合一次：用武器命中时可以掷两次武器伤害骰，自选其中一次应用

- key: skilled
  cn: 熟习
  en: Skilled
  category: 起源
  benefits:
  - 自选共计三项技能或工具熟练
  - 复选：可多次选择本专长

- key: tavern_brawler
  cn: 酒馆斗殴者
  en: Tavern Brawler
  category: 起源
  benefits:
  - 强化徒手打击：徒手打击命中造成 1d4 + 力量调整值的钝击伤害
  - 伤害重掷：徒手打击的伤害骰掷出 1 可重掷，但必须用新结果
  - 具有临时武器的熟练
  - 推离：自己回合内用攻击动作中的徒手打击命中生物时，可同时把它推离 5 尺；每回合一次

- key: tough
  cn: 健壮
  en: Tough
  category: 起源
  hp_per_level: 2
  benefits:
  - 生命值上限提升「当前角色等级 × 2」，此后每次升级再 +2（引擎按等级 ×2 结算）
