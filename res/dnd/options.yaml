# 1 级职业特性的「选择项」（PHB 2024）
#
# 2024 有 6 处 1 级特性要玩家挑：
#   牧师·圣职（divine_orders）、德鲁伊·原初职能（primal_orders）、战士·战斗风格（fighting_styles）、
#   魔契师·魔能祈唤（eldritch_invocations）、游荡者·专精（走技能表，不在这里）、
#   以及 5 个职业的武器精通（走武器表，不在这里）。
#
# 每条：key / cn（手册中文名）/ desc（一句话效果）/ 可选的结算字段
#   armor / weapons：额外受训（守护者、部分原初职能）
#   ac_bonus：护甲等级加值（防御）
#   ranged_attack_bonus：远程攻击加值（箭术）
# 没有结算字段的选项由 DM 按 desc 裁定（引擎只负责把它记在卡上）。

divine_orders:
- key: protector
  cn: 守护者
  desc: 获得军用武器与重甲受训
  armor:
  - 重甲
  weapons:
  - 军用武器
- key: thaumaturge
  cn: 施法者
  desc: 多习得一道牧师戏法；智力（奥秘/宗教）检定加感知调整值
  extra_cantrip: 1

primal_orders:
- key: magician
  cn: 术士
  desc: 多习得一道德鲁伊戏法；智力（奥秘/自然）检定加感知调整值
  extra_cantrip: 1
- key: warden
  cn: 守护者
  desc: 获得军用武器与中甲受训
  armor:
  - 中甲
  weapons:
  - 军用武器

# 战士 1 级·战斗风格（2024 的 10 项通用战斗风格专长；
# 「受祝福的勇士」「德鲁伊教战士」是圣武士 / 游侠 2 级的专属选项，不在此列）
fighting_styles:
- key: defense
  cn: 防御
  desc: 着装轻甲 / 中甲 / 重甲期间，护甲等级 +1
  ac_bonus: 1
- key: archery
  cn: 箭术
  desc: 使用远程武器进行的攻击检定 +2
  ranged_attack_bonus: 2
- key: dueling
  cn: 对决
  desc: 单手持用一把近战武器且另一手无武器时，该武器伤害 +2
- key: great_weapon_fighting
  cn: 巨武器战斗
  desc: 双手或两用武器（双手持用）的伤害骰掷出 1 或 2 时按 3 算
- key: two_weapon_fighting
  cn: 双武器战斗
  desc: 轻型武器带来的额外攻击可以加上属性调整值
- key: thrown_weapon_fighting
  cn: 投掷武器战斗
  desc: 投掷武器命中时伤害 +2
- key: unarmed_fighting
  cn: 徒手战斗
  desc: 徒手打击改为 1d6 + 力量（两手都空时 d8）
- key: blind_fighting
  cn: 盲斗
  desc: 获得 10 尺盲视
- key: interception
  cn: 拦截
  desc: 持盾或武器时，反应使 5 尺内他人受到的伤害减 1d10 + 熟练加值
- key: protection
  cn: 守护
  desc: 持盾时用反应让对 5 尺内他人的攻击有劣势，直到你的下回合开始

# 魔契师·魔能祈唤（XPHB 全部 28 条；prereq.level = 所需魔契师等级，
# prereq.feature = 需要先选的另一个祈唤 key，prereq.spell = 需要的法术说明文字）。
# 1 级建卡只能选「无等级要求」的 5 条（见 options.available_invocations）。
eldritch_invocations:
- key: armor_of_shadows
  cn: 幽影护甲
  desc: 可不消耗法术位对自己施放「法师护甲」
- key: eldritch_mind
  cn: 魔能意志
  desc: 为维持专注所做的体质豁免具有优势
- key: pact_of_the_blade
  cn: 刃之魔契
  desc: 咒唤契约武器（简易 / 军用近战武器或建立连结的魔法武器），用它攻击可用魅力代替力量 / 敏捷，并可作施法法器
- key: pact_of_the_chain
  cn: 链之魔契
  desc: 习得「寻获魔宠」且无需法术位，魔宠可选小魔鬼等特异形态；可让魔宠借你的攻击动作攻击
- key: pact_of_the_tome
  cn: 书之魔契
  desc: 召出书册，选择三道戏法与两道带仪式标签的一环法术（可来自任意职业列表），书在身上即常备这些法术
- key: agonizing_blast
  cn: 苦痛魔爆
  desc: 你使用的魔能爆每个伤害骰都加上你的魅力调整值；可多次选择，每次选一道不同且造成伤害的戏法
  prereq:
    level: 2
    spell: 一道能造成伤害的魔契师戏法
- key: devils_sight
  cn: 魔鬼视界
  desc: 你在光照和黑暗中都有 120 尺的黑暗视觉（无论魔法与否）
  prereq:
    level: 2
- key: eldritch_spear
  cn: 魔能长枪
  desc: 你已知的、射程至少 10 尺且造成伤害的戏法，其射程增加等于魔契师等级 30 倍的尺数；可多次选择
  prereq:
    level: 2
    spell: 一道射程至少 10 尺且造成伤害的魔契师戏法
- key: fiendish_vigor
  cn: 邪魔活力
  desc: 可不消耗法术位施展「假生命」，且自动取最大值
  prereq:
    level: 2
- key: lessons_of_the_first_ones
  cn: 原初之一的教习
  desc: 从亘古存在处习得一项起源专长；可多次选择，每次选不同专长
  prereq:
    level: 2
- key: mask_of_many_faces
  cn: 千面之脸
  desc: 可不消耗法术位施展「易容术」
  prereq:
    level: 2
- key: misty_visions
  cn: 迷雾幻影
  desc: 可不消耗法术位施展「朦胧术」
  prereq:
    level: 2
- key: otherworldly_leap
  cn: 超凡跳跃
  desc: 可以自身为目标不消耗法术位施展「跳跃术」
  prereq:
    level: 2
- key: repelling_blast
  cn: 斥力魔爆
  desc: 你已知的、需攻击检定的戏法，命中大型或更小生物时可将其推离至多 10 尺；可多次选择
  prereq:
    level: 2
    spell: 一道通过攻击检定造成伤害的魔契师戏法
- key: ascendant_step
  cn: 星移步法
  desc: 可不消耗法术位对自己施放「星界投影」
  prereq:
    level: 9
- key: eldritch_smite
  cn: 魔能斩
  desc: 每回合一次，用契约武器命中时消耗一枚法术位造成额外力场伤害，并可令目标失能
  prereq:
    level: 5
    feature: pact_of_the_blade
- key: gaze_of_two_minds
  cn: 共视感官
  desc: 触碰一个自愿生物建立感官连接，以它的感官观察（距离不超过 60 尺时可在其位置施法）
  prereq:
    level: 5
- key: gift_of_the_depths
  cn: 深海赠礼
  desc: 可在水下呼吸，并获得等于熟练加值的游泳速度；还可不消耗法术位施展一次「水中呼吸」
  prereq:
    level: 5
- key: investment_of_the_chain_master
  cn: 链主赋能
  desc: 为魔宠灌注魔能：40 尺飞行或游泳速度、可指令其动作、伤害类型转光耀 / 暗蚀、用你的豁免 DC
  prereq:
    level: 5
    feature: pact_of_the_chain
- key: master_of_myriad_forms
  cn: 万形之主
  desc: 可不消耗法术位对自己施展「变化术」
  prereq:
    level: 5
- key: one_with_shadows
  cn: 融身入影
  desc: 身处光照或黑暗中时，可不消耗法术位对自己施展「隐形术」
  prereq:
    level: 5
- key: thirsting_blade
  cn: 饥渴魔刃
  desc: 获得「额外攻击」（仅用契约武器），回合内攻击动作可攻击两次而非一次
  prereq:
    level: 5
    feature: pact_of_the_blade
- key: gift_of_the_protectors
  cn: 守护馈赠
  desc: 影之书出现新页，写下名字的生物降到 0 血但未死时魔法地变为 1 血
  prereq:
    level: 9
    feature: pact_of_the_tome
- key: lifedrinker
  cn: 饮命者
  desc: 每回合一次，用契约武器命中时造成额外暗蚀 / 心灵 / 光耀伤害，并消耗生命骰恢复生命
  prereq:
    level: 9
    feature: pact_of_the_blade
- key: visions_of_distant_realms
  cn: 穹宇尽视
  desc: 可不消耗法术位施展「远见术」
  prereq:
    level: 9
- key: whispers_of_the_grave
  cn: 坟墓低语
  desc: 可不消耗法术位施展「通晓逝者」
  prereq:
    level: 7
- key: devouring_blade
  cn: 灭世魔刃
  desc: 由「饥渴魔刃」提供的额外攻击次数变为两次而非一次
  prereq:
    level: 12
    feature: thirsting_blade
- key: witch_sight
  cn: 巫术视界
  desc: 30 尺内可见位于「隐形」「星界投影」「变身」等效应中的生物 / 物件，并看穿它们
  prereq:
    level: 15
