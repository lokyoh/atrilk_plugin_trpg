- key: aasimar
  cn: 阿斯莫
  en: Aasimar
  speed: 30
  size: 中型
  creature_type: 类人生物
  darkvision: 60
  resist: [暗蚀, 光耀]
  traits:
  - 天界抗性：具有暗蚀与光耀伤害的抗性
  - 黑暗视觉 60 尺
  - 治愈之手：以魔法动作触碰一个生物，掷等于熟练加值数量的 d4，目标恢复掷骰之和的生命值；长休一次
  - 光辉掌者：习得光亮术戏法，施法属性为魅力
