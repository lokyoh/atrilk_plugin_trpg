# 种族表（建卡第 2 步：确定起源）
# 一条一个种族；「血系 / 龙种 / 邪魔遗赠 / 巨人恩惠」二选一~十选一表写在 subraces 里
# （2024 起取代旧亚种制：无此表的种族不写 subraces 段）。
# 属性键（str / dex / con / int / wis / cha）用的是程序内部键。
#
# ⚠️ PHB 2024：**种族不提供属性值加值**，属性提升只来自背景的三项属性
# （见 backgrounds.yaml 的 bonus）。种族 = 生物类型 / 体型 / 速度 / 特殊特质（+ 抗性 / 血系）。
# 矮人「生命值上限 +1（每级再 +1）」是 2024 明文通用特性，非 2014 残留；
# 用结构化字段 ``hp_per_level`` 落（引擎按 等级×该值 结算，见 card.max_hp），
# 别再写回 traits 文本里让 DM 手算。
#
# 数据源：参考/5etools-cn-cn2.0/data/races.json（source=XPHB, edition=one）。

- key: human
  cn: 人类
  en: Human
  speed: 30
  size: 中型
  creature_type: 类人生物
  traits:
  - 英雄激励：每完成一次长休获得一个英雄激励
  - 技能熟练：自选一个技能获得其熟练
  - 起源专长：获得一项自选的起源专长（见第五章）
  languages:
  - 通用语
  - 一门自选语言
  desc: 寿命短却野心勃勃，遍布世界每一个角落，是最常见的冒险者（也可选小型体型）。
- key: dragonborn
  cn: 龙裔
  en: Dragonborn
  speed: 30
  size: 中型
  creature_type: 类人生物
  darkvision: 60
  traits:
  - 吐息武器：自己回合进行攻击动作时可将一次攻击替换为喷吐 15 尺锥状或 30×5 尺线状能量；范围内生物敏捷豁免（DC 8+体质调整值+熟练加值），失败受 1d10 对应类型伤害、成功减半；5/11/17 级各 +1d10；次数等于熟练加值，长休恢复
  - 龙之魔法：5 级起可以附赠动作展开灵体飞翼获得等于速度的飞行速度，持续 10 分钟；长休一次
  languages:
  - 通用语
  - 龙语
  subraces:
  - key: black
    cn: 黑龙
    resist: [强酸]
    desc: 强酸吐息与抗性。
  - key: blue
    cn: 蓝龙
    resist: [闪电]
    desc: 闪电吐息与抗性。
  - key: brass
    cn: 黄铜龙
    resist: [火焰]
    desc: 火焰吐息与抗性。
  - key: bronze
    cn: 青铜龙
    resist: [闪电]
    desc: 闪电吐息与抗性。
  - key: copper
    cn: 赤铜龙
    resist: [强酸]
    desc: 强酸吐息与抗性。
  - key: gold
    cn: 金龙
    resist: [火焰]
    desc: 火焰吐息与抗性。
  - key: green
    cn: 绿龙
    resist: [毒素]
    desc: 毒素吐息与抗性。
  - key: red
    cn: 红龙
    resist: [火焰]
    desc: 火焰吐息与抗性。
  - key: silver
    cn: 银龙
    resist: [寒冷]
    desc: 寒冷吐息与抗性。
  - key: white
    cn: 白龙
    resist: [寒冷]
    desc: 寒冷吐息与抗性。
  desc: 骄傲的龙之血脉，荣誉高于一切；龙种决定吐息武器类型与伤害抗性。
- key: dwarf
  cn: 矮人
  en: Dwarf
  speed: 30
  size: 中型
  creature_type: 类人生物
  darkvision: 120
  resist: [毒素]
  hp_per_level: 1
  traits:
  - 黑暗视觉 120 尺
  - 矮人坚韧：具有毒素伤害的抗性，且为避免 / 结束中毒状态所做的豁免检定具有优势
  - 生命值上限 +1，且此后每次升级时再加 1
  - 岩石坚韧：以一个附赠动作，你在 10 分钟内能感知 60 尺内与岩石接触或位于岩石另一侧的生物（须站在或触碰岩石表面）；次数等于熟练加值，长休恢复
  languages:
  - 通用语
  - 矮人语
  desc: 岩石与炉火之民，坚韧、固执而重信义（2024 无亚种，HP 提升为全族通用）。
- key: elf
  cn: 精灵
  en: Elf
  speed: 30
  size: 中型
  creature_type: 类人生物
  darkvision: 60
  traits:
  - 黑暗视觉 60 尺
  - 精灵血系：从血系表中选择其一，获得其 1 级好处；3 级与 5 级分别习得该血系表上一道更高级法术（各可不耗法术位施展一次，长休恢复）；选血系时定施法属性（智力 / 感知 / 魅力）
  - 精类血统：进行避免或结束魅惑状态的豁免时具有优势
  - 技能熟练：具有洞悉、察觉或求生之一技能的熟练
  - 出神：不需要睡觉，魔法无法使你陷入睡眠；4 小时即可完成长休且保持清醒
  languages:
  - 通用语
  - 精灵语
  subraces:
  - key: drow
    cn: 卓尔
    traits:
    - 黑暗视觉提升至 120 尺
    - 习得戏法舞光术；3 级妖火、5 级黑暗术
    desc: 幽暗地域的精灵血系。
  - key: high_elf
    cn: 高等精灵
    traits:
    - 知晓戏法魔法伎俩，每完成长休可将其替换为另一道法师法术列表中的戏法
    - 3 级侦测魔法、5 级迷踪步
    desc: 血脉中流淌着魔法，学识渊博的血系。
  - key: wood_elf
    cn: 木精灵
    traits:
    - 速度提升至 35 尺
    - 知晓戏法德鲁伊伎俩；3 级大步奔行、5 级行动无踪
    desc: 与森林共生，行动迅捷而隐秘的血系。
  desc: 优雅而长寿的族群，感官敏锐，与魔法有着天然的亲和。
- key: gnome
  cn: 侏儒
  en: Gnome
  speed: 30
  size: 小型
  creature_type: 类人生物
  darkvision: 60
  traits:
  - 黑暗视觉 60 尺
  - 侏儒狡黠：进行的智力、感知、魅力豁免检定均具有优势
  - 侏儒血系：选择以下选项之一；施法属性为智力 / 感知 / 魅力（选择血系时定）
  languages:
  - 通用语
  - 侏儒语
  subraces:
  - key: forest_gnome
    cn: 森林侏儒
    traits:
    - 知晓次级幻象戏法
    - 始终准备动物交谈，可不耗法术位施展，次数等于熟练加值，长休恢复
    desc: 与林中生灵为伴的血系。
  - key: rock_gnome
    cn: 岩石侏儒
    traits:
    - 知晓修复术与魔法伎俩两道戏法
    - 发条装置：花 10 分钟以魔法伎俩创造微型装置（AC5/HP1，8 小时后解体），同时至多三台
    desc: 天生的发明家与工匠的血系。
  desc: 矮小却好奇心旺盛，热衷于发明与恶作剧。
- key: halfling
  cn: 半身人
  en: Halfling
  speed: 30
  size: 小型
  creature_type: 类人生物
  traits:
  - 勇敢：进行避免或结束恐慌状态的豁免时具有优势
  - 半身人灵巧：可以穿越任何体型比你大的生物所在空间，但不能在其内停下
  - 幸运：D20 检定中 d20 掷出 1 时可重新掷骰，但必须使用重骰的结果
  - 天生善匿：在被至少大你一级的生物遮蔽时也能执行躲藏动作
  languages:
  - 通用语
  - 半身人语
  desc: 身形娇小却运气极佳，重视安逸的家园生活（2024 无轻足 / 壮足亚种）。
- key: tiefling
  cn: 提夫林
  en: Tiefling
