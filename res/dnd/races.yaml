    desc: 来自无底深渊的邪魔遗赠。
  - key: chthonic
    cn: 幽冥
    resist: [暗蚀]
    traits:
    - 暗蚀伤害抗性
    - 习得戏法颤栗之触；3 级虚假生命、5 级衰弱射线
    desc: 来自幽冥的邪魔遗赠。
  - key: infernal
    cn: 炼狱
    resist: [火焰]
    traits:
    - 火焰伤害抗性
