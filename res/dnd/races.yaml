  languages:
  - 通用语
  - 天界语
  desc: 承载着天界灵魂的祝福，常在命运召唤下踏上冒险之路（也可选小型体型）。
- key: goliath
  cn: 歌利亚
  en: Goliath
  speed: 35
  size: 中型
  creature_type: 类人生物
  traits:
  - 巨人先祖：从先祖恩惠表中选择其一；使用次数等于熟练加值，长休恢复
  - 大型形态：5 级起可以附赠动作将体型变为大型（空间足够），持续 10 分钟；期间力量检定具有优势、速度 +10 尺；长休一次
  - 强力构筑：为结束受擒状态所进行的属性检定具有优势；计算载重时视为大一级体型
  languages:
  - 通用语
  - 巨人语
  subraces:
  - key: cloud
    cn: 云之远迹
    traits:
    - 云巨人恩惠：以附赠动作魔法性地传送到 30 尺内一处可见的未占据空间
    desc: 来自云巨人先祖的恩惠。
  - key: fire
    cn: 火之燃烧
    traits:
    - 火巨人恩惠：以攻击检定命中并造成伤害时，额外造成 1d10 火焰伤害
    desc: 来自火巨人先祖的恩惠。
  - key: frost
    cn: 霜之刺骨
    traits:
    - 霜巨人恩惠：以攻击检定命中并造成伤害时，额外造成 1d6 寒冷伤害，并令目标速度降低 10 尺至你的下一回合开始
    desc: 来自霜巨人先祖的恩惠。
  - key: hill_giant
    cn: 山之翻撞
    traits:
    - 山丘巨人恩惠：以攻击检定命中一个不超过大型的生物并造成伤害时，可令其陷入倒地状态
    desc: 来自山丘巨人先祖的恩惠。
  - key: stone
    cn: 石之坚韧
    traits:
    - 石巨人恩惠：受到伤害时以反应掷 1d12，所受伤害减少掷骰结果 + 体质调整值
    desc: 来自石巨人先祖的恩惠。
  - key: storm
    cn: 岚之暴鸣
    traits:
    - 风暴巨人恩惠：被 60 尺内的生物造成伤害时，以反应对其造成 1d8 雷鸣伤害
    desc: 来自风暴巨人先祖的恩惠。
  desc: 巨人的后裔，身躯魁梧、意志坚韧；先祖恩惠决定觉醒的超自然力量。
- key: orc
  cn: 兽人
  en: Orc
  speed: 30
  size: 中型
  creature_type: 类人生物
  darkvision: 120
  traits:
  - 激昂冲锋：以附赠动作执行疾走动作，并获得等于熟练加值的临时生命值；次数等于熟练加值，短休或长休恢复
