# DMG 2024 第四章「战斗遭遇难度」第二步：人均经验值预算表
# 见《城主指南 (2024).md》L5959-5994。用法：表中数字 × 小队人数 = 该场遭遇的 XP 预算，
# 再按第三步逐只扣减怪物的 XP 价值（core/dnd/progression.py 的 CR_XP）。
#
# ⚠️ 三档是 2024 口径（低 / 中等 / 高）。2014 的 Adventuring Day 四档
#    （easy / medium / hard / deadly）与「冒险日倍率」已不适用，别把倍率写回这里。
# ⚠️ 一行一级，level 必须连续 1~20；缺表会在加载时抛错（datafiles 的约定）。

