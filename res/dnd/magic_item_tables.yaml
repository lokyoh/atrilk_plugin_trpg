# 《城主指南 (2024)》第七章「随机魔法物品」20 张 1d100 表
#
# 由参考文档 L20778-21410 的 markdown 表格机械转录（去斜体标记、范围转 lo/hi）。
# 段名 = 「宝藏主题_稀有度」；每行 {lo, hi, item}，lo..hi 是该物品的 1d100 区间
# （文档写 00 即 100）。已断言每张表无缝覆盖 1..100。
#
# 辅助段：
#   magic_item_theme   L20780：物品不属任何主题时掷 1d4 选表
#   magic_item_rarity  L9363：按角色等级掷稀有度（文档首行「通用语」是转录笔误，按「普通」）
#   magic_item_awards  L9342：按等级阶段应投放的魔法物品数量基准（20 级共 100 件）
#
# ⚠️ 表里是**物品名**；效果详情在 magic_items.yaml（538 条，由 5etools 中文包 XDMG
#    条目 + Foundry 结构化数据合并，每条都有正文）。2026-11-20 复核：393 个唯一名字里
#    仍有 60 个查不到对应条目，其中 8 个是 +1/+2/+3 泛称组名，其余为译名差异或缺条目。
#    掷出名字后先查 items.yaml 的 28 件战役物品，再回退 magic_items.yaml；查不到就如实
#    提示「详情未收录」，按第七章原文由 DM 裁定，别自己编数值。
#    第七章 A-Z 约 350 件尚未逐条比对（见 docs/trpg-known-gaps.md B1 / B4）。
# ⚠️ 数值按 2024 明文，别拿 2014 的随机表覆盖。

