# 《城主指南 (2024)》第三章范例卡：陷阱 / 危害 / 疫病 / 毒药 / 攻城装备
#
# 参考 md 的这些小节全是 5etools 嵌入占位 HTML（只有「正在加载…」），
# 故从 参考/5etools-cn-cn2.0/data/ 的 XDMG 结构化条目转录：
#   trapshazards.json  -> trap(8) + hazard(25)
