- {cn: "午夜之泪", en: "Midnight Tears", kind: 毒药, page: 91, rating: "", trigger: "", poison_types: "服用", dc: 17, dcs: [17], damage: ["9d6"], ac: 0, hp: 0, price_gp: 1500.0, text: "服用这种毒药的生物不会立即出现异样，其症状会一直潜伏到午夜钟声敲响时。任何能够解除中毒状态的效应都可以在此之前中和午夜之泪，然而如果毒素在午夜之前尚未中和，该生物就要进行一次DC 17的体质豁免，豁免失败则受到31（9d6）点毒素伤害，豁免成功则伤害减半。"}
