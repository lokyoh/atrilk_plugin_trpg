- {cn: "塌方", en: "Collapsing Roof", kind: 陷阱, page: 100, rating: "1 阶 致命", trigger: "生物穿过绊线时", poison_types: "", dc: 11, dcs: [11, 13], damage: ["2d10", "4d10", "10d10", "18d10"], ac: 0, hp: 0, price_gp: 0, text: "该陷阱以一根绊线来触发天花板上的不稳定区域。绊线离地3英寸，架在在两个脆弱的支撑柱之间，当绊线被拉动时它们将被带倒。\n第一个穿过绊线的生物将导致支撑柱被带倒，并使天花板上的不稳定区域开始塌陷。所有位于不稳定区域之下的生物必须通过DC 13的敏捷豁免，否则受到11（2d10）钝击伤害，豁免成功则伤害减半。塌陷的碎石会将受陷阱影响的区域转变为困难地形。\n【侦测与解除】生物可以用搜索动作检查被设下陷阱的区域并进行DC 11 的感知（察觉）检定，检定成功就能侦测到绊线和天花板上的不稳定区域。一旦被发现，绊线便可以被轻易地剪断或避开（无需属性检定）。\n【升环施法】你可以通过提高伤害与豁免DC来提高陷阱对应的等级范围，如以下表格所示。 等级：5–10 / 钝击伤害：22 (4d10) / 豁免DC：15 等级：11–16 / 钝击伤害：55 (10d10) / 豁免DC：17 等级：17–20 / 钝击伤害：99 (18d10) / 豁免DC：19"}
- {cn: "落网", en: "Falling Net", kind: 陷阱, page: 100, rating: "1 阶 妨碍", trigger: "生物穿过绊线时", poison_types: "", dc: 10, dcs: [10, 11, 12, 13, 14, 16], damage: [], ac: 0, hp: 0, price_gp: 0, text: "落网陷阱使用绊线来释放悬挂在天花板上的十尺见方的捕网。绊线离地面3英寸，架在两根立柱或树干之间。\n第一个穿过绊线的生物将导致捕网向他落下来。该目标必须成功通过DC 10的敏捷豁免，否则将陷入束缚状态，直至挣脱。巨型或更大的目标自动通过此豁免。生物可以用动作进行一次DC 10的力量（运动）检定，成功即可将自己或触及范围内的另一生物从捕网中释放。\n【侦测与解除】生物可以用搜索动作检查被设下陷阱的区域并进行DC 11的感知（察觉）检定，检定成功即可侦测到绊线与悬挂的捕网。一旦被发现，绊线便可以被轻易地剪断或避开（无需属性检定）。\n【摧毁网络】将网的命中点减少到0可以释放任何被困在其中的生物（参见玩家手册中的捕网）。\n【设置陷阱】拥有盗贼工具和陷阱的所有组件的生物可以进行DC 13的敏捷（巧手）检定，检定成功即可设下落网陷阱。每次设下陷阱的尝试都会花费10分钟。\n【升环施法】你可以提升捕网的重量，从而提高豁免DC和力量（运动）检定DC，以此提升陷阱对应的等级范围：5-10级时DC 12，11-16级时DC 14，17-20级时DC 16。"}
- {cn: "喷火雕像", en: "Fire-Casting Statue", kind: 陷阱, page: 102, rating: "1 阶 致命", trigger: "生物移至压力板上时", poison_types: "", dc: 10, dcs: [10, 15], damage: ["2d10", "4d10", "10d10", "18d10"], ac: 0, hp: 0, price_gp: 0, text: "当生物在一回合中初次移动至该陷阱的压力板上，或在其上开始自己的回合时，一座临近的雕像会喷吐出15尺锥状的魔法烈焰。雕像可能有着各式各样的外观，例如一条龙或一位法师。锥形区域内的每个生物都必须进行DC 15的敏捷豁免，失败则受到11（2d10）火焰伤害，成功则伤害减半。\n【侦测与解除】侦测魔法法术会揭示雕像周身的塑能系魔法灵光。以搜索动作，雕像5尺内的生物可以检查它并进行DC 10的感知（察觉）检定，成功时则发现雕像上的微小雕文。一旦找到雕文，角色可以执行研究动作以检查雕文并进行DC 15的智力（奥秘）检定，成功时则查明该雕文意味着\"火焰\"。以一个动作，角色可以使用利器来刮花雕文，解除陷阱。 生物可以用搜索动作检查构成压力板的地面部分并进行DC 15的感知（察觉）检定，成功时则侦测到压力板。在压力板下插入铁钉(组)或类似物件则可以阻止陷阱触发。\n【升环施法】你可以通过提高伤害与效应范围来提高陷阱对应的等级范围，如以下表格所示。 等级：5–10 / 火焰伤害：22 (4d10) / 效应区域：30英尺锥状 等级：11–16 / 火焰伤害：55 (10d10) / 效应区域：60英尺锥状 等级：17–20 / 火焰伤害：99 (18d10) / 效应区域：120英尺锥状"}
- {cn: "隐蔽陷坑", en: "Hidden Pit", kind: 陷阱, page: 102, rating: "1 阶 妨碍", trigger: "生物移动到陷坑盖上时", poison_types: "", dc: 15, dcs: [15], damage: ["1d6", "3d6", "6d6", "12d6"], ac: 0, hp: 0, price_gp: 0, text: "这个10尺深的陷坑具有一块铰链式顶盖，顶盖使用的材料与周边的地板一致。当生物移动到陷坑盖上时，它会如活板门一般敞开，使得该生物坠落进陷坑中。那之后，盖子将保持开启。\n掉入陷坑的生物因坠落而受到3（1d6）钝击伤害。\n【侦测与解除】生物可以用研究动作检查地板上构成陷坑顶盖的部分并进行DC 15的智力（调查）检定，成功则侦测到陷坑。找到陷坑后，便可以用铁钉或类似物件插入陷坑盖和周边地面之间的缝隙，以避免陷坑盖开启，从而确保安全通过。使用秘法锁或类似魔法也可以让盖子保持关闭。\n【逃脱】生物需要攀爬速度、攀爬工具或例如蛛行术的魔法，才可以攀上陷坑的光滑墙壁。你可以在墙壁上增加足够大的裂缝，作为抓手和支点，使陷坑变得更容易逃脱。\n【升环施法】你可以通过增加陷阱的深度与伤害来提高陷阱对应的等级范围，如以下表格所示。 等级：5–10 / 陷坑深度：30尺 / 钝击伤害：10（3d6） 等级：11–16 / 陷坑深度：60尺 / 钝击伤害：42 (6d6) 等级：17–20 / 陷坑深度：120尺 / 钝击伤害：42 (12d6)"}
- {cn: "毒镖", en: "Poisoned Darts", kind: 陷阱, page: 101, rating: "1 阶 致命", trigger: "生物移至压力板上时", poison_types: "", dc: 13, dcs: [13, 15], damage: ["1d3", "1d6", "2d6", "4d6", "7d6"], ac: 0, hp: 0, price_gp: 0, text: "当生物在一回合中初次移动至该陷阱的压力板上时，毒镖将从嵌在周围墙壁里的管道中射出。容纳这些管道的孔洞被尘土和蛛网所遮蔽，也或是巧妙地隐藏在浅浮雕，壁画或墙饰之中。\n每个在飞镖路径中的生物都需要成功通过DC 13的敏捷豁免，否则将被1d3支飞镖击中，每被一支飞镖命中都会受到3（1d6）毒素伤害。\n【侦测与解除】生物可以用搜索动作检查墙壁并进行DC 15的感知（察觉）检定，成功时则侦测到孔洞。使用蜡，布料或碎屑堵住全部孔洞可以阻止飞镖发射。 生物可以用搜索动作检查构成压力板的地面部分并进行DC 15的感知（察觉）检定，成功时则侦测到压力板。在压力板下插入铁钉(组)或类似物件则可以阻止陷阱触发。\n【升环施法】你可以通过提升每发飞镖的毒素伤害来提高陷阱对应的等级范围：5-10级时为7（2d6），11-16级时为14（4d6），或17-20级时为24（7d6）。"}
- {cn: "毒针", en: "Poisoned Needle", kind: 陷阱, page: 102, rating: "1 阶 妨碍", trigger: "生物以不恰当的方式打开陷阱锁孔或解除陷阱失败时", poison_types: "", dc: 11, dcs: [11, 15], damage: ["1d10", "2d10", "4d10", "10d10"], ac: 0, hp: 0, price_gp: 0, text: "毒针隐藏在一把锁中。当生物用除了适配的钥匙以外的物件开锁时，毒针会弹出并刺伤该生物。该生物进行DC 11的体质豁免，失败则受到5（1d10）毒素伤害并陷入中毒状态，持续1小时；成功则仅受半伤。\n【避免】使用敲击术或类似法术开锁时，陷阱不会触发。\n【侦测与解除】生物可以用搜索动作检查陷阱锁孔并进行DC 15的感知（察觉）检定，成功则侦测到针刺。一旦找到陷阱，角色可以用动作尝试进行一次DC 15的敏捷（巧手）检定，成功则解除陷阱。检定失败时，该生物触发陷阱。\n【升环施法】你可以通过提高伤害与豁免DC来提高陷阱对应的等级范围，如以下表格所示。 等级：5–10 / 毒素伤害：11 (2d10) / 豁免DC：13 等级：11–16 / 毒素伤害：22 (4d10) / 豁免DC：15 等级：17–20 / 毒素伤害：55 (10d10) / 豁免DC：17"}
- {cn: "滚石", en: "Rolling Stone", kind: 陷阱, page: 102, rating: "3 阶 致命；4 阶 妨碍", trigger: "生物移至压力板上时", poison_types: "", dc: 15, dcs: [15, 20], damage: ["10d10"], ac: 0, hp: 0, price_gp: 0, text: "当生物移动至隐藏的压力板上时，一颗巨大的实心石头从秘密隔间中落下并开始滚动，石头大小为5尺半径的球体。滚石与所有临近的生物投掷先攻；石头的先攻掷骰加值为+8。\n在其回合中，滚石向一个方向移动60尺，如遇障碍物则因此重定向，更改行动轨迹。滚石可以穿越生物所处的空间，而生物也可以穿越石头所处的空间，将其视为困难地形。滚石在一回合内初次进入生物所处的空间，或生物在其仍滚动时进入其所处的空间时，该生物必须通过DC 15的敏捷豁免否则受到55（10d10）钝击伤害并陷入倒地状态。\n滚石在撞到墙壁或类似的屏障时停止。它无法沿着拐角行进，但有些精明的地城建造者会为其设计缓变的弯角，以让其保持滚动。\n【侦测与解除】生物可以用研究动作检查地板上构成压力板的部分并进行DC 15的智力（调查）检定，成功则推测出压力板的功效。在压力板下插入铁钉或类似物件则可以阻止陷阱触发。\n【摧毁滚石】滚石是一个大型物件，具有AC17，HP100，伤害阈值为10，并免疫毒素与心灵伤害。\n【减缓滚石】以一个动作，生物可以尝试DC 20的力量（运动）检定来让石头慢下来。如检定成功，滚石在自己回合的移动距离降低15尺。如果该距离降为0，则滚石停止移动并不再构成威胁。"}
- {cn: "尖刺陷坑", en: "Spiked Pit", kind: 陷阱, page: 103, rating: "1 阶 致命", trigger: "生物移动到陷坑盖上时", poison_types: "", dc: 15, dcs: [15], damage: ["1d6", "2d8", "3d6", "3d8", "6d6", "8d8", "12d6", "13d8"], ac: 0, hp: 0, price_gp: 0, text: "这个10尺深的陷坑具有一块铰链式顶盖，顶盖使用的材料与周边的地板一致。当生物移动到陷坑盖上时，它会如活板门一般敞开，使得该生物坠落进底部设置着木制或铁质尖刺的陷坑之中。那之后，盖子将保持开启。\n掉入陷坑且在落在底部的生物将因坠落而受到3（1d6）钝击伤害，外加从尖刺上受到9（2d8）穿刺伤害。\n【侦测与解除】生物可以用研究动作检查形成了陷坑盖的地面部分并进行DC 15的智力（调查）检定，成功则侦测到陷坑。找到陷坑后，便可以用铁钉或类似物件插入陷坑盖和周边地面之间的缝隙，以避免陷坑盖开启，从而确保安全通过。使用秘法锁或类似魔法也可以让盖子保持关闭。\n【逃脱】生物需要攀爬速度、攀爬工具或例如蛛行术的魔法，才可以攀上陷坑的光滑墙壁。你可以在墙壁上增加足够大的裂缝，作为抓手和支点，使陷坑变得更容易逃脱。\n【升环施法】你可以通过增加陷阱的深度与伤害来提高陷阱对应的等级范围，如以下表格所示。 等级：5–10 / 陷坑深度：30尺 / 伤害：10（3d6）钝击伤害外加13（3d8）穿刺伤害 等级：11–16 / 陷坑深度：60尺 / 伤害：21（6d6）钝击伤害外加36（8d8）穿刺伤害 等级：17–20 / 陷坑深度：120尺 / 伤害：42（12d6）钝击伤害外加57（13d8）穿刺伤害"}
- {cn: "棕霉菌", en: "Brown Mold", kind: 危害, page: 76, rating: "2 阶 致命；3 阶 妨碍", trigger: "", poison_types: "", dc: 12, dcs: [12], damage: ["4d10"], ac: 0, hp: 0, price_gp: 0, text: "棕霉菌长得像一块毛绒绒的、浅棕色的地毯。这种真菌以热量为食，从周围所有的物体中汲取热量。一片棕霉菌覆盖10 尺方形区域，并且其30尺范围内的温度总是寒冷刺骨的。\n生物在一回合中首次进入棕霉菌周边5尺范围内时，或者在该区域内开始其回合时，该生物必须进行一次 DC 12 的体质豁免，豁免失败时，该生物受22（4d10）的寒冷伤害，豁免成功则伤害减半。\n棕霉菌免疫火焰。任何形式的火焰接近其周边5尺范围区域内时，棕霉菌将立即向火焰的方向延伸，创造出一片新的霉菌覆盖前方 10 尺的方形区域。一片棕霉菌受到任何造成寒冷伤害的效果影响时，将会被立即摧毁。"}
- {cn: "死魔法区域", en: "Dead Magic Zone", kind: 危害, page: 68, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: [], ac: 0, hp: 0, price_gp: 0, text: "死魔法区域是魔法的结构被彻底撕毁的区域。其效果和反魔法场法术一样，但它具有永久性，并且覆盖区域的直径通常不会超过300尺。"}
- {cn: "深水区", en: "Deep Water", kind: 危害, page: 68, rating: "", trigger: "", poison_types: "", dc: 10, dcs: [10], damage: [], ac: 0, hp: 0, price_gp: 0, text: "在深水区（水深超过100尺）中游泳将面临更大的挑战。由于水压和低温，在深水中每游泳一个小时，一个不具有游泳速度的生物就必须成功通过DC 10的体质豁免，否则就会获得1级力竭。"}
- {cn: "极度寒冷", en: "Extreme Cold", kind: 危害, page: 68, rating: "", trigger: "", poison_types: "", dc: 10, dcs: [10], damage: [], ac: 0, hp: 0, price_gp: 0, text: "当温度到达0华氏度或更低时（译者注：0华氏≈零下17.8摄氏）。暴露在极度寒冷中的生物必须每小时成功通过DC 10的体质豁免，否则就会获得1级力竭。对寒冷伤害具有抗性或免疫的生物会在豁免时自动成功。"}
- {cn: "极度高温", en: "Extreme Heat", kind: 危害, page: 68, rating: "", trigger: "", poison_types: "", dc: 5, dcs: [5], damage: [], ac: 0, hp: 0, price_gp: 0, text: "当温度到达100华氏度或更高时（译者注:100华氏度≈37.8摄氏度）。暴露在极度高温下而且无法获得饮用水的生物，其必须在每个小时过去时成功通过一次体质豁免，否则将会获得1级力竭。其中第一个小时的豁免是DC5，每过一个小时，DC便再增加1。正着装中型或重型护甲的生物在豁免时处于劣势。对火焰伤害具有抗性或免疫的生物会在豁免时自动成功。"}
- {cn: "火球菇", en: "Fireball Fungus", kind: 危害, page: 76, rating: "2 阶 致命", trigger: "", poison_types: "", dc: 15, dcs: [15], damage: [], ac: 0, hp: 0, price_gp: 0, text: "火球菇是一种小型的、不会活动的菌菇，可以在任何真菌繁盛的地方生长。其发光的橙色菌盖为15尺半径范围内提供明亮光照，并在额外的15尺范围内提供微光光照。\n一株火球菇拥有AC10，6点生命值，并且对心灵伤害具有免疫。当火球菇生命值降至0点时，火球菇将爆炸，效果如同一道以其为源点施展的火球术（豁免DC 15）。\n【升环施法】一株火球菇的爆炸将会使其爆炸范围内的其余火球菇也一并爆炸。你可以通过额外添加一株火球菇，来将危害对应等级范围提高到11-16级 ，增加三株火球菇可以将等级范围提高到17-20级。"}
- {cn: "寒冷水域", en: "Frigid Water", kind: 危害, page: 68, rating: "", trigger: "", poison_types: "", dc: 10, dcs: [10], damage: [], ac: 0, hp: 0, price_gp: 0, text: "如果一个生物浸泡在寒冷的水中，那么他在遭受不良影响前可以支撑一小段时间，具体为等同于该生物的体质值的分钟数。在寒冷的水中每再多花一分钟，生物就必须通过DC 10的体质豁免，否则将会获得1级力竭。对寒冷伤害具有抗性或免疫的生物会在豁免时自动成功，自然栖息于在寒冷水域中的生物也是如此。"}
- {cn: "绿软泥", en: "Green Slime", kind: 危害, page: 76, rating: "1 阶 妨碍", trigger: "", poison_types: "", dc: 10, dcs: [10], damage: ["1d10", "2d10"], ac: 0, hp: 0, price_gp: 0, text: "这种酸性的绿色软泥会吞噬接触到的血肉、有机物和金属。它呈现明绿色，黏滑潮湿，成片地附着在墙壁、地板以及天花板上。\n一片绿软泥覆盖5尺方形区域，其拥有30尺范围的盲视，当检测到其下有移动物体时，绿软泥将从天花板或墙壁上掉落。除此之外，绿软泥不具有任何活动能力。注意到绿软泥存在的生物可以成功通过一次DC 10的敏捷豁免来避免被其击中。\n与绿软泥接触的生物会受到5（1d10）点强酸伤害。该生物在每个自己的回合开始时再次受到该伤害，直至将软泥摧毁或将其从身上刮除（需要一个动作）。绿软泥对木材和金属造成每轮11（2d10）点强酸伤害，并且任何用于刮除软泥的木质或金属质非魔法物品都将被摧毁。\n阳光直射或者任何寒冷、火焰或光耀伤害都将立刻摧毁一块绿软泥。"}
- {cn: "暴雨雪", en: "Heavy Precipitation", kind: 危害, page: 69, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: [], ac: 0, hp: 0, price_gp: 0, text: "一切处于暴雨或暴雪的区域都视为轻度遮蔽，该区域内的生物在所有感知（察觉）检定中处于劣势，暴雨还能熄灭暴露的火焰。"}
- {cn: "高海拔", en: "High Altitude", kind: 危害, page: 69, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: [], ac: 0, hp: 0, price_gp: 0, text: "由于空气中的氧气含量减少的原因，在海拔10000尺或更高的地方旅行对大多数生物来说都是一种负担。计算生物的旅行时间时，生物在高海拔地区旅行的每1个小时都被算作2个小时（见第二章 旅行步调 一节）。\n生物可以通过在高海拔地区待上30天或更长的时间来适应高海拔环境。不过，生物通常无法适应海拔20000尺以上的环境，除非它们是这种环境的原生生物。（译者注:一万英尺≈3034米，两万英尺≈6096米）"}
- {cn: "即兴伤害", en: "Improvised Damage", kind: 危害, page: 30, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: ["1d10", "2d10", "4d10", "10d10", "18d10", "24d10"], ac: 0, hp: 0, price_gp: 0, text: "即兴伤害表格为决定临时出现的伤害给出方针。\n伤害：1d10 / 范例：被炭烫伤，被倒下的书柜砸伤，被毒针刺伤\n伤害：2d10 / 范例：被闪电劈中，跌进火坑中\n伤害：4d10 / 范例：在坍塌的隧道里被落下的碎石砸中，滚入装满强酸的桶里\n伤害：10d10 / 范例：被紧实的墙壁碾压，被飞旋的钢铁利刃击中，淌过熔岩\n伤害：18d10 / 范例：淹没进熔岩里，被坠毁的飞行堡垒砸中\n伤害：24d10 / 范例：被卷入火元素位面的火焰涡流，被类神生物或和月亮一般大的怪物一口咬碎\n伤害危害度与等级表是一份关于不同等级的角色而言伤害总数有多致命的指南。交叉比对角色等级与即将收到的伤害来衡量伤害的危害度。\n角色等级：1–4 / 妨碍：5 (1d10) / 致命：11 (2d10)\n角色等级：5–10 / 妨碍：11 (2d10) / 致命：22 (4d10)\n角色等级：11–16 / 妨碍：22 (4d10) / 致命：55 (10d10)\n角色等级：17–20 / 妨碍：55 (10d10) / 致命：99 (18d10)\n妨害型伤害很少在角色处于所示等级时将他们置于死地，但已被严重削弱的角色可能会被这次伤害所击溃。\n致死型伤害对处于所示等级的角色构成了显著的威胁，且有可能杀死已经失去许多生命值的角色。"}
- {cn: "燎原烈火", en: "Inferno", kind: 危害, page: 76, rating: "2 阶 致命；3 阶 妨碍", trigger: "", poison_types: "", dc: 0, dcs: [], damage: ["1d4", "1d10", "4d10"], ac: 0, hp: 0, price_gp: 0, text: "当火焰不受控制地蔓延时，就能制造出一片燎原烈火，迅速地吞噬生物、物件和植物。\n一片燎原烈火由至少四个10尺立方的火焰相连组成。每10尺立方的火焰可以被10加仑的水扑灭。暴露在一阵强风中1分钟后，燎原烈火会扩张，额外增加1d4个10尺立方的火焰。一片失去燃料的燎原烈火将在1d10分钟后燃尽。\n燎原烈火会立即对任何它接触到的，未被穿戴的植物或物件造成22（4d10）点火焰伤害，并且 每一分钟会再次造成该伤害。生物在一回合内首次进入燎原烈火范围内，或者在范围内开始其回合时，将受到22（4d10）点火焰伤害，并开始燃烧。"}
- {cn: "位面效应", en: "Planar Effects", kind: 危害, page: 69, rating: "", trigger: "", poison_types: "", dc: 10, dcs: [10], damage: [], ac: 0, hp: 0, price_gp: 0, text: "某些存在位面，以及受其影响的特定物质位面区域，会对其中的生物产生超自然的影响。下面列举出几个例子。关于位面的更多信息可以在第六章找到。\n【修罗嗜血】修罗场位面会激励一个伤害其他生物的生物，赋予它继续战斗的力量。在修罗场或一个受其影响的地区内，每当一个生物将另一个生物的生命值减少到0时，该生物将会获得等同于自己生命值上限一半的临时生命值。\n【桃源活力】在世外桃源位面和受其影响的地区，生物会受益于超自然的生命力，使其免疫恐慌和中毒状态。\n【受祝慷慨】在天界山位面和受其影响的地区，生物会受到该位面无处不在的恩惠祝福。除邪魔和亡灵外的生物，只要它们停留在受祝福恩惠的区域内，就能获得法术祝福术的效果。此外，在该区域完成长休的生物将受益于法术次等复原术的效果。\n【火狱残忍】在焦炎火狱位面和受其影响的地区，生物们被迫厌恶帮助彼此。每当受到火狱残忍影响的生物施放法术恢复生命值或施放法术来移除状态时（移除隐形状态的法术除外），施法者必须通过DC 10的魅力豁免，否则法术将会失败并被浪费。\n【喧癫狂风】喧癫空隧的狂风常出现在喧癫空隧位面和受其影响的地区，包括幽暗地域的部分地区。一个生物在尖啸狂风中每经过1个小时将进行一次DC 10的感知豁免，如果豁免失败，该生物获得1级力竭。狂风不能将生物的力竭等级提高到3级以上。长休无法降低狂风中的生物的力竭等级，除非该生物能够以某种方式避开狂风肆虐。"}
- {cn: "毒气", en: "Poisonous Gas", kind: 危害, page: 77, rating: "1 阶 妨碍", trigger: "", poison_types: "", dc: 12, dcs: [12], damage: ["1d10", "2d10", "4d10", "10d10"], ac: 0, hp: 0, price_gp: 0, text: "毒气常见于封闭空间内，如下水道或者封闭的墓穴中。毒气会尽可能地填满空间，最大覆盖范围为十个10尺立方。这种透明的气体带有腐臭味，它会持续地或者周期性地由其天然源头或魔法源头补充，但一阵强风能将毒气驱散长达一分钟。\n任何在一回合内首次进入毒气范围、或者在范围内开始其回合的生物，必须进行一次DC 12的体质豁免，豁免失败受到5（1d10）点毒素伤害，豁免成功则伤害减半。身处毒气中的生物还会在死亡豁免检定中具有劣势。\n【升环施法】你可以通过提高毒素伤害及其豁免DC来提高毒气对应的等级范围，如以下表格所示。 等级：5–10 / 毒素伤害：11 (2d10) / 豁免DC：14 等级：11–16 / 毒素伤害：22 (4d10) / 豁免DC：16 等级：17–20 / 毒素伤害：55 (10d10) / 豁免DC：18"}
- {cn: "流沙陷坑", en: "Quicksand Pit", kind: 危害, page: 77, rating: "1 阶 妨碍", trigger: "", poison_types: "", dc: 5, dcs: [5, 10], damage: ["1d4", "1d6", "1d8", "1d10"], ac: 0, hp: 0, price_gp: 0, text: "一处流沙陷坑有10尺深，覆盖10尺方形范围的地面。进入区域的生物会在流沙内下陷1d4 + 1尺，并陷入束缚状态。在该生物每回合开始时，将再次下陷1d4尺。只要生物没有完全被流沙吞没，它就能用一个动作尝试逃脱，进行一次力量（运动）检定（DC 10 外加生物陷入流沙的英尺数），检定成功则脱困。完全被流沙吞没的生物将陷入目盲状态，并有窒息的风险。（注：在5etools的文本中，此处还提供掩护，在参考的不全书中缺少该部分描述）\n生物可以将其触及内的另一位生物拉出流沙陷坑，这需要救援者用其动作进行一次成功的运动（运动）检定（DC 5 外加上生物陷入流沙的英尺数）。\n【升环施法】你可以通过加深陷坑深度和提高每回合生物下陷的英尺数来提高对应的等级范围，如以下表格所示。 等级：5–10 / 陷坑深度：15尺 / 下陷速率：1d6尺 等级：11–16 / 陷坑深度：20尺 / 下陷速率：1d8 尺 等级：17–20 / 陷坑深度：30尺 / 下陷速率：1d10尺"}
- {cn: "刃藤", en: "Razorvine", kind: 危害, page: 78, rating: "1 阶 妨碍", trigger: "", poison_types: "", dc: 10, dcs: [10], damage: ["1d10"], ac: 0, hp: 0, price_gp: 0, text: "剃刀藤是一种生长在野外丛林和灌木丛中的植物。它还可以像常春藤一样，附着在建筑物和其他表面上。一块10尺高，10尺宽，5尺厚的剃刀藤墙或剃刀藤篱笆拥有AC11，25点生命值，对钝击、穿刺和心灵伤害具有免疫。\n生物在一回合内第一次接触剃刀藤时，该生物必须成功通过一次DC 10的敏捷豁免，否则将被其刀锋般的荆棘划伤而受到5（1d10）点挥砍伤害。"}
- {cn: "冥河", en: "River Styx", kind: 危害, page: 78, rating: "3 阶 妨碍", trigger: "", poison_types: "", dc: 20, dcs: [20], damage: ["3d12"], ac: 0, hp: 0, price_gp: 0, text: "冥河流经下层位面。品尝或接触其河水将摧毁生物的理智和个性，同时剥夺其记忆。某些邪魔免疫冥河的效果。\n从冥河中饮水、走入河水或在河水中开始其回合的生物必须进行一次DC 20的智力豁免，除非该生物免疫冥河的效果。豁免失败时，生物受到19（3d12）点心灵伤害，并且在接下来的30天内无法施放法术或执行魔法动作。已经受到冥河效果影响的生物可以自由饮用河水或在河水中游泳，不会受到额外的影响。\n这一效应只能被高等复原术、医疗术或祈愿术所终止。如果此效应在30天内没有被终止，它将转化为永久效应，受影响的生物则会失去所有记忆。到了这种程度后，只有祈愿术和神圣干预才能将其解除。\n从冥河中取出的水，在24小时后会失去其效力，成为无害的、有腐烂味道的液体。奥登罗斯魔Arcanaloths，夜鬼婆Night hags和其他邪恶生物可能知晓延长冥河水效力的仪式，这由你决定。"}
- {cn: "岩崩", en: "Rockslide", kind: 危害, page: 78, rating: "1 阶 致命", trigger: "", poison_types: "", dc: 15, dcs: [15], damage: ["2d10", "4d10", "10d10", "18d10"], ac: 0, hp: 0, price_gp: 0, text: "当岩崩发生时，每个处于其路径上的生物必须进行一次DC 15的敏捷豁免。豁免失败时，生物受到11（2d10）点钝击伤害 ，并且陷入倒地状态，随着岩崩移动。豁免成功则生物仅受半伤。\n当岩崩停下后，其占据空间变为困难地形，所有倒地于其中的生物都会被石头和碎片所掩埋。以此法被掩埋其中的生物陷入束缚状态，并获得掩护。以一个动作，生物可以尝试从石堆中爬出来：如果该生物成功通过一次DC 15的力量（运动）检定，它将不再被束缚，而是来到石堆的表面，同时陷入倒地状态；如果检定失败，该生物依旧被掩埋，且获得1级力竭。\n一个没有处于失能和束缚状态的生物可以花费一分钟，救出被岩崩掩埋的另一个生物。\n【升环施法】你可以通过提高钝击伤害来提高这一危害所对应的等级范围，按照如此：5-10级范围受到22（4d10）点伤害，11-16级范围受到55（10d10）点伤害，17-20级范围受到99（18d10）点伤害。"}
- {cn: "湿滑冰面", en: "Slippery Ice", kind: 危害, page: 69, rating: "", trigger: "", poison_types: "", dc: 10, dcs: [10], damage: [], ac: 0, hp: 0, price_gp: 0, text: "湿滑冰面视为困难地形，在一回合内首次移动到湿滑冰面上或在冰面上开始自己的回合的生物必须成功通过DC 10的敏捷豁免，否则将会倒地。"}
- {cn: "强风", en: "Strong Wind", kind: 危害, page: 69, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: [], ac: 0, hp: 0, price_gp: 0, text: "强风会使得用武器进行的远程攻击具有劣势。强风还会熄灭没有遮掩的明火并驱散浓雾。一个在强风中飞行的生物必须在回合结束时落地着陆，否则就会坠落。\n当强风出现在沙漠中时能够造成沙尘暴，对感知（察觉）检定造成劣势。"}
- {cn: "薄冰", en: "Thin Ice", kind: 危害, page: 69, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: ["3d10"], ac: 0, hp: 0, price_gp: 0, text: "每10尺方形区域的薄冰，其能承受的最大重量为3d10 × 10磅。只要一处薄冰区域的总重量超过了承受能力，这个区域的冰层便会全部破裂，所有生物都会掉下去。薄冰下面是寒冷水域。"}
- {cn: "恶毒活藤", en: "Vicious Vine", kind: 危害, page: 78, rating: "1 阶 妨碍", trigger: "", poison_types: "", dc: 10, dcs: [10, 12], damage: ["1d10", "2d10", "4d10", "10d10"], ac: 0, hp: 0, price_gp: 0, text: "恶毒活藤由魔法活化，它们常常附着在门框、拱门、墙壁和雕像上。除非恶毒活藤移动，否则没有办法将其与非活化的藤蔓区分开来。\n每条恶毒活藤拥有AC11，16点生命值，并对钝击、穿刺和心灵伤害具有免疫。当一个生物一回合内第一次进入藤蔓5尺范围内，或在范围内开始其回合时，藤蔓将会尝试缠绕住 此生物。目标必须成功通过一次DC 12的敏捷豁免，否则将陷入受擒状态（逃脱DC 12）。以此法陷入受擒状态的生物在自己的回合开始时，藤蔓上的荆棘会吸取其生命力，对其造成5（1d10）点暗蚀伤害。一条藤蔓同时只 能擒抱一个生物。\n以一个影响动作，处于植物交谈或者类似法术效应下的角色可以说服藤蔓释放受害者，这需要成功通过一次DC 10的魅力（游说）检定。一个被藤蔓主动释放的生物在接下来的24小时内不会被这根藤蔓再次攻击。\n【升环施法】你可以通过提高暗蚀伤害、豁免DC和逃脱DC来提高危害对应的等级范围，如以下表格所示。 等级：5–10 / 暗蚀伤害：11 (2d10) / 豁免/逃脱 DC：14 等级：11–16 / 暗蚀伤害：22 (4d10) / 豁免/逃脱 DC：16 等级：17–20 / 暗蚀伤害：55 (10d10) / 豁免/逃脱 DC：18"}
- {cn: "蛛网", en: "Webs", kind: 危害, page: 79, rating: "1 阶 妨碍", trigger: "", poison_types: "", dc: 12, dcs: [12], damage: [], ac: 0, hp: 0, price_gp: 0, text: "巨蜘蛛会在过道和陷坑底部编织厚实黏滑的蛛网用以捕猎。这些布满蛛网的区域皆视为困难地形。\n一个生物若在回合中首次进入布满蛛网的区域或在其内开始回合时，必须成功通过DC 12的敏捷豁免检定，否则将陷入束缚状态。被蛛网束缚的生物可以消耗一个动作尝试逃脱，需成功通过DC 12的力量（运动）或敏捷（特技）检定。\n每10尺立方的蛛网拥有AC10，15点生命值，蛛网对火焰伤害具有易伤，而对穿刺、毒素和心灵伤害具有免疫。"}
- {cn: "狂野魔法区域", en: "Wild Magic Zone", kind: 危害, page: 69, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: ["1d20"], ac: 0, hp: 0, price_gp: 0, text: "过去发生的魔法灾难或者不受控制的力量肆虐，都可能导致某个地区的魔法结构崩溃，进而形成狂野魔法区域。这样的区域其直径通常不会超过300尺，而在此区域内，魔法可能会表现出不可预测的变化。\n每当一个生物在狂野魔法区域消耗一个法术位来施展法术时，投掷1d20，如果掷出的骰子是20，则在玩家手册中的狂野魔法浪涌上掷骰来创建一个魔法效应。"}
- {cn: "黄霉菌", en: "Yellow Mold", kind: 危害, page: 79, rating: "1 阶 致命；2 阶 妨碍", trigger: "", poison_types: "", dc: 15, dcs: [15], damage: ["2d10", "1d10"], ac: 0, hp: 0, price_gp: 0, text: "黄霉菌生在阴暗处，每片黄霉菌覆盖5尺方形区域。如果被触碰，黄霉菌会喷射出一片覆盖10尺立方的孢子云。任何处于此区域内的生物必须成功通过一次DC 15的体质豁免，否则将受到11（2d10）点毒素伤害，并在接下来的一分钟内陷入中毒状态。以此法中毒的生物在其每个回合开始时受到5（1d10）点毒素伤害。生物在每个自己的回合结束时重新豁免，豁免成功则效应终止。\n阳光直射或任何火焰伤害都会立刻摧毁一片黄霉菌。"}
- {cn: "疯笑病", en: "Cackle Fever", kind: 疫病, page: 61, rating: "", trigger: "", poison_types: "", dc: 10, dcs: [10, 13], damage: ["1d4", "1d10"], ac: 0, hp: 0, price_gp: 0, text: "廉价制作的药水和灵药有时会被失心疯所污染。这种疾病只在类人生物间传播；奇怪的是，侏儒却免疫这种疫病。染疫的生物会在感染1d4天之后开始承受以下效应：\n【发热】该生物获得1级力竭，该力竭将持续存在，直至该生物康复。\n【失控狂笑】在该生物具有此力竭状态期间，每当其受到除心灵伤害之外的伤害时，它都要进行一次DC 13的体质豁免。豁免失败则该生物受到5（1d10）心灵伤害，并开始无法控制地狂笑而因此陷入失能状态。该生物在其每个回合结束时重复此豁免，豁免成功则结束此效应。该生物亦将在1分钟后自动成功于此豁免。\n【抵抗疫病】每当染疫的生物完成一次长休时，它都要进行一次DC 13的体质豁免。一旦该生物累计成功通过该豁免3次，它就会康复，并在接下来的1年里免疫失心疯。\n【传播疫病】任何在以感染了疯笑病的生物为中心、10尺半径的光环区域内开始回合的类人生物（侏儒除外）都必须成功通过一次DC 10的体质豁免，否则亦将感染疯笑病。豁免成功则该生物在接下来的24小时内不会再因致使其进行豁免的那个特定生物而感染该疫病。"}
- {cn: "下水道瘟疫", en: "Sewer Plague", kind: 疫病, page: 61, rating: "", trigger: "", poison_types: "", dc: 11, dcs: [11], damage: ["1d4"], ac: 0, hp: 0, price_gp: 0, text: "污秽的药水和炼金废物可以产生下水道瘟疫：这种疫病在下水道和垃圾堆中滋生，并通过栖息在上述区域的生物传播，例如老鼠和食腐兽。任何被携带此疫病的生物伤到，或是接触了被此疫病污染的秽物或内脏的类人生物都必须成功通过一次DC 11 的体质豁免，否则将被下水道瘟疫感染。染疫的生物会在感染 1d4 天之后开始承受以下效应：\n【疲惫】该生物获得1级力竭。\n【虚弱】只要该生物具有任意来源的力竭等级，它在消耗生命骰恢复生命值时就只能恢复一半的生命值。\n【无休】只要该生物具有任意来源的力竭等级， 它就不会因完成长休而恢复任何生命值、亦不会因此降低力竭等级。\n【抵抗疫病】染疫的生物在每日黎明时都要进行一次DC 11 的体质豁免。豁免失败则病情恶化，该生物获得1级力竭。豁免成功则该生物降低1级力竭。若该生物的力竭等级降至0，则该生物康复。"}
- {cn: "腐眼症", en: "Sight Rot", kind: 疫病, page: 61, rating: "", trigger: "", poison_types: "", dc: 15, dcs: [15], damage: [], ac: 0, hp: 0, price_gp: 0, text: "野兽或类人生物在饮用被腐眼症污染的水体时必须进行一次DC 15的体质豁免，豁免失败则陷入目盲状态，直至疫病康复。\n【抵抗疫病】医疗术、次等复原术及类似魔法可以立即治愈此疫病。一个具有草药工具熟练的角色可以花费1小时来用该工具制作一份非魔法性的药膏。将药膏涂在一个感染腐眼症的生物的眼睛上后，该疫病的效果将被压制24小时。当该疫病被以此法累计压制72小时（即制作并使用了三份药膏）后，该生物就会康复。\n【传播疫病】任何与腐眼症感染者有皮肤接触的类人生物都必须成功通过一次DC 15的体质豁免，否则也会感染此疫病。豁免成功则该生物在接下来的24小时内不会再因致使其进行豁免的那个特定生物而感染该疫病。"}
- {cn: "弩炮", en: "Ballista", kind: 攻城装备, page: 96, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: ["3d10"], ac: 15, hp: 50, price_gp: 0, text: "弩炮是一种发射重型弩矢的巨型弩。装填需要一次操作动作，瞄准弩炮同样需要一个操作动作。随后操作手便可执行弩炮发射动作。\n【弩炮发射（需要装填和瞄准）】：+6，射程120/480尺。：16（3d10）穿刺伤害。"}
- {cn: "火炮", en: "Cannon", kind: 攻城装备, page: 96, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: ["8d10"], ac: 19, hp: 75, price_gp: 0, text: "火炮使用火药或奥法能量推动重型铁球，使其以毁灭性的速度从空中划过进行攻击。火炮通常安装在带轮的木质炮台上。装填需要一次操作动作，瞄准火炮需要另外一次操作，随后操作手便可执行炮弹发射动作。\n【炮弹发射（需要装填和瞄准）】：+6，射程600/2400尺。：44（8d10）钝击伤害。"}
- {cn: "喷火战车", en: "Flamethrower Coach", kind: 攻城装备, page: 96, rating: "", trigger: "", poison_types: "", dc: 15, dcs: [15], damage: ["4d6"], ac: 19, hp: 100, price_gp: 0, text: "这种覆着铁甲的战车由魔法驱动，其上装有能喷射烈焰的炮塔。\n战车中的空间至多能容纳两名中型生物，由底部的舱门进出。战车的前后左右皆设有可供其操作手观察外界的狭缝。车内的生物对任何来自外界的攻击和其他效应都具有掩护。\n喷火战车需要两名操作手驱动：一位驾驶员和一位炮手。驾驶员可以执行操作动作控制战车内的操纵杆与踏板，令战车移动或转向（其速度为30尺）。炮手则可以使用烈焰喷射动作来瞄准并发射火焰。\n【烈焰喷射】dex：DC 15，60尺长、5尺宽的线状区域内的所有生物。：14（4d6）火焰伤害，且该生物开始燃烧。 ：半伤。"}
- {cn: "毒桶抛掷器", en: "Keg Launcher", kind: 攻城装备, page: 96, rating: "", trigger: "", poison_types: "", dc: 15, dcs: [15], damage: ["4d6"], ac: 15, hp: 30, price_gp: 0, text: "毒桶抛掷器是一种可搭载于驮兽背部的投掷装置，能够抛出装满毒气的小桶。装填需要一次操作，瞄准毒桶抛掷器同样需要一次操作，随后操作手便可执行毒爆桶投掷动作。\n【毒爆桶投掷（需要装填和瞄准）】con：DC 15，以30尺外、300尺内任意一点为圆心半径20尺球状区域内的所有生物。：14（4d6）毒素伤害。 ：半伤。"}
- {cn: "闪击炮", en: "Lightning Cannon", kind: 攻城装备, page: 96, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: ["4d10"], ac: 19, hp: 30, price_gp: 0, text: "闪击炮是一种镶嵌着奥法符文的小型青铜火炮，安装于重型三角炮架上。这种火炮射出的是霹雳般的电能炮弹。为闪击炮瞄准需要一次操作动作，随后操作手便可执行闪电炮击动作。\n【闪电炮击（需要瞄准）】：+6，射程300/1200尺。：22（4d10）闪电伤害。"}
- {cn: "投石机", en: "Mangonel", kind: 攻城装备, page: 97, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: ["5d10"], ac: 15, hp: 100, price_gp: 0, text: "投石机是一种抛射重型投石的攻城器，其弹道为极高的抛物线，故而投出的石弹可以越过城墙打击目标。装填需要一次操作动作，瞄准投石机同样需要一次操作动作。随后操作手便可执行弹射投石动作。\n【投石（需要装填和瞄准）】：+5，射程200/800尺（无法命中60尺内的目标）。：27（5d10）钝击伤害。"}
- {cn: "攻城槌", en: "Ram", kind: 攻城装备, page: 97, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: ["3d10"], ac: 15, hp: 100, price_gp: 0, text: "攻城槌的底座是一个可移动的框架，一根粗原木作为其主体，用铁链装架在两个带盖顶的横梁上。原木前端镶裱着铁皮外壳，用以击穿大门与路障。校准攻城槌需要三次操作动作，随后操作手便可执行攻城槌动作。\n攻城槌的顶盖使其对来自上方的攻击和其他效应具有掩护。\n【攻城槌（需要校准）】：+8，触及5尺。：16（3d10）钝击伤害。"}
- {cn: "攻城塔", en: "Siege Tower", kind: 攻城装备, page: 97, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: [], ac: 15, hp: 200, price_gp: 0, text: "攻城塔是一种可移动的木质建筑，其主体由木梁作为框架，墙壁由木板铺成。塔底设置了大型的木轮或滚轴，让其可被士兵或负重牲畜推拉从而进行移动。中型或更小体型的生物可以使用攻城塔到达至多40尺高的城墙上。攻城塔内的生物对来自塔外的攻击与其他效应处于掩护。"}
- {cn: "吊挂大锅", en: "Suspended Cauldron", kind: 攻城装备, page: 97, rating: "", trigger: "", poison_types: "", dc: 15, dcs: [15], damage: ["3d6"], ac: 19, hp: 20, price_gp: 0, text: "一口吊挂起来的钢铁坩锅，可以方便地将其侧翻并倒出内里所装载的物质。大锅一旦倒空，则必须将其重新装满才能使用。装满大锅需要三次操作动作，随后操作手便可执行倾倒热油动作。\n大锅通常装着热油，但也可以装填其他物质，比如强酸或者绿软泥（见本章中\"危害\"部分），并依不同物质造成不同效应。\n【倾倒热油（需要大锅装满）】dex：DC 15，大锅下方10尺立方内的所有生物。：10（3d6）火焰伤害。 ：半伤。"}
- {cn: "配重投石机", en: "Trebuchet", kind: 攻城装备, page: 97, rating: "", trigger: "", poison_types: "", dc: 0, dcs: [], damage: ["8d10"], ac: 15, hp: 150, price_gp: 0, text: "配重投石机是一种以弧线抛射重型投石的攻城器，其投出的石弹可以越过城墙打击目标。装填需要两次操作动作，瞄准配重投石机则需要另外两次操作。随后操作手便可执行配重投石动作。\n【配重投石（需要装填与瞄准）】：+5，射程300/1200尺（无法命中60尺内的目标）。：44（8d10）钝击伤害。"}
- {cn: "刺客之血", en: "Assassin's Blood", kind: 毒药, page: 90, rating: "", trigger: "", poison_types: "服用", dc: 10, dcs: [10], damage: ["1d12"], ac: 0, hp: 0, price_gp: 150.0, text: "服用这种毒药的生物需要进行一次DC 10的体质豁免。豁免失败则受6（1d12）毒素伤害并陷入中毒状态24小时。豁免成功则只受半伤。"}
- {cn: "焦引熏烟", en: "Burnt Othur Fumes", kind: 毒药, page: 90, rating: "", trigger: "", poison_types: "吸入", dc: 13, dcs: [13], damage: ["3d6", "1d6"], ac: 0, hp: 0, price_gp: 500.0, text: "受害于该毒药的生物必须成功通过一次DC 13的体质豁免，否则将受到10（3d6）毒素伤害，并在其每个回合开始时重复此豁免。此时每次豁免失败后该生物都将受3（1d6）毒素伤害。累计三次豁免成功后，毒药的效应终止。"}
- {cn: "食腐虫粘液", en: "Carrion Crawler Mucus", kind: 毒药, page: 90, rating: "", trigger: "", poison_types: "接触", dc: 13, dcs: [13], damage: [], ac: 0, hp: 0, price_gp: 200.0, text: "接触到这种毒药的生物必须成功通过一次DC 13的体质豁免，否则将陷入中毒状态1分钟。以此中毒期间该生物还会陷入麻痹状态。该生物在其每个回合结束重复此豁免，豁免成功则终止其身上的此效应。"}
- {cn: "乙醚精", en: "Essence of Ether", kind: 毒药, page: 90, rating: "", trigger: "", poison_types: "吸入", dc: 15, dcs: [15], damage: [], ac: 0, hp: 0, price_gp: 300.0, text: "吸入这种毒药的生物必须成功通过一次DC 15的体质豁免，否则将陷入中毒状态8小时。以此中毒期间该生物还会陷入昏迷状态。该生物会在受到伤害、或是其他生物用一个动作来将其摇醒时苏醒。"}
- {cn: "罗丝之吻", en: "Lolth's Sting", kind: 毒药, page: 91, rating: "", trigger: "", poison_types: "伤害", dc: 13, dcs: [13], damage: [], ac: 0, hp: 0, price_gp: 200.0, text: "遭受这种毒药影响的生物必须成功通过一次DC 13的体质豁免，否则陷入中毒状态1小时。若该生物豁免失败且骰值比DC低5或更多，则该生物还会在以此法中毒期间陷入昏迷。该生物会在受到伤害、或是其他生物用一个动作来将其摇醒时苏醒。"}
