# 《怪物图鉴（2025）》名录：每张数据卡的名字 / 生物类型 / 挑战等级 / 栖息地
#
# 来源：``参考/怪物图鉴（2025）.md`` 的三份附录（按生物类型 / 按挑战等级 / 按栖息地），
# 由 ``scripts/build_bestiary_index.py`` 生成。
#
# ⚠️ 那份导出里每张数据卡都是「正在加载……」占位符——AC、生命值、属性、动作
#    一个数字都没有（和《风骸岛之龙》附录 B 是同一种问题）。所以这里只有名字、
#    类型、CR、栖息地与标签：**够 DM 按 CR 挑怪、够统一译名、够回答「图鉴里有没有这只」，
#    不够开战**。真正能打的数据卡在 ``monsters*.yaml``。
#
# cr 用数值（1/8 = 0.125）；habitats / tags 可能为空——书里说明，
# 不居住在自然栖息地的生物（天族、许多邪魔）不进栖息地表。

