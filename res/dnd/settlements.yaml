# 《城主指南 (2024)》第三章「聚居地」明文数值（参考 md L4385-4525）
#
# 七组内容：规模表 3 行 + 六张随机表（重要特征 1d20、闻名于 1d20、
# 当前的灾难 1d12、当地领袖 1d12、酒馆名称 1d20×2、随机店铺 1d20）。
# 数值与文案一律从这里取，别写回 .py（有测试拦）。
#
# ⚠️ 规模表**不是随机表**：村庄 / 小镇 / 城市由 DM 按设定选，
#    卡上只给人口范围与「该聚落可能出售的最昂贵物品价值」的交易限额。
#    原文 L4387 明确说可按特殊情况调整（村里恰好有炼金师也可能买得到药水）。
# ⚠️ 酒馆名称按原文 L4501 脚注：**两个组成部分各掷一次 1d20**，别只掷一次。
# ⚠️ 所有随机表用 low/high 存档位；单值行 low == high。

meta:
- key: features
  cn: 重要特征
  aliases: [特征, 地标, 重要地标]
  dice: 1d20
- key: known_for
  cn: 闻名于
  aliases: [成名之举, 名声, 特产]
  dice: 1d20
- key: calamity
  cn: 当前的灾难
  aliases: [灾难, 灾变, 麻烦]
  dice: 1d12
- key: leader
  cn: 当地领袖
  aliases: [领袖, 首领, 统治者]
  dice: 1d12
- key: tavern
  cn: 酒馆名称
  aliases: [酒馆, 酒馆名, 旅店]
  dice: 1d20 × 2
- key: shops
  cn: 随机店铺
  aliases: [店铺, 商店, 随机商铺]
  dice: 1d20

size:
- cn: 村庄
  aliases: [村落, 乡村, village]
  population_text: 最多 500
  population_min: 0
  population_max: 500
  trade_limit_gp: 20
- cn: 小镇
  aliases: [镇子, 城镇, town]
  population_text: 501–5,000
  population_min: 501
  population_max: 5000
  trade_limit_gp: 2000
- cn: 城市
  aliases: [大城, 都市, city]
  population_text: 5001 及更高
  population_min: 5001
  population_max: null
  trade_limit_gp: 200000

