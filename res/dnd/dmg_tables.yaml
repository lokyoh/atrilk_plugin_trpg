- {lo: 6, hi: 6, cols: ["就在冒险者们将要完成他们的目标时，一个盟友背叛了他们。（谨慎地使用这个高潮，切忌滥用。）"]}
- {lo: 7, hi: 7, cols: ["一扇通往另一存在位面的传送门开启。另一边的生物蜂拥而至迫使冒险者们在处理反派的同时还要将传送门关闭。"]}
