# 由 参考/5etools-cn-cn2.0/data/book/book-dmg.json 机械转录；
# 每张表一个键，行格式 {lo, hi, cols}：有骰表 lo/hi 是区间，cols 是其余列；
# 无骰表 lo=hi=0，整行都在 cols 里。表的中文名 / 骰型在 core/dnd/dmg_tables.py。
# ⚠️ 「魔法物品的稀有度」首行原文写「通用语」，是 2024 中文包转录笔误，已改「普通」。
# ⚠️ 只读规则原文：系统只掷骰与查表，不自动改角色卡。

