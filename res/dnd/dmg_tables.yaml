special_creator:
- {lo: 1, hi: 1, cols: ["异怪。该物品由远古时期的异怪制作，很可能是做给其青睐的类人生物奴隶使用。从眼角余光观察该物品时你会看到它好像在动。"]}
- {lo: 2, hi: 4, cols: ["人类。该物品在某个已陨落的人类王国曾经的全盛时期创造出来，或者它与一名传奇人类相关。其上可能书写着某些早已失传于历史长河的语法或字符。"]}
- {lo: 5, hi: 5, cols: ["天界生物。该武器的重量是普通物品的一半，上面刻着有羽翼、太阳和其他象征善良的符号。邪魔生物会觉得这件物品的存在令其生厌。"]}
- {lo: 6, hi: 6, cols: ["龙类。该物品由龙鳞和龙爪制成。也许它从龙的宝库中吸收了一些稀有金属和宝石。当它身处一条龙周围120尺范围内时，会变得稍暖一点。"]}
- {lo: 7, hi: 7, cols: ["卓尔精灵。该物品的重量是普通物品的一半。它通体泛黑，上面刻着蜘蛛和蛛网的图样以代表罗丝Lolth。暴露在阳光下1分钟或更长时间后，其性能可能会变的极差差，或者直接解体。"]}
- {lo: 8, hi: 9, cols: ["矮人。该物品经久耐用，并设计着矮人的符文。它可能与一个希望看到该物品回归自己先祖大厅的氏族联系在一起。"]}
- {lo: 10, hi: 10, cols: ["气元素。该物品重量为其同常重量的一半，而且感觉像是空心的一样。如果该物品由丝织物制成，则其将如轻纱般半透明。"]}
- {lo: 11, hi: 11, cols: ["土元素。该物品可能由石头制成。其上任何布料或皮革部分点缀满了打磨光滑的小石粒。"]}
- {lo: 12, hi: 12, cols: ["火元素。该物品摸起来可以感觉到温暖，其中任何金属部件都用黑铁制成。魔符烈焰覆盖在其表面。红色和橘色之间的渐变是其主色调。"]}
- {lo: 13, hi: 13, cols: ["水元素。润泽鱼鳞取代该物品的皮革或布料部件，而由海贝制成的金属部件硬度跟真金属一样坚韧。"]}
- {lo: 14, hi: 15, cols: ["精灵。该物品重量为其通常重量的一半。其上以各种象征大自然的标志所点缀：树叶、藤蔓、星星，诸如此类。"]}
- {lo: 16, hi: 16, cols: ["精类生物。该物品用最好材料精心制作而成，它在月光下会发出淡淡的光耀，并想周边5尺半径范围散发出微光光照。其所有金属部件都有白银和秘银来代替原来铁和钢。"]}
- {lo: 17, hi: 17, cols: ["邪魔生物。该物品用黑铁或角刻上符文制作而成，其所有布质或皮质部件都由邪魔的毛皮制作，它的表面触感暖和，其上装饰着斜睨的面孔或邪秽的符文。天界生物会觉得该物品令其感觉厌恶。"]}
- {lo: 18, hi: 18, cols: ["巨人。该物品比普通物品要大，由巨人为其身材细小的盟友们精心制作而成。"]}
- {lo: 19, hi: 19, cols: ["侏儒。该物品看起来很普通，甚至感觉有点破旧。它可以和一些齿轮和机械部件结合起来，不过这些部件对物品本身的功能没什么影响。"]}
- {lo: 20, hi: 20, cols: ["不死生物。该物品包含了死亡的意象（比如骨头和头骨），它可能由尸体的残骸制成的。且摸起来可以感觉到冰冷。"]}

special_history:
- {lo: 1, hi: 1, cols: ["神秘的。该物品是为某个古代施法者团体所制造而成，并且其上还带有该团体的标志。"]}
- {lo: 2, hi: 2, cols: ["祸根。该物品由某个特定文明或某种生物的敌人创造。如果该文明或生物仍然存在，则他们可能会认出这个物品，并将其持有者视为敌人。"]}
- {lo: 3, hi: 3, cols: ["英雄。一位伟大的英雄曾持用该物品。任何熟悉该物品曾经历史的人都期待着其新主人的伟大事迹。"]}
- {lo: 4, hi: 4, cols: ["修饰。该物品为纪念一个特殊的场合而制作。它镶嵌着宝石、黄金或铂金，并以金银装饰其表面。"]}
- {lo: 5, hi: 5, cols: ["预言。该物品显现一则预言：它的持有者注定要在未来的事件中扮演关键角色。那些想要扮演该角色的人可能会试图窃取该物品，或者想阻止该预言被实现的人会想要杀死这个物品的持有者。"]}
- {lo: 6, hi: 6, cols: ["宗教。该物品曾被用于宗教仪式，并专门用于某个特定的神祇。其内还有神圣的符文正在生效。该神灵的追随者们可能会试图说服其主人将它捐赠给神庙，或者私自将其窃取，或者向同属于该神祇的牧师或圣武士持用者表示祝贺。"]}
- {lo: 7, hi: 7, cols: ["罪恶。该物品与某个重大恶行相关，比如大屠杀或暗杀。它可能有一个名字，或者与一个曾使用它的反派密切相关。任何熟悉该物品过去的人都可能对其所有者表示怀疑。"]}
- {lo: 8, hi: 8, cols: ["权力象征。该物品曾被用作皇室高阶官职加冕物品的一部分。它的前主人或那个人的后代可能会想要得到该物品，或者有人可能会误以为它的新主人是该物品的合法继承人。"]}

special_minor:
- {lo: 1, hi: 1, cols: ["灯塔。持有者可以用一个附赠动作，使物品在10尺半径范围内散发出明亮光照以及其外10尺微光光照，或以同样的动作熄灭这些光照。"]}
- {lo: 2, hi: 2, cols: ["指南针。持用者可以用一个动作得知哪边是北方。"]}
- {lo: 3, hi: 3, cols: ["尽责。该物品的持有者考虑或进行恶意行为时，该物品会增加良心的痛苦。"]}
- {lo: 4, hi: 4, cols: ["探索者。在地底时，该物品的持有者总能知道物品在地表以下的深度，以及最近的楼梯、斜坡或其他向上道路的方位。"]}
- {lo: 5, hi: 5, cols: ["闪亮。该物品永远不会变脏。"]}
- {lo: 6, hi: 6, cols: ["警卫。该物品会对其持有人发出低语警告，若持有人并未陷入失能，则其先攻获得+2加值。"]}
- {lo: 7, hi: 7, cols: ["调谐。与该物品同调仅需 1 分钟。"]}
- {lo: 8, hi: 8, cols: ["隐秘情报。一则情报被隐藏在该物品的某个位置。它可能在一年中的某一时刻，月亮的某一月相，或在特定地点时才能看见。"]}
- {lo: 9, hi: 9, cols: ["钥匙。该物品被用来解锁一个容器、房间、地窖或其他入口。"]}
- {lo: 10, hi: 10, cols: ["语言。持有人可以在该物品在身边时理解或讲说一种由DM选定的语言。"]}
- {lo: 11, hi: 11, cols: ["哨兵。选择一个生物类型，并将其设定为该物品制作者的敌人。当同类生物在物品周边120尺范围内时，物品将散发出微光。"]}
- {lo: 12, hi: 12, cols: ["歌唱。每当该物品被打到或被用来打击敌人时，它的持有者就会听到一首古老歌曲的片段。"]}
- {lo: 13, hi: 13, cols: ["奇材怪料 。该物品由一种与其用途不符的奇特材料制成，但这并不影响其耐久性。"]}
- {lo: 14, hi: 14, cols: ["温度。持有者身处如 -20华氏度或120华氏度的温度下，不会受到任何冷热环境造成的伤害。"]}
- {lo: 15, hi: 15, cols: ["坚不可摧。该物品无法被破坏。只有某些特殊手段方可摧毁该物品。"]}
- {lo: 16, hi: 16, cols: ["战争领袖。持有人可以用一个动作使自己的声音清晰地传递至远300尺距离，效应持续至该持有人自己的下一回合结束。"]}
- {lo: 17, hi: 17, cols: ["水性。该物品漂浮在水上和其他液体上。它的持有者以力量（运动）检定进行游泳时具有优势。"]}
- {lo: 18, hi: 18, cols: ["恶意。当持有人有机会以自私或恶意的方式行事时，该物品会使持有人的冲动变得更加强烈。"]}
- {lo: 19, hi: 19, cols: ["幻术。该物品充满了幻术魔法，可以让其持有人微小的改变该物品的外观。这样的改变不会改变该物品着装、携带或使用的方式，也不会对其别的魔法属性产生影响。例如，其着装者可以让红色的长袍看起来是蓝色，或者让金色的戒指看起来是象牙质。当没有人携带或着装该物品时，它就会恢复其真实的外观。"]}
- {lo: 20, hi: 20, cols: ["再骰两次，并重骰接下来任何结果为 20 的骰子。"]}

special_quirks:
- {lo: 1, hi: 1, cols: ["极乐。拥有该物品时，持有人将感觉未来充满幸运与乐观。蝴蝶和其他无害的生物可能会在物品出现时在其周围嬉戏。"]}
- {lo: 2, hi: 2, cols: ["自信。该物品帮助其持有者感到自信。"]}
- {lo: 3, hi: 3, cols: ["贪婪。该物品的持有者会沉迷于物质财富。"]}
- {lo: 4, hi: 4, cols: ["脆弱。该物品被持用、着装或激活时，会发生轻微的破碎、磨损、崩口或炸裂。这种小习性对其属性没有影响，但该物品被用的越多就会显得越破旧。"]}
- {lo: 5, hi: 5, cols: ["饥饿。必须对该物品使用类人生物的鲜血，才能再24小时时间里使其魔法属性生效。它只需要一滴血便可被激活。"]}
- {lo: 6, hi: 6, cols: ["大喊。使用该物品时，它会发出响亮的声音（好比一声铿锵、一声喊叫或一声共振）。"]}
- {lo: 7, hi: 7, cols: ["变质。该物品会周期性随机地细微改变其外观。持有人无法控制这些小改动，这些改变也不影响物品的使用效果。"]}
- {lo: 8, hi: 8, cols: ["嘟哝。该物品牢骚不断，喃喃自语。一个仔细聆听的生物可能从中得知一些有用的东西。"]}
- {lo: 9, hi: 9, cols: ["痛苦。使用该物品时，持有者会经历一种无害的疼痛。"]}
- {lo: 10, hi: 10, cols: ["占有。该物品需要同调，且第一次持用或着装该物品后，它便不允许其持有者再与其他物品进行同调。（已经与持有人完成同调的物品维持其同调状态，直至其同调联结终止。）"]}
- {lo: 11, hi: 11, cols: ["反感。与该物品接触时，其持有人会感到一种厌恶感，并且会持续感觉到这种不舒服的感觉。"]}
- {lo: 12, hi: 12, cols: ["懒惰。该物品的持有者感觉懒散且昏昏欲睡。与此同时，持有者需要花费10小时才能完成一次长休。"]}

sentient_communication:
- {lo: 1, hi: 60, cols: ["该物品通过向携带或持用该物品的生物传递其情绪来进行沟通。"]}
- {lo: 61, hi: 90, cols: ["该物品能够听、说、读一门或多门语言。"]}
- {lo: 91, hi: 100, cols: ["该物品能够听、说、读一门或多门语言，并且还能与持有者通过心灵感应进行交流。"]}

