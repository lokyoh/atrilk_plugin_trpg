sentient_goal:
- {lo: 1, hi: 1, cols: ["阵营Aligned：打败或摧毁对立阵营（这样的物品通常都不是绝对中立阵营）。"]}
- {lo: 2, hi: 2, cols: ["祸害Bane：打败或摧毁特殊生物类型（比如邪魔，变形生物，巨魔或法师）。"]}
- {lo: 3, hi: 3, cols: ["守护者Protector：守护特殊种族或生物种类（比如精灵，德鲁伊）"]}
- {lo: 4, hi: 4, cols: ["十字军Crusader：打败、削弱或摧毁特定神的信徒。"]}
- {lo: 5, hi: 5, cols: ["圣殿骑士Templar：守护特定神的信徒。"]}
- {lo: 6, hi: 6, cols: ["破坏者Destroyer：渴望破坏且催促其使用者战斗。"]}
- {lo: 7, hi: 7, cols: ["荣誉追寻者Glory Seeker：希望通过帮助使用者成为声名远扬或是臭名昭著的形象，使自己成为世上最伟大的魔法物品。"]}
- {lo: 8, hi: 8, cols: ["学识追寻者Lore Seeker：渴望知识或者致力于解决谜题，知晓秘密，通晓晦涩的预言。"]}
- {lo: 9, hi: 9, cols: ["命运追寻者Destiny Seeker：认为自己和持用者在将来会成为重要人物。"]}
- {lo: 10, hi: 10, cols: ["根源追寻者Creator Seeker：寻找它的创造者，希望知道自己被创造的原因。"]}

artifact_benefit_minor:
- {lo: 1, hi: 20, cols: ["与神器同调期间，你的某项技能成为熟练项，具体哪项技能则由DM选出。"]}
- {lo: 21, hi: 30, cols: ["与神器同调期间，你免疫疾病状态。"]}
- {lo: 31, hi: 40, cols: ["与神器同调期间，你不再受魅惑或恐慌状态影响。"]}
- {lo: 41, hi: 50, cols: ["与神器同调期间，你对某个伤害类型拥有抗性，具体哪种伤害类型由DM选出。"]}
- {lo: 51, hi: 60, cols: ["与神器同调期间，你能够以一个动作施展一个戏法，具体哪个戏法由DM选出。"]}
- {lo: 61, hi: 70, cols: ["与神器同调期间，你能够以一个动作施展一道11级或以上法术，具体哪个法术由DM选出。完成施法后，你可以骰一次d6。骰值为1~5时，则直至第二天黎明前你无法再以该方式施法。"]}
- {lo: 71, hi: 80, cols: ["与61~70相同，但将法术替换为一个2环法术"]}
- {lo: 81, hi: 90, cols: ["与61~70相同，但将法术替换为一个3环法术。"]}
- {lo: 91, hi: 100, cols: ["与神器同调期间，你的护甲等级获得＋1加值。"]}

artifact_benefit_major:
- {lo: 1, hi: 20, cols: ["与神器同调期间，你的一项属性值提升2，其总值最高不能超过24。具体哪项属性由DM选出。"]}
- {lo: 21, hi: 30, cols: ["与神器同调期间，你将在你的回合开始时恢复1d6的生命值，前提是你必须至少还有1点生命值。"]}
- {lo: 31, hi: 40, cols: ["与神器同调期间，你以武器攻击命中敌人时将额外造成1d6的伤害，其伤害类型与所使用的武器相同。"]}
- {lo: 41, hi: 50, cols: ["与神器同调期间，你的步行速度增加10尺。"]}
- {lo: 51, hi: 60, cols: ["与神器同调期间，你可以用一个动作施展一道4级法术，具体哪个法术由DM选出。完成施法后，你可以骰一次d6。骰值为15时，则直至第二天黎明前你无法再以该方式施法。"]}
- {lo: 61, hi: 70, cols: ["与51~60相同，但将法术替换为一个5环法术。"]}
- {lo: 71, hi: 80, cols: ["与51~60相同，但将法术替换为一个6环法术。"]}
- {lo: 81, hi: 90, cols: ["与51~60相同，但将法术替换为一个7级法术。"]}
- {lo: 91, hi: 100, cols: ["与神器同调期间，你不再会陷入目盲、耳聋、石化或震慑状态。"]}

artifact_detriment_minor:
- {lo: 1, hi: 5, cols: ["与神器同调期间，你进行抵抗法术的豁免检定时具有劣势。"]}
- {lo: 6, hi: 10, cols: ["与神器同调期间，你首次触碰某个宝石或珠宝时，其价值将变为一半。"]}
- {lo: 11, hi: 15, cols: ["与神器同调期间，当你离开神器10尺范围外时，将进入目盲状态。"]}
- {lo: 16, hi: 20, cols: ["与神器同调期间，你进行抵抗中毒的豁免检定时具有劣势。"]}
- {lo: 21, hi: 30, cols: ["与神器同调期间，你散发着一阵酸腐的恶臭，该气味在10尺范围可以被轻易察觉到。"]}
- {lo: 31, hi: 35, cols: ["与神器同调期间，你身边10尺范围内的所有圣水都将被摧毁。"]}
- {lo: 36, hi: 40, cols: ["与神器同调期间，你的身体变的病弱，并且在进行基于力量或体质属性的属性检定或豁免检定时具有劣势。"]}
- {lo: 41, hi: 45, cols: ["与神器同调期间，你的体重增加1d4 × 10磅。"]}
- {lo: 46, hi: 50, cols: ["与神器同调期间，你的外貌发生变化，具体的变化由DM决定。"]}
- {lo: 51, hi: 55, cols: ["与神器同调期间，当你离开神器10尺范围外时，将进入耳聋状态。"]}
- {lo: 56, hi: 60, cols: ["与神器同调期间，你的体重减少1d4 × 5磅。"]}
- {lo: 61, hi: 65, cols: ["与神器同调期间，你失去嗅觉。"]}
- {lo: 66, hi: 70, cols: ["与神器同调期间，你身边30尺范围内的非魔法火焰都将自动熄灭。"]}
- {lo: 71, hi: 80, cols: ["与神器同调期间，你身边300尺范围内的其他生物无法进行短休或长休。"]}
- {lo: 81, hi: 85, cols: ["与神器同调期间，你触碰任何非生物的植物时对其造成1d6点黯蚀伤害。"]}
- {lo: 86, hi: 90, cols: ["与神器同调期间，你身边30尺范围内的动物都会进入对你敌对的状态。"]}
- {lo: 91, hi: 95, cols: ["与神器同调期间，你每天必须进食和饮水的量是正常量的六倍。"]}
- {lo: 96, hi: 100, cols: ["与神器同调期间，你的缺点以某种形式恶化，具体的变化由DM决定。"]}

artifact_detriment_major:
- {lo: 1, hi: 5, cols: ["与神器同调期间，你的身体会在四天内逐渐腐坏，之后腐坏停止。第1天结束时你的头发脱落，第2天结束时轮到手指尖和脚趾尖，第3天结束时轮到鼻子嘴唇，第4天结束时轮到耳朵。法术再生术可以恢复因此失去的身体器官。"]}
- {lo: 6, hi: 10, cols: ["与神器同调期间，你的阵营将在每日黎明发生变化。此时，你需要分别骰两次d6来决定你的新阵营。第一次骰值为12时为守序，34为中立，56为混乱。第二次骰值为12时为善良，34为中立，56为邪恶。"]}
- {lo: 11, hi: 15, cols: ["当你首次完成与神器的同调后，你必须去完成一项由DM决定的任务，该任务等同于你被施展了指使术geas的效应。一旦你完成该任务，就不再受该属性的效应所影响。"]}
- {lo: 16, hi: 20, cols: ["该神器中寄宿着一个与你敌对的无形生命力量。每当你以动作使用一项神器词条时，有50%的几率该生命力量会试图离开神器进入你的身体。如果你未能通过20的魅力豁免，它将成功入侵，你将变成由DM控制的NPC，直到入侵的生命力量被诸如驱逐善恶法术等魔法力量所放逐。"]}
- {lo: 21, hi: 25, cols: ["在神器周围10尺范围变为死域，其内的挑战等级为0的生物与非生物的植物的生命值自动降为0。"]}
- {lo: 26, hi: 30, cols: ["该神器中关押着一只史拉亡蟾（详见《怪物图鉴》）。每当你以动作使用某项神器属性时，该史拉亡蟾有10%的几率成功逃跑。他将出现在你的15尺范围内时，并立即对你发动攻击。"]}
- {lo: 31, hi: 35, cols: ["与神器同调期间，某个特定生物类型（类人生物除外）的生物会始终与你敌对，具体哪一个类型则由DM作出选择。"]}
- {lo: 36, hi: 40, cols: ["在神器周围10尺范围内的魔法药水将被该神器所弱化，并失去其魔法效应化为非魔法物品。"]}
- {lo: 41, hi: 45, cols: ["在神器周围10尺范围内的魔法卷轴将被该神器所弱化，并失去其魔法效应化为非魔法物品。"]}
- {lo: 46, hi: 50, cols: ["当你以动作使用某项神器属性时，你必须先以附赠动作从某个生物上取血。该附赠动作的目标可以是你自身，也可以是触及范围内任何自愿或处于失能状态的其他人。该附赠动作必须使用一把穿刺或劈砍近战武器，而其目标将受1d4的相应类型伤害。"]}
- {lo: 51, hi: 60, cols: ["与神器完成同调时，你立刻获得一项长期性的疯狂效应（见长期性疯狂章'运作游戏'）。"]}
- {lo: 61, hi: 65, cols: ["与神器完成同调时，你立刻受到4d10点心灵伤害。"]}
- {lo: 66, hi: 70, cols: ["与神器完成同调时，你立刻受到8d10点心灵伤害。"]}
- {lo: 71, hi: 75, cols: ["在你完成与神器的同调前，必须先杀死一个与你相同阵营的生物。"]}
- {lo: 76, hi: 80, cols: ["与神器完成同调时，你的一项随机属性值降低2。法术高等复原术greater restoration可以使属性值的变化得以恢复。"]}
- {lo: 81, hi: 85, cols: ["每次与神器完成同调时，你的年龄都将增加3d10岁。你必须成功通过一次DC 10的体质豁免，否则将因此死亡。如果你以这种方式死去，则会立即转变为一只由DM控制的尸妖wight（详见《怪物图鉴》），并立誓守护该神器。"]}
- {lo: 86, hi: 90, cols: ["与神器同调期间，你失去说话的能力。"]}
- {lo: 91, hi: 95, cols: ["与神器同调期间，你将具有对所有伤害类型的易伤。"]}
- {lo: 96, hi: 100, cols: ["当你与神器完成同调时，有10%的几率引起一位神灵的注意。该神灵将委派一名化身前来从你手中抢夺该神器。该化身拥有与其创造者同样的阵营，其具体数值可以参考生物至高天（详见《怪物图鉴》）。该化身会在夺得神器之后自行消失。"]}

