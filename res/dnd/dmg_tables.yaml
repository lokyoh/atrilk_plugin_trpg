- {lo: 2, hi: 2, cols: ["听力与正常视觉60尺"]}
- {lo: 3, hi: 3, cols: ["听力与正常视觉120尺"]}
- {lo: 4, hi: 4, cols: ["听力与黑暗视觉120尺"]}

