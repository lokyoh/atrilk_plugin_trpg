# 《城主指南 (2024)》第三章「怪群」明文数值（参考 md L3572-3654）
#
# 两张表 + 一组说明，数值一律从这里取，别写回 .py（有测试拦）：
#   resolution —— 「怪群结算」20 行：所需骰值（普通 / 具有优势 / 具有劣势）
#                 × 4/5/6/8/10 个一组各成功几只。
#   areas      —— 「效应区域内的目标」12 行：锥状 / 立方 / 圆形 / 线状 → 目标数。
#   groups     —— 结算表表头的五个组大小，程序从它取，别另存一份。
#   notes      —— 小贴士、三步法、原文范例与区域修正。
#
# ⚠️ 口径 2024：这不是 2014「每 X 次攻击命中一次」那张表。原文给的是
#    「一组怪里成功几只」的分数；非表头数量按比例外推，原文 L3654 自己就
#    示范了「12 × 1/6 = 2」，不是项目臆造。
# ⚠️ 原文表格里的「—」在这里记 null：该列这一行**没有对应骰值**，不是 0。
#    劣势列最高只到 16–17；所需骰值 18~20 且全体劣势时原文没有行，
#    程序返回「表里没有」而不是偷偷钳到 17（校验器不静默修补）。
# ⚠️ 命中数 0 是原文数值（所需骰值 19/20 时 4~8 只一组均为 0），
#    别当成缺数据补成 1。

