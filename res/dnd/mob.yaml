notes:
- key: tips
  title: 小贴士
  text: "伤害用怪物数据卡的**平均伤害**；一次攻击把怪打到残血可视作它退场；把大量同类怪分成 5~8 只一组，轮流插在角色回合之间，组数不要多于角色人数。"
- key: steps
  title: 结算三步
  text: "① 所需骰值 = 目标数值 − 怪物加值（攻击看 AC 与攻击加值，豁免看 DC 与豁免调整值）；② 全体有优势/劣势就查对应列，否则查普通列；③ 横向读出一个能轻松套用到这组怪的分数，按比例算出成功几只。"
- key: example
  title: 原文范例
  text: "8 只丧尸（攻击加值 +3）打 AC18 的战士：所需骰值 15 → 8 个一组 2/8 → 2 只命中，按丧尸均值 4 点共 8 点伤害（L3650）。12 只丧尸对火球豁免：所需骰值 18 → 6 个一组 1/6 → 12 × 1/6 = 2 只通过（L3654）。"
- key: area_mod
  title: 区域修正
  text: "目标很分散取 -1d3，挤在一起取 +1d3，且不能超过区域内实际生物数。DM 判断优先，倾向影响更多目标完全允许（L3624-3626）。圆形列同时用于柱状、光环（用光环尺寸代替半径）与球状（L3644）。"
- key: scope
  title: 边界
  text: "系统只给「几只成功」与平均伤害的乘积建议，**不自动扣血、不写战场状态**：命中与伤害仍由 DM 用 attack / heal 结算，并把结果显式写进叙述（DM 回执只有 DM 看得到）。"
