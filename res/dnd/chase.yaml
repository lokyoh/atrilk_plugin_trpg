# 《城主指南 (2024)》第三章「追逐」明文数值（参考 md L1787-1884）
#
# 一张分段表装下疾走 / 逃脱因素 / 两张 1d12 复杂状况表 / 规则说明。
# 数值一律从这里取，别写回 .py（有测试拦）。
#
# ⚠️ 边界：1d12 由系统掷；复杂状况里要求的**豁免、伤害、状态**由 DM 用
#    check / attack / update_character 裁定——追逐状态里没有 HP / AC，
#    不为了「自动化」再造一套战斗系统。text 保留原文供 DM 直接读。
# ⚠️ 原文的距离是「每对猎物 ↔ 猎手」分别跟踪，分头行动时各算各的。
#    本实现按项目尺度简化成**一条群体距离 + 一名领头追击者**，
#    要跑分组追逐就开第二场（见 core/dnd/chase.py 的文档）。

dash:
- base: 3
  minimum: 1
  extra_save_dc: 10
  exhaustion_exit: 5
  note: 可疾走 3+体质调整值（至少 1）次；额外疾走在自己回合结束时过 DC10 体质豁免，失败 +1 力竭；力竭 5 级被迫退出；短/长休清除追逐期间累积的力竭。

escape_factors:
- factor: 许多可以躲藏的东西
  effect: 优势
- factor: 一个非常拥挤的区域
  effect: 优势
- factor: 几乎没有可躲藏的地方
  effect: 劣势
- factor: 一个不拥挤的区域
  effect: 劣势

city_complications:
- roll: 1
  dc: 10
  save: 敏捷
  text: 一辆二轮货车或其他大型障碍挡住了你的去路。进行一次 DC 10 的敏捷豁免检定来通过障碍。如果豁免失败，这个障碍对你而言视为 10 尺的困难地形。
- roll: 2
  dc: 10
  save: 力量/敏捷/魅力（DM 选）
  text: 人群挡住了你的去路。进行一次 DC 10 的力量、敏捷或魅力豁免检定（由你选择）来尝试穿越人群。如果豁免失败，人群对你而言视为 10 尺的困难地形。
- roll: 3
  dc: 10
  save: 敏捷/智力（DM 选）
  text: 一个由木桶、箱子或类似障碍物组成的迷宫挡住了你的去路。进行一次 DC 10 敏捷或智力豁免检定（由你选择）来穿越迷宫。如果豁免失败，这段迷宫对你而言视为 10 尺的困难地形。
- roll: 4
  dc: 10
  save: 敏捷
  text: 地面因为雨水、打翻的灯油或其他液体变得湿滑。进行一次 DC 10 的敏捷豁免检定。如果豁免失败，你将获得倒地状态。
- roll: 5
  dc: 15
  save: 力量/敏捷/魅力（DM 选）
  damage: 2d4 钝击
  text: 你遭遇了一场正在进行的打斗。进行一次 DC 15 的力量、敏捷或魅力豁免检定（由你选择）以不受阻碍地通过打斗者。豁免失败时，你受到 2d4 钝击伤害，且打斗者对你而言视为 10 尺的困难地形。
- roll: 6
  dc: 10
  save: 敏捷
  damage: 1d4 钝击
  text: 你必须急转弯以避免撞上一个无法通过的东西。进行一次 DC 10 的敏捷豁免检定来迅速拐弯。如果豁免失败，你会撞上这个坚硬的东西并受到 1d4 点钝击伤害。
- roll: 7-12
  text: 没有发生任何复杂状况。

wilderness_complications:
- roll: 1
  text: 你穿过一个昆虫集群（参见怪物图鉴，由 DM 选择最合理的昆虫类型）。该集群使用它的一个动作，以你为目标。
- roll: 2
  dc: 10
  save: 力量/敏捷（DM 选）
  text: 一条溪流或沟壑挡住了你的去路。进行一次 DC 10 力量或敏捷豁免检定（由你选择）以跨越障碍。豁免失败时，该障碍对你而言视为 10 尺的困难地形。
- roll: 3
  dc: 10
  save: 体质
  text: 进行一次 DC 10 体质豁免检定。如果豁免失败，吹拂而来的沙子、泥土、灰烬、雪或者花粉会导致你陷入目盲状态，直到你的回合结束。当你因这种方式目盲时，你的速度减半。
- roll: 4
  dc: 10
  save: 敏捷
  text: 地面突然开始向下倾斜，使你措手不及。进行一次 DC 10 的敏捷豁免检定以处理这一状况。如果豁免失败，你会从 10 尺高处坠落。
- roll: 5
  dc: 15
  save: 敏捷（或消耗 10 尺移动）
  damage: 1d10 挥砍
  text: 你的路径带你靠近一片刃藤。进行一次 DC 15 的敏捷豁免检定或消耗 10 尺移动（由你选择）来避开剃刀藤。如果豁免失败，你会受到 1d10 的挥砍伤害。
- roll: 6
  dc: 10
  save: 感知/魅力（DM 选）
  text: 这个区域的原生生物注意到了你（由 DM 决定一个适合该地形的生物）。进行一次 DC 10 的感知或魅力豁免检定（由你决定）。如果豁免失败，该生物会加入到追逐中，将你视为其追捕的目标。
- roll: 7-12
  text: 没有发生任何复杂状况。

rules:
- key: 开始
  text: 至少一个被追捕者 + 至少一个追击者；未掷先攻的此时补掷。先定两者起始距离，每回合跟进变化；离猎物最近的猎手是所有猎手的头领，头领会随距离变化而变。
- key: 疾走
  text: 追逐者都想每轮疾走。可疾走 3+体质调整值（至少 1）次；超出后每多一次，在自己回合结束时过 DC 10 体质豁免，失败获得 1 级力竭；力竭 5 级被迫退出追逐。短休或长休清除追逐期间累积的力竭。
- key: 攻击
  text: 可以对射程内的其他生物攻击和施法；停下来施法/攻击就有可能追丢。参与者之间通常不能互相借机攻击（假定同向移动），但未参与追逐的生物仍可对他们发动借机攻击。
- key: 结束
  text: 一方停下、每位被追捕者都逃离、或追击者足够接近目标以捕获它，追逐即结束。
- key: 逃脱
  text: 每轮先攻归 0 且每位参与者都行动过之后，每位被追捕者各掷一次敏捷（隐匿）。从未离开领头追击者视线 → 自动失败；否则与追击者中最高的被动察觉比较，检定总和**大于**该值即逃脱。逃脱不一定代表跑赢，也可能是躲进人群或拐角。
- key: 意外
  text: 每位参与者在自己回合结束时掷 1d12 查城市 / 荒野复杂状况表（1–6 有状况，7–12 没有）。状况影响**先攻序列里的下一位参与者**，而不是掷骰的这位。
