# 《城主指南 (2024)》超自然赠礼与心慌/惊恐规则
#
# 赠礼由 参考/5etools-cn-cn2.0/data/rewards.json 的 XDMG 条目机械转录；
# 恐惧 / 惊恐两条来自 book/book-dmg.json「地下城主工坊 / 冒险选项 / 心慌与惊恐」。
# ⚠️ 2024 版把恐惧的 DC 交给 DM 按情况设定，没有固定 10/15/20；
#    「精神压力 1d6/3d6/9d6」是 2014 版规则，2024 中文包无此条目。
# ⚠️ 只读原文，系统不自动挂状态；恐慌 / 疯狂由 DM 裁定后自行叙述。

gifts:
- {cn: "秘学护咒", kind: "护咒", en: "Arcane Study Charm", page: 336, text: "当你在据点内进行一次长休后，你获得一个魔法护咒（见第三章中'超自然赠礼'一节），此护咒持续7天或持续至你将其使用为止。此护咒允许你施展一次鉴定术 ，无需消耗法术位也无需准备施法材料。你无法在已拥有该护咒时再次获得它。"}
- {cn: "健康祝福", kind: "祝福", en: "Blessing of Health", page: 98, text: "你的体质值提升2，至多提升至22。"}
- {cn: "魔抗祝福", kind: "祝福", en: "Blessing of Magic Resistance", page: 98, text: "你对抗法术和其他魔法效应时进行的豁免检定具有优势。"}
- {cn: "护佑祝福", kind: "祝福", en: "Blessing of Protection", page: 99, text: "你的AC和豁免检定获得+1加值。"}
- {cn: "理解祝福", kind: "祝福", en: "Blessing of Understanding", page: 99, text: "你的感知值提升2，至多提升至22。"}
- {cn: "瓦尔哈拉祝福", kind: "祝福", en: "Blessing of Valhalla", page: 99, text: "该祝福使你获得召唤精魂武者的力量，其效应等同于你吹响一件瓦尔哈拉号角，白银。你在使用一次该祝福后，必须经过7日之后才能再次启用其效应。"}
- {cn: "神兵祝福", kind: "祝福", en: "Blessing of Weapon Enhancement", page: 99, text: "你所拥有的一把非魔法武器在你持用时变为一把+1 武器。"}
- {cn: "愈合祝福", kind: "祝福", en: "Blessing of Wound Closure", page: 99, text: "该祝福为你带来愈合护符所提供的增益。"}
- {cn: "兽群咒唤护咒", kind: "护咒", en: "Charm of Animal Conjuring", page: 99, text: "该护咒可以让你施展咒唤兽群。使用三次后，该护咒将随即从你身上消失。"}
- {cn: "黑暗视觉护咒", kind: "护咒", en: "Charm of Darkvision", page: 99, text: "该护咒可以让你施展黑暗视觉。使用三次后，该护咒将随即从你身上消失。"}
- {cn: "羽落护咒", kind: "护咒", en: "Charm of Feather Falling", page: 99, text: "该护咒可以让你获得羽落戒指的增益。该增益持续10日，随后该护符便会从你身上消失。"}
- {cn: "英勇护咒", kind: "护咒", en: "Charm of Heroism", page: 99, text: "该护咒可以让你用一个魔法动作获得一瓶英勇药水的增益。使用一次该增益后，该护咒便会从你身上消失。"}
- {cn: "复原护咒", kind: "护咒", en: "Charm of Restoration", page: 99, text: "该护咒有3发充能。你可以消耗定量的充能来施展下列法术：次等复原术（1充能），高等复原术（2充能）。所有充能耗尽后，该护咒便会从你身上消失。"}
- {cn: "杀戮护咒", kind: "护咒", en: "Charm of the Slayer", page: 99, text: "你拥有的一把武器在随后的9日里变为一把屠龙者或巨人屠杀者（由DM选择）。时效过后，该武器恢复原样而该护咒也随之从你身上消失。"}
- {cn: "活力护咒", kind: "护咒", en: "Charm of Vitality", page: 99, text: "该护咒可以让你用一个魔法动作获得一剂活力药水的增益。使用一次该增益后，该护咒便会从你身上消失。"}
- {cn: "天文护咒", kind: "护咒", en: "Observatory Charm", page: 343, text: "你可以用天文台观察到荒宇和星光位面的遥远角落。当你在天文台内完成一次长休后，你获得一个魔法护咒（见第三章中'超自然赠礼'一节），此护咒持续7天或持续至你将其使用为止。此护咒允许你施展一次异界探知，无需消耗法术位。你无法在已拥有该护咒时再次获得它。"}
- {cn: "圣物护咒", kind: "护咒", en: "Reliquary Charm", page: 344, text: "当你在据点内完成一次长休后，你获得一个魔法护咒（见第三章中'超自然赠礼'一节），该护咒持续7天或持续至你将其使用为止。该护咒允许你施展一次高等复原术 ，无需消耗法术位也无需材料成分。你无法在已拥有该护咒时再次获得它。"}
- {cn: "圣坛护咒", kind: "护咒", en: "Sanctuary Charm", page: 345, text: "当你在据点内完成一次长休后，你获得一个魔法护咒见第三章中'超自然赠礼'一节），该护咒持续7天或持续至你将其使用为止。该护咒允许你施展一次治愈真言，无需消耗法术位。你无法在已拥有该护咒时再次获得它。"}
- {cn: "圣所护咒", kind: "护咒", en: "Sanctum Charm", page: 346, text: "当你在据点内完成一次长休后，你获得一个魔法 护咒（见第三章中' 超自然赠礼'一节），该护咒持续7天或持续至你将其使用为止。该护咒允许你施展一次医疗术，无需消耗法术位。你无法在已拥有该护咒时再次获得它。"}

rules:
- {cn: "恐惧", text: "冒险者们面对自己无法克服的威胁时，你可以要求他们进行一次感知豁免，具体DC可根据情况进行设定。豁免失败的角色将受恐慌1分钟。该角色可以在其自己的每回合结束时重复一次该豁免，豁免成功则终止其自己身上的相应效应。"}
- {cn: "惊恐", text: "惊恐包含的不仅是简单的恐慌，还包括强烈的厌恶和痛苦。它通常是冒险者们看到那些与现存合理的普世常识相违背的事物时，作出的反应。 此时，你可以要求角色们进行一次魅力检定来抵抗惊恐，并根据惊恐的严重程度来设置DC。豁免失败时，你可以为该角色选择或随机指定获得一项短暂性或长期性疯狂（如第8章'运作游戏'所述）。"}
- {cn: "受训升级", text: "作为一种变体规则，您可以要求角色在升级获得提升前必须在休整期花时间进行培训或学习。选用该选项后，一旦角色拥有足够升级的经验值，他或她必须经历数天的训练才能获取新等级相关的所有职业特性。 所需训练时间取决于要获得的等级，如受训升级表所示。训练花费为全部训练时间的费用总和。"}
