# 职业等级特性表（PHB 2024 第三章，12 职业 × 1~20 级）
# 来源：5etools-cn-cn2.0 class-*.json 的 classFeature（classSource == XPHB）。
# 只收录**职业表**里的特性（子职特性在 subclasses.yaml）；按 level 升序。
# grants 标记的两个特性会进战斗结算：extra_attack（每次攻击动作的攻击次数）、
# action_surge（动作如潮的次数，短休恢复）。代码按标记算，不按中文名认。
- profession: barbarian
  level: 1
  name: 无甲防御
  text: 你未着装任何护甲期间，你的基础护甲等级等于10+你的敏捷调整值+你的体质调整值。你可以使用盾牌而仍然从此特性获益。
- profession: barbarian
  level: 1
  name: 武器精通
  text: 你对武器的训练使你获得精通词条：包括两种自选的简易或军用近战武器的精通属性，例如巨斧和手斧。当你完成一次长休后，你可以重新演练武器技巧，来改变你所选择的其中一个武器类型。 当你获得特定的野蛮人等级时，你还可以使用更多种类武器的精通词条，具体数据见野蛮人特性表中"武器精通"一栏。
- profession: barbarian
  level: 1
  name: 狂暴
  text: 你可以将名为狂暴的原初之力赋予己身，为你带来超越常规的伟力和韧性。未着装重甲时，你可以以一个附赠动作进入狂暴。 你可以进入狂暴的次数见野蛮人特性表中"狂暴次数"一栏。当你完成一次短休时，你重获一次已使用的狂暴次数；当你完成一次长休时，你重获所有已使用的狂暴次数。 你的狂暴激活期间，你将遵循以下这些规则： 伤害抗性： 你具有钝击，穿刺和挥砍伤害的抗性。 狂暴伤害： 当你使用力量发动一次攻击并对目标造成伤害时（无论这是一次武器攻击还是一次徒手打击），你的伤害掷骰获得额外加值，这…
- profession: barbarian
  level: 2
  name: 危机感应
  text: 当非常事态发生时，一种不可思议的感觉降临你的心头，指引你更好的躲避危机。只要你未陷入失能状态，你的敏捷豁免检定就具有优势。
- profession: barbarian
  level: 2
  name: 鲁莽攻击
  text: 你可以抛弃一切对防御的顾虑来发起更加狂乱的攻击。你在自己回合中进行第一次攻击检定时，可以不顾一切地发起攻击。若如此做，直到你的下个回合开始时，你使用力量进行的攻击检定具有优势，但在此期间所有以你为目标的攻击检定也具有优势。
- profession: barbarian
  level: 3
  name: 原初学识
  text: 除了 1 级选择的技能以外，你可以从野蛮人技能表中额外获得一个技能的熟练。 此外，你的狂暴激活期间，你可以在尝试完成特定的事项时与原初之力相连。每当你使用以下技能进行一次属性检定时，你可以使用力量进行检定而非通常使用的其他属性：特技，威吓，察觉，隐匿或求生。当你使用这项能力时，你的力量值代表着一种环绕你身的原初之力，强化了你的灵敏度、气质和感知力。
- profession: barbarian
  level: 3
  name: 野蛮人子职
  text: 你选择获得一项野蛮人子职。子职是一种特化，在特定的野蛮人等级给予你对应的独特能力。此后你将获得你所选的子职所有能力......只要其所需等级等于或低于你的野蛮人等级。
- profession: barbarian
  level: 4
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。如野蛮人特性表所示，你还会在第8，第12，第16级时再次获得本特性。
- profession: barbarian
  level: 5
  name: 快速移动
  text: 当你未着装重甲时，你的速度增加 10 尺。
- profession: barbarian
  level: 5
  name: 额外攻击
  text: 当你在自己的回合执行攻击动作时，你可以发动两次攻击而非一次。
  extra_attack: 2
- profession: barbarian
  level: 6
  name: 子职特性
  text: 你获得了来自你野蛮人子职的特性。
- profession: barbarian
  level: 7
  name: 莽驰
  text: 作为你进入狂暴的附赠动作的一部分，你可以移动至多等于你速度一半的距离。
- profession: barbarian
  level: 7
  name: 野性直觉
  text: 你的直觉变得格外敏锐。你获得优势（仅限先攻检定）。
- profession: barbarian
  level: 8
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: barbarian
  level: 9
  name: 凶蛮打击
  text: 如果你使用了鲁莽攻击，你可以放弃本回合你选择的一次基于力量的攻击检定具有的所有优势（（不可选择具有劣势的攻击检定）。被选择的攻击检定命中时，目标将受到1d10的额外伤害，伤害类型与此次攻击所使用的武器或徒手打击造成的伤害类型相同，并且你可以造成一种你所选的凶蛮打击效应。你具有以下效应选项： 巨力猛击： 目标被你直线推离 15 尺距离。随后你可以立刻向该目标移动至多等于你速度一半的距离，并且不会引发借机攻击。 断筋猛击： 直至你的下个回合开始，目标的速度降低 15 尺。一个生…
- profession: barbarian
  level: 10
  name: 子职特性
  text: 你获得了来自你野蛮人子职的特性。
- profession: barbarian
  level: 11
  name: 坚韧狂暴
  text: 你狂暴的力量让你即使身受重伤也能持续战斗。你的狂暴激活期间，如果你的生命值降至 0 且并未立即死亡，则你可以进行一次10的体质豁免。成功则你的生命值将变为你野蛮人等级的两倍。 第一次使用此特性后，每当你再次使用此特性时其体质豁免DC提高 5。当你完成一次短或长休后其DC重置为 10。
- profession: barbarian
  level: 12
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: barbarian
  level: 13
  name: 强化凶蛮打击
  text: 你训练出了更多种残暴的攻击方式。将以下效应加到你的凶蛮打击选项中： 震撼猛击： 目标进行的下一次豁免检定具有劣势，并且目标直到你的下个回合开始时都不能发动借机攻击。 破势猛击： 直到你的下个回合开始时，下一次由其他生物对目标进行的攻击检定获得+5加值。一次攻击检定只能从一次破势猛击中获得加值。
- profession: barbarian
  level: 14
  name: 子职特性
  text: 你获得了来自你野蛮人子职的特性。
- profession: barbarian
  level: 15
  name: 持久狂暴
  text: 当你投掷先攻时，你可以重获所有已使用的狂暴次数。你以此法重获狂暴次数后，直到完成一次长休时，你都不能再这么做。 此外，你的狂暴是如此凶悍，现在你的狂暴可以持续 10 分钟，而你无需在每一轮中做任何事情来延长它。除非你处于昏迷状态（不仅仅是失能状态）或穿戴重甲时，你的狂暴会提前结束。
- profession: barbarian
  level: 16
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: barbarian
  level: 17
  name: 强化凶蛮打击
  text: 你凶蛮打击的额外伤害提升至2d10。此外，每当你使用凶蛮打击特性时，你可以同时使用两种不同的凶蛮打击效应。
- profession: barbarian
  level: 18
  name: 不屈勇武
  text: 如果你进行的力量检定或力量豁免检定的总值低于你的力量属性值，你可以使用你的力量属性值替代检定总值。
- profession: barbarian
  level: 19
  name: 传奇恩惠
  text: 你获得了一个传奇恩惠专长，或者你选择另一个符合条件的专长。推荐选择无敌攻势之恩惠。
- profession: barbarian
  level: 20
  name: 原初斗士
  text: 你本身便是原初之力的象征。你的力量和体质各提升 4，你这两项属性的上限变为 25。
- profession: bard
  level: 1
  name: 吟游诗人激励
  text: 你可以用语言，音乐或舞蹈的形式对他人进行超自然的激励。这种激励的表现形式为数颗d6骰，这些骰子被称为诗人激励骰。 使用诗人激励： 以一个附赠动作，你可以激励位于你 60 尺内的另一名能听见或看见你的生物。那名生物获得一枚你的诗人激励骰。一个生物同时只能拥有一枚诗人激励骰。 在接下来的 1 小时内，当那名生物在一次D20 检定中失败时，那名生物可以投掷诗人激励骰并将掷骰结果附加到该次d20中，这可能将失败变为成功。诗人激励骰将在投掷时被消耗。 使用次数： 你可以授予诗人激励骰…
- profession: bard
  level: 1
  name: 施法
  text: 你在你的吟游艺术中学会了如何施展法术。参见第七章有关施法的规则。下述信息将详述如何将这些规则应用于吟游诗人法术，吟游诗人法术详见本章后文职业描述中的吟游诗人法术列表。 戏法： 你已知2个你在吟游诗人法术列表中选择的吟游诗人戏法。推荐选择舞光术和恶言相加。 每当你获得一个吟游诗人等级时，你都能将通过此特性已知的其中一个戏法替换为另一个你从吟游诗人法术列表中选择的吟游诗人戏法。 当你的吟游诗人等级达到4级和10级时，你都能习得另一个你从吟游诗人法术列表中选择的吟游诗人戏法，如吟…
- profession: bard
  level: 2
  name: 万事通
  text: 你可以将你熟练加值的一半（向下取整）添加到任何你不具备其技能熟练并无法通过其他方式应用熟练加值的属性检定中。 例如，如果你要进行力量（运动）检定，且不具有运动熟练，则你可以将熟练加值的一半添加到检定中。 你扮演的吟游诗人在吟诵古代英雄壮举时敲鼓相伴吗？他是拨动鲁特琴伴着低唱浪漫的旋律？还是演绎激昂的咏叹调？是朗诵经典悲剧中最震撼人心的独白？还是说他会在战斗中以民俗舞蹈的节奏协调战友的移动？又或者他会创作俏皮的打油诗？ 当你扮演吟游诗人时，你需要考虑你钟意的艺术表演风格、你可…
- profession: bard
  level: 2
  name: 专精
  text: 你获得两项由你选择的你已熟练的技能的专精。推荐选择表演和游说，如果你具有这两项技能的熟练。 当你的吟游诗人等级为9级时，你额外再获得两项由你选择的你已熟练的技能的专精。
- profession: bard
  level: 3
  name: 吟游诗人子职
  text: 你选择获得一项吟游诗人子职。子职是一种特化，在特定的吟游诗人等级给予你对应的独特能力。此后你将获得你所选的子职所有能力——只要其所需等级等于或低于你的吟游诗人等级。
- profession: bard
  level: 4
  name: 属性值提升
  text: 你获得属性值提升专长或其他你满足条件的专长。如吟游诗人特性表所示，你还会在第8，第12，第16级时再次获得本特性。
- profession: bard
  level: 5
  name: 激励之源
  text: 现在，当你完成一次短或长休时，你重获所有被消耗的诗人激励使用次数。 此外，你可以消耗一个法术位（无需动作）来重获一次被消耗的诗人激励使用次数。
- profession: bard
  level: 6
  name: 子职特性
  text: 你从你的吟游诗人子职中获得一个特性。
- profession: bard
  level: 7
  name: 反迷惑
  text: 你可以用带有力量的音符或话语来破坏影响心灵的效应。若你或位于你30尺内的一名生物在对抗施加魅惑或恐慌状态的效应的豁免检定中失败，你能以一个反应重骰这次豁免，这次重骰具有优势。
- profession: bard
  level: 8
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: bard
  level: 9
  name: 专精
  text: 你获得两项由你选择的你已熟练的技能的专精。
- profession: bard
  level: 10
  name: 魔法奥秘
  text: 你从各种魔法传统中学到了奥秘。每当你达到吟游诗人等级（包括此等级）且吟游诗人特性表格中的准备法术数值增加时，你可以从吟游诗人、牧师、德鲁伊和法师的法术列表中选择任何新的准备法术，且所选法术对你而言视为吟游诗人法术（参见职业章节中的法术列表）。此外，每当你替换为此职业准备的法术时，你可以从这些列表中选择一个法术进行替换。
- profession: bard
  level: 12
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: bard
  level: 14
  name: 子职特性
  text: 你从你的吟游诗人子职中获得一个特性。
- profession: bard
  level: 16
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: bard
  level: 18
  name: 先发激励
  text: 当你投掷先攻时，若你的诗人激励使用次数不足两次，你重获被消耗的诗人激励使用次数到两次为止。
- profession: bard
  level: 19
  name: 传奇恩惠
  text: 你获得一项传奇恩惠专长或其他一项你选择的适用的专长。推荐选择法术法术溯回之恩惠。
- profession: bard
  level: 20
  name: 创生圣言
  text: 你掌握了创生圣言的其中两字："生"与"死"。因此，你总是准备了法术律令医疗和律令死亡。当你施展这两道法术时，你可以选择第二个生物作为目标，那名生物必须位于第一个目标 10 尺内。
- profession: cleric
  level: 1
  name: 保护者
  text: 为战斗做足训练，你获得军用武器熟练与重甲受训。
- profession: cleric
  level: 1
  name: 圣职
  text: 你将自己投身于所选择的以下一项神圣的角色之中：
- profession: cleric
  level: 1
  name: 奇术使
  text: 你从牧师法术列表中额外学会一道戏法。此外，你与神性的神秘链接使你在智力（奥秘和宗教）检定中获得加值。加值等于你的感知调整值（最少 +1）。
- profession: cleric
  level: 1
  name: 施法
  text: 你通过祈祷，冥想与奉献习得如何施法。参见第七章有关施法的规则。下述信息将详述如何将这些规则应用于牧师法术，牧师法术详见本章后文职业描述中的牧师法术列表。 戏法： 你已知牧师法术列表中3个你选择的戏法。推荐选择神导术，圣火术和奇术。 当你获得牧师等级时，你可以将一道已知戏法用另一道牧师法术列表中的戏法替换。 当你的牧师等级达到4级和10级时，你都能习得另一道你从牧师法术列表中选择的牧师戏法，如牧师特性表中戏法一列所示。 法术位： 牧师特性表显示了你可用于施放1环及以上法术的法…
- profession: cleric
  level: 2
  name: 引导神力
  text: 你能从外层位面引导神圣能量，并用其引动魔法效应。你起始时具有两种选项：神圣火花与驱散亡灵，其效果如下所示。每当你使用你的引导神力时，你选择要创造哪种效应。你会在更高的牧师等级获得更多选项。 你可以使用引导神力两次，你在完成一次短休时恢复一次使用次数，而在完成一次长休时重获所有已使用的次数。你在达到特定的牧师等级时获得额外的使用次数，具体见牧师特性表中引导神力一栏。 如果某个引导神力效应需要目标进行豁免，则其豁免DC等于本职业的施法特性中的法术豁免DC。
- profession: cleric
  level: 2
  name: 神圣火花
  text: 以一个魔法动作，你将你的圣徽指向30尺内一个你可见的其他生物，并将神圣能量凝聚于该生物。投掷1d8加上你的感知调整值，你为该生物恢复该数值的生命值或迫使其进行一次体质豁免，失败则受到等同该数值的暗蚀或光耀伤害（由你选择），成功则伤害减半（向下取整）。 神圣火花在以下牧师等级获得额外的d8骰：7级（2d8），13级（3d8）以及18级（4d8）。
- profession: cleric
  level: 2
  name: 驱散亡灵
  text: 以一个魔法动作，你展现圣徽，斥退诸亡灵生物。你30尺内每个由你选择的亡灵都必须进行一次感知豁免，失败则陷入恐慌和失能状态，持续一分钟。在这段持续时间内，被驱散的生物会尽可能远离你。此效应在其受到伤害时提前结束，你陷入失能状态或是死亡也会结束此效应。
- profession: cleric
  level: 3
  name: 牧师子职
  text: 你获得你所选的一个牧师子职。子职业是一种特化，可以在特定的牧师等级授予你对应的特殊能力。此后你将获得你所选的子职所有能力......只要其所需等级等于或低于你的牧师等级。
- profession: cleric
  level: 4
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。你在牧师等级第8，第12，第16级时会再次获得本特性。
- profession: cleric
  level: 5
  name: 灼净亡灵
  text: 每当你使用驱散亡灵时，你都可以投掷等于你感知调整值枚d8（最少1d8)，而每个在对抗驱散亡灵的豁免中失败的亡灵都将受到等同于骰值之和的光耀伤害。此伤害不会终止驱散效应。
- profession: cleric
  level: 6
  name: 子职特性
  text: 你获得了来自你牧师子职的特性。
- profession: cleric
  level: 7
  name: 受祝击
  text: 神圣的力量在战斗中注入你。你从以下特性中选择其一获得（如果你因旧书中的牧师子职而再次获得了下列选项之一，则你也只能使用你在此特性中所选的那个选项）。
- profession: cleric
  level: 7
  name: 强力施法
  text: 你将你的感知调整值加到你用任何牧师戏法造成的伤害上。
- profession: cleric
  level: 7
  name: 神圣打击
  text: 每个你的回合一次，当你以一次使用武器的攻击命中了一个生物时，你对其造成额外1d8光耀或暗蚀伤害（由你选择）。
- profession: cleric
  level: 8
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: cleric
  level: 10
  name: 神圣干预
  text: 你能呼唤你所信奉的神祇或神系来代你降下干预。以一个魔法动作，你选择一道 5 环或更低的牧师法术（施法时间不能为 1 反应），并将该法术作为执行此动作的一部分施展，无需消耗法术位也无需对应的施法材料。直到你完成一次长休前，你都无法再次使用此特性。
- profession: cleric
  level: 12
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: cleric
  level: 14
  name: 精通受祝击
  text: 你所选择的受祝击变得更加强大。 神圣打击： 神圣打击的额外伤害提升至2d8。 强力施法： 当你施展一道牧师戏法并用它对一个生物造成伤害时，你可以为你自己或你 60 尺内的另一个生物注入活力，使其获得等同于你感知调整值两倍的临时生命值。
- profession: cleric
  level: 16
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: cleric
  level: 17
  name: 子职特性
  text: 你获得了来自你牧师子职的特性。
- profession: cleric
  level: 19
  name: 传奇恩惠
  text: 你获得一个传奇恩惠专长或另一个你所选择符合条件的专长。推荐选择扭曲命运之恩惠。
- profession: cleric
  level: 20
  name: 进阶神圣干预
  text: 你能够呼唤更加强大的神圣干预。当你使用神圣干预特性时，你可以在选择法术时选择祈愿术。如果你这样做，你只有在完成2d4次长休后才能再次使用神圣干预。
- profession: druid
  level: 1
  name: 卫士
  text: 你受到了战斗的训练，获得军用武器熟练和中甲熟练。
- profession: druid
  level: 1
  name: 原初职能
  text: 你将自己投身于所选择的以下一项神圣的角色之中：
- profession: druid
  level: 1
  name: 德鲁伊语
  text: 你学会了德鲁伊语，一门德鲁伊之间的秘密语言。在学会这门古老语言的同时，你也解锁了和动物交谈的魔法：你始终准备动物交谈法术。 你可以使用德鲁伊语来传递隐藏的信息。你和其他知晓这门语言的对象能够自动辨认出信息。其他人需要通过15的智力（调查）检定才能意识到信息的存在，但不借助魔法则无法解读。
- profession: druid
  level: 1
  name: 施法
  text: 你通过研究自然的神秘伟力学会了如何施展法术。参考第七章中的施法规则。下述信息将详述如何将这些规则应用于德鲁伊法术，德鲁伊法术详见本章后文职业描述中的德鲁伊法术列表。 戏法： 你习得2个德鲁伊法术列表中的戏法。推荐选择德鲁伊伎俩和燃火术。 每当你获得一级德鲁伊等级，你都能将通过此特性已知的其中一个戏法替换为另一个德鲁伊法术列表中你所选择的德鲁伊戏法。 当你的德鲁伊等级达到4级和10级时，你都能习得另一个德鲁伊法术列表中你所选择的德鲁伊戏法，如德鲁伊特性表中戏法一栏所示。 法术…
- profession: druid
  level: 1
  name: 术师
  text: 你学会一个额外的德鲁伊法术列表中的戏法。此外，你和自然的神秘连接让你在智力（奥秘或自然）检定上获得加值。加值等于你的感知调整值（最小为1）。
- profession: druid
  level: 2
  name: 荒野伙伴
  text: 你可以召唤出一个动物外形的自然精魂来帮助自己。以一个魔法动作，你可以消耗一个法术位或一次荒野变形次数来施展寻获魔宠法术，无需任何材料成分。 当你以这种方式施展这一法术时，获得的魔宠为妖精Fey，并且它会在你完成一次长休后消失。
- profession: druid
  level: 2
  name: 荒野形态
  text: 大自然的魔力使你得以化形为一只野兽。以一个附赠动作，你变形为一只你已经通过该特性学会的野兽形态（见下文"已知形态"）。你能保持该形态长达你德鲁伊等级一半的小时数，或者直到你再次使用荒野形态，陷入失能，或死亡。你也可以使用一个附赠动作提早结束荒野形态。 使用次数： 你能够使用两次荒野形态。你在完成短休后重获一次已消耗的使用次数，当你完成一次长休后，你重获全部已消耗的使用次数。 你达到特定的德鲁伊等级时会获得额外的使用次数，如德鲁伊表格中荒野形态一栏所示。 已知形态： 你一开始…
- profession: druid
  level: 3
  name: 德鲁伊子职
  text: 你选择获得一项德鲁伊子职。子职是一种特化，在特定的德鲁伊等级给予你对应的独特能力。此后你将获得每一个你所选的子职的能力，只要其所需等级等于或低于你的德鲁伊等级。
- profession: druid
  level: 4
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。你还会在你的德鲁伊等级达到第8、第12、第16级时再次获得本特性。
- profession: druid
  level: 5
  name: 荒野复苏
  text: 每个你的回合内一次，如果你没有荒野变形使用次数，你可以消耗一个法术位（无需动作）让自己获得一次荒野变形次数。 此外，你可以消耗一次荒野变形使用次数（无需动作）来令自己获得一个1环法术位，在你完成一次长休以前，你无法再次这样做。
- profession: druid
  level: 6
  name: 子职特性
  text: 你从你的德鲁伊子职中获得了一个特性。
- profession: druid
  level: 7
  name: 元素之怒
  text: 元素之力在你的身体里流淌。你获得以下一个你选择的特性：
- profession: druid
  level: 7
  name: 原力蛮击
  text: 每个你的回合内一次，当你以一次武器攻击或荒野变形中野兽形态的攻击命中一名生物时，你可以对目标额外造成1d8寒冷、火焰、闪电或雷鸣伤害（由你命中时选择）。
- profession: druid
  level: 7
  name: 强力施法
  text: 你将你的感知调整值加在你的以德鲁伊戏法造成的伤害上。
- profession: druid
  level: 8
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: druid
  level: 10
  name: 子职特性
  text: 你从你的德鲁伊子职中获得了一个特性。
- profession: druid
  level: 12
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: druid
  level: 14
  name: 子职特性
  text: 你从你的德鲁伊子职中获得了一个特性。
- profession: druid
  level: 15
  name: 元素狂怒
  text: 你选择的元素之怒特性变得愈发强大： 强力施法： 当你施展一个施法距离为 10 尺及以上的德鲁伊戏法时，法术施法距离提升 300 尺。 原力蛮击： 原力蛮击的额外伤害提升至2d8。
- profession: druid
  level: 16
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: druid
  level: 18
  name: 兽形施法
  text: 你可以在任何荒野变形下施法。当一个法术需要标有价值的材料成分或需要消耗材料成分时，你无法在荒野变形下施展。
- profession: druid
  level: 19
  name: 传奇恩惠
  text: 你获得一项传奇恩惠专长或其他一项你选择的适用的专长。推荐选择次元旅行之恩惠。
- profession: druid
  level: 20
  name: 大德鲁伊
  text: 自然的活力在你的身上永不凋零，令你获得以下增益： 不凋化形： 当你投掷先攻时，若你没有荒野变形的使用次数，你获得一次荒野形态使用次数。 自然术使： 你可以将荒野变形使用次数转化为法术位（无需任何动作）。选择一定数量的你未使用的荒野变形使用次数，将它们转化为一个法术位，每个使用次数可以转为 2 个法术环阶。比如说，如果你转化两个荒野变形使用次数，你就可以创造出一个 4 环法术位。当你如此做后，你必须在完成一次长休后才能再次使用该特性。 青春永驻： 你行使的原力魔法让你的衰老速…
- profession: fighter
  level: 1
  name: 回气
  text: 你可以利用有限的精力与体力来重整旗鼓。以一个附赠动作，你可以用此法恢复生命值，其总值为1d10 + 你的战士职业等级。 你可以使用此特性两次，并且在完成短休后恢复一次已消耗的使用次数，完成长休后恢复所有已消耗的使用次数。 当你到达特定战士等级时，你获得这项特性的额外使用次数，已列在战士特性表的回气一列。
- profession: fighter
  level: 1
  name: 战斗风格
  text: 不断磨练你的武艺。你获得一项你选择的战斗风格专长。推荐选择防御。 每当你获得战士等级时，你可以将其改为另一个战斗风格专长。
- profession: fighter
  level: 1
  name: 武器精通
  text: 你对武器的训练使你能够运用三种自选的简易或军用的精通词条。每当你完成一次长休时，你可以重新演练武器技巧，来改变你所选择的其中一个武器类型。 当你达到特定的战士等级时，你将获得使用更多种类武器的精通词条的能力，如战士特性表格中的武器精通栏所示。
- profession: fighter
  level: 2
  name: 动作如潮
  text: 你可以在短期内让自己突破身为凡骨的极限。在你的回合中，你可以执行一个额外的动作，但不能是魔法动作。 你使用此特性后，你必须在完成一次短或长休后才能再次使用。第 17 级起，你可以在每次休息之间使用此特性两次，但每回合只能使用一次。
  action_surge: 1
- profession: fighter
  level: 2
  name: 战术思维
  text: 在战场内外，你都能够运用你的战术思维。当你在一次属性检定上失败时，你可以消耗一次回气次数让你更接近成功。你掷1d10并将骰值加入到结果之中，而非恢复生命值。这可能会让结果变为成功。如果检定依旧失败，则不会消耗回气次数。
- profession: fighter
  level: 3
  name: 战士子职
  text: 你选择获得一项战士子职。子职是一种特化，在特定的战士等级给予你对应的独特能力。此后你将获得你所选的子职所有能力——只要其所需等级不超过你的战士等级。
- profession: fighter
  level: 4
  name: 属性值提升
  text: 你获得属性值提升专长或其他你满足条件的专长。如战士特性表所示，你还会在第6、第8、第12、第14、第16级时再次获得本特性。
- profession: fighter
  level: 5
  name: 战术转进
  text: 每当你使用附赠动作进行回气时，你可以移动至多相当于你速度一半的距离，且不会引发借机攻击。
- profession: fighter
  level: 5
  name: 额外攻击
  text: 当你在自己的回合执行攻击动作时，你可以发动两次攻击而非一次。
  extra_attack: 2
- profession: fighter
  level: 6
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: fighter
  level: 7
  name: 子职特性
  text: 你获得一个战士子职特性。
- profession: fighter
  level: 8
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: fighter
  level: 9
  name: 不屈
  text: 当你在一次豁免检定中失败时，你可以重投并获得等同你战士等级的加值。你必须使用新的掷骰结果，你使用此特性后，你必须在完成一次长休后才能再次使用。 第 13 级起，你可以在两次长休之间使用此特性两次；第 17 级起，你可以在两次长休之间使用此特性三次。
- profession: fighter
  level: 9
  name: 战术主宰
  text: 每当你用武器发动攻击，且你可以使用此武器的精通词条时，你可以将此次攻击的精通词条改为推离，削弱或缓速中的一种。
- profession: fighter
  level: 10
  name: 子职特性
  text: 你获得一个战士子职特性。
- profession: fighter
  level: 11
  name: 额外攻击（二）
  text: 你在自己回合内执行攻击动作时，可以发动三次攻击而非一次。
  extra_attack: 3
- profession: fighter
  level: 12
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: fighter
  level: 13
  name: 不屈
  text: 当你在一次豁免检定中失败时，你可以重投并获得等同你战士等级的加值。你必须使用新的掷骰结果，你使用此特性后，你必须在完成一次长休后才能再次使用。 第 13 级起，你可以在两次长休之间使用此特性两次；第 17 级起，你可以在两次长休之间使用此特性三次。
- profession: fighter
  level: 13
  name: 究明攻击
  text: 你已深晓对手的一举一动，并且从每次攻击中吸取经验教训。如果你对一个生物进行攻击检定但失手，那么直到你的下个回合结束前，你对其的下次攻击检定具有优势。
- profession: fighter
  level: 14
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: fighter
  level: 15
  name: 子职特性
  text: 你获得一个战士子职特性。
- profession: fighter
  level: 16
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: fighter
  level: 17
  name: 不屈
  text: 当你在一次豁免检定中失败时，你可以重投并获得等同你战士等级的加值。你必须使用新的掷骰结果，你使用此特性后，你必须在完成一次长休后才能再次使用。 第 13 级起，你可以在两次长休之间使用此特性两次；第 17 级起，你可以在两次长休之间使用此特性三次。
- profession: fighter
  level: 17
  name: 动作如潮
  text: 你可以在短期内让自己突破身为凡骨的极限。在你的回合中，你可以执行一个额外的动作，但不能是魔法动作。 你使用此特性后，你必须在完成一次短或长休后才能再次使用。第 17 级起，你可以在每次休息之间使用此特性两次，但每回合只能使用一次。
  action_surge: 2
- profession: fighter
  level: 18
  name: 子职特性
  text: 你获得一个战士子职特性。
- profession: fighter
  level: 19
  name: 传奇恩惠
  text: 你获得一项传奇恩惠专长或其他一项你选择的适用的专长。推荐选择英勇战斗之恩惠。
- profession: fighter
  level: 20
  name: 额外攻击（三）
  text: 你在自己回合内执行攻击动作时，可以发动四次攻击而非一次。
  extra_attack: 4
- profession: monk
  level: 1
  name: 敏捷攻击
  text: 你使用徒手打击或武僧武器进行攻击时，可以用敏捷代替力量进行攻击检定和伤害掷骰。此外，当你使用徒手打击的擒抱或推撞选项时，你也可以使用你的敏捷代替力量决定豁免DC。
- profession: monk
  level: 1
  name: 无甲防御
  text: 若你未着装任何护甲且未持用盾牌，你的基础护甲等级等于 10 + 你的敏捷调整值 + 你的感知调整值。
- profession: monk
  level: 1
  name: 武艺
  text: 你的武艺修行让你将徒手打击与武僧武器的使用方式烂熟于心。武僧武器包括： 简易近战武器 具有轻型属性的军用近战武器 只要你未着装任何护甲也没持用盾牌，且徒手或只持用武僧武器，则你获得下列增益：
- profession: monk
  level: 1
  name: 武艺骰
  text: 可以选择用1d6骰代替徒手打击或武僧武器的伤害。该骰子将随武僧职业等级的提升而增大，具体数据见武僧特性表中的武艺骰一列。
- profession: monk
  level: 1
  name: 附赠徒手打击
  text: 你可以用一个附赠动作进行一次徒手打击。
- profession: monk
  level: 2
  name: 坚强防御
  text: 你能以一个附赠动作执行撤离动作。此外，你可以消耗 1 点功力，以一个附赠动作同时执行回避与撤离动作。
- profession: monk
  level: 2
  name: 无甲移动
  text: 若你未着装任何护甲且未持用盾牌，你的速度提升 10 尺。该加值将随着武僧职业等级的提升而增加，具体数值见武僧特性表。
- profession: monk
  level: 2
  name: 武僧武功
  text: 通过运转玄功和习练武艺，你便得以掌握自身非凡的内在能量。功力代表着你所能使用的这份能量。你的武僧等级决定了你拥有多少点功力，具体数据见武僧特性表中的功力一列。 你可以消耗功力来增强或启动特定的武僧特性。你一开始掌握三种特性：疾风连击，坚强防御，疾步如风。细节见下。 每当你消耗 1 点功力时，直到你完成一次短或者长休前其将暂时不可以再被使用。在完成休息时，你将重获所有已消耗的功力。 你的某些特性会要求你的目标进行豁免以对抗该特性的效果，这些特性的豁免DC为 8 + 你的感知调…
- profession: monk
  level: 2
  name: 疾步如风
  text: 你能以一个附赠动作执行疾走动作。此外，你可以消耗 1 点功力，以一个附赠动作同时执行撤离与疾走动作，同时使你该回合内的跳跃距离翻倍。
- profession: monk
  level: 2
  name: 疾风连击
  text: 你可以消耗 1 点功力，以一个附赠动作发动两次徒手打击。
- profession: monk
  level: 2
  name: 运转周天
  text: 当你投掷先攻时，你可以重获所有已消耗的功力。若你如此做，掷你的武艺骰，并且恢复其结果 + 你的武僧等级的生命值。 此特性一经使用，直至完成长休你都无法再次使用。
- profession: monk
  level: 3
  name: 拨挡攻击
  text: 当你被一次伤害中包含钝击，穿刺或挥砍伤害的攻击检定命中时，你可以执行反应减少此次攻击对你造成伤害的总值，减值等于1d10 + 你的敏捷调整值 + 你的武僧等级。 若被拨挡攻击的伤害减少至 0，则你可以消耗 1 点功力将此次攻击的部分伤害重新定向。如果是近战攻击，选择你周围 5 尺内的一个你可见的生物；如果是远程攻击，选择 60 尺内一个不位于全身掩护后的你可见的生物。该生物必须成功通过一次敏捷豁免，否则受到相当于你 2 个武艺骰 + 你的敏捷调整值的伤害。其伤害类型与原先攻…
- profession: monk
  level: 3
  name: 武僧子职
  text: 你选择获得一项武僧子职。子职是一种特化，在特定的武僧等级给予你对应的独特能力。以后你将获得你所选的子职的所有能力——只要其所需等级不超过你的武僧等级。
- profession: monk
  level: 4
  name: 属性值提升
  text: 你获得属性值提升专长或其他你满足条件的专长。如武僧特性表所示，你在第8，第12，第16级时会再次获得本特性。
- profession: monk
  level: 4
  name: 轻身坠
  text: 当你要承受坠落伤害时，你可以使用反应将伤害减少等同于五倍武僧职业等级的数值。
- profession: monk
  level: 5
  name: 震慑拳
  text: 每回合一次，当你使用徒手打击或武僧武器命中一个生物后，你可以消耗 1 点功力尝试发动震慑拳。目标必须进行一次体质豁免，豁免失败则陷入震慑状态，直至你的下个回合开始。若豁免成功，则目标的速度减半，直至你的下个回合开始，并且下一次对该目标进行的攻击检定具有优势。
- profession: monk
  level: 5
  name: 额外攻击
  text: 当你在自己的回合执行攻击动作时，你可以发动两次攻击而非一次。
  extra_attack: 2
- profession: monk
  level: 6
  name: 子职特性
  text: 你获得一个武僧子职特性。
- profession: monk
  level: 6
  name: 真力注拳
  text: 当你使用徒手打击造成伤害时，你可以选择造成力场伤害或是其原本的伤害类型。
- profession: monk
  level: 7
  name: 反射闪避
  text: 当你受到一个允许你进行敏捷豁免来只承受一半伤害的效应影响时，你在豁免成功时不受伤害，豁免失败时只承受一半伤害。 如果你处于失能状态，则你无法从此特性中受益。
- profession: monk
  level: 8
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: monk
  level: 9
  name: 飞檐走壁
  text: 若你未着装任何护甲也没持用盾牌，你便可以在你的回合中在垂直表面和液体表面上移动而不会坠落。
- profession: monk
  level: 10
  name: 升阶专注
  text: 你的疾风连击，坚强防御和飞檐走壁获得以下增益： 疾风连击： 你消耗 1 点功力施展疾风连击时可以进行三次徒手打击而非两次。 坚强防御： 当你消耗功力使用坚强防御时，你获得相当于你两个武艺骰的临时生命值。 疾步如风： 当你消耗功力使用疾步如风时，你可以选择你周围 5 尺内一个体型为大型或更小的自愿生物。直至你的回合结束，该生物将一直随你移动。该生物如此移动不会引发借机攻击。
- profession: monk
  level: 10
  name: 返本还元
  text: 凭借纯粹的意志，你能够在每次自己的回合结束时移除你身上的下列状态之一：魅惑、恐慌或中毒。 此外，不吃不喝不再会使你提升力竭等级。
- profession: monk
  level: 11
  name: 子职特性
  text: 你获得一个武僧子职特性。
- profession: monk
  level: 12
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: monk
  level: 13
  name: 拨挡能量
  text: 你现在可以使用你的拨挡攻击特性对抗造成任何伤害类型的攻击，而不仅限于钝击，穿刺或挥砍。
- profession: monk
  level: 14
  name: 圆融自在
  text: 你的身心修行已然有所成就，你获得所有豁免的熟练。 此外，当你豁免失败时，你可以消耗 1 点功力重掷豁免，但必须使用重掷的结果。
- profession: monk
  level: 15
  name: 明镜止水
  text: 若你在投掷先攻，且选择不使用运转周天时，你的功力为 3 点或更少，则你的功力恢复至 4 点。
- profession: monk
  level: 16
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: monk
  level: 17
  name: 子职特性
  text: 你获得一个武僧子职特性。
- profession: monk
  level: 18
  name: 无懈可击
  text: 在你的回合开始时，你可以消耗 3 点功力提高自己抵挡伤害的能力，持续 1 分钟或直至你陷入失能状态。持续时间内，你对力场伤害之外的所有伤害都具有抗性。
- profession: monk
  level: 19
  name: 传奇恩惠
  text: 你获得了一个传奇恩惠专长，或者你选择另一个符合条件的专长。推荐选择无敌攻势之恩惠。
- profession: monk
  level: 20
  name: 天人合一
  text: 你行满功成，身心性命皆已突破超然境界。你的敏捷和感知各提升 4。现在你这些属性的上限为 25。
- profession: paladin
  level: 1
  name: 圣疗
  text: 你的触碰溢满祝福，可以医治伤口。你获得一个治疗能量池，其内的治疗能量在每次完成长休后自动补满。治疗能量池储备的可恢复生命值总值等于你的圣武士职业等级 ×5。 你能够以一个附赠动作触碰一个生物（可以是你自己），并抽取治疗能量池中的能量恢复该生物的生命值，其恢复量最多等于你治疗能量池中剩余的治疗量。 此外，你也可以使用 5 点生命值治疗量来移除目标身上的中毒状态，而非恢复生命值。
- profession: paladin
  level: 1
  name: 施法
  text: 你已经学会了如何通过祈祷与冥想来施展法术。施法规则见第七章。下文将详述如何将这些规则应用于圣武士法术，圣武士法术详见本章后文职业描述中的圣武士法术列表。 法术位： 圣武士特性表显示了你可用于施展一环及以上法术的法术位数量。当你完成长休时，你重获所有已消耗的法术位。 1环及以上的准备法术： 你准备可供你以此特性施展的一环及更高环阶的法术列表。最初，选择两道1环圣武士法术，推荐选择英雄气概和炽焰斩。 已准备法术数量会随你圣武士等级的提升而增加，如圣武士特性表中的准备法术一列所示…
- profession: paladin
  level: 1
  name: 武器精通
  text: 你对武器的训练使你能够运用两种自选的你具有熟练的武器的精通词条，例如长剑和标枪。 每当你完成一次长休时，你可以改变你所选择的精通词条。比如你可以改为长戟和链枷。
- profession: paladin
  level: 2
  name: 圣武斩
  text: 你始终准备着法术至圣斩 。此外，你可以不消耗法术位地施展该法术一次，而后你必须完成一次长休才能再次这么做。
- profession: paladin
  level: 2
  name: 战斗风格
  text: 你获得一项战斗风格专长专长。你也可以选择下列选项作为替代。
- profession: paladin
  level: 3
  name: 圣武士子职
  text: 你选择获得一项圣武士子职子职是一种特化，在特定的圣武士等级给予你对应的独特能力。此后你将获得你所选的子职所有能力——只要其所需等级不超过你的圣武士等级。 圣武士试图使自己符合最高的道德标准。但即使是最具美德的圣武士也会犯错。有时正确的道路太过高不可攀；有时你被迫在两害之间取其轻；有时狂热的激情让圣武士的作为越过了合理的界限。 背弃誓言的圣武士往往会寻求宽恕。圣武士可能必须花上一整晚守夜祈祷，以表现他的忏悔；或者斋戒禁食以表示自我否定，或者做一些类似的举动。在认罪和宽恕的仪式…
- profession: paladin
  level: 3
  name: 引导神力
  text: 你能从外层位面引导神圣能量，并用其引动魔法效应。你起始时具有一种效应选项：神圣感知，其效果如下所示。其他圣武士特性会给予更多引导神力选项。每当你使用本职业的引导神力时，你选择要创造哪种来自本职业的效应。 你可以使用本职业的引导神力两次，你在完成短休时重获一次已消耗的使用次数，并在完成长休时重获所有已消耗的使用次数。你在圣武士等级到达 11 级时获得额外的使用次数。 如果某个引导神力效应需要目标进行豁免，则其豁免DC等于本职业的施法特性中的法术豁免DC。
- profession: paladin
  level: 3
  name: 神圣感知
  text: 以一个附赠动作，你可以扩展你的意识侦测天族，邪魔以及亡灵生物。持续 10 分钟内或直至你陷入失能状态，你能感知到自身周围 60 尺内这些生物的位置，以及它们的生物类型。你也可以侦测任何受到圣居一类的法术祝福或亵渎的地点或物件。
- profession: paladin
  level: 4
  name: 属性值提升
  text: 你获得属性值提升专长或其他你满足条件的专长。如圣武士特性表所示，你还会在第8，第12，第16级时再次获得本特性。
- profession: paladin
  level: 5
  name: 信实坐骑
  text: 你能唤来异界坐骑的协助。你始终准备着法术寻获坐骑。 此外，你可以不消耗法术位地施展该法术一次，而后你必须完成一次长休才能再次这么做。
- profession: paladin
  level: 5
  name: 额外攻击
  text: 当你在自己的回合执行攻击动作时，你可以发动两次攻击而非一次。
  extra_attack: 2
- profession: paladin
  level: 6
  name: 守护灵光
  text: 你散发出无形的保护性的灵光 ，覆盖源自你的 10 尺光环区域。在你陷入失能状态期间，此灵光失效。 你与灵光内盟友的豁免结果获得相当于你魅力调整值的加值（最少为 +1）。 如果同时存在有其他圣武士，一个生物同时也只能从一个守护灵光中获得增益。这个生物自己选择享受谁的灵光。
- profession: paladin
  level: 7
  name: 子职特性
  text: 你获得一个来自圣武士子职的特性。
- profession: paladin
  level: 8
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: paladin
  level: 9
  name: 弃绝众敌
  text: 以一个魔法动作，你消耗一次引导神力使用次数让敌人被恐惧吞没。你高举圣徽或武器，选择位于你 60 尺内，数量至多等于你魅力调整值（最少为 1）的可见生物作为目标。每个目标必须成功通过一次感知豁免，否则陷入恐慌状态，持续 1 分钟或直到其受到任何伤害为止。因此陷入恐慌的生物每回合只能执行下列选项之一：移动、执行一个动作或执行一个附赠动作。
- profession: paladin
  level: 10
  name: 勇气灵光
  text: 你与守护灵光内盟友获得对恐慌状态的免疫。陷入恐慌的盟友进入灵光时，该状态在灵光内会暂时无效。
- profession: paladin
  level: 11
  name: 光耀打击
  text: 神圣之力充盈你身，连带你的武器也承载着超自然力量。当你使用近战武器或徒手打击进行攻击检定并命中目标时，目标额外受到1d8点光耀伤害。
- profession: paladin
  level: 12
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: paladin
  level: 14
  name: 复原之触
  text: 当你对一个生物使用圣疗时，你可以终止该生物身上以下一种或更多种类的状态：目盲、魅惑、耳聋、恐慌、麻痹或震慑。你每终止一个效应，都需要花费圣疗的 5 点生命值治疗能量；这些治疗能量不会恢复该生物的生命值。
- profession: paladin
  level: 15
  name: 子职特性
  text: 你获得一个来自圣武士子职的特性。
- profession: paladin
  level: 16
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: paladin
  level: 18
  name: 灵光增效
  text: 你的守护灵光的光环区域现在提升至 30 尺。
- profession: paladin
  level: 19
  name: 传奇恩惠
  text: 你获得一项传奇恩惠专长专长或其他一项你选择的适用的专长。推荐选择真实视觉之恩惠 。
- profession: paladin
  level: 20
  name: 子职特性
  text: 你获得一个来自圣武士子职的特性。
- profession: ranger
  level: 1
  name: 宿敌
  text: 你始终准备着法术猎人印记。你可以无需法术位地施展此法术共计两次，并在完成一次长休后恢复此能力的所有使用次数。 你能无需法术位施展该法术的次数会在你获得特定游侠等级时提升，见游侠特性表中的宿敌一栏。
- profession: ranger
  level: 1
  name: 施法
  text: 你学会运用自然世界的魔法本源进行施法。施法规则见第七章。下文将详述如何将这些规则应用于游侠法术，游侠法术详见本章后文职业描述中的游侠法术列表。 法术位： 游侠特性表显示了你可用于施展一环及以上法术的法术位数量。当你完成长休时，你重获所有已消耗的法术位。 1环及以上的准备法术： 你准备可供你以此特性施展的一环及更高环阶的法术列表。最初，选择两道1环游侠法术。推荐选择疗伤术和诱捕打击。 已准备法术数量会随你游侠等级的提升而增加，如游侠特性表中的准备法术一列所示。每当这一列的数字…
- profession: ranger
  level: 1
  name: 武器精通
  text: 你对武器的训练使你能够自选并使用2种已熟练武器的精通词条，例如长弓和短剑。 当你完成一次长休时，你可以改变你所选择的精通词条。比如你可以将其改为弯刀和长剑。
- profession: ranger
  level: 2
  name: 战斗风格
  text: 你获得一项战斗风格专长专长。你也可以选择下列选项作为替代。
- profession: ranger
  level: 2
  name: 熟练探险家
  text: 得益于你的旅行经历，你获得以下增益。 专精： 选择一项你熟练但不具备专精的技能。你在那个技能上获得专精。 语言： 你习得第二章中的语言表中的两种语言
- profession: ranger
  level: 3
  name: 游侠子职
  text: 你选择获得一项游侠子职子职是一种特化，在特定的游侠等级给予你对应的独特能力。此后你将获得你所选的子职所有能力——只要其所需等级不超过你的游侠等级。
- profession: ranger
  level: 4
  name: 属性值提升
  text: 你获得属性值提升专长或其他你满足条件的专长。你还会在你的游侠等级达到第8、第12和第16级时再次获得本特性。
- profession: ranger
  level: 5
  name: 额外攻击
  text: 当你在自己的回合执行攻击动作时，你可以发动两次攻击而非一次。
  extra_attack: 2
- profession: ranger
  level: 6
  name: 越野
  text: 只要你未着装重甲，你的速度提升 10 尺。你也获得攀爬速度和游泳速度（等于你的速度）。
- profession: ranger
  level: 7
  name: 子职特性
  text: 你获得一个来自你游侠子职的特性。
- profession: ranger
  level: 8
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: ranger
  level: 9
  name: 专精
  text: 选择两项你熟练但不具备专精的技能，你获得这些技能的专精。
- profession: ranger
  level: 10
  name: 不知疲倦
  text: 原初的力量现在会帮你重整旗鼓，重新踏上旅途。你因它获得以下增益： 临时生命值： 以一个魔法动作，你能够给予自己1d8 + 你的感知调整值（最低为 1） 的临时生命值。你能够使用此特性的次数等于你的感知调整值次（最少 1 次），当你完成一次长休时，你重获全部已消耗的使用次数。 减少力竭： 当你完成一次短休时，你的力竭等级减少 1 级（若有）。
- profession: ranger
  level: 11
  name: 子职特性
  text: 你获得一个来自你游侠子职的特性。
- profession: ranger
  level: 12
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: ranger
  level: 13
  name: 永恒追猎
  text: 受到伤害不会打断你对猎人印记的专注。
- profession: ranger
  level: 14
  name: 自然面纱
  text: 你祈唤自然精魂，魔法性地将身形遮蔽隐蔽。以一个附赠动作，你可以让自己进入 隐形状态，持续到你的下一回合结束。 你可以使用该特性的次数等同于你的感知调整值（最少 1 次）。你在完成一次长休时重获所有已消耗的使用次数。
- profession: ranger
  level: 15
  name: 子职特性
  text: 你获得一个来自你游侠子职的特性。
- profession: ranger
  level: 16
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: ranger
  level: 17
  name: 致命猎杀
  text: 你在对你的猎人印记当前指定的目标的攻击检定中具有优势。
- profession: ranger
  level: 18
  name: 野性感官
  text: 你与自然的链接给予了你30尺盲视。
- profession: ranger
  level: 19
  name: 传奇恩惠
  text: 你获得一项传奇恩惠专长或其他一项你选择的适用的专长。推荐选择次元旅行之恩惠。
- profession: ranger
  level: 20
  name: 屠灭众敌
  text: 你的猎人印记的伤害骰为d10而非d6。
- profession: rogue
  level: 1
  name: 专精
  text: 你获得两项由你选择的你已熟练的技能的专精。如果你有这两项技能的熟练的话，推荐选择巧手和隐匿。 当你的游荡者等级为6级时，你额外再获得两项由你选择的你已熟练的技能的专精。
- profession: rogue
  level: 1
  name: 偷袭
  text: 你知道如何利用敌人的分心并发动致命的精巧打击。每个回合一次，当你的攻击检定命中了一个生物时，你可以造成1d6的额外伤害。这次攻击必须使用一把灵巧或远程武器并具有优势。额外伤害的伤害类型与该武器的伤害类型一致。 除此之外，你不需要优势也造成额外伤害的条件是：你的目标周围5尺内有你的盟友，并且该盟友没有陷入失能状态，你的攻击检定也没有劣势。 你的额外伤害会随着你的游荡者等级提高而增长，具体如游荡者特性表中的偷袭一列所示。
- profession: rogue
  level: 1
  name: 武器精通
  text: 你对武器的训练使你能够运用两种自选的你具有熟练的武器的精通词条，例如匕首和短弓。 每当你完成一次长休时，你可以改变你所选择的精通词条。比如你可以改为弯刀和短剑。
- profession: rogue
  level: 1
  name: 盗贼黑话
  text: 你在施展自己游荡者才华的社区里学习了多样的语言。你习得盗贼黑话和第二章的语言表中的一项语言。
- profession: rogue
  level: 2
  name: 灵巧动作
  text: 你精妙的思维与身手使你的行动无比迅速。在你的回合内，你能够以附赠动作执行疾走，撤离或躲藏动作之一。
- profession: rogue
  level: 3
  name: 游荡者子职
  text: 你选择获得一项游荡者子职，子职是一种特化，在特定的游荡者等级给予你对应的独特能力。此后你将获得你所选的子职所有能力——只要其所需等级不超过你的游荡者等级。
- profession: rogue
  level: 3
  name: 稳定瞄准
  text: 以一个附赠动作，你在当前回合为你的下一次攻击提供优势。你只能在你本回合还没有移动的时候使用这个附赠动作，而且在你使用这个附赠动作后，你的速度在当前回合里归0。
- profession: rogue
  level: 4
  name: 属性值提升
  text: 你获得属性值提升专长或其他你满足条件的专长。如游荡者特性表所示，你还会在第8，第10，第12，第16级时再次获得本特性。
- profession: rogue
  level: 5
  name: 投毒（花费：1d6）
  text: 你为你的打击附上毒素，强迫目标进行一次体质豁免。若失败，目标将陷入一分钟的中毒状态。目标可以在每次自己的回合结束时重新进行豁免，若成功，中毒状态终止。 为了使用这个效果，你必须携带一套毒药工具在身上。
- profession: rogue
  level: 5
  name: 摔绊（花费：1d6）
  text: 若目标是大型及以下，它必须成功通过一次敏捷豁免，否则陷入倒地状态。
- profession: rogue
  level: 5
  name: 撤步（花费：1d6）
  text: 攻击后你立刻移动至多等于你速度的一半的距离，并且不会引发借机攻击。
- profession: rogue
  level: 5
  name: 直觉闪避
  text: 当一个你能看见的攻击者用一次攻击检定命中你时，你可以用你的反应将这次攻击对你造成的伤害减半（向下取整）。
- profession: rogue
  level: 5
  name: 诡诈打击
  text: 你学会了如何使你的偷袭更加狡诈的方法。当你造成偷袭伤害时，你可以选择下列一种诡诈打击的效果加入到本次偷袭中。每种效果都需要花费一定数量的偷袭伤害骰才能生效。你必须在投掷伤害前扣除所花费的偷袭的伤害骰，而效果会在这次攻击的伤害产生后立即发生。例如，如果你在本次偷袭中选择了淬毒效果，那么你在投掷偷袭伤害骰前需要先减少一颗1d6。 如果一种诡诈打击的效果要求目标进行豁免，其DC为8+你的熟练加值+你的敏捷调整值。
- profession: rogue
  level: 6
  name: 专精
  text: 你获得两项由你选择的你已熟练的技能的专精。
- profession: rogue
  level: 7
  name: 反射闪避
  text: 你可以灵敏地躲避特定的危险。当你受到一个允许你进行敏捷豁免来只承受一半伤害的效应影响时，你在豁免成功时不受伤害，豁免失败时只承受一半伤害。你无法在失能状态下使用此特性。
- profession: rogue
  level: 7
  name: 可靠才能
  text: 每当你进行属性检定，并且可以运用你的某项技能熟练或工具熟练时，你可以将d20投出的9及以下的结果视为10。
- profession: rogue
  level: 8
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: rogue
  level: 9
  name: 子职特性
  text: 你获得一个游荡者子职特性。
- profession: rogue
  level: 10
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: rogue
  level: 11
  name: 进阶诡诈打击
  text: 你在造成偷袭伤害时可以一次性选用两种诡诈打击效果，每种效果都需要独立扣除对应的偷袭伤害骰。
- profession: rogue
  level: 12
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: rogue
  level: 13
  name: 子职特性
  text: 你获得一个游荡者子职特性。
- profession: rogue
  level: 14
  name: 凶狡打击
  text: 你习得了新的偷袭方法，使你的偷袭变得更为凶狠卑劣。下列效果现在加入你的诡诈打击选项。
- profession: rogue
  level: 14
  name: 击昏（花费：6d6）
  text: 目标必须成功通过一次体质豁免，否则将陷入昏迷状态，持续一分钟或受到任何伤害。昏迷的目标每在自己的回合结束时都可以重新进行豁免，若通过，则状态结束。
- profession: rogue
  level: 14
  name: 恍惚（花费：2d6）
  text: 目标必须成功通过一次体质豁免，否则该目标的下一回合只能选择下列行为中的一项：移动、执行一个动作或执行一个附赠动作。
- profession: rogue
  level: 14
  name: 眩目（花费：3d6）
  text: 目标必须成功通过一次敏捷豁免，否则将陷入目盲状态，直到其下个回合结束。
- profession: rogue
  level: 15
  name: 圆滑心智
  text: 你狡猾的头脑很难被人控制。你获得感知豁免与魅力豁免的熟练。
- profession: rogue
  level: 16
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: rogue
  level: 17
  name: 子职特性
  text: 你获得一个游荡者子职特性。
- profession: rogue
  level: 18
  name: 飘忽不定
  text: 你飘忽不定的身形让敌人攻击时无从下手。只要你并未失能，以你为目标的攻击检定无法具有优势。
- profession: rogue
  level: 19
  name: 传奇恩惠
  text: 你获得一项传奇恩惠专长或其他一项你选择的适用的专长。推荐选择暗夜精魂之恩惠。
- profession: rogue
  level: 20
  name: 幸运一击
  text: 你留了一手非凡技巧，让你可以随时把握自己的成功之际。当你在一次D20 检定检定中失败时，你可以将结果改为20。 此特性一经使用，直至完成短或长休你都无法再次使用。
- profession: sorcerer
  level: 1
  name: 先天术法
  text: 你过去经历的某件事在你身上留下了不可磨灭的印记，为你注入了难以控制的涌动魔力。以一个附赠动作，你可以将魔力释放而出，持续1分钟。在这1分钟期间，你获得以下增益： 你的术士法术豁免DC +1。 你在你施展的术士法术的攻击检定上具有优势。 你可以使用此特性两次，你在完成一次长休时重获所有已消耗的使用次数。
- profession: sorcerer
  level: 1
  name: 施法
  text: 你从你的天生魔法汲取魔力用于施展法术。参见第七章有关施法的规则。下述信息将详述如何将这些规则应用于术士法术，术士法术详见本章后文职业描述中的术士法术列表。 戏法： 你知晓四道你选择的术士戏法。推荐选择光亮术、魔法伎俩、电爪和术法爆发。每当你获得一个术士等级时，你都能将通过此特性知晓的其中一个戏法替换为另一个你所选择的术士戏法。 当你的术士等级达到4级和10级时，你都能另选一道术士戏法并习得，如术士特性表中戏法一列所示。 法术位： 术士特性表显示了你可用于施展一环及以上法术的…
- profession: sorcerer
  level: 2
  name: 超魔法
  text: 由于你的魔法直接从你体内流向外界，你可以修改你的法术来适应自己的需要。你从超魔法选项中选择并获得2个你所选的超魔法选项。你使用你所选的超魔法来临时改变你施展的法术。要使用一个超魔法选项，你必须消耗等同于其描述中需求的术法点。 当你施展一道法术时，你只能在其上应用一次超魔法选项，除非超魔法选项中另有说明。 每当你获得一级术士等级时，你可以将一个超魔法选项更改为另一个超魔法选项。当你到达10级和17级术士等级时，你可以分别再获得2个超魔法选项。
- profession: sorcerer
  level: 2
  name: 超魔法选项
  text: 以下选项可用于你的超魔法特性。这些选项按字母顺序排列。
- profession: sorcerer
  level: 2
  name: 魔力泉涌
  text: 你汲取体内的魔力之源，从中涌现的魔力体现为你的可用术法点。你可以使用术法点创造各种魔法效应。 你拥有2点术法点，你在到达更高等级时获得更多术法点，如同术士特性表中术法点一栏所示。你无法拥有比表格中对应数量更多的术法点。你在完成一次长休后重获所有已消耗的术法点。 你可以消耗你的术法点来使用以下特性，例如超魔法。 法术位转化为术法点： 你可以消耗一个法术位来获得等同于其环位的术法点（无需动作）。 生成法术位： 以一个附赠动作，你可以将未消耗的术法点转化为一个法术位。创造法术位表…
- profession: sorcerer
  level: 3
  name: 术士子职
  text: 你选择获得一项术士子职。子职是一种特化，在特定的术士等级给予你对应的独特能力。此后你将获得你所选的子职所有能力——只要其所需等级不超过你的术士等级。
- profession: sorcerer
  level: 4
  name: 属性值提升
  text: 你获得属性值提升专长或其他你满足条件的专长。如术士特性表所示。你在第8，第12，第16级时会再次获得本特性。
- profession: sorcerer
  level: 5
  name: 术法复苏
  text: 当你完成一次短休时，你可以恢复不大于你术士等级一半（向下取整）的已消耗术法点。此特性一经使用，直到你完成一次长休为止不能再次使用。
- profession: sorcerer
  level: 6
  name: 子职特性
  text: 你获得一个来自术士子职的特性。
- profession: sorcerer
  level: 7
  name: 术法化身
  text: 如果你的先天术法特性的使用次数耗尽，则你仍可以消耗 2 点术法点来用附赠动作继续激活该特性。 此外，在你的先天术法特性处于激活状态期间，你可以在你施展的每道法术上应用最多两次超魔法选项。
- profession: sorcerer
  level: 8
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: sorcerer
  level: 10
  name: 超魔法
  text: 由于你的魔法直接从你体内流向外界，你可以修改你的法术来适应自己的需要。你从超魔法选项中选择并获得2个你所选的超魔法选项。 当你施展一道法术时，你只能在其上应用一次超魔法选项，除非超魔法选项中另有说明。 每当你获得一级术士等级时，你可以将一个超魔法选项更改为另一个超魔法选项。
- profession: sorcerer
  level: 12
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: sorcerer
  level: 14
  name: 子职特性
  text: 你获得一个来自术士子职的特性。
- profession: sorcerer
  level: 16
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: sorcerer
  level: 17
  name: 超魔法
  text: 由于你的魔法直接从你体内流向外界，你可以修改你的法术来适应自己的需要。你从超魔法选项中选择并获得2个你所选的超魔法选项。 当你施展一道法术时，你只能在其上应用一次超魔法选项，除非超魔法选项中另有说明。 每当你获得一级术士等级时，你可以将一个超魔法选项更改为另一个超魔法选项。
- profession: sorcerer
  level: 18
  name: 子职特性
  text: 你获得一个来自术士子职的特性。
- profession: sorcerer
  level: 19
  name: 传奇恩惠
  text: 你获得一项传奇恩惠专长或其他一项你选择的适用的专长。推荐选择次元旅行之恩惠。
- profession: sorcerer
  level: 20
  name: 奥术登神
  text: 在你的先天术法特性处于激活状态期间，每个你的回合一次，你可以无需消耗术法点地使用一次超魔法选项。
- profession: warlock
  level: 1
  name: 契约魔法
  text: 依靠玄秘的仪式，你与一位神秘存在缔结契约以获得魔法力量。这位存在隐于影中，仅闻其声，身份不明——但其恩泽是切实的。施法规则见第七章。下文将详述如何将这些规则应用于魔契师法术，魔契师法术详见本章后文职业描述中的魔契师法术列表。 戏法： 你知晓两道你选择的魔契师戏法。推荐选择魔能爆和魔法伎俩。每当你获得一个魔契师等级，你都能从此特性的戏法中选择其一替换为另一道你所选择的魔契师戏法。 当你的魔契师等级到达4级和10级时，你都能另选一道魔契师戏法并习得，如魔契师特性表中戏法一列所示…
- profession: warlock
  level: 1
  name: 魔能祈唤
  text: 你在神秘学识的研习过程中发掘出了使用魔能祈唤的方式，这些禁忌的知识残章让你获得了持久的魔法能力。你获得一个自选的魔能祈唤，如书之魔契（详见后文"魔能祈唤选项"）。 先决： 如果一个魔能祈唤具有先决，那你必须满足它才能选取。例如，若一个魔能祈唤需要你魔契师等级5+，则只有你魔契师等级达到5级才可以选取该祈唤。 替换与获取魔能祈唤： 每当你获得一级魔契师等级时，你都可以用新的祈唤替换一个已有的祈唤，但你必须满足其先决条件。如果一个祈唤是某个其他祈唤的先决条件，那你无法替换它。 …
- profession: warlock
  level: 1
  name: 魔能祈唤选项
  text: 魔能祈唤选项按字母顺序排列。
- profession: warlock
  level: 2
  name: 秘法回流
  text: 你可以举行一道耗时1分钟的秘传仪式，并在仪式结束后重获一半已消耗的魔契师法术位（向上取整）。此特性一经使用，直至完成长休你都无法再次使用。
- profession: warlock
  level: 3
  name: 魔契师子职
  text: 你选择获得一项魔契师子职子职是一种特化，在特定的魔契师等级给予你对应的独特能力。此后你将获得你所选的子职所有能力——只要其所需等级不超过你的魔契师等级。
- profession: warlock
  level: 4
  name: 属性值提升
  text: 你获得属性值提升专长或其他你满足条件的专长。如魔契师特性表所示，你还会在第8，第12，第16级时再次获得本特性。
- profession: warlock
  level: 6
  name: 子职特性
  text: 你获得一个来自魔契师子职的特性。
- profession: warlock
  level: 8
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: warlock
  level: 9
  name: 联络宗主
  text: 在过去，你通常需要通过各种渠道才能联络宗主。但现在，你可以直接联络宗主本身。你始终准备着法术异界探知。你可以无需消耗法术位地以此特性来联络宗主，并自动通过该法术的豁免。 一旦你以此法施展了该法术，直至完成长休你都无法再次以此法施展该法术。
- profession: warlock
  level: 10
  name: 子职特性
  text: 你获得一个来自魔契师子职的特性。
- profession: warlock
  level: 11
  name: 玄奥秘法
  text: 你的宗主赋予你一种称为秘法的魔法奥秘。你可以选择一道六环的魔契师法术作为你的玄奥秘法。 你可以无需消耗法术位地施展该秘法，但在你完成一次长休前无法再次以这种方式施展秘法。 如魔契师特性表所示，当你获得更高的魔契师等级后，你将可以选择更多的魔契师法术来以这种方式施展：第13级时可选一道七环法术，15级时可选一道八环法术，17级时可选一道九环法术。当你完成长休时，重获所有已消耗的秘法使用次数。 每当你获得魔契师等级时，你都可以将一道秘法的法术替换为另一道同环阶的魔契师法术。
- profession: warlock
  level: 12
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: warlock
  level: 13
  name: 玄奥秘法
  text: 你获得一个自选的7环魔契师法术。
- profession: warlock
  level: 14
  name: 子职特性
  text: 你获得一个来自魔契师子职的特性。
- profession: warlock
  level: 15
  name: 玄奥秘法
  text: 你获得一个自选的8环魔契师法术。
- profession: warlock
  level: 16
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: warlock
  level: 17
  name: 玄奥秘法
  text: 你获得一个自选的 9 环魔契师法术。
- profession: warlock
  level: 19
  name: 传奇恩惠
  text: 你获得一个传奇恩惠专长或另一个你所选择符合条件的专长。推荐选择扭曲命运之恩惠。
- profession: warlock
  level: 20
  name: 魔能掌控
  text: 当你使用秘法回流特性时，你改为重获所有已消耗的魔契师法术位。
- profession: wizard
  level: 1
  name: 仪式学家
  text: 你能以仪式施展你法术书中任何带有仪式标签的法术。你不需要准备这些法术，但你以此法施展法术时必须阅读这本书。
- profession: wizard
  level: 1
  name: 奥术回想
  text: 你学会了通过研读法术书来恢复魔法能量的办法。你完成一次短休后，可以选择恢复已消耗的法术位。所恢复的法术位环阶总和不得大于你法师等级的一半（向上取整），且任何一个法术位的环阶都必须小于六环。例如，作为一名4级法师时，你可恢复环阶总数最多为二的法术位。你可以选择恢复一个二环法术位或两个一环法术位。 该特性一经使用，则直至你完成一次长休之前，都无法再次使用。
- profession: wizard
  level: 1
  name: 施法
  text: 你已经入门了奥术魔法，学会了如何施展法术。施法规则见第七章。下文将详述如何将这些规则应用于法师法术，法师法术详见本章后文职业描述中的法师法术列表表。 戏法： 你知晓三道你选择的法师戏法。推荐选择光亮术、法师之手和冷冻射线。每当你完成一次长休时，你都能从此特性的戏法中选择其一替换为另一道你所选择的法师戏法。 当你的法师等级到达4级和10级时，你都能另选一道法师戏法并习得，如法师特性表中戏法一列所示。 法术书： 你在法师学徒阶段获取的所有成果汇集于一本独特的书：你的法术书。它是…
- profession: wizard
  level: 2
  name: 学者
  text: 在学习法术之余，你还对一门学术领域有过专门的研究。从下列技能中选择一项你具有熟练的技能：奥秘、历史、调查、医药、自然或宗教。你获得所选技能的专精。
- profession: wizard
  level: 3
  name: 法师子职
  text: 你获得一项自选的法师子职。子职是一种特化，在特定的法师等级给予你对应的独特能力。此后你将获得你所选的子职所有能力——只要其所需等级不超过你的法师等级。
- profession: wizard
  level: 4
  name: 属性值提升
  text: 你获得属性值提升专长或其他你满足条件的专长。如法师特性表所示，你还会在第8，第12，第16级时再次获得本特性。
- profession: wizard
  level: 5
  name: 记忆法术
  text: 每当你完成一次短休时，你可以研究你的法术书并且将其中一道你以施法特性准备的一环及以上的法术替换为你法术书中的另一道一环及以上的法术。
- profession: wizard
  level: 6
  name: 子职特性
  text: 你获得一个来自法师子职的特性。
- profession: wizard
  level: 8
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: wizard
  level: 10
  name: 子职特性
  text: 你获得一个来自法师子职的特性。
- profession: wizard
  level: 12
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: wizard
  level: 14
  name: 子职特性
  text: 你获得一个来自法师子职的特性。
- profession: wizard
  level: 16
  name: 属性值提升
  text: 你获得属性值提升专长或其它你满足条件的专长。
- profession: wizard
  level: 18
  name: 法术精通
  text: 你对特定的法术精熟于心，以至于你可以将其随意施展。选择你法术书中的一道施法时间为动作的一环法术和一个二环法术，你总是准备这些法术，且能不消耗法术位地以最低环施展它们。如果你想升环施展这些法术，则你必须像平时一样消耗一个法术位。 每当你完成一次长休时，你可以研究你的法术书并将其中一道法术更换为另一个符合条件的同环阶法术。
- profession: wizard
  level: 19
  name: 传奇恩惠
  text: 你获得一项传奇恩惠专长或其他一项你选择的适用的专长。推荐选择法术法术溯回之恩惠。
- profession: wizard
  level: 20
  name: 招牌法术
  text: 从你的法术书中选择两道三环法术作为你的招牌法术。你总是准备这些法术，且能不消耗法术位地以三环施展每道法术各一次。此特性一经使用，直到完成一次短或长休都不能再次以此法施展这两道法术。如果你想升环施展这些法术，则你必须像平时一样消耗一个法术位。
